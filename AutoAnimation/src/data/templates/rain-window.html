<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain on Window</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }
  canvas#rainCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .blur-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
  }
  .center-text {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #D8E4F0;
  }
  .center-text h1 {
    font-size: 42px; font-weight: 300; letter-spacing: 10px; font-style: italic;
    text-shadow: 0 0 30px rgba(100,140,180,0.3);
    animation: rainFade 5s ease-in-out infinite;
  }
  .center-text .subtitle {
    font-size: 13px; letter-spacing: 5px; opacity: 0.4; margin-top: 10px;
    font-style: italic;
  }
  @keyframes rainFade {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="rainCanvas"></canvas>
<div class="center-text">
  <h1 id="mainTitle">Petrichor</h1>
  <div class="subtitle" id="subTitle">Sound of Rain</div>
</div>

<script>
// ===== EDITABLE VARIABLES =====
const TITLE_TEXT = 'Petrichor';
const SUBTITLE_TEXT = 'Sound of Rain';
const BG_COLOR = '#1a2030';
const DROP_COUNT = 150;
const DRIP_COUNT = 30;
const STREAK_OPACITY = 0.25;
// ==============================

document.getElementById('mainTitle').textContent = TITLE_TEXT;
document.getElementById('subTitle').textContent = SUBTITLE_TEXT;

const canvas = document.getElementById('rainCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Blurred city lights background
function drawBlurredBG() {
  // Soft out-of-focus bokeh circles
  const bokehColors = ['rgba(255,200,100,0.04)', 'rgba(100,180,255,0.03)', 'rgba(255,100,100,0.03)', 'rgba(100,255,150,0.03)'];
  for (let i = 0; i < 20; i++) {
    const x = (i * 97 + 50) % W;
    const y = H * 0.3 + Math.sin(i * 1.7) * H * 0.25;
    const r = 30 + (i % 5) * 20;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, bokehColors[i % bokehColors.length]);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Rain drops sliding down
class RainDrop {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : -10;
    this.speed = Math.random() * 2 + 0.5;
    this.size = Math.random() * 2 + 1;
    this.trail = [];
    this.maxTrail = Math.floor(Math.random() * 8 + 3);
    this.wobble = Math.random() * 0.3;
    this.wobblePhase = Math.random() * Math.PI * 2;
  }
  update() {
    this.wobblePhase += 0.05;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.y += this.speed;
    this.x += Math.sin(this.wobblePhase) * this.wobble;
    // Acceleration
    this.speed += 0.01;
    if (this.y > H + 10) this.reset(false);
  }
  draw() {
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const p = this.trail[i];
      const a = (i / this.trail.length) * STREAK_OPACITY * 0.3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,200,220,${a})`;
      ctx.fill();
    }
    // Main drop
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,240,${STREAK_OPACITY})`;
    ctx.fill();
    // Highlight
    ctx.beginPath();
    ctx.arc(this.x - this.size * 0.2, this.y - this.size * 0.2, this.size * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${STREAK_OPACITY * 0.5})`;
    ctx.fill();
  }
}

// Static water drips on glass
class Drip {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H * 0.8;
    this.size = Math.random() * 4 + 2;
    this.wobble = Math.random() * Math.PI * 2;
  }
  draw(t) {
    const pulse = 1 + 0.05 * Math.sin(t * 0.001 + this.wobble);
    const s = this.size * pulse;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180,200,220,0.06)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,220,240,0.1)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // refraction highlight
    ctx.beginPath();
    ctx.arc(this.x - s * 0.25, this.y - s * 0.25, s * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
  }
}

const drops = [];
const drips = [];
for (let i = 0; i < DROP_COUNT; i++) drops.push(new RainDrop());
for (let i = 0; i < DRIP_COUNT; i++) drips.push(new Drip());

function animate(t) {
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);
  drawBlurredBG();
  drips.forEach(d => d.draw(t));
  drops.forEach(d => { d.update(); d.draw(); });
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

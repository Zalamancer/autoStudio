<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underwater Deep Sea</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: #000820; }
  canvas#seaCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .depth-hud {
    position: fixed; top: 4vh; left: 50%; transform: translateX(-50%);
    z-index: 5; text-align: center; pointer-events: none;
  }
  .depth-hud h1 {
    font-family: 'Courier New', monospace;
    font-size: 2.8vh; font-weight: 700; letter-spacing: 4px;
    color: rgba(100, 210, 255, 0.7);
    text-shadow: 0 0 20px rgba(0, 160, 255, 0.4), 0 0 40px rgba(0, 100, 200, 0.2);
    animation: hudFlicker 5s ease-in-out infinite;
  }
  @keyframes hudFlicker {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .caustics-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 40%; z-index: 1;
    background: linear-gradient(180deg, rgba(0,80,180,0.04) 0%, transparent 100%);
    pointer-events: none;
    animation: causticsPulse 6s ease-in-out infinite alternate;
  }
  @keyframes causticsPulse { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }
</style>
</head>
<body>
<canvas id="seaCanvas"></canvas>
<div class="caustics-overlay"></div>
<div class="depth-hud">
  <h1 id="depthLabel">DEPTH: 3,200m</h1>
</div>

<script>
// ===== EDITABLE CONFIG =====
const CONFIG = {
  depthLabel: 'DEPTH: 3,200m',
  waterColor: '#000a20',
  glowColor: '#00ccff',
  bubbleCount: 45,
  creatureCount: 7
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

document.getElementById('depthLabel').textContent = CONFIG.depthLabel;

const canvas = document.getElementById('seaCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

// --- Bubbles ---
class Bubble {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + Math.random() * 40;
    this.radius = Math.random() * 5 + 1.5;
    this.speed = 0.3 + this.radius * 0.25;
    this.wobbleAmp = Math.random() * 25 + 8;
    this.wobbleFreq = Math.random() * 0.018 + 0.006;
    this.phase = Math.random() * Math.PI * 2;
    this.opacity = Math.random() * 0.35 + 0.15;
  }
  update() {
    this.y -= this.speed;
    this.phase += this.wobbleFreq;
    if (this.y < -20) this.reset(false);
  }
  draw() {
    const gc = hexToRgb(CONFIG.glowColor);
    const wx = Math.sin(this.phase) * this.wobbleAmp;
    const bx = this.x + wx;
    ctx.save();
    ctx.globalAlpha = this.opacity;
    // bubble body
    ctx.beginPath();
    ctx.arc(bx, this.y, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${gc.r},${gc.g},${gc.b},0.5)`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = `rgba(${gc.r},${gc.g},${gc.b},0.06)`;
    ctx.fill();
    // highlight
    ctx.beginPath();
    ctx.arc(bx - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,0.5)`;
    ctx.fill();
    ctx.restore();
  }
}

// --- Jellyfish ---
class Jellyfish {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H * 0.7 + H * 0.1 : H + 80 + Math.random() * 100;
    this.size = Math.random() * 28 + 16;
    this.speed = Math.random() * 0.35 + 0.08;
    this.driftX = (Math.random() - 0.5) * 0.25;
    this.pulseSpeed = Math.random() * 0.028 + 0.014;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.tentacles = Math.floor(Math.random() * 4) + 5;
    this.hue = 160 + Math.random() * 80;
    this.glow = Math.random() * 0.35 + 0.2;
  }
  update(t) {
    this.y -= this.speed;
    this.x += this.driftX + Math.sin(t * 0.004 + this.pulsePhase) * 0.25;
    if (this.y < -120) this.reset(false);
  }
  draw(t) {
    const pulse = Math.sin(t * this.pulseSpeed + this.pulsePhase);
    const bw = this.size * (0.8 + pulse * 0.2);
    const bh = this.size * (0.5 + pulse * 0.1);

    ctx.save();
    ctx.translate(this.x, this.y);

    // outer glow
    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 2.5);
    glowGrad.addColorStop(0, `hsla(${this.hue}, 100%, 65%, ${this.glow * 0.25})`);
    glowGrad.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(-this.size * 2.5, -this.size * 2.5, this.size * 5, this.size * 5);

    // bell (dome)
    ctx.beginPath();
    ctx.ellipse(0, 0, bw, bh, 0, Math.PI, 0);
    ctx.quadraticCurveTo(bw * 0.4, bh * 0.3, 0, bh * 0.5);
    ctx.quadraticCurveTo(-bw * 0.4, bh * 0.3, -bw, 0);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 58%, ${this.glow})`;
    ctx.fill();

    // inner bell highlight
    ctx.beginPath();
    ctx.ellipse(0, -bh * 0.15, bw * 0.55, bh * 0.35, 0, Math.PI, 0);
    ctx.fillStyle = `hsla(${this.hue}, 90%, 78%, ${this.glow * 0.4})`;
    ctx.fill();

    // tentacles
    for (let i = 0; i < this.tentacles; i++) {
      const tx = ((i / (this.tentacles - 1)) - 0.5) * bw * 1.5;
      const tLen = this.size * (1.0 + Math.random() * 0.3);
      const wave = Math.sin(t * 0.018 + i * 0.9 + this.pulsePhase) * 12;
      ctx.beginPath();
      ctx.moveTo(tx, bh * 0.35);
      ctx.bezierCurveTo(tx + wave * 0.5, bh * 0.35 + tLen * 0.3, tx + wave, bh * 0.35 + tLen * 0.6, tx + wave * 0.6, bh * 0.35 + tLen);
      ctx.strokeStyle = `hsla(${this.hue}, 80%, 62%, ${this.glow * 0.45})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // bioluminescent dots on tentacles
      if (i % 2 === 0) {
        ctx.beginPath();
        ctx.arc(tx + wave * 0.6, bh * 0.35 + tLen, 2, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${this.glow * 0.7})`;
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

// --- Kelp ---
class Kelp {
  constructor(baseX) {
    this.baseX = baseX;
    this.segments = Math.floor(Math.random() * 5) + 4;
    this.segH = Math.random() * 14 + 9;
    this.width = Math.random() * 5 + 3;
    this.swaySpeed = Math.random() * 0.008 + 0.003;
    this.swayAmp = Math.random() * 18 + 6;
    this.phase = Math.random() * Math.PI * 2;
    this.green = 60 + Math.floor(Math.random() * 50);
  }
  draw(t) {
    let px = this.baseX, py = H;
    for (let i = 0; i < this.segments; i++) {
      const sway = Math.sin(t * this.swaySpeed + this.phase + i * 0.5) * this.swayAmp * (i / this.segments);
      const nx = this.baseX + sway;
      const ny = py - this.segH;
      const alpha = 0.5 - (i / this.segments) * 0.25;
      ctx.strokeStyle = `rgba(20,${this.green},35,${alpha})`;
      ctx.lineWidth = this.width * (1 - i * 0.08);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px + sway * 0.4, (py + ny) / 2, nx, ny);
      ctx.stroke();
      // leaf
      if (i > 1 && i % 2 === 0) {
        const dir = (i % 4 === 0) ? 1 : -1;
        ctx.beginPath();
        ctx.ellipse(nx + dir * 9, ny, 7, 3, dir * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(25,${this.green + 15},40,${alpha * 0.6})`;
        ctx.fill();
      }
      px = nx; py = ny;
    }
  }
}

// --- Light Rays ---
class LightRay {
  constructor() {
    this.x = Math.random() * W;
    this.width = Math.random() * 70 + 30;
    this.opacity = Math.random() * 0.04 + 0.015;
    this.drift = (Math.random() - 0.5) * 0.15;
  }
  update() {
    this.x += this.drift;
    if (this.x < -this.width * 2) this.x = W + this.width;
    if (this.x > W + this.width * 2) this.x = -this.width;
  }
  draw() {
    const gc = hexToRgb(CONFIG.glowColor);
    const grad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
    grad.addColorStop(0, `rgba(${gc.r},${gc.g},${gc.b},${this.opacity})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(this.x - this.width * 0.2, 0);
    ctx.lineTo(this.x + this.width * 0.2, 0);
    ctx.lineTo(this.x + this.width, H * 0.75);
    ctx.lineTo(this.x - this.width, H * 0.75);
    ctx.closePath();
    ctx.fill();
  }
}

// --- Small bioluminescent motes ---
class Mote {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : Math.random() * H;
    this.size = Math.random() * 2.5 + 0.8;
    this.speed = (Math.random() - 0.5) * 0.3;
    this.vx = (Math.random() - 0.5) * 0.2;
    this.pulseSpeed = Math.random() * 0.04 + 0.01;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.hue = 170 + Math.random() * 60;
  }
  update() {
    this.y += this.speed;
    this.x += this.vx;
    if (this.y < -10 || this.y > H + 10) this.reset(false);
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
  }
  draw(t) {
    const brightness = 0.3 + Math.sin(t * this.pulseSpeed + this.pulsePhase) * 0.3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${brightness})`;
    ctx.fill();
    // glow
    const gg = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    gg.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${brightness * 0.2})`);
    gg.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(this.x - this.size * 4, this.y - this.size * 4, this.size * 8, this.size * 8);
  }
}

// --- Seafloor ---
function drawSeafloor() {
  ctx.fillStyle = 'rgba(5, 10, 20, 0.9)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, H - 8 - Math.sin(x * 0.018) * 6 - Math.sin(x * 0.045) * 3);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// --- Init ---
const bubbles = Array.from({ length: CONFIG.bubbleCount }, () => new Bubble(true));
const jellyfish = Array.from({ length: CONFIG.creatureCount }, () => new Jellyfish(true));
const kelps = Array.from({ length: 14 }, (_, i) => new Kelp(W * (i / 14) + Math.random() * 40));
const lightRays = Array.from({ length: 6 }, () => new LightRay());
const motes = Array.from({ length: 30 }, () => new Mote(true));

function drawBackground() {
  const wc = hexToRgb(CONFIG.waterColor);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgba(${wc.r + 8},${wc.g + 25},${wc.b + 50},1)`);
  grad.addColorStop(0.4, `rgb(${wc.r},${wc.g},${wc.b})`);
  grad.addColorStop(1, `rgb(${Math.max(0,wc.r-5)},${Math.max(0,wc.g-5)},${Math.max(0,wc.b-8)})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

let t = 0;
function animate() {
  t++;
  document.getElementById('depthLabel').textContent = CONFIG.depthLabel;

  drawBackground();
  lightRays.forEach(r => { r.update(); r.draw(); });
  motes.forEach(m => { m.update(); m.draw(t); });
  kelps.forEach(k => k.draw(t));
  drawSeafloor();
  jellyfish.forEach(j => { j.update(t); j.draw(t); });
  bubbles.forEach(b => { b.update(); b.draw(); });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

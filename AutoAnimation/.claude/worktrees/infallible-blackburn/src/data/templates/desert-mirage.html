<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Mirage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #ff6600;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .heat-shimmer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<canvas id="shimmer" class="heat-shimmer"></canvas>

<script>
  const CONFIG = {
    skyColorTop: '#1a0533',
    skyColorMid: '#ff6600',
    skyColorBottom: '#ffcc00',
    sandColorFar: '#c2956a',
    sandColorMid: '#d4a574',
    sandColorNear: '#e8be8a',
    sunColor: '#fff5d4',
    sunGlowColor: '#ff8800',
    sunRadius: 40,
    sandParticleCount: 80,
    camelCount: 4,
    camelSpeed: 0.25,
    dayNightCycleDuration: 30,
    starCount: 150,
    heatWaveIntensity: 3,
    duneLayerCount: 4
  };

  window.addEventListener('message', (e) => { if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); } });

  const canvas = document.getElementById('canvas');
  const shimmerCanvas = document.getElementById('shimmer');
  const ctx = canvas.getContext('2d');
  const shCtx = shimmerCanvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = shimmerCanvas.width = window.innerWidth;
    H = canvas.height = shimmerCanvas.height = window.innerHeight;
    initDunes();
  }

  // Day/night cycle (0=noon, 0.5=night, 1=noon again)
  let cycleTime = 0;

  // Dune layers
  const duneLayers = [];
  function initDunes() {
    duneLayers.length = 0;
    for (let i = 0; i < CONFIG.duneLayerCount; i++) {
      const points = [];
      const numPoints = 8 + i * 2;
      const baseY = H * (0.55 + i * 0.1);
      for (let j = 0; j <= numPoints; j++) {
        points.push({
          x: (j / numPoints) * (W + 100) - 50,
          y: baseY + Math.sin(j * 0.8 + i * 2) * (20 + i * 15) + Math.random() * 10
        });
      }
      duneLayers.push({
        points,
        baseY,
        parallax: 0.02 + i * 0.015,
        shade: i / CONFIG.duneLayerCount
      });
    }
  }

  // Stars
  const stars = [];
  for (let i = 0; i < CONFIG.starCount; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.5,
      size: 0.5 + Math.random() * 2,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.02 + Math.random() * 0.03
    });
  }

  // Sand particles
  const particles = [];
  for (let i = 0; i < CONFIG.sandParticleCount; i++) {
    particles.push({
      x: Math.random() * 2, // normalized 0-2 range (wraps)
      y: 0.5 + Math.random() * 0.5,
      size: 1 + Math.random() * 2,
      speed: 0.001 + Math.random() * 0.003,
      alpha: 0.2 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2
    });
  }

  // Camels
  const camels = [];
  for (let i = 0; i < CONFIG.camelCount; i++) {
    camels.push({
      x: -0.2 - i * 0.12,
      phase: Math.random() * Math.PI * 2,
      scale: 0.7 + Math.random() * 0.3
    });
  }

  resize();
  window.addEventListener('resize', resize);

  let frame = 0;

  function lerpColor(c1, c2, t) {
    const r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
    const r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
    const r = Math.round(r1 + (r2 - r1) * t);
    const g = Math.round(g1 + (g2 - g1) * t);
    const b = Math.round(b1 + (b2 - b1) * t);
    return `rgb(${r},${g},${b})`;
  }

  function drawSky() {
    // Day-night interpolation
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));
    const dayTop = CONFIG.skyColorMid;
    const dayBot = CONFIG.skyColorBottom;
    const nightTop = CONFIG.skyColorTop;
    const nightBot = '#2d1b4e';

    const topColor = lerpColor(dayTop, nightTop, nightFactor);
    const botColor = lerpColor(dayBot, nightBot, nightFactor);

    const grad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, botColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H * 0.7);
  }

  function drawSun() {
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));
    // Sun position arcs across the sky
    const sunAngle = cycleTime * Math.PI * 2;
    const sunX = W * 0.5 + Math.cos(sunAngle) * W * 0.3;
    const sunBaseY = H * 0.45;
    const sunY = sunBaseY - Math.sin(sunAngle) * H * 0.3;
    const sunAlpha = Math.max(0, 1 - nightFactor * 2);

    if (sunAlpha <= 0) return;

    // Heat waves emanating
    for (let i = 0; i < 4; i++) {
      const waveR = CONFIG.sunRadius * (2 + i * 1.5) + Math.sin(frame * 0.03 + i) * 10;
      ctx.beginPath();
      ctx.arc(sunX, sunY, waveR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,136,0,${0.04 * sunAlpha / (i + 1)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Sun glow
    const glow = ctx.createRadialGradient(sunX, sunY, CONFIG.sunRadius * 0.5, sunX, sunY, CONFIG.sunRadius * 4);
    glow.addColorStop(0, `rgba(255,245,212,${0.6 * sunAlpha})`);
    glow.addColorStop(0.3, `rgba(255,136,0,${0.15 * sunAlpha})`);
    glow.addColorStop(1, 'rgba(255,136,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, CONFIG.sunRadius * 4, 0, Math.PI * 2);
    ctx.fill();

    // Sun disc
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, CONFIG.sunRadius);
    sunGrad.addColorStop(0, `rgba(255,255,240,${sunAlpha})`);
    sunGrad.addColorStop(0.8, `rgba(255,200,80,${sunAlpha})`);
    sunGrad.addColorStop(1, `rgba(255,136,0,${sunAlpha * 0.5})`);
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, CONFIG.sunRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStars() {
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));
    if (nightFactor < 0.2) return;

    const alpha = (nightFactor - 0.2) / 0.8;
    stars.forEach(s => {
      s.twinkle += s.twinkleSpeed;
      const twinkle = 0.5 + 0.5 * Math.sin(s.twinkle);
      const a = alpha * twinkle * 0.8;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fill();
    });
  }

  function drawDunes() {
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));

    duneLayers.forEach((layer, li) => {
      const offset = Math.sin(frame * layer.parallax * 0.5) * 15;
      ctx.beginPath();
      ctx.moveTo(-10, H);

      const pts = layer.points;
      ctx.moveTo(pts[0].x + offset, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const cpx = (pts[i].x + pts[i + 1].x) / 2 + offset;
        const cpy = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x + offset, pts[i].y, cpx, cpy);
      }
      ctx.lineTo(W + 10, pts[pts.length - 1].y);
      ctx.lineTo(W + 10, H + 10);
      ctx.lineTo(-10, H + 10);
      ctx.closePath();

      const dayColor = lerpColor(CONFIG.sandColorFar, CONFIG.sandColorNear, layer.shade);
      const nightColor = lerpColor('#3d2b52', '#5a3d6a', layer.shade);
      ctx.fillStyle = lerpColor(dayColor, nightColor, nightFactor * 0.7);
      ctx.fill();
    });
  }

  function drawCamelCaravan() {
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));

    camels.forEach(camel => {
      camel.x += CONFIG.camelSpeed / 1000;
      if (camel.x > 1.3) camel.x = -0.3;

      const cx = camel.x * W;
      const cy = H * 0.58 + Math.sin(frame * 0.02 + camel.phase) * 3;
      const s = camel.scale * 0.8;

      const silColor = nightFactor > 0.3 ? `rgba(20,10,30,${0.7 + nightFactor * 0.3})` : `rgba(80,50,30,${0.6})`;
      ctx.fillStyle = silColor;

      // Simplified camel silhouette
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(s, s);

      // Body
      ctx.beginPath();
      ctx.ellipse(0, 0, 25, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hump
      ctx.beginPath();
      ctx.ellipse(-5, -14, 10, 8, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Neck
      ctx.beginPath();
      ctx.moveTo(18, -5);
      ctx.quadraticCurveTo(28, -25, 24, -35);
      ctx.quadraticCurveTo(20, -28, 15, -5);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.ellipse(26, -37, 8, 5, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Legs (with walk cycle)
      const legPhase = frame * 0.04 + camel.phase;
      for (let leg = 0; leg < 4; leg++) {
        const lx = -15 + leg * 10;
        const swing = Math.sin(legPhase + leg * Math.PI * 0.5) * 5;
        ctx.fillRect(lx + swing, 8, 3, 22);
      }

      ctx.restore();
    });
  }

  function drawSandParticles() {
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));
    const pAlphaScale = 1 - nightFactor * 0.5;

    particles.forEach(p => {
      p.x += p.speed;
      p.wobble += 0.05;
      if (p.x > 2) p.x -= 2;

      const px = (p.x % 1) * W;
      const py = p.y * H + Math.sin(p.wobble) * 8;

      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,180,140,${p.alpha * pAlphaScale})`;
      ctx.fill();
    });
  }

  function drawMirageOasis() {
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));
    if (nightFactor > 0.4) return;

    const ox = W * 0.65;
    const oy = H * 0.52;
    const waver = Math.sin(frame * 0.03) * 4;
    const alpha = 0.15 * (1 - nightFactor * 2.5);

    // Wavering oasis reflection
    ctx.save();
    ctx.globalAlpha = alpha;

    // Water puddle
    ctx.fillStyle = 'rgba(60,140,200,0.3)';
    ctx.beginPath();
    ctx.ellipse(ox + waver, oy + 5, 40, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Palm silhouette
    ctx.fillStyle = 'rgba(40,100,40,0.4)';
    ctx.fillRect(ox - 2 + waver, oy - 35, 4, 35);
    // Fronds
    for (let i = 0; i < 5; i++) {
      const angle = -Math.PI / 3 + (i / 4) * (2 * Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(ox + waver, oy - 35);
      ctx.quadraticCurveTo(
        ox + Math.cos(angle) * 25 + waver + Math.sin(frame * 0.02 + i) * 3,
        oy - 35 + Math.sin(angle) * 15 - 10,
        ox + Math.cos(angle) * 35 + waver,
        oy - 35 + Math.sin(angle) * 20
      );
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(40,100,40,0.4)';
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawHeatShimmer() {
    shCtx.clearRect(0, 0, W, H);
    const nightFactor = Math.max(0, Math.sin(cycleTime * Math.PI * 2 - Math.PI / 2));
    if (nightFactor > 0.3) return;

    // Distortion bands near the horizon
    const horizonY = H * 0.55;
    const bandH = H * 0.08;
    const intensity = CONFIG.heatWaveIntensity * (1 - nightFactor * 3);

    for (let y = 0; y < bandH; y += 2) {
      const offset = Math.sin(frame * 0.05 + y * 0.15) * intensity * (1 - y / bandH);
      const srcY = horizonY + y;
      if (srcY >= 0 && srcY < H) {
        try {
          const imgData = ctx.getImageData(0, Math.floor(srcY), W, 1);
          shCtx.putImageData(imgData, Math.floor(offset), Math.floor(srcY));
        } catch (e) { /* ignore cross-origin issues */ }
      }
    }
  }

  function animate() {
    frame++;
    cycleTime = (frame / 60 / CONFIG.dayNightCycleDuration) % 1;

    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawStars();
    drawSun();
    drawMirageOasis();
    drawDunes();
    drawCamelCaravan();
    drawSandParticles();
    drawHeatShimmer();

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>

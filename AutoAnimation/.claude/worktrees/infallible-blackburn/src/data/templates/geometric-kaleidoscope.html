<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Kaleidoscope</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a14; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .overlay-text {
    position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
    z-index: 2; text-align: center; pointer-events: none;
  }
  .overlay-text h1 {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 26px; font-weight: 200; letter-spacing: 12px; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    text-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
    animation: fadeBreath 5s ease-in-out infinite;
  }
  @keyframes fadeBreath {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.75; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay-text">
  <h1 id="titleEl">Kaleidoscope</h1>
</div>

<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  bgColor: '#0a0a14',
  palette: ['#ff3366', '#33ccff', '#ffcc00', '#66ff66', '#cc66ff', '#ff8833'],
  segmentCount: 12,
  rotationSpeed: 0.3,
  shapeComplexity: 5,
  title: 'Kaleidoscope'
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
    document.getElementById('titleEl').textContent = CONFIG.title;
    initElements();
  }
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, maxR;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  maxR = Math.max(W, H) * 0.52;
  initElements();
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
  const br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return '#' + [rr, rg, rb].map(v => v.toString(16).padStart(2, '0')).join('');
}

function getCycleColor(offset, t) {
  const pal = CONFIG.palette;
  const idx = ((t * 0.08 + offset) % 1 + 1) % 1 * pal.length;
  const i = Math.floor(idx);
  const f = idx - i;
  return lerpColor(pal[i % pal.length], pal[(i + 1) % pal.length], f);
}

// --- Shape drawing helpers ---
function polygon(x, y, radius, sides, rot) {
  ctx.beginPath();
  for (let i = 0; i <= sides; i++) {
    const a = (i / sides) * Math.PI * 2 + rot;
    const px = x + Math.cos(a) * radius;
    const py = y + Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function star(x, y, outerR, innerR, points, rot) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 + rot;
    const r = i % 2 === 0 ? outerR : innerR;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function spirograph(x, y, R, r, d, rot, steps) {
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2 * 3;
    const px = x + (R - r) * Math.cos(t + rot) + d * Math.cos(((R - r) / r) * t + rot);
    const py = y + (R - r) * Math.sin(t + rot) + d * Math.sin(((R - r) / r) * t + rot);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
}

// --- Pattern elements ---
class KaleidoElement {
  constructor() {
    this.reset();
  }

  reset() {
    this.type = Math.floor(Math.random() * 5); // 0=tri 1=hex 2=star 3=circle 4=spirograph
    this.dist = 15 + Math.random() * 0.85;     // normalized 0-1
    this.localAngle = Math.random() * Math.PI;  // angle within segment
    this.size = 5 + Math.random() * 22;
    this.colorOffset = Math.random();
    this.alpha = 0.2 + Math.random() * 0.5;
    this.rotSpeed = (Math.random() - 0.5) * 1.8;
    this.localRot = Math.random() * Math.PI * 2;
    this.orbitSpeed = 0.05 + Math.random() * 0.25;
    this.pulseSpeed = 0.4 + Math.random() * 1.5;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.filled = Math.random() > 0.4;
    this.lineWidth = 0.8 + Math.random() * 2;
    this.sides = [3, 4, 5, 6, 8][Math.floor(Math.random() * 5)];
    this.innerRatio = 0.3 + Math.random() * 0.3;
    this.spirR = 5 + Math.random() * 8;
    this.spirD = 3 + Math.random() * 6;
  }
}

// --- Decorative ring arcs ---
class RingArc {
  constructor(idx, total) {
    this.radiusFrac = (idx + 1) / (total + 1);
    this.dashCount = 6 + Math.floor(Math.random() * 20);
    this.rotSpeed = (Math.random() - 0.5) * 0.3;
    this.lineWidth = 0.5 + Math.random() * 1.8;
    this.colorOffset = Math.random();
    this.alpha = 0.06 + Math.random() * 0.12;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.gapRatio = 0.25 + Math.random() * 0.3;
  }

  draw(t) {
    const radius = this.radiusFrac * maxR * 0.9;
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.7 + this.pulsePhase);
    const color = getCycleColor(this.colorOffset, t);
    const a = this.alpha * pulse;
    const rot = t * this.rotSpeed;
    const dashLen = (Math.PI * 2) / this.dashCount;

    ctx.strokeStyle = hexToRgba(color, a);
    ctx.lineWidth = this.lineWidth;
    ctx.lineCap = 'round';

    for (let i = 0; i < this.dashCount; i++) {
      if (i % 2 === 0) continue;
      const startA = rot + i * dashLen;
      const endA = startA + dashLen * (1 - this.gapRatio);
      ctx.beginPath();
      ctx.arc(cx, cy, radius * pulse, startA, endA);
      ctx.stroke();
    }
  }
}

let elements = [];
let ringArcs = [];

function initElements() {
  elements = [];
  ringArcs = [];
  const count = CONFIG.shapeComplexity * 10;
  for (let i = 0; i < count; i++) {
    elements.push(new KaleidoElement());
  }
  for (let i = 0; i < 8; i++) {
    ringArcs.push(new RingArc(i, 8));
  }
}

// --- Draw one element reflected across all segments ---
function drawElementInSegments(el, t) {
  const seg = CONFIG.segmentCount;
  const segAngle = (Math.PI * 2) / seg;
  const pulse = 0.7 + 0.3 * Math.sin(t * el.pulseSpeed + el.pulsePhase);
  const orbitAngle = el.localAngle + t * el.orbitSpeed * 0.08;
  const dist = el.dist * maxR * 0.85;
  const localX = Math.cos(orbitAngle) * dist;
  const localY = Math.sin(orbitAngle) * dist * 0.45;
  const rot = el.localRot + t * el.rotSpeed;
  const color = getCycleColor(el.colorOffset, t);
  const s = el.size * pulse;
  const a = el.alpha * (0.5 + 0.5 * pulse);

  for (let si = 0; si < seg; si++) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(si * segAngle);

    // Mirror every other segment
    if (si % 2 === 1) {
      ctx.scale(1, -1);
    }

    // Clip to segment wedge
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, maxR, 0, segAngle);
    ctx.closePath();
    ctx.clip();

    // Set style
    ctx.lineWidth = el.lineWidth;
    const fillColor = hexToRgba(color, a * 0.6);
    const strokeColor = hexToRgba(color, a);

    // Draw shape
    switch (el.type) {
      case 0: // polygon
        polygon(localX, localY, s, el.sides, rot);
        break;
      case 1: // hexagon
        polygon(localX, localY, s, 6, rot);
        break;
      case 2: // star
        star(localX, localY, s, s * el.innerRatio, el.sides, rot);
        break;
      case 3: // circle
        ctx.beginPath();
        ctx.arc(localX, localY, s, 0, Math.PI * 2);
        break;
      case 4: // spirograph
        spirograph(localX, localY, s, el.spirR, el.spirD, rot, 120);
        break;
    }

    if (el.filled && el.type !== 4) {
      ctx.fillStyle = fillColor;
      ctx.fill();
    }
    ctx.strokeStyle = strokeColor;
    ctx.stroke();

    ctx.restore();
  }
}

// --- Central mandala ---
function drawMandala(t) {
  const layers = 5;
  for (let l = 0; l < layers; l++) {
    const r = 12 + l * 16;
    const petals = 6 + l * 2;
    const rot = t * (0.15 + l * 0.06) * (l % 2 === 0 ? 1 : -1);
    const color = getCycleColor(l / layers, t);
    const pulse = 0.85 + 0.15 * Math.sin(t * 1.2 + l * 0.8);

    ctx.strokeStyle = hexToRgba(color, 0.35 * pulse);
    ctx.lineWidth = 1.2;

    for (let p = 0; p < petals; p++) {
      const a = rot + (p / petals) * Math.PI * 2;
      const px = cx + Math.cos(a) * r * pulse;
      const py = cy + Math.sin(a) * r * pulse;
      const nextA = rot + ((p + 1) / petals) * Math.PI * 2;
      const npx = cx + Math.cos(nextA) * r * pulse;
      const npy = cy + Math.sin(nextA) * r * pulse;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(px, py, npx, npy);
      ctx.stroke();
    }
  }

  // Center gem with glow
  const gemPulse = 0.85 + 0.15 * Math.sin(t * 1.8);
  const gemR = 10 * gemPulse;
  const color0 = getCycleColor(0, t);

  // Outer glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, gemR * 3);
  glow.addColorStop(0, hexToRgba(color0, 0.2));
  glow.addColorStop(1, hexToRgba(color0, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, gemR * 3, 0, Math.PI * 2);
  ctx.fill();

  // Bright center
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, gemR);
  core.addColorStop(0, 'rgba(255,255,255,0.9)');
  core.addColorStop(0.4, hexToRgba(color0, 0.6));
  core.addColorStop(1, hexToRgba(color0, 0));
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, gemR, 0, Math.PI * 2);
  ctx.fill();
}

// --- Background glow ---
function drawBgGlow(t) {
  const pulse = 0.9 + 0.1 * Math.sin(t * 0.25);
  const r = maxR * 0.65 * pulse;
  const color1 = getCycleColor(0.3, t);
  const color2 = getCycleColor(0.7, t);

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, hexToRgba(color1, 0.05));
  grad.addColorStop(0.5, hexToRgba(color2, 0.02));
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// --- Connecting lines between segments ---
function drawSegmentLines(t) {
  const seg = CONFIG.segmentCount;
  const segAngle = (Math.PI * 2) / seg;

  ctx.lineWidth = 0.5;
  for (let i = 0; i < seg; i++) {
    const angle = i * segAngle + t * CONFIG.rotationSpeed * 0.08;
    const color = getCycleColor(i / seg, t);
    ctx.strokeStyle = hexToRgba(color, 0.08);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
    ctx.stroke();
  }
}

// --- Main loop ---
let time = 0;

function draw() {
  time += 0.016;

  // Clear
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Background glow
  drawBgGlow(time);

  // Segment dividing lines
  drawSegmentLines(time);

  // Ring arcs
  ringArcs.forEach(r => r.draw(time));

  // Global rotation
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(time * CONFIG.rotationSpeed * 0.08);
  ctx.translate(-cx, -cy);

  // Draw all elements across all segments
  elements.forEach(el => drawElementInSegments(el, time));

  ctx.restore();

  // Mandala center
  drawMandala(time);

  // Vignette
  const vignette = ctx.createRadialGradient(cx, cy, maxR * 0.35, cx, cy, maxR);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
}

document.getElementById('titleEl').textContent = CONFIG.title;
window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>

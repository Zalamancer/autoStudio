<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heatmap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0F172A; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  title: 'Activity Heatmap',
  theme: 'dark',
  loop: false,
  animationSpeed: 1.0,
  colorLow: '#1E293B',
  colorHigh: '#3B82F6',
  showValues: true,
  cellRadius: 4,
  rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
  columns: ['6am', '9am', '12pm', '3pm', '6pm', '9pm'],
  values: [
    [2, 5, 8, 6, 3, 1],
    [3, 7, 9, 7, 4, 2],
    [1, 6, 8, 9, 5, 3],
    [4, 8, 7, 6, 7, 2],
    [2, 5, 6, 5, 8, 4],
    [5, 3, 4, 3, 6, 7],
    [6, 2, 3, 2, 4, 5]
  ]
};

function getTheme() {
  if (CONFIG.theme === 'light') return { bg: '#FFFFFF', text: '#334155', title: '#0F172A', grid: 'rgba(51,65,85,0.12)', subtle: '#F1F5F9' };
  return { bg: '#0F172A', text: '#94A3B8', title: '#F1F5F9', grid: 'rgba(148,163,184,0.15)', subtle: '#1E293B' };
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  return `rgb(${r},${g},${bl})`;
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (r <= 0) { ctx.fillRect(x, y, w, h); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  const T = getTheme();
  const dur = 2.0 / CONFIG.animationSpeed;
  const progress = Math.min(time / dur, 1);
  const rows = CONFIG.rows;
  const cols = CONFIG.columns;
  const vals = CONFIG.values;
  const nR = rows.length;
  const nC = cols.length;

  // Find max value
  let maxVal = 0;
  for (const row of vals) for (const v of row) maxVal = Math.max(maxVal, v);
  if (maxVal === 0) maxVal = 1;

  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = T.title;
  ctx.font = `bold ${W * 0.032}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(CONFIG.title, W * 0.06, H * 0.05);

  const area = { x: W * 0.16, y: H * 0.18, w: W * 0.76, h: H * 0.68 };
  const cellW = area.w / nC;
  const cellH = area.h / nR;
  const pad = Math.min(cellW, cellH) * 0.06;
  const radius = CONFIG.cellRadius * (W / 1000);

  // Column headers
  ctx.fillStyle = T.text;
  ctx.font = `${W * 0.016}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (let c = 0; c < nC; c++) {
    ctx.fillText(cols[c], area.x + c * cellW + cellW / 2, area.y - W * 0.01);
  }

  // Row labels
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let r = 0; r < nR; r++) {
    ctx.fillText(rows[r], area.x - W * 0.015, area.y + r * cellH + cellH / 2);
  }

  // Cells — diagonal reveal
  for (let r = 0; r < nR; r++) {
    for (let c = 0; c < nC; c++) {
      const diagIdx = r + c;
      const maxDiag = (nR - 1) + (nC - 1);
      const cellProgress = Math.min(Math.max((progress * (maxDiag + 3) - diagIdx) / 2, 0), 1);
      const cellEase = easeOutCubic(cellProgress);
      if (cellEase <= 0) continue;

      const val = vals[r] && vals[r][c] !== undefined ? vals[r][c] : 0;
      const norm = val / maxVal;
      const color = lerpColor(CONFIG.colorLow, CONFIG.colorHigh, norm);

      const cx = area.x + c * cellW + pad;
      const cy = area.y + r * cellH + pad;
      const cw = cellW - pad * 2;
      const ch = cellH - pad * 2;

      ctx.globalAlpha = cellEase;
      ctx.fillStyle = color;
      ctx.shadowColor = CONFIG.colorHigh;
      ctx.shadowBlur = norm * W * 0.006;
      roundRect(cx, cy, cw, ch, radius);
      ctx.shadowBlur = 0;

      // Value text
      if (CONFIG.showValues && cellEase > 0.5) {
        ctx.fillStyle = norm > 0.5 ? '#FFFFFF' : T.text;
        ctx.font = `bold ${Math.min(cw, ch) * 0.35}px system-ui`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(val.toString(), cx + cw / 2, cy + ch / 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  // Color legend bar
  const legendW = W * 0.25;
  const legendH = H * 0.02;
  const legendX = area.x + area.w - legendW;
  const legendY = area.y + area.h + H * 0.06;
  const grad = ctx.createLinearGradient(legendX, 0, legendX + legendW, 0);
  grad.addColorStop(0, CONFIG.colorLow);
  grad.addColorStop(1, CONFIG.colorHigh);
  ctx.fillStyle = grad;
  roundRect(legendX, legendY, legendW, legendH, legendH / 2);
  ctx.fillStyle = T.text;
  ctx.font = `${W * 0.013}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('0', legendX, legendY + legendH + W * 0.005);
  ctx.textAlign = 'right';
  ctx.fillText(maxVal.toString(), legendX + legendW, legendY + legendH + W * 0.005);

  if (progress >= 1 && CONFIG.loop) { time = 0; }
  else if (progress < 1) { time += 0.016; }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>

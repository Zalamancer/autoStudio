<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Technical Drawing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', 'Lucida Console', monospace;
    position: relative;
  }
  .grid-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .drawing-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
  .drawing-layer svg {
    width: 100%;
    height: 100%;
  }
  .title-block {
    position: fixed;
    bottom: 2vmin;
    right: 2vmin;
    border: 0.2vmin solid;
    padding: 1.5vmin 2.5vmin;
    z-index: 5;
    font-size: 1.5vmin;
    line-height: 2.2;
    opacity: 0;
    animation: fadeInBlock 1s ease 6s forwards;
  }
  .title-block .project-name {
    font-size: 2.5vmin;
    font-weight: 700;
    letter-spacing: 0.3vmin;
  }
  .title-block .detail {
    opacity: 0.7;
    font-size: 1.3vmin;
  }
  .compass-rose {
    position: fixed;
    top: 4vmin;
    right: 4vmin;
    width: 12vmin;
    height: 12vmin;
    z-index: 5;
    opacity: 0;
    animation: fadeInBlock 1s ease 5s forwards;
  }
  .stamp {
    position: fixed;
    top: 4vmin;
    left: 4vmin;
    font-size: 4vmin;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5vmin;
    opacity: 0;
    transform: rotate(-15deg);
    border: 0.5vmin solid;
    padding: 0.5vmin 2vmin;
    border-radius: 0.5vmin;
    z-index: 5;
    animation: stampIn 0.5s ease 7s forwards;
  }
  @keyframes fadeInBlock {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes stampIn {
    0% { opacity: 0; transform: rotate(-15deg) scale(2); }
    60% { opacity: 0.9; transform: rotate(-15deg) scale(0.95); }
    100% { opacity: 0.7; transform: rotate(-15deg) scale(1); }
  }
  .dimension-label {
    font-family: 'Courier New', monospace;
    font-size: 1.4vmin;
    fill: currentColor;
    opacity: 0;
  }
  .draw-path {
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    fill: none;
  }
  .scan-line {
    position: fixed;
    left: 0;
    right: 0;
    height: 0.15vmin;
    z-index: 10;
    pointer-events: none;
    opacity: 0.3;
    animation: scanDown 4s linear infinite;
  }
  @keyframes scanDown {
    0% { top: -1%; }
    100% { top: 101%; }
  }
</style>
</head>
<body>

<canvas class="grid-layer" id="gridCanvas"></canvas>
<div class="drawing-layer" id="drawingLayer"></div>

<div class="title-block" id="titleBlock">
  <div class="project-name" id="projectName"></div>
  <div class="detail">DWG NO: <span id="dwgNum"></span></div>
  <div class="detail">SCALE: <span id="scaleText"></span></div>
  <div class="detail">ENGINEER: <span id="engineer"></span></div>
  <div class="detail">DATE: <span id="dateText"></span></div>
</div>

<div class="compass-rose" id="compassRose"></div>
<div class="stamp" id="stamp">APPROVED</div>
<div class="scan-line" id="scanLine"></div>

<script>
  // ===== EDITABLE CONFIG =====
  const CONFIG = {
    projectTitle: 'FUSION REACTOR HOUSING',
    drawingNumber: 'FR-2024-0042',
    scale: '1:50',
    engineer: 'J. MORRISON',
    dateText: '2024-12-15',
    bgColor: '#0a2a5c',
    lineColor: '#6cb4ee'
  };
  // ==============================

  const body = document.body;
  const gridCanvas = document.getElementById('gridCanvas');
  const gridCtx = gridCanvas.getContext('2d');
  const drawingLayer = document.getElementById('drawingLayer');
  const titleBlock = document.getElementById('titleBlock');
  const stamp = document.getElementById('stamp');
  const scanLine = document.getElementById('scanLine');

  function applyConfig() {
    body.style.background = CONFIG.bgColor;
    titleBlock.style.borderColor = CONFIG.lineColor;
    titleBlock.style.color = CONFIG.lineColor;
    stamp.style.color = CONFIG.lineColor;
    stamp.style.borderColor = CONFIG.lineColor;
    scanLine.style.background = `linear-gradient(90deg, transparent, ${CONFIG.lineColor}40, transparent)`;

    document.getElementById('projectName').textContent = CONFIG.projectTitle;
    document.getElementById('dwgNum').textContent = CONFIG.drawingNumber;
    document.getElementById('scaleText').textContent = CONFIG.scale;
    document.getElementById('engineer').textContent = CONFIG.engineer;
    document.getElementById('dateText').textContent = CONFIG.dateText;
  }

  function resizeGrid() {
    gridCanvas.width = window.innerWidth;
    gridCanvas.height = window.innerHeight;
    drawGrid();
  }

  function drawGrid() {
    const w = gridCanvas.width;
    const h = gridCanvas.height;
    const ctx = gridCtx;
    ctx.clearRect(0, 0, w, h);

    // Minor grid
    ctx.strokeStyle = CONFIG.lineColor + '15';
    ctx.lineWidth = 0.5;
    const minor = 15;
    for (let x = 0; x < w; x += minor) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += minor) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Major grid
    ctx.strokeStyle = CONFIG.lineColor + '30';
    ctx.lineWidth = 1;
    const major = 75;
    for (let x = 0; x < w; x += major) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += major) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Border
    ctx.strokeStyle = CONFIG.lineColor + '60';
    ctx.lineWidth = 2;
    const m = 20;
    ctx.strokeRect(m, m, w - m * 2, h - m * 2);
  }

  // Create SVG drawing elements
  function createDrawingSVG() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const lc = CONFIG.lineColor;

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.style.width = '100%';
    svg.style.height = '100%';

    const paths = [];
    const labels = [];

    // Main structure: a cross-section housing
    const cx = w * 0.45;
    const cy = h * 0.45;
    const outerR = Math.min(w, h) * 0.22;
    const innerR = outerR * 0.6;
    const coreR = outerR * 0.25;

    // Outer circle
    paths.push({ d: describeCircle(cx, cy, outerR), delay: 0, dur: 2000, width: 2 });
    // Inner circle
    paths.push({ d: describeCircle(cx, cy, innerR), delay: 500, dur: 1500, width: 1.5 });
    // Core circle
    paths.push({ d: describeCircle(cx, cy, coreR), delay: 1000, dur: 1000, width: 1.5 });
    // Dashed center lines
    paths.push({ d: `M ${cx - outerR - 30} ${cy} L ${cx + outerR + 30} ${cy}`, delay: 300, dur: 1500, width: 0.8, dash: '8 4' });
    paths.push({ d: `M ${cx} ${cy - outerR - 30} L ${cx} ${cy + outerR + 30}`, delay: 400, dur: 1500, width: 0.8, dash: '8 4' });

    // Radial support struts
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const x1 = cx + Math.cos(angle) * innerR;
      const y1 = cy + Math.sin(angle) * innerR;
      const x2 = cx + Math.cos(angle) * outerR;
      const y2 = cy + Math.sin(angle) * outerR;
      paths.push({ d: `M ${x1} ${y1} L ${x2} ${y2}`, delay: 1500 + i * 150, dur: 500, width: 1 });
    }

    // Bolt holes on outer circle
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const bx = cx + Math.cos(angle) * (outerR + 15);
      const by = cy + Math.sin(angle) * (outerR + 15);
      paths.push({ d: describeCircle(bx, by, 4), delay: 2800 + i * 50, dur: 200, width: 0.8 });
    }

    // Side view rectangle
    const sideX = w * 0.78;
    const sideY = h * 0.2;
    const sideW = w * 0.16;
    const sideH = h * 0.5;
    paths.push({ d: `M ${sideX} ${sideY} L ${sideX + sideW} ${sideY} L ${sideX + sideW} ${sideY + sideH} L ${sideX} ${sideY + sideH} Z`, delay: 3200, dur: 1500, width: 2 });
    // Internal lines
    paths.push({ d: `M ${sideX} ${sideY + sideH * 0.3} L ${sideX + sideW} ${sideY + sideH * 0.3}`, delay: 3800, dur: 500, width: 1 });
    paths.push({ d: `M ${sideX} ${sideY + sideH * 0.7} L ${sideX + sideW} ${sideY + sideH * 0.7}`, delay: 3900, dur: 500, width: 1 });
    // Hatching
    for (let i = 0; i < 8; i++) {
      const yy = sideY + sideH * 0.3 + (sideH * 0.4 / 8) * i;
      paths.push({ d: `M ${sideX + 5} ${yy} L ${sideX + sideW - 5} ${yy + 8}`, delay: 4200 + i * 60, dur: 200, width: 0.5 });
    }

    // Dimension lines
    // Outer diameter
    const dimY = cy + outerR + 50;
    paths.push({ d: `M ${cx - outerR} ${dimY} L ${cx + outerR} ${dimY}`, delay: 4800, dur: 800, width: 0.8 });
    paths.push({ d: `M ${cx - outerR} ${dimY - 8} L ${cx - outerR} ${dimY + 8}`, delay: 4800, dur: 200, width: 0.8 });
    paths.push({ d: `M ${cx + outerR} ${dimY - 8} L ${cx + outerR} ${dimY + 8}`, delay: 4800, dur: 200, width: 0.8 });
    // Extension lines
    paths.push({ d: `M ${cx - outerR} ${cy + outerR + 5} L ${cx - outerR} ${dimY + 3}`, delay: 4600, dur: 400, width: 0.5, dash: '4 3' });
    paths.push({ d: `M ${cx + outerR} ${cy + outerR + 5} L ${cx + outerR} ${dimY + 3}`, delay: 4600, dur: 400, width: 0.5, dash: '4 3' });

    labels.push({ text: '\u00D8 440mm', x: cx, y: dimY - 5, delay: 5200, size: 12 });
    labels.push({ text: '\u00D8 264mm', x: cx, y: cy - innerR - 12, delay: 5400, size: 10 });
    labels.push({ text: 'CORE \u00D8 110mm', x: cx, y: cy + coreR + 18, delay: 5600, size: 9 });
    labels.push({ text: 'SECTION A-A', x: cx, y: cy - outerR - 25, delay: 5000, size: 14 });
    labels.push({ text: 'SIDE VIEW', x: sideX + sideW / 2, y: sideY - 15, delay: 5100, size: 14 });
    labels.push({ text: `${(sideH * 0.5).toFixed(0)}mm`, x: sideX + sideW + 25, y: sideY + sideH * 0.5, delay: 5500, size: 10 });

    // Render paths
    paths.forEach(p => {
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', p.d);
      path.setAttribute('stroke', lc);
      path.setAttribute('stroke-width', p.width);
      path.setAttribute('fill', 'none');
      if (p.dash) path.setAttribute('stroke-dasharray', p.dash);

      // Animate drawing
      const length = path.getTotalLength ? 2000 : 2000;
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.animation = `drawStroke ${p.dur}ms ease ${p.delay}ms forwards`;
      svg.appendChild(path);
    });

    // Render labels
    labels.forEach(l => {
      const text = document.createElementNS(ns, 'text');
      text.setAttribute('x', l.x);
      text.setAttribute('y', l.y);
      text.setAttribute('fill', lc);
      text.setAttribute('font-family', 'Courier New, monospace');
      text.setAttribute('font-size', l.size);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('opacity', '0');
      text.textContent = l.text;
      text.style.animation = `fadeInBlock 0.5s ease ${l.delay}ms forwards`;
      svg.appendChild(text);
    });

    // Add keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes drawStroke {
        to { stroke-dashoffset: 0; }
      }
    `;
    document.head.appendChild(style);

    drawingLayer.innerHTML = '';
    drawingLayer.appendChild(svg);
  }

  function describeCircle(cx, cy, r) {
    return `M ${cx - r} ${cy} A ${r} ${r} 0 1 1 ${cx + r} ${cy} A ${r} ${r} 0 1 1 ${cx - r} ${cy}`;
  }

  // Compass rose SVG
  function createCompassRose() {
    const container = document.getElementById('compassRose');
    const size = container.offsetWidth || 80;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.style.width = '100%';
    svg.style.height = '100%';

    const lc = CONFIG.lineColor;

    // Outer circle
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', '50');
    circle.setAttribute('cy', '50');
    circle.setAttribute('r', '45');
    circle.setAttribute('stroke', lc);
    circle.setAttribute('stroke-width', '1.5');
    circle.setAttribute('fill', 'none');
    svg.appendChild(circle);

    // Cardinal directions
    const dirs = [
      { label: 'N', angle: -90 },
      { label: 'E', angle: 0 },
      { label: 'S', angle: 90 },
      { label: 'W', angle: 180 }
    ];
    dirs.forEach(d => {
      const rad = d.angle * Math.PI / 180;
      const x = 50 + Math.cos(rad) * 38;
      const y = 50 + Math.sin(rad) * 38;
      const text = document.createElementNS(ns, 'text');
      text.setAttribute('x', x);
      text.setAttribute('y', y + 3);
      text.setAttribute('fill', lc);
      text.setAttribute('font-family', 'Courier New');
      text.setAttribute('font-size', '10');
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-weight', '700');
      text.textContent = d.label;
      svg.appendChild(text);
    });

    // Star points
    for (let i = 0; i < 4; i++) {
      const angle = (i * 90 - 90) * Math.PI / 180;
      const x1 = 50;
      const y1 = 50;
      const x2 = 50 + Math.cos(angle) * 28;
      const y2 = 50 + Math.sin(angle) * 28;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', lc);
      line.setAttribute('stroke-width', '1.5');
      svg.appendChild(line);
    }

    // Inner tick marks
    for (let i = 0; i < 16; i++) {
      const angle = (i * 22.5) * Math.PI / 180;
      const r1 = 42;
      const r2 = i % 4 === 0 ? 35 : 39;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', 50 + Math.cos(angle) * r1);
      line.setAttribute('y1', 50 + Math.sin(angle) * r1);
      line.setAttribute('x2', 50 + Math.cos(angle) * r2);
      line.setAttribute('y2', 50 + Math.sin(angle) * r2);
      line.setAttribute('stroke', lc);
      line.setAttribute('stroke-width', i % 4 === 0 ? '1' : '0.5');
      svg.appendChild(line);
    }

    container.innerHTML = '';
    container.appendChild(svg);
  }

  // Cycle: redraw everything periodically
  let cycleCount = 0;
  function runCycle() {
    createDrawingSVG();
    createCompassRose();
    cycleCount++;
  }

  applyConfig();
  resizeGrid();
  runCycle();

  window.addEventListener('resize', () => {
    resizeGrid();
    createDrawingSVG();
    createCompassRose();
  });

  // Re-run drawing cycle every 12 seconds
  setInterval(() => {
    drawingLayer.innerHTML = '';
    document.getElementById('titleBlock').style.animation = 'none';
    document.getElementById('stamp').style.animation = 'none';
    void document.getElementById('titleBlock').offsetWidth;
    void document.getElementById('stamp').offsetWidth;
    document.getElementById('titleBlock').style.animation = 'fadeInBlock 1s ease 6s forwards';
    document.getElementById('titleBlock').style.opacity = '0';
    document.getElementById('stamp').style.animation = 'stampIn 0.5s ease 7s forwards';
    document.getElementById('stamp').style.opacity = '0';
    runCycle();
  }, 12000);

  // Subtle flicker animation loop
  let flickerTime = 0;
  function flickerLoop(time) {
    flickerTime = time;
    const flicker = 0.92 + Math.random() * 0.08;
    drawingLayer.style.opacity = flicker;
    requestAnimationFrame(flickerLoop);
  }
  requestAnimationFrame(flickerLoop);

  // postMessage CONFIG bridge
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'CONFIG_UPDATE') {
      Object.assign(CONFIG, e.data.payload);
      applyConfig();
      resizeGrid();
      runCycle();
    }
  });
</script>
</body>
</html>

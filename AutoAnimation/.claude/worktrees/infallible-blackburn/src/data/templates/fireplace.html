<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireplace Cozy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgColor: '#1a0a02',
  flameColor: '#ff6600',
  emberColor: '#ff3300',
  sparkRate: 0.4,
  brickColor: '#6b3a2a',
  warmth: 0.7,
  title: ''
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

// --- Flame particle ---
class FlameParticle {
  constructor(baseX, baseY, fireW, fireH) {
    this.baseX = baseX;
    this.fireW = fireW;
    this.fireH = fireH;
    this.reset(baseY);
  }
  reset(baseY) {
    this.x = this.baseX + (Math.random() - 0.5) * this.fireW * 0.8;
    this.y = baseY;
    this.startY = baseY;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = -(1.5 + Math.random() * 3);
    this.life = 0;
    this.maxLife = 40 + Math.random() * 60;
    this.size = 8 + Math.random() * 20;
    this.turbulence = Math.random() * Math.PI * 2;
  }
  update(baseY) {
    this.life++;
    this.turbulence += 0.08;
    this.vx += Math.sin(this.turbulence) * 0.15;
    this.x += this.vx;
    this.y += this.vy;
    this.vy *= 0.985;
    // Slow expansion near top
    this.size *= 0.995;
    if (this.life > this.maxLife) this.reset(baseY);
  }
  draw(ctx) {
    const progress = this.life / this.maxLife;
    const fc = hexToRgb(CONFIG.flameColor);
    let r, g, b, a;
    if (progress < 0.2) {
      // White-yellow core
      r = 255; g = 240; b = 180;
      a = progress / 0.2;
    } else if (progress < 0.5) {
      // Orange
      const t = (progress - 0.2) / 0.3;
      r = 255; g = Math.floor(240 - t * (240 - fc.g)); b = Math.floor(180 - t * (180 - fc.b));
      a = 1;
    } else {
      // Red to transparent
      const t = (progress - 0.5) / 0.5;
      const ec = hexToRgb(CONFIG.emberColor);
      r = Math.floor(fc.r + t * (ec.r - fc.r));
      g = Math.floor(fc.g + t * (ec.g - fc.g));
      b = Math.floor(fc.b + t * (ec.b - fc.b));
      a = 1 - t;
    }
    a = Math.max(0, a * 0.7);
    const sz = this.size * (1 - progress * 0.5);
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, sz);
    grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
    grad.addColorStop(0.4, `rgba(${r},${g},${Math.min(255, b + 20)},${a * 0.6})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Ember particle ---
class Ember {
  constructor(baseX, baseY) {
    this.reset(baseX, baseY);
  }
  reset(baseX, baseY) {
    this.x = baseX + (Math.random() - 0.5) * W * 0.2;
    this.y = baseY;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = -(0.3 + Math.random() * 0.8);
    this.life = 0;
    this.maxLife = 80 + Math.random() * 120;
    this.size = 1 + Math.random() * 2.5;
    this.brightness = 0.6 + Math.random() * 0.4;
    this.flicker = Math.random() * Math.PI * 2;
  }
  update() {
    this.life++;
    this.flicker += 0.15;
    this.x += this.vx + Math.sin(this.flicker) * 0.2;
    this.y += this.vy;
    this.vy -= 0.003;
    if (this.life > this.maxLife) return false;
    return true;
  }
  draw(ctx) {
    const progress = this.life / this.maxLife;
    const alpha = (1 - progress) * this.brightness * (0.7 + Math.sin(this.flicker * 3) * 0.3);
    const ec = hexToRgb(CONFIG.emberColor);
    ctx.fillStyle = `rgba(${ec.r}, ${Math.min(255, ec.g + 80)}, ${ec.b}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (1 - progress * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Spark particle ---
class Spark {
  constructor(baseX, baseY) {
    this.x = baseX + (Math.random() - 0.5) * W * 0.1;
    this.y = baseY;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = -(3 + Math.random() * 5);
    this.life = 0;
    this.maxLife = 30 + Math.random() * 40;
    this.size = 1 + Math.random() * 1.5;
    this.trail = [];
  }
  update() {
    this.life++;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.shift();
    this.vy += 0.08;
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    return this.life < this.maxLife;
  }
  draw(ctx) {
    const progress = this.life / this.maxLife;
    const alpha = 1 - progress;
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const ta = (i / this.trail.length) * alpha * 0.5;
      ctx.fillStyle = `rgba(255, 200, 80, ${ta})`;
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, this.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Head
    ctx.fillStyle = `rgba(255, 240, 150, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Log class ---
class Log {
  constructor(x, y, w, h, angle) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.angle = angle;
  }
  draw(ctx, t) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    // Log body
    const grad = ctx.createLinearGradient(0, -this.h / 2, 0, this.h / 2);
    grad.addColorStop(0, '#3a2010');
    grad.addColorStop(0.5, '#4a2815');
    grad.addColorStop(1, '#2a1508');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 4);
    ctx.fill();
    // Bark texture lines
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const ly = -this.h / 2 + (i + 1) * (this.h / 5);
      ctx.beginPath();
      ctx.moveTo(-this.w / 2 + 3, ly);
      ctx.lineTo(this.w / 2 - 3, ly + (Math.random() - 0.5) * 2);
      ctx.stroke();
    }
    // Glowing edges
    const glowAlpha = 0.15 + Math.sin(t * 2 + this.x) * 0.08;
    ctx.shadowColor = CONFIG.emberColor;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = `rgba(255, 100, 20, ${glowAlpha})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// Initialize entities
let flames = [];
let embers = [];
let sparks = [];
let logs = [];

function initFire() {
  const fireBaseY = H * 0.72;
  const fireCenterX = W / 2;
  const fireWidth = W * 0.28;
  flames = [];
  for (let i = 0; i < 80; i++) {
    flames.push(new FlameParticle(fireCenterX, fireBaseY, fireWidth, H * 0.3));
  }
  // Logs
  logs = [
    new Log(fireCenterX - W * 0.07, fireBaseY + H * 0.02, W * 0.18, H * 0.028, -0.15),
    new Log(fireCenterX + W * 0.05, fireBaseY + H * 0.025, W * 0.16, H * 0.025, 0.2),
    new Log(fireCenterX, fireBaseY + H * 0.04, W * 0.2, H * 0.03, 0.05),
  ];
}

function drawBrickFireplace(ctx) {
  const bc = CONFIG.brickColor;
  const bcRgb = hexToRgb(bc);
  const mantelY = H * 0.28;
  const openingTop = H * 0.35;
  const openingBottom = H * 0.82;
  const openingLeft = W * 0.22;
  const openingRight = W * 0.78;
  const pillarW = W * 0.12;

  // Back wall (dark)
  ctx.fillStyle = '#0d0806';
  ctx.fillRect(openingLeft, openingTop, openingRight - openingLeft, openingBottom - openingTop);

  // Soot stain
  const sootGrad = ctx.createRadialGradient(W / 2, openingTop, 10, W / 2, openingTop, W * 0.25);
  sootGrad.addColorStop(0, 'rgba(0,0,0,0.5)');
  sootGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sootGrad;
  ctx.fillRect(openingLeft, openingTop - 40, openingRight - openingLeft, 80);

  // Draw bricks function
  function drawBricks(x, y, w, h) {
    const brickH = 18;
    const brickW = 40;
    const mortarSize = 2;
    ctx.fillStyle = bc;
    ctx.fillRect(x, y, w, h);
    // Mortar lines
    ctx.strokeStyle = `rgba(${bcRgb.r - 30}, ${bcRgb.g - 20}, ${bcRgb.b - 15}, 0.6)`;
    ctx.lineWidth = mortarSize;
    let row = 0;
    for (let by = y; by < y + h; by += brickH + mortarSize) {
      ctx.beginPath();
      ctx.moveTo(x, by);
      ctx.lineTo(x + w, by);
      ctx.stroke();
      const offset = (row % 2) * (brickW / 2);
      for (let bx = x + offset; bx < x + w; bx += brickW + mortarSize) {
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx, by + brickH);
        ctx.stroke();
      }
      row++;
    }
  }

  // Left pillar
  drawBricks(openingLeft - pillarW, openingTop, pillarW, openingBottom - openingTop);
  // Right pillar
  drawBricks(openingRight, openingTop, pillarW, openingBottom - openingTop);
  // Top arch / lintel
  drawBricks(openingLeft - pillarW, mantelY, openingRight - openingLeft + pillarW * 2, openingTop - mantelY);
  // Hearth (bottom)
  drawBricks(openingLeft - pillarW - 10, openingBottom, openingRight - openingLeft + pillarW * 2 + 20, H * 0.06);

  // Mantel shelf
  ctx.fillStyle = '#3a2010';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.fillRect(openingLeft - pillarW - 20, mantelY - 12, openingRight - openingLeft + pillarW * 2 + 40, 14);
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // Inner shadow at edges of opening
  const lShadow = ctx.createLinearGradient(openingLeft, 0, openingLeft + 30, 0);
  lShadow.addColorStop(0, 'rgba(0,0,0,0.4)');
  lShadow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lShadow;
  ctx.fillRect(openingLeft, openingTop, 30, openingBottom - openingTop);
  const rShadow = ctx.createLinearGradient(openingRight, 0, openingRight - 30, 0);
  rShadow.addColorStop(0, 'rgba(0,0,0,0.4)');
  rShadow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rShadow;
  ctx.fillRect(openingRight - 30, openingTop, 30, openingBottom - openingTop);
}

function drawAmbientGlow(ctx, t) {
  const warmth = CONFIG.warmth;
  const fc = hexToRgb(CONFIG.flameColor);
  const pulse = 0.85 + Math.sin(t * 2.5) * 0.1 + Math.sin(t * 4.1) * 0.05;
  // Glow on ceiling/walls
  const glow = ctx.createRadialGradient(W / 2, H * 0.72, H * 0.05, W / 2, H * 0.5, H * 0.8);
  glow.addColorStop(0, `rgba(${fc.r}, ${Math.min(255, fc.g + 40)}, 20, ${0.15 * warmth * pulse})`);
  glow.addColorStop(0.5, `rgba(${fc.r}, ${fc.g}, 10, ${0.06 * warmth * pulse})`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  // Floor reflection
  const floorGlow = ctx.createRadialGradient(W / 2, H * 0.85, 10, W / 2, H * 0.85, W * 0.4);
  floorGlow.addColorStop(0, `rgba(${fc.r}, ${Math.min(255, fc.g + 30)}, 10, ${0.12 * warmth * pulse})`);
  floorGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = floorGlow;
  ctx.fillRect(0, H * 0.7, W, H * 0.3);
}

function drawTitle(ctx) {
  if (!CONFIG.title) return;
  ctx.save();
  ctx.font = `bold ${Math.max(16, H * 0.04)}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 200, 140, 0.6)';
  ctx.fillText(CONFIG.title, W / 2, H * 0.2);
  ctx.restore();
}

let startTime = 0;
function animate(ts) {
  if (!startTime) startTime = ts;
  const t = (ts - startTime) / 1000;

  resize();
  if (flames.length === 0) initFire();

  const fireBaseY = H * 0.72;
  const fireCenterX = W / 2;

  // Background
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  drawAmbientGlow(ctx, t);
  drawBrickFireplace(ctx);

  // Logs
  logs.forEach(l => l.draw(ctx, t));

  // Flames (additive blending)
  ctx.globalCompositeOperation = 'lighter';
  flames.forEach(f => { f.update(fireBaseY); f.draw(ctx); });
  ctx.globalCompositeOperation = 'source-over';

  // Embers
  if (Math.random() < 0.15) embers.push(new Ember(fireCenterX, fireBaseY));
  embers = embers.filter(e => { const alive = e.update(); e.draw(ctx); return alive; });

  // Sparks
  if (Math.random() < CONFIG.sparkRate * 0.05) {
    for (let i = 0; i < 3 + Math.random() * 5; i++) {
      sparks.push(new Spark(fireCenterX, fireBaseY - H * 0.05));
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  sparks = sparks.filter(s => { const alive = s.update(); s.draw(ctx); return alive; });
  ctx.globalCompositeOperation = 'source-over';

  // Vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  drawTitle(ctx);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>

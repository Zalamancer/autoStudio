<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underwater Ocean</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bubbleCount: 60,
  fishCount: 5,
  bgColorTop: '#001a33',
  bgColorBottom: '#000a14',
  lightRayCount: 7,
  seaweedCount: 12
};

window.addEventListener('message', e => {
  if (e.data && typeof e.data === 'object') Object.assign(CONFIG, e.data);
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Bubbles
class Bubble {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 20;
    this.r = 2 + Math.random() * 8;
    this.speed = 0.3 + Math.random() * 1.2;
    this.wobbleAmp = 10 + Math.random() * 25;
    this.wobbleFreq = 0.5 + Math.random() * 1.5;
    this.phase = Math.random() * Math.PI * 2;
    this.opacity = 0.15 + Math.random() * 0.35;
    this.baseX = this.x;
  }
  update(dt) {
    this.y -= this.speed * dt;
    this.x = this.baseX + Math.sin(time * this.wobbleFreq + this.phase) * this.wobbleAmp;
    if (this.y < -20) this.reset(false);
  }
  draw() {
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(150, 220, 255, ${this.opacity})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    // Highlight
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 240, 255, ${this.opacity * 0.8})`;
    ctx.fill();
    ctx.restore();
  }
}

// Light Rays
class LightRay {
  constructor(i, total) {
    this.index = i;
    this.total = total;
    this.reset();
  }
  reset() {
    const spread = W * 0.8;
    const start = (W - spread) / 2;
    this.x = start + (this.index / this.total) * spread + (Math.random() - 0.5) * 60;
    this.width = 30 + Math.random() * 80;
    this.opacity = 0.03 + Math.random() * 0.06;
    this.angle = -0.15 + Math.random() * 0.3;
    this.phaseOffset = Math.random() * Math.PI * 2;
    this.speed = 0.3 + Math.random() * 0.5;
  }
  draw() {
    const pulse = Math.sin(time * this.speed + this.phaseOffset) * 0.5 + 0.5;
    const alpha = this.opacity * (0.4 + pulse * 0.6);
    ctx.save();
    ctx.translate(this.x, 0);
    ctx.rotate(this.angle + Math.sin(time * 0.2 + this.phaseOffset) * 0.03);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `rgba(120, 200, 255, ${alpha * 1.5})`);
    grad.addColorStop(0.3, `rgba(80, 170, 230, ${alpha})`);
    grad.addColorStop(1, `rgba(40, 100, 180, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    const topW = this.width * 0.5;
    const botW = this.width * 2.5;
    ctx.moveTo(-topW, 0);
    ctx.lineTo(topW, 0);
    ctx.lineTo(botW, H);
    ctx.lineTo(-botW, H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// Fish
class Fish {
  constructor() { this.reset(true); }
  reset(init) {
    this.dir = Math.random() > 0.5 ? 1 : -1;
    this.x = this.dir === 1 ? -60 : W + 60;
    if (init) this.x = Math.random() * W;
    this.y = H * 0.15 + Math.random() * H * 0.6;
    this.speed = 0.5 + Math.random() * 1.5;
    this.size = 12 + Math.random() * 18;
    this.color = ['#4488aa', '#66aacc', '#3377aa', '#558899', '#77bbdd'][Math.floor(Math.random() * 5)];
    this.tailPhase = Math.random() * Math.PI * 2;
    this.tailSpeed = 3 + Math.random() * 4;
    this.yWobble = Math.random() * 15;
    this.yPhase = Math.random() * Math.PI * 2;
    this.baseY = this.y;
  }
  update(dt) {
    this.x += this.speed * this.dir * dt;
    this.y = this.baseY + Math.sin(time * 0.5 + this.yPhase) * this.yWobble;
    if ((this.dir === 1 && this.x > W + 80) || (this.dir === -1 && this.x < -80)) {
      this.reset(false);
    }
  }
  draw() {
    const s = this.size;
    const tailSwing = Math.sin(time * this.tailSpeed + this.tailPhase) * s * 0.35;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.dir, 1);
    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, s, s * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail
    ctx.beginPath();
    ctx.moveTo(-s * 0.7, 0);
    ctx.lineTo(-s * 1.4, -s * 0.4 + tailSwing * 0.5);
    ctx.lineTo(-s * 1.4, s * 0.4 + tailSwing * 0.5);
    ctx.closePath();
    ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s * 0.45, -s * 0.08, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(s * 0.48, -s * 0.08, s * 0.06, 0, Math.PI * 2);
    ctx.fill();
    // Dorsal fin
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(s * 0.1, -s * 0.35);
    ctx.quadraticCurveTo(-s * 0.1, -s * 0.7, -s * 0.4, -s * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// Seaweed
class Seaweed {
  constructor(i, total) {
    const margin = W * 0.05;
    this.x = margin + (i / (total - 1)) * (W - margin * 2) + (Math.random() - 0.5) * 40;
    this.segments = 6 + Math.floor(Math.random() * 5);
    this.segHeight = (H * 0.18 + Math.random() * H * 0.12) / this.segments;
    this.phase = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.4 + Math.random() * 0.6;
    this.swayAmp = 8 + Math.random() * 15;
    this.width = 6 + Math.random() * 10;
    this.color1 = '#0a4a2a';
    this.color2 = '#0d6b3a';
    this.hueShift = Math.random() * 20 - 10;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, H);
    const points = [];
    for (let i = 0; i <= this.segments; i++) {
      const t = i / this.segments;
      const sway = Math.sin(time * this.swaySpeed + this.phase + t * 2) * this.swayAmp * t;
      points.push({ x: sway, y: -i * this.segHeight });
    }
    // Draw thick green stroke
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const prev = points[i - 1];
        const curr = points[i];
        const cpx = (prev.x + curr.x) / 2 + side * this.width * (1 - i / this.segments) * 0.5;
        const cpy = (prev.y + curr.y) / 2;
        ctx.quadraticCurveTo(cpx, cpy, curr.x, curr.y);
      }
      const grad = ctx.createLinearGradient(0, 0, 0, -this.segments * this.segHeight);
      grad.addColorStop(0, '#0a5a30');
      grad.addColorStop(1, '#1a8a50');
      ctx.strokeStyle = grad;
      ctx.lineWidth = this.width * (side === -1 ? 1 : 0.7);
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    // Center highlight
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1];
      const curr = points[i];
      ctx.quadraticCurveTo((prev.x + curr.x) / 2, (prev.y + curr.y) / 2, curr.x, curr.y);
    }
    ctx.strokeStyle = 'rgba(50, 200, 100, 0.2)';
    ctx.lineWidth = this.width * 0.3;
    ctx.stroke();
    ctx.restore();
  }
}

// Floating particles (plankton / dust)
class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 5;
    this.r = 0.5 + Math.random() * 1.5;
    this.speed = 0.05 + Math.random() * 0.3;
    this.opacity = 0.1 + Math.random() * 0.3;
    this.drift = (Math.random() - 0.5) * 0.3;
  }
  update(dt) {
    this.y -= this.speed * dt;
    this.x += this.drift * dt;
    if (this.y < -5) this.reset(false);
  }
  draw() {
    ctx.fillStyle = `rgba(130, 200, 220, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

let bubbles, lightRays, fish, seaweeds, particles;

function init() {
  bubbles = Array.from({ length: CONFIG.bubbleCount }, () => new Bubble());
  lightRays = Array.from({ length: CONFIG.lightRayCount }, (_, i) => new LightRay(i, CONFIG.lightRayCount));
  fish = Array.from({ length: CONFIG.fishCount }, () => new Fish());
  seaweeds = Array.from({ length: CONFIG.seaweedCount }, (_, i) => new Seaweed(i, CONFIG.seaweedCount));
  particles = Array.from({ length: 80 }, () => new Particle());
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.bgColorTop);
  grad.addColorStop(1, CONFIG.bgColorBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle caustic patterns
  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 6; i++) {
    const cx = W * 0.5 + Math.sin(time * 0.3 + i * 1.2) * W * 0.3;
    const cy = H * 0.3 + Math.cos(time * 0.25 + i * 0.8) * H * 0.15;
    const r = 100 + Math.sin(time * 0.5 + i) * 40;
    const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad2.addColorStop(0, 'rgba(100, 200, 255, 1)');
    grad2.addColorStop(1, 'rgba(100, 200, 255, 0)');
    ctx.fillStyle = grad2;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  // Ocean floor gradient
  const floorGrad = ctx.createLinearGradient(0, H * 0.85, 0, H);
  floorGrad.addColorStop(0, 'rgba(10, 30, 20, 0)');
  floorGrad.addColorStop(1, 'rgba(10, 30, 20, 0.5)');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  // Sandy floor
  const sandGrad = ctx.createLinearGradient(0, H * 0.94, 0, H);
  sandGrad.addColorStop(0, 'rgba(30, 50, 40, 0)');
  sandGrad.addColorStop(0.3, 'rgba(25, 45, 35, 0.4)');
  sandGrad.addColorStop(1, 'rgba(20, 40, 30, 0.6)');
  ctx.fillStyle = sandGrad;
  ctx.fillRect(0, H * 0.94, W, H * 0.06);
}

let lastTime = performance.now();
init();

function animate(now) {
  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;
  time = now / 1000;

  drawBackground();

  // Light rays (behind everything)
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  lightRays.forEach(r => r.draw());
  ctx.restore();

  // Seaweed
  seaweeds.forEach(s => s.draw());

  // Fish
  fish.forEach(f => { f.update(dt); f.draw(); });

  // Particles
  particles.forEach(p => { p.update(dt); p.draw(); });

  // Bubbles
  bubbles.forEach(b => { b.update(dt); b.draw(); });

  // Vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,5,15,0.4)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

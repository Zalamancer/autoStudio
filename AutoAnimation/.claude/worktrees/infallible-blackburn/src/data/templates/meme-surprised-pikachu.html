<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Impact', 'Arial Black', sans-serif; }
.scene { width: 100%; height: 100%; background: linear-gradient(135deg, #ffeaa7, #fdcb6e); position: relative; display: flex; flex-direction: column; }
.top-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
.setup-text { font-size: 40px; color: #2d3436; text-align: center; text-transform: uppercase; letter-spacing: 2px; line-height: 1.3; opacity: 0; transform: translateY(-20px); max-width: 800px; }
.setup-text.show { opacity: 1; transform: translateY(0); transition: all 0.5s ease; }
.bottom-section { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.character { font-size: 200px; opacity: 0; transform: scale(0.5); filter: drop-shadow(0 8px 24px rgba(0,0,0,0.2)); }
.character.show { opacity: 1; transform: scale(1); transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
.surprise-lines { position: absolute; inset: 0; pointer-events: none; }
.line { position: absolute; width: 4px; height: 60px; background: #e17055; opacity: 0; transform-origin: center bottom; }
.line.show { opacity: 1; animation: burst 0.5s ease-out; }
@keyframes burst { 0% { transform: scaleY(0); opacity: 0; } 50% { transform: scaleY(1.2); opacity: 1; } 100% { transform: scaleY(1); opacity: 0.7; } }
.caption { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 16px 40px; border-radius: 14px; font-size: 32px; text-align: center; letter-spacing: 2px; opacity: 0; max-width: 700px; }
.caption.show { opacity: 1; transition: opacity 0.4s ease; }
.exclamation { position: absolute; font-size: 60px; opacity: 0; }
.exclamation.show { opacity: 1; animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<script>
const CONFIG = {
  setupText: 'When you do the exact thing everyone warned you about',
  captionText: '*surprised face*',
  bgColor1: '#ffeaa7',
  bgColor2: '#fdcb6e',
  textColor: '#2d3436',
  captionBgColor: 'rgba(0,0,0,0.85)',
  captionTextColor: '#ffffff',
  fontSize: 40,
  characterEmoji: '\u{1F62E}',
  animationSpeed: 400
};
</script>
<div class="scene" id="scene">
  <div class="top-section">
    <div class="setup-text" id="setup"></div>
  </div>
  <div class="bottom-section">
    <div class="surprise-lines">
      <div class="line" id="l1" style="top:15%;left:35%;transform:rotate(-30deg)"></div>
      <div class="line" id="l2" style="top:10%;left:50%;transform:rotate(0deg)"></div>
      <div class="line" id="l3" style="top:15%;right:35%;transform:rotate(30deg)"></div>
      <div class="line" id="l4" style="top:30%;left:20%;transform:rotate(-60deg)"></div>
      <div class="line" id="l5" style="top:30%;right:20%;transform:rotate(60deg)"></div>
    </div>
    <span class="character" id="character"></span>
    <span class="exclamation" id="exc1" style="top:20%;right:25%">!</span>
    <span class="exclamation" id="exc2" style="top:15%;right:30%">?</span>
  </div>
  <div class="caption" id="caption"></div>
</div>
<script>
document.getElementById('setup').textContent = CONFIG.setupText;
document.getElementById('caption').textContent = CONFIG.captionText;
document.getElementById('character').textContent = CONFIG.characterEmoji;
document.getElementById('setup').style.color = CONFIG.textColor;
document.getElementById('setup').style.fontSize = CONFIG.fontSize + 'px';
document.getElementById('caption').style.background = CONFIG.captionBgColor;
document.getElementById('caption').style.color = CONFIG.captionTextColor;
document.getElementById('scene').style.background = 'linear-gradient(135deg,' + CONFIG.bgColor1 + ',' + CONFIG.bgColor2 + ')';

var speed = CONFIG.animationSpeed;
setTimeout(function() { document.getElementById('setup').classList.add('show'); }, speed);
setTimeout(function() { document.getElementById('character').classList.add('show'); }, speed * 3);
setTimeout(function() {
  document.querySelectorAll('.line').forEach(function(l) { l.classList.add('show'); });
  document.getElementById('exc1').classList.add('show');
  document.getElementById('exc2').classList.add('show');
}, speed * 4);
setTimeout(function() { document.getElementById('caption').classList.add('show'); }, speed * 5);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epic Countdown Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  :root {
    --bg: #0a0a1a;
    --accent: #6c63ff;
    --particle: #ff6b6b;
  }
  canvas#particles {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 0;
  }
  .bg-pulse {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(108,99,255,0.08) 0%, transparent 60%);
    animation: bgPulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bgPulse { 0%,100%{transform:scale(1);opacity:0.6;} 50%{transform:scale(1.15);opacity:1;} }

  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 3vh;
  }
  .title {
    font-size: 3vh; font-weight: 800; letter-spacing: 0.15em;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent), #ff6b6b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    opacity: 0; transition: opacity 0.8s;
  }
  .title.show { opacity: 1; }
  .subtitle {
    font-size: 1.6vh; color: rgba(255,255,255,0.4); letter-spacing: 0.1em;
    opacity: 0; transition: opacity 0.6s;
  }
  .subtitle.show { opacity: 1; }

  /* Ring */
  .ring-wrap {
    position: relative; width: 36vh; height: 36vh;
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.8s, transform 0.8s cubic-bezier(0.22,1,0.36,1);
  }
  .ring-wrap.show { opacity: 1; transform: scale(1); }
  .ring-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 3; }
  .ring-fg {
    fill: none; stroke: url(#ringGrad); stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease;
  }
  .ring-glow {
    fill: none; stroke: var(--accent); stroke-width: 6;
    stroke-linecap: round; filter: blur(8px); opacity: 0.4;
    transition: stroke-dashoffset 0.3s ease;
  }

  /* Digits */
  .digits {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: flex; align-items: center; gap: 0.8vw;
  }
  .digit-group { text-align: center; }
  .digit-value {
    font-size: 7vh; font-weight: 900; font-variant-numeric: tabular-nums;
    line-height: 1;
    background: linear-gradient(180deg, #fff 40%, rgba(255,255,255,0.6));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    position: relative;
  }
  .digit-value.flip {
    animation: digitFlip 0.3s ease;
  }
  @keyframes digitFlip {
    0% { transform: scaleY(1); }
    50% { transform: scaleY(0.7) translateY(-5%); }
    100% { transform: scaleY(1); }
  }
  .digit-label {
    font-size: 1.1vh; color: rgba(255,255,255,0.3);
    text-transform: uppercase; letter-spacing: 0.2em;
    margin-top: 0.5vh;
  }
  .digit-sep {
    font-size: 5vh; font-weight: 300; color: rgba(255,255,255,0.2);
    margin-top: -1vh;
    animation: sepBlink 1s step-end infinite;
  }
  @keyframes sepBlink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* Bottom label */
  .bottom-label {
    font-size: 1.3vh; color: rgba(255,255,255,0.25); letter-spacing: 0.15em;
    opacity: 0; transition: opacity 0.6s;
  }
  .bottom-label.show { opacity: 1; }
</style>
</head>
<body>
<div class="bg-pulse"></div>
<canvas id="particles"></canvas>
<div class="content">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="ring-wrap" id="ringWrap">
    <svg class="ring-svg" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--accent)"/>
          <stop offset="100%" stop-color="var(--particle)"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="100" cy="100" r="90"/>
      <circle class="ring-glow" id="ringGlow" cx="100" cy="100" r="90"/>
      <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"/>
    </svg>
    <div class="digits" id="digits"></div>
  </div>
  <div class="bottom-label" id="bottomLabel">LAUNCHING SOON</div>
</div>

<script>
// === EDITABLE CONFIG ===
var CONFIG = {
  targetDate: '2026-12-31T00:00:00',
  title: 'COUNTDOWN',
  subtitle: 'Something amazing is coming',
  bgColor: '#0a0a1a',
  accentColor: '#6c63ff',
  particleColor: '#ff6b6b',
  cycleDuration: 12
};

document.body.style.background = CONFIG.bgColor;
document.documentElement.style.setProperty('--bg', CONFIG.bgColor);
document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
document.documentElement.style.setProperty('--particle', CONFIG.particleColor);
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('subtitle').textContent = CONFIG.subtitle;

var CYCLE_MS = CONFIG.cycleDuration * 1000;
var CIRC = 2 * Math.PI * 90;
var ringFg = document.getElementById('ringFg');
var ringGlow = document.getElementById('ringGlow');
ringFg.style.strokeDasharray = CIRC;
ringGlow.style.strokeDasharray = CIRC;

// For demo cycling: count down from cycleDuration seconds
var demoTotal = CONFIG.cycleDuration;
var demoRemaining = demoTotal;

function buildDigits() {
  var d = document.getElementById('digits');
  d.innerHTML = '';
  var groups = [
    { id: 'days', label: 'DAYS' },
    { id: 'hrs', label: 'HRS' },
    { id: 'min', label: 'MIN' },
    { id: 'sec', label: 'SEC' }
  ];
  groups.forEach(function(g, i) {
    if (i > 0) {
      var sep = document.createElement('div');
      sep.className = 'digit-sep';
      sep.textContent = ':';
      d.appendChild(sep);
    }
    var grp = document.createElement('div');
    grp.className = 'digit-group';
    grp.innerHTML = '<div class="digit-value" id="dv-'+g.id+'">00</div><div class="digit-label">'+g.label+'</div>';
    d.appendChild(grp);
  });
}
buildDigits();

var prevSec = -1;
function updateCountdown(remaining) {
  var sec = Math.max(0, Math.floor(remaining));
  var days = Math.floor(sec / 86400);
  var hrs = Math.floor((sec % 86400) / 3600);
  var min = Math.floor((sec % 3600) / 60);
  var s = sec % 60;

  function setVal(id, val) {
    var el = document.getElementById('dv-' + id);
    var str = String(val).padStart(2, '0');
    if (el.textContent !== str) {
      el.textContent = str;
      el.classList.remove('flip');
      void el.offsetWidth;
      el.classList.add('flip');
    }
  }
  setVal('days', days);
  setVal('hrs', hrs);
  setVal('min', min);
  setVal('sec', s);

  // Ring progress
  var pct = 1 - (remaining / demoTotal);
  var offset = CIRC * (1 - pct);
  ringFg.style.strokeDashoffset = offset;
  ringGlow.style.strokeDashoffset = offset;

  // Particles on second change
  if (sec !== prevSec) {
    prevSec = sec;
    emitBurst(6);
  }
}

// Particle system
var pCanvas = document.getElementById('particles');
var pCtx = pCanvas.getContext('2d');
var particles = [];

function resizeCanvas() {
  pCanvas.width = window.innerWidth * 2;
  pCanvas.height = window.innerHeight * 2;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function emitBurst(count) {
  var cx = pCanvas.width / 2;
  var cy = pCanvas.height / 2;
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 2 + Math.random() * 6;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.008 + Math.random() * 0.015,
      size: 2 + Math.random() * 4,
      color: Math.random() > 0.5 ? CONFIG.accentColor : CONFIG.particleColor
    });
  }
}

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

function drawParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.vx *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    pCtx.fillStyle = 'rgba(' + hexToRgb(p.color) + ',' + (p.life * 0.8) + ')';
    pCtx.fill();
    // glow
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * p.life * 2, 0, Math.PI * 2);
    pCtx.fillStyle = 'rgba(' + hexToRgb(p.color) + ',' + (p.life * 0.15) + ')';
    pCtx.fill();
  }
}

// Ambient floating particles
function emitAmbient() {
  if (particles.length < 40) {
    var x = Math.random() * pCanvas.width;
    var y = pCanvas.height + 10;
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -(0.5 + Math.random() * 1.5),
      life: 1,
      decay: 0.003 + Math.random() * 0.005,
      size: 1 + Math.random() * 2,
      color: Math.random() > 0.5 ? CONFIG.accentColor : CONFIG.particleColor
    });
  }
}

// Cycle
function easeOut(t) { return 1 - Math.pow(1-t, 3); }
function easeIn(t) { return t*t*t; }

function getPhase(elapsed) {
  var p = elapsed / CYCLE_MS;
  if (p < 0.15) return { name:'intro', t: p/0.15 };
  if (p < 0.75) return { name:'hold', t: (p-0.15)/0.60 };
  if (p < 0.90) return { name:'exit', t: (p-0.75)/0.15 };
  return { name:'pause', t: (p-0.90)/0.10 };
}

var cycleElapsed = 0, lastTs = 0;

function frame(ts) {
  if (!lastTs) lastTs = ts;
  var dt = ts - lastTs;
  lastTs = ts;
  cycleElapsed += dt;
  if (cycleElapsed >= CYCLE_MS) cycleElapsed = 0;

  var phase = getPhase(cycleElapsed);
  var titleEl = document.getElementById('title');
  var subtitleEl = document.getElementById('subtitle');
  var ringWrap = document.getElementById('ringWrap');
  var bottomLabel = document.getElementById('bottomLabel');

  // Demo countdown: maps hold phase progress to full countdown
  var remaining = demoTotal * (1 - (phase.name === 'hold' ? phase.t : (phase.name === 'exit' || phase.name === 'pause' ? 1 : 0)));
  updateCountdown(remaining);

  if (phase.name === 'intro') {
    var e = easeOut(phase.t);
    titleEl.classList.add('show'); titleEl.style.opacity = e;
    if (phase.t > 0.2) { subtitleEl.classList.add('show'); subtitleEl.style.opacity = easeOut((phase.t-0.2)/0.8); }
    if (phase.t > 0.3) { ringWrap.classList.add('show'); ringWrap.style.opacity = easeOut((phase.t-0.3)/0.7); ringWrap.style.transform = 'scale('+easeOut((phase.t-0.3)/0.7)+')'; }
    if (phase.t > 0.6) { bottomLabel.classList.add('show'); bottomLabel.style.opacity = easeOut((phase.t-0.6)/0.4); }
  } else if (phase.name === 'hold') {
    titleEl.style.opacity = 1;
    subtitleEl.style.opacity = 1;
    ringWrap.style.opacity = 1; ringWrap.style.transform = 'scale(1)';
    bottomLabel.style.opacity = 1;
  } else if (phase.name === 'exit') {
    var e2 = easeIn(phase.t);
    titleEl.style.opacity = 1 - e2;
    subtitleEl.style.opacity = 1 - e2;
    ringWrap.style.opacity = 1 - e2;
    ringWrap.style.transform = 'scale(' + (1 - e2 * 0.15) + ')';
    bottomLabel.style.opacity = 1 - e2;
  } else {
    titleEl.style.opacity = 0;
    subtitleEl.style.opacity = 0;
    ringWrap.style.opacity = 0;
    bottomLabel.style.opacity = 0;
  }

  emitAmbient();
  drawParticles();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

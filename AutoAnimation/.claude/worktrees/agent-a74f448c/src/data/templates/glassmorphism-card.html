<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Card Motion Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0f0f1a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .blob-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    filter: blur(80px);
    opacity: 0.6;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
  }

  .blob-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #6366f1, #4f46e5);
    top: 10%; left: 10%;
    animation: blobMove1 12s ease-in-out infinite;
  }
  .blob-2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #10B981, #059669);
    top: 50%; right: 10%;
    animation: blobMove2 15s ease-in-out infinite;
  }
  .blob-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #f59e0b, #d97706);
    bottom: 10%; left: 30%;
    animation: blobMove3 10s ease-in-out infinite;
  }
  .blob-4 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, #ec4899, #db2777);
    top: 30%; left: 50%;
    animation: blobMove4 13s ease-in-out infinite;
  }

  @keyframes blobMove1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(30%, 20%) scale(1.1); }
    50% { transform: translate(10%, 40%) scale(0.9); }
    75% { transform: translate(-20%, 10%) scale(1.05); }
  }
  @keyframes blobMove2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-40%, -15%) scale(1.15); }
    50% { transform: translate(-20%, -30%) scale(0.85); }
    75% { transform: translate(10%, -10%) scale(1.1); }
  }
  @keyframes blobMove3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(25%, -25%) scale(1.2); }
    66% { transform: translate(-15%, -10%) scale(0.8); }
  }
  @keyframes blobMove4 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-30%, 30%) scale(0.9); }
    50% { transform: translate(20%, 15%) scale(1.15); }
    75% { transform: translate(-10%, -20%) scale(1); }
  }

  .card {
    position: absolute;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 30px;
    color: white;
    will-change: transform;
    transition: transform 0.1s ease-out;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 20px;
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.1) 0%,
      rgba(255, 255, 255, 0) 50%,
      rgba(255, 255, 255, 0.05) 100%
    );
    pointer-events: none;
  }

  .card .glow-edge {
    position: absolute;
    top: -1px; left: -1px;
    right: -1px; bottom: -1px;
    border-radius: 21px;
    background: linear-gradient(
      var(--glow-angle, 135deg),
      rgba(16, 185, 129, 0.4) 0%,
      transparent 40%,
      transparent 60%,
      rgba(16, 185, 129, 0.2) 100%
    );
    z-index: -1;
    opacity: 0.6;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.95);
  }

  .card-subtitle {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  .card-body {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.7);
  }

  .card-stat {
    font-size: 36px;
    font-weight: 800;
    color: #10B981;
    line-height: 1;
    margin-bottom: 4px;
  }

  .card-stat-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .card-bar {
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }

  .card-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #10B981, #34d399);
    border-radius: 2px;
    animation: barFill 3s ease-in-out infinite alternate;
  }

  @keyframes barFill {
    from { width: 30%; }
    to { width: 85%; }
  }

  .dot-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.15;
  }

  .floating-circle {
    position: absolute;
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="blob-container">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<canvas class="dot-grid" id="dotGrid"></canvas>

<div id="cards"></div>
<div id="circles"></div>

<script>
  // === EDITABLE VARIABLES ===
  const CONFIG = {
    bgColor: '#0f0f1a',
    accentColor: '#10B981',
    cardCount: 5,
    titles: ['Analytics', 'Revenue', 'Users', 'Performance', 'Growth'],
    subtitles: ['Real-time Data', 'Monthly Report', 'Active Now', 'System Health', 'Quarterly'],
    stats: ['$42.8K', '2,847', '98.6%', '1.2M', '+34%'],
    statLabels: ['Total Revenue', 'Active Users', 'Uptime', 'API Calls', 'Growth Rate'],
    floatSpeed: 0.5,
  };

  // Dot grid
  const dotCanvas = document.getElementById('dotGrid');
  const dotCtx = dotCanvas.getContext('2d');

  function drawDotGrid() {
    dotCanvas.width = window.innerWidth;
    dotCanvas.height = window.innerHeight;
    const spacing = 30;
    dotCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    for (let x = spacing; x < dotCanvas.width; x += spacing) {
      for (let y = spacing; y < dotCanvas.height; y += spacing) {
        dotCtx.beginPath();
        dotCtx.arc(x, y, 0.8, 0, Math.PI * 2);
        dotCtx.fill();
      }
    }
  }
  drawDotGrid();
  window.addEventListener('resize', drawDotGrid);

  // Create cards
  const cardsContainer = document.getElementById('cards');
  const cards = [];

  const cardConfigs = [
    { w: 260, h: 180, baseX: 10, baseY: 15, type: 'stat' },
    { w: 220, h: 160, baseX: 55, baseY: 10, type: 'stat' },
    { w: 280, h: 200, baseX: 8, baseY: 55, type: 'bar' },
    { w: 240, h: 170, baseX: 52, baseY: 50, type: 'stat' },
    { w: 200, h: 150, baseX: 30, baseY: 35, type: 'bar' },
  ];

  cardConfigs.forEach((cfg, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = cfg.w + 'px';
    card.style.height = cfg.h + 'px';
    card.style.left = cfg.baseX + '%';
    card.style.top = cfg.baseY + '%';

    const glow = document.createElement('div');
    glow.className = 'glow-edge';
    card.appendChild(glow);

    const subtitle = document.createElement('div');
    subtitle.className = 'card-subtitle';
    subtitle.textContent = CONFIG.subtitles[i];
    card.appendChild(subtitle);

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = CONFIG.titles[i];
    card.appendChild(title);

    if (cfg.type === 'stat') {
      const stat = document.createElement('div');
      stat.className = 'card-stat';
      stat.textContent = CONFIG.stats[i];
      card.appendChild(stat);

      const label = document.createElement('div');
      label.className = 'card-stat-label';
      label.textContent = CONFIG.statLabels[i];
      card.appendChild(label);
    } else {
      const body = document.createElement('div');
      body.className = 'card-body';
      body.textContent = CONFIG.statLabels[i];
      card.appendChild(body);

      const bar = document.createElement('div');
      bar.className = 'card-bar';
      const fill = document.createElement('div');
      fill.className = 'card-bar-fill';
      fill.style.animationDelay = (i * 0.5) + 's';
      bar.appendChild(fill);
      card.appendChild(bar);
    }

    cardsContainer.appendChild(card);
    cards.push({
      el: card,
      glow,
      baseX: cfg.baseX,
      baseY: cfg.baseY,
      phaseX: Math.random() * Math.PI * 2,
      phaseY: Math.random() * Math.PI * 2,
      speedX: 0.2 + Math.random() * 0.3,
      speedY: 0.15 + Math.random() * 0.25,
      ampX: 1.5 + Math.random() * 2,
      ampY: 1 + Math.random() * 1.5,
    });
  });

  // Floating circles
  const circlesContainer = document.getElementById('circles');
  for (let i = 0; i < 6; i++) {
    const circle = document.createElement('div');
    circle.className = 'floating-circle';
    const size = 40 + Math.random() * 120;
    circle.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 80 + 10}%;
      top: ${Math.random() * 80 + 10}%;
      animation: blobMove${(i % 4) + 1} ${8 + Math.random() * 8}s ease-in-out infinite;
      animation-delay: ${-Math.random() * 5}s;
    `;
    circlesContainer.appendChild(circle);
  }

  // Animation loop
  let time = 0;

  function animate() {
    time += 0.016;

    cards.forEach((c) => {
      const offsetX = Math.sin(time * c.speedX + c.phaseX) * c.ampX;
      const offsetY = Math.cos(time * c.speedY + c.phaseY) * c.ampY;

      // Subtle parallax tilt
      const tiltX = Math.sin(time * c.speedY + c.phaseY) * 3;
      const tiltY = Math.cos(time * c.speedX + c.phaseX) * 3;

      c.el.style.transform = `translate(${offsetX}px, ${offsetY}px) perspective(800px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

      // Rotate glow edge
      const angle = ((time * 30 + c.phaseX * 57) % 360);
      c.glow.style.setProperty('--glow-angle', angle + 'deg');
    });

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>

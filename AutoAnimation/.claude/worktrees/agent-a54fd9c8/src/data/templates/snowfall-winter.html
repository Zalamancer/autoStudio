<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowfall Winter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .frost { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(180,210,230,0.08) 100%);
  }
  .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,10,30,0.4) 100%);
  }
  .center-text { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    z-index: 3; text-align: center; color: #D8EAF4; pointer-events: none; }
  .center-text h1 { font-size: 46px; font-weight: 200; letter-spacing: 14px; text-transform: uppercase;
    text-shadow: 0 0 30px rgba(180,210,240,0.3); animation: snowText 6s ease-in-out infinite; }
  .center-text .subtitle { font-size: 12px; letter-spacing: 8px; opacity: 0.45; margin-top: 12px; text-transform: uppercase; }
  @keyframes snowText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="frost"></div>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="titleEl">Winter</h1>
  <div class="subtitle" id="subEl">Silent Snowfall</div>
</div>
<script>
const CONFIG = {
  titleText: 'Winter',
  subtitleText: 'Silent Snowfall',
  bgColorTop: '#0a1528',
  bgColorMid: '#0e1d38',
  bgColorBottom: '#1a2a4a',
  snowCount: 200,
  windStrength: 0.3,
  treeCount: 8,
  accentColor: '#B8D4E8',
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});

function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; generateTrees(); }
resize();
addEventListener('resize', resize);

// Snow particles
const snow = [];
function initSnow() {
  snow.length = 0;
  for (let i = 0; i < CONFIG.snowCount; i++) {
    snow.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 3 + 0.5,
      speed: Math.random() * 1.2 + 0.3,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: Math.random() * 0.02 + 0.005,
      wobbleAmp: Math.random() * 20 + 5,
      opacity: Math.random() * 0.6 + 0.2,
      depth: Math.random(),
    });
  }
}
initSnow();

// Pine trees
let trees = [];
function generateTrees() {
  trees = [];
  for (let i = 0; i < CONFIG.treeCount; i++) {
    const x = (i / (CONFIG.treeCount - 1)) * W * 0.9 + W * 0.05 + (Math.random() - 0.5) * 60;
    const h = 60 + Math.random() * 100;
    const depth = 0.3 + Math.random() * 0.7;
    trees.push({ x, h, depth, w: 20 + Math.random() * 15 });
  }
  trees.sort((a, b) => a.depth - b.depth);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, CONFIG.bgColorTop);
  g.addColorStop(0.5, CONFIG.bgColorMid);
  g.addColorStop(1, CONFIG.bgColorBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawGround() {
  const gy = H * 0.82;
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, 'rgba(180,210,230,0.05)');
  g.addColorStop(0.3, 'rgba(140,170,200,0.08)');
  g.addColorStop(1, 'rgba(100,130,160,0.12)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    const bump = Math.sin(x * 0.015) * 8 + Math.sin(x * 0.005) * 15;
    ctx.lineTo(x, gy + bump);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawTrees() {
  trees.forEach(t => {
    const by = H * 0.82 + Math.sin(t.x * 0.015) * 8;
    const dark = 0.15 + t.depth * 0.25;
    const layers = 5;
    // Trunk
    ctx.fillStyle = `rgba(20,15,10,${dark + 0.1})`;
    ctx.fillRect(t.x - 2, by - t.h * 0.3, 4, t.h * 0.3);
    // Foliage layers
    for (let l = 0; l < layers; l++) {
      const ly = by - t.h * (0.3 + l * 0.14);
      const lw = t.w * (1 - l * 0.15);
      ctx.beginPath();
      ctx.moveTo(t.x, ly - t.h * 0.18);
      ctx.lineTo(t.x - lw, ly);
      ctx.lineTo(t.x + lw, ly);
      ctx.closePath();
      ctx.fillStyle = `rgba(10,${30 + l * 5},${20 + l * 3},${dark})`;
      ctx.fill();
      // Snow caps
      ctx.beginPath();
      ctx.moveTo(t.x, ly - t.h * 0.18);
      ctx.lineTo(t.x - lw * 0.6, ly - t.h * 0.04);
      ctx.lineTo(t.x + lw * 0.6, ly - t.h * 0.04);
      ctx.closePath();
      ctx.fillStyle = `rgba(200,220,240,${dark * 0.3})`;
      ctx.fill();
    }
  });
}

function drawSnow(t) {
  snow.forEach(s => {
    s.wobble += s.wobbleSpeed;
    s.y += s.speed * (0.5 + s.depth * 0.5);
    s.x += Math.sin(s.wobble) * CONFIG.windStrength + CONFIG.windStrength * 0.3;
    if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
    if (s.x > W + 20) s.x = -20;
    if (s.x < -20) s.x = W + 20;
    const wx = s.x + Math.sin(s.wobble) * s.wobbleAmp;
    const a = s.opacity * (0.6 + 0.4 * s.depth);
    const size = s.r * (0.5 + s.depth * 0.5);
    ctx.beginPath();
    ctx.arc(wx, s.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,235,250,${a})`;
    ctx.fill();
    if (size > 2) {
      ctx.beginPath();
      ctx.arc(wx, s.y, size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,240,${a * 0.06})`;
      ctx.fill();
    }
  });
}

// Ground snow accumulation sparkles
function drawSparkles(t) {
  for (let i = 0; i < 20; i++) {
    const sx = (i * W / 19) + Math.sin(t * 0.0008 + i * 4) * 8;
    const sy = H * 0.84 + Math.sin(i * 1.3 + t * 0.0003) * H * 0.03;
    const glitter = 0.5 + 0.5 * Math.sin(t * 0.004 + i * 6);
    if (glitter > 0.8) {
      ctx.beginPath();
      ctx.arc(sx, sy, 1, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,240,255,${glitter * 0.4})`;
      ctx.fill();
    }
  }
}

function animate(t) {
  drawBackground();
  drawGround();
  drawTrees();
  drawSnow(t);
  drawSparkles(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

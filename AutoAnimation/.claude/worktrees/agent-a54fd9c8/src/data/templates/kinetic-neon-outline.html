<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Outline - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0c; font-family: 'Arial', sans-serif; position: relative; }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }

  @keyframes outlineIn { 0% { opacity: 0; -webkit-text-stroke-color: transparent; } 40% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes outlineOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05); } }
  @keyframes neonBreath { 0%,100% { filter: drop-shadow(0 0 4px var(--nc)) drop-shadow(0 0 8px var(--nc)); } 50% { filter: drop-shadow(0 0 8px var(--nc)) drop-shadow(0 0 20px var(--nc)) drop-shadow(0 0 30px var(--nc)); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['MIDNIGHT','GLOW','ELECTRIC','OUTLINE','VIVID','BRIGHT','RADIANT','PULSE'],
  bgColor: '#0c0c0c',
  fontFamily: "'Arial', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const neonColors = ['#ff00ff','#00ff88','#ff4466','#44aaff','#ffff00','#ff6600','#00ffcc','#aa44ff'];

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 89 + 43);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(38 + rng() * 26, cellW * 0.38, cellH * 0.5);
    const color = neonColors[i % neonColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-weight:900;color:transparent;-webkit-text-stroke:2px ${color};--nc:${color};letter-spacing:4px;text-transform:uppercase;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=260, inD=450, hold=3000, outS=200, outD=400, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`outlineIn ${inD}ms ease-out forwards, neonBreath 2s ease-in-out infinite ${inD}ms`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`outlineOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

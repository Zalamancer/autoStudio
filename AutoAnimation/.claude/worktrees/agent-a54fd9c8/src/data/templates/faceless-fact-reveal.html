<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceless Fact Reveal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
.fact { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10%; opacity: 0; transform: scale(0.8); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.fact.active { opacity: 1; transform: scale(1); }
.fact.exit { opacity: 0; transform: scale(1.1); }
.fact-text { font-size: 6vmin; font-weight: 900; text-align: center; line-height: 1.2; letter-spacing: -0.02em; }
.fact-text .highlight { color: var(--accent); }
.pulse { position: absolute; width: 40vmin; height: 40vmin; border-radius: 50%; background: var(--accent); opacity: 0.06; filter: blur(60px); animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
</style>
</head>
<body>
<div class="pulse" style="top:20%;left:60%"></div>
<div class="pulse" style="bottom:20%;right:60%;animation-delay:-1.5s"></div>
<div id="stage"></div>
<script>
const CONFIG = {
  facts: [
    'The average person spends 2 hours per day on social media',
    '90% of the world\'s data was created in the last 2 years',
    'By 2030, AI could contribute $15.7 TRILLION to the global economy'
  ],
  bgColor: '#0a0a0a',
  textColor: '#ffffff',
  accentColor: '#f59e0b',
  revealIntervalMs: 4000
};

document.body.style.background = CONFIG.bgColor;
document.documentElement.style.setProperty('--accent', CONFIG.accentColor);

const stage = document.getElementById('stage');
let currentIndex = -1;
let factEls = [];

function buildFacts() {
  stage.innerHTML = '';
  factEls = CONFIG.facts.map((text, i) => {
    const el = document.createElement('div');
    el.className = 'fact';
    const words = text.split(' ');
    const highlighted = words.map(w => {
      if (/^\d|%|\$|TRILLION|BILLION|MILLION/i.test(w)) return `<span class="highlight">${w}</span>`;
      return w;
    }).join(' ');
    el.innerHTML = `<div class="fact-text" style="color:${CONFIG.textColor}">${highlighted}</div>`;
    stage.appendChild(el);
    return el;
  });
}

function showNext() {
  if (currentIndex >= 0 && factEls[currentIndex]) {
    factEls[currentIndex].classList.remove('active');
    factEls[currentIndex].classList.add('exit');
  }
  currentIndex = (currentIndex + 1) % factEls.length;
  setTimeout(() => {
    factEls.forEach(el => el.classList.remove('exit'));
    factEls[currentIndex].classList.add('active');
  }, 300);
}

buildFacts();
setTimeout(showNext, 500);
setInterval(showNext, CONFIG.revealIntervalMs);

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    document.body.style.background = CONFIG.bgColor;
    document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
    buildFacts();
    currentIndex = -1;
    showNext();
  }
});
</script>
</body>
</html>

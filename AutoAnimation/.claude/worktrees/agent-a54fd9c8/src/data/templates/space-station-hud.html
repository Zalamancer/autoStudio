<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Station HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #040810; font-family: 'Courier New', monospace; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="hud"></canvas>
<script>
const CONFIG = {
  primaryColor: '#00e5ff',
  secondaryColor: '#00e676',
  warningColor: '#ff6e40',
  bgColor: '#040810',
  gridColor: '#0a1628',
  radarRadius: 0.12,
  radarSweepSpeed: 1.5,
  radarBlips: 8,
  starCount: 200,
  starSpeed: 0.5,
  telemetrySpeed: 1.0,
  statusPanelCount: 4,
  dataStreamLines: 12,
  scanLineOpacity: 0.03,
  hudLineWidth: 1.2,
  glowStrength: 0.5,
  viewportSize: 0.35,
  orbitRingCount: 3,
  alertFlashSpeed: 2.0
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('hud');
const ctx = canvas.getContext('2d');
let w, h, time = 0;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const stars = [];
for (let i = 0; i < 400; i++) {
  stars.push({
    x: Math.random() * 2 - 0.5,
    y: Math.random() * 2 - 0.5,
    z: Math.random(),
    size: 0.5 + Math.random() * 1.5
  });
}

const radarBlips = [];
for (let i = 0; i < 15; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 0.2 + Math.random() * 0.75;
  radarBlips.push({ angle, dist, blink: Math.random() * Math.PI * 2, speed: (Math.random() - 0.5) * 0.002 });
}

const telemetryData = [];
for (let i = 0; i < 20; i++) {
  telemetryData.push({ label: genLabel(), value: Math.random(), target: Math.random(), changeRate: 0.001 + Math.random() * 0.005 });
}

function genLabel() {
  const prefixes = ['SYS', 'NAV', 'THR', 'OXY', 'PWR', 'COM', 'RAD', 'GRV', 'FUL', 'TMP', 'PRS', 'VEL'];
  const suffixes = ['_A', '_B', '_X', '_Z', '-01', '-02', '-MN', '-AX'];
  return prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawStarfield() {
  const vpCx = w * 0.5;
  const vpCy = h * 0.45;
  const vpR = Math.min(w, h) * CONFIG.viewportSize;

  ctx.save();
  ctx.beginPath();
  ctx.arc(vpCx, vpCy, vpR, 0, Math.PI * 2);
  ctx.clip();

  ctx.fillStyle = '#020408';
  ctx.fill();

  const count = Math.min(CONFIG.starCount, stars.length);
  for (let i = 0; i < count; i++) {
    const s = stars[i];
    s.z -= CONFIG.starSpeed * 0.002;
    if (s.z <= 0) { s.z = 1; s.x = Math.random() * 2 - 0.5; s.y = Math.random() * 2 - 0.5; }
    const sx = vpCx + (s.x / s.z) * vpR * 0.4;
    const sy = vpCy + (s.y / s.z) * vpR * 0.4;
    const sz = s.size * (1 - s.z) * 2;
    const brightness = (1 - s.z);
    ctx.fillStyle = `rgba(200, 220, 255, ${brightness})`;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.3, sz), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = hexToRgba(CONFIG.primaryColor, 0.4);
  ctx.lineWidth = CONFIG.hudLineWidth * 2;
  ctx.shadowColor = CONFIG.primaryColor;
  ctx.shadowBlur = CONFIG.glowStrength * 10;
  ctx.beginPath();
  ctx.arc(vpCx, vpCy, vpR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = hexToRgba(CONFIG.primaryColor, 0.15);
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(vpCx - vpR, vpCy); ctx.lineTo(vpCx + vpR, vpCy);
  ctx.moveTo(vpCx, vpCy - vpR); ctx.lineTo(vpCx, vpCy + vpR);
  ctx.stroke();
}

function drawRadar() {
  const rx = w * 0.12;
  const ry = h * 0.78;
  const rr = Math.min(w, h) * CONFIG.radarRadius;
  const sweepAngle = time * CONFIG.radarSweepSpeed * Math.PI;

  ctx.strokeStyle = hexToRgba(CONFIG.secondaryColor, 0.3);
  ctx.lineWidth = CONFIG.hudLineWidth;
  ctx.beginPath();
  ctx.arc(rx, ry, rr, 0, Math.PI * 2);
  ctx.stroke();

  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(rx, ry, rr * (i / 3), 0, Math.PI * 2);
    ctx.strokeStyle = hexToRgba(CONFIG.secondaryColor, 0.1);
    ctx.stroke();
  }

  ctx.strokeStyle = hexToRgba(CONFIG.secondaryColor, 0.08);
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + Math.cos(a) * rr, ry + Math.sin(a) * rr);
    ctx.stroke();
  }

  const grad = ctx.createConicalGradient ? null : null;
  ctx.save();
  ctx.translate(rx, ry);
  ctx.rotate(sweepAngle);
  const sweepGrad = ctx.createLinearGradient(0, 0, rr, 0);
  sweepGrad.addColorStop(0, hexToRgba(CONFIG.secondaryColor, 0));
  sweepGrad.addColorStop(1, hexToRgba(CONFIG.secondaryColor, 0.6));
  ctx.fillStyle = sweepGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, rr, -0.4, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const blipCount = Math.min(CONFIG.radarBlips, radarBlips.length);
  for (let i = 0; i < blipCount; i++) {
    const b = radarBlips[i];
    b.angle += b.speed;
    b.blink += 0.05;
    const angleDiff = ((sweepAngle % (Math.PI * 2)) - b.angle + Math.PI * 4) % (Math.PI * 2);
    const fade = angleDiff < 1.5 ? Math.max(0, 1 - angleDiff / 1.5) : 0;
    if (fade > 0) {
      const bx = rx + Math.cos(b.angle) * rr * b.dist;
      const by = ry + Math.sin(b.angle) * rr * b.dist;
      ctx.fillStyle = hexToRgba(CONFIG.secondaryColor, fade * 0.9);
      ctx.beginPath();
      ctx.arc(bx, by, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawTelemetry() {
  const sx = w * 0.72;
  const sy = h * 0.15;
  const lineH = 18;
  const barW = 120;
  const count = Math.min(CONFIG.dataStreamLines, telemetryData.length);

  ctx.font = '11px Courier New';
  for (let i = 0; i < count; i++) {
    const t = telemetryData[i];
    t.value += (t.target - t.value) * 0.02;
    if (Math.random() < 0.01) t.target = Math.random();

    const y = sy + i * lineH;
    const isWarning = t.value > 0.85;
    const color = isWarning ? CONFIG.warningColor : CONFIG.primaryColor;

    ctx.fillStyle = hexToRgba(color, 0.7);
    ctx.fillText(t.label, sx, y);
    ctx.fillText((t.value * 100).toFixed(1) + '%', sx + barW + 55, y);

    ctx.fillStyle = hexToRgba(color, 0.1);
    ctx.fillRect(sx + 65, y - 9, barW, 10);
    ctx.fillStyle = hexToRgba(color, 0.5);
    ctx.fillRect(sx + 65, y - 9, barW * t.value, 10);

    if (isWarning && Math.sin(time * CONFIG.alertFlashSpeed * 6) > 0) {
      ctx.fillStyle = hexToRgba(CONFIG.warningColor, 0.15);
      ctx.fillRect(sx - 5, y - 12, barW + 130, 15);
    }
  }
}

function drawStatusPanels() {
  const panelW = 90;
  const panelH = 50;
  const startX = w * 0.3;
  const y = h * 0.88;
  const statuses = ['NOMINAL', 'ACTIVE', 'STANDBY', 'ONLINE', 'SYNC', 'READY'];
  const count = CONFIG.statusPanelCount;

  for (let i = 0; i < count; i++) {
    const x = startX + i * (panelW + 15);
    const active = Math.sin(time * 1.5 + i * 1.2) > -0.3;
    const color = active ? CONFIG.secondaryColor : CONFIG.warningColor;

    ctx.strokeStyle = hexToRgba(color, 0.4);
    ctx.lineWidth = CONFIG.hudLineWidth;
    ctx.strokeRect(x, y, panelW, panelH);

    ctx.fillStyle = hexToRgba(color, 0.05);
    ctx.fillRect(x, y, panelW, panelH);

    ctx.font = '9px Courier New';
    ctx.fillStyle = hexToRgba(color, 0.5);
    ctx.fillText('SYS-' + (i + 1).toString().padStart(2, '0'), x + 5, y + 14);

    ctx.font = 'bold 11px Courier New';
    ctx.fillStyle = hexToRgba(color, 0.9);
    ctx.fillText(statuses[i % statuses.length], x + 5, y + 32);

    const dotColor = active ? CONFIG.secondaryColor : CONFIG.warningColor;
    ctx.fillStyle = hexToRgba(dotColor, 0.8 + Math.sin(time * 4 + i) * 0.2);
    ctx.beginPath();
    ctx.arc(x + panelW - 10, y + 10, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawOrbitRings() {
  const cx = w * 0.5;
  const cy = h * 0.45;
  const baseR = Math.min(w, h) * CONFIG.viewportSize;
  for (let i = 0; i < CONFIG.orbitRingCount; i++) {
    const r = baseR + 20 + i * 25;
    const dashOffset = time * (20 + i * 10);
    ctx.setLineDash([4, 8 + i * 4]);
    ctx.lineDashOffset = dashOffset;
    ctx.strokeStyle = hexToRgba(CONFIG.primaryColor, 0.12 - i * 0.03);
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    const dotAngle = time * (0.5 - i * 0.15);
    const dx = cx + Math.cos(dotAngle) * r;
    const dy = cy + Math.sin(dotAngle) * r;
    ctx.setLineDash([]);
    ctx.fillStyle = hexToRgba(CONFIG.primaryColor, 0.7);
    ctx.beginPath();
    ctx.arc(dx, dy, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.setLineDash([]);
}

function drawScanLines() {
  ctx.fillStyle = `rgba(0,0,0,${CONFIG.scanLineOpacity})`;
  for (let y = 0; y < h; y += 3) {
    ctx.fillRect(0, y, w, 1);
  }
}

function drawGrid() {
  ctx.strokeStyle = CONFIG.gridColor;
  ctx.lineWidth = 0.5;
  const gs = 50;
  for (let x = 0; x < w; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
}

function drawCornerBrackets() {
  const m = 15;
  const s = 30;
  const color = hexToRgba(CONFIG.primaryColor, 0.4);
  ctx.strokeStyle = color;
  ctx.lineWidth = CONFIG.hudLineWidth;
  [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]].forEach(([x, y, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(x, y + dy * s); ctx.lineTo(x, y); ctx.lineTo(x + dx * s, y);
    ctx.stroke();
  });
}

function drawTimestamp() {
  const t = new Date();
  const ts = t.toISOString().replace('T', ' ').substring(0, 19);
  ctx.font = '10px Courier New';
  ctx.fillStyle = hexToRgba(CONFIG.primaryColor, 0.5);
  ctx.fillText('UTC ' + ts, 15, h - 10);
  ctx.fillText('FRM ' + Math.floor(time * 60).toString().padStart(8, '0'), w - 150, h - 10);
}

function animate() {
  time += (1 / 60) * CONFIG.telemetrySpeed;
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, w, h);
  drawGrid();
  drawStarfield();
  drawOrbitRings();
  drawRadar();
  drawTelemetry();
  drawStatusPanels();
  drawCornerBrackets();
  drawTimestamp();
  drawScanLines();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>

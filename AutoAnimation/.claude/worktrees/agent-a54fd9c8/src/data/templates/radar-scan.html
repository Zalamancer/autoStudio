<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Scan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="radar"></canvas>
<script>
const CONFIG = {
  sweepSpeed: 1.2,
  blipCount: 8,
  rangeRings: 4,
  sweepColor: '#00ff44',
  bgColor: '#0a1a0a',
  blipColor: '#00ff88',
  radius: 0.42
};

const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, radarRadius;
let sweepAngle = 0;
let blips = [];
let lastTime = 0;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  radarRadius = Math.min(width, height) * CONFIG.radius;
  generateBlips();
}

function generateBlips() {
  blips = [];
  for (let i = 0; i < CONFIG.blipCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 0.15 + Math.random() * 0.8;
    blips.push({
      angle: angle,
      dist: dist,
      x: cx + Math.cos(angle) * dist * radarRadius,
      y: cy + Math.sin(angle) * dist * radarRadius,
      alpha: 0,
      lastHit: -10,
      size: 2 + Math.random() * 3,
      pulsePhase: Math.random() * Math.PI * 2
    });
  }
}

function drawBackground() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, width, height);

  // Subtle grid
  ctx.strokeStyle = 'rgba(0, 255, 68, 0.04)';
  ctx.lineWidth = 1;
  const gridSize = 30;
  for (let x = cx % gridSize; x < width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
  }
  for (let y = cy % gridSize; y < height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }
}

function drawRangeRings() {
  for (let i = 1; i <= CONFIG.rangeRings; i++) {
    const r = (i / CONFIG.rangeRings) * radarRadius;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 255, 68, 0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Distance labels
    const dist = Math.round((i / CONFIG.rangeRings) * 100);
    ctx.fillStyle = 'rgba(0, 255, 68, 0.4)';
    ctx.font = `${Math.max(10, radarRadius * 0.045)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`${dist}km`, cx + r + 5, cy - 4);
  }
}

function drawCompass() {
  const dirs = [
    { label: 'N', angle: -Math.PI / 2 },
    { label: 'E', angle: 0 },
    { label: 'S', angle: Math.PI / 2 },
    { label: 'W', angle: Math.PI }
  ];
  const subDirs = [
    { label: 'NE', angle: -Math.PI / 4 },
    { label: 'SE', angle: Math.PI / 4 },
    { label: 'SW', angle: Math.PI * 3 / 4 },
    { label: 'NW', angle: -Math.PI * 3 / 4 }
  ];

  const fontSize = Math.max(12, radarRadius * 0.065);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  dirs.forEach(d => {
    const x = cx + Math.cos(d.angle) * (radarRadius + fontSize * 1.5);
    const y = cy + Math.sin(d.angle) * (radarRadius + fontSize * 1.5);
    ctx.fillStyle = 'rgba(0, 255, 68, 0.7)';
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.fillText(d.label, x, y);
  });

  subDirs.forEach(d => {
    const x = cx + Math.cos(d.angle) * (radarRadius + fontSize * 1.2);
    const y = cy + Math.sin(d.angle) * (radarRadius + fontSize * 1.2);
    ctx.fillStyle = 'rgba(0, 255, 68, 0.35)';
    ctx.font = `${fontSize * 0.7}px monospace`;
    ctx.fillText(d.label, x, y);
  });

  // Tick marks
  for (let i = 0; i < 72; i++) {
    const angle = (i / 72) * Math.PI * 2;
    const isMajor = i % 18 === 0;
    const isMid = i % 9 === 0;
    const innerR = radarRadius - (isMajor ? 12 : isMid ? 8 : 4);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
    ctx.lineTo(cx + Math.cos(angle) * radarRadius, cy + Math.sin(angle) * radarRadius);
    ctx.strokeStyle = isMajor ? 'rgba(0, 255, 68, 0.5)' : 'rgba(0, 255, 68, 0.15)';
    ctx.lineWidth = isMajor ? 2 : 1;
    ctx.stroke();
  }
}

function drawCrosshair() {
  ctx.strokeStyle = 'rgba(0, 255, 68, 0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);

  ctx.beginPath(); ctx.moveTo(cx - radarRadius, cy); ctx.lineTo(cx + radarRadius, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - radarRadius); ctx.lineTo(cx, cy + radarRadius); ctx.stroke();

  ctx.setLineDash([]);

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.sweepColor;
  ctx.fill();

  // Center ring
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 255, 68, 0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawSweep(time) {
  // Sweep trail (fading arc)
  const trailLength = Math.PI * 0.6;
  const steps = 60;
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const angle = sweepAngle - t * trailLength;
    const alpha = (1 - t) * 0.3;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radarRadius, angle - 0.02, angle + 0.02);
    ctx.closePath();
    ctx.fillStyle = `rgba(0, 255, 68, ${alpha})`;
    ctx.fill();
  }

  // Main sweep line
  const endX = cx + Math.cos(sweepAngle) * radarRadius;
  const endY = cy + Math.sin(sweepAngle) * radarRadius;

  const gradient = ctx.createLinearGradient(cx, cy, endX, endY);
  gradient.addColorStop(0, 'rgba(0, 255, 68, 0.1)');
  gradient.addColorStop(0.5, CONFIG.sweepColor);
  gradient.addColorStop(1, CONFIG.sweepColor);

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(endX, endY);
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Sweep tip glow
  ctx.beginPath();
  ctx.arc(endX, endY, 4, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.sweepColor;
  ctx.shadowColor = CONFIG.sweepColor;
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBlips(time) {
  blips.forEach(blip => {
    // Check if sweep just passed this blip
    const blipAngleNorm = ((blip.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const sweepNorm = ((sweepAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const diff = Math.abs(sweepNorm - blipAngleNorm);
    if (diff < 0.15 || diff > Math.PI * 2 - 0.15) {
      blip.lastHit = time;
      blip.alpha = 1.0;
    }

    // Fade out after sweep passes
    const elapsed = (time - blip.lastHit) / 1000;
    blip.alpha = Math.max(0, 1.0 - elapsed * 0.4);

    if (blip.alpha <= 0) return;

    const pulse = 1 + Math.sin(time * 0.003 + blip.pulsePhase) * 0.3;

    // Blip glow
    const glowGradient = ctx.createRadialGradient(blip.x, blip.y, 0, blip.x, blip.y, blip.size * 4 * pulse);
    glowGradient.addColorStop(0, `rgba(0, 255, 136, ${blip.alpha * 0.4})`);
    glowGradient.addColorStop(1, 'rgba(0, 255, 136, 0)');
    ctx.beginPath();
    ctx.arc(blip.x, blip.y, blip.size * 4 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = glowGradient;
    ctx.fill();

    // Blip core
    ctx.beginPath();
    ctx.arc(blip.x, blip.y, blip.size * pulse, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.blipColor;
    ctx.globalAlpha = blip.alpha;
    ctx.shadowColor = CONFIG.blipColor;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // Blip ring
    if (blip.alpha > 0.5) {
      const ringExpand = (1 - (blip.alpha - 0.5) * 2) * 20;
      ctx.beginPath();
      ctx.arc(blip.x, blip.y, blip.size + ringExpand, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 255, 136, ${(blip.alpha - 0.5) * 0.5})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

function drawOuterRing() {
  ctx.beginPath();
  ctx.arc(cx, cy, radarRadius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 255, 68, 0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Outer glow
  ctx.beginPath();
  ctx.arc(cx, cy, radarRadius + 1, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 255, 68, 0.15)';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function drawHUD(time) {
  const fontSize = Math.max(10, radarRadius * 0.04);
  ctx.font = `${fontSize}px monospace`;
  ctx.fillStyle = 'rgba(0, 255, 68, 0.5)';

  const bearing = Math.round(((sweepAngle * 180 / Math.PI) + 90 + 360) % 360);
  const topY = cy - radarRadius - fontSize * 3;
  const bottomY = cy + radarRadius + fontSize * 3;

  ctx.textAlign = 'center';
  ctx.fillText(`BRG ${String(bearing).padStart(3, '0')}°  |  RNG ${CONFIG.rangeRings * 25}km  |  TGT ${CONFIG.blipCount}`, cx, topY);

  const elapsed = Math.floor(time / 1000);
  const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const secs = String(elapsed % 60).padStart(2, '0');
  ctx.fillText(`SCAN ACTIVE  |  ${mins}:${secs}  |  MODE: SEARCH`, cx, bottomY);
}

function drawScanline(time) {
  // Subtle horizontal scan effect
  const y = (time * 0.05) % height;
  ctx.fillStyle = 'rgba(0, 255, 68, 0.02)';
  ctx.fillRect(0, y - 2, width, 4);
}

function animate(time) {
  if (!lastTime) lastTime = time;
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  sweepAngle += dt * CONFIG.sweepSpeed * Math.PI;

  drawBackground();
  drawScanline(time);

  // Clip to radar circle for sweep and blips
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radarRadius, 0, Math.PI * 2);
  ctx.clip();

  drawSweep(time);
  drawBlips(time);

  ctx.restore();

  drawRangeRings();
  drawCrosshair();
  drawCompass();
  drawOuterRing();
  drawHUD(time);

  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    resize();
  }
});

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>

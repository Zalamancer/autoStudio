<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Transformation Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1c1c2e;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'STIX Two Text', 'Times New Roman', serif;
  }
  svg { display: block; width: 100%; height: 100%; }

  #math-overlay {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 10;
    pointer-events: none;
    text-align: right;
  }
  #math-overlay .katex { color: #eee; }
  .matrix-display {
    opacity: 0;
    transition: opacity 0.8s ease;
    margin-bottom: 8px;
  }
  .matrix-display.visible { opacity: 1; }

  .det-display {
    opacity: 0;
    transition: opacity 0.8s ease;
    margin-bottom: 6px;
  }
  .det-display.visible { opacity: 1; }

  .eigen-display {
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .eigen-display.visible { opacity: 1; }

  .info-label {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2px;
    font-family: 'STIX Two Text', serif;
  }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="math-overlay">
  <div id="matrix-box" class="matrix-display"></div>
  <div id="det-box" class="det-display"></div>
  <div id="eigen-box" class="eigen-display"></div>
</div>
<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  matrix: [[2, 1], [0, 1.5]],
  shape: 'unit-circle',
  customPoints: null,
  xRange: [-4, 4],
  yRange: [-4, 4],
  gridSpacing: 1,
  showGrid: true,
  showTransformedGrid: true,
  showOriginal: true,
  showEigenvectors: true,
  showDeterminant: true,
  showEquation: true,
  showBasisVectors: true,
  backgroundColor: '#1c1c2e',
  originalColor: '#58C4DD',
  transformedColor: '#FC6255',
  basisIColor: '#FFFF00',
  basisJColor: '#83C167',
  eigenvectorColor: '#FF862F',
  gridColor: 'rgba(88,196,221,0.07)',
  transformedGridColor: 'rgba(252,98,85,0.12)',
  transformDuration: 3000,
  staggerDelay: 600
};
// =========================================

const svg = d3.select('#viz');
let W, H;
const margin = { top: 30, right: 30, bottom: 30, left: 30 };

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  svg.attr('width', W).attr('height', H);
}
window.addEventListener('resize', () => { resize(); rebuild(); });
resize();

let xScale, yScale;

function buildScales() {
  xScale = d3.scaleLinear().domain(CONFIG.xRange).range([margin.left, W - margin.right]);
  yScale = d3.scaleLinear().domain(CONFIG.yRange).range([H - margin.bottom, margin.top]);
}

function matMul(m, v) {
  return [m[0][0]*v[0] + m[0][1]*v[1], m[1][0]*v[0] + m[1][1]*v[1]];
}

function det(m) { return m[0][0]*m[1][1] - m[0][1]*m[1][0]; }

function eigenvalues(m) {
  const tr = m[0][0] + m[1][1];
  const d = det(m);
  const disc = tr*tr - 4*d;
  if (disc < 0) return null;
  const sq = Math.sqrt(disc);
  return [(tr+sq)/2, (tr-sq)/2];
}

function eigenvector(m, lam) {
  const a = m[0][0]-lam, b = m[0][1], c = m[1][0], d = m[1][1]-lam;
  let vx, vy;
  if (Math.abs(b) > 1e-10) { vx = -b; vy = a; }
  else if (Math.abs(d) > 1e-10) { vx = -d; vy = c; }
  else { vx = 1; vy = 0; }
  const len = Math.sqrt(vx*vx + vy*vy);
  return len > 1e-10 ? [vx/len, vy/len] : null;
}

function getShapePoints(n) {
  const pts = [];
  if (CONFIG.shape === 'unit-circle') {
    for (let i = 0; i <= n; i++) {
      const t = (i/n) * Math.PI * 2;
      pts.push([Math.cos(t), Math.sin(t)]);
    }
  } else if (CONFIG.shape === 'unit-square') {
    const s = n/4;
    for (let i = 0; i <= s; i++) pts.push([-1+2*i/s, -1]);
    for (let i = 0; i <= s; i++) pts.push([1, -1+2*i/s]);
    for (let i = 0; i <= s; i++) pts.push([1-2*i/s, 1]);
    for (let i = 0; i <= s; i++) pts.push([-1, 1-2*i/s]);
  } else if (CONFIG.shape === 'house') {
    pts.push([-1,-1],[1,-1],[1,0.5],[0,1.2],[-1,0.5],[-1,-1]);
  } else if (CONFIG.shape === 'custom-points' && CONFIG.customPoints) {
    CONFIG.customPoints.forEach(p => pts.push([p[0],p[1]]));
    if (pts.length > 0) pts.push(pts[0]);
  }
  return pts;
}

function renderKatex() {
  const m = CONFIG.matrix;
  const a = m[0][0], b = m[0][1], c = m[1][0], d = m[1][1];

  if (CONFIG.showEquation) {
    const matTex = `A = \\begin{bmatrix} ${a} & ${b} \\\\ ${c} & ${d} \\end{bmatrix}`;
    const matEl = document.getElementById('matrix-box');
    matEl.innerHTML = '';
    katex.render(matTex, matEl, { displayMode: true, throwOnError: false });
    setTimeout(() => matEl.classList.add('visible'), CONFIG.staggerDelay);
  }

  if (CONFIG.showDeterminant) {
    const dv = det(m);
    const detTex = `\\det(A) = ${dv % 1 === 0 ? dv : dv.toFixed(2)}`;
    const detEl = document.getElementById('det-box');
    const label = document.createElement('div');
    label.className = 'info-label';
    label.textContent = Math.abs(dv) < 0.01 ? 'collapses space' : dv < 0 ? 'flips orientation' : `scales area ×${Math.abs(dv).toFixed(1)}`;
    detEl.innerHTML = '';
    katex.render(detTex, detEl, { displayMode: false, throwOnError: false });
    detEl.appendChild(label);
    setTimeout(() => detEl.classList.add('visible'), CONFIG.transformDuration + CONFIG.staggerDelay * 3);
  }

  if (CONFIG.showEigenvectors) {
    const evals = eigenvalues(m);
    if (evals) {
      const fmt = v => v % 1 === 0 ? v.toString() : v.toFixed(2);
      const eigenTex = `\\lambda_1 = ${fmt(evals[0])},\\quad \\lambda_2 = ${fmt(evals[1])}`;
      const eigenEl = document.getElementById('eigen-box');
      eigenEl.innerHTML = '';
      katex.render(eigenTex, eigenEl, { displayMode: false, throwOnError: false });
      setTimeout(() => eigenEl.classList.add('visible'), CONFIG.transformDuration + CONFIG.staggerDelay * 4);
    }
  }
}

function rebuild() {
  svg.selectAll('*').remove();
  document.body.style.background = CONFIG.backgroundColor;
  buildScales();

  // Defs
  const defs = svg.append('defs');

  // Glow filters
  const glow = defs.append('filter').attr('id', 'glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  glow.append('feGaussianBlur').attr('stdDeviation','3').attr('result','blur');
  const mg = glow.append('feMerge');
  mg.append('feMergeNode').attr('in','blur');
  mg.append('feMergeNode').attr('in','SourceGraphic');

  const glowBig = defs.append('filter').attr('id','glow-big').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  glowBig.append('feGaussianBlur').attr('stdDeviation','5').attr('result','blur');
  const mg2 = glowBig.append('feMerge');
  mg2.append('feMergeNode').attr('in','blur');
  mg2.append('feMergeNode').attr('in','SourceGraphic');

  // Arrow markers
  ['basis-i','basis-j','eigen'].forEach((name, i) => {
    const colors = [CONFIG.basisIColor, CONFIG.basisJColor, CONFIG.eigenvectorColor];
    defs.append('marker').attr('id','arrow-'+name)
      .attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
      .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto-start-reverse')
      .append('path').attr('d','M 0 1 L 10 5 L 0 9 z').attr('fill', colors[i]);
  });

  const gGrid = svg.append('g');
  const gTransGrid = svg.append('g');
  const gAxes = svg.append('g');
  const gShape = svg.append('g');
  const gBasis = svg.append('g');
  const gEigen = svg.append('g');
  const gLabels = svg.append('g');

  const m = CONFIG.matrix;
  const dur = CONFIG.transformDuration;
  const sd = CONFIG.staggerDelay;

  // === GRID ===
  if (CONFIG.showGrid) {
    const sp = CONFIG.gridSpacing;
    for (let x = CONFIG.xRange[0]; x <= CONFIG.xRange[1]; x += sp) {
      gGrid.append('line')
        .attr('x1', xScale(x)).attr('y1', yScale(CONFIG.yRange[0]))
        .attr('x2', xScale(x)).attr('y2', yScale(CONFIG.yRange[1]))
        .attr('stroke', CONFIG.gridColor).attr('stroke-width', 0.5)
        .style('opacity', 0)
        .transition().duration(400).delay(Math.abs(x)*30).style('opacity', 1);
    }
    for (let y = CONFIG.yRange[0]; y <= CONFIG.yRange[1]; y += sp) {
      gGrid.append('line')
        .attr('x1', xScale(CONFIG.xRange[0])).attr('y1', yScale(y))
        .attr('x2', xScale(CONFIG.xRange[1])).attr('y2', yScale(y))
        .attr('stroke', CONFIG.gridColor).attr('stroke-width', 0.5)
        .style('opacity', 0)
        .transition().duration(400).delay(Math.abs(y)*30).style('opacity', 1);
    }
  }

  // === AXES ===
  const y0 = yScale(0), x0 = xScale(0);
  gAxes.append('line')
    .attr('x1', xScale(CONFIG.xRange[0])).attr('y1', y0)
    .attr('x2', xScale(CONFIG.xRange[0])).attr('y2', y0)
    .attr('stroke', 'rgba(255,255,255,0.4)').attr('stroke-width', 1.2)
    .transition().duration(500).delay(200)
    .attr('x2', xScale(CONFIG.xRange[1]));

  gAxes.append('line')
    .attr('x1', x0).attr('y1', yScale(CONFIG.yRange[0]))
    .attr('x2', x0).attr('y2', yScale(CONFIG.yRange[0]))
    .attr('stroke', 'rgba(255,255,255,0.4)').attr('stroke-width', 1.2)
    .transition().duration(500).delay(200)
    .attr('y2', yScale(CONFIG.yRange[1]));

  // Tick labels
  const sp = CONFIG.gridSpacing;
  for (let x = Math.ceil(CONFIG.xRange[0]/sp)*sp; x <= CONFIG.xRange[1]; x += sp) {
    if (Math.abs(x) < 0.01) continue;
    gAxes.append('text')
      .attr('x', xScale(x)).attr('y', y0 + 16)
      .attr('text-anchor','middle').attr('fill','rgba(255,255,255,0.25)')
      .attr('font-size','10px').text(x)
      .style('opacity',0).transition().delay(400+Math.abs(x)*20).duration(300).style('opacity',1);
  }
  for (let y = Math.ceil(CONFIG.yRange[0]/sp)*sp; y <= CONFIG.yRange[1]; y += sp) {
    if (Math.abs(y) < 0.01) continue;
    gAxes.append('text')
      .attr('x', x0 - 10).attr('y', yScale(y) + 4)
      .attr('text-anchor','end').attr('fill','rgba(255,255,255,0.25)')
      .attr('font-size','10px').text(y)
      .style('opacity',0).transition().delay(400+Math.abs(y)*20).duration(300).style('opacity',1);
  }

  // === SHAPE ===
  const pts = getShapePoints(160);
  const line = d3.line().x(d => xScale(d[0])).y(d => yScale(d[1]));

  // Original shape (dashes after transform starts)
  if (CONFIG.showOriginal) {
    const origPath = gShape.append('path')
      .datum(pts).attr('d', line)
      .attr('fill', 'none')
      .attr('stroke', CONFIG.originalColor)
      .attr('stroke-width', 2)
      .attr('filter', 'url(#glow)');

    const origLen = origPath.node().getTotalLength();
    origPath.attr('stroke-dasharray', origLen).attr('stroke-dashoffset', origLen)
      .transition().duration(800).delay(sd).ease(d3.easeCubicInOut)
      .attr('stroke-dashoffset', 0);

    // Fade to dashed during transform
    origPath.transition().delay(sd * 3).duration(600)
      .attr('stroke-dasharray', '4,4')
      .attr('opacity', 0.3);

    // Label
    gLabels.append('text')
      .attr('x', xScale(CONFIG.xRange[0] + 0.4)).attr('y', yScale(CONFIG.yRange[0] + 0.6))
      .attr('fill', CONFIG.originalColor).attr('font-size','12px').attr('opacity',0.6)
      .attr('font-family',"'STIX Two Text', serif")
      .text(CONFIG.shape === 'unit-circle' ? 'Unit Circle' :
            CONFIG.shape === 'unit-square' ? 'Unit Square' : 'Original')
      .style('opacity',0).transition().delay(sd*1.5).duration(400).style('opacity',0.5);
  }

  // Transformed shape
  const transformedPts = pts.map(p => matMul(m, p));
  const transformedPath = gShape.append('path')
    .datum(pts).attr('d', line)
    .attr('fill', CONFIG.transformedColor)
    .attr('fill-opacity', 0)
    .attr('stroke', CONFIG.transformedColor)
    .attr('stroke-width', 2.5)
    .attr('filter', 'url(#glow-big)');

  // Animate: morph from original to transformed
  transformedPath.transition()
    .delay(sd * 3).duration(dur)
    .ease(d3.easeCubicInOut)
    .attr('d', line(transformedPts))
    .attr('fill-opacity', 0.05);

  // Label
  gLabels.append('text')
    .attr('x', xScale(CONFIG.xRange[0] + 0.4)).attr('y', yScale(CONFIG.yRange[0] + 1.0))
    .attr('fill', CONFIG.transformedColor).attr('font-size','12px')
    .attr('font-family',"'STIX Two Text', serif")
    .text('Transformed')
    .style('opacity',0).transition().delay(sd*3 + dur*0.5).duration(400).style('opacity',0.6);

  // === TRANSFORMED GRID ===
  if (CONFIG.showTransformedGrid) {
    const gridSteps = 40;
    for (let x = CONFIG.xRange[0]; x <= CONFIG.xRange[1]; x += sp) {
      const origPts = [];
      const transPts = [];
      for (let i = 0; i <= gridSteps; i++) {
        const y = CONFIG.yRange[0] + (CONFIG.yRange[1]-CONFIG.yRange[0])*i/gridSteps;
        origPts.push([x, y]);
        transPts.push(matMul(m, [x, y]));
      }
      const gridLine = gTransGrid.append('path')
        .datum(origPts).attr('d', line)
        .attr('fill','none').attr('stroke', CONFIG.transformedGridColor).attr('stroke-width', 0.6)
        .style('opacity', 0);

      gridLine.transition().delay(sd*3).duration(200).style('opacity', 1);
      gridLine.transition().delay(sd*3).duration(dur).ease(d3.easeCubicInOut)
        .attr('d', line(transPts));
    }
    for (let y = CONFIG.yRange[0]; y <= CONFIG.yRange[1]; y += sp) {
      const origPts = [];
      const transPts = [];
      for (let i = 0; i <= gridSteps; i++) {
        const x = CONFIG.xRange[0] + (CONFIG.xRange[1]-CONFIG.xRange[0])*i/gridSteps;
        origPts.push([x, y]);
        transPts.push(matMul(m, [x, y]));
      }
      const gridLine = gTransGrid.append('path')
        .datum(origPts).attr('d', line)
        .attr('fill','none').attr('stroke', CONFIG.transformedGridColor).attr('stroke-width', 0.6)
        .style('opacity', 0);

      gridLine.transition().delay(sd*3).duration(200).style('opacity', 1);
      gridLine.transition().delay(sd*3).duration(dur).ease(d3.easeCubicInOut)
        .attr('d', line(transPts));
    }
  }

  // === BASIS VECTORS ===
  if (CONFIG.showBasisVectors) {
    const iHat = [1,0], jHat = [0,1];
    const iTrans = matMul(m, iHat), jTrans = matMul(m, jHat);

    // i-hat
    const iLine = gBasis.append('line')
      .attr('x1', x0).attr('y1', y0)
      .attr('x2', x0).attr('y2', y0)
      .attr('stroke', CONFIG.basisIColor).attr('stroke-width', 3)
      .attr('marker-end','url(#arrow-basis-i)')
      .attr('filter','url(#glow)');

    iLine.transition().delay(sd*2).duration(500).ease(d3.easeCubicOut)
      .attr('x2', xScale(1)).attr('y2', yScale(0));

    iLine.transition().delay(sd*3).duration(dur).ease(d3.easeCubicInOut)
      .attr('x2', xScale(iTrans[0])).attr('y2', yScale(iTrans[1]));

    gBasis.append('text')
      .attr('x', xScale(0.5)).attr('y', yScale(0) - 10)
      .attr('fill', CONFIG.basisIColor).attr('font-size','14px')
      .attr('font-weight','bold').attr('text-anchor','center')
      .attr('font-family',"'STIX Two Text', serif")
      .text('î')
      .style('opacity',0).transition().delay(sd*2 + 400).duration(300).style('opacity',1);

    // j-hat
    const jLine = gBasis.append('line')
      .attr('x1', x0).attr('y1', y0)
      .attr('x2', x0).attr('y2', y0)
      .attr('stroke', CONFIG.basisJColor).attr('stroke-width', 3)
      .attr('marker-end','url(#arrow-basis-j)')
      .attr('filter','url(#glow)');

    jLine.transition().delay(sd*2 + 200).duration(500).ease(d3.easeCubicOut)
      .attr('x2', xScale(0)).attr('y2', yScale(1));

    jLine.transition().delay(sd*3).duration(dur).ease(d3.easeCubicInOut)
      .attr('x2', xScale(jTrans[0])).attr('y2', yScale(jTrans[1]));

    gBasis.append('text')
      .attr('x', xScale(0) + 14).attr('y', yScale(0.5))
      .attr('fill', CONFIG.basisJColor).attr('font-size','14px')
      .attr('font-weight','bold')
      .attr('font-family',"'STIX Two Text', serif")
      .text('ĵ')
      .style('opacity',0).transition().delay(sd*2 + 600).duration(300).style('opacity',1);
  }

  // === EIGENVECTORS ===
  if (CONFIG.showEigenvectors) {
    const evals = eigenvalues(m);
    if (evals) {
      const extent = (CONFIG.xRange[1] - CONFIG.xRange[0]) * 0.35;
      evals.forEach((lam, i) => {
        const ev = eigenvector(m, lam);
        if (!ev) return;

        const from = [-ev[0]*extent, -ev[1]*extent];
        const to = [ev[0]*extent, ev[1]*extent];

        // Dashed line
        gEigen.append('line')
          .attr('x1', xScale(from[0])).attr('y1', yScale(from[1]))
          .attr('x2', xScale(from[0])).attr('y2', yScale(from[1]))
          .attr('stroke', CONFIG.eigenvectorColor).attr('stroke-width', 1.5)
          .attr('stroke-dasharray','8,4').attr('opacity', 0.6)
          .attr('filter','url(#glow)')
          .transition().delay(sd*3 + dur + sd*i).duration(600).ease(d3.easeCubicOut)
          .attr('x2', xScale(to[0])).attr('y2', yScale(to[1]));

        // Arrow portion
        gEigen.append('line')
          .attr('x1', x0).attr('y1', y0)
          .attr('x2', x0).attr('y2', y0)
          .attr('stroke', CONFIG.eigenvectorColor).attr('stroke-width', 2)
          .attr('marker-end','url(#arrow-eigen)')
          .transition().delay(sd*3 + dur + sd*i + 200).duration(500).ease(d3.easeCubicOut)
          .attr('x2', xScale(ev[0]*extent*0.6)).attr('y2', yScale(ev[1]*extent*0.6));

        // Label
        const fmt = v => v % 1 === 0 ? v.toString() : v.toFixed(2);
        gEigen.append('text')
          .attr('x', xScale(ev[0]*extent*0.65) + 10)
          .attr('y', yScale(ev[1]*extent*0.65) - 10)
          .attr('fill', CONFIG.eigenvectorColor).attr('font-size','13px')
          .attr('font-family',"'STIX Two Text', serif")
          .attr('font-style','italic')
          .text(`λ${i+1} = ${fmt(lam)}`)
          .style('opacity',0)
          .transition().delay(sd*3 + dur + sd*i + 500).duration(400).style('opacity',1);
      });
    }
  }

  // Render KaTeX equations
  try { renderKatex(); } catch(e) { /* KaTeX not loaded yet */ }
}

// Frame sync
let totalFrames = 0;
window.__onFrameUpdate = function(frame, isPlaying, fps, total) {
  totalFrames = total || 1;
};

// Wait for KaTeX to load, then rebuild
if (typeof katex !== 'undefined') {
  rebuild();
} else {
  window.addEventListener('load', rebuild);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hologram Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  hologramColor: '#00ccff',
  scanlineOpacity: 0.15,
  glitchIntensity: 0.3,
  rotationSpeed: 0.01,
  cycleDuration: 14000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let startTime = performance.now();

// Scene objects
let globePoints = [];
let globeEdges = [];
let holoParticles = [];
let dataReadouts = [];
let touchRipples = [];
let glitchTimer = 0;
let glitchActive = false;
let glitchDuration = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initScene();
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function initScene() {
  globePoints = [];
  globeEdges = [];
  holoParticles = [];
  dataReadouts = [];
  touchRipples = [];

  // Generate wireframe globe points
  const latCount = 14;
  const lonCount = 20;
  const radius = Math.min(W, H) * 0.15;

  for (let lat = 0; lat <= latCount; lat++) {
    const theta = (lat / latCount) * Math.PI;
    for (let lon = 0; lon < lonCount; lon++) {
      const phi = (lon / lonCount) * Math.PI * 2;
      const x = radius * Math.sin(theta) * Math.cos(phi);
      const y = radius * Math.cos(theta);
      const z = radius * Math.sin(theta) * Math.sin(phi);
      globePoints.push({ x, y, z });
    }
  }

  // Generate edges (latitude lines)
  for (let lat = 0; lat <= latCount; lat++) {
    for (let lon = 0; lon < lonCount; lon++) {
      const i = lat * lonCount + lon;
      const nextLon = lat * lonCount + ((lon + 1) % lonCount);
      if (i < globePoints.length && nextLon < globePoints.length) {
        globeEdges.push([i, nextLon]);
      }
    }
  }

  // Generate edges (longitude lines)
  for (let lon = 0; lon < lonCount; lon++) {
    for (let lat = 0; lat < latCount; lat++) {
      const i = lat * lonCount + lon;
      const nextLat = (lat + 1) * lonCount + lon;
      if (i < globePoints.length && nextLat < globePoints.length) {
        globeEdges.push([i, nextLat]);
      }
    }
  }

  // Hologram particles
  for (let i = 0; i < 80; i++) {
    holoParticles.push(createHoloParticle(radius));
  }

  // Data readouts
  const labels = [
    'SYS.ONLINE', 'LAT: 41.40338', 'LON: 2.17403', 'FREQ: 2.4GHz',
    'SIGNAL: 98%', 'NODE: ACTIVE', 'UPLINK: OK', 'SCAN: 360',
    'DEPTH: 4.2km', 'TEMP: 22.4C', 'CONN: 1247', 'BW: 10Gbps'
  ];
  for (let i = 0; i < labels.length; i++) {
    const angle = (i / labels.length) * Math.PI * 2;
    const dist = radius * (1.4 + Math.random() * 0.8);
    dataReadouts.push({
      text: labels[i],
      angle,
      dist,
      fadePhase: Math.random() * Math.PI * 2,
      fadeSpeed: 0.0008 + Math.random() * 0.0008,
      yOffset: (Math.random() - 0.5) * radius * 0.8
    });
  }
}

function createHoloParticle(radius) {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.random() * radius * 1.2;
  const yOff = (Math.random() - 0.5) * radius * 2;
  return {
    angle,
    dist,
    y: yOff,
    speed: (Math.random() - 0.5) * 0.02,
    ySpeed: (Math.random() - 0.5) * 0.3,
    size: 0.5 + Math.random() * 1.5,
    opacity: 0.2 + Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2
  };
}

function rotateY(point, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return {
    x: point.x * cos - point.z * sin,
    y: point.y,
    z: point.x * sin + point.z * cos
  };
}

function rotateX(point, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return {
    x: point.x,
    y: point.y * cos - point.z * sin,
    z: point.y * sin + point.z * cos
  };
}

function project(point, cx, cy) {
  const fov = 600;
  const z = point.z + fov;
  const scale = fov / Math.max(z, 1);
  return {
    x: cx + point.x * scale,
    y: cy + point.y * scale,
    scale,
    z: point.z
  };
}

function draw(now) {
  const elapsed = (now - startTime) % CONFIG.cycleDuration;
  const cycleT = elapsed / CONFIG.cycleDuration;
  const holoRgb = hexToRgb(CONFIG.hologramColor);
  const rotAngle = now * CONFIG.rotationSpeed;

  // Glitch timing
  glitchTimer -= 16;
  if (glitchTimer <= 0 && !glitchActive) {
    if (Math.random() < 0.008) {
      glitchActive = true;
      glitchDuration = 50 + Math.random() * 150;
      glitchTimer = glitchDuration;
    }
  }
  if (glitchActive && glitchTimer <= 0) {
    glitchActive = false;
    glitchTimer = 2000 + Math.random() * 5000;
  }

  // Background
  ctx.fillStyle = '#030810';
  ctx.fillRect(0, 0, W, H);

  // Perspective grid floor
  const vanishX = W * 0.5;
  const vanishY = H * 0.5;
  const horizonY = H * 0.65;

  // Floor grid
  ctx.strokeStyle = `rgba(${holoRgb.r * 0.3}, ${holoRgb.g * 0.3}, ${holoRgb.b * 0.3}, 0.15)`;
  ctx.lineWidth = 0.5;

  // Horizontal lines
  for (let i = 0; i < 20; i++) {
    const t = i / 20;
    const y = horizonY + (H - horizonY) * t * t;
    const spread = (y - horizonY) / (H - horizonY);
    const leftX = vanishX - W * 0.8 * spread;
    const rightX = vanishX + W * 0.8 * spread;
    ctx.globalAlpha = 0.1 + spread * 0.2;
    ctx.beginPath();
    ctx.moveTo(leftX, y);
    ctx.lineTo(rightX, y);
    ctx.stroke();
  }

  // Vertical perspective lines
  for (let i = -10; i <= 10; i++) {
    const x = vanishX + i * W * 0.06;
    ctx.globalAlpha = 0.08;
    ctx.beginPath();
    ctx.moveTo(vanishX, horizonY);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Projector base
  const baseX = W * 0.5;
  const baseY = H * 0.78;
  const baseW = W * 0.18;
  const baseH = H * 0.04;

  // Base glow
  const baseGlow = ctx.createRadialGradient(baseX, baseY - baseH, 0, baseX, baseY - baseH, baseW * 0.8);
  baseGlow.addColorStop(0, `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.08)`);
  baseGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = baseGlow;
  ctx.beginPath();
  ctx.arc(baseX, baseY - baseH, baseW * 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Projector platform shape (trapezoid)
  ctx.fillStyle = '#0a1520';
  ctx.beginPath();
  ctx.moveTo(baseX - baseW * 0.5, baseY);
  ctx.lineTo(baseX + baseW * 0.5, baseY);
  ctx.lineTo(baseX + baseW * 0.35, baseY - baseH);
  ctx.lineTo(baseX - baseW * 0.35, baseY - baseH);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.5)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Base edge glow
  ctx.save();
  ctx.shadowColor = CONFIG.hologramColor;
  ctx.shadowBlur = 10;
  ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.3)`;
  ctx.beginPath();
  ctx.moveTo(baseX - baseW * 0.35, baseY - baseH);
  ctx.lineTo(baseX + baseW * 0.35, baseY - baseH);
  ctx.stroke();
  ctx.restore();

  // Small indicator dots on base
  for (let i = -2; i <= 2; i++) {
    const dotX = baseX + i * baseW * 0.08;
    const dotY = baseY - baseH * 0.5;
    const blink = Math.sin(now * 0.003 + i * 1.5) > 0;
    ctx.fillStyle = blink ? `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.8)` : 'rgba(30, 50, 60, 0.5)';
    ctx.beginPath();
    ctx.arc(dotX, dotY, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Hologram projection cone (very subtle)
  const coneGrad = ctx.createLinearGradient(0, baseY - baseH, 0, H * 0.2);
  coneGrad.addColorStop(0, `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.03)`);
  coneGrad.addColorStop(0.5, `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.015)`);
  coneGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(baseX - baseW * 0.3, baseY - baseH);
  ctx.lineTo(baseX - W * 0.15, H * 0.2);
  ctx.lineTo(baseX + W * 0.15, H * 0.2);
  ctx.lineTo(baseX + baseW * 0.3, baseY - baseH);
  ctx.closePath();
  ctx.fill();

  // Globe center
  const globeCX = W * 0.5;
  const globeCY = H * 0.42;
  const radius = Math.min(W, H) * 0.15;

  // Rotating ring
  const ringPoints = 60;
  const ringRadius = radius * 1.25;
  ctx.save();
  ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.35)`;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = CONFIG.hologramColor;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  for (let i = 0; i <= ringPoints; i++) {
    const a = (i / ringPoints) * Math.PI * 2;
    const pt = rotateX(
      rotateY({ x: ringRadius * Math.cos(a), y: 0, z: ringRadius * Math.sin(a) }, rotAngle * 0.5),
      0.3
    );
    const p = project(pt, globeCX, globeCY);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.restore();

  // Second ring (perpendicular)
  ctx.save();
  ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.2)`;
  ctx.lineWidth = 1;
  ctx.shadowColor = CONFIG.hologramColor;
  ctx.shadowBlur = 4;
  ctx.beginPath();
  for (let i = 0; i <= ringPoints; i++) {
    const a = (i / ringPoints) * Math.PI * 2;
    const pt = rotateY(
      rotateX({ x: ringRadius * 1.1 * Math.cos(a), y: ringRadius * 1.1 * Math.sin(a), z: 0 }, 0.5),
      rotAngle * 0.3
    );
    const p = project(pt, globeCX, globeCY);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.restore();

  // Wireframe globe
  const rotatedPoints = globePoints.map(pt => {
    let r = rotateY(pt, rotAngle);
    r = rotateX(r, Math.sin(now * 0.0003) * 0.15);
    return project(r, globeCX, globeCY);
  });

  // Draw edges
  ctx.lineWidth = 0.6;
  for (const [a, b] of globeEdges) {
    if (a >= rotatedPoints.length || b >= rotatedPoints.length) continue;
    const pa = rotatedPoints[a];
    const pb = rotatedPoints[b];

    // Depth-based opacity
    const avgZ = (pa.z + pb.z) / 2;
    const depthAlpha = 0.15 + Math.max(0, (avgZ + radius) / (radius * 2)) * 0.4;

    ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${depthAlpha})`;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }

  // Globe points (vertices)
  for (const p of rotatedPoints) {
    const depthAlpha = 0.2 + Math.max(0, (p.z + radius) / (radius * 2)) * 0.6;
    const size = 1 + p.scale * 0.5;
    ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${depthAlpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Scan lines sweeping up
  const scanY = globeCY + radius - ((now * 0.05) % (radius * 3));
  if (scanY > globeCY - radius * 1.3 && scanY < globeCY + radius * 1.3) {
    ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${CONFIG.scanlineOpacity})`;
    ctx.fillRect(globeCX - radius * 1.5, scanY, radius * 3, 2);

    // Scan line glow
    const scanGlow = ctx.createLinearGradient(0, scanY - 10, 0, scanY + 10);
    scanGlow.addColorStop(0, 'rgba(0, 0, 0, 0)');
    scanGlow.addColorStop(0.5, `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${CONFIG.scanlineOpacity * 0.3})`);
    scanGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = scanGlow;
    ctx.fillRect(globeCX - radius * 1.5, scanY - 10, radius * 3, 20);
  }

  // Horizontal static scan lines (CRT effect)
  ctx.fillStyle = `rgba(0, 0, 0, 0.03)`;
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }

  // Hologram particles
  for (const p of holoParticles) {
    p.angle += p.speed;
    p.phase += 0.02;
    const px = globeCX + Math.cos(p.angle) * p.dist;
    const py = globeCY + p.y + Math.sin(p.phase) * 5;
    const alpha = p.opacity * (0.4 + Math.sin(p.phase * 1.3) * 0.6);

    ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Data readouts
  ctx.font = `${Math.max(10, W * 0.01)}px monospace`;
  ctx.textAlign = 'left';
  for (const dr of dataReadouts) {
    const alpha = Math.max(0, Math.sin(now * dr.fadeSpeed + dr.fadePhase)) * 0.7;
    if (alpha < 0.05) continue;

    const angle = dr.angle + now * 0.0002;
    const dx = globeCX + Math.cos(angle) * dr.dist;
    const dy = globeCY + dr.yOffset + Math.sin(now * 0.001 + dr.fadePhase) * 5;

    // Connection line from globe to label
    ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${alpha * 0.3})`;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(globeCX + Math.cos(angle) * radius * 0.8, globeCY + Math.sin(angle) * radius * 0.3 + dr.yOffset * 0.3);
    ctx.lineTo(dx, dy);
    ctx.stroke();
    ctx.setLineDash([]);

    // Small dot at connection point
    ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(dx, dy, 2, 0, Math.PI * 2);
    ctx.fill();

    // Text with slight glow
    ctx.save();
    ctx.shadowColor = CONFIG.hologramColor;
    ctx.shadowBlur = 4;
    ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${alpha})`;
    ctx.fillText(dr.text, dx + 5, dy + 3);
    ctx.restore();

    // Bracket decoration
    ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${alpha * 0.5})`;
    ctx.lineWidth = 0.5;
    const tw = ctx.measureText(dr.text).width;
    ctx.beginPath();
    ctx.moveTo(dx + 3, dy - 6);
    ctx.lineTo(dx + 3, dy + 7);
    ctx.moveTo(dx + 7 + tw, dy - 6);
    ctx.lineTo(dx + 7 + tw, dy + 7);
    ctx.stroke();
  }

  // Touch/interaction ripples
  if (Math.random() < 0.015) {
    touchRipples.push({
      x: globeCX + (Math.random() - 0.5) * radius * 3,
      y: globeCY + (Math.random() - 0.5) * radius * 2,
      radius: 0,
      maxRadius: W * (0.02 + Math.random() * 0.04),
      opacity: 0.5,
      speed: W * 0.0005
    });
  }

  for (let i = touchRipples.length - 1; i >= 0; i--) {
    const rp = touchRipples[i];
    rp.radius += rp.speed;
    rp.opacity *= 0.97;

    if (rp.opacity < 0.02) {
      touchRipples.splice(i, 1);
      continue;
    }

    ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${rp.opacity})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner dot
    ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, ${rp.opacity * 0.5})`;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Chromatic aberration effect
  if (Math.random() < 0.03 || glitchActive) {
    const offsetX = (Math.random() - 0.5) * W * 0.005 * (glitchActive ? CONFIG.glitchIntensity * 3 : 1);
    const offsetY = (Math.random() - 0.5) * H * 0.003 * (glitchActive ? CONFIG.glitchIntensity * 3 : 1);
    const aberrationH = H * (0.01 + Math.random() * 0.02) * (glitchActive ? 3 : 1);
    const aberrationY = Math.random() * H;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = `rgba(255, 0, 80, ${0.03 * (glitchActive ? CONFIG.glitchIntensity : 0.3)})`;
    ctx.fillRect(offsetX, aberrationY, W, aberrationH);
    ctx.fillStyle = `rgba(0, 255, 200, ${0.03 * (glitchActive ? CONFIG.glitchIntensity : 0.3)})`;
    ctx.fillRect(-offsetX, aberrationY + 2, W, aberrationH);
    ctx.restore();
  }

  // Glitch distortion bars
  if (glitchActive) {
    const barCount = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < barCount; i++) {
      const gy = Math.random() * H;
      const gh = 1 + Math.random() * 6;
      const gOffset = (Math.random() - 0.5) * W * 0.04 * CONFIG.glitchIntensity;
      ctx.save();
      ctx.globalAlpha = 0.5 * CONFIG.glitchIntensity;
      ctx.drawImage(canvas, 0, gy, W, gh, gOffset, gy, W, gh);
      ctx.restore();
    }
  }

  // Overall holographic glow around globe area
  const holoGlow = ctx.createRadialGradient(globeCX, globeCY, radius * 0.3, globeCX, globeCY, radius * 2);
  holoGlow.addColorStop(0, `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.04)`);
  holoGlow.addColorStop(0.5, `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.015)`);
  holoGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = holoGlow;
  ctx.beginPath();
  ctx.arc(globeCX, globeCY, radius * 2, 0, Math.PI * 2);
  ctx.fill();

  // Corner UI decorations
  drawCornerUI(20, 20, 1, 1);
  drawCornerUI(W - 20, 20, -1, 1);
  drawCornerUI(20, H - 20, 1, -1);
  drawCornerUI(W - 20, H - 20, -1, -1);

  // Top-right status text
  ctx.save();
  ctx.font = `${Math.max(9, W * 0.008)}px monospace`;
  ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.4)`;
  ctx.textAlign = 'right';
  const statusBlink = Math.sin(now * 0.003) > 0 ? 'ONLINE' : '______';
  ctx.fillText(`STATUS: ${statusBlink}`, W - 35, 40);
  ctx.fillText(`HOLO.SYS v4.2.1`, W - 35, 55);
  ctx.restore();

  // Vignette
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.75);
  vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  // Cycle reset
  if (elapsed >= CONFIG.cycleDuration - 50) {
    startTime = now;
  }

  requestAnimationFrame(draw);
}

function drawCornerUI(x, y, dirX, dirY) {
  const holoRgb = hexToRgb(CONFIG.hologramColor);
  const len = Math.min(W, H) * 0.035;
  ctx.strokeStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.25)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y + dirY * len);
  ctx.lineTo(x, y);
  ctx.lineTo(x + dirX * len, y);
  ctx.stroke();

  // Small dot
  ctx.fillStyle = `rgba(${holoRgb.r}, ${holoRgb.g}, ${holoRgb.b}, 0.4)`;
  ctx.beginPath();
  ctx.arc(x, y, 2, 0, Math.PI * 2);
  ctx.fill();
}

window.addEventListener('resize', resize);
window.addEventListener('message', (e) => {
  if (e.data && typeof e.data === 'object') {
    Object.assign(CONFIG, e.data);
    initScene();
  }
});
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>

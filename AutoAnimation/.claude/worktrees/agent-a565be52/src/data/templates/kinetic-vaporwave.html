<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vaporwave - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #1a0030; font-family: 'Arial', sans-serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, #1a0030 0%, #2a0050 40%, #ff6eb4 80%, #ff9e00 100%); opacity: 0.4; }
  body::after { content:''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(transparent, transparent 18px, rgba(255,110,180,0.1) 18px, rgba(255,110,180,0.1) 19px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,110,180,0.08) 40px, rgba(255,110,180,0.08) 41px);
    transform: perspective(300px) rotateX(45deg); transform-origin: bottom center; }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }

  @keyframes vaporIn { 0% { opacity: 0; transform: translate(-50%,-50%) translateY(20px) scale(0.8); filter: hue-rotate(-30deg) blur(4px); }
    50% { filter: hue-rotate(15deg) blur(0); } 100% { opacity: 1; transform: translate(-50%,-50%) translateY(0) scale(1); filter: hue-rotate(0deg) blur(0); } }
  @keyframes vaporOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) translateY(-20px); filter: hue-rotate(30deg) blur(4px); } }
  @keyframes chromaShift { 0%,100% { text-shadow: -2px 0 #ff006e, 2px 0 #00d4ff; } 50% { text-shadow: -3px 0 #ff006e, 3px 0 #00d4ff, 0 0 20px rgba(255,0,110,0.3); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['ＡＥＳＴＨＥＴＩＣ','ＤＲＥＡＭ','ＮＥＯＮ','ＷＡＶＥ','ＳＵＮＳＥＴ','ＲＥＴＲＯ','ＦＵＴＵＲＥ','ＰＡＲＡＤＩＳＥ'],
  bgColor: '#1a0030',
  fontFamily: "'Arial', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const vaporColors = ['#ff6eb4','#ff9e00','#00d4ff','#a855f7','#ff3cac','#06ffa5','#ec38bc','#7303c0'];

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 61 + 23);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(28 + rng() * 20, cellW * 0.38, cellH * 0.5);
    const color = vaporColors[i % vaporColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-weight:700;color:${color};text-shadow:-2px 0 #ff006e,2px 0 #00d4ff;letter-spacing:4px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=300, inD=550, hold=3000, outS=200, outD=450, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`vaporIn ${inD}ms ease-out forwards, chromaShift 2s ease-in-out infinite ${inD}ms`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`vaporOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

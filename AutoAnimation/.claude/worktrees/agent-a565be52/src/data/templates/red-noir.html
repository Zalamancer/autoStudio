<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Noir</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  canvas#grain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    opacity: 0.06;
  }
  .scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  .line {
    position: absolute;
    background: #EF233C;
    transform-origin: 0 0;
  }
  .line-h {
    height: 2px;
    width: 0;
    animation: drawLineH 4s ease-in-out infinite;
  }
  .line-v {
    width: 2px;
    height: 0;
    animation: drawLineV 4s ease-in-out infinite;
  }
  @keyframes drawLineH {
    0% { width: 0; opacity: 0; }
    10% { opacity: 1; }
    50% { width: 100vw; opacity: 1; }
    80% { width: 100vw; opacity: 0.3; }
    100% { width: 0; opacity: 0; }
  }
  @keyframes drawLineV {
    0% { height: 0; opacity: 0; }
    10% { opacity: 1; }
    50% { height: 100vh; opacity: 1; }
    80% { height: 100vh; opacity: 0.3; }
    100% { height: 0; opacity: 0; }
  }
  .spotlight {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(239,35,60,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 2;
    animation: spotlightMove 8s ease-in-out infinite;
  }
  @keyframes spotlightMove {
    0% { transform: translate(-50%, -50%) scale(1); }
    25% { transform: translate(-30%, -60%) scale(1.3); }
    50% { transform: translate(-70%, -40%) scale(0.9); }
    75% { transform: translate(-40%, -70%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  .text-container {
    position: fixed;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%; height: 100%;
    gap: 20px;
  }
  .title {
    font-size: clamp(36px, 8vw, 80px);
    font-weight: 700;
    color: #EF233C;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    animation: textFade 6s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(239,35,60,0.4);
  }
  .subtitle {
    font-size: clamp(14px, 2.5vw, 24px);
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    animation: textFade 6s ease-in-out infinite 1s;
  }
  @keyframes textFade {
    0%, 100% { opacity: 0; transform: translateY(10px); }
    20%, 80% { opacity: 1; transform: translateY(0); }
  }
  .geo-shape {
    position: absolute;
    border: 2px solid #EF233C;
    z-index: 3;
    opacity: 0;
  }
  .geo-diamond {
    width: 80px; height: 80px;
    transform: rotate(45deg);
    animation: geoAppear 5s ease-in-out infinite;
  }
  .geo-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    animation: geoAppear 5s ease-in-out infinite 1.5s;
  }
  .geo-triangle {
    width: 0; height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 86px solid transparent;
    border-bottom-color: #EF233C;
    background: none;
    border-top: none;
    animation: geoAppear 5s ease-in-out infinite 3s;
  }
  @keyframes geoAppear {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    30%, 70% { opacity: 0.6; transform: scale(1) rotate(5deg); }
  }
  .pulse-ring {
    position: fixed;
    top: 50%; left: 50%;
    width: 200px; height: 200px;
    border: 2px solid #EF233C;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    animation: pulseRing 3s ease-out infinite;
  }
  .pulse-ring:nth-child(2) { animation-delay: 1s; }
  .pulse-ring:nth-child(3) { animation-delay: 2s; }
  @keyframes pulseRing {
    0% { width: 100px; height: 100px; opacity: 0.8; border-width: 3px; }
    100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; }
  }
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 50;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="scene">
  <div class="line line-h" style="top:25%; animation-delay: 0s;"></div>
  <div class="line line-h" style="top:50%; animation-delay: 1.5s;"></div>
  <div class="line line-h" style="top:75%; animation-delay: 3s;"></div>
  <div class="line line-v" style="left:20%; animation-delay: 0.5s;"></div>
  <div class="line line-v" style="left:50%; animation-delay: 2s;"></div>
  <div class="line line-v" style="left:80%; animation-delay: 3.5s;"></div>

  <div class="geo-shape geo-diamond" style="top:15%; left:10%;"></div>
  <div class="geo-shape geo-circle" style="top:60%; right:8%;"></div>
  <div class="geo-shape geo-triangle" style="bottom:20%; left:15%;"></div>
  <div class="geo-shape geo-diamond" style="top:70%; left:75%; animation-delay:2.5s;"></div>

  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
</div>

<div class="spotlight" style="top:40%; left:60%;"></div>
<div class="spotlight" style="top:70%; left:30%; animation-delay: 4s; width:400px; height:400px;"></div>

<div class="text-container">
  <div class="title" id="titleText">NOIR</div>
  <div class="subtitle" id="subtitleText">A CINEMATIC EXPERIENCE</div>
</div>

<div class="vignette"></div>
<canvas id="grain"></canvas>

<script>
  // === EDITABLE TEXT VARIABLES ===
  var TITLE_TEXT = 'NOIR';
  var SUBTITLE_TEXT = 'A CINEMATIC EXPERIENCE';
  // === END EDITABLE ===

  document.getElementById('titleText').textContent = TITLE_TEXT;
  document.getElementById('subtitleText').textContent = SUBTITLE_TEXT;

  // Film grain effect
  var grainCanvas = document.getElementById('grain');
  var gCtx = grainCanvas.getContext('2d');

  function resizeGrain() {
    grainCanvas.width = window.innerWidth;
    grainCanvas.height = window.innerHeight;
  }
  resizeGrain();
  window.addEventListener('resize', resizeGrain);

  function renderGrain() {
    var w = grainCanvas.width;
    var h = grainCanvas.height;
    if (!w || !h) { requestAnimationFrame(renderGrain); return; }
    var imageData = gCtx.createImageData(w, h);
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = Math.random() * 255;
      data[i] = v;
      data[i+1] = v;
      data[i+2] = v;
      data[i+3] = 255;
    }
    gCtx.putImageData(imageData, 0, 0);
    requestAnimationFrame(renderGrain);
  }
  renderGrain();
</script>
</body>
</html>

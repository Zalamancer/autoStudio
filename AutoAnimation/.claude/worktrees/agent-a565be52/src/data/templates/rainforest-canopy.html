<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainforest Canopy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #0a1f0a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const CONFIG = {
  bgColor: '#0b1e0b',
  leafColor: '#1a6e2e',
  rainIntensity: 0.6,
  mistOpacity: 0.35,
  fireflyCount: 35,
  cycleDuration: 16000
};

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

const bgRgb = hexToRgb(CONFIG.bgColor);
const leafRgb = hexToRgb(CONFIG.leafColor);

// Raindrop
class Raindrop {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W * 1.2 - W * 0.1;
    this.y = init ? Math.random() * H : -Math.random() * 40;
    this.length = 8 + Math.random() * 18;
    this.speed = 6 + Math.random() * 10;
    this.opacity = 0.15 + Math.random() * 0.3;
    this.wind = 1.5 + Math.random() * 1;
    this.splash = null;
  }
  update(dt) {
    this.y += this.speed * dt;
    this.x += this.wind * dt;
    if (this.splash) {
      this.splash.life -= dt * 0.05;
      if (this.splash.life <= 0) this.splash = null;
    }
    if (this.y > H * 0.95) {
      // Create splash on leaf
      if (Math.random() < 0.3) {
        this.splash = { x: this.x, y: this.y, life: 1, size: 2 + Math.random() * 3 };
      }
      this.reset(false);
    }
  }
  draw() {
    ctx.globalAlpha = this.opacity * CONFIG.rainIntensity;
    ctx.strokeStyle = 'rgba(180, 220, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.wind * 2, this.y - this.length);
    ctx.stroke();
    if (this.splash && this.splash.life > 0) {
      const s = this.splash;
      ctx.globalAlpha = s.life * 0.4 * CONFIG.rainIntensity;
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.5)';
      ctx.lineWidth = 0.8;
      const expand = (1 - s.life) * s.size * 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, expand, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// Firefly / butterfly
class Firefly {
  constructor(isButterfly) {
    this.isButterfly = isButterfly;
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H * 0.2 + Math.random() * H * 0.6;
    this.baseX = this.x;
    this.baseY = this.y;
    this.wanderRadius = 30 + Math.random() * 80;
    this.speed = 0.003 + Math.random() * 0.005;
    this.phase = Math.random() * Math.PI * 2;
    this.phaseY = Math.random() * Math.PI * 2;
    this.size = this.isButterfly ? 3 + Math.random() * 4 : 2 + Math.random() * 2;
    this.glowPhase = Math.random() * Math.PI * 2;
    this.glowSpeed = 0.01 + Math.random() * 0.02;
    this.hue = this.isButterfly ?
      (Math.random() < 0.5 ? 30 + Math.random() * 30 : 270 + Math.random() * 50) :
      80 + Math.random() * 60;
    this.wingAngle = 0;
    this.wingSpeed = 0.05 + Math.random() * 0.04;
  }
  update(dt) {
    this.phase += this.speed * dt * 16;
    this.phaseY += this.speed * 0.7 * dt * 16;
    this.x = this.baseX + Math.sin(this.phase) * this.wanderRadius;
    this.y = this.baseY + Math.sin(this.phaseY) * this.wanderRadius * 0.5;
    this.glowPhase += this.glowSpeed * dt * 16;
    this.wingAngle += this.wingSpeed * dt * 16;
    // Slowly drift
    this.baseX += Math.sin(time * 0.0003 + this.phase) * 0.1;
    this.baseY += Math.cos(time * 0.0004 + this.phaseY) * 0.05;
    if (this.baseX < -50 || this.baseX > W + 50 || this.baseY < -50 || this.baseY > H + 50) {
      this.reset();
    }
  }
  draw() {
    const glow = (Math.sin(this.glowPhase) + 1) * 0.5;
    if (this.isButterfly) {
      const wingOpen = Math.abs(Math.sin(this.wingAngle));
      const sat = 80;
      const light = 55;
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = `hsl(${this.hue}, ${sat}%, ${light}%)`;
      // Left wing
      ctx.beginPath();
      ctx.ellipse(this.x - this.size * 0.6, this.y, this.size * wingOpen, this.size * 1.3, -0.3, 0, Math.PI * 2);
      ctx.fill();
      // Right wing
      ctx.beginPath();
      ctx.ellipse(this.x + this.size * 0.6, this.y, this.size * wingOpen, this.size * 1.3, 0.3, 0, Math.PI * 2);
      ctx.fill();
      // Body
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = `hsl(${this.hue}, 30%, 25%)`;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, 1, this.size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const alpha = 0.3 + glow * 0.7;
      // Outer glow
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 5);
      grad.addColorStop(0, `hsla(${this.hue}, 100%, 75%, ${alpha * 0.3})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 5, 0, Math.PI * 2);
      ctx.fill();
      // Core
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `hsl(${this.hue}, 100%, 80%)`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Canopy leaf cluster
class LeafCluster {
  constructor(x, y, size, depth) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.depth = depth;
    this.swayPhase = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.001 + Math.random() * 0.002;
    this.swayAmp = 3 + Math.random() * 8;
    this.leaves = [];
    const count = 5 + Math.floor(Math.random() * 8);
    for (let i = 0; i < count; i++) {
      this.leaves.push({
        ox: (Math.random() - 0.5) * size,
        oy: (Math.random() - 0.5) * size * 0.6,
        w: size * (0.3 + Math.random() * 0.5),
        h: size * (0.1 + Math.random() * 0.15),
        angle: Math.random() * Math.PI,
        shade: Math.random() * 40 - 20
      });
    }
  }
  draw() {
    const sway = Math.sin(time * this.swaySpeed + this.swayPhase) * this.swayAmp;
    const depthFade = 0.4 + this.depth * 0.6;
    this.leaves.forEach(l => {
      const lx = this.x + l.ox + sway * (1 - this.depth);
      const ly = this.y + l.oy;
      const r = Math.min(255, Math.max(0, leafRgb.r + l.shade - (1 - this.depth) * 30));
      const g = Math.min(255, Math.max(0, leafRgb.g + l.shade));
      const b = Math.min(255, Math.max(0, leafRgb.b + l.shade - (1 - this.depth) * 15));
      ctx.globalAlpha = depthFade;
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(l.angle + sway * 0.01);
      ctx.beginPath();
      ctx.ellipse(0, 0, l.w, l.h, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
}

// Vine
class Vine {
  constructor() {
    this.x = Math.random() * W;
    this.topY = -10;
    this.length = H * (0.3 + Math.random() * 0.4);
    this.swayPhase = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.0015 + Math.random() * 0.001;
    this.swayAmp = 10 + Math.random() * 20;
    this.thickness = 1.5 + Math.random() * 2;
    this.color = `rgb(${40 + Math.random() * 30}, ${80 + Math.random() * 40}, ${20 + Math.random() * 20})`;
  }
  draw() {
    const sway = Math.sin(time * this.swaySpeed + this.swayPhase) * this.swayAmp;
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.thickness;
    ctx.beginPath();
    ctx.moveTo(this.x, this.topY);
    const segments = 20;
    for (let i = 1; i <= segments; i++) {
      const t = i / segments;
      const y = this.topY + this.length * t;
      const x = this.x + sway * t * t + Math.sin(t * 4 + time * 0.002) * 5;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

// God ray
class GodRay {
  constructor() {
    this.x = Math.random() * W;
    this.width = 20 + Math.random() * 60;
    this.opacity = 0.03 + Math.random() * 0.06;
    this.driftSpeed = (Math.random() - 0.5) * 0.3;
    this.flickerPhase = Math.random() * Math.PI * 2;
    this.flickerSpeed = 0.002 + Math.random() * 0.003;
    this.gapY = H * (0.05 + Math.random() * 0.2);
  }
  draw() {
    const flicker = (Math.sin(time * this.flickerSpeed + this.flickerPhase) + 1) * 0.5;
    const x = this.x + Math.sin(time * 0.0005) * 15;
    const grad = ctx.createLinearGradient(0, this.gapY, 0, H * 0.8);
    grad.addColorStop(0, `rgba(255, 250, 200, ${this.opacity * flicker})`);
    grad.addColorStop(0.5, `rgba(200, 240, 180, ${this.opacity * flicker * 0.5})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - this.width * 0.3, this.gapY);
    ctx.lineTo(x + this.width * 0.3, this.gapY);
    ctx.lineTo(x + this.width, H * 0.8);
    ctx.lineTo(x - this.width, H * 0.8);
    ctx.closePath();
    ctx.fill();
  }
}

// Tropical flower
class Flower {
  constructor() {
    this.x = Math.random() * W;
    this.y = H * 0.3 + Math.random() * H * 0.5;
    this.size = 4 + Math.random() * 8;
    this.petals = 5 + Math.floor(Math.random() * 3);
    this.hue = Math.random() < 0.5 ? 330 + Math.random() * 30 : 40 + Math.random() * 20;
    this.bloomPhase = Math.random() * Math.PI * 2;
    this.bloomSpeed = 0.001 + Math.random() * 0.002;
  }
  draw() {
    const bloom = (Math.sin(time * this.bloomSpeed + this.bloomPhase) + 1) * 0.5;
    const openSize = this.size * (0.4 + bloom * 0.6);
    ctx.globalAlpha = 0.7 + bloom * 0.3;
    for (let i = 0; i < this.petals; i++) {
      const angle = (i / this.petals) * Math.PI * 2 + time * 0.0003;
      const px = this.x + Math.cos(angle) * openSize * 0.6;
      const py = this.y + Math.sin(angle) * openSize * 0.6;
      ctx.fillStyle = `hsl(${this.hue}, 80%, ${55 + bloom * 15}%)`;
      ctx.beginPath();
      ctx.ellipse(px, py, openSize * 0.5, openSize * 0.25, angle, 0, Math.PI * 2);
      ctx.fill();
    }
    // Center
    ctx.fillStyle = `hsl(${this.hue + 30}, 90%, 70%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, openSize * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Mist layer
function drawMist() {
  const mistAlpha = CONFIG.mistOpacity;
  for (let i = 0; i < 4; i++) {
    const y = H * 0.35 + i * H * 0.1;
    const drift = Math.sin(time * 0.0004 + i * 1.5) * W * 0.05;
    const grad = ctx.createRadialGradient(
      W / 2 + drift, y, 0,
      W / 2 + drift, y, W * 0.6
    );
    grad.addColorStop(0, `rgba(200, 230, 210, ${mistAlpha * 0.15})`);
    grad.addColorStop(0.5, `rgba(180, 220, 200, ${mistAlpha * 0.08})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

// Initialize objects
const raindrops = [];
for (let i = 0; i < 200; i++) raindrops.push(new Raindrop());

const fireflies = [];
for (let i = 0; i < CONFIG.fireflyCount; i++) {
  fireflies.push(new Firefly(i < 5)); // First 5 are butterflies
}

const backClusters = [];
for (let i = 0; i < 25; i++) {
  backClusters.push(new LeafCluster(
    Math.random() * W, Math.random() * H * 0.45,
    40 + Math.random() * 50, 0.3 + Math.random() * 0.3
  ));
}

const frontClusters = [];
for (let i = 0; i < 15; i++) {
  frontClusters.push(new LeafCluster(
    Math.random() * W, -10 + Math.random() * H * 0.2,
    50 + Math.random() * 80, 0.7 + Math.random() * 0.3
  ));
}

const vines = [];
for (let i = 0; i < 8; i++) vines.push(new Vine());

const godRays = [];
for (let i = 0; i < 6; i++) godRays.push(new GodRay());

const flowers = [];
for (let i = 0; i < 12; i++) flowers.push(new Flower());

let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;
  time += dt * 16;

  // Background gradient (looking up through canopy)
  const grad = ctx.createRadialGradient(W / 2, H * 0.1, 0, W / 2, H * 0.1, Math.max(W, H));
  grad.addColorStop(0, `rgb(${bgRgb.r + 40}, ${bgRgb.g + 60}, ${bgRgb.b + 30})`);
  grad.addColorStop(0.4, `rgb(${bgRgb.r + 15}, ${bgRgb.g + 30}, ${bgRgb.b + 10})`);
  grad.addColorStop(1, `rgb(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b})`);
  ctx.globalAlpha = 1;
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sky patches visible through canopy
  for (let i = 0; i < 5; i++) {
    const px = W * (0.15 + i * 0.18) + Math.sin(time * 0.0003 + i) * 15;
    const py = H * 0.08 + Math.sin(time * 0.0004 + i * 2) * 10;
    const skyGrad = ctx.createRadialGradient(px, py, 0, px, py, 40 + Math.sin(time * 0.001 + i) * 10);
    skyGrad.addColorStop(0, 'rgba(140, 200, 255, 0.08)');
    skyGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
  }

  // Back canopy clusters
  backClusters.forEach(c => c.draw());

  // God rays
  godRays.forEach(r => r.draw());

  // Mist
  drawMist();

  // Vines
  vines.forEach(v => v.draw());

  // Flowers
  flowers.forEach(f => f.draw());

  // Fireflies and butterflies
  fireflies.forEach(f => { f.update(dt); f.draw(); });

  // Rain
  const activeRain = Math.floor(200 * CONFIG.rainIntensity);
  for (let i = 0; i < activeRain; i++) {
    raindrops[i].update(dt);
    raindrops[i].draw();
  }

  // Front canopy clusters (foreground)
  frontClusters.forEach(c => c.draw());

  // Front leaf border
  ctx.globalAlpha = 0.85;
  const borderGrad = ctx.createLinearGradient(0, 0, 0, H * 0.08);
  borderGrad.addColorStop(0, `rgb(${leafRgb.r - 30}, ${leafRgb.g - 20}, ${leafRgb.b - 20})`);
  borderGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = borderGrad;
  ctx.fillRect(0, 0, W, H * 0.08);

  // Side vignettes (canopy edges)
  const leftVig = ctx.createLinearGradient(0, 0, W * 0.15, 0);
  leftVig.addColorStop(0, `rgba(${leafRgb.r - 40}, ${leafRgb.g - 30}, ${leafRgb.b - 30}, 0.5)`);
  leftVig.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = leftVig;
  ctx.fillRect(0, 0, W * 0.15, H);

  const rightVig = ctx.createLinearGradient(W, 0, W * 0.85, 0);
  rightVig.addColorStop(0, `rgba(${leafRgb.r - 40}, ${leafRgb.g - 30}, ${leafRgb.b - 30}, 0.5)`);
  rightVig.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rightVig;
  ctx.fillRect(W * 0.85, 0, W * 0.15, H);

  // Bottom forest floor
  const floorGrad = ctx.createLinearGradient(0, H * 0.85, 0, H);
  floorGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  floorGrad.addColorStop(1, `rgba(${bgRgb.r}, ${bgRgb.g + 10}, ${bgRgb.b}, 0.6)`);
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
  }
});
</script>
</body>
</html>

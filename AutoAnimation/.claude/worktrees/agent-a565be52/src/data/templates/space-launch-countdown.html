<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Launch Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; color: #e0e8f0; }
  .scene { width: 100%; height: 100%; position: relative; overflow: hidden; }
  canvas { position: absolute; inset: 0; z-index: 0; }

  /* Mission badge */
  .mission-badge {
    position: absolute; top: 3vh; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 5;
    opacity: 0; transition: opacity 0.8s;
  }
  .mission-badge.visible { opacity: 1; }
  .mission-label { font-size: 1vh; letter-spacing: 0.4em; color: #6080a0; text-transform: uppercase; }
  .mission-name { font-size: 3.5vh; font-weight: 900; letter-spacing: 0.15em; color: #ffffff; margin-top: 0.5vh; text-shadow: 0 0 20px rgba(100,160,255,0.3); }

  /* Countdown */
  .countdown-area {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; z-index: 5;
  }
  .t-label { font-size: 1.5vh; letter-spacing: 0.3em; color: #6080a0; margin-bottom: 1vh; }
  .countdown-digits {
    display: flex; gap: 1.5vw; align-items: center; justify-content: center;
  }
  .digit-group { text-align: center; }
  .digit-box {
    display: inline-flex; align-items: center; justify-content: center;
    width: 8vw; height: 10vh;
    background: rgba(20,35,60,0.85);
    border: 1px solid rgba(100,160,255,0.15);
    border-radius: 0.8vh;
    font-size: 7vh; font-weight: 900; font-variant-numeric: tabular-nums;
    color: #ffffff; text-shadow: 0 0 15px rgba(100,160,255,0.4);
    position: relative; overflow: hidden;
  }
  .digit-box::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(100,160,255,0.08);
  }
  .digit-unit { font-size: 1vh; letter-spacing: 0.2em; color: #4a6a8a; margin-top: 0.5vh; }
  .digit-separator { font-size: 5vh; color: #4a6a8a; padding: 0 0.5vw; align-self: flex-start; margin-top: 1.5vh; }

  /* Status readouts */
  .status-panel {
    position: absolute; bottom: 16vh; left: 5vw; z-index: 5;
    display: flex; flex-direction: column; gap: 0.8vh;
    opacity: 0; transform: translateX(-2vw);
    transition: opacity 0.6s, transform 0.6s;
  }
  .status-panel.visible { opacity: 1; transform: translateX(0); }
  .status-item {
    display: flex; align-items: center; gap: 1.5vw;
    font-size: 1.3vh; letter-spacing: 0.08em;
  }
  .status-dot {
    width: 1vh; height: 1vh; border-radius: 50%;
    background: #334455; border: 1px solid #445566;
    transition: background 0.4s, box-shadow 0.4s, border-color 0.4s;
  }
  .status-dot.go { background: #22cc66; border-color: #22cc66; box-shadow: 0 0 8px rgba(34,204,102,0.5); }
  .status-label { color: #8098b0; min-width: 15vw; }
  .status-value { color: #c0d8f0; font-weight: 700; }

  /* Rocket */
  .rocket-area {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 8vw; z-index: 4;
    opacity: 0; transition: opacity 0.8s, transform 1.5s cubic-bezier(0.16,1,0.3,1);
  }
  .rocket-area.visible { opacity: 1; }
  .rocket-area.launched { transform: translateX(-50%) translateY(-120vh); }
  .rocket-body {
    width: 3vw; height: 12vh; margin: 0 auto;
    background: linear-gradient(180deg, #ccc 0%, #999 40%, #777 100%);
    border-radius: 1.5vw 1.5vw 0.3vw 0.3vw;
    position: relative;
  }
  .rocket-nose {
    width: 0; height: 0; margin: 0 auto;
    border-left: 1.5vw solid transparent;
    border-right: 1.5vw solid transparent;
    border-bottom: 4vh solid #ddd;
    position: relative;
  }
  .rocket-window {
    position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
    width: 1.2vw; height: 1.2vw; border-radius: 50%;
    background: radial-gradient(circle, #88ccff, #336699);
    border: 0.15vw solid #aaa;
  }
  .rocket-fin-l, .rocket-fin-r {
    position: absolute; bottom: 0; width: 0; height: 0;
    border-top: 3vh solid transparent;
    border-bottom: 0 solid transparent;
  }
  .rocket-fin-l { left: -1vw; border-right: 1.5vw solid #888; }
  .rocket-fin-r { right: -1vw; border-left: 1.5vw solid #888; }

  /* Exhaust */
  @keyframes flicker { 0%,100%{opacity:0.8;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(1.2)} }
  .exhaust {
    width: 2vw; height: 0; margin: 0 auto;
    background: linear-gradient(180deg, #ff6600, #ffcc00, #ffffff00);
    border-radius: 0 0 1vw 1vw;
    transition: height 0.5s;
    animation: flicker 0.15s infinite alternate;
  }
  .exhaust.active { height: 8vh; }

  /* Info bar */
  .info-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4vh;
    background: rgba(10,15,25,0.9); border-top: 1px solid rgba(100,160,255,0.1);
    display: flex; align-items: center; padding: 0 3vw; gap: 4vw;
    font-size: 1vh; color: #6080a0; letter-spacing: 0.1em; z-index: 10;
    opacity: 0; transition: opacity 0.5s;
  }
  .info-bar.visible { opacity: 1; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
  .live-dot { width: 0.6vh; height: 0.6vh; border-radius: 50%; background: #ff3344; animation: blink 1.5s infinite; margin-right: 0.5vw; display: inline-block; }
</style>
</head>
<body>
<div class="scene">
  <canvas id="stars"></canvas>

  <div class="mission-badge" id="missionBadge">
    <div class="mission-label">MISSION</div>
    <div class="mission-name" id="missionName">ARTEMIS VII</div>
  </div>

  <div class="countdown-area" id="countdownArea">
    <div class="t-label" id="tLabel">T-MINUS</div>
    <div class="countdown-digits">
      <div class="digit-group">
        <div class="digit-box" id="dMin">10</div>
        <div class="digit-unit">MIN</div>
      </div>
      <div class="digit-separator">:</div>
      <div class="digit-group">
        <div class="digit-box" id="dSec">00</div>
        <div class="digit-unit">SEC</div>
      </div>
    </div>
  </div>

  <div class="status-panel" id="statusPanel"></div>

  <div class="rocket-area" id="rocketArea">
    <div class="rocket-nose"></div>
    <div class="rocket-body">
      <div class="rocket-window"></div>
      <div class="rocket-fin-l"></div>
      <div class="rocket-fin-r"></div>
    </div>
    <div class="exhaust" id="exhaust"></div>
  </div>

  <div class="info-bar" id="infoBar">
    <span><span class="live-dot"></span> LIVE</span>
    <span id="barTime">--:--:-- UTC</span>
    <span id="barMission">MISSION CONTROL</span>
  </div>
</div>

<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  missionName: 'ARTEMIS VII',
  countdownFrom: 600,
  statusItems: [
    { label: 'PROPULSION', value: 'NOMINAL' },
    { label: 'GUIDANCE', value: 'NOMINAL' },
    { label: 'LIFE SUPPORT', value: 'NOMINAL' },
    { label: 'COMMS', value: 'ACTIVE' },
    { label: 'RANGE SAFETY', value: 'CLEAR' },
    { label: 'WEATHER', value: 'GO' }
  ],
  bgColor: '#070b14',
  accentColor: '#4488cc',
  cycleDuration: 18000
};

document.getElementById('missionName').textContent = CONFIG.missionName;
document.getElementById('barMission').textContent = CONFIG.missionName + ' · MISSION CONTROL';

// Stars canvas
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let W, H;
const stars = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.005 + Math.random() * 0.02
  });
}

function drawStars() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);
  stars.forEach(s => {
    s.twinkle += s.speed;
    const a = 0.3 + 0.7 * Math.abs(Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

// Status panel
const sp = document.getElementById('statusPanel');
CONFIG.statusItems.forEach((item, i) => {
  const row = document.createElement('div');
  row.className = 'status-item';
  row.innerHTML = `<div class="status-dot" id="sDot${i}"></div><span class="status-label">${item.label}</span><span class="status-value">${item.value}</span>`;
  sp.appendChild(row);
});

// Update bar clock
function updateClock() {
  const now = new Date();
  document.getElementById('barTime').textContent =
    String(now.getUTCHours()).padStart(2,'0') + ':' +
    String(now.getUTCMinutes()).padStart(2,'0') + ':' +
    String(now.getUTCSeconds()).padStart(2,'0') + ' UTC';
}
setInterval(updateClock, 1000);
updateClock();

// Animation cycle
function runCycle() {
  const badge = document.getElementById('missionBadge');
  const statusPanel = document.getElementById('statusPanel');
  const rocketArea = document.getElementById('rocketArea');
  const exhaust = document.getElementById('exhaust');
  const infoBar = document.getElementById('infoBar');
  const tLabel = document.getElementById('tLabel');

  // Reset
  badge.classList.remove('visible');
  statusPanel.classList.remove('visible');
  rocketArea.classList.remove('visible', 'launched');
  exhaust.classList.remove('active');
  infoBar.classList.remove('visible');
  tLabel.textContent = 'T-MINUS';
  document.getElementById('dMin').textContent = '10';
  document.getElementById('dSec').textContent = '00';
  for (let i = 0; i < CONFIG.statusItems.length; i++) {
    const dot = document.getElementById('sDot' + i);
    if (dot) dot.classList.remove('go');
  }

  // Entrance
  setTimeout(() => badge.classList.add('visible'), 300);
  setTimeout(() => infoBar.classList.add('visible'), 500);
  setTimeout(() => rocketArea.classList.add('visible'), 800);
  setTimeout(() => statusPanel.classList.add('visible'), 1200);

  // Status items go green sequentially
  CONFIG.statusItems.forEach((_, i) => {
    setTimeout(() => {
      const dot = document.getElementById('sDot' + i);
      if (dot) dot.classList.add('go');
    }, 2000 + i * 600);
  });

  // Countdown simulation (accelerated)
  const countdownDuration = CONFIG.cycleDuration - 5000;
  const startTime = performance.now();
  let countdownFrame;

  function tickCountdown(now) {
    const elapsed = now - startTime - 1500;
    if (elapsed < 0) { countdownFrame = requestAnimationFrame(tickCountdown); return; }
    const progress = Math.min(elapsed / countdownDuration, 1);
    const remaining = Math.max(0, Math.round(CONFIG.countdownFrom * (1 - progress)));
    const min = Math.floor(remaining / 60);
    const sec = remaining % 60;
    document.getElementById('dMin').textContent = String(min).padStart(2, '0');
    document.getElementById('dSec').textContent = String(sec).padStart(2, '0');

    if (remaining <= 0) {
      tLabel.textContent = 'LIFTOFF';
      document.getElementById('dMin').textContent = '00';
      document.getElementById('dSec').textContent = '00';
      return;
    }
    countdownFrame = requestAnimationFrame(tickCountdown);
  }
  countdownFrame = requestAnimationFrame(tickCountdown);

  // Exhaust + launch
  setTimeout(() => exhaust.classList.add('active'), CONFIG.cycleDuration - 3500);
  setTimeout(() => rocketArea.classList.add('launched'), CONFIG.cycleDuration - 2500);

  // Fade out
  setTimeout(() => {
    cancelAnimationFrame(countdownFrame);
    badge.classList.remove('visible');
    statusPanel.classList.remove('visible');
    infoBar.classList.remove('visible');
  }, CONFIG.cycleDuration - 1000);

  setTimeout(runCycle, CONFIG.cycleDuration);
}

runCycle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sand Dunes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .heat-shimmer { position: fixed; top: 30%; left: 0; width: 100%; height: 40%; z-index: 1;
    pointer-events: none; opacity: 0.04;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,200,100,0.1) 3px, rgba(255,200,100,0.1) 4px);
    animation: shimmer 0.3s linear infinite; }
  @keyframes shimmer { 0% { transform: translateY(0) scaleX(1); } 100% { transform: translateY(3px) scaleX(1.001); } }
  .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(10,5,0,0.5) 100%); }
  .center-text { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%);
    z-index: 3; text-align: center; color: #F0D8A8; pointer-events: none; }
  .center-text h1 { font-size: 48px; font-weight: 400; letter-spacing: 12px; font-style: italic;
    text-shadow: 0 0 40px rgba(255,160,50,0.3); animation: desertPulse 6s ease-in-out infinite; }
  .center-text .subtitle { font-size: 13px; letter-spacing: 6px; opacity: 0.4; margin-top: 10px; font-style: italic; }
  @keyframes desertPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="heat-shimmer"></div>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="titleEl">Sahara</h1>
  <div class="subtitle" id="subEl">Endless Horizons</div>
</div>
<script>
const CONFIG = {
  titleText: 'Sahara',
  subtitleText: 'Endless Horizons',
  bgColor: '#1a0a05',
  skyTop: '#0d0608',
  skyMid: '#4a1a0a',
  skyBottom: '#cc6020',
  sunColor: '#FF8C00',
  sandColor: '#C2956B',
  sandParticles: 100,
  duneCount: 4,
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});
function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const sandParts = [];
for (let i = 0; i < CONFIG.sandParticles; i++) {
  sandParts.push({
    x: Math.random() * 2000, y: H * (0.5 + Math.random() * 0.4),
    size: Math.random() * 1.5 + 0.3, speed: Math.random() * 1.5 + 0.5,
    opacity: Math.random() * 0.2 + 0.05, phase: Math.random() * Math.PI * 2,
  });
}

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  g.addColorStop(0, CONFIG.skyTop);
  g.addColorStop(0.5, CONFIG.skyMid);
  g.addColorStop(1, CONFIG.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun(t) {
  const c = hexRgb(CONFIG.sunColor);
  const sx = W * 0.65, sy = H * 0.28;
  const pulse = 0.9 + 0.1 * Math.sin(t * 0.001);
  // Outer halo
  for (let i = 3; i >= 0; i--) {
    const r = (40 + i * 30) * pulse;
    const a = 0.03 - i * 0.005;
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${a})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
  }
  // Core
  const core = ctx.createRadialGradient(sx, sy, 0, sx, sy, 25 * pulse);
  core.addColorStop(0, `rgba(255,240,200,0.9)`);
  core.addColorStop(0.3, `rgba(${c[0]},${c[1]},${c[2]},0.6)`);
  core.addColorStop(1, 'transparent');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(sx, sy, 25 * pulse, 0, Math.PI * 2); ctx.fill();
}

function drawDunes(t) {
  const sc = hexRgb(CONFIG.sandColor);
  for (let d = 0; d < CONFIG.duneCount; d++) {
    const baseY = H * (0.55 + d * 0.1);
    const dark = 0.6 + d * 0.1;
    ctx.beginPath();
    ctx.moveTo(-10, H);
    for (let x = -10; x <= W + 10; x += 4) {
      const h1 = Math.sin(x * 0.003 + d * 2) * 50;
      const h2 = Math.sin(x * 0.007 + d * 5 + t * 0.00005) * 20;
      const h3 = Math.sin(x * 0.001 + d) * 30;
      ctx.lineTo(x, baseY + h1 + h2 + h3);
    }
    ctx.lineTo(W + 10, H); ctx.closePath();
    const r = Math.floor(sc[0] * dark);
    const g = Math.floor(sc[1] * dark);
    const b = Math.floor(sc[2] * dark);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    // Ridge highlight
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 4) {
      const h1 = Math.sin(x * 0.003 + d * 2) * 50;
      const h2 = Math.sin(x * 0.007 + d * 5 + t * 0.00005) * 20;
      const h3 = Math.sin(x * 0.001 + d) * 30;
      const y = baseY + h1 + h2 + h3;
      x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(255,220,160,${0.05 + d * 0.02})`;
    ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawSandParticles(t) {
  sandParts.forEach(p => {
    p.x += p.speed;
    p.phase += 0.01;
    if (p.x > W + 20) { p.x = -20; p.y = H * (0.5 + Math.random() * 0.4); }
    const dy = Math.sin(p.phase) * 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y + dy, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,170,120,${p.opacity})`;
    ctx.fill();
  });
}

// Distant stars in sky
const stars = [];
for (let i = 0; i < 60; i++) stars.push({
  x: Math.random() * 2000, y: Math.random() * H * 0.3,
  r: Math.random() * 1 + 0.2, phase: Math.random() * Math.PI * 2,
});

function drawStars(t) {
  stars.forEach(s => {
    s.phase += 0.008;
    const a = 0.15 + 0.15 * Math.sin(s.phase);
    ctx.beginPath(); ctx.arc(s.x % W, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,240,200,${a})`; ctx.fill();
  });
}

function animate(t) {
  drawSky();
  drawStars(t);
  drawSun(t);
  drawDunes(t);
  drawSandParticles(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

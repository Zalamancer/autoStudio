<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trading Cards Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1a2e; font-family: 'Arial', sans-serif; }
  #stage { position: absolute; inset: 0; z-index: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 16px; padding: 30px; }

  .card { width: 155px; opacity: 0; will-change: transform, opacity; }
  .card-frame { border-radius: 10px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.4); position: relative; }
  .card-art { width: 100%; height: 140px; position: relative; }
  .card-glow { position: absolute; inset: 0; opacity: 0.3; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%); }
  .card-rarity { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; font-size: 8px; color: #fff; font-weight: 700; }
  .card-body { background: #16213e; padding: 10px; }
  .card-name { font-size: 13px; font-weight: 700; color: #e0e0ff; margin-bottom: 4px; }
  .card-type { font-size: 9px; color: #8888bb; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .card-stats { display: flex; gap: 8px; }
  .card-stat { display: flex; flex-direction: column; align-items: center; }
  .stat-val { font-size: 14px; font-weight: 700; color: #ffd700; }
  .stat-label { font-size: 7px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

  @keyframes dealCard { 0% { opacity: 0; transform: translateX(-80px) rotate(-15deg); } 60% { transform: translateX(4px) rotate(1deg); } 100% { opacity: 1; transform: translateX(0) rotate(0); } }
  @keyframes foldCard { 0% { opacity: 1; transform: rotateY(0); } 100% { opacity: 0; transform: rotateY(90deg); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  cards: [
    { color: '#c62828', name: 'Blaze Dragon', type: 'Fire', rarity: 'S', atk: 95, def: 70 },
    { color: '#1565c0', name: 'Frost Titan', type: 'Ice', rarity: 'A', atk: 80, def: 90 },
    { color: '#2e7d32', name: 'Vine Serpent', type: 'Nature', rarity: 'B', atk: 65, def: 75 },
    { color: '#6a1b9a', name: 'Shadow Mage', type: 'Dark', rarity: 'S', atk: 88, def: 55 },
    { color: '#f57f17', name: 'Solar Knight', type: 'Light', rarity: 'A', atk: 78, def: 82 },
    { color: '#00838f', name: 'Tidal Leviathan', type: 'Water', rarity: 'A', atk: 72, def: 88 },
    { color: '#d84315', name: 'Magma Golem', type: 'Earth', rarity: 'B', atk: 60, def: 95 },
    { color: '#283593', name: 'Storm Phoenix', type: 'Wind', rarity: 'S', atk: 92, def: 62 },
  ],
  bgColor: '#1a1a2e',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function build() {
  stage.innerHTML = '';
  const els = [];
  CONFIG.cards.forEach(c => {
    const el = document.createElement('div'); el.className = 'card';
    const frame = document.createElement('div'); frame.className = 'card-frame';
    const art = document.createElement('div'); art.className = 'card-art'; art.style.background = c.color;
    const glow = document.createElement('div'); glow.className = 'card-glow';
    const rarity = document.createElement('div'); rarity.className = 'card-rarity'; rarity.textContent = c.rarity;
    art.appendChild(glow); art.appendChild(rarity);
    const body = document.createElement('div'); body.className = 'card-body';
    const name = document.createElement('div'); name.className = 'card-name'; name.textContent = c.name;
    const type = document.createElement('div'); type.className = 'card-type'; type.textContent = c.type;
    const stats = document.createElement('div'); stats.className = 'card-stats';
    [{label:'ATK',val:c.atk},{label:'DEF',val:c.def}].forEach(s => {
      const stat = document.createElement('div'); stat.className = 'card-stat';
      const val = document.createElement('div'); val.className = 'stat-val'; val.textContent = s.val;
      const lab = document.createElement('div'); lab.className = 'stat-label'; lab.textContent = s.label;
      stat.appendChild(val); stat.appendChild(lab); stats.appendChild(stat);
    });
    body.appendChild(name); body.appendChild(type); body.appendChild(stats);
    frame.appendChild(art); frame.appendChild(body);
    el.appendChild(frame); stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=240, inD=450, hold=3500, outS=200, outD=400, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`dealCard ${inD}ms ease-out forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`foldCard ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

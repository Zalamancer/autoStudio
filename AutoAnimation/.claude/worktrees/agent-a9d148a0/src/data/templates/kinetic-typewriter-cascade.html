<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Typewriter Cascade - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CRT Scanline overlay */
  #scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 900;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.06) 2px,
      rgba(0, 0, 0, 0.06) 4px
    );
  }

  /* Horizontal scan beam that sweeps slowly */
  #scan-beam {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 6px;
    pointer-events: none;
    z-index: 903;
    background: linear-gradient(
      to bottom,
      transparent,
      rgba(255, 255, 255, 0.04),
      transparent
    );
    animation: scanBeam 4s linear infinite;
  }

  @keyframes scanBeam {
    0%   { top: -6px; }
    100% { top: 100vh; }
  }

  /* CRT Vignette */
  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 901;
    background: radial-gradient(
      ellipse at center,
      transparent 55%,
      rgba(0, 0, 0, 0.25) 75%,
      rgba(0, 0, 0, 0.6) 100%
    );
  }

  /* Subtle screen flicker */
  #flicker {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 902;
    opacity: 0;
    background: rgba(255, 255, 255, 0.015);
    animation: flicker 0.15s infinite;
  }

  @keyframes flicker {
    0%   { opacity: 0; }
    50%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Particle canvas for shatter debris */
  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
  }

  #stage {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .word-row {
    display: flex;
    align-items: center;
    position: relative;
    white-space: nowrap;
  }

  .letter {
    display: inline-block;
    opacity: 0;
    transition: none;
    position: relative;
  }

  .letter.visible {
    opacity: 1;
  }

  .cursor {
    display: inline-block;
    width: 3px;
    margin-left: 2px;
    opacity: 0;
    position: relative;
    top: 2px;
  }

  .cursor.active {
    animation: blink var(--cursor-blink-speed, 500ms) step-end infinite;
  }

  .cursor.hidden {
    opacity: 0 !important;
    animation: none !important;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  /* Phosphor glow on freshly typed letter */
  .letter.just-typed {
    text-shadow:
      0 0 6px currentColor,
      0 0 14px currentColor,
      0 0 28px currentColor;
  }

  /* Residual phosphor afterglow that fades slower */
  .letter.afterglow {
    text-shadow:
      0 0 4px currentColor,
      0 0 10px currentColor;
    transition: text-shadow 0.4s ease-out;
  }

  /* Slight vertical jitter on word row during typing */
  .word-row.typing {
    animation: rowJitter 0.08s steps(2) infinite;
  }

  @keyframes rowJitter {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-0.5px); }
    100% { transform: translateY(0px); }
  }

  /* Pulse glow behind stage during hold phase */
  #stage.hold-glow {
    filter: drop-shadow(0 0 30px rgba(0, 255, 65, 0.08));
    animation: holdPulse 2s ease-in-out infinite;
  }

  @keyframes holdPulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(0, 255, 65, 0.06)); }
    50%      { filter: drop-shadow(0 0 50px rgba(0, 255, 65, 0.14)); }
  }
</style>
</head>
<body>
<div id="scanlines"></div>
<div id="scan-beam"></div>
<div id="vignette"></div>
<div id="flicker"></div>
<canvas id="particle-canvas"></canvas>
<div id="stage"></div>

<script>
const CONFIG = {
  words: ['BELIEVE', 'IN', 'YOURSELF', 'NEVER', 'GIVE', 'UP'],
  colors: ['#00FF41', '#FFFFFF', '#00FF41', '#FFD700', '#FFFFFF', '#FFD700'],
  bgColor: '#0D0D0D',
  typeSpeed: 80,
  cursorBlinkSpeed: 500,
  cycleDuration: 8000,
  fontFamily: 'Courier New',
  fontSize: 72,
};

// ── State ──────────────────────────────────────────────────────────
let wordElements = [];   // { row, letters[], cursor, typed: 0 }
let phase = 'idle';      // idle | typing | hold | shatter | pause
let currentWordIdx = 0;
let currentLetterIdx = 0;
let typeTimer = null;
let phaseTimer = null;

// ── Particle System ────────────────────────────────────────────────
const particles = [];
let particleCanvas, particleCtx;
let particleAnimFrame = null;

function initParticleCanvas() {
  particleCanvas = document.getElementById('particle-canvas');
  particleCtx = particleCanvas.getContext('2d');
  resizeParticleCanvas();
  window.addEventListener('resize', resizeParticleCanvas);
}

function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 4;
    const size = 1.5 + Math.random() * 3;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size,
      color,
      alpha: 0.8 + Math.random() * 0.2,
      decay: 0.008 + Math.random() * 0.015,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.15,
    });
  }
}

function spawnShatterBurst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    const size = 1 + Math.random() * 2.5;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      size,
      color,
      alpha: 1,
      decay: 0.006 + Math.random() * 0.012,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
    });
  }
}

function updateParticles() {
  particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03; // gentle gravity
    p.vx *= 0.995; // air resistance
    p.alpha -= p.decay;
    p.rotation += p.rotSpeed;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    particleCtx.save();
    particleCtx.translate(p.x, p.y);
    particleCtx.rotate(p.rotation);
    particleCtx.globalAlpha = p.alpha;
    particleCtx.fillStyle = p.color;
    particleCtx.shadowColor = p.color;
    particleCtx.shadowBlur = p.size * 2;

    // Draw small rectangles (like letter fragments)
    particleCtx.fillRect(
      -p.size / 2, -p.size / 2,
      p.size, p.size * 0.6
    );
    particleCtx.restore();
  }

  particleAnimFrame = requestAnimationFrame(updateParticles);
}

// ── Init ───────────────────────────────────────────────────────────
function init() {
  document.body.style.backgroundColor = CONFIG.bgColor;
  document.body.style.fontFamily = `'${CONFIG.fontFamily}', monospace`;
  document.documentElement.style.setProperty(
    '--cursor-blink-speed', CONFIG.cursorBlinkSpeed + 'ms'
  );

  initParticleCanvas();
  updateParticles();
  buildStage();
  startCycle();
}

// ── Build DOM ──────────────────────────────────────────────────────
function buildStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.classList.remove('hold-glow');
  wordElements = [];

  // Cap font size for portrait viewports
  const vw = window.innerWidth, vh = window.innerHeight;
  const cappedFontSize = Math.min(CONFIG.fontSize, vw * 0.12, vh / (CONFIG.words.length * 1.6));
  const lineHeight = cappedFontSize * 1.35;

  CONFIG.words.forEach((word, wi) => {
    const color = CONFIG.colors[wi % CONFIG.colors.length];

    const row = document.createElement('div');
    row.className = 'word-row';
    row.style.fontSize = cappedFontSize + 'px';
    row.style.color = color;
    row.style.height = lineHeight + 'px';
    row.style.lineHeight = lineHeight + 'px';

    // Cascade offset: stagger the starting left position
    const indent = wi * cappedFontSize * 0.5;
    row.style.paddingLeft = indent + 'px';

    const letters = [];

    for (let li = 0; li < word.length; li++) {
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = word[li];
      span.style.color = color;
      row.appendChild(span);
      letters.push(span);
    }

    // Cursor element
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.style.backgroundColor = color;
    cursor.style.height = (cappedFontSize * 0.85) + 'px';
    row.appendChild(cursor);

    stage.appendChild(row);

    wordElements.push({
      row,
      letters,
      cursor,
      color,
      word,
      typed: 0,
    });
  });
}

// ── Cycle Controller ───────────────────────────────────────────────
function startCycle() {
  resetAll();
  buildStage();
  phase = 'typing';
  currentWordIdx = 0;
  currentLetterIdx = 0;
  startTypingWord(0);
}

function resetAll() {
  clearTimeout(typeTimer);
  clearTimeout(phaseTimer);
  phase = 'idle';
}

// ── Typing Phase ───────────────────────────────────────────────────
function startTypingWord(wordIdx) {
  if (wordIdx >= wordElements.length) {
    onAllWordsTyped();
    return;
  }

  currentWordIdx = wordIdx;
  currentLetterIdx = 0;

  const entry = wordElements[wordIdx];
  entry.cursor.classList.add('active');
  entry.cursor.classList.remove('hidden');

  // Add jitter to the active row
  entry.row.classList.add('typing');

  typeNextLetter();
}

function typeNextLetter() {
  const entry = wordElements[currentWordIdx];

  if (currentLetterIdx >= entry.letters.length) {
    // Word complete - remove jitter, pause, then next word
    entry.row.classList.remove('typing');

    phaseTimer = setTimeout(() => {
      entry.cursor.classList.remove('active');
      entry.cursor.classList.add('hidden');
      startTypingWord(currentWordIdx + 1);
    }, CONFIG.typeSpeed * 3);
    return;
  }

  const letter = entry.letters[currentLetterIdx];
  letter.classList.add('visible');
  letter.classList.add('just-typed');

  // Spawn tiny particles at letter position for keystroke sparks
  const rect = letter.getBoundingClientRect();
  spawnParticles(
    rect.left + rect.width / 2,
    rect.top + rect.height / 2,
    entry.color,
    3
  );

  // Transition: bright glow -> afterglow -> normal
  setTimeout(() => {
    letter.classList.remove('just-typed');
    letter.classList.add('afterglow');
  }, CONFIG.typeSpeed * 0.5);

  setTimeout(() => {
    letter.classList.remove('afterglow');
  }, CONFIG.typeSpeed * 2.5);

  entry.typed = currentLetterIdx + 1;
  currentLetterIdx++;

  typeTimer = setTimeout(typeNextLetter, CONFIG.typeSpeed);
}

// ── Hold Phase ─────────────────────────────────────────────────────
function onAllWordsTyped() {
  phase = 'hold';

  // Remove jitter from all rows
  wordElements.forEach((e) => e.row.classList.remove('typing'));

  // Show final cursor blinking on last word
  const lastEntry = wordElements[wordElements.length - 1];
  lastEntry.cursor.classList.add('active');
  lastEntry.cursor.classList.remove('hidden');

  // Add subtle glow pulse to entire stage
  const stage = document.getElementById('stage');
  stage.classList.add('hold-glow');

  // Calculate how much time was spent typing
  const totalLetters = CONFIG.words.reduce((sum, w) => sum + w.length, 0);
  const totalWordPauses = CONFIG.words.length * CONFIG.typeSpeed * 3;
  const typingTime = totalLetters * CONFIG.typeSpeed + totalWordPauses;

  // Hold for remaining cycle time (minus shatter + pause durations)
  const shatterDuration = 1400;
  const pauseDuration = 900;
  const holdTime = Math.max(
    CONFIG.cycleDuration - typingTime - shatterDuration - pauseDuration,
    1200
  );

  phaseTimer = setTimeout(() => {
    stage.classList.remove('hold-glow');
    lastEntry.cursor.classList.remove('active');
    lastEntry.cursor.classList.add('hidden');
    startShatter();
  }, holdTime);
}

// ── Shatter Phase ──────────────────────────────────────────────────
function startShatter() {
  phase = 'shatter';

  // Hide all cursors
  wordElements.forEach((entry) => {
    entry.cursor.classList.remove('active');
    entry.cursor.classList.add('hidden');
  });

  // Calculate center of the stage for explosion direction
  const stage = document.getElementById('stage');
  const stageRect = stage.getBoundingClientRect();
  const centerX = stageRect.left + stageRect.width / 2;
  const centerY = stageRect.top + stageRect.height / 2;

  // Apply shatter transforms to each letter with particle burst
  wordElements.forEach((entry, wi) => {
    entry.letters.forEach((letter, li) => {
      const rect = letter.getBoundingClientRect();
      const letterCX = rect.left + rect.width / 2;
      const letterCY = rect.top + rect.height / 2;

      // Direction from center outward
      let dx = letterCX - centerX;
      let dy = letterCY - centerY;

      // Add randomness for organic scattering
      dx += (Math.random() - 0.5) * 250;
      dy += (Math.random() - 0.5) * 250;

      // Normalize and amplify force
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = 350 + Math.random() * 450;
      const tx = (dx / dist) * force;
      const ty = (dy / dist) * force;

      // Random rotation and shrink
      const rot = (Math.random() - 0.5) * 720;
      const sc = 0.1 + Math.random() * 0.4;

      // Stagger per word and letter index
      const delay = wi * 50 + li * 20;

      setTimeout(() => {
        // Spawn debris particles at letter position
        spawnShatterBurst(letterCX, letterCY, entry.color, 5);

        letter.style.transition =
          'transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1), ' +
          'opacity 0.9s ease-out';
        letter.style.transform =
          'translate(' + tx + 'px, ' + ty + 'px) ' +
          'rotate(' + rot + 'deg) ' +
          'scale(' + sc + ')';
        letter.style.opacity = '0';
      }, delay);
    });
  });

  // After shatter animation completes, pause then restart cycle
  phaseTimer = setTimeout(() => {
    phase = 'pause';
    phaseTimer = setTimeout(startCycle, 900);
  }, 1400);
}

// ── Boot ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Impact', 'Arial Black', sans-serif; }
.scene { width: 100%; height: 100%; position: relative; overflow: hidden; }
.room { position: absolute; inset: 0; background: linear-gradient(180deg, #ffeaa7 0%, #fab1a0 100%); }
.fire { position: absolute; font-size: 60px; opacity: 0; }
.fire.show { opacity: 1; animation: flicker 0.5s ease-in-out infinite alternate; }
@keyframes flicker { 0% { transform: scale(1) rotate(-5deg); } 100% { transform: scale(1.1) rotate(5deg); } }
.character { position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%); font-size: 120px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); z-index: 10; }
.speech-bubble { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: white; border-radius: 24px; padding: 20px 40px; font-size: 42px; color: #2d3436; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0; z-index: 20; max-width: 600px; }
.speech-bubble::after { content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); border: 12px solid transparent; border-top-color: white; }
.speech-bubble.show { opacity: 1; transition: opacity 0.5s ease; }
.table { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 300px; height: 80px; background: #b2bec3; border-radius: 8px; z-index: 5; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
.cup-on-table { position: absolute; bottom: 65%; left: 50%; transform: translateX(-50%); font-size: 40px; z-index: 6; }
.smoke { position: absolute; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(255,100,0,0.0) 0%, rgba(255,100,0,0.0) 100%); pointer-events: none; z-index: 15; opacity: 0; }
.smoke.show { opacity: 1; background: linear-gradient(180deg, rgba(255,100,0,0.15) 0%, rgba(255,50,0,0.05) 100%); transition: all 2s ease; }
.ember { position: absolute; width: 6px; height: 6px; background: #e17055; border-radius: 50%; opacity: 0; }
.ember.show { animation: rise 2s ease-in infinite; }
@keyframes rise { 0% { opacity: 0.8; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-200px) scale(0); } }
</style>
</head>
<body>
<script>
const CONFIG = {
  speechText: 'This is fine.',
  bgColor1: '#ffeaa7',
  bgColor2: '#fab1a0',
  speechBgColor: '#ffffff',
  speechTextColor: '#2d3436',
  fontSize: 42,
  fireIntensity: 8,
  animationSpeed: 300
};
</script>
<div class="scene">
  <div class="room" id="room"></div>
  <div class="smoke" id="smoke"></div>
  <div class="fire" id="f1" style="top:10%;left:5%">\u{1F525}</div>
  <div class="fire" id="f2" style="top:20%;right:10%">\u{1F525}</div>
  <div class="fire" id="f3" style="top:40%;left:8%">\u{1F525}</div>
  <div class="fire" id="f4" style="top:35%;right:5%">\u{1F525}</div>
  <div class="fire" id="f5" style="top:55%;left:15%">\u{1F525}</div>
  <div class="fire" id="f6" style="top:50%;right:15%">\u{1F525}</div>
  <div class="fire" id="f7" style="top:15%;left:25%">\u{1F525}</div>
  <div class="fire" id="f8" style="top:45%;right:25%">\u{1F525}</div>
  <div class="ember" id="e1" style="bottom:40%;left:20%"></div>
  <div class="ember" id="e2" style="bottom:35%;right:25%"></div>
  <div class="ember" id="e3" style="bottom:50%;left:60%"></div>
  <span class="character">\u{1F436}</span>
  <div class="table"></div>
  <span class="cup-on-table">\u2615</span>
  <div class="speech-bubble" id="speech"></div>
</div>
<script>
document.getElementById('speech').textContent = CONFIG.speechText;
document.getElementById('speech').style.background = CONFIG.speechBgColor;
document.getElementById('speech').style.color = CONFIG.speechTextColor;
document.getElementById('speech').style.fontSize = CONFIG.fontSize + 'px';
document.getElementById('room').style.background = 'linear-gradient(180deg,' + CONFIG.bgColor1 + ',' + CONFIG.bgColor2 + ')';

var fires = document.querySelectorAll('.fire');
var embers = document.querySelectorAll('.ember');
var count = Math.min(CONFIG.fireIntensity, fires.length);
for (var i = 0; i < count; i++) {
  (function(idx) {
    setTimeout(function() {
      fires[idx].classList.add('show');
    }, CONFIG.animationSpeed * (idx + 1));
  })(i);
}
setTimeout(function() {
  document.getElementById('smoke').classList.add('show');
  embers.forEach(function(e) { e.classList.add('show'); });
}, CONFIG.animationSpeed * (count + 1));
setTimeout(function() {
  document.getElementById('speech').classList.add('show');
}, CONFIG.animationSpeed * (count + 3));
</script>
</body>
</html>

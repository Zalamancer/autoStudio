<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .tracking-header {
    position: absolute;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
  }
  .tracking-label {
    font-size: 0.9vw;
    letter-spacing: 0.4em;
    color: #6b7280;
    text-transform: uppercase;
    margin-bottom: 0.8vh;
  }
  .tracking-number {
    font-size: 2.2vw;
    font-weight: 700;
    color: #f0f0f0;
    letter-spacing: 0.12em;
    font-family: 'Courier New', monospace;
  }

  .timeline-container {
    position: absolute;
    left: 50%;
    top: 18vh;
    transform: translateX(-50%);
    width: 50vw;
    height: 58vh;
  }

  .timeline-line-bg {
    position: absolute;
    left: 2.4vw;
    top: 1vh;
    width: 3px;
    height: calc(100% - 2vh);
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
  }
  .timeline-line-fill {
    position: absolute;
    left: 2.4vw;
    top: 1vh;
    width: 3px;
    height: 0%;
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  .step {
    position: relative;
    display: flex;
    align-items: flex-start;
    margin-bottom: 3vh;
    padding-left: 5.5vw;
    opacity: 0;
    transform: translateX(-15px);
  }
  .step-marker {
    position: absolute;
    left: 1.2vw;
    top: 0.2vh;
    width: 2.4vw;
    height: 2.4vw;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: border-color 0.4s, background 0.4s;
  }
  .step-marker.active {
    border-color: var(--accent);
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .step-marker svg {
    width: 1.2vw;
    height: 1.2vw;
    fill: none;
    stroke: white;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.3s, transform 0.3s;
  }
  .step-marker.active svg {
    opacity: 1;
    transform: scale(1);
  }
  .step-label {
    font-size: 1.5vw;
    font-weight: 600;
    color: #d1d5db;
    margin-bottom: 0.3vh;
  }
  .step-time {
    font-size: 0.95vw;
    color: #6b7280;
  }
  .step-pulse {
    position: absolute;
    left: 1.2vw;
    top: 0.2vh;
    width: 2.4vw;
    height: 2.4vw;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }

  .delivery-footer {
    position: absolute;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
  }
  .delivery-label {
    font-size: 0.85vw;
    letter-spacing: 0.3em;
    color: #6b7280;
    text-transform: uppercase;
    margin-bottom: 0.6vh;
  }
  .delivery-date {
    font-size: 1.8vw;
    font-weight: 600;
    color: #f0f0f0;
  }

  .package-icon {
    position: absolute;
    right: 8vw;
    top: 50%;
    transform: translateY(-50%);
    font-size: 8vw;
    opacity: 0;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
</style>
</head>
<body>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  trackingNumber: "PKG-2024-8847-XKCD",
  steps: [
    { label: "Order Placed", time: "Jan 15, 2:34 PM" },
    { label: "Processing", time: "Jan 15, 4:12 PM" },
    { label: "Shipped", time: "Jan 16, 9:05 AM" },
    { label: "In Transit", time: "Jan 17, 11:30 AM" },
    { label: "Delivered", time: "Jan 18, 3:22 PM" }
  ],
  bgColor: "#111827",
  accentColor: "#10b981",
  cycleDuration: 10
};
// === END EDITABLE CONFIG ===

document.body.style.background = CONFIG.bgColor;
document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
document.documentElement.style.setProperty('--accent-glow', CONFIG.accentColor + '60');

const stepsHTML = CONFIG.steps.map((s, i) => `
  <div class="step" data-index="${i}">
    <div class="step-pulse"></div>
    <div class="step-marker">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div>
      <div class="step-label">${s.label}</div>
      <div class="step-time">${s.time}</div>
    </div>
  </div>
`).join('');

document.body.innerHTML = `
  <div class="tracking-header">
    <div class="tracking-label">Tracking Number</div>
    <div class="tracking-number">${CONFIG.trackingNumber}</div>
  </div>
  <div class="timeline-container">
    <div class="timeline-line-bg"></div>
    <div class="timeline-line-fill"></div>
    ${stepsHTML}
  </div>
  <div class="delivery-footer">
    <div class="delivery-label">Estimated Delivery</div>
    <div class="delivery-date">${CONFIG.steps[CONFIG.steps.length - 1].time}</div>
  </div>
  <div class="package-icon">📦</div>
`;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const lineFill = $('.timeline-line-fill');
lineFill.style.background = `linear-gradient(180deg, ${CONFIG.accentColor}, ${CONFIG.accentColor}cc)`;
lineFill.style.boxShadow = `0 0 12px ${CONFIG.accentColor}40`;

const cycleDur = CONFIG.cycleDuration * 1000;
const stepCount = CONFIG.steps.length;
let startTime = null;
let lastPulseStep = -1;

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

function triggerPulse(stepEl) {
  const pulse = stepEl.querySelector('.step-pulse');
  pulse.style.animation = 'none';
  void pulse.offsetWidth;
  pulse.style.animation = 'pulse-ring 0.8s ease-out forwards';
}

function animate(now) {
  if (!startTime) startTime = now;
  const elapsed = (now - startTime) % cycleDur;
  const phase = elapsed / cycleDur;

  const entrancePct = 0.1;
  const revealPct = 0.6;
  const holdPct = 0.15;
  const exitPct = 0.15;

  let globalOpacity = 1;
  let revealProgress = 0;

  if (phase < entrancePct) {
    globalOpacity = easeOutCubic(phase / entrancePct);
    revealProgress = 0;
  } else if (phase < entrancePct + revealPct) {
    const t = (phase - entrancePct) / revealPct;
    revealProgress = t;
    globalOpacity = 1;
  } else if (phase < entrancePct + revealPct + holdPct) {
    revealProgress = 1;
    globalOpacity = 1;
  } else {
    const t = (phase - entrancePct - revealPct - holdPct) / exitPct;
    revealProgress = 1;
    globalOpacity = 1 - easeInCubic(Math.min(1, t));
  }

  // Header
  const header = $('.tracking-header');
  header.style.opacity = globalOpacity;
  header.style.transform = 'translateX(-50%) translateY(' + ((1 - Math.min(1, globalOpacity * 2)) * -15) + 'px)';

  // Package icon
  const pkgIcon = $('.package-icon');
  pkgIcon.style.opacity = globalOpacity * 0.15;
  pkgIcon.style.transform = 'translateY(' + (-50 + Math.sin(now * 0.002) * 2) + '%)';

  // Timeline line fill
  const fillPct = Math.min(1, revealProgress * 1.15);
  const lineBg = $('.timeline-line-bg');
  const lineHeight = lineBg.offsetHeight;
  lineFill.style.height = (fillPct * 100) + '%';

  // Steps
  const steps = $$('.step');
  const currentStep = Math.floor(revealProgress * stepCount);

  steps.forEach((stepEl, i) => {
    const stepStart = i / stepCount;
    const stepEnd = (i + 1) / stepCount;
    const stepT = Math.max(0, Math.min(1, (revealProgress - stepStart) / (1 / stepCount)));
    const entryT = easeOutBack(Math.min(1, stepT * 2));

    stepEl.style.opacity = entryT * globalOpacity;
    stepEl.style.transform = 'translateX(' + ((1 - entryT) * -15) + 'px)';

    const marker = stepEl.querySelector('.step-marker');
    if (stepT > 0.4) {
      marker.classList.add('active');
    } else {
      marker.classList.remove('active');
    }

    // Pulse on first activation
    if (i === currentStep && i !== lastPulseStep && stepT > 0.4) {
      triggerPulse(stepEl);
      lastPulseStep = i;
    }
  });

  // Reset pulse tracker at cycle boundary
  if (revealProgress < 0.01) lastPulseStep = -1;

  // Footer
  const footer = $('.delivery-footer');
  const footerT = Math.max(0, Math.min(1, (revealProgress - 0.75) / 0.25));
  footer.style.opacity = easeOutCubic(footerT) * globalOpacity;
  footer.style.transform = 'translateX(-50%) translateY(' + ((1 - easeOutCubic(footerT)) * 15) + 'px)';

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
    document.body.style.background = CONFIG.bgColor;
  }
});
</script>
</body>
</html>

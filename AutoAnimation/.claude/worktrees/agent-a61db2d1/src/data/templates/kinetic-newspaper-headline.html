<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Newspaper Headline - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #f5f0e8; font-family: 'Times New Roman', 'Georgia', serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.02;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(0,0,0,0.03) 24px, rgba(0,0,0,0.03) 25px); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .rule-line { position: absolute; height: 2px; background: #000; pointer-events: none; z-index: 1; }

  @keyframes headlineSlam { 0% { opacity: 0; transform: translate(-50%,-50%) translateY(-30px) scaleY(2); } 40% { transform: translate(-50%,-50%) translateY(2px) scaleY(0.95); } 100% { opacity: 1; transform: translate(-50%,-50%) translateY(0) scaleY(1); } }
  @keyframes headlineSlide { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) translateX(-30px); } }
  @keyframes ruleGrow { 0% { width: 0; } 100% { width: var(--rw); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['EXTRA!','BREAKING','FRONT PAGE','EXCLUSIVE','FLASH','BULLETIN','HEADLINE','STOP PRESS'],
  bgColor: '#f5f0e8',
  fontFamily: "'Times New Roman', 'Georgia', serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 41 + 17);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(34 + rng() * 28, cellW * 0.38, cellH * 0.5);
    const isItalic = rng() > 0.5;
    const isBold = rng() > 0.3;
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:#1a1a1a;${isItalic?'font-style:italic;':''}${isBold?'font-weight:700;':''}letter-spacing:3px;text-transform:uppercase;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=300, inD=400, hold=3000, outS=200, outD=350, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`headlineSlam ${inD}ms cubic-bezier(0.2,0.8,0.3,1) forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`headlineSlide ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

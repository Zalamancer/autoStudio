<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Proof Wall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .title {
    font-size: clamp(18px, 3vw, 32px);
    font-weight: 700;
    color: #ffffff;
    text-align: center;
    margin-bottom: 3vh;
    opacity: 0;
    transform: translateY(-20px);
    letter-spacing: 0.5px;
  }
  .title.show {
    animation: titleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .title.hide {
    animation: titleOut 0.4s ease-in forwards;
  }

  @keyframes titleIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes titleOut {
    to { opacity: 0; transform: translateY(-15px); }
  }

  .wall {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 1.5vw, 16px);
    padding: 0 4vw;
    max-width: 960px;
    width: 100%;
  }

  .card {
    border-radius: 12px;
    padding: clamp(12px, 2vw, 20px);
    opacity: 0;
    transform: scale(0.7) rotate(var(--rot, 0deg));
    transition: none;
    position: relative;
    overflow: hidden;
  }
  .card.show {
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .card.breathe {
    animation: breathe 3s ease-in-out infinite;
    opacity: 1;
  }
  .card.hide {
    animation: cardOut 0.35s ease-in forwards;
  }

  @keyframes cardIn {
    0% { opacity: 0; transform: scale(0.7) rotate(var(--rot, 0deg)); }
    100% { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) rotate(var(--rot, 0deg)) translateY(0); }
    50% { transform: scale(1.015) rotate(var(--rot, 0deg)) translateY(-3px); }
  }
  @keyframes cardOut {
    0% { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
    100% { opacity: 0; transform: scale(0.85) rotate(var(--rot, 0deg)) translateY(15px); }
  }

  .stars {
    display: flex;
    gap: 3px;
    margin-bottom: 8px;
  }
  .star {
    width: clamp(12px, 1.8vw, 18px);
    height: clamp(12px, 1.8vw, 18px);
  }
  .star svg { width: 100%; height: 100%; }

  .review-text {
    font-size: clamp(10px, 1.4vw, 14px);
    line-height: 1.5;
    color: #d1d5db;
    margin-bottom: 10px;
    font-style: italic;
  }
  .review-text::before { content: '\201C'; }
  .review-text::after { content: '\201D'; }

  .reviewer {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .reviewer-name {
    font-size: clamp(10px, 1.3vw, 13px);
    font-weight: 600;
    color: #f3f4f6;
  }
  .verified {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: clamp(8px, 1vw, 10px);
    color: #34d399;
    font-weight: 500;
  }
  .verified svg {
    width: clamp(10px, 1.2vw, 14px);
    height: clamp(10px, 1.2vw, 14px);
  }
</style>
</head>
<body>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  title: "What Our Customers Say",
  reviews: [
    { text: "Absolutely transformed our workflow. The results speak for themselves.", author: "Sarah M.", rating: 5, verified: true },
    { text: "Best investment we made this year. Support team is incredible.", author: "James K.", rating: 5, verified: true },
    { text: "Simple, powerful, and elegant. Exactly what we needed.", author: "Priya R.", rating: 4, verified: true },
    { text: "Exceeded every expectation. Our team productivity doubled.", author: "Marco L.", rating: 5, verified: false },
    { text: "Game-changer for our small business. Highly recommend!", author: "Aisha N.", rating: 5, verified: true },
    { text: "The attention to detail is remarkable. Five stars all the way.", author: "David C.", rating: 5, verified: true }
  ],
  bgColor: "#111111",
  accentColor: "#f59e0b",
  cycleDuration: 10
};
// === END EDITABLE CONFIG ===

document.body.style.background = CONFIG.bgColor;

const titleEl = document.createElement('div');
titleEl.className = 'title';
titleEl.textContent = CONFIG.title;
document.body.appendChild(titleEl);

const wall = document.createElement('div');
wall.className = 'wall';
document.body.appendChild(wall);

function createStarSVG(filled, color) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 20 20');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z');
  path.setAttribute('fill', filled ? color : '#374151');
  svg.appendChild(path);
  return svg;
}

function createVerifiedSVG() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 20 20');
  svg.setAttribute('fill', '#34d399');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('fill-rule', 'evenodd');
  path.setAttribute('d', 'M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z');
  path.setAttribute('clip-rule', 'evenodd');
  svg.appendChild(path);
  return svg;
}

let cards = [];

function buildCard(review, index) {
  const card = document.createElement('div');
  card.className = 'card';
  const rotations = [-1.5, 0.8, -0.5, 1.2, -0.8, 0.6];
  const rot = rotations[index % rotations.length] + 'deg';
  card.style.setProperty('--rot', rot);
  card.style.background = '#1f2937';
  card.style.border = '1px solid #374151';
  card.style.boxShadow = '0 4px 20px rgba(0,0,0,0.3)';

  const accentBar = document.createElement('div');
  accentBar.style.cssText = 'position:absolute;top:0;left:0;right:0;height:3px;background:' + CONFIG.accentColor + ';border-radius:12px 12px 0 0;';
  card.appendChild(accentBar);

  const stars = document.createElement('div');
  stars.className = 'stars';
  for (let i = 0; i < 5; i++) {
    const starWrap = document.createElement('span');
    starWrap.className = 'star';
    starWrap.appendChild(createStarSVG(i < review.rating, CONFIG.accentColor));
    stars.appendChild(starWrap);
  }
  card.appendChild(stars);

  const text = document.createElement('div');
  text.className = 'review-text';
  text.textContent = review.text;
  card.appendChild(text);

  const reviewer = document.createElement('div');
  reviewer.className = 'reviewer';
  const name = document.createElement('span');
  name.className = 'reviewer-name';
  name.textContent = review.author;
  reviewer.appendChild(name);

  if (review.verified) {
    const badge = document.createElement('span');
    badge.className = 'verified';
    badge.appendChild(createVerifiedSVG());
    badge.appendChild(document.createTextNode(' Verified'));
    reviewer.appendChild(badge);
  }
  card.appendChild(reviewer);
  return card;
}

function buildWall() {
  wall.innerHTML = '';
  cards = [];
  CONFIG.reviews.forEach(function(review, i) {
    var card = buildCard(review, i);
    wall.appendChild(card);
    cards.push(card);
  });
}

buildWall();

var dur = CONFIG.cycleDuration * 1000;
var entrancePerCard = 180;
var exitPerCard = 100;

function runCycle() {
  buildWall();
  titleEl.className = 'title';

  setTimeout(function() { titleEl.classList.add('show'); }, 100);

  cards.forEach(function(card, i) {
    setTimeout(function() { card.classList.add('show'); }, 500 + i * entrancePerCard);
  });

  var breatheStart = 500 + cards.length * entrancePerCard + 400;
  setTimeout(function() {
    cards.forEach(function(card) {
      card.classList.remove('show');
      card.classList.add('breathe');
    });
  }, breatheStart);

  var exitStart = dur - 600 - cards.length * exitPerCard;
  setTimeout(function() {
    cards.forEach(function(card, i) {
      setTimeout(function() {
        card.classList.remove('breathe');
        card.classList.add('hide');
      }, i * exitPerCard);
    });
    setTimeout(function() {
      titleEl.classList.remove('show');
      titleEl.classList.add('hide');
    }, cards.length * exitPerCard);
  }, exitStart);

  setTimeout(runCycle, dur);
}

runCycle();

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    document.body.style.background = CONFIG.bgColor;
    titleEl.textContent = CONFIG.title;
  }
});
</script>
</body>
</html>

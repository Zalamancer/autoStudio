<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debate Scoreboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    color: #fff;
  }
  .bg {
    width: 100%; height: 100%;
    position: relative;
  }
  .grid-lines {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent calc(10vh - 1px), rgba(255,255,255,0.03) 10vh),
      repeating-linear-gradient(90deg, transparent, transparent calc(10vw - 1px), rgba(255,255,255,0.03) 10vw);
    pointer-events: none;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  .topic-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    border-bottom: 0.3vh solid rgba(255,255,255,0.1);
    z-index: 10;
    opacity: 0;
    transform: translateY(-100%);
    transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .topic-bar.visible { opacity: 1; transform: translateY(0); }
  .topic-text {
    font-size: 2.4vh;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    padding: 0 4vw;
  }
  .round-badge {
    position: absolute;
    right: 3vw;
    font-size: 1.4vh;
    font-weight: 600;
    padding: 0.6vh 1.5vw;
    border-radius: 2vh;
    background: rgba(255,255,255,0.1);
    border: 0.2vh solid rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
  }

  .arena {
    position: absolute;
    top: 10vh; bottom: 18vh;
    left: 0; right: 0;
    display: flex;
    align-items: center;
  }

  .side {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3vh 4vw;
    position: relative;
  }
  .side-left { align-items: flex-start; }
  .side-right { align-items: flex-end; text-align: right; }

  .side-name {
    font-size: 4.5vh;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s, transform 0.6s;
  }
  .side-left .side-name { transform: translateX(-5vw); }
  .side-right .side-name { transform: translateX(5vw); }
  .side-name.visible { opacity: 1; transform: translateX(0); }

  .score-display {
    font-size: 12vh;
    font-weight: 900;
    line-height: 1;
    margin: 1vh 0;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity 0.5s 0.3s;
  }
  .score-display.visible { opacity: 1; }

  .bar-track {
    width: 100%;
    height: 4vh;
    background: rgba(255,255,255,0.06);
    border-radius: 0.5vh;
    overflow: hidden;
    position: relative;
    opacity: 0;
    transition: opacity 0.5s 0.5s;
  }
  .bar-track.visible { opacity: 1; }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 0.5vh;
    position: relative;
    transition: width 2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .side-left .bar-fill { border-radius: 0.5vh 0 0 0.5vh; }
  .side-right .bar-fill {
    border-radius: 0 0.5vh 0.5vh 0;
    margin-left: auto;
  }
  @keyframes barShimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: barShimmer 2s infinite linear;
  }

  .reaction {
    margin-top: 1.5vh;
    font-size: 1.6vh;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.5s 0.8s;
    display: flex;
    align-items: center;
    gap: 0.8vw;
  }
  .side-right .reaction { flex-direction: row-reverse; }
  .reaction.visible { opacity: 0.8; }
  .reaction-icon { font-size: 2.2vh; }
  .reaction-pct { font-variant-numeric: tabular-nums; }

  .vs-center {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: 10vw; height: 10vw;
    min-width: 8vh; min-height: 8vh;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0,0,0,0.8);
    border: 0.4vh solid rgba(255,255,255,0.3);
    opacity: 0;
    scale: 0.3;
    transition: opacity 0.5s 0.4s, scale 0.6s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vs-center.visible { opacity: 1; scale: 1; }
  .vs-text {
    font-size: 3.5vh;
    font-weight: 900;
    letter-spacing: 0.1em;
  }
  @keyframes vsGlow {
    0%, 100% { box-shadow: 0 0 2vh rgba(255,255,255,0.2), 0 0 6vh rgba(255,255,255,0.1); }
    50% { box-shadow: 0 0 4vh rgba(255,255,255,0.4), 0 0 10vh rgba(255,255,255,0.2); }
  }
  .vs-center.visible { animation: vsGlow 2s ease-in-out infinite; }

  .spark-container {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 8vw; height: 30vh;
    pointer-events: none;
    z-index: 15;
    overflow: visible;
  }
  .spark {
    position: absolute;
    width: 0.4vh; height: 0.4vh;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
  }
  @keyframes sparkFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
  }

  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 18vh;
    background: rgba(0,0,0,0.6);
    border-top: 0.3vh solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8vw;
    padding: 0 4vw;
    opacity: 0;
    transform: translateY(100%);
    transition: all 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bottom-bar.visible { opacity: 1; transform: translateY(0); }

  .stat-block {
    text-align: center;
  }
  .stat-label {
    font-size: 1.2vh;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 0.5vh;
  }
  .stat-value {
    font-size: 3vh;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .audience-meter {
    display: flex;
    gap: 1vw;
    align-items: center;
  }
  .meter-segment {
    width: 0.8vw; height: 3vh;
    border-radius: 0.3vh;
    background: rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .meter-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    border-radius: 0.3vh;
    transition: height 0.5s ease-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .live-indicator {
    position: absolute;
    top: 3vh; left: 3vw;
    display: flex;
    align-items: center;
    gap: 0.6vw;
    font-size: 1.2vh;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ff4466;
    opacity: 0;
    transition: opacity 0.5s 1s;
    z-index: 15;
  }
  .live-indicator.visible { opacity: 1; }
  .live-dot {
    width: 0.8vh; height: 0.8vh;
    border-radius: 50%;
    background: #ff4466;
    animation: pulse 1.5s infinite;
  }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="grid-lines"></div>
  <div class="vignette"></div>

  <div class="topic-bar" id="topicBar">
    <span class="topic-text" id="topicText"></span>
    <span class="round-badge" id="roundBadge"></span>
  </div>

  <div class="arena">
    <div class="side side-left">
      <div class="side-name" id="leftName"></div>
      <div class="score-display" id="leftScore">0</div>
      <div class="bar-track" id="leftTrack">
        <div class="bar-fill" id="leftBar"></div>
      </div>
      <div class="reaction" id="leftReaction">
        <span class="reaction-icon">&#9650;</span>
        <span class="reaction-pct" id="leftPct">0%</span>
        <span>approval</span>
      </div>
    </div>

    <div class="vs-center" id="vsBadge">
      <span class="vs-text">VS</span>
    </div>

    <div class="spark-container" id="sparkContainer"></div>

    <div class="side side-right">
      <div class="side-name" id="rightName"></div>
      <div class="score-display" id="rightScore">0</div>
      <div class="bar-track" id="rightTrack">
        <div class="bar-fill" id="rightBar"></div>
      </div>
      <div class="reaction" id="rightReaction">
        <span class="reaction-icon">&#9650;</span>
        <span class="reaction-pct" id="rightPct">0%</span>
        <span>approval</span>
      </div>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="stat-block">
      <div class="stat-label">Total Votes</div>
      <div class="stat-value" id="totalVotes">0</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Audience</div>
      <div class="audience-meter" id="audienceMeter"></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Time Elapsed</div>
      <div class="stat-value" id="timeElapsed">00:00</div>
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    leftName: 'TEAM ALPHA',
    rightName: 'TEAM OMEGA',
    leftScore: 7842,
    rightScore: 6519,
    topic: 'Should AI be regulated by governments?',
    round: 3,
    totalRounds: 5,
    leftColor: '#4a9eff',
    rightColor: '#ff5252',
    bgColor: '#0a0e1a',
    accentColor: '#ffd700',
    cycleDuration: 10000
  };

  // Apply CONFIG
  document.getElementById('bg').style.background = `linear-gradient(180deg, ${CONFIG.bgColor} 0%, ${adjustColor(CONFIG.bgColor, 15)} 50%, ${CONFIG.bgColor} 100%)`;
  document.getElementById('topicText').textContent = CONFIG.topic;
  document.getElementById('roundBadge').textContent = `ROUND ${CONFIG.round}/${CONFIG.totalRounds}`;
  document.getElementById('leftName').textContent = CONFIG.leftName;
  document.getElementById('leftName').style.color = CONFIG.leftColor;
  document.getElementById('rightName').textContent = CONFIG.rightName;
  document.getElementById('rightName').style.color = CONFIG.rightColor;
  document.getElementById('leftBar').style.background = `linear-gradient(90deg, ${CONFIG.leftColor}, ${adjustColor(CONFIG.leftColor, 30)})`;
  document.getElementById('rightBar').style.background = `linear-gradient(270deg, ${CONFIG.rightColor}, ${adjustColor(CONFIG.rightColor, 30)})`;

  function adjustColor(hex, amount) {
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.min(255, r + amount);
    g = Math.min(255, g + amount);
    b = Math.min(255, b + amount);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }

  // Build audience meter
  const meterEl = document.getElementById('audienceMeter');
  for (let i = 0; i < 12; i++) {
    const seg = document.createElement('div');
    seg.className = 'meter-segment';
    const fill = document.createElement('div');
    fill.className = 'meter-fill';
    fill.style.background = i < 6 ? CONFIG.leftColor : CONFIG.rightColor;
    seg.appendChild(fill);
    meterEl.appendChild(seg);
  }

  // Spark system
  const sparkContainer = document.getElementById('sparkContainer');
  function createSpark() {
    const spark = document.createElement('div');
    spark.className = 'spark';
    const angle = (Math.random() - 0.5) * Math.PI;
    const dist = 2 + Math.random() * 6;
    spark.style.setProperty('--sx', `${Math.cos(angle) * dist}vw`);
    spark.style.setProperty('--sy', `${(Math.random() - 0.5) * 15}vh`);
    spark.style.left = '50%';
    spark.style.top = '50%';
    spark.style.background = Math.random() > 0.5 ? CONFIG.leftColor : CONFIG.rightColor;
    spark.style.width = spark.style.height = (0.3 + Math.random() * 0.5) + 'vh';
    spark.style.animation = `sparkFly ${0.6 + Math.random() * 0.8}s ease-out forwards`;
    sparkContainer.appendChild(spark);
    setTimeout(() => spark.remove(), 1500);
  }

  let sparkInterval;
  function startSparks() {
    sparkInterval = setInterval(() => {
      for (let i = 0; i < 3; i++) createSpark();
    }, 150);
  }
  function stopSparks() { clearInterval(sparkInterval); }

  // Animated counter
  function animateCounter(el, target, duration, prefix, suffix) {
    prefix = prefix || '';
    suffix = suffix || '';
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      const val = Math.round(ease * target);
      el.textContent = prefix + val.toLocaleString() + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Animate audience meter
  function animateMeter() {
    const fills = meterEl.querySelectorAll('.meter-fill');
    fills.forEach((fill, i) => {
      const h = 30 + Math.random() * 70;
      fill.style.height = h + '%';
    });
  }

  // Timer
  let timerVal = 0;
  const timeEl = document.getElementById('timeElapsed');
  function updateTimer() {
    timerVal++;
    const m = String(Math.floor(timerVal / 60)).padStart(2, '0');
    const s = String(timerVal % 60).padStart(2, '0');
    timeEl.textContent = m + ':' + s;
  }

  // Main cycle
  function runCycle() {
    // Reset
    const leftScoreEl = document.getElementById('leftScore');
    const rightScoreEl = document.getElementById('rightScore');
    const leftBarEl = document.getElementById('leftBar');
    const rightBarEl = document.getElementById('rightBar');
    const leftPctEl = document.getElementById('leftPct');
    const rightPctEl = document.getElementById('rightPct');
    const totalVotesEl = document.getElementById('totalVotes');
    timerVal = 0;

    leftScoreEl.textContent = '0';
    rightScoreEl.textContent = '0';
    leftBarEl.style.width = '0%';
    rightBarEl.style.width = '0%';
    leftPctEl.textContent = '0%';
    rightPctEl.textContent = '0%';
    totalVotesEl.textContent = '0';

    // Remove visible classes
    document.querySelectorAll('.visible').forEach(el => el.classList.remove('visible'));
    stopSparks();

    // Entrance sequence
    setTimeout(() => document.getElementById('topicBar').classList.add('visible'), 200);
    setTimeout(() => {
      document.getElementById('leftName').classList.add('visible');
      document.getElementById('rightName').classList.add('visible');
    }, 500);
    setTimeout(() => document.getElementById('vsBadge').classList.add('visible'), 700);
    setTimeout(() => {
      document.getElementById('leftScore').classList.add('visible');
      document.getElementById('rightScore').classList.add('visible');
    }, 900);
    setTimeout(() => {
      document.getElementById('leftTrack').classList.add('visible');
      document.getElementById('rightTrack').classList.add('visible');
    }, 1100);
    setTimeout(() => {
      document.getElementById('leftReaction').classList.add('visible');
      document.getElementById('rightReaction').classList.add('visible');
    }, 1300);
    setTimeout(() => document.getElementById('bottomBar').classList.add('visible'), 1400);

    // Animate scores
    const maxScore = Math.max(CONFIG.leftScore, CONFIG.rightScore);
    setTimeout(() => {
      animateCounter(leftScoreEl, CONFIG.leftScore, 2500);
      animateCounter(rightScoreEl, CONFIG.rightScore, 2500);
      leftBarEl.style.width = (CONFIG.leftScore / maxScore * 85) + '%';
      rightBarEl.style.width = (CONFIG.rightScore / maxScore * 85) + '%';

      const totalV = CONFIG.leftScore + CONFIG.rightScore;
      const leftP = Math.round(CONFIG.leftScore / totalV * 100);
      const rightP = 100 - leftP;
      animateCounter(leftPctEl, leftP, 2000, '', '%');
      animateCounter(rightPctEl, rightP, 2000, '', '%');
      animateCounter(totalVotesEl, totalV, 2500);

      startSparks();
    }, 1500);

    // Meter animation loop
    const meterInt = setInterval(animateMeter, 800);
    const timerInt = setInterval(updateTimer, 1000);

    // Cleanup at end of cycle
    setTimeout(() => {
      clearInterval(meterInt);
      clearInterval(timerInt);
      stopSparks();
    }, CONFIG.cycleDuration - 500);

    // Next cycle
    setTimeout(runCycle, CONFIG.cycleDuration);
  }

  // postMessage bridge
  window.addEventListener('message', (e) => {
    if (e.data && typeof e.data === 'object') {
      Object.assign(CONFIG, e.data);
    }
  });

  runCycle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Flow - Financial Growth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0a1f0a; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  bgColor: '#0a1f0a',
  bgGradientEnd: '#0d2a0d',
  particleColor: '#ffd700',
  dollarColor: '#4ade80',
  arrowColor: '#22c55e',
  barColors: ['#22c55e', '#16a34a', '#15803d', '#166534', '#14532d'],
  pieColors: ['#22c55e', '#fbbf24', '#3b82f6', '#ef4444', '#a855f7'],
  numberColor: '#4ade80',
  symbolCount: 25,
  particleCount: 80,
  counterTarget: 1847293,
  title: 'REVENUE GROWTH'
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

const symbols = [];
const particles = [];
const barHeights = [0, 0, 0, 0, 0];
const barTargets = [0.5, 0.65, 0.55, 0.8, 0.95];
let counterValue = 0;
let pieProgress = 0;
let arrowY = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  initParticles();
}

function initParticles() {
  symbols.length = 0;
  for (let i = 0; i < CONFIG.symbolCount; i++) {
    symbols.push(createSymbol());
  }
  particles.length = 0;
  for (let i = 0; i < CONFIG.particleCount; i++) {
    particles.push(createParticle());
  }
}

function createSymbol() {
  const chars = ['$', '\u00A2', '\u00A3', '\u20AC', '\u00A5', '+', '%'];
  return {
    x: Math.random() * W,
    y: H + Math.random() * H,
    char: chars[Math.floor(Math.random() * chars.length)],
    size: W * (0.02 + Math.random() * 0.04),
    speed: 0.5 + Math.random() * 1.5,
    opacity: 0.1 + Math.random() * 0.3,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.5 + Math.random() * 1
  };
}

function createParticle() {
  return {
    x: W * 0.3 + Math.random() * W * 0.4,
    y: H + Math.random() * H * 0.5,
    r: 1 + Math.random() * 3,
    speed: 1 + Math.random() * 3,
    opacity: 0.3 + Math.random() * 0.7,
    drift: (Math.random() - 0.5) * 0.5
  };
}

function drawBg() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.bgColor);
  grad.addColorStop(1, CONFIG.bgGradientEnd);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle radial glow
  const rg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, W * 0.5);
  rg.addColorStop(0, 'rgba(34,197,94,0.05)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

function drawSymbols() {
  symbols.forEach(s => {
    s.y -= s.speed;
    s.x += Math.sin(time * s.wobbleSpeed + s.wobble) * 0.5;

    if (s.y < -s.size * 2) {
      s.y = H + s.size;
      s.x = Math.random() * W;
    }

    ctx.font = `${s.size}px Arial`;
    ctx.fillStyle = `rgba(74,222,128,${s.opacity})`;
    ctx.textAlign = 'center';
    ctx.fillText(s.char, s.x, s.y);
  });
}

function drawParticles() {
  particles.forEach(p => {
    p.y -= p.speed;
    p.x += p.drift;

    if (p.y < -10) {
      p.y = H + 10;
      p.x = W * 0.3 + Math.random() * W * 0.4;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,215,0,${p.opacity * (0.5 + 0.5 * Math.sin(time * 3 + p.x))})`;
    ctx.fill();
  });
}

function drawGrowthArrow() {
  const startX = W * 0.08;
  const endX = W * 0.45;
  const startY = H * 0.7;
  const endY = H * 0.2;

  const progress = Math.min((time * 0.3) % 3, 1);
  const eased = 1 - Math.pow(1 - progress, 3);

  const cx = startX + (endX - startX) * eased;
  const cy = startY + (endY - startY) * eased;

  // Trail
  ctx.strokeStyle = CONFIG.arrowColor;
  ctx.lineWidth = W * 0.005;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(startX, startY);

  for (let t = 0; t <= eased; t += 0.02) {
    const px = startX + (endX - startX) * t;
    const py = startY + (endY - startY) * t + Math.sin(t * Math.PI * 4) * H * 0.02;
    ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Glow trail
  ctx.shadowBlur = 15;
  ctx.shadowColor = CONFIG.arrowColor;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Arrow head
  if (eased > 0.1) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.8);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-W * 0.02, W * 0.01);
    ctx.lineTo(-W * 0.02, -W * 0.01);
    ctx.closePath();
    ctx.fillStyle = CONFIG.arrowColor;
    ctx.fill();
    ctx.restore();
  }
}

function drawBarChart() {
  const chartX = W * 0.55;
  const chartW = W * 0.38;
  const chartY = H * 0.35;
  const chartH = H * 0.35;
  const barW = chartW / (CONFIG.barColors.length * 1.8);
  const gap = barW * 0.8;

  const cycleProgress = (time * 0.4) % 3;

  CONFIG.barColors.forEach((color, i) => {
    const delay = i * 0.15;
    const p = Math.max(0, Math.min(1, (cycleProgress - delay) / 0.8));
    const eased = 1 - Math.pow(1 - p, 3);
    const bh = barTargets[i] * chartH * eased;

    const bx = chartX + i * (barW + gap);
    const by = chartY + chartH - bh;

    // Bar glow
    ctx.shadowBlur = 8;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.fillRect(bx, by, barW, bh);
    ctx.shadowBlur = 0;

    // Bar top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx, by, barW, 3);

    // Label
    if (eased > 0.5) {
      ctx.fillStyle = `rgba(74,222,128,${eased})`;
      ctx.font = `bold ${W * 0.012}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(barTargets[i] * 100) + '%', bx + barW / 2, by - 8);
    }
  });
}

function drawPieChart() {
  const cx = W * 0.72;
  const cy = H * 0.78;
  const r = W * 0.07;

  const cycleProgress = (time * 0.3) % 4;
  const pieP = Math.min(cycleProgress / 2, 1);

  const segments = [0.3, 0.25, 0.2, 0.15, 0.1];
  let startAngle = -Math.PI / 2;

  segments.forEach((seg, i) => {
    const segProgress = Math.min(pieP / (segments.slice(0, i + 1).reduce((a, b) => a + b, 0)), 1);
    const endAngle = startAngle + seg * Math.PI * 2 * Math.min(pieP * (1 / segments.slice(0, i + 1).reduce((a, b) => a + b, 0)), 1);
    const actualEnd = Math.min(endAngle, startAngle + seg * Math.PI * 2);

    if (pieP > segments.slice(0, i).reduce((a, b) => a + b, 0)) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startAngle, actualEnd);
      ctx.closePath();
      ctx.fillStyle = CONFIG.pieColors[i];
      ctx.fill();
      ctx.strokeStyle = CONFIG.bgColor;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    startAngle += seg * Math.PI * 2;
  });

  // Center hole
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fill();
}

function drawCounter() {
  const cycleProgress = (time * 0.5) % 4;
  const countP = Math.min(cycleProgress / 2, 1);
  const eased = 1 - Math.pow(1 - countP, 2);
  const value = Math.floor(CONFIG.counterTarget * eased);

  ctx.fillStyle = CONFIG.numberColor;
  ctx.font = `bold ${W * 0.04}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText('$' + value.toLocaleString(), W * 0.5, H * 0.12);

  ctx.fillStyle = 'rgba(74,222,128,0.6)';
  ctx.font = `${W * 0.014}px Arial`;
  ctx.fillText(CONFIG.title, W * 0.5, H * 0.16);
}

function draw() {
  drawBg();
  drawSymbols();
  drawParticles();
  drawGrowthArrow();
  drawBarChart();
  drawPieChart();
  drawCounter();

  time += 0.016;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>

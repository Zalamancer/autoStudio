<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Noir</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }
  canvas#grain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 200;
    opacity: 0.04;
    mix-blend-mode: overlay;
  }
  .letterbox-top, .letterbox-bottom {
    position: fixed;
    left: 0; width: 100%;
    background: #000;
    z-index: 150;
  }
  .letterbox-top {
    top: 0;
    height: 0;
    animation: letterboxIn 3s ease-out forwards, letterboxPulse 8s ease-in-out infinite 3s;
  }
  .letterbox-bottom {
    bottom: 0;
    height: 0;
    animation: letterboxIn 3s ease-out forwards, letterboxPulse 8s ease-in-out infinite 3s;
  }
  @keyframes letterboxIn {
    0% { height: 50vh; }
    100% { height: 12vh; }
  }
  @keyframes letterboxPulse {
    0%, 100% { height: 12vh; }
    50% { height: 14vh; }
  }
  .spotlight-sweep {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }
  .spotlight-beam {
    position: absolute;
    width: 300px;
    height: 200%;
    top: -50%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    transform: rotate(15deg);
    animation: sweepBeam 6s ease-in-out infinite;
  }
  @keyframes sweepBeam {
    0% { left: -300px; }
    100% { left: calc(100% + 300px); }
  }
  .zoom-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    animation: slowZoom 20s ease-in-out infinite alternate;
  }
  @keyframes slowZoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }
  .mono-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 30% 40%, #1a1a1a 0%, #0a0a0a 100%);
  }
  .red-accent {
    position: absolute;
    width: 4px;
    height: 0;
    background: #EF233C;
    left: 50%;
    top: 50%;
    transform: translateX(-50%);
    animation: redLineGrow 8s ease-in-out infinite;
    z-index: 10;
    box-shadow: 0 0 20px rgba(239,35,60,0.6), 0 0 60px rgba(239,35,60,0.2);
  }
  @keyframes redLineGrow {
    0%, 100% { height: 0; opacity: 0; top: 50%; }
    20% { opacity: 1; }
    50% { height: 60vh; top: 20%; opacity: 1; }
    80% { opacity: 0.5; }
  }
  .text-block {
    position: fixed;
    z-index: 20;
    text-align: center;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
  }
  .title-thin {
    font-size: clamp(12px, 2.5vw, 20px);
    font-weight: 100;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    animation: revealText 8s ease-in-out infinite;
    margin-bottom: 10px;
  }
  .title-bold {
    font-size: clamp(40px, 10vw, 100px);
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    animation: revealText 8s ease-in-out infinite 0.5s;
    line-height: 0.9;
  }
  .title-bold span {
    color: #EF233C;
  }
  .subtitle-line {
    font-size: clamp(10px, 1.5vw, 14px);
    font-weight: 300;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.3);
    margin-top: 20px;
    animation: revealText 8s ease-in-out infinite 1s;
  }
  @keyframes revealText {
    0%, 100% { opacity: 0; transform: translateY(15px); }
    15%, 85% { opacity: 1; transform: translateY(0); }
  }
  .horizontal-line {
    position: fixed;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    left: 10%; right: 10%;
    z-index: 15;
  }
  .h-line-1 {
    top: 35%;
    animation: hLineReveal 8s ease-in-out infinite;
  }
  .h-line-2 {
    top: 65%;
    animation: hLineReveal 8s ease-in-out infinite 0.3s;
  }
  @keyframes hLineReveal {
    0%, 100% { left: 50%; right: 50%; opacity: 0; }
    20%, 80% { left: 10%; right: 10%; opacity: 1; }
  }
  .corner-mark {
    position: fixed;
    width: 30px; height: 30px;
    z-index: 25;
    opacity: 0;
    animation: cornerFade 8s ease-in-out infinite 1.5s;
  }
  .corner-mark::before, .corner-mark::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.3);
  }
  .corner-tl { top: 13vh; left: 30px; }
  .corner-tl::before { top: 0; left: 0; width: 20px; height: 1px; }
  .corner-tl::after { top: 0; left: 0; width: 1px; height: 20px; }
  .corner-br { bottom: 13vh; right: 30px; }
  .corner-br::before { bottom: 0; right: 0; width: 20px; height: 1px; }
  .corner-br::after { bottom: 0; right: 0; width: 1px; height: 20px; }
  @keyframes cornerFade {
    0%, 100% { opacity: 0; }
    20%, 80% { opacity: 1; }
  }
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    z-index: 100;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="zoom-container">
  <div class="mono-bg"></div>
</div>

<div class="red-accent"></div>

<div class="spotlight-sweep">
  <div class="spotlight-beam"></div>
</div>

<div class="horizontal-line h-line-1"></div>
<div class="horizontal-line h-line-2"></div>

<div class="text-block">
  <div class="title-thin" id="thinText">CHAPTER ONE</div>
  <div class="title-bold" id="boldText">THE <span>DARK</span></div>
  <div class="subtitle-line" id="subText">SILENCE SPEAKS VOLUMES</div>
</div>

<div class="corner-mark corner-tl"></div>
<div class="corner-mark corner-br"></div>

<div class="letterbox-top"></div>
<div class="letterbox-bottom"></div>

<div class="vignette"></div>
<canvas id="grain"></canvas>

<script>
  // === EDITABLE TEXT VARIABLES ===
  var THIN_TEXT = 'CHAPTER ONE';
  var BOLD_TEXT = 'THE <span>DARK</span>';
  var SUB_TEXT = 'SILENCE SPEAKS VOLUMES';
  // === END EDITABLE ===

  document.getElementById('thinText').textContent = THIN_TEXT;
  document.getElementById('boldText').innerHTML = BOLD_TEXT;
  document.getElementById('subText').textContent = SUB_TEXT;

  // Film grain
  var grainCanvas = document.getElementById('grain');
  var gCtx = grainCanvas.getContext('2d');
  function resizeGrain() {
    grainCanvas.width = window.innerWidth / 2;
    grainCanvas.height = window.innerHeight / 2;
  }
  resizeGrain();
  window.addEventListener('resize', resizeGrain);

  var frame = 0;
  function renderGrain() {
    frame++;
    if (frame % 3 !== 0) { requestAnimationFrame(renderGrain); return; }
    var w = grainCanvas.width;
    var h = grainCanvas.height;
    if (!w || !h) { requestAnimationFrame(renderGrain); return; }
    var imageData = gCtx.createImageData(w, h);
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = Math.random() * 255;
      data[i] = v;
      data[i+1] = v;
      data[i+2] = v;
      data[i+3] = 255;
    }
    gCtx.putImageData(imageData, 0, 0);
    requestAnimationFrame(renderGrain);
  }
  renderGrain();
</script>
</body>
</html>

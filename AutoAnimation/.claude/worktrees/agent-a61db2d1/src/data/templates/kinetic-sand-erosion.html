<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sand Erosion - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #2b1f14; font-family: 'Georgia', serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, #2b1f14 0%, #3d2d1e 50%, #4a3626 100%); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .sand { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3; }

  @keyframes riseFromSand { 0% { opacity: 0; transform: translate(-50%,-50%) translateY(15px); filter: blur(3px) brightness(0.7); } 50% { filter: blur(0) brightness(1); } 100% { opacity: 1; transform: translate(-50%,-50%) translateY(0); } }
  @keyframes erode { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) translateX(20px); filter: blur(3px); } }
  @keyframes sandGrain { 0% { opacity: 0.6; } 100% { opacity: 0; transform: translate(var(--sx),var(--sy)); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['ANCIENT','DESERT','DUNES','OASIS','MIRAGE','CARAVAN','SAHARA','ETERNAL'],
  bgColor: '#2b1f14',
  fontFamily: "'Georgia', serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const sandColors = ['#d4a54c','#c49540','#b8893a','#dbb060','#c89f48','#d0a850','#ba8d3c','#dcb458'];

function spawnSand(x, y) {
  for (let i = 0; i < 8; i++) {
    const g = document.createElement('div'); g.className = 'sand';
    const sz = 2 + Math.random() * 3;
    const hue = 35 + Math.random() * 15;
    g.style.cssText = `left:${x+(Math.random()-0.5)*40}px;top:${y+(Math.random()-0.5)*15}px;width:${sz}px;height:${sz}px;background:hsl(${hue},60%,${50+Math.random()*20}%);--sx:${20+Math.random()*40}px;--sy:${(Math.random()-0.5)*30}px;animation:sandGrain ${400+Math.random()*400}ms ease-out forwards;`;
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 900);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 61 + 37);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(34 + rng() * 24, cellW * 0.38, cellH * 0.5);
    const color = sandColors[i % sandColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:${color};text-shadow:0 2px 4px rgba(0,0,0,0.4),0 0 8px rgba(212,165,76,0.2);letter-spacing:5px;text-transform:uppercase;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2 });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=320, inD=600, hold=3000, outS=200, outD=500, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`riseFromSand ${inD}ms ease-out forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`erode ${outD}ms ease-in forwards`;spawnSand(item.x,item.y);}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

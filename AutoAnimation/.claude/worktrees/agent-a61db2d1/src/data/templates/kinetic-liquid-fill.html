<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Fill - Kinetic Typography</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial Black', 'Impact', sans-serif;
  }

  #scene {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  #ambientCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.15;
  }

  #scene {
    z-index: 1;
  }
</style>
</head>
<body>
<canvas id="ambientCanvas"></canvas>
<div id="scene">
  <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Text clip path for liquid fill -->
      <clipPath id="textClip">
        <text id="clipText"
          x="50%" y="50%"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900"
          font-size="180">
        </text>
      </clipPath>

      <!-- Glossy shine gradient (vertical) -->
      <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
        <stop offset="20%" stop-color="rgba(255,255,255,0.12)" />
        <stop offset="45%" stop-color="rgba(255,255,255,0)" />
        <stop offset="70%" stop-color="rgba(255,255,255,0.06)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
      </linearGradient>

      <!-- Specular highlight gradient (angled) -->
      <linearGradient id="specularGrad" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0%" stop-color="rgba(255,255,255,0)" />
        <stop offset="40%" stop-color="rgba(255,255,255,0.2)" />
        <stop offset="60%" stop-color="rgba(255,255,255,0)" />
      </linearGradient>

      <!-- Filter for subtle glow on outline text -->
      <filter id="outlineGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Background -->
    <rect id="bgRect" width="100%" height="100%" />

    <!-- Outline text with stroke-dasharray animation -->
    <text id="outlineText"
      x="50%" y="50%"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="'Arial Black', 'Impact', sans-serif"
      font-weight="900"
      font-size="180"
      fill="none"
      stroke-width="2.5"
      opacity="0"
      filter="url(#outlineGlow)">
    </text>

    <!-- Liquid fill group clipped to text shape -->
    <g clip-path="url(#textClip)">
      <!-- Main wave surface -->
      <path id="wavePath" d="" opacity="0" />

      <!-- Secondary wave for depth -->
      <path id="wavePath2" d="" opacity="0" />

      <!-- Tertiary subtle wave -->
      <path id="wavePath3" d="" opacity="0" />

      <!-- Glossy shine overlay -->
      <rect id="shineOverlay"
        x="0" y="0"
        width="100%" height="100%"
        fill="url(#shineGrad)"
        opacity="0" />

      <!-- Specular highlight overlay -->
      <rect id="specularOverlay"
        x="0" y="0"
        width="100%" height="100%"
        fill="url(#specularGrad)"
        opacity="0" />

      <!-- Bubble container -->
      <g id="bubbleGroup"></g>

      <!-- Droplet container (for drain phase) -->
      <g id="dropletGroup"></g>
    </g>
  </svg>
</div>

<script>
const CONFIG = {
  words: ['POWER', 'STRENGTH', 'COURAGE', 'WISDOM', 'PRIDE', 'GLORY'],
  liquidColors: ['#FF3366', '#3366FF', '#33FF66', '#FF9933', '#9933FF', '#33FFCC'],
  outlineColor: '#FFFFFF',
  bgColor: '#0F0F23',
  fillSpeed: 2000,
  waveAmplitude: 8,
  waveFrequency: 0.03,
  drainSpeed: 1500,
  cycleDuration: 12000,
};

// ---- State ----
let currentWordIndex = 0;
let phase = 'idle';
let phaseStart = 0;
let liquidLevel = 0;
let waveTime = 0;
let bubbles = [];
let droplets = [];
let textBBox = null;
let animFrameId = null;
let outlineDrawProgress = 0;
let outlineLength = 0;
let lastTimestamp = 0;

// ---- DOM refs ----
const svg = document.getElementById('mainSvg');
const bgRect = document.getElementById('bgRect');
const clipText = document.getElementById('clipText');
const outlineText = document.getElementById('outlineText');
const wavePath = document.getElementById('wavePath');
const wavePath2 = document.getElementById('wavePath2');
const wavePath3 = document.getElementById('wavePath3');
const shineOverlay = document.getElementById('shineOverlay');
const specularOverlay = document.getElementById('specularOverlay');
const bubbleGroup = document.getElementById('bubbleGroup');
const dropletGroup = document.getElementById('dropletGroup');
const ambientCanvas = document.getElementById('ambientCanvas');
const ambientCtx = ambientCanvas.getContext('2d');

// ---- Ambient background particles ----
let ambientParticles = [];

function initAmbient() {
  ambientCanvas.width = window.innerWidth;
  ambientCanvas.height = window.innerHeight;
  ambientParticles = [];
  for (let i = 0; i < 40; i++) {
    ambientParticles.push({
      x: Math.random() * ambientCanvas.width,
      y: Math.random() * ambientCanvas.height,
      r: 1 + Math.random() * 3,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.2 - Math.random() * 0.5,
      alpha: 0.2 + Math.random() * 0.6,
    });
  }
}

function drawAmbient() {
  ambientCtx.clearRect(0, 0, ambientCanvas.width, ambientCanvas.height);
  const color = CONFIG.liquidColors[currentWordIndex % CONFIG.liquidColors.length];
  const rgb = hexToRgb(color);

  for (const p of ambientParticles) {
    p.x += p.vx;
    p.y += p.vy;

    if (p.y < -10) {
      p.y = ambientCanvas.height + 10;
      p.x = Math.random() * ambientCanvas.width;
    }
    if (p.x < -10) p.x = ambientCanvas.width + 10;
    if (p.x > ambientCanvas.width + 10) p.x = -10;

    ambientCtx.beginPath();
    ambientCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ambientCtx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${p.alpha})`;
    ambientCtx.fill();
  }
}

// ---- Color helpers ----
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function darkenColor(hex, factor) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.round(r * factor)},${Math.round(g * factor)},${Math.round(b * factor)})`;
}

function lightenColor(hex, factor) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.round(r + (255 - r) * factor)},${Math.round(g + (255 - g) * factor)},${Math.round(b + (255 - b) * factor)})`;
}

function colorWithAlpha(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---- Easing functions ----
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeInCubic(t) {
  return t * t * t;
}

function easeOutQuart(t) {
  return 1 - Math.pow(1 - t, 4);
}

function easeInOutSine(t) {
  return -(Math.cos(Math.PI * t) - 1) / 2;
}

// ---- Font sizing ----
function computeFontSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const word = CONFIG.words[currentWordIndex];
  const charCount = word.length;
  let fontSize = Math.min(vw * 0.82 / (charCount * 0.62), vh * 0.42);
  fontSize = Math.max(fontSize, 60);
  fontSize = Math.min(fontSize, 320);
  return Math.round(fontSize);
}

function updateTextElements(word) {
  const fontSize = computeFontSize();

  clipText.textContent = word;
  clipText.setAttribute('font-size', fontSize);

  outlineText.textContent = word;
  outlineText.setAttribute('font-size', fontSize);

  // Measure text bounding box
  try {
    textBBox = outlineText.getBBox();
  } catch (e) {
    textBBox = {
      x: window.innerWidth * 0.1,
      y: window.innerHeight * 0.3,
      width: window.innerWidth * 0.8,
      height: window.innerHeight * 0.4,
    };
  }

  // Estimate stroke dash length for draw-on animation
  try {
    outlineLength = outlineText.getComputedTextLength() * 3.5;
  } catch (e) {
    outlineLength = 5000;
  }
  outlineText.setAttribute('stroke-dasharray', outlineLength);
  outlineText.setAttribute('stroke-dashoffset', outlineLength);
}

// ---- Bubbles ----
function createBubble() {
  if (!textBBox) return;

  const cx = textBBox.x + Math.random() * textBBox.width;
  const size = 1.5 + Math.random() * 4.5;
  const speed = 40 + Math.random() * 70;
  const wobbleAmp = 1 + Math.random() * 3;
  const wobbleFreq = 2 + Math.random() * 4;
  const opacity = 0.2 + Math.random() * 0.5;
  const startY = textBBox.y + textBBox.height;

  const bubble = {
    cx, cy: startY, startY, size, speed,
    wobbleAmp, wobbleFreq, opacity,
    phase: Math.random() * Math.PI * 2,
    el: null,
  };

  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('r', size);
  circle.setAttribute('fill', `rgba(255,255,255,${opacity})`);
  circle.setAttribute('cx', cx);
  circle.setAttribute('cy', startY);
  bubbleGroup.appendChild(circle);
  bubble.el = circle;
  bubbles.push(bubble);
}

function updateBubbles(dt, liquidTop) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.cy -= b.speed * dt;
    const wobbleX = Math.sin(b.phase + waveTime * b.wobbleFreq) * b.wobbleAmp;

    // Remove bubbles that rise above the liquid surface
    if (b.cy < liquidTop - 8 || b.cy < textBBox.y - 20) {
      b.el.remove();
      bubbles.splice(i, 1);
      continue;
    }

    b.el.setAttribute('cx', b.cx + wobbleX);
    b.el.setAttribute('cy', b.cy);
  }
}

function clearBubbles() {
  for (const b of bubbles) b.el.remove();
  bubbles = [];
}

// ---- Droplets (drain phase effect) ----
function createDroplet() {
  if (!textBBox) return;

  const cx = textBBox.x + Math.random() * textBBox.width;
  const size = 1 + Math.random() * 3;
  const speed = 20 + Math.random() * 50;
  const startY = textBBox.y + textBBox.height * (1 - liquidLevel);
  const opacity = 0.3 + Math.random() * 0.4;
  const color = CONFIG.liquidColors[currentWordIndex % CONFIG.liquidColors.length];

  const droplet = {
    cx, cy: startY, size, speed, opacity, color,
    el: null,
  };

  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('r', size);
  circle.setAttribute('fill', colorWithAlpha(color, opacity));
  circle.setAttribute('cx', cx);
  circle.setAttribute('cy', startY);
  dropletGroup.appendChild(circle);
  droplet.el = circle;
  droplets.push(droplet);
}

function updateDroplets(dt) {
  if (!textBBox) return;
  const bottomLimit = textBBox.y + textBBox.height + 30;

  for (let i = droplets.length - 1; i >= 0; i--) {
    const d = droplets[i];
    d.speed += 120 * dt; // gravity
    d.cy += d.speed * dt;
    d.opacity -= 0.3 * dt;

    if (d.cy > bottomLimit || d.opacity <= 0) {
      d.el.remove();
      droplets.splice(i, 1);
      continue;
    }

    d.el.setAttribute('cy', d.cy);
    d.el.setAttribute('fill', colorWithAlpha(d.color, Math.max(0, d.opacity)));
  }
}

function clearDroplets() {
  for (const d of droplets) d.el.remove();
  droplets = [];
}

// ---- Wave path generation ----
function buildWavePath(yLevel, amplitude, timeOffset, svgW, svgH) {
  const step = 6;
  const freq = CONFIG.waveFrequency;
  let d = `M 0 ${svgH} L 0 ${yLevel}`;

  for (let x = 0; x <= svgW; x += step) {
    const y = yLevel
      + Math.sin(x * freq + waveTime + timeOffset) * amplitude
      + Math.sin(x * freq * 1.6 + waveTime * 1.4 + timeOffset + 1.2) * (amplitude * 0.35)
      + Math.sin(x * freq * 0.5 + waveTime * 0.7 + timeOffset - 0.8) * (amplitude * 0.2);
    d += ` L ${x} ${y}`;
  }

  d += ` L ${svgW} ${svgH} Z`;
  return d;
}

// ---- Outline draw-on animation ----
function updateOutlineDraw(elapsed, duration) {
  const drawDuration = Math.min(duration * 0.3, 500);

  if (elapsed < drawDuration) {
    // Draw on (stroke-dashoffset goes from full to 0)
    const progress = easeOutQuart(elapsed / drawDuration);
    outlineDrawProgress = progress;
    const offset = outlineLength * (1 - progress);
    outlineText.setAttribute('stroke-dashoffset', offset);
    outlineText.setAttribute('opacity', String(Math.min(progress * 2, 1)));
  } else {
    outlineText.setAttribute('stroke-dashoffset', '0');
    outlineText.setAttribute('opacity', '1');
    outlineDrawProgress = 1;
  }
}

// ---- Phase management ----
function startWord() {
  const word = CONFIG.words[currentWordIndex];
  const color = CONFIG.liquidColors[currentWordIndex % CONFIG.liquidColors.length];

  updateTextElements(word);
  clearBubbles();
  clearDroplets();

  // Set colors
  outlineText.setAttribute('stroke', CONFIG.outlineColor);
  outlineText.setAttribute('opacity', '0');
  outlineText.setAttribute('stroke-dashoffset', outlineLength);

  wavePath.setAttribute('fill', color);
  wavePath2.setAttribute('fill', darkenColor(color, 0.65));
  wavePath3.setAttribute('fill', lightenColor(color, 0.15));

  liquidLevel = 0;
  outlineDrawProgress = 0;
  phase = 'filling';
  phaseStart = performance.now();
}

// ---- Main animation loop ----
function tick(now) {
  if (!lastTimestamp) lastTimestamp = now;
  const rawDt = (now - lastTimestamp) / 1000;
  const dt = Math.min(rawDt, 0.05); // cap delta to avoid jumps
  lastTimestamp = now;

  waveTime += dt * 2.8;

  const elapsed = now - phaseStart;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // ---- Phase logic ----
  if (phase === 'filling') {
    // Draw outline first, then fill
    updateOutlineDraw(elapsed, CONFIG.fillSpeed);

    const fillDelay = 200; // slight delay before liquid starts
    const fillElapsed = Math.max(0, elapsed - fillDelay);
    const progress = Math.min(fillElapsed / CONFIG.fillSpeed, 1);
    liquidLevel = easeOutCubic(progress);

    // Spawn bubbles as liquid rises
    if (liquidLevel > 0.02) {
      if (Math.random() < 0.4) createBubble();
      if (Math.random() < 0.15) createBubble();
    }

    if (progress >= 1) {
      phase = 'hold';
      phaseStart = now;
      liquidLevel = 1;
    }

  } else if (phase === 'hold') {
    liquidLevel = 1;
    // Occasional bubbles
    if (Math.random() < 0.06) createBubble();

    const holdTime = CONFIG.cycleDuration - CONFIG.fillSpeed - CONFIG.drainSpeed - 800;
    if (elapsed >= holdTime) {
      phase = 'draining';
      phaseStart = now;
    }

  } else if (phase === 'draining') {
    const progress = Math.min(elapsed / CONFIG.drainSpeed, 1);
    liquidLevel = 1 - easeInCubic(progress);

    // Spawn droplets during drain
    if (Math.random() < 0.25) createDroplet();

    if (progress >= 1) {
      phase = 'pause';
      phaseStart = now;
      liquidLevel = 0;
      clearBubbles();
    }

  } else if (phase === 'pause') {
    const pauseDuration = 500;
    if (elapsed >= pauseDuration) {
      outlineText.setAttribute('opacity', '0');
      clearDroplets();
      currentWordIndex = (currentWordIndex + 1) % CONFIG.words.length;
      startWord();
      animFrameId = requestAnimationFrame(tick);
      return;
    }
    // Fade out outline
    const fadeProgress = Math.min(elapsed / pauseDuration, 1);
    const fadeEased = easeInOutSine(fadeProgress);
    outlineText.setAttribute('opacity', String(1 - fadeEased));

    // Scale down slightly
    const scale = 1 - fadeEased * 0.05;
    outlineText.setAttribute('transform',
      `translate(${vw / 2}, ${vh / 2}) scale(${scale}) translate(${-vw / 2}, ${-vh / 2})`);
  }

  // Reset transform outside pause
  if (phase !== 'pause') {
    outlineText.removeAttribute('transform');
  }

  // ---- Render liquid ----
  if (liquidLevel > 0.002 && textBBox) {
    const textBottom = textBBox.y + textBBox.height;
    const textTop = textBBox.y;
    const textHeight = textBottom - textTop;
    const liquidTop = textBottom - liquidLevel * textHeight;

    // Wave amplitude varies: strongest at middle fill levels
    const levelFactor = 1 - Math.pow(liquidLevel * 2 - 1, 2);
    const amp = CONFIG.waveAmplitude * (0.4 + levelFactor * 0.6);
    const effectiveAmp = Math.max(amp, 1.5);

    // Primary wave
    const d1 = buildWavePath(liquidTop, effectiveAmp, 0, vw, vh);
    wavePath.setAttribute('d', d1);
    wavePath.setAttribute('opacity', '1');

    // Secondary wave (offset phase, darker)
    const d2 = buildWavePath(liquidTop + 2.5, effectiveAmp * 0.55, 2.2, vw, vh);
    wavePath2.setAttribute('d', d2);
    wavePath2.setAttribute('opacity', '0.55');

    // Tertiary wave (lighter highlight)
    const d3 = buildWavePath(liquidTop - 1, effectiveAmp * 0.3, -1.5, vw, vh);
    wavePath3.setAttribute('d', d3);
    wavePath3.setAttribute('opacity', '0.2');

    // Shine layers
    const shineOp = liquidLevel * 0.5;
    shineOverlay.setAttribute('opacity', String(shineOp));
    specularOverlay.setAttribute('opacity', String(shineOp * 0.4));

    // Update particle effects
    updateBubbles(dt, liquidTop);
    updateDroplets(dt);

  } else {
    wavePath.setAttribute('opacity', '0');
    wavePath2.setAttribute('opacity', '0');
    wavePath3.setAttribute('opacity', '0');
    shineOverlay.setAttribute('opacity', '0');
    specularOverlay.setAttribute('opacity', '0');
    updateDroplets(dt);
  }

  // Ambient background
  drawAmbient();

  animFrameId = requestAnimationFrame(tick);
}

// ---- Initialization ----
function init() {
  bgRect.setAttribute('fill', CONFIG.bgColor);

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);

  initAmbient();

  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    ambientCanvas.width = w;
    ambientCanvas.height = h;
    if (phase !== 'idle') {
      updateTextElements(CONFIG.words[currentWordIndex]);
    }
  });

  startWord();
  lastTimestamp = 0;
  animFrameId = requestAnimationFrame(tick);
}

// Start when fonts are available
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(init);
} else {
  window.addEventListener('load', init);
}
</script>
</body>
</html>

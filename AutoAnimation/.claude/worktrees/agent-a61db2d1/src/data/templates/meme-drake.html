<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Impact', 'Arial Black', sans-serif; background: #fff; }
.panel { display: flex; width: 100%; height: 50%; }
.reaction { width: 40%; display: flex; align-items: center; justify-content: center; font-size: 80px; position: relative; overflow: hidden; }
.reaction-top { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.reaction-bottom { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
.emoji { position: relative; z-index: 2; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
.text-area { width: 60%; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; position: relative; overflow: hidden; }
.text-top { background: #ffeaa7; }
.text-bottom { background: #55efc4; }
.text-content { font-size: 36px; line-height: 1.2; color: #2d3436; text-transform: uppercase; letter-spacing: 1px; word-wrap: break-word; max-width: 100%; }
.divider { width: 100%; height: 4px; background: #2d3436; }
.panel { opacity: 0; transform: translateX(-30px); }
.panel.show { opacity: 1; transform: translateX(0); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.panel:nth-child(3) { transition-delay: 0.3s; }
.gesture { font-size: 48px; position: absolute; opacity: 0; }
.gesture.show { opacity: 1; transition: opacity 0.4s ease; }
</style>
</head>
<body>
<script>
const CONFIG = {
  topText: 'Using outdated methods',
  bottomText: 'Using the new hotness',
  topEmoji: '',
  bottomEmoji: '',
  topBgColor: '#ffeaa7',
  bottomBgColor: '#55efc4',
  textColor: '#2d3436',
  fontSize: 36,
  animationSpeed: 600
};
</script>
<div class="panel" id="panelTop">
  <div class="reaction reaction-top">
    <span class="emoji" id="topEmoji"></span>
    <span class="gesture" id="topGesture"></span>
  </div>
  <div class="text-area text-top" id="textTopBg">
    <div class="text-content" id="topTextEl"></div>
  </div>
</div>
<div class="divider"></div>
<div class="panel" id="panelBottom">
  <div class="reaction reaction-bottom">
    <span class="emoji" id="bottomEmoji"></span>
    <span class="gesture" id="bottomGesture"></span>
  </div>
  <div class="text-area text-bottom" id="textBottomBg">
    <div class="text-content" id="bottomTextEl"></div>
  </div>
</div>
<script>
document.getElementById('topTextEl').textContent = CONFIG.topText;
document.getElementById('bottomTextEl').textContent = CONFIG.bottomText;
document.getElementById('topEmoji').textContent = CONFIG.topEmoji || '\u{1F645}\u200D\u2642\uFE0F';
document.getElementById('bottomEmoji').textContent = CONFIG.bottomEmoji || '\u{1F646}\u200D\u2642\uFE0F';
document.getElementById('textTopBg').style.background = CONFIG.topBgColor;
document.getElementById('textBottomBg').style.background = CONFIG.bottomBgColor;
document.querySelectorAll('.text-content').forEach(el => {
  el.style.color = CONFIG.textColor;
  el.style.fontSize = CONFIG.fontSize + 'px';
});

setTimeout(() => document.getElementById('panelTop').classList.add('show'), 200);
setTimeout(() => {
  document.getElementById('panelBottom').classList.add('show');
  document.getElementById('topGesture').textContent = '\u{274C}';
  document.getElementById('topGesture').classList.add('show');
}, 800);
setTimeout(() => {
  document.getElementById('bottomGesture').textContent = '\u{2705}';
  document.getElementById('bottomGesture').classList.add('show');
}, 1200);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Chart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0F172A; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  title: 'Website Traffic',
  theme: 'dark',
  loop: false,
  animationSpeed: 1.0,
  areaColor: '#3B82F6',
  areaOpacity: 0.3,
  lineColor: '#60A5FA',
  smooth: true,
  showGrid: true,
  data: [
    { time: 'Mon', value: 2400 },
    { time: 'Tue', value: 3200 },
    { time: 'Wed', value: 2800 },
    { time: 'Thu', value: 4100 },
    { time: 'Fri', value: 3600 },
    { time: 'Sat', value: 5200 },
    { time: 'Sun', value: 4800 }
  ]
};

function getTheme() {
  if (CONFIG.theme === 'light') return { bg: '#FFFFFF', text: '#334155', title: '#0F172A', grid: 'rgba(51,65,85,0.12)', subtle: '#F1F5F9' };
  return { bg: '#0F172A', text: '#94A3B8', title: '#F1F5F9', grid: 'rgba(148,163,184,0.15)', subtle: '#1E293B' };
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function formatValue(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toString();
}

function getPoint(i, area, n, maxVal) {
  const x = area.x + (i / (n - 1)) * area.w;
  const y = area.y + area.h - (CONFIG.data[i].value / maxVal) * area.h;
  return { x, y };
}

function drawPath(points, ease, close) {
  const n = points.length;
  const totalSeg = n - 1;
  const drawTo = ease * totalSeg;

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 0; i < Math.min(Math.ceil(drawTo), totalSeg); i++) {
    const segT = Math.min(drawTo - i, 1);
    const p0 = points[Math.max(i - 1, 0)];
    const p1 = points[i];
    const p2 = points[Math.min(i + 1, n - 1)];
    const p3 = points[Math.min(i + 2, n - 1)];

    if (CONFIG.smooth) {
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      const ex = cubicBez(p1.x, cp1x, cp2x, p2.x, segT);
      const ey = cubicBez(p1.y, cp1y, cp2y, p2.y, segT);
      if (segT >= 1) ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      else {
        const c1x = p1.x + (cp1x - p1.x) * segT;
        const c1y = p1.y + (cp1y - p1.y) * segT;
        const mx = cp1x + (cp2x - cp1x) * segT;
        const my = cp1y + (cp2y - cp1y) * segT;
        const c2x = c1x + (mx - c1x) * segT;
        const c2y = c1y + (my - c1y) * segT;
        ctx.bezierCurveTo(c1x, c1y, c2x, c2y, ex, ey);
      }
    } else {
      const ex = p1.x + (p2.x - p1.x) * segT;
      const ey = p1.y + (p2.y - p1.y) * segT;
      ctx.lineTo(ex, ey);
    }
  }

  if (close) {
    const lastIdx = Math.min(Math.ceil(drawTo), totalSeg);
    const lastP = lastIdx < n ? points[lastIdx] : points[n - 1];
    let lastX;
    if (drawTo >= totalSeg) lastX = points[n - 1].x;
    else {
      const fi = Math.floor(drawTo);
      const ft = drawTo - fi;
      lastX = points[fi].x + (points[Math.min(fi + 1, n - 1)].x - points[fi].x) * ft;
    }
    ctx.lineTo(lastX, close);
    ctx.lineTo(points[0].x, close);
    ctx.closePath();
  }
}

function cubicBez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
}

function draw() {
  const T = getTheme();
  const dur = 2.0 / CONFIG.animationSpeed;
  const progress = Math.min(time / dur, 1);
  const ease = easeOutCubic(progress);
  const data = CONFIG.data;
  const n = data.length;
  const maxVal = Math.max(...data.map(d => d.value)) * 1.15;

  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = T.title;
  ctx.font = `bold ${W * 0.032}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(CONFIG.title, W * 0.06, H * 0.05);

  const area = { x: W * 0.12, y: H * 0.15, w: W * 0.82, h: H * 0.68 };

  // Grid
  if (CONFIG.showGrid) {
    ctx.strokeStyle = T.grid; ctx.lineWidth = 1;
    ctx.fillStyle = T.text;
    const steps = 5;
    for (let i = 0; i <= steps; i++) {
      const y = area.y + (area.h / steps) * i;
      ctx.beginPath(); ctx.moveTo(area.x, y); ctx.lineTo(area.x + area.w, y); ctx.stroke();
      const val = maxVal - (maxVal / steps) * i;
      ctx.font = `${W * 0.016}px system-ui`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(formatValue(val), area.x - W * 0.012, y);
    }
  }

  // X labels
  ctx.fillStyle = T.text; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `${W * 0.016}px system-ui`;
  for (let i = 0; i < n; i++) {
    const x = area.x + (i / (n - 1)) * area.w;
    ctx.fillText(data[i].time, x, area.y + area.h + W * 0.012);
  }

  const points = data.map((_, i) => getPoint(i, area, n, maxVal));

  // Area fill
  ctx.save();
  drawPath(points, ease, area.y + area.h);
  const grad = ctx.createLinearGradient(0, area.y, 0, area.y + area.h);
  const alpha = Math.round(CONFIG.areaOpacity * 255).toString(16).padStart(2, '0');
  grad.addColorStop(0, CONFIG.areaColor + alpha);
  grad.addColorStop(1, CONFIG.areaColor + '05');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Line
  ctx.strokeStyle = CONFIG.lineColor;
  ctx.lineWidth = W * 0.004;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = CONFIG.lineColor; ctx.shadowBlur = W * 0.006;
  drawPath(points, ease, false);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Trailing dot
  if (ease > 0) {
    const totalSeg = n - 1;
    const drawTo = ease * totalSeg;
    const fi = Math.min(Math.floor(drawTo), totalSeg - 1);
    const ft = drawTo - fi;
    const px = points[fi].x + (points[Math.min(fi + 1, n - 1)].x - points[fi].x) * ft;
    const py = points[fi].y + (points[Math.min(fi + 1, n - 1)].y - points[fi].y) * ft;
    ctx.beginPath(); ctx.arc(px, py, W * 0.008, 0, Math.PI * 2);
    ctx.fillStyle = T.bg; ctx.fill();
    ctx.beginPath(); ctx.arc(px, py, W * 0.005, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.lineColor;
    ctx.shadowColor = CONFIG.lineColor; ctx.shadowBlur = W * 0.01;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (progress >= 1 && CONFIG.loop) { time = 0; }
  else if (progress < 1) { time += 0.016; }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>

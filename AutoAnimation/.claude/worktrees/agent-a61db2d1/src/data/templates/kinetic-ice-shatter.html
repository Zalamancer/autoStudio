<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ice Shatter - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a1628; font-family: 'Arial Black', 'Impact', sans-serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 30%, rgba(100,200,255,0.06), transparent 60%); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .shard { position: absolute; pointer-events: none; z-index: 3; background: rgba(180,220,255,0.3); border: 1px solid rgba(180,220,255,0.5); }

  @keyframes freezeIn { 0% { opacity: 0; transform: scale(1.3) translate(-50%,-50%); filter: blur(6px); } 30% { opacity: 1; filter: blur(0); } 50% { transform: scale(0.97) translate(-50%,-50%); } 100% { opacity: 1; transform: scale(1) translate(-50%,-50%); filter: blur(0); } }
  @keyframes shatterOut { 0% { opacity: 1; } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--sx),var(--sy)) rotate(var(--sr)) scale(0.3); } }
  @keyframes frost { 0% { opacity: 0; } 50% { opacity: 0.15; } 100% { opacity: 0; } }
  @keyframes shardFly { 0% { opacity: 0.6; transform: translate(0,0) rotate(0deg); } 100% { opacity: 0; transform: translate(var(--fx),var(--fy)) rotate(var(--fr)); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['FROZEN','SILENCE','CRACKS','THE','GLASS','SHATTER','INTO','PIECES'],
  bgColor: '#0a1628',
  fontFamily: "'Arial Black', 'Impact', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function spawnShards(x, y) {
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div'); s.className = 'shard';
    const w = 8 + Math.random()*16, h = 6 + Math.random()*12;
    s.style.cssText = `left:${x+(Math.random()-0.5)*50}px;top:${y+(Math.random()-0.5)*30}px;width:${w}px;height:${h}px;clip-path:polygon(${Math.random()*30}% 0%,100% ${Math.random()*40}%,${60+Math.random()*40}% 100%,0% ${60+Math.random()*40}%);--fx:${(Math.random()-0.5)*120}px;--fy:${(Math.random()-0.5)*80}px;--fr:${(Math.random()-0.5)*360}deg;animation:shardFly ${500+Math.random()*400}ms ease-out forwards;`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;
  const iceColors = ['#b4dcff','#88c4ff','#a0d0ff','#cce8ff','#99ccff','#77b8ff','#b0d8ff','#ddeeff'];

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 97 + 31);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(38 + rng() * 26, cellW * 0.38, cellH * 0.5);
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    const color = iceColors[i % iceColors.length];
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:${color};text-shadow:0 0 12px rgba(150,210,255,0.5),0 2px 4px rgba(0,0,0,0.3);letter-spacing:3px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);--sx:${(rng()-0.5)*80}px;--sy:${(rng()-0.5)*60}px;--sr:${(rng()-0.5)*30}deg;`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2 });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=280, inD=500, hold=3000, outS=150, outD=600, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`freezeIn ${inD}ms cubic-bezier(0.2,0.8,0.3,1) forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`shatterOut ${outD}ms ease-in forwards`;spawnShards(item.x,item.y);}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Postcard Stack Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #3e2f1c; font-family: 'Georgia', serif; }
  body::after { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.12; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.0' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E"); background-size: 200px 200px; }
  #stage { position: absolute; inset: 0; z-index: 1; }

  .postcard { position: absolute; opacity: 0; will-change: transform, opacity; }
  .pc-inner { background: #faf6ed; width: 260px; height: 170px; box-shadow: 2px 3px 10px rgba(0,0,0,0.25); display: flex; overflow: hidden; }
  .pc-left { width: 55%; height: 100%; position: relative; }
  .pc-color { width: 100%; height: 100%; }
  .pc-right { width: 45%; height: 100%; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px dashed #ccc; }
  .pc-greeting { font-family: 'Georgia', serif; font-style: italic; font-size: 11px; color: #555; line-height: 1.4; }
  .pc-stamp { width: 30px; height: 36px; border: 2px solid #cc3333; align-self: flex-end; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #cc3333; text-transform: uppercase; }
  .pc-address { font-family: 'Courier New', monospace; font-size: 9px; color: #888; line-height: 1.4; border-top: 1px solid #ddd; padding-top: 6px; }

  @keyframes dealCard { 0% { opacity: 0; transform: var(--deal-start); } 50% { opacity: 1; } 100% { opacity: var(--fo); transform: var(--deal-end); } }
  @keyframes collectCard { 0% { opacity: var(--fo); transform: var(--deal-end); } 100% { opacity: 0; transform: var(--collect-end); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  cards: [
    { color: '#8fbc8f', greeting: 'Wish you were here!', city: 'PARIS, FR' },
    { color: '#c9a882', greeting: 'Having a wonderful time', city: 'TOKYO, JP' },
    { color: '#7ba7bc', greeting: 'The view is amazing', city: 'ROME, IT' },
    { color: '#d4a574', greeting: 'Missing you lots', city: 'NYC, USA' },
    { color: '#b8860b', greeting: 'Adventure awaits!', city: 'SYDNEY, AU' },
    { color: '#8b7355', greeting: 'Perfect weather today', city: 'LONDON, UK' },
  ],
  bgColor: '#3e2f1c',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function createCards() {
  const els = [], n = CONFIG.cards.length, vw = window.innerWidth, vh = window.innerHeight;
  const cols = 3, rows = 2;
  const cellW = (vw - 80) / cols, cellH = (vh - 80) / rows;

  for (let i = 0; i < n; i++) {
    const card = CONFIG.cards[i], rng = seededRandom(i * 149 + 53);
    const el = document.createElement('div'); el.className = 'postcard';
    const inner = document.createElement('div'); inner.className = 'pc-inner';

    const left = document.createElement('div'); left.className = 'pc-left';
    const color = document.createElement('div'); color.className = 'pc-color'; color.style.background = card.color;
    left.appendChild(color);

    const right = document.createElement('div'); right.className = 'pc-right';
    const greet = document.createElement('div'); greet.className = 'pc-greeting'; greet.textContent = card.greeting;
    const stamp = document.createElement('div'); stamp.className = 'pc-stamp'; stamp.textContent = 'POST';
    const addr = document.createElement('div'); addr.className = 'pc-address'; addr.textContent = card.city;
    right.appendChild(greet); right.appendChild(stamp); right.appendChild(addr);

    inner.appendChild(left); inner.appendChild(right);
    el.appendChild(inner);

    const col = i % cols, row = Math.floor(i / cols);
    const bx = 40 + col * cellW + (cellW - 260) / 2;
    const by = 40 + row * cellH + (cellH - 170) / 2;
    const ox = (rng() - 0.5) * 20, oy = (rng() - 0.5) * 16;
    el.style.left = (bx + ox) + 'px'; el.style.top = (by + oy) + 'px';

    const rot = (rng() - 0.5) * 10, fo = 0.92 + rng() * 0.08;
    el.style.setProperty('--deal-start', `translate(${vw}px, ${vh*0.3}px) rotate(${rot+20}deg)`);
    el.style.setProperty('--deal-end', `translate(0, 0) rotate(${rot}deg)`);
    el.style.setProperty('--fo', String(fo));
    el.style.setProperty('--collect-end', `translate(${-vw}px, ${vh*0.2}px) rotate(${rot-25}deg)`);

    stage.appendChild(el); els.push(el);
  }
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=400, inD=600, hold=3500, outS=300, outD=500, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`dealCard ${inD}ms cubic-bezier(0.22,0.68,0.36,1) forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`collectCard ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let cards=createCards();runAnimation(cards);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{stage.innerHTML='';cards=createCards();runAnimation(cards);},300);});
</script>
</body>
</html>

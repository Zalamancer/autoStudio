<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0a12;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px;
  }

  .scene {
    width: 100vw; height: 100vh;
    position: relative;
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px;
  }

  .card-wrapper {
    transform-style: preserve-3d;
    animation: cardFloat 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .card {
    width: 36vh; height: 52vh;
    border-radius: 2vh;
    position: relative;
    transform-style: preserve-3d;
    overflow: hidden;
    box-shadow:
      0 0 40px rgba(120, 80, 255, 0.2),
      0 20px 60px rgba(0, 0, 0, 0.5);
    animation: cardTilt 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5vh); }
  }

  @keyframes cardTilt {
    0% { transform: rotateY(-8deg) rotateX(3deg); }
    25% { transform: rotateY(8deg) rotateX(-2deg); }
    50% { transform: rotateY(-5deg) rotateX(-4deg); }
    75% { transform: rotateY(10deg) rotateX(2deg); }
    100% { transform: rotateY(-8deg) rotateX(3deg); }
  }

  .card-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: 2vh;
  }

  .hologram-shimmer {
    position: absolute; inset: 0;
    border-radius: 2vh;
    background: linear-gradient(
      125deg,
      transparent 0%,
      rgba(255, 0, 128, 0.08) 15%,
      rgba(255, 165, 0, 0.08) 25%,
      rgba(255, 255, 0, 0.1) 35%,
      rgba(0, 255, 128, 0.08) 45%,
      rgba(0, 128, 255, 0.1) 55%,
      rgba(128, 0, 255, 0.08) 65%,
      rgba(255, 0, 128, 0.08) 75%,
      transparent 100%
    );
    background-size: 300% 300%;
    animation: shimmer 3s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  @keyframes shimmer {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  .scanlines {
    position: absolute; inset: 0;
    border-radius: 2vh;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255, 255, 255, 0.015) 2px,
      rgba(255, 255, 255, 0.015) 4px
    );
    pointer-events: none;
  }

  .grid-overlay {
    position: absolute; inset: 0;
    border-radius: 2vh;
    background:
      linear-gradient(90deg, rgba(100, 150, 255, 0.03) 1px, transparent 1px),
      linear-gradient(rgba(100, 150, 255, 0.03) 1px, transparent 1px);
    background-size: 3vh 3vh;
    pointer-events: none;
  }

  .card-border {
    position: absolute; inset: 0;
    border-radius: 2vh;
    border: 1px solid rgba(120, 150, 255, 0.2);
    pointer-events: none;
  }

  .card-border-glow {
    position: absolute; inset: -1px;
    border-radius: 2.2vh;
    border: 1px solid transparent;
    background: linear-gradient(135deg, rgba(255,100,200,0.3), rgba(100,200,255,0.3), rgba(100,255,200,0.3)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: borderGlow 4s linear infinite;
    pointer-events: none;
  }

  @keyframes borderGlow {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }

  .card-content {
    position: relative;
    z-index: 2;
    padding: 3vh;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
  }

  .photo-frame {
    width: 12vh; height: 12vh;
    border-radius: 50%;
    margin-top: 2vh;
    background: linear-gradient(135deg, rgba(100,150,255,0.2), rgba(255,100,200,0.2));
    border: 2px solid rgba(150, 180, 255, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .photo-icon {
    font-size: 5vh;
    opacity: 0.3;
  }

  .photo-ring {
    position: absolute; inset: -2px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(135deg, #ff6ec7, #7c4dff, #00e5ff) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: ringRotate 3s linear infinite;
  }

  @keyframes ringRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .card-name {
    font-size: 2.8vh;
    font-weight: 800;
    margin-top: 2vh;
    letter-spacing: 0.1em;
    text-shadow: 0 0 15px rgba(120, 150, 255, 0.5);
    opacity: 0;
    animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  .card-title {
    font-size: 1.4vh;
    color: rgba(180, 200, 255, 0.6);
    letter-spacing: 0.2em;
    margin-top: 0.5vh;
    opacity: 0;
    animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .divider {
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120, 150, 255, 0.4), transparent);
    margin: 2vh 0;
    opacity: 0;
    animation: fadeIn 0.6s ease 0.7s forwards;
  }

  .stats {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.2vh;
    opacity: 0;
    animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5vh 0;
  }

  .stat-label {
    font-size: 1.1vh;
    color: rgba(150, 170, 255, 0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 1.6vh;
    font-weight: 700;
    color: rgba(200, 220, 255, 0.9);
    font-variant-numeric: tabular-nums;
  }

  .stat-bar {
    height: 3px;
    background: rgba(100, 150, 255, 0.1);
    border-radius: 2px;
    margin-top: 0.3vh;
    overflow: hidden;
  }

  .stat-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #7c4dff, #00e5ff);
    transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Floating particles */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Background ambient */
  .bg-glow-1 {
    position: absolute;
    width: 50vw; height: 50vh;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120, 80, 255, 0.08), transparent);
    top: -10vh; left: -15vw;
    animation: bgPulse 8s ease-in-out infinite;
  }

  .bg-glow-2 {
    position: absolute;
    width: 40vw; height: 40vh;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 200, 255, 0.06), transparent);
    bottom: -15vh; right: -10vw;
    animation: bgPulse 8s ease-in-out 4s infinite;
  }

  @keyframes bgPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="particles" id="particles"></div>

  <div class="card-wrapper">
    <div class="card">
      <div class="card-bg"></div>
      <div class="hologram-shimmer"></div>
      <div class="scanlines"></div>
      <div class="grid-overlay"></div>
      <div class="card-border"></div>
      <div class="card-border-glow"></div>

      <div class="card-content">
        <div class="photo-frame">
          <div class="photo-icon">&#9733;</div>
          <div class="photo-ring"></div>
        </div>

        <div class="card-name" id="cardName">AGENT NOVA</div>
        <div class="card-title" id="cardTitle">FIELD OPERATIVE</div>
        <div class="divider"></div>

        <div class="stats" id="statsContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // === EDITABLE CONFIG ===
  const CONFIG = {
    cardName: 'AGENT NOVA',
    cardTitle: 'FIELD OPERATIVE',
    stats: [
      { label: 'Clearance', value: 'LEVEL 5' },
      { label: 'Missions', value: '147' },
      { label: 'Rating', value: '98.2%' },
      { label: 'Division', value: 'OMEGA' }
    ],
    hologramColor: '#7c4dff',
    bgColor: '#0a0a12',
    cycleDuration: 10000
  };

  // Apply config
  document.getElementById('cardName').textContent = CONFIG.cardName;
  document.getElementById('cardTitle').textContent = CONFIG.cardTitle;
  document.body.style.background = CONFIG.bgColor;

  // Build stats
  const statsContainer = document.getElementById('statsContainer');
  CONFIG.stats.forEach((stat, i) => {
    const row = document.createElement('div');
    row.className = 'stat-row';

    const wrapper = document.createElement('div');
    wrapper.style.width = '100%';

    const top = document.createElement('div');
    top.style.display = 'flex';
    top.style.justifyContent = 'space-between';

    const label = document.createElement('span');
    label.className = 'stat-label';
    label.textContent = stat.label;

    const value = document.createElement('span');
    value.className = 'stat-value';
    value.textContent = stat.value;

    top.appendChild(label);
    top.appendChild(value);
    wrapper.appendChild(top);

    // Stat bar
    const bar = document.createElement('div');
    bar.className = 'stat-bar';
    const fill = document.createElement('div');
    fill.className = 'stat-fill';
    fill.style.width = '0%';
    bar.appendChild(fill);
    wrapper.appendChild(bar);

    row.appendChild(wrapper);
    statsContainer.appendChild(row);

    // Animate fill
    const numVal = parseFloat(stat.value);
    const fillPct = isNaN(numVal) ? 60 + Math.random() * 30 : Math.min(100, numVal);
    setTimeout(() => {
      fill.style.width = fillPct + '%';
    }, 1000 + i * 200);
  });

  // Create particles
  const particlesContainer = document.getElementById('particles');
  function createParticles() {
    particlesContainer.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 4;
      const hue = 220 + Math.random() * 100;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = `hsla(${hue}, 80%, 70%, ${0.2 + Math.random() * 0.4})`;
      p.style.boxShadow = `0 0 ${size * 2}px hsla(${hue}, 80%, 70%, 0.3)`;
      p.style.animationDuration = (5 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 5) + 's';
      particlesContainer.appendChild(p);
    }
  }

  function resetAnimations() {
    // Reset card animations by re-triggering
    const card = document.querySelector('.card-wrapper');
    const name = document.getElementById('cardName');
    const title = document.getElementById('cardTitle');
    const divider = document.querySelector('.divider');
    const stats = document.querySelector('.stats');

    [name, title, divider, stats].forEach(el => {
      el.style.animation = 'none';
      el.offsetHeight; // Trigger reflow
    });

    name.style.animation = '';
    title.style.animation = '';
    divider.style.animation = '';
    stats.style.animation = '';

    // Reset stat bars
    document.querySelectorAll('.stat-fill').forEach((fill, i) => {
      fill.style.width = '0%';
      const numVal = parseFloat(CONFIG.stats[i]?.value || '0');
      const fillPct = isNaN(numVal) ? 60 + Math.random() * 30 : Math.min(100, numVal);
      setTimeout(() => {
        fill.style.width = fillPct + '%';
      }, 1000 + i * 200);
    });

    createParticles();
  }

  function runCycle() {
    resetAnimations();
    setInterval(resetAnimations, CONFIG.cycleDuration);
  }

  // Listen for CONFIG updates via postMessage
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'configUpdate' && e.data.config) {
      Object.assign(CONFIG, e.data.config);
      document.getElementById('cardName').textContent = CONFIG.cardName;
      document.getElementById('cardTitle').textContent = CONFIG.cardTitle;
      document.body.style.background = CONFIG.bgColor;
      resetAnimations();
    }
  });

  runCycle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Newspaper Clipping Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #d4c9b0; font-family: 'Georgia', serif; }
  body::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.15; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.0' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E"); background-size: 200px 200px; }
  #stage { position: absolute; inset: 0; z-index: 1; }

  .clip { position: absolute; opacity: 0; will-change: transform, opacity; user-select: none; }
  .clip .inner { position: relative; background: #faf6ed; padding: 14px 18px; box-shadow: 1px 2px 6px rgba(0,0,0,0.12); }

  .clip.headline .inner { font-family: 'Georgia', serif; font-weight: 700; font-size: 32px; color: #1a1a1a; border-bottom: 2px solid #1a1a1a; padding-bottom: 10px; }
  .clip.subhead .inner { font-family: 'Georgia', serif; font-style: italic; font-size: 16px; color: #555; line-height: 1.4; max-width: 220px; }
  .clip.column .inner { font-size: 10px; color: #666; line-height: 1.6; max-width: 180px; font-family: 'Georgia', serif; column-count: 2; column-gap: 10px; }
  .clip.photo-block .inner { padding: 6px; }
  .clip.photo-block .block-color { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
  .clip.dateline .inner { font-family: 'Courier New', monospace; font-size: 11px; color: #888; letter-spacing: 2px; text-transform: uppercase; background: transparent; box-shadow: none; padding: 4px 0; border-top: 1px solid #ccc; }

  @keyframes clipIn { 0% { opacity: 0; transform: var(--in-start); } 60% { opacity: 1; transform: var(--in-mid); } 100% { opacity: var(--fo); transform: var(--in-end); } }
  @keyframes clipOut { 0% { opacity: var(--fo); transform: var(--in-end); } 100% { opacity: 0; transform: var(--out-end); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  items: [
    { type: 'headline', text: 'BREAKING STORY' },
    { type: 'photo-block', w: 200, h: 150, color: '#8b7355' },
    { type: 'subhead', text: 'Sources confirm major developments in ongoing investigation' },
    { type: 'dateline', text: 'New York \u2014 March 15, 2024' },
    { type: 'column', text: 'Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam quis nostrud exercitation.' },
    { type: 'headline', text: 'EXCLUSIVE' },
    { type: 'photo-block', w: 180, h: 130, color: '#5f6b4e' },
    { type: 'subhead', text: 'Industry leaders respond to unprecedented changes' },
  ],
  bgColor: '#d4c9b0',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function createItems() {
  const els = [], count = CONFIG.items.length, vw = window.innerWidth, vh = window.innerHeight;
  const cols = 3, rows = Math.ceil(count / cols);
  const cellW = vw * 0.28, cellH = vh * 0.40;
  const startX = (vw - cols * cellW) / 2, startY = (vh - rows * cellH) / 2;

  for (let i = 0; i < count; i++) {
    const item = CONFIG.items[i], rng = seededRandom(i * 157 + 31);
    const el = document.createElement('div');
    el.className = `clip ${item.type}`;
    const inner = document.createElement('div');
    inner.className = 'inner';

    if (item.type === 'photo-block') {
      inner.style.width = item.w + 'px'; inner.style.height = item.h + 'px';
      const c = document.createElement('div'); c.className = 'block-color';
      c.style.background = item.color; c.style.width = '100%'; c.style.height = '100%';
      inner.appendChild(c);
    } else if (item.type === 'column') {
      inner.textContent = item.text;
    } else { inner.textContent = item.text; }

    el.appendChild(inner);
    const col = i % cols, row = Math.floor(i / cols);
    const bx = startX + col * cellW + cellW * 0.1;
    const by = startY + row * cellH + cellH * 0.1;
    const ox = (rng() - 0.5) * vw * 0.02, oy = (rng() - 0.5) * vh * 0.02;
    el.style.left = Math.max(10, bx + ox) + 'px';
    el.style.top = Math.max(10, by + oy) + 'px';

    const rot = (rng() - 0.5) * 6, fo = 0.92 + rng() * 0.08;
    el.style.setProperty('--in-start', `translate(0, -30px) rotate(${rot + 5}deg)`);
    el.style.setProperty('--in-mid', `translate(0, 2px) rotate(${rot - 1}deg)`);
    el.style.setProperty('--in-end', `translate(0, 0) rotate(${rot}deg)`);
    el.style.setProperty('--fo', String(fo));
    el.style.setProperty('--out-end', `translate(0, 30px) rotate(${rot - 5}deg)`);
    stage.appendChild(el); els.push(el);
  }
  return els;
}

function runAnimation(els) {
  const n = els.length, inS = 350, inD = 500, hold = 3500, outS = 220, outD = 400, pause = 800;
  const tIn = (n-1)*inS+inD, tOut = (n-1)*outS+outD;
  let af, st;
  function reset() { els.forEach(e => { e.style.animation = 'none'; e.style.opacity = '0'; }); }
  function tick(ts) {
    if (!st) st = ts; const e = ts - st;
    if (e < tIn) { els.forEach((el, i) => { if (e >= i*inS && !el.dataset.i) { el.dataset.i='1'; el.style.animation = `clipIn ${inD}ms ease-out forwards`; } }); }
    else if (e < tIn+hold) {}
    else if (e < tIn+hold+tOut) { const oe=e-tIn-hold; els.forEach((el,i) => { const ri=n-1-i; if(oe>=ri*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`clipOut ${outD}ms ease-in forwards`;}}); }
    else if (e < tIn+hold+tOut+pause) {}
    else { reset(); els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;}); st=ts; }
    af = requestAnimationFrame(tick);
  }
  reset(); af = requestAnimationFrame(tick);
}

let items = createItems(); runAnimation(items);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { stage.innerHTML=''; items=createItems(); runAnimation(items); }, 300); });
</script>
</body>
</html>

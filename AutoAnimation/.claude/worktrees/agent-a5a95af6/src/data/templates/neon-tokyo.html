<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Tokyo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0010; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgColor: '#0a0010',
  neonPink: '#ff2d8a',
  neonBlue: '#00d4ff',
  neonPurple: '#b44dff',
  neonYellow: '#ffe14d',
  neonGreen: '#00ff88',
  rainCount: 300,
  buildingCount: 18,
  carCount: 12,
  petalCount: 25,
  signTexts: ['ラーメン', '東京', 'カラオケ', 'ネオン', 'ゲーム', '寿司', 'バー', '夜'],
  title: 'TOKYO NIGHTS',
  subtitle: 'ネオン東京',
};

window.addEventListener('message', (e) => { if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config); });

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; initBuildings(); }
resize();
addEventListener('resize', resize);

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

// Buildings
let buildings = [];
function initBuildings() {
  buildings = [];
  let x = -20;
  const colors = [CONFIG.neonPink, CONFIG.neonBlue, CONFIG.neonPurple, CONFIG.neonYellow, CONFIG.neonGreen];
  while (x < W + 60) {
    const w = 30 + Math.random() * 80;
    const h = H * (0.2 + Math.random() * 0.5);
    const neonColor = colors[Math.floor(Math.random() * colors.length)];
    const windows = [];
    const cols = Math.floor(w / 12);
    const rows = Math.floor(h / 16);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (Math.random() > 0.3) {
        windows.push({ rx: 4 + c * 12, ry: 6 + r * 16, lit: Math.random() > 0.2,
          color: Math.random() > 0.5 ? neonColor : colors[Math.floor(Math.random() * colors.length)],
          phase: Math.random() * Math.PI * 2 });
      }
    }
    const hasSign = Math.random() > 0.4;
    const signText = CONFIG.signTexts[Math.floor(Math.random() * CONFIG.signTexts.length)];
    const signColor = colors[Math.floor(Math.random() * colors.length)];
    const signY = H - h + 10 + Math.random() * (h * 0.4);
    const vertical = Math.random() > 0.5;
    const depth = 0.3 + Math.random() * 0.7;
    buildings.push({ x, w, h, windows, neonColor, hasSign, signText, signColor, signY, vertical, depth });
    x += w + 1 + Math.random() * 4;
  }
}

// Rain
const rain = [];
for (let i = 0; i < CONFIG.rainCount; i++) {
  rain.push({ x: Math.random() * 2000, y: Math.random() * 1200, len: 6 + Math.random() * 22,
    speed: 4 + Math.random() * 10, opacity: 0.05 + Math.random() * 0.2, wind: -0.8 });
}

// Cherry blossom petals
const petals = [];
for (let i = 0; i < CONFIG.petalCount; i++) {
  petals.push({ x: Math.random() * 2000, y: Math.random() * 1200, size: 2 + Math.random() * 4,
    speedX: 0.3 + Math.random() * 0.8, speedY: 0.5 + Math.random() * 1.5,
    rotation: Math.random() * Math.PI * 2, rotSpeed: 0.01 + Math.random() * 0.03,
    wobble: Math.random() * Math.PI * 2, wobbleSpeed: 0.02 + Math.random() * 0.04,
    opacity: 0.4 + Math.random() * 0.6 });
}

// Cars (street level light streaks)
const cars = [];
for (let i = 0; i < CONFIG.carCount; i++) {
  const dir = Math.random() > 0.5 ? 1 : -1;
  cars.push({ x: Math.random() * 2000, y: H * (0.88 + Math.random() * 0.08),
    speed: 1.5 + Math.random() * 4, dir, tailLen: 40 + Math.random() * 100,
    color: dir > 0 ? CONFIG.neonPink : CONFIG.neonBlue, size: 1.5 + Math.random() * 2 });
}

// Reflections on wet street
function drawWetStreet(t) {
  const streetY = H * 0.85;
  const grad = ctx.createLinearGradient(0, streetY, 0, H);
  grad.addColorStop(0, 'rgba(10,0,16,0.6)');
  grad.addColorStop(0.2, 'rgba(5,0,10,0.85)');
  grad.addColorStop(1, 'rgba(2,0,5,0.95)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, streetY, W, H - streetY);

  // Reflected neon shimmer
  const colors = [CONFIG.neonPink, CONFIG.neonBlue, CONFIG.neonPurple];
  for (let i = 0; i < 20; i++) {
    const c = hexRgb(colors[i % colors.length]);
    const px = (i * W / 19) + Math.sin(t * 0.001 + i * 1.5) * 15;
    const shimmer = 0.5 + 0.5 * Math.sin(t * 0.003 + i * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${shimmer * 0.08})`;
    ctx.fillRect(px - 20, streetY + 5, 40, H - streetY - 5);
  }

  // Puddle reflections
  for (let i = 0; i < 8; i++) {
    const px = W * (0.05 + i * 0.12);
    const py = streetY + 15 + Math.random() * 20;
    const c = hexRgb(colors[i % colors.length]);
    const pulse = 0.3 + 0.7 * Math.sin(t * 0.002 + i * 3);
    const g = ctx.createRadialGradient(px, py, 0, px, py, 30 + pulse * 20);
    g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${0.06 * pulse})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(px - 50, py - 20, 100, 40);
  }
}

function drawBuildings(t) {
  buildings.sort((a, b) => a.depth - b.depth);
  buildings.forEach(b => {
    const by = H - b.h;
    const df = 0.15 + b.depth * 0.5;
    ctx.fillStyle = `rgb(${Math.floor(8 * df)},${Math.floor(2 * df)},${Math.floor(15 * df)})`;
    ctx.fillRect(b.x, by, b.w, b.h);

    // Windows
    b.windows.forEach(win => {
      if (!win.lit) return;
      const fl = Math.sin(t * 0.002 + win.phase);
      if (fl < -0.85) return;
      const al = Math.max(0.1, Math.min(0.5, 0.25 + fl * 0.1));
      const c = hexRgb(win.color);
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${al})`;
      ctx.fillRect(b.x + win.rx, by + win.ry, 6, 8);
    });

    // Neon signs
    if (b.hasSign) {
      const c = hexRgb(b.signColor);
      const flicker = Math.sin(t * 0.004 + b.x) > -0.3 ? 1 : 0.2;
      ctx.save();
      ctx.font = b.vertical ? '14px sans-serif' : '11px sans-serif';
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.9 * flicker})`;
      ctx.shadowColor = b.signColor;
      ctx.shadowBlur = 15 * flicker;

      if (b.vertical) {
        const chars = b.signText.split('');
        chars.forEach((ch, i) => {
          ctx.fillText(ch, b.x + b.w + 4, b.signY + i * 18);
        });
      } else {
        ctx.fillText(b.signText, b.x + 3, b.signY);
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  });
}

function drawRain(t) {
  const c = hexRgb(CONFIG.neonBlue);
  rain.forEach(r => {
    r.y += r.speed;
    r.x += r.wind;
    if (r.y > H) { r.y = -20; r.x = Math.random() * W; }
    if (r.x < -50) r.x = W + 50;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x + r.wind * 2, r.y + r.len);
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${r.opacity})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  });
}

function drawPetals(t) {
  petals.forEach(p => {
    p.x += p.speedX + Math.sin(p.wobble) * 0.5;
    p.y += p.speedY;
    p.rotation += p.rotSpeed;
    p.wobble += p.wobbleSpeed;
    if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    if (p.x > W + 20) p.x = -20;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.fillStyle = `rgba(255,180,200,${p.opacity})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,140,170,${p.opacity * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(p.size * 0.3, 0, p.size * 0.4, p.size * 0.3, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawCars(t) {
  cars.forEach(v => {
    v.x += v.speed * v.dir;
    if (v.x > W + 150) v.x = -150;
    if (v.x < -150) v.x = W + 150;
    const c = hexRgb(v.color);
    const g = ctx.createLinearGradient(v.x - v.tailLen * v.dir, v.y, v.x, v.y);
    g.addColorStop(0, 'transparent');
    g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0.6)`);
    ctx.beginPath();
    ctx.moveTo(v.x - v.tailLen * v.dir, v.y);
    ctx.lineTo(v.x, v.y);
    ctx.strokeStyle = g;
    ctx.lineWidth = v.size;
    ctx.stroke();
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.9)`;
    ctx.beginPath();
    ctx.arc(v.x, v.y, v.size * 1.2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSkyGlow(t) {
  const p = hexRgb(CONFIG.neonPink);
  const b = hexRgb(CONFIG.neonPurple);
  const g = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, H * 0.6);
  g.addColorStop(0, `rgba(${p[0]},${p[1]},${p[2]},0.04)`);
  g.addColorStop(0.5, `rgba(${b[0]},${b[1]},${b[2]},0.02)`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawTitle(t) {
  const pulse = 0.6 + 0.4 * Math.sin(t * 0.002);
  ctx.save();
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(255,255,255,${0.1 * pulse})`;
  ctx.shadowColor = CONFIG.neonPink;
  ctx.shadowBlur = 20 * pulse;
  ctx.fillText(CONFIG.title, W * 0.5, H * 0.12);
  ctx.font = '18px sans-serif';
  ctx.fillStyle = `rgba(255,255,255,${0.08 * pulse})`;
  ctx.shadowColor = CONFIG.neonBlue;
  ctx.fillText(CONFIG.subtitle, W * 0.5, H * 0.17);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function animate(t) {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);
  drawSkyGlow(t);
  drawBuildings(t);
  drawWetStreet(t);
  drawCars(t);
  drawRain(t);
  drawPetals(t);
  drawTitle(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Tickets Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #18181b; font-family: 'Arial', sans-serif; }
  #stage { position: absolute; inset: 0; z-index: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 18px; padding: 30px; }

  .ticket { width: 260px; opacity: 0; will-change: transform, opacity; }
  .ticket-inner { display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.3); position: relative; }
  .ticket-inner::before { content:''; position: absolute; left: 190px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: #18181b; z-index: 2; }
  .ticket-inner::after { content:''; position: absolute; left: 190px; bottom: -8px; width: 16px; height: 16px; border-radius: 50%; background: #18181b; z-index: 2; }
  .ticket-left { width: 198px; padding: 14px; position: relative; }
  .ticket-type { font-size: 8px; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
  .ticket-event { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.2; }
  .ticket-details { font-size: 10px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  .ticket-right { width: 62px; background: rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px; border-left: 2px dashed rgba(255,255,255,0.15); }
  .ticket-day { font-size: 24px; font-weight: 700; color: #fff; }
  .ticket-month { font-size: 10px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 2px; }
  .ticket-time { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 6px; }

  @keyframes ticketSlide { 0% { opacity: 0; transform: translateX(-50px) rotate(-3deg); } 60% { transform: translateX(3px) rotate(0.3deg); } 100% { opacity: 1; transform: translateX(0) rotate(0); } }
  @keyframes ticketAway { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(50px) rotate(3deg); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  tickets: [
    { color: '#dc2626', event: 'ROCK FESTIVAL', type: 'Concert', detail: 'Main Stage\nVIP Access', day: '15', month: 'MAR', time: '8 PM' },
    { color: '#2563eb', event: 'TECH CONF', type: 'Conference', detail: 'Convention Center\nFull Pass', day: '22', month: 'APR', time: '9 AM' },
    { color: '#16a34a', event: 'FOOD & WINE', type: 'Festival', detail: 'Riverside Park\nGeneral Adm.', day: '08', month: 'MAY', time: '12 PM' },
    { color: '#9333ea', event: 'ART GALLERY', type: 'Exhibition', detail: 'Modern Museum\nOpening Night', day: '03', month: 'JUN', time: '7 PM' },
    { color: '#ea580c', event: 'COMEDY SHOW', type: 'Live Show', detail: 'Downtown Theater\nRow A Seat 12', day: '19', month: 'JUN', time: '9 PM' },
    { color: '#0891b2', event: 'FILM PREMIERE', type: 'Cinema', detail: 'Grand Theater\nPress Screening', day: '27', month: 'JUL', time: '7:30 PM' },
  ],
  bgColor: '#18181b',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function build() {
  stage.innerHTML = '';
  const els = [];
  CONFIG.tickets.forEach(t => {
    const el = document.createElement('div'); el.className = 'ticket';
    const inner = document.createElement('div'); inner.className = 'ticket-inner';
    const left = document.createElement('div'); left.className = 'ticket-left'; left.style.background = t.color;
    const type = document.createElement('div'); type.className = 'ticket-type'; type.textContent = t.type;
    const event = document.createElement('div'); event.className = 'ticket-event'; event.textContent = t.event;
    const details = document.createElement('div'); details.className = 'ticket-details';
    t.detail.split('\n').forEach((line, i) => { if (i > 0) details.appendChild(document.createElement('br')); details.appendChild(document.createTextNode(line)); });
    left.appendChild(type); left.appendChild(event); left.appendChild(details);
    const right = document.createElement('div'); right.className = 'ticket-right'; right.style.background = t.color;
    const day = document.createElement('div'); day.className = 'ticket-day'; day.textContent = t.day;
    const month = document.createElement('div'); month.className = 'ticket-month'; month.textContent = t.month;
    const time = document.createElement('div'); time.className = 'ticket-time'; time.textContent = t.time;
    right.appendChild(day); right.appendChild(month); right.appendChild(time);
    inner.appendChild(left); inner.appendChild(right);
    el.appendChild(inner); stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=300, inD=500, hold=3500, outS=250, outD=420, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`ticketSlide ${inD}ms ease-out forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`ticketAway ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

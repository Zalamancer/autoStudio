<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Tutorial</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
.container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.steam { position: absolute; width: 100%; height: 100%; pointer-events: none; }
.steam-particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.08); }
.recipe-card { width: 70vw; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 2.5vh; padding: 4vh 4vw; opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.22,1,0.36,1); }
.recipe-card.visible { opacity: 1; transform: translateY(0); }
.recipe-header { display: flex; align-items: center; gap: 2vw; margin-bottom: 3vh; }
.recipe-emoji { font-size: 6vh; }
.recipe-title { font-size: 3vh; font-weight: 800; color: #fff; }
.recipe-subtitle { font-size: 1.4vh; color: rgba(255,255,255,0.4); margin-top: 0.5vh; }
.meta-row { display: flex; gap: 2vw; margin-bottom: 3vh; }
.meta-badge { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.2); color: #fb923c; font-size: 1.2vh; padding: 0.6vh 1.2vw; border-radius: 1vh; display: flex; align-items: center; gap: 0.4vw; opacity: 0; transform: scale(0.8); transition: all 0.4s; }
.meta-badge.visible { opacity: 1; transform: scale(1); }
.section-title { font-size: 1.2vh; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 1.5vh; }
.ingredients { display: flex; flex-wrap: wrap; gap: 1vh 1.5vw; margin-bottom: 3vh; }
.ingredient { font-size: 1.3vh; color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 0.5vh 1vw; border-radius: 0.8vh; display: flex; align-items: center; gap: 0.4vw; opacity: 0; transform: translateY(8px); transition: all 0.3s; }
.ingredient.visible { opacity: 1; transform: translateY(0); }
.ingredient .check { color: #10b981; font-size: 1.1vh; }
.steps { display: flex; flex-direction: column; gap: 1.2vh; }
.step { display: flex; align-items: flex-start; gap: 1vw; font-size: 1.3vh; color: rgba(255,255,255,0.5); opacity: 0; transform: translateX(-10px); transition: all 0.4s; }
.step.visible { opacity: 1; transform: translateX(0); }
.step-num { width: 2.5vh; height: 2.5vh; border-radius: 50%; background: rgba(251,146,60,0.15); color: #fb923c; font-size: 1.1vh; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step.active .step-num { background: #fb923c; color: #fff; }
.step.active { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div class="container" id="container">
  <div class="steam" id="steam"></div>
  <div class="recipe-card" id="card">
    <div class="recipe-header">
      <div class="recipe-emoji" id="emoji">🍝</div>
      <div>
        <div class="recipe-title" id="title">Creamy Garlic Pasta</div>
        <div class="recipe-subtitle" id="subtitle">A quick weeknight favorite</div>
      </div>
    </div>
    <div class="meta-row" id="metaRow"></div>
    <div class="section-title">Ingredients</div>
    <div class="ingredients" id="ingredients"></div>
    <div class="section-title">Steps</div>
    <div class="steps" id="steps"></div>
  </div>
</div>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  recipeName: 'Creamy Garlic Pasta',
  recipeSubtitle: 'A quick weeknight favorite',
  emoji: '🍝',
  meta: ['⏱ 25 min', '🔥 420 cal', '👤 4 servings'],
  ingredients: ['400g spaghetti', '4 cloves garlic', '200ml heavy cream', '100g parmesan', '2 tbsp butter', 'Fresh basil', 'Salt & pepper', 'Olive oil'],
  steps: [
    'Boil pasta in salted water until al dente',
    'Sauté minced garlic in butter until golden',
    'Add cream and simmer for 3 minutes',
    'Toss pasta with sauce and parmesan',
    'Garnish with fresh basil and serve',
  ],
  cycleDuration: 14000,
  bgColor: '#12100e',
  accentColor: '#fb923c',
};

document.getElementById('container').style.background = CONFIG.bgColor;
document.getElementById('title').textContent = CONFIG.recipeName;
document.getElementById('subtitle').textContent = CONFIG.recipeSubtitle;
document.getElementById('emoji').textContent = CONFIG.emoji;

var metaRow = document.getElementById('metaRow');
CONFIG.meta.forEach(function(m) {
  var el = document.createElement('div');
  el.className = 'meta-badge';
  el.textContent = m;
  metaRow.appendChild(el);
});

var ingredientsEl = document.getElementById('ingredients');
CONFIG.ingredients.forEach(function(ing) {
  var el = document.createElement('div');
  el.className = 'ingredient';
  el.innerHTML = '<span class="check">✓</span>' + ing;
  ingredientsEl.appendChild(el);
});

var stepsEl = document.getElementById('steps');
CONFIG.steps.forEach(function(s, i) {
  var el = document.createElement('div');
  el.className = 'step';
  el.innerHTML = '<div class="step-num">' + (i + 1) + '</div><div>' + s + '</div>';
  stepsEl.appendChild(el);
});

// Steam particles
var steamEl = document.getElementById('steam');
for (var i = 0; i < 20; i++) {
  var p = document.createElement('div');
  p.className = 'steam-particle';
  p.style.left = (30 + Math.random() * 40) + 'vw';
  p.style.bottom = '0';
  p.style.opacity = Math.random() * 0.1;
  steamEl.appendChild(p);
}

function runCycle() {
  var card = document.getElementById('card');
  var metaBadges = document.querySelectorAll('.meta-badge');
  var ings = document.querySelectorAll('.ingredient');
  var steps = document.querySelectorAll('.step');

  card.classList.remove('visible');
  metaBadges.forEach(function(b) { b.classList.remove('visible'); });
  ings.forEach(function(el) { el.classList.remove('visible'); });
  steps.forEach(function(el) { el.classList.remove('visible'); el.classList.remove('active'); });

  setTimeout(function() { card.classList.add('visible'); }, 300);
  metaBadges.forEach(function(b, i) { setTimeout(function() { b.classList.add('visible'); }, 800 + i * 150); });
  ings.forEach(function(el, i) { setTimeout(function() { el.classList.add('visible'); }, 1500 + i * 100); });
  steps.forEach(function(el, i) {
    setTimeout(function() { el.classList.add('visible'); }, 3000 + i * 300);
    setTimeout(function() { el.classList.add('active'); }, 3200 + i * 300);
  });

  setTimeout(function() { card.classList.remove('visible'); }, CONFIG.cycleDuration - 1500);
  setTimeout(runCycle, CONFIG.cycleDuration);
}
runCycle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electric Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #050a18; font-family: 'Courier New', monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .title {
    position: absolute; top: 3vh; left: 4vw;
    font-size: 2.5vh; font-weight: 700; letter-spacing: 0.2em;
    color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,0.5);
    opacity: 0; transition: opacity 0.8s;
  }
  .power-readout {
    position: absolute; top: 3vh; right: 4vw;
    text-align: right; opacity: 0; transition: opacity 0.8s;
  }
  .power-label { font-size: 1.6vh; color: #5a6a8a; letter-spacing: 0.15em; }
  .power-value { font-size: 4vh; font-weight: 700; color: #00e5ff; text-shadow: 0 0 20px rgba(0,229,255,0.4); font-variant-numeric: tabular-nums; }
  .power-unit { font-size: 1.8vh; color: #5a6a8a; }
  .status-panel {
    position: absolute; bottom: 3vh; left: 4vw; right: 4vw;
    display: flex; justify-content: space-between;
    opacity: 0; transition: opacity 0.8s;
  }
  .status-item { text-align: center; }
  .status-dot { width: 1vh; height: 1vh; border-radius: 50%; margin: 0 auto 0.5vh; }
  .status-dot.green { background: #00e676; box-shadow: 0 0 8px #00e676; }
  .status-dot.yellow { background: #ffab00; box-shadow: 0 0 8px #ffab00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 8px #ff1744; animation: blink 1s infinite; }
  .status-label { font-size: 1.2vh; color: #5a6a8a; letter-spacing: 0.1em; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes pulseRing { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(2.5); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="title" id="title">POWER GRID NETWORK</div>
  <div class="power-readout" id="powerReadout">
    <div class="power-label">GRID OUTPUT</div>
    <div><span class="power-value" id="powerVal">0</span><span class="power-unit"> MW</span></div>
  </div>
  <div class="status-panel" id="statusPanel">
    <div class="status-item"><div class="status-dot green"></div><div class="status-label">SECTOR A</div></div>
    <div class="status-item"><div class="status-dot green"></div><div class="status-label">SECTOR B</div></div>
    <div class="status-item"><div class="status-dot yellow"></div><div class="status-label">SECTOR C</div></div>
    <div class="status-item"><div class="status-dot green"></div><div class="status-label">SECTOR D</div></div>
    <div class="status-item"><div class="status-dot red"></div><div class="status-label">SECTOR E</div></div>
    <div class="status-item"><div class="status-dot green"></div><div class="status-label">SECTOR F</div></div>
  </div>
</div>

<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  title: 'POWER GRID NETWORK',
  powerLevel: 847,
  nodeCount: 25,
  accentColor: '#00e5ff',
  secondaryColor: '#7c4dff',
  bgColor: '#050a18',
  gridLineColor: 'rgba(0,229,255,0.08)',
  cycleDuration: 14000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, nodes = [], connections = [], pulses = [], time = 0, powerCounter = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  generateGrid();
}

function generateGrid() {
  nodes = [];
  connections = [];
  const cols = 5, rows = 5;
  const mx = W * 0.15, my = H * 0.15;
  const gw = W - mx * 2, gh = H - my * 2;

  // Create nodes in a grid with some jitter
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = mx + (gw / (cols - 1)) * c + (Math.random() - 0.5) * gw * 0.06;
      const y = my + (gh / (rows - 1)) * r + (Math.random() - 0.5) * gh * 0.06;
      const isHub = (r === 2 && c === 2);
      nodes.push({ x, y, isHub, energy: Math.random(), phase: Math.random() * Math.PI * 2 });
    }
  }

  // Connect adjacent nodes
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (c < cols - 1) connections.push({ from: i, to: i + 1 });
      if (r < rows - 1) connections.push({ from: i, to: i + cols });
      // Some diagonals
      if (c < cols - 1 && r < rows - 1 && Math.random() > 0.6)
        connections.push({ from: i, to: i + cols + 1 });
    }
  }
}

function spawnPulse() {
  if (connections.length === 0) return;
  const conn = connections[Math.floor(Math.random() * connections.length)];
  const dir = Math.random() > 0.5 ? 1 : -1;
  pulses.push({ conn, progress: dir === 1 ? 0 : 1, dir, speed: 0.008 + Math.random() * 0.008 });
}

function parseColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function drawGrid() {
  // Background grid lines
  ctx.strokeStyle = CONFIG.gridLineColor;
  ctx.lineWidth = 1;
  const step = W / 20;
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawConnections() {
  const ac = parseColor(CONFIG.accentColor);
  connections.forEach(conn => {
    const a = nodes[conn.from], b = nodes[conn.to];
    const alpha = 0.15 + 0.1 * Math.sin(time * 2 + conn.from);
    ctx.strokeStyle = `rgba(${ac.r},${ac.g},${ac.b},${alpha})`;
    ctx.lineWidth = 1.5 * devicePixelRatio;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
}

function drawPulses() {
  const ac = parseColor(CONFIG.accentColor);
  pulses.forEach(p => {
    const a = nodes[p.conn.from], b = nodes[p.conn.to];
    const x = a.x + (b.x - a.x) * p.progress;
    const y = a.y + (b.y - a.y) * p.progress;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, 12 * devicePixelRatio);
    grd.addColorStop(0, `rgba(${ac.r},${ac.g},${ac.b},0.9)`);
    grd.addColorStop(1, `rgba(${ac.r},${ac.g},${ac.b},0)`);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(x, y, 12 * devicePixelRatio, 0, Math.PI * 2); ctx.fill();
  });
}

function drawNodes() {
  const ac = parseColor(CONFIG.accentColor);
  const sc = parseColor(CONFIG.secondaryColor);

  nodes.forEach(n => {
    const pulse = 0.5 + 0.5 * Math.sin(time * 3 + n.phase);
    const radius = n.isHub ? 10 * devicePixelRatio : (4 + pulse * 2) * devicePixelRatio;

    if (n.isHub) {
      // Hub glow rings
      for (let i = 0; i < 3; i++) {
        const ringR = radius * (1.5 + i * 0.8) + Math.sin(time * 2 + i) * 5;
        const ringAlpha = 0.15 - i * 0.04;
        ctx.strokeStyle = `rgba(${ac.r},${ac.g},${ac.b},${ringAlpha})`;
        ctx.lineWidth = 2 * devicePixelRatio;
        ctx.beginPath(); ctx.arc(n.x, n.y, ringR, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Node glow
    const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, radius * 3);
    const col = n.isHub ? ac : sc;
    grd.addColorStop(0, `rgba(${col.r},${col.g},${col.b},${n.isHub ? 0.4 : 0.2})`);
    grd.addColorStop(1, `rgba(${col.r},${col.g},${col.b},0)`);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(n.x, n.y, radius * 3, 0, Math.PI * 2); ctx.fill();

    // Node core
    ctx.fillStyle = n.isHub ? CONFIG.accentColor : `rgba(${sc.r},${sc.g},${sc.b},${0.5 + pulse * 0.5})`;
    ctx.beginPath(); ctx.arc(n.x, n.y, radius, 0, Math.PI * 2); ctx.fill();
  });
}

function update() {
  time += 0.016;

  // Update pulses
  pulses.forEach(p => { p.progress += p.speed * p.dir; });
  pulses = pulses.filter(p => p.progress >= 0 && p.progress <= 1);

  // Spawn new pulses
  if (Math.random() < 0.08) spawnPulse();
}

function draw() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawConnections();
  drawPulses();
  drawNodes();

  update();
  requestAnimationFrame(draw);
}

function runCycle() {
  const title = document.getElementById('title');
  const powerReadout = document.getElementById('powerReadout');
  const statusPanel = document.getElementById('statusPanel');
  const powerVal = document.getElementById('powerVal');

  // Reset
  [title, powerReadout, statusPanel].forEach(el => {
    el.style.transition = 'none'; el.style.opacity = '0';
  });
  powerCounter = 0;
  powerVal.textContent = '0';
  void title.offsetWidth;

  // Animate in
  setTimeout(() => { title.style.transition = 'opacity 0.8s'; title.style.opacity = '1'; }, 300);
  setTimeout(() => { powerReadout.style.transition = 'opacity 0.8s'; powerReadout.style.opacity = '1'; }, 600);
  setTimeout(() => { statusPanel.style.transition = 'opacity 0.8s'; statusPanel.style.opacity = '1'; }, 900);

  // Count up power
  setTimeout(() => {
    const target = CONFIG.powerLevel;
    const steps = 60;
    let step = 0;
    const interval = setInterval(() => {
      step++;
      powerCounter = Math.round((step / steps) * target);
      powerVal.textContent = powerCounter.toLocaleString();
      if (step >= steps) clearInterval(interval);
    }, 20);
  }, 800);

  // Fade out
  setTimeout(() => {
    [title, powerReadout, statusPanel].forEach(el => {
      el.style.transition = 'opacity 1s'; el.style.opacity = '0';
    });
  }, CONFIG.cycleDuration - 1500);

  setTimeout(runCycle, CONFIG.cycleDuration);
}

document.getElementById('title').textContent = CONFIG.title;
window.addEventListener('resize', resize);
resize();
draw();
runCycle();
</script>
</body>
</html>

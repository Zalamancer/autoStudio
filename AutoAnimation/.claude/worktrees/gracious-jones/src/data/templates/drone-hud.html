<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  altitude: 1247,
  speed: 42,
  heading: 275,
  batteryLevel: 87,
  coordinates: { lat: 34.0522, lng: -118.2437 },
  missionName: 'RECON ALPHA-3',
  accentColor: '#00e5ff',
  warningColor: '#ff9100',
  dangerColor: '#ff1744',
  bgColor: 'rgba(5,8,12,0.75)',
  cycleDuration: 10000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0, cycleStart = 0;
let pitch = 0, roll = 0, alt, spd, hdg, bat;
let pitchTarget = 0, rollTarget = 0;
let altTarget, spdTarget, hdgTarget;
let recBlink = true;
let gpsJitter = { lat: 0, lng: 0 };

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function reset() {
  time = 0;
  cycleStart = performance.now();
  alt = CONFIG.altitude;
  spd = CONFIG.speed;
  hdg = CONFIG.heading;
  bat = CONFIG.batteryLevel;
  altTarget = alt;
  spdTarget = spd;
  hdgTarget = hdg;
  pitch = 0;
  roll = 0;
  pitchTarget = 0;
  rollTarget = 0;
}

function updateValues(dt) {
  // Periodically change targets
  if (Math.random() < 0.01) {
    pitchTarget = (Math.random() - 0.5) * 20;
    rollTarget = (Math.random() - 0.5) * 15;
  }
  if (Math.random() < 0.015) {
    altTarget = CONFIG.altitude + (Math.random() - 0.5) * 200;
    spdTarget = CONFIG.speed + (Math.random() - 0.5) * 20;
    hdgTarget = CONFIG.heading + (Math.random() - 0.5) * 40;
  }

  pitch = lerp(pitch, pitchTarget, 0.02);
  roll = lerp(roll, rollTarget, 0.02);
  alt = lerp(alt, altTarget, 0.03);
  spd = lerp(spd, spdTarget, 0.03);
  hdg = lerp(hdg, hdgTarget, 0.02);
  bat = Math.max(5, CONFIG.batteryLevel - time * 0.3);

  gpsJitter.lat = (Math.random() - 0.5) * 0.0001;
  gpsJitter.lng = (Math.random() - 0.5) * 0.0001;

  if (Math.floor(time * 2) % 2 === 0) recBlink = !recBlink;
}

function drawBackground() {
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(0,229,255,0.03)';
  ctx.lineWidth = 1;
  const gridSize = W * 0.04;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawArtificialHorizon() {
  const c = hexToRgb(CONFIG.accentColor);
  const hCx = W * 0.5;
  const hCy = H * 0.5;
  const hR = Math.min(W, H) * 0.22;

  ctx.save();
  ctx.translate(hCx, hCy);
  ctx.rotate(roll * Math.PI / 180);

  // Sky/ground split
  const pitchOffset = pitch * hR * 0.01;
  ctx.beginPath();
  ctx.rect(-hR, -hR, hR * 2, hR * 2);
  ctx.clip();

  // Sky
  ctx.fillStyle = 'rgba(0,60,120,0.15)';
  ctx.fillRect(-hR, -hR, hR * 2, hR + pitchOffset);

  // Ground
  ctx.fillStyle = 'rgba(60,40,0,0.15)';
  ctx.fillRect(-hR, pitchOffset, hR * 2, hR);

  // Horizon line
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.6)`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-hR, pitchOffset);
  ctx.lineTo(hR, pitchOffset);
  ctx.stroke();

  // Pitch ladder
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.3)`;
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
  ctx.font = `${Math.round(H * 0.014)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 1;

  for (let p = -30; p <= 30; p += 5) {
    if (p === 0) continue;
    const y = pitchOffset - p * hR * 0.02;
    const tickW = Math.abs(p) % 10 === 0 ? hR * 0.25 : hR * 0.12;
    ctx.beginPath();
    ctx.moveTo(-tickW, y);
    ctx.lineTo(tickW, y);
    ctx.stroke();
    if (Math.abs(p) % 10 === 0) {
      ctx.fillText(p.toString(), -tickW - 20, y + 4);
      ctx.fillText(p.toString(), tickW + 20, y + 4);
    }
  }

  ctx.restore();

  // Fixed aircraft symbol (center reference)
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.9)`;
  ctx.lineWidth = 2.5;
  const wingW = hR * 0.3;
  const gap = hR * 0.05;

  // Left wing
  ctx.beginPath();
  ctx.moveTo(hCx - gap - wingW, hCy);
  ctx.lineTo(hCx - gap, hCy);
  ctx.lineTo(hCx - gap, hCy + 8);
  ctx.stroke();

  // Right wing
  ctx.beginPath();
  ctx.moveTo(hCx + gap + wingW, hCy);
  ctx.lineTo(hCx + gap, hCy);
  ctx.lineTo(hCx + gap, hCy + 8);
  ctx.stroke();

  // Center dot
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.9)`;
  ctx.beginPath();
  ctx.arc(hCx, hCy, 3, 0, Math.PI * 2);
  ctx.fill();

  // Roll indicator arc
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.3)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(hCx, hCy, hR + 10, -Math.PI * 0.85, -Math.PI * 0.15);
  ctx.stroke();

  // Roll tick marks
  [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60].forEach(deg => {
    const a = (deg - 90) * Math.PI / 180;
    const inner = hR + 10;
    const outer = hR + (deg % 30 === 0 ? 25 : 18);
    ctx.strokeStyle = deg === 0
      ? `rgba(${c.r},${c.g},${c.b},0.9)`
      : `rgba(${c.r},${c.g},${c.b},0.4)`;
    ctx.lineWidth = deg === 0 ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(hCx + Math.cos(a) * inner, hCy + Math.sin(a) * inner);
    ctx.lineTo(hCx + Math.cos(a) * outer, hCy + Math.sin(a) * outer);
    ctx.stroke();
  });

  // Roll pointer (triangle)
  const rollA = (roll - 90) * Math.PI / 180;
  const pR = hR + 10;
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.9)`;
  ctx.beginPath();
  ctx.moveTo(hCx + Math.cos(rollA) * pR, hCy + Math.sin(rollA) * pR);
  ctx.lineTo(hCx + Math.cos(rollA - 0.05) * (pR + 12), hCy + Math.sin(rollA - 0.05) * (pR + 12));
  ctx.lineTo(hCx + Math.cos(rollA + 0.05) * (pR + 12), hCy + Math.sin(rollA + 0.05) * (pR + 12));
  ctx.closePath();
  ctx.fill();
}

function drawAltitudeStrip() {
  const c = hexToRgb(CONFIG.accentColor);
  const stripX = W * 0.78;
  const stripY = H * 0.2;
  const stripW = W * 0.08;
  const stripH = H * 0.6;

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(stripX, stripY, stripW, stripH);
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
  ctx.lineWidth = 1;
  ctx.strokeRect(stripX, stripY, stripW, stripH);

  // Label
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.5)`;
  ctx.font = `${Math.round(H * 0.013)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText('ALT ft', stripX + stripW / 2, stripY - 8);

  // Altitude ladder
  ctx.save();
  ctx.beginPath();
  ctx.rect(stripX, stripY, stripW, stripH);
  ctx.clip();

  const midY = stripY + stripH / 2;
  const pixPerUnit = stripH / 400;
  const roundedAlt = Math.round(alt);

  for (let a = roundedAlt - 250; a <= roundedAlt + 250; a += 50) {
    const y = midY - (a - alt) * pixPerUnit;
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(stripX, y);
    ctx.lineTo(stripX + 8, y);
    ctx.stroke();

    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
    ctx.font = `${Math.round(H * 0.013)}px Courier New`;
    ctx.textAlign = 'right';
    ctx.fillText(a.toString(), stripX + stripW - 5, y + 4);
  }
  ctx.restore();

  // Current value box
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.15)`;
  ctx.fillRect(stripX - 2, midY - 14, stripW + 4, 28);
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.7)`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(stripX - 2, midY - 14, stripW + 4, 28);

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},1)`;
  ctx.font = `bold ${Math.round(H * 0.018)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(Math.round(alt).toString(), stripX + stripW / 2, midY + 6);
}

function drawSpeedStrip() {
  const c = hexToRgb(CONFIG.accentColor);
  const stripX = W * 0.14;
  const stripY = H * 0.2;
  const stripW = W * 0.08;
  const stripH = H * 0.6;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(stripX, stripY, stripW, stripH);
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
  ctx.lineWidth = 1;
  ctx.strokeRect(stripX, stripY, stripW, stripH);

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.5)`;
  ctx.font = `${Math.round(H * 0.013)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText('SPD kts', stripX + stripW / 2, stripY - 8);

  ctx.save();
  ctx.beginPath();
  ctx.rect(stripX, stripY, stripW, stripH);
  ctx.clip();

  const midY = stripY + stripH / 2;
  const pixPerUnit = stripH / 80;

  for (let s = Math.round(spd) - 50; s <= Math.round(spd) + 50; s += 10) {
    if (s < 0) continue;
    const y = midY - (s - spd) * pixPerUnit;
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
    ctx.beginPath();
    ctx.moveTo(stripX + stripW - 8, y);
    ctx.lineTo(stripX + stripW, y);
    ctx.stroke();

    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
    ctx.font = `${Math.round(H * 0.013)}px Courier New`;
    ctx.textAlign = 'left';
    ctx.fillText(s.toString(), stripX + 5, y + 4);
  }
  ctx.restore();

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.15)`;
  ctx.fillRect(stripX - 2, midY - 14, stripW + 4, 28);
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.7)`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(stripX - 2, midY - 14, stripW + 4, 28);

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},1)`;
  ctx.font = `bold ${Math.round(H * 0.018)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(Math.round(spd).toString(), stripX + stripW / 2, midY + 6);
}

function drawCompassBar() {
  const c = hexToRgb(CONFIG.accentColor);
  const barY = H * 0.06;
  const barH = H * 0.04;
  const barX = W * 0.25;
  const barW = W * 0.5;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(barX, barY, barW, barH);

  ctx.save();
  ctx.beginPath();
  ctx.rect(barX, barY, barW, barH);
  ctx.clip();

  const dirs = ['N', '10', '20', 'NE', '40', '50', 'E', '70', '80', 'SE', '100', '110', 'S', '130', '140', 'SW', '160', '170', 'W', '190', '200', 'NW', '220', '230', 'N', '250', '260', 'NE', '280', '290', 'E', '310', '320', 'SE', '340', '350'];
  const degPerTick = 10;
  const pixPerDeg = barW / 60;
  const centerX = barX + barW / 2;

  for (let d = Math.floor(hdg) - 40; d <= Math.ceil(hdg) + 40; d += degPerTick) {
    const normD = ((d % 360) + 360) % 360;
    const idx = Math.floor(normD / 10);
    const label = dirs[idx % dirs.length];
    const x = centerX + (d - hdg) * pixPerDeg;

    const isCardinal = ['N', 'S', 'E', 'W', 'NE', 'NW', 'SE', 'SW'].includes(label);
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${isCardinal ? 0.6 : 0.2})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, barY + barH);
    ctx.lineTo(x, barY + barH - (isCardinal ? barH * 0.5 : barH * 0.3));
    ctx.stroke();

    if (isCardinal) {
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.8)`;
      ctx.font = `bold ${Math.round(H * 0.014)}px Courier New`;
    } else {
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.3)`;
      ctx.font = `${Math.round(H * 0.011)}px Courier New`;
    }
    ctx.textAlign = 'center';
    ctx.fillText(label, x, barY + barH * 0.35);
  }
  ctx.restore();

  // Center indicator triangle
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.9)`;
  ctx.beginPath();
  ctx.moveTo(centerX, barY + barH + 2);
  ctx.lineTo(centerX - 6, barY + barH + 10);
  ctx.lineTo(centerX + 6, barY + barH + 10);
  ctx.closePath();
  ctx.fill();

  // Heading readout
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},1)`;
  ctx.font = `bold ${Math.round(H * 0.016)}px Courier New`;
  ctx.textAlign = 'center';
  const hdgStr = Math.round(((hdg % 360) + 360) % 360).toString().padStart(3, '0');
  ctx.fillText(hdgStr + '\u00B0', centerX, barY + barH + 25);
}

function drawCrosshair() {
  const c = hexToRgb(CONFIG.accentColor);
  const cx = W * 0.5;
  const cy = H * 0.5;
  const size = Math.min(W, H) * 0.04;
  const gap = size * 0.3;

  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.5)`;
  ctx.lineWidth = 1.5;

  // Diamond reticle
  ctx.beginPath();
  ctx.moveTo(cx, cy - size);
  ctx.lineTo(cx + size * 0.3, cy - gap);
  ctx.moveTo(cx + size, cy);
  ctx.lineTo(cx + gap, cy + size * 0.3);
  ctx.moveTo(cx, cy + size);
  ctx.lineTo(cx - size * 0.3, cy + gap);
  ctx.moveTo(cx - size, cy);
  ctx.lineTo(cx - gap, cy - size * 0.3);
  ctx.stroke();

  // Corner brackets
  const bSize = size * 1.8;
  const bLen = size * 0.5;
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.3)`;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx + dx * bSize, cy + dy * (bSize - bLen));
    ctx.lineTo(cx + dx * bSize, cy + dy * bSize);
    ctx.lineTo(cx + dx * (bSize - bLen), cy + dy * bSize);
    ctx.stroke();
  });
}

function drawBattery() {
  const c = hexToRgb(CONFIG.accentColor);
  const wc = hexToRgb(CONFIG.warningColor);
  const dc = hexToRgb(CONFIG.dangerColor);
  const bx = W * 0.88;
  const by = H * 0.06;
  const bw = W * 0.06;
  const bh = H * 0.025;

  // Battery outline
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
  ctx.fillRect(bx + bw, by + bh * 0.25, 4, bh * 0.5);

  // Fill
  let fillColor;
  if (bat > 50) fillColor = `rgba(${c.r},${c.g},${c.b},0.6)`;
  else if (bat > 20) fillColor = `rgba(${wc.r},${wc.g},${wc.b},0.6)`;
  else fillColor = `rgba(${dc.r},${dc.g},${dc.b},${0.5 + 0.5 * Math.sin(time * 5)})`;

  ctx.fillStyle = fillColor;
  ctx.fillRect(bx + 2, by + 2, (bw - 4) * (bat / 100), bh - 4);

  // Percentage
  ctx.fillStyle = `rgba(255,255,255,0.8)`;
  ctx.font = `bold ${Math.round(H * 0.014)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(Math.round(bat) + '%', bx + bw / 2, by + bh + 16);
}

function drawRecIndicator() {
  const dc = hexToRgb(CONFIG.dangerColor);
  const rx = W * 0.04;
  const ry = H * 0.06;

  if (recBlink) {
    ctx.fillStyle = `rgba(${dc.r},${dc.g},${dc.b},0.9)`;
    ctx.beginPath();
    ctx.arc(rx, ry, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = `rgba(255,255,255,0.8)`;
  ctx.font = `bold ${Math.round(H * 0.016)}px Courier New`;
  ctx.textAlign = 'left';
  ctx.fillText('REC', rx + 14, ry + 5);

  // Time counter
  const mins = Math.floor(time / 60).toString().padStart(2, '0');
  const secs = Math.floor(time % 60).toString().padStart(2, '0');
  ctx.fillStyle = `rgba(255,255,255,0.5)`;
  ctx.font = `${Math.round(H * 0.013)}px Courier New`;
  ctx.fillText(mins + ':' + secs, rx + 14, ry + 22);
}

function drawGPS() {
  const c = hexToRgb(CONFIG.accentColor);
  const gx = W * 0.04;
  const gy = H * 0.88;

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.5)`;
  ctx.font = `${Math.round(H * 0.012)}px Courier New`;
  ctx.textAlign = 'left';
  ctx.fillText('GPS', gx, gy);

  const lat = (CONFIG.coordinates.lat + gpsJitter.lat).toFixed(4);
  const lng = (CONFIG.coordinates.lng + gpsJitter.lng).toFixed(4);

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.7)`;
  ctx.font = `${Math.round(H * 0.014)}px Courier New`;
  ctx.fillText(lat + '\u00B0N', gx, gy + 18);
  ctx.fillText(Math.abs(parseFloat(lng)).toFixed(4) + '\u00B0W', gx, gy + 36);
}

function drawMissionInfo() {
  const c = hexToRgb(CONFIG.accentColor);
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
  ctx.font = `${Math.round(H * 0.012)}px Courier New`;
  ctx.textAlign = 'right';
  ctx.fillText('MISSION', W * 0.96, H * 0.88);

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.8)`;
  ctx.font = `bold ${Math.round(H * 0.015)}px Courier New`;
  ctx.fillText(CONFIG.missionName, W * 0.96, H * 0.88 + 20);

  // Signal bars
  const sx = W * 0.96 - 40;
  const sy = H * 0.88 + 30;
  for (let i = 0; i < 5; i++) {
    const bh = 4 + i * 3;
    const active = i < 4;
    ctx.fillStyle = active
      ? `rgba(${c.r},${c.g},${c.b},0.6)`
      : `rgba(${c.r},${c.g},${c.b},0.15)`;
    ctx.fillRect(sx + i * 8, sy + 15 - bh, 5, bh);
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.8);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

let lastTime = 0;
function render(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  time += dt * 0.001;

  if (timestamp - cycleStart > CONFIG.cycleDuration) {
    reset();
    lastTime = timestamp;
  }

  updateValues(dt);
  drawBackground();
  drawArtificialHorizon();
  drawAltitudeStrip();
  drawSpeedStrip();
  drawCompassBar();
  drawCrosshair();
  drawBattery();
  drawRecIndicator();
  drawGPS();
  drawMissionInfo();
  drawScanlines();
  drawVignette();

  requestAnimationFrame(render);
}

function runCycle() {
  reset();
  requestAnimationFrame(render);
}

resize();
window.addEventListener('resize', resize);

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'configUpdate' && e.data.config) {
    Object.assign(CONFIG, e.data.config);
    reset();
  }
});

runCycle();
</script>
</body>
</html>

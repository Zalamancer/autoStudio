<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphism</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    color: #555;
  }
  .container {
    width: 90%; max-width: 400px;
    display: flex; flex-direction: column;
    align-items: center; gap: 24px;
  }
  .neu-card {
    width: 100%; padding: 24px; border-radius: 20px;
    background: #e0e0e0;
    box-shadow: 8px 8px 16px #b8b8b8, -8px -8px 16px #ffffff;
  }
  .neu-inset {
    border-radius: 16px; background: #e0e0e0;
    box-shadow: inset 4px 4px 8px #b8b8b8, inset -4px -4px 8px #ffffff;
  }
  /* Top card - gauges */
  .gauges-row {
    display: flex; justify-content: space-around; align-items: center;
  }
  .gauge-container {
    width: 80px; height: 80px; position: relative;
  }
  .gauge-bg {
    width: 80px; height: 80px; border-radius: 50%;
    background: #e0e0e0;
    box-shadow: 6px 6px 12px #b8b8b8, -6px -6px 12px #ffffff;
    display: flex; align-items: center; justify-content: center;
  }
  .gauge-inner {
    width: 58px; height: 58px; border-radius: 50%;
    background: #e0e0e0;
    box-shadow: inset 3px 3px 6px #b8b8b8, inset -3px -3px 6px #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #666;
  }
  .gauge-svg {
    position: absolute; top: 0; left: 0; width: 80px; height: 80px;
    transform: rotate(-90deg);
  }
  .gauge-track { fill: none; stroke: #d0d0d0; stroke-width: 4; }
  .gauge-fill { fill: none; stroke: #888; stroke-width: 4; stroke-linecap: round; }
  .gauge1-fill { animation: gauge1Anim 3s ease-in-out infinite; }
  .gauge2-fill { animation: gauge2Anim 4s ease-in-out infinite; }
  .gauge3-fill { animation: gauge3Anim 3.5s ease-in-out infinite; }
  @keyframes gauge1Anim {
    0%, 100% { stroke-dasharray: 0 157; }
    50% { stroke-dasharray: 118 157; }
  }
  @keyframes gauge2Anim {
    0%, 100% { stroke-dasharray: 0 157; }
    50% { stroke-dasharray: 95 157; }
  }
  @keyframes gauge3Anim {
    0%, 100% { stroke-dasharray: 0 157; }
    50% { stroke-dasharray: 140 157; }
  }
  .gauge-label {
    text-align: center; margin-top: 8px; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase; color: #888;
  }
  /* Progress bars */
  .progress-section { margin-top: 4px; }
  .progress-label {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: #888; margin-bottom: 8px;
  }
  .progress-bar {
    height: 12px; border-radius: 6px; padding: 2px;
    background: #e0e0e0;
    box-shadow: inset 3px 3px 6px #b8b8b8, inset -3px -3px 6px #ffffff;
  }
  .progress-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(135deg, #c8c8c8, #d8d8d8);
    box-shadow: 1px 1px 3px #b8b8b8;
  }
  .fill1 { animation: progressFill1 4s ease-in-out infinite; }
  .fill2 { animation: progressFill2 5s ease-in-out infinite; }
  .fill3 { animation: progressFill3 3.5s ease-in-out infinite; }
  @keyframes progressFill1 {
    0%, 100% { width: 15%; }
    50% { width: 85%; }
  }
  @keyframes progressFill2 {
    0%, 100% { width: 10%; }
    50% { width: 65%; }
  }
  @keyframes progressFill3 {
    0%, 100% { width: 20%; }
    50% { width: 95%; }
  }
  /* Buttons row */
  .buttons-row {
    display: flex; justify-content: space-around; width: 100%;
  }
  .neu-btn {
    width: 60px; height: 60px; border-radius: 16px; border: none;
    background: #e0e0e0; cursor: pointer;
    box-shadow: 6px 6px 12px #b8b8b8, -6px -6px 12px #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #777; transition: all 0.1s;
  }
  .btn1 { animation: btnPress 2s ease-in-out infinite; }
  .btn2 { animation: btnPress 2s ease-in-out infinite 0.5s; }
  .btn3 { animation: btnPress 2s ease-in-out infinite 1.0s; }
  .btn4 { animation: btnPress 2s ease-in-out infinite 1.5s; }
  @keyframes btnPress {
    0%, 100% {
      box-shadow: 6px 6px 12px #b8b8b8, -6px -6px 12px #ffffff;
      transform: scale(1);
    }
    15%, 30% {
      box-shadow: inset 4px 4px 8px #b8b8b8, inset -4px -4px 8px #ffffff;
      transform: scale(0.95);
    }
  }
  /* Toggles row */
  .toggles-row {
    display: flex; justify-content: space-around; width: 100%;
    align-items: center;
  }
  .toggle-track {
    width: 56px; height: 28px; border-radius: 14px; position: relative;
    background: #e0e0e0;
    box-shadow: inset 3px 3px 6px #b8b8b8, inset -3px -3px 6px #ffffff;
  }
  .toggle-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    position: absolute; top: 3px;
    background: #e0e0e0;
    box-shadow: 2px 2px 5px #b8b8b8, -2px -2px 5px #ffffff;
    transition: left 0.3s;
  }
  .toggle1 .toggle-thumb { animation: toggleFlip1 3s ease-in-out infinite; }
  .toggle2 .toggle-thumb { animation: toggleFlip2 4s ease-in-out infinite; }
  .toggle3 .toggle-thumb { animation: toggleFlip3 2.5s ease-in-out infinite; }
  @keyframes toggleFlip1 {
    0%, 45% { left: 3px; }
    55%, 100% { left: 31px; }
  }
  @keyframes toggleFlip2 {
    0%, 40% { left: 31px; }
    60%, 100% { left: 3px; }
  }
  @keyframes toggleFlip3 {
    0%, 30% { left: 3px; }
    50%, 80% { left: 31px; }
    100% { left: 3px; }
  }
  .toggle-label {
    font-size: 10px; text-align: center; margin-top: 6px;
    letter-spacing: 1px; text-transform: uppercase; color: #888;
  }
  /* Title */
  .title-text {
    font-size: 18px; font-weight: 300; letter-spacing: 6px;
    text-transform: uppercase; color: #999;
    animation: titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { opacity: 0.5; letter-spacing: 6px; }
    50% { opacity: 1; letter-spacing: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="title-text" id="titleText">Soft UI</div>

  <div class="neu-card">
    <div class="gauges-row">
      <div>
        <div class="gauge-container">
          <div class="gauge-bg">
            <div class="gauge-inner" id="gauge1Val">75</div>
          </div>
          <svg class="gauge-svg" viewBox="0 0 80 80">
            <circle class="gauge-track" cx="40" cy="40" r="25"/>
            <circle class="gauge-fill gauge1-fill" cx="40" cy="40" r="25"/>
          </svg>
        </div>
        <div class="gauge-label">Speed</div>
      </div>
      <div>
        <div class="gauge-container">
          <div class="gauge-bg">
            <div class="gauge-inner" id="gauge2Val">60</div>
          </div>
          <svg class="gauge-svg" viewBox="0 0 80 80">
            <circle class="gauge-track" cx="40" cy="40" r="25"/>
            <circle class="gauge-fill gauge2-fill" cx="40" cy="40" r="25"/>
          </svg>
        </div>
        <div class="gauge-label">Power</div>
      </div>
      <div>
        <div class="gauge-container">
          <div class="gauge-bg">
            <div class="gauge-inner" id="gauge3Val">90</div>
          </div>
          <svg class="gauge-svg" viewBox="0 0 80 80">
            <circle class="gauge-track" cx="40" cy="40" r="25"/>
            <circle class="gauge-fill gauge3-fill" cx="40" cy="40" r="25"/>
          </svg>
        </div>
        <div class="gauge-label">Sync</div>
      </div>
    </div>
  </div>

  <div class="neu-card">
    <div class="progress-section">
      <div class="progress-label">Upload</div>
      <div class="progress-bar"><div class="progress-fill fill1"></div></div>
    </div>
    <div class="progress-section" style="margin-top:16px">
      <div class="progress-label">Process</div>
      <div class="progress-bar"><div class="progress-fill fill2"></div></div>
    </div>
    <div class="progress-section" style="margin-top:16px">
      <div class="progress-label">Render</div>
      <div class="progress-bar"><div class="progress-fill fill3"></div></div>
    </div>
  </div>

  <div class="buttons-row">
    <div class="neu-btn btn1">&#9654;</div>
    <div class="neu-btn btn2">&#10074;&#10074;</div>
    <div class="neu-btn btn3">&#9632;</div>
    <div class="neu-btn btn4">&#8635;</div>
  </div>

  <div class="toggles-row">
    <div>
      <div class="toggle-track toggle1"><div class="toggle-thumb"></div></div>
      <div class="toggle-label">Audio</div>
    </div>
    <div>
      <div class="toggle-track toggle2"><div class="toggle-thumb"></div></div>
      <div class="toggle-label">Video</div>
    </div>
    <div>
      <div class="toggle-track toggle3"><div class="toggle-thumb"></div></div>
      <div class="toggle-label">Sync</div>
    </div>
  </div>
</div>

<script>
// ===== EDITABLE VARIABLES =====
const TITLE = 'Soft UI';
const BG_COLOR = '#e0e0e0';
const SHADOW_DARK = '#b8b8b8';
const SHADOW_LIGHT = '#ffffff';
// ==============================

document.getElementById('titleText').textContent = TITLE;
document.body.style.background = BG_COLOR;

// Animate gauge values
function animateGauges() {
  const t = Date.now() / 1000;
  document.getElementById('gauge1Val').textContent = Math.round(50 + 25 * Math.sin(t * 0.7));
  document.getElementById('gauge2Val').textContent = Math.round(40 + 20 * Math.sin(t * 0.5));
  document.getElementById('gauge3Val').textContent = Math.round(60 + 30 * Math.sin(t * 0.6));
  requestAnimationFrame(animateGauges);
}
animateGauges();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowfall Forest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #0c1520; }
  canvas#snowCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  }
</style>
</head>
<body>
<canvas id="snowCanvas"></canvas>

<script>
const CONFIG = {
  titleText: 'Winter Forest',
  skyColorTop: '#0c1520',
  skyColorMid: '#1a2535',
  skyColorBottom: '#2a3a50',
  snowColor: '#e8eef5',
  treeColor: '#0d1a25',
  treeLightColor: '#1a2835',
  groundSnowColor: '#c8d8e8',
  fogColor: '#3a4a5a',
  snowflakeCount: 350,
  treeCount: 25,
  windSpeed: 0.3,
  snowSpeed: 1.0,
  fogDensity: 0.5,
  starCount: 100,
  cycleDuration: 24,
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateTrees();
  generateGroundSnow();
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

// --- Stars ---
const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({
    x: Math.random(), y: Math.random() * 0.4,
    size: Math.random() * 1.5 + 0.3,
    brightness: 0.2 + Math.random() * 0.5,
    twinklePhase: Math.random() * Math.PI * 2,
    twinkleSpeed: Math.random() * 0.015 + 0.003,
  });
}

function drawStars(t) {
  stars.forEach(s => {
    s.twinklePhase += s.twinkleSpeed;
    const alpha = s.brightness * (0.3 + 0.7 * Math.abs(Math.sin(s.twinklePhase)));
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 230, 255, ${alpha})`;
    ctx.fill();
  });
}

// --- Sky ---
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.skyColorTop);
  grad.addColorStop(0.5, CONFIG.skyColorMid);
  grad.addColorStop(1, CONFIG.skyColorBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// --- Moon ---
function drawMoon(t) {
  const moonX = W * 0.78;
  const moonY = H * 0.15;
  const moonR = Math.min(W, H) * 0.04;
  const pulse = 0.9 + 0.1 * Math.sin(t * 0.001);

  // Outer glow
  const g1 = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 5);
  g1.addColorStop(0, 'rgba(180, 200, 220, 0.08)');
  g1.addColorStop(0.5, 'rgba(150, 180, 210, 0.03)');
  g1.addColorStop(1, 'transparent');
  ctx.fillStyle = g1;
  ctx.fillRect(moonX - moonR * 5, moonY - moonR * 5, moonR * 10, moonR * 10);

  // Moon body
  const moonGrad = ctx.createRadialGradient(moonX - moonR * 0.2, moonY - moonR * 0.2, 0, moonX, moonY, moonR);
  moonGrad.addColorStop(0, `rgba(230, 235, 240, ${pulse})`);
  moonGrad.addColorStop(0.7, `rgba(200, 210, 225, ${pulse * 0.9})`);
  moonGrad.addColorStop(1, `rgba(160, 180, 200, ${pulse * 0.7})`);
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * pulse, 0, Math.PI * 2);
  ctx.fillStyle = moonGrad;
  ctx.fill();

  // Moon craters (subtle)
  ctx.fillStyle = 'rgba(140, 160, 180, 0.15)';
  ctx.beginPath(); ctx.arc(moonX + moonR * 0.2, moonY - moonR * 0.1, moonR * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX - moonR * 0.15, moonY + moonR * 0.25, moonR * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX + moonR * 0.35, moonY + moonR * 0.2, moonR * 0.06, 0, Math.PI * 2); ctx.fill();
}

// --- Pine trees ---
let trees = [];
function generateTrees() {
  trees = [];
  for (let i = 0; i < CONFIG.treeCount; i++) {
    const depth = Math.random(); // 0 = far, 1 = near
    const baseY = H * (0.45 + depth * 0.35);
    const height = (40 + Math.random() * 80) * (0.4 + depth * 0.6);
    trees.push({
      x: Math.random() * W * 1.2 - W * 0.1,
      baseY,
      height,
      width: height * (0.3 + Math.random() * 0.15),
      depth,
      layers: 4 + Math.floor(Math.random() * 3),
      snowAmount: 0.3 + Math.random() * 0.5,
      swayPhase: Math.random() * Math.PI * 2,
      swayAmp: 1 + Math.random() * 2,
    });
  }
  // Sort by depth (far trees drawn first)
  trees.sort((a, b) => a.depth - b.depth);
}

function drawTree(tree, t) {
  const tc = hexToRgb(CONFIG.treeColor);
  const tlc = hexToRgb(CONFIG.treeLightColor);
  const sc = hexToRgb(CONFIG.snowColor);
  const sway = Math.sin(t * 0.001 + tree.swayPhase) * tree.swayAmp * (1 - tree.depth * 0.5);

  const x = tree.x + sway;
  const y = tree.baseY;
  const h = tree.height;
  const w = tree.width;

  // Trunk
  const trunkW = w * 0.08;
  const trunkH = h * 0.15;
  const brightness = 0.5 + tree.depth * 0.5;
  ctx.fillStyle = `rgba(${Math.floor(tc.r * brightness + 20)}, ${Math.floor(tc.g * brightness + 15)}, ${Math.floor(tc.b * brightness + 10)}, 1)`;
  ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

  // Tree layers (triangle sections)
  for (let layer = 0; layer < tree.layers; layer++) {
    const layerProgress = layer / tree.layers;
    const layerY = y - trunkH - layerProgress * h * 0.85;
    const layerW = w * (1 - layerProgress * 0.7) * (1 + layer * 0.08);
    const layerH = h / tree.layers * 1.3;

    // Tree foliage
    const treeIntensity = 0.6 + tree.depth * 0.4;
    ctx.beginPath();
    ctx.moveTo(x, layerY - layerH);
    ctx.lineTo(x - layerW / 2, layerY);
    ctx.lineTo(x + layerW / 2, layerY);
    ctx.closePath();
    ctx.fillStyle = `rgba(${Math.floor(tlc.r * treeIntensity)}, ${Math.floor(tlc.g * treeIntensity)}, ${Math.floor(tlc.b * treeIntensity)}, 1)`;
    ctx.fill();

    // Snow on branches
    if (tree.snowAmount > 0) {
      const snowH = layerH * 0.15 * tree.snowAmount;
      ctx.beginPath();
      ctx.moveTo(x, layerY - layerH);
      ctx.lineTo(x - layerW * 0.35, layerY - layerH * 0.4);
      ctx.quadraticCurveTo(x - layerW * 0.15, layerY - layerH * 0.35 - snowH, x, layerY - layerH * 0.5);
      ctx.quadraticCurveTo(x + layerW * 0.15, layerY - layerH * 0.35 - snowH, x + layerW * 0.35, layerY - layerH * 0.4);
      ctx.closePath();
      const snowAlpha = 0.4 + tree.depth * 0.4;
      ctx.fillStyle = `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${snowAlpha * tree.snowAmount})`;
      ctx.fill();
    }
  }

  // Snow cap on top
  ctx.beginPath();
  const topY = y - trunkH - h * 0.85;
  ctx.arc(x, topY, w * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${0.5 + tree.depth * 0.3})`;
  ctx.fill();
}

// --- Ground snow ---
let groundPoints = [];
function generateGroundSnow() {
  groundPoints = [];
  const segments = 80;
  for (let i = 0; i <= segments; i++) {
    const x = (i / segments) * W;
    const y = H * 0.82 + Math.sin(i * 0.15) * 8 + Math.sin(i * 0.3) * 4 + Math.random() * 3;
    groundPoints.push({ x, y });
  }
}

function drawGroundSnow(t) {
  const gc = hexToRgb(CONFIG.groundSnowColor);

  // Snow mounds
  ctx.beginPath();
  ctx.moveTo(0, H);
  groundPoints.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else {
      const prev = groundPoints[i - 1];
      const cpx = (prev.x + p.x) / 2;
      const cpy = (prev.y + p.y) / 2;
      ctx.quadraticCurveTo(prev.x, prev.y, cpx, cpy);
    }
  });
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();

  const snowGrad = ctx.createLinearGradient(0, H * 0.80, 0, H);
  snowGrad.addColorStop(0, `rgba(${gc.r}, ${gc.g}, ${gc.b}, 1)`);
  snowGrad.addColorStop(0.4, `rgba(${gc.r - 15}, ${gc.g - 15}, ${gc.b - 10}, 1)`);
  snowGrad.addColorStop(1, `rgba(${gc.r - 30}, ${gc.g - 30}, ${gc.b - 20}, 1)`);
  ctx.fillStyle = snowGrad;
  ctx.fill();

  // Subtle sparkles on snow surface
  for (let i = 0; i < 40; i++) {
    const sx = (i / 40) * W + Math.sin(t * 0.002 + i * 5) * 3;
    const sy = H * 0.83 + Math.sin(i * 2.3) * 6;
    const sparkle = 0.5 + 0.5 * Math.sin(t * 0.005 + i * 7);
    if (sparkle > 0.85) {
      ctx.beginPath();
      ctx.arc(sx, sy, 1, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${(sparkle - 0.85) * 4})`;
      ctx.fill();
    }
  }

  // Snow drift highlights at the crests
  groundPoints.forEach((p, i) => {
    if (i > 0 && i < groundPoints.length - 1) {
      const prev = groundPoints[i - 1];
      const next = groundPoints[i + 1];
      if (p.y < prev.y && p.y < next.y) {
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 15);
        glow.addColorStop(0, 'rgba(230, 240, 255, 0.15)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.fillRect(p.x - 15, p.y - 15, 30, 30);
      }
    }
  });
}

// --- Snowflakes ---
class Snowflake {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x = Math.random() * W * 1.2 - W * 0.1;
    this.y = init ? Math.random() * H : -10 - Math.random() * 50;
    this.size = Math.random() * 4 + 0.8;
    this.speed = (0.5 + this.size * 0.4) * CONFIG.snowSpeed;
    this.windOffset = Math.random() * Math.PI * 2;
    this.wobbleAmp = 15 + Math.random() * 25;
    this.wobbleSpeed = 0.003 + Math.random() * 0.005;
    this.opacity = 0.3 + Math.random() * 0.5;
    this.depth = this.size / 5; // size indicates depth
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.type = Math.random() > 0.7 ? 'crystal' : 'dot'; // Most are simple dots
  }
  update(t) {
    this.y += this.speed;
    const wind = Math.sin(t * this.wobbleSpeed + this.windOffset) * this.wobbleAmp * 0.02;
    this.x += wind + CONFIG.windSpeed * 0.5;
    this.rotation += this.rotSpeed;

    if (this.y > H + 20 || this.x > W + 60 || this.x < -60) {
      this.reset(false);
    }
  }
  draw(t) {
    const sc = hexToRgb(CONFIG.snowColor);
    const wobbleX = Math.sin(t * this.wobbleSpeed + this.windOffset) * this.wobbleAmp;
    const px = this.x + wobbleX;
    const py = this.y;

    // Depth-based fog fade
    const depthFade = 0.5 + this.depth * 0.5;
    const alpha = this.opacity * depthFade;

    if (this.type === 'crystal' && this.size > 2) {
      // Detailed snowflake crystal
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(this.rotation);
      ctx.strokeStyle = `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${alpha})`;
      ctx.lineWidth = 0.5;
      for (let arm = 0; arm < 6; arm++) {
        const angle = (arm / 6) * Math.PI * 2;
        const len = this.size;
        const ex = Math.cos(angle) * len;
        const ey = Math.sin(angle) * len;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        // Branch
        const bx = Math.cos(angle) * len * 0.5;
        const by = Math.sin(angle) * len * 0.5;
        const ba1 = angle + 0.5;
        const ba2 = angle - 0.5;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(ba1) * len * 0.3, by + Math.sin(ba1) * len * 0.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(ba2) * len * 0.3, by + Math.sin(ba2) * len * 0.3);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      // Simple dot snowflake
      ctx.beginPath();
      ctx.arc(px, py, this.size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${alpha})`;
      ctx.fill();
    }

    // Subtle glow for larger flakes
    if (this.size > 2.5) {
      const glow = ctx.createRadialGradient(px, py, 0, px, py, this.size * 2);
      glow.addColorStop(0, `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${alpha * 0.1})`);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(px - this.size * 2, py - this.size * 2, this.size * 4, this.size * 4);
    }
  }
}

const snowflakes = [];
for (let i = 0; i < CONFIG.snowflakeCount; i++) snowflakes.push(new Snowflake(true));

// --- Fog layers ---
function drawFog(t) {
  const fc = hexToRgb(CONFIG.fogColor);
  const fogLayers = [
    { y: 0.35, height: 0.20, opacity: 0.08, speed: 0.00008 },
    { y: 0.50, height: 0.15, opacity: 0.12, speed: 0.00012 },
    { y: 0.65, height: 0.18, opacity: 0.10, speed: 0.00006 },
    { y: 0.78, height: 0.10, opacity: 0.15, speed: 0.00010 },
  ];

  fogLayers.forEach((fl, i) => {
    const drift = Math.sin(t * fl.speed + i * 2) * W * 0.05;
    const fy = fl.y * H + Math.sin(t * 0.0005 + i * 1.5) * 10;

    const fogGrad = ctx.createLinearGradient(0, fy, 0, fy + fl.height * H);
    fogGrad.addColorStop(0, 'transparent');
    fogGrad.addColorStop(0.3, `rgba(${fc.r}, ${fc.g}, ${fc.b}, ${fl.opacity * CONFIG.fogDensity})`);
    fogGrad.addColorStop(0.7, `rgba(${fc.r}, ${fc.g}, ${fc.b}, ${fl.opacity * CONFIG.fogDensity})`);
    fogGrad.addColorStop(1, 'transparent');

    ctx.fillStyle = fogGrad;
    ctx.fillRect(drift, fy, W, fl.height * H);
  });
}

// --- Ambient light from moon ---
function drawMoonlight(t) {
  const pulse = 0.8 + 0.2 * Math.sin(t * 0.001);
  const moonGlow = ctx.createRadialGradient(W * 0.78, H * 0.15, 0, W * 0.78, H * 0.15, W * 0.5);
  moonGlow.addColorStop(0, `rgba(180, 200, 230, ${0.03 * pulse})`);
  moonGlow.addColorStop(0.5, `rgba(150, 180, 210, ${0.01 * pulse})`);
  moonGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = moonGlow;
  ctx.fillRect(0, 0, W, H);
}

// --- Foreground snow particles (close to camera, blurry) ---
const foregroundFlakes = [];
for (let i = 0; i < 15; i++) {
  foregroundFlakes.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 8 + Math.random() * 15,
    speed: 1 + Math.random() * 1.5,
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleAmp: 30 + Math.random() * 40,
    opacity: 0.05 + Math.random() * 0.08,
  });
}

function drawForegroundSnow(t) {
  const sc = hexToRgb(CONFIG.snowColor);
  foregroundFlakes.forEach(f => {
    f.y += f.speed * CONFIG.snowSpeed;
    f.wobblePhase += 0.003;
    if (f.y > H + f.size * 2) {
      f.y = -f.size * 2;
      f.x = Math.random() * W;
    }
    const wx = f.x + Math.sin(f.wobblePhase) * f.wobbleAmp + CONFIG.windSpeed * 2;
    const glow = ctx.createRadialGradient(wx, f.y, 0, wx, f.y, f.size);
    glow.addColorStop(0, `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${f.opacity})`);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(wx - f.size, f.y - f.size, f.size * 2, f.size * 2);
  });
}

resize();
window.addEventListener('resize', resize);

function animate(t) {
  drawSky();
  drawStars(t);
  drawMoon(t);
  drawMoonlight(t);

  // Far trees
  trees.filter(tr => tr.depth < 0.4).forEach(tr => drawTree(tr, t));

  drawFog(t);

  // Mid trees
  trees.filter(tr => tr.depth >= 0.4 && tr.depth < 0.7).forEach(tr => drawTree(tr, t));

  // Near trees
  trees.filter(tr => tr.depth >= 0.7).forEach(tr => drawTree(tr, t));

  drawGroundSnow(t);

  // Snowflakes
  snowflakes.forEach(sf => { sf.update(t); sf.draw(t); });

  drawForegroundSnow(t);

  // Vignette
  const vig = ctx.createRadialGradient(W / 2, H * 0.4, W * 0.2, W / 2, H * 0.4, W * 0.65);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0, 5, 15, 0.4)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

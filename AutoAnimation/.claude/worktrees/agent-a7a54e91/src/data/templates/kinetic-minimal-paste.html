<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimalist Paste-Up Poster - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: #ffffff;
  }

  body::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.0' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.3'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  #poster-stage {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .word-block {
    position: absolute;
    white-space: nowrap;
    line-height: 1;
    opacity: 0;
    transform-origin: center center;
    cursor: default;
    user-select: none;
    will-change: transform, opacity;
  }

  .word-block .word-inner {
    display: inline-block;
    padding: 6px 14px;
    position: relative;
  }

  /* Sticky note style */
  .word-block.sticky .word-inner {
    background: #fffde7;
    box-shadow: 2px 3px 8px rgba(0,0,0,0.1);
    padding: 10px 18px;
  }

  /* Clean underline */
  .word-block.clean-line .word-inner {
    border-bottom: 3px solid #1a1a1a;
    padding-bottom: 8px;
  }

  /* Circle highlight */
  .word-block.circle-mark .word-inner::before {
    content: '';
    position: absolute;
    inset: -8px -12px;
    border: 2px solid #ff3333;
    border-radius: 50%;
    z-index: -1;
  }

  @keyframes slidePlace {
    0% { opacity: 0; transform: var(--slide-start); }
    60% { opacity: 1; transform: var(--slide-mid); }
    100% { opacity: var(--final-opacity); transform: var(--slide-end); }
  }

  @keyframes liftAway {
    0% { opacity: var(--final-opacity); transform: var(--slide-end); box-shadow: none; }
    30% { opacity: 0.9; transform: var(--lift-mid); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    100% { opacity: 0; transform: var(--lift-end); box-shadow: 0 20px 60px rgba(0,0,0,0.05); }
  }

  /* Grid lines background */
  .grid-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image:
      linear-gradient(90deg, #1a1a1a 1px, transparent 1px),
      linear-gradient(0deg, #1a1a1a 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Pencil marks */
  .pencil-mark {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    background: #1a1a1a;
    opacity: 0.06;
    border-radius: 1px;
  }

  /* Small annotation text */
  .annotation {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #999;
    opacity: 0.3;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="poster-stage"></div>

<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  words: ['LESS', 'IS', 'MORE', 'KEEP', 'IT', 'SIMPLE'],
  colors: ['#1a1a1a', '#ff3333', '#1a1a1a', '#1a1a1a', '#ff3333', '#1a1a1a'],
  bgColor: '#ffffff',
  maxRotation: 4,
  overlapAmount: 0.2,
  cycleDuration: 8500,
  slideEffect: true,
};
// =========================================

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('poster-stage');

const fontPresets = [
  { family: 'Arial', weight: '900', style: 'normal', transform: 'uppercase', letterSpacing: '10px' },
  { family: 'Georgia', weight: '400', style: 'italic', transform: 'lowercase', letterSpacing: '4px' },
  { family: 'Arial', weight: '900', style: 'normal', transform: 'uppercase', letterSpacing: '14px' },
  { family: 'Arial', weight: '300', style: 'normal', transform: 'uppercase', letterSpacing: '8px' },
  { family: 'Georgia', weight: '400', style: 'italic', transform: 'lowercase', letterSpacing: '2px' },
  { family: 'Arial', weight: '900', style: 'normal', transform: 'uppercase', letterSpacing: '6px' },
];

const fontSizes = [140, 200, 120, 80, 180, 100];
const wordStyles = ['', 'sticky', 'clean-line', '', 'circle-mark', 'sticky'];

function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function createDecorations() {
  // Grid background
  const grid = document.createElement('div');
  grid.className = 'grid-bg';
  stage.appendChild(grid);

  // Pencil marks
  const marks = [
    { top: '20%', left: '5%', width: 40, height: 1, rot: -5 },
    { top: '40%', right: '6%', width: 30, height: 1, rot: 8 },
    { bottom: '25%', left: '10%', width: 50, height: 1, rot: -2 },
    { bottom: '35%', right: '8%', width: 35, height: 1, rot: 5 },
  ];
  marks.forEach(m => {
    const el = document.createElement('div');
    el.className = 'pencil-mark';
    el.style.width = m.width + 'px';
    el.style.height = m.height + 'px';
    el.style.transform = `rotate(${m.rot}deg)`;
    if (m.top) el.style.top = m.top;
    if (m.bottom) el.style.bottom = m.bottom;
    if (m.left) el.style.left = m.left;
    if (m.right) el.style.right = m.right;
    stage.appendChild(el);
  });

  // Annotations
  const annotations = [
    { top: '5%', left: '5%', text: 'draft 03' },
    { bottom: '5%', right: '5%', text: 'rev. final' },
  ];
  annotations.forEach(a => {
    const el = document.createElement('div');
    el.className = 'annotation';
    el.textContent = a.text;
    if (a.top) el.style.top = a.top;
    if (a.bottom) el.style.bottom = a.bottom;
    if (a.left) el.style.left = a.left;
    if (a.right) el.style.right = a.right;
    stage.appendChild(el);
  });
}

function createWordElements() {
  const elements = [];
  const count = CONFIG.words.length;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const totalHeight = vh * 0.68;
  const baseTop = vh * 0.16;

  for (let i = 0; i < count; i++) {
    const rng = seededRandom(i * 137 + 42);
    const el = document.createElement('div');
    el.className = 'word-block ' + wordStyles[i % wordStyles.length];

    const preset = fontPresets[i % fontPresets.length];
    const fontSize = Math.min(fontSizes[i % fontSizes.length], vw * 0.28, vh * 0.12);

    el.style.fontFamily = preset.family;
    el.style.fontWeight = preset.weight;
    el.style.fontStyle = preset.style;
    el.style.textTransform = preset.transform;
    el.style.letterSpacing = preset.letterSpacing;
    el.style.fontSize = fontSize + 'px';
    el.style.color = CONFIG.colors[i % CONFIG.colors.length];

    const inner = document.createElement('span');
    inner.className = 'word-inner';
    inner.appendChild(document.createTextNode(CONFIG.words[i]));
    el.appendChild(inner);

    const stackPos = baseTop + (totalHeight / count) * i * (1 - CONFIG.overlapAmount);
    const xOffset = (rng() - 0.5) * vw * 0.2;
    const xCenter = vw / 2 - fontSize * CONFIG.words[i].length * 0.28 + xOffset;

    el.style.left = Math.max(10, Math.min(vw * 0.85 - fontSize * 2, xCenter)) + 'px';
    el.style.top = stackPos + 'px';

    const rotation = (rng() - 0.5) * 2 * CONFIG.maxRotation;
    const finalOpacity = 0.9 + rng() * 0.1;

    const slideDir = i % 2 === 0 ? -1 : 1;
    el.style.setProperty('--slide-start', `translate(${slideDir * 100}px, 0) rotate(${rotation + slideDir * 3}deg)`);
    el.style.setProperty('--slide-mid', `translate(${slideDir * -5}px, 0) rotate(${rotation - slideDir}deg)`);
    el.style.setProperty('--slide-end', `translate(0, 0) rotate(${rotation}deg)`);
    el.style.setProperty('--final-opacity', String(finalOpacity));

    el.style.setProperty('--lift-mid', `translate(0, -15px) rotate(${rotation + 2}deg) scale(1.03)`);
    el.style.setProperty('--lift-end', `translate(0, -80px) rotate(${rotation + 5}deg) scale(1.08)`);

    el.dataset.index = String(i);
    stage.appendChild(el);
    elements.push(el);
  }
  return elements;
}

function runAnimation(wordElements) {
  const count = wordElements.length;
  const slideStagger = 350;
  const slideDuration = 450;
  const holdDuration = 2200;
  const liftStagger = 250;
  const liftDuration = 550;
  const pauseBeforeLoop = 800;

  const totalSlideTime = (count - 1) * slideStagger + slideDuration;
  const totalLiftTime = (count - 1) * liftStagger + liftDuration;

  let animationFrame, startTime;

  function resetAll() {
    wordElements.forEach(el => { el.style.animation = 'none'; el.style.opacity = '0'; });
  }

  function tick(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;

    if (elapsed < totalSlideTime) {
      wordElements.forEach((el, i) => {
        const wordStart = i * slideStagger;
        if (elapsed >= wordStart && !el.dataset.stamped) {
          el.dataset.stamped = '1';
          el.style.animation = `slidePlace ${slideDuration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
        }
      });
    } else if (elapsed < totalSlideTime + holdDuration) {
    } else if (elapsed < totalSlideTime + holdDuration + totalLiftTime) {
      const liftElapsed = elapsed - totalSlideTime - holdDuration;
      wordElements.forEach((el, i) => {
        const reverseI = count - 1 - i;
        const wordStart = reverseI * liftStagger;
        if (liftElapsed >= wordStart && !el.dataset.peeled) {
          el.dataset.peeled = '1';
          el.style.animation = `liftAway ${liftDuration}ms ease-in forwards`;
        }
      });
    } else if (elapsed < totalSlideTime + holdDuration + totalLiftTime + pauseBeforeLoop) {
    } else {
      resetAll();
      wordElements.forEach(el => { delete el.dataset.stamped; delete el.dataset.peeled; });
      startTime = timestamp;
    }
    animationFrame = requestAnimationFrame(tick);
  }

  resetAll();
  animationFrame = requestAnimationFrame(tick);
  return function stop() { cancelAnimationFrame(animationFrame); };
}

createDecorations();
const wordEls = createWordElements();
runAnimation(wordEls);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    stage.innerHTML = '';
    createDecorations();
    const nw = createWordElements();
    runAnimation(nw);
  }, 300);
});
</script>
</body>
</html>

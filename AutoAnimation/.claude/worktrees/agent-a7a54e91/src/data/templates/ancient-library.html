<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancient Library</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgColor: '#1a0f08',
  glowColor: '#ffaa33',
  candleColor: '#ff8800',
  runeColor: '#8866ff',
  dustCount: 50,
  cycleDuration: 15000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let startTime = performance.now();

// Scene objects
let dustMotes = [];
let floatingBooks = [];
let candles = [];
let runes = [];
let lightBeams = [];
let magicParticles = [];
let scrolls = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initScene();
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function initScene() {
  dustMotes = [];
  floatingBooks = [];
  candles = [];
  runes = [];
  lightBeams = [];
  magicParticles = [];
  scrolls = [];

  // Dust motes
  for (let i = 0; i < CONFIG.dustCount; i++) {
    dustMotes.push(createDust());
  }

  // Floating books
  for (let i = 0; i < 6; i++) {
    floatingBooks.push({
      x: W * (0.2 + Math.random() * 0.6),
      y: H * (0.15 + Math.random() * 0.5),
      w: W * (0.03 + Math.random() * 0.025),
      h: W * (0.04 + Math.random() * 0.02),
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.008,
      bobPhase: Math.random() * Math.PI * 2,
      bobSpeed: 0.001 + Math.random() * 0.001,
      bobAmp: H * (0.01 + Math.random() * 0.015),
      openAngle: 0,
      openSpeed: 0.003 + Math.random() * 0.003,
      openPhase: Math.random() * Math.PI * 2,
      color: ['#8B4513', '#654321', '#3e2723', '#5d4037', '#4e342e'][Math.floor(Math.random() * 5)],
      pageColor: '#f5e6c8'
    });
  }

  // Candles
  const candlePositions = [
    { x: W * 0.08, y: H * 0.35 },
    { x: W * 0.92, y: H * 0.30 },
    { x: W * 0.15, y: H * 0.60 },
    { x: W * 0.85, y: H * 0.55 },
    { x: W * 0.5, y: H * 0.75 },
    { x: W * 0.35, y: H * 0.25 },
    { x: W * 0.65, y: H * 0.20 },
  ];
  for (const pos of candlePositions) {
    candles.push({
      x: pos.x,
      y: pos.y,
      size: W * (0.004 + Math.random() * 0.003),
      flickerPhase: Math.random() * Math.PI * 2,
      flickerSpeed: 3 + Math.random() * 5,
      glowRadius: W * (0.05 + Math.random() * 0.04)
    });
  }

  // Runes on walls
  const runeSymbols = ['\u16A0', '\u16A2', '\u16A6', '\u16A8', '\u16B1', '\u16B7', '\u16C1', '\u16C7', '\u16D2', '\u16D6', '\u16DA', '\u16DE'];
  for (let i = 0; i < 12; i++) {
    const side = Math.random() > 0.5;
    runes.push({
      x: side ? W * (0.02 + Math.random() * 0.12) : W * (0.86 + Math.random() * 0.12),
      y: H * (0.1 + Math.random() * 0.7),
      symbol: runeSymbols[Math.floor(Math.random() * runeSymbols.length)],
      phase: Math.random() * Math.PI * 2,
      speed: 0.0005 + Math.random() * 0.001,
      size: W * (0.015 + Math.random() * 0.012)
    });
  }

  // Light beams
  for (let i = 0; i < 3; i++) {
    lightBeams.push({
      x: W * (0.25 + i * 0.25),
      angle: -0.3 + Math.random() * 0.1,
      width: W * (0.03 + Math.random() * 0.03),
      opacity: 0.06 + Math.random() * 0.04,
      drift: Math.random() * Math.PI * 2
    });
  }

  // Magic particles around central orb
  for (let i = 0; i < 40; i++) {
    magicParticles.push(createMagicParticle());
  }

  // Scrolls
  for (let i = 0; i < 3; i++) {
    scrolls.push({
      x: W * (0.3 + Math.random() * 0.4),
      y: H * (0.3 + Math.random() * 0.3),
      phase: Math.random() * Math.PI * 2,
      speed: 0.0008 + Math.random() * 0.0005,
      unfurlProgress: 0,
      width: W * 0.04,
      height: H * 0.06
    });
  }
}

function createDust() {
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * W * 0.0002,
    vy: (Math.random() - 0.5) * H * 0.0001 - H * 0.00005,
    size: 0.5 + Math.random() * 2,
    opacity: 0.1 + Math.random() * 0.4,
    phase: Math.random() * Math.PI * 2
  };
}

function createMagicParticle() {
  const angle = Math.random() * Math.PI * 2;
  const dist = W * (0.02 + Math.random() * 0.12);
  return {
    angle,
    dist,
    baseX: W * 0.5,
    baseY: H * 0.45,
    speed: 0.002 + Math.random() * 0.004,
    ySpeed: (Math.random() - 0.5) * 0.3,
    size: 1 + Math.random() * 2.5,
    opacity: 0.3 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2
  };
}

function drawBookshelf(x, y, w, h, side) {
  // Shelf frame
  const frameGrad = ctx.createLinearGradient(x, y, x + w, y);
  frameGrad.addColorStop(0, '#2a1a0e');
  frameGrad.addColorStop(0.5, '#3d2517');
  frameGrad.addColorStop(1, '#2a1a0e');
  ctx.fillStyle = frameGrad;
  ctx.fillRect(x, y, w, h);

  // Shelf border
  ctx.strokeStyle = '#1a0e06';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // Shelves and books
  const shelfCount = 6;
  const shelfH = h / shelfCount;
  const bookColors = ['#8B0000', '#006400', '#00008B', '#8B4513', '#4B0082', '#800000', '#2F4F4F', '#8B6914', '#5C3317', '#2E0854'];

  for (let s = 0; s < shelfCount; s++) {
    const sy = y + s * shelfH;

    // Shelf plank
    ctx.fillStyle = '#3d2517';
    ctx.fillRect(x + 2, sy + shelfH - 3, w - 4, 3);
    ctx.fillStyle = '#4a2e1a';
    ctx.fillRect(x + 2, sy + shelfH - 4, w - 4, 1);

    // Books
    let bx = x + 3;
    while (bx < x + w - 6) {
      const bw = W * (0.005 + Math.random() * 0.006);
      const bh = shelfH * (0.6 + Math.random() * 0.3);
      const by = sy + shelfH - 3 - bh;

      if (bx + bw > x + w - 3) break;

      const color = bookColors[Math.floor(Math.random() * bookColors.length)];
      ctx.fillStyle = color;
      ctx.fillRect(bx, by, bw, bh);

      // Book spine detail
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(bx + 1, by + bh * 0.2, bw - 2, 1);
      ctx.fillRect(bx + 1, by + bh * 0.7, bw - 2, 1);

      // Shadow on left edge
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(bx, by, 1, bh);

      bx += bw + (Math.random() > 0.8 ? W * 0.003 : 1);
    }
  }
}

function draw(now) {
  const elapsed = (now - startTime) % CONFIG.cycleDuration;
  const cycleT = elapsed / CONFIG.cycleDuration;
  const bgRgb = hexToRgb(CONFIG.bgColor);

  // Background
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, W * 0.8);
  bgGrad.addColorStop(0, `rgb(${bgRgb.r + 15}, ${bgRgb.g + 10}, ${bgRgb.b + 5})`);
  bgGrad.addColorStop(0.5, `rgb(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b})`);
  bgGrad.addColorStop(1, `rgb(${Math.max(bgRgb.r - 10, 0)}, ${Math.max(bgRgb.g - 8, 0)}, ${Math.max(bgRgb.b - 5, 0)})`);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Stone wall texture (subtle)
  ctx.fillStyle = 'rgba(40, 25, 15, 0.15)';
  for (let row = 0; row < H; row += H * 0.06) {
    const offset = (Math.floor(row / (H * 0.06)) % 2) * W * 0.04;
    for (let col = -W * 0.04; col < W; col += W * 0.08) {
      ctx.strokeStyle = 'rgba(20, 12, 5, 0.15)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(col + offset, row, W * 0.08, H * 0.06);
    }
  }

  // Floor
  const floorY = H * 0.82;
  const floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
  floorGrad.addColorStop(0, '#1a0e06');
  floorGrad.addColorStop(0.3, '#150c05');
  floorGrad.addColorStop(1, '#0d0803');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, floorY, W, H - floorY);

  // Floor tiles
  ctx.strokeStyle = 'rgba(40, 25, 15, 0.2)';
  ctx.lineWidth = 0.5;
  for (let tx = 0; tx < W; tx += W * 0.06) {
    ctx.beginPath();
    ctx.moveTo(tx, floorY);
    ctx.lineTo(tx, H);
    ctx.stroke();
  }

  // Light beams
  for (const beam of lightBeams) {
    const drift = Math.sin(now * 0.0003 + beam.drift) * W * 0.02;
    const bx = beam.x + drift;
    ctx.save();
    ctx.translate(bx, 0);
    ctx.rotate(beam.angle);
    const beamGrad = ctx.createLinearGradient(0, 0, 0, H * 1.2);
    beamGrad.addColorStop(0, `rgba(255, 200, 100, 0)`);
    beamGrad.addColorStop(0.2, `rgba(255, 200, 100, ${beam.opacity})`);
    beamGrad.addColorStop(0.7, `rgba(255, 180, 80, ${beam.opacity * 0.5})`);
    beamGrad.addColorStop(1, `rgba(255, 180, 80, 0)`);
    ctx.fillStyle = beamGrad;
    ctx.fillRect(-beam.width / 2, 0, beam.width, H * 1.2);
    ctx.restore();
  }

  // Bookshelves
  const shelfW = W * 0.14;
  drawBookshelf(W * 0.01, H * 0.05, shelfW, H * 0.75, 'left');
  drawBookshelf(W * 0.16, H * 0.1, shelfW * 0.8, H * 0.68, 'left');
  drawBookshelf(W * (1 - 0.01 - 0.14), H * 0.05, shelfW, H * 0.75, 'right');
  drawBookshelf(W * (1 - 0.16 - 0.14 * 0.8), H * 0.1, shelfW * 0.8, H * 0.68, 'right');

  // Central mystical orb
  const orbX = W * 0.5;
  const orbY = H * 0.45;
  const orbPulse = 0.8 + Math.sin(now * 0.002) * 0.2;
  const orbRadius = W * 0.025 * orbPulse;
  const glowRgb = hexToRgb(CONFIG.glowColor);

  // Orb outer glow
  for (let i = 5; i >= 0; i--) {
    const r = orbRadius * (1 + i * 1.5);
    const alpha = 0.03 * (1 - i / 5) * orbPulse;
    const orbGlow = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, r);
    orbGlow.addColorStop(0, `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, ${alpha})`);
    orbGlow.addColorStop(1, `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, 0)`);
    ctx.fillStyle = orbGlow;
    ctx.beginPath();
    ctx.arc(orbX, orbY, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Orb core
  const coreGrad = ctx.createRadialGradient(orbX - orbRadius * 0.3, orbY - orbRadius * 0.3, 0, orbX, orbY, orbRadius);
  coreGrad.addColorStop(0, '#fff8e0');
  coreGrad.addColorStop(0.3, CONFIG.glowColor);
  coreGrad.addColorStop(0.7, `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, 0.8)`);
  coreGrad.addColorStop(1, `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, 0.2)`);
  ctx.save();
  ctx.shadowColor = CONFIG.glowColor;
  ctx.shadowBlur = 30 * orbPulse;
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(orbX, orbY, orbRadius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Pedestal under orb
  ctx.fillStyle = '#2a1a0e';
  ctx.beginPath();
  ctx.moveTo(orbX - W * 0.035, floorY);
  ctx.lineTo(orbX + W * 0.035, floorY);
  ctx.lineTo(orbX + W * 0.02, orbY + H * 0.15);
  ctx.lineTo(orbX - W * 0.02, orbY + H * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#3d2517';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Magic particles
  const runeRgb = hexToRgb(CONFIG.runeColor);
  for (const p of magicParticles) {
    p.angle += p.speed;
    p.phase += 0.02;
    const wobble = Math.sin(p.phase) * W * 0.01;
    const px = p.baseX + Math.cos(p.angle) * (p.dist + wobble);
    const py = p.baseY + Math.sin(p.angle * p.ySpeed) * p.dist * 0.4 + Math.sin(p.phase * 0.7) * H * 0.02;
    const alpha = p.opacity * (0.5 + Math.sin(p.phase * 1.5) * 0.5);

    ctx.save();
    ctx.shadowColor = CONFIG.glowColor;
    ctx.shadowBlur = 8;
    ctx.fillStyle = `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Floating books
  for (const book of floatingBooks) {
    book.angle += book.rotSpeed;
    const bobY = Math.sin(now * book.bobSpeed + book.bobPhase) * book.bobAmp;
    const openAmount = Math.abs(Math.sin(now * book.openSpeed + book.openPhase));
    const bx = book.x;
    const by = book.y + bobY;

    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(book.angle * 0.3);

    // Book shadow/glow
    ctx.shadowColor = CONFIG.glowColor;
    ctx.shadowBlur = 5 + openAmount * 10;

    // Left page
    ctx.save();
    ctx.rotate(-openAmount * 0.4);
    ctx.fillStyle = book.color;
    ctx.fillRect(-book.w, -book.h / 2, book.w, book.h);
    ctx.fillStyle = book.pageColor;
    ctx.fillRect(-book.w + 2, -book.h / 2 + 2, book.w - 4, book.h - 4);
    // Text lines
    ctx.fillStyle = 'rgba(80, 50, 20, 0.3)';
    for (let l = 0; l < 5; l++) {
      ctx.fillRect(-book.w + 5, -book.h / 2 + 6 + l * (book.h / 7), book.w * (0.5 + Math.random() * 0.3), 1);
    }
    ctx.restore();

    // Right page
    ctx.save();
    ctx.rotate(openAmount * 0.4);
    ctx.fillStyle = book.color;
    ctx.fillRect(0, -book.h / 2, book.w, book.h);
    ctx.fillStyle = book.pageColor;
    ctx.fillRect(2, -book.h / 2 + 2, book.w - 4, book.h - 4);
    ctx.fillStyle = 'rgba(80, 50, 20, 0.3)';
    for (let l = 0; l < 5; l++) {
      ctx.fillRect(5, -book.h / 2 + 6 + l * (book.h / 7), book.w * (0.5 + Math.random() * 0.3), 1);
    }
    ctx.restore();

    // Glowing page emission when open
    if (openAmount > 0.5) {
      const pageGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, book.w * 2);
      pageGlow.addColorStop(0, `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, ${(openAmount - 0.5) * 0.15})`);
      pageGlow.addColorStop(1, `rgba(${glowRgb.r}, ${glowRgb.g}, ${glowRgb.b}, 0)`);
      ctx.fillStyle = pageGlow;
      ctx.beginPath();
      ctx.arc(0, 0, book.w * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // Candles
  const candleRgb = hexToRgb(CONFIG.candleColor);
  for (const c of candles) {
    const flicker = Math.sin(now * 0.01 * c.flickerSpeed + c.flickerPhase) * 0.3 +
                    Math.sin(now * 0.023 * c.flickerSpeed + c.flickerPhase * 1.7) * 0.15;
    const intensity = 0.7 + flicker;
    const flameSize = c.size * (1 + flicker * 0.3);

    // Candle glow
    const glow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.glowRadius * intensity);
    glow.addColorStop(0, `rgba(${candleRgb.r}, ${candleRgb.g}, ${candleRgb.b}, ${0.12 * intensity})`);
    glow.addColorStop(0.4, `rgba(${candleRgb.r}, ${candleRgb.g * 0.7}, ${0}, ${0.05 * intensity})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.glowRadius * intensity, 0, Math.PI * 2);
    ctx.fill();

    // Candle body
    ctx.fillStyle = '#d4c5a0';
    ctx.fillRect(c.x - c.size * 0.5, c.y, c.size, c.size * 4);

    // Flame
    ctx.save();
    ctx.translate(c.x, c.y);
    const flameGrad = ctx.createRadialGradient(0, -flameSize, flameSize * 0.3, 0, -flameSize * 0.5, flameSize * 1.2);
    flameGrad.addColorStop(0, '#fffde0');
    flameGrad.addColorStop(0.3, `rgba(${candleRgb.r}, ${candleRgb.g}, 0, 0.9)`);
    flameGrad.addColorStop(0.7, `rgba(${candleRgb.r}, ${Math.floor(candleRgb.g * 0.5)}, 0, 0.5)`);
    flameGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.ellipse(flicker * 2, -flameSize, flameSize * 0.6, flameSize * 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Runes on walls
  for (const rune of runes) {
    const alpha = Math.max(0, Math.sin(now * rune.speed + rune.phase)) * 0.6;
    if (alpha > 0.05) {
      ctx.save();
      ctx.font = `${rune.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = CONFIG.runeColor;
      ctx.shadowBlur = 15 * alpha;
      ctx.fillStyle = `rgba(${runeRgb.r}, ${runeRgb.g}, ${runeRgb.b}, ${alpha})`;
      ctx.fillText(rune.symbol, rune.x, rune.y);
      // Double draw for stronger glow
      ctx.fillText(rune.symbol, rune.x, rune.y);
      ctx.restore();
    }
  }

  // Scrolls unfurling
  for (const scroll of scrolls) {
    scroll.unfurlProgress = (Math.sin(now * scroll.speed + scroll.phase) + 1) / 2;
    const sx = scroll.x;
    const sy = scroll.y + Math.sin(now * 0.001 + scroll.phase) * H * 0.01;
    const unfurl = scroll.unfurlProgress;

    ctx.save();
    ctx.translate(sx, sy);

    // Scroll paper
    const scrollH = scroll.height * unfurl;
    if (scrollH > 2) {
      ctx.fillStyle = '#e8d5a8';
      ctx.fillRect(-scroll.width / 2, 0, scroll.width, scrollH);
      ctx.strokeStyle = '#b8a070';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(-scroll.width / 2, 0, scroll.width, scrollH);

      // Text lines on scroll
      ctx.fillStyle = 'rgba(80, 50, 20, 0.25)';
      const lineCount = Math.floor(unfurl * 5);
      for (let l = 0; l < lineCount; l++) {
        const lw = scroll.width * (0.5 + Math.random() * 0.3);
        ctx.fillRect(-lw / 2, 5 + l * (scrollH / 6), lw, 1);
      }
    }

    // Top roll
    ctx.fillStyle = '#c4a870';
    ctx.beginPath();
    ctx.ellipse(0, 0, scroll.width / 2 + 2, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#9a8050';
    ctx.stroke();

    // Bottom roll
    if (scrollH > 5) {
      ctx.fillStyle = '#c4a870';
      ctx.beginPath();
      ctx.ellipse(0, scrollH, scroll.width / 2 + 2, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  // Dust motes in light beams
  for (const d of dustMotes) {
    d.x += d.vx + Math.sin(now * 0.0008 + d.phase) * W * 0.0001;
    d.y += d.vy;
    d.phase += 0.01;

    // Wrap around
    if (d.x < 0) d.x = W;
    if (d.x > W) d.x = 0;
    if (d.y < 0) d.y = H;
    if (d.y > H) d.y = 0;

    // Check if in a light beam for brightness boost
    let inBeam = false;
    for (const beam of lightBeams) {
      const drift = Math.sin(now * 0.0003 + beam.drift) * W * 0.02;
      if (Math.abs(d.x - (beam.x + drift)) < beam.width) {
        inBeam = true;
        break;
      }
    }

    const alpha = d.opacity * (inBeam ? 2.5 : 1);
    const color = inBeam ? `rgba(255, 220, 150, ${Math.min(alpha, 0.8)})` : `rgba(200, 180, 140, ${alpha})`;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size * (inBeam ? 1.5 : 1), 0, Math.PI * 2);
    ctx.fill();
  }

  // Overall warm vignette
  const vigGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, W * 0.15, W * 0.5, H * 0.5, W * 0.75);
  vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vigGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.15)');
  vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  // Cycle reset
  if (elapsed >= CONFIG.cycleDuration - 50) {
    startTime = now;
  }

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
window.addEventListener('message', (e) => {
  if (e.data && typeof e.data === 'object') {
    Object.assign(CONFIG, e.data);
    initScene();
  }
});
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>

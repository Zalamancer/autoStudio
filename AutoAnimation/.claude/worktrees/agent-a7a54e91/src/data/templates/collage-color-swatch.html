<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color Swatch Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #f5f5f5; font-family: 'Courier New', monospace; }
  #stage { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 12px; padding: 30px; }

  .swatch { width: 160px; opacity: 0; transform: translateY(20px); will-change: transform, opacity; }
  .swatch-color { width: 100%; height: 120px; border-radius: 6px 6px 0 0; }
  .swatch-info { background: #fff; padding: 10px 12px; border-radius: 0 0 6px 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .swatch-name { font-size: 13px; font-weight: 700; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .swatch-hex { font-size: 11px; color: #888; letter-spacing: 1px; }

  @keyframes swatchIn { 0% { opacity: 0; transform: translateY(30px) scale(0.9); } 60% { transform: translateY(-4px) scale(1.02); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes swatchOut { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-20px) scale(0.9); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  swatches: [
    { name: 'Coral Reef', hex: '#FF6F61', color: '#FF6F61' },
    { name: 'Ocean Deep', hex: '#1B4965', color: '#1B4965' },
    { name: 'Sage Mist', hex: '#87A96B', color: '#87A96B' },
    { name: 'Sunflower', hex: '#FFDA03', color: '#FFDA03' },
    { name: 'Dusty Rose', hex: '#DCAE96', color: '#DCAE96' },
    { name: 'Midnight', hex: '#191970', color: '#191970' },
    { name: 'Terracotta', hex: '#CC5A3B', color: '#CC5A3B' },
    { name: 'Eucalyptus', hex: '#44715B', color: '#44715B' },
    { name: 'Lavender', hex: '#B57EDC', color: '#B57EDC' },
    { name: 'Honey', hex: '#EB9E34', color: '#EB9E34' },
  ],
  bgColor: '#f5f5f5',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function build() {
  stage.innerHTML = '';
  const els = [];
  CONFIG.swatches.forEach((sw, i) => {
    const el = document.createElement('div'); el.className = 'swatch';
    const color = document.createElement('div'); color.className = 'swatch-color'; color.style.background = sw.color;
    const info = document.createElement('div'); info.className = 'swatch-info';
    const name = document.createElement('div'); name.className = 'swatch-name'; name.textContent = sw.name;
    const hex = document.createElement('div'); hex.className = 'swatch-hex'; hex.textContent = sw.hex;
    info.appendChild(name); info.appendChild(hex);
    el.appendChild(color); el.appendChild(info);
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=200, inD=450, hold=3500, outS=150, outD=350, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset() { els.forEach(e=>{e.style.animation='none';e.style.opacity='0';}); }
  function tick(ts) {
    if(!st) st=ts; const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`swatchIn ${inD}ms cubic-bezier(0.22,0.68,0.36,1) forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`swatchOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset(); af=requestAnimationFrame(tick);
}

let els = build(); runAnimation(els);
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

openapi: '3.0.3'
info:
  title: ProAnimate API
  description: |
    Production REST API for ProAnimate — the AI animation studio.
    Generate animated videos programmatically, manage projects, voices, characters, and templates.
  version: '1.0.0'
  contact:
    name: ProAnimate Support
    url: https://proanimate.com

servers:
  - url: /api/v1
    description: API v1

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key prefixed with `pak_`
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token (for dashboard endpoints)

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
      required: [error, code]

    RenderJob:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, complete, failed, cancelled]
        prompt:
          type: string
        resultUrl:
          type: string
          nullable: true
        resultFormat:
          type: string
          nullable: true
        creditsCost:
          type: integer
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    Voice:
      type: object
      properties:
        voiceId:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        previewUrl:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        aspectRatio:
          type: string
        fps:
          type: integer
        width:
          type: integer
        height:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /renders:
    post:
      summary: Submit a render job
      operationId: createRender
      tags: [Renders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  maxLength: 10000
                settings:
                  type: object
                  properties:
                    aspectRatio:
                      type: string
                      default: '9:16'
                    durationSeconds:
                      type: number
                    fps:
                      type: integer
                      default: 30
                    format:
                      type: string
                      enum: [mp4, webm]
      responses:
        '201':
          description: Job submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                  estimatedSeconds:
                    type: integer
        '400':
          description: Validation error
        '401':
          description: Invalid API key
        '429':
          description: Rate limit exceeded

  /renders/{jobId}:
    get:
      summary: Get render job status
      operationId: getRenderStatus
      tags: [Renders]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
        '404':
          description: Job not found

    delete:
      summary: Cancel a render job
      operationId: cancelRender
      tags: [Renders]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job cancelled

  /renders/{jobId}/download:
    get:
      summary: Download render result
      operationId: downloadRender
      tags: [Renders]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to signed download URL
        '400':
          description: Job not ready

  /voices:
    get:
      summary: List available voices
      operationId: listVoices
      tags: [Voices]
      responses:
        '200':
          description: Voice list
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Voice'

  /characters:
    get:
      summary: List saved characters
      operationId: listCharacters
      tags: [Characters]
      responses:
        '200':
          description: Character list

  /templates:
    get:
      summary: List HTML templates
      operationId: listTemplates
      tags: [Templates]
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Template list

  /projects:
    get:
      summary: List projects
      operationId: listProjects
      tags: [Projects]
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  total:
                    type: integer

    post:
      summary: Create a project
      operationId: createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                aspectRatio:
                  type: string
                fps:
                  type: integer
                width:
                  type: integer
                height:
                  type: integer
      responses:
        '201':
          description: Project created

  /projects/{id}:
    get:
      summary: Get project detail
      operationId: getProject
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project detail

    patch:
      summary: Update a project
      operationId: updateProject
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project updated

    delete:
      summary: Delete a project
      operationId: deleteProject
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted

  /translate:
    post:
      summary: Submit a translation job
      operationId: createTranslation
      tags: [Translation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, targetLanguage]
              properties:
                projectId:
                  type: string
                targetLanguage:
                  type: string
      responses:
        '201':
          description: Translation job submitted

  /api-keys:
    get:
      summary: List API keys
      operationId: listApiKeys
      tags: [API Keys]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: API key list

    post:
      summary: Create API key
      operationId: createApiKey
      tags: [API Keys]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                tier:
                  type: string
                  enum: [standard, premium, enterprise]
      responses:
        '201':
          description: API key created (full key shown once)

  /webhooks:
    get:
      summary: List webhooks
      operationId: listWebhooks
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook list

    post:
      summary: Register webhook
      operationId: createWebhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook registered (secret shown once)

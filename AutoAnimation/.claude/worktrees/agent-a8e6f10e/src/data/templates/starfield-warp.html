<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfield Warp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .center-text { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #E0E8FF; pointer-events: none; }
  .center-text h1 { font-size: 56px; font-weight: 100; letter-spacing: 16px; text-transform: uppercase;
    text-shadow: 0 0 40px rgba(100,150,255,0.4); animation: warpPulse 4s ease-in-out infinite; }
  .center-text .subtitle { font-size: 12px; letter-spacing: 10px; opacity: 0.3; margin-top: 14px; text-transform: uppercase; }
  @keyframes warpPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="center-text">
  <h1 id="titleEl">WARP</h1>
  <div class="subtitle" id="subEl">Light Speed</div>
</div>
<script>
const CONFIG = {
  titleText: 'WARP',
  subtitleText: 'Light Speed',
  bgColor: '#000005',
  starCount: 600,
  warpSpeed: 0.02,
  starColor: '#AABBFF',
  trailLength: 0.4,
  centerGlow: '#1a1a4a',
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});
function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
addEventListener('resize', resize);

const stars = [];
function initStars() {
  stars.length = 0;
  for (let i = 0; i < CONFIG.starCount; i++) {
    stars.push({
      x: (Math.random() - 0.5) * 2000,
      y: (Math.random() - 0.5) * 2000,
      z: Math.random() * 1000 + 1,
    });
  }
}
initStars();

function drawCenterGlow() {
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.3);
  grad.addColorStop(0, CONFIG.centerGlow);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  ctx.fillStyle = `rgba(0,0,5,${1 - CONFIG.trailLength})`;
  ctx.fillRect(0, 0, W, H);
  drawCenterGlow();

  const sc = [
    parseInt(CONFIG.starColor.slice(1,3),16),
    parseInt(CONFIG.starColor.slice(3,5),16),
    parseInt(CONFIG.starColor.slice(5,7),16)
  ];

  stars.forEach(star => {
    const k = 300 / star.z;
    const sx = star.x * k + cx;
    const sy = star.y * k + cy;
    const pz = star.z + CONFIG.warpSpeed * 800;
    const pk = 300 / pz;
    const px = star.x * pk + cx;
    const py = star.y * pk + cy;
    const size = Math.max(0.5, (1 - star.z / 1000) * 3);
    const a = Math.max(0, Math.min(1, (1 - star.z / 1000)));

    if (a > 0.05) {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = `rgba(${sc[0]},${sc[1]},${sc[2]},${a * 0.6})`;
      ctx.lineWidth = size * 0.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${Math.min(sc[0]+80,255)},${Math.min(sc[1]+80,255)},${Math.min(sc[2]+80,255)},${a})`;
      ctx.fill();

      if (size > 1.5) {
        ctx.beginPath();
        ctx.arc(sx, sy, size * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${sc[0]},${sc[1]},${sc[2]},${a * 0.1})`;
        ctx.fill();
      }
    }

    star.z -= CONFIG.warpSpeed * star.z;
    if (star.z < 1 || sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) {
      star.x = (Math.random() - 0.5) * 2000;
      star.y = (Math.random() - 0.5) * 2000;
      star.z = 800 + Math.random() * 200;
    }
  });

  const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, 8);
  bloom.addColorStop(0, 'rgba(200,210,255,0.06)');
  bloom.addColorStop(1, 'transparent');
  ctx.fillStyle = bloom;
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Roster Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #111827; font-family: 'Arial', sans-serif; }
  #stage { position: absolute; inset: 0; z-index: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 16px; padding: 30px; }

  .member { width: 165px; opacity: 0; will-change: transform, opacity; }
  .member-card { background: #1f2937; border-radius: 12px; overflow: hidden; border: 1px solid #374151; }
  .member-avatar { width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; position: relative; }
  .avatar-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; }
  .member-status { position: absolute; bottom: 8px; right: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #1f2937; }
  .member-info { padding: 12px 14px; }
  .member-name { font-size: 14px; font-weight: 700; color: #f9fafb; margin-bottom: 2px; }
  .member-role { font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .member-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .member-tag { font-size: 9px; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.06); color: #d1d5db; }

  @keyframes rosterIn { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 60% { transform: translateY(-2px) scale(1.01); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes rosterOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.85) translateY(20px); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  members: [
    { color: '#6366f1', initials: 'AK', name: 'Alex Kim', role: 'Lead Designer', status: '#22c55e', tags: ['UI/UX', 'Figma'] },
    { color: '#ec4899', initials: 'SP', name: 'Sara Park', role: 'Frontend Dev', status: '#22c55e', tags: ['React', 'TS'] },
    { color: '#f59e0b', initials: 'MJ', name: 'Mike Jones', role: 'Backend Dev', status: '#ef4444', tags: ['Node', 'Go'] },
    { color: '#10b981', initials: 'LW', name: 'Lisa Wong', role: 'PM', status: '#22c55e', tags: ['Agile', 'Scrum'] },
    { color: '#8b5cf6', initials: 'DT', name: 'Dan Torres', role: 'DevOps', status: '#f59e0b', tags: ['AWS', 'K8s'] },
    { color: '#06b6d4', initials: 'RN', name: 'Rina Nakamura', role: 'Data Scientist', status: '#22c55e', tags: ['Python', 'ML'] },
    { color: '#f43f5e', initials: 'CB', name: 'Chris Brown', role: 'QA Engineer', status: '#22c55e', tags: ['Testing', 'CI'] },
    { color: '#84cc16', initials: 'EG', name: 'Emma Garcia', role: 'Product Design', status: '#f59e0b', tags: ['Research', 'Proto'] },
  ],
  bgColor: '#111827',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function build() {
  stage.innerHTML = '';
  const els = [];
  CONFIG.members.forEach(m => {
    const el = document.createElement('div'); el.className = 'member';
    const card = document.createElement('div'); card.className = 'member-card';
    const avatar = document.createElement('div'); avatar.className = 'member-avatar'; avatar.style.background = m.color;
    const circle = document.createElement('div'); circle.className = 'avatar-circle'; circle.textContent = m.initials;
    const status = document.createElement('div'); status.className = 'member-status'; status.style.background = m.status;
    avatar.appendChild(circle); avatar.appendChild(status);
    const info = document.createElement('div'); info.className = 'member-info';
    const name = document.createElement('div'); name.className = 'member-name'; name.textContent = m.name;
    const role = document.createElement('div'); role.className = 'member-role'; role.textContent = m.role;
    const tags = document.createElement('div'); tags.className = 'member-tags';
    m.tags.forEach(t => { const tag = document.createElement('div'); tag.className = 'member-tag'; tag.textContent = t; tags.appendChild(tag); });
    info.appendChild(name); info.appendChild(role); info.appendChild(tags);
    card.appendChild(avatar); card.appendChild(info);
    el.appendChild(card); stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=230, inD=420, hold=3500, outS=180, outD=370, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`rosterIn ${inD}ms ease-out forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`rosterOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

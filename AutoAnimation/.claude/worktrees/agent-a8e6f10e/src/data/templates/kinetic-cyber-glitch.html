<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Glitch - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; position: relative; }
  body::after { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.05;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,0,100,0.06) 2px, rgba(255,0,100,0.06) 3px); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; position: relative; }
  .word-block::before, .word-block::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .word-block::before { color: #ff004d; clip-path: inset(0 0 60% 0); transform: translateX(-3px); }
  .word-block::after { color: #00f0ff; clip-path: inset(60% 0 0 0); transform: translateX(3px); }

  @keyframes glitchIn { 0% { opacity: 0; transform: translate(-50%,-50%) translateX(-10px); } 15% { opacity: 1; transform: translate(-50%,-50%) translateX(8px); } 30% { transform: translate(-50%,-50%) translateX(-5px); } 45% { transform: translate(-50%,-50%) translateX(3px); } 60% { transform: translate(-50%,-50%) translateX(-1px); } 100% { opacity: 1; transform: translate(-50%,-50%) translateX(0); } }
  @keyframes glitchOut { 0% { opacity: 1; } 20% { transform: translate(-50%,-50%) translateX(5px); } 40% { transform: translate(-50%,-50%) translateX(-8px); } 60% { opacity: 0.5; } 100% { opacity: 0; transform: translate(-50%,-50%) translateX(15px) skewX(-10deg); } }
  @keyframes glitchShake { 0%,100% { transform: translate(-50%,-50%); } 10% { transform: translate(calc(-50% + 2px),-50%); } 20% { transform: translate(calc(-50% - 1px),calc(-50% + 1px)); } 30% { transform: translate(calc(-50% + 3px),-50%); } 40% { transform: translate(calc(-50% - 2px),calc(-50% - 1px)); } 50% { transform: translate(calc(-50% + 1px),-50%); } 60% { transform: translate(-50%,calc(-50% + 2px)); } 70% { transform: translate(calc(-50% - 1px),-50%); } 80% { transform: translate(calc(-50% + 2px),calc(-50% - 1px)); } 90% { transform: translate(-50%,calc(-50% + 1px)); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['ERR0R','SY5TEM','H4CK3D','BREACH','C0RRUPT','GL1TCH','0VERFL0W','D3BUG'],
  bgColor: '#0a0a0a',
  fontFamily: "'Courier New', monospace",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const cyberColors = ['#ff004d','#00f0ff','#ff00aa','#00ff66','#ff4400','#aa00ff','#00ff99','#ff0066'];

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 83 + 31);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(32 + rng() * 24, cellW * 0.38, cellH * 0.5);
    const color = cyberColors[i % cyberColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.setAttribute('data-text', word);
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-weight:700;color:${color};text-shadow:0 0 8px ${color};letter-spacing:4px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=240, inD=500, hold=3000, outS=180, outD=450, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`glitchIn ${inD}ms steps(6) forwards, glitchShake 0.4s steps(10) infinite ${inD}ms`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`glitchOut ${outD}ms steps(6) forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

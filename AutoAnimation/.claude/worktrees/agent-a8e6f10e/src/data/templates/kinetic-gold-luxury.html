<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gold Luxury - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; font-family: 'Georgia', 'Times New Roman', serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(212,175,55,0.04), transparent 70%); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .gold-line { position: absolute; height: 1px; pointer-events: none; z-index: 3; }
  .sparkle { position: absolute; pointer-events: none; z-index: 3; color: #ffd700; font-size: 10px; }

  @keyframes goldReveal { 0% { opacity: 0; transform: translate(-50%,-50%) translateY(10px); letter-spacing: 20px; } 100% { opacity: 1; transform: translate(-50%,-50%) translateY(0); letter-spacing: var(--ls); } }
  @keyframes goldFade { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) translateY(-10px); letter-spacing: calc(var(--ls) + 10px); } }
  @keyframes goldShine { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
  @keyframes sparkleAnim { 0% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0); } }
  @keyframes lineExtend { 0% { width: 0; opacity: 0; } 100% { width: var(--lw); opacity: 0.3; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['ELEGANCE','PRESTIGE','REFINED','OPULENT','TIMELESS','BESPOKE','SUPREME','GRANDEUR'],
  bgColor: '#0a0a0a',
  fontFamily: "'Georgia', 'Times New Roman', serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function spawnSparkles(x, y) {
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = '✦';
    s.style.cssText = `left:${x+(Math.random()-0.5)*60}px;top:${y+(Math.random()-0.5)*30}px;animation:sparkleAnim ${400+Math.random()*400}ms ease-in-out forwards;animation-delay:${Math.random()*200}ms;`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 89 + 37);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(32 + rng() * 24, cellW * 0.38, cellH * 0.5);
    const ls = 4 + rng() * 6;
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-style:italic;--ls:${ls}px;letter-spacing:${ls}px;background:linear-gradient(90deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#bf953f);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2 });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=350, inD=700, hold=3000, outS=250, outD=500, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`goldReveal ${inD}ms ease-out forwards, goldShine 3s linear infinite ${inD}ms`;spawnSparkles(item.x,item.y);}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`goldFade ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

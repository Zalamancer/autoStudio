<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vintage Film Reel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1208; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<script>
const CONFIG = {
  sepiaIntensity: 0.85,
  grainAmount: 0.12,
  flickerIntensity: 0.15,
  scratchCount: 8,
  scratchSpeed: 3,
  sprocketSpeed: 2,
  sprocketWidth: 48,
  vignetteStrength: 0.7,
  baseColor: '#d4a843',
  darkColor: '#1a1208',
  warmTint: '#c8943a',
  dustParticles: 40,
  burnMarkChance: 0.002,
  frameBorderWidth: 3
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('film');
const ctx = canvas.getContext('2d');
let w, h, time = 0;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const scratches = [];
for (let i = 0; i < 20; i++) {
  scratches.push({
    x: Math.random(),
    speed: 0.5 + Math.random() * 2,
    width: 0.5 + Math.random() * 1.5,
    opacity: 0.1 + Math.random() * 0.4,
    length: 0.3 + Math.random() * 0.7,
    offset: Math.random() * h
  });
}

const dustMotes = [];
for (let i = 0; i < 60; i++) {
  dustMotes.push({
    x: Math.random() * w,
    y: Math.random() * h,
    size: 1 + Math.random() * 3,
    speedX: (Math.random() - 0.5) * 0.5,
    speedY: 0.2 + Math.random() * 0.8,
    opacity: 0.2 + Math.random() * 0.5,
    flicker: Math.random() * Math.PI * 2
  });
}

let burnMark = null;
let burnTimer = 0;

function drawSprockets(side) {
  const sw = CONFIG.sprocketWidth;
  const holeH = sw * 0.55;
  const holeW = sw * 0.35;
  const gap = sw * 1.2;
  const xBase = side === 'left' ? 0 : w - sw;
  const scrollOffset = (time * CONFIG.sprocketSpeed * 60) % gap;

  ctx.fillStyle = '#0d0a04';
  ctx.fillRect(xBase, 0, sw, h);

  ctx.strokeStyle = '#2a1f0a';
  ctx.lineWidth = 1;
  ctx.strokeRect(xBase, 0, sw, h);

  for (let y = -gap + scrollOffset; y < h + gap; y += gap) {
    const cx = xBase + sw / 2;
    const cy = y;
    ctx.fillStyle = '#0a0703';
    ctx.beginPath();
    const r = holeW / 2;
    const rr = 3;
    ctx.roundRect(cx - holeW / 2, cy - holeH / 2, holeW, holeH, rr);
    ctx.fill();
    ctx.strokeStyle = '#3d2e10';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  ctx.fillStyle = '#1a1208';
  ctx.fillRect(xBase + (side === 'left' ? sw - CONFIG.frameBorderWidth : 0), 0, CONFIG.frameBorderWidth, h);
}

function drawGrain() {
  if (!w || !h) return;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const amount = CONFIG.grainAmount * 255;
  for (let i = 0; i < data.length; i += 16) {
    const noise = (Math.random() - 0.5) * amount;
    data[i] += noise;
    data[i + 1] += noise;
    data[i + 2] += noise;
  }
  ctx.putImageData(imageData, 0, 0);
}

function drawVignette() {
  const gradient = ctx.createRadialGradient(w / 2, h / 2, w * 0.2, w / 2, h / 2, w * 0.75);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(0.6, `rgba(0,0,0,${CONFIG.vignetteStrength * 0.3})`);
  gradient.addColorStop(1, `rgba(0,0,0,${CONFIG.vignetteStrength})`);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
}

function drawScratches() {
  const count = Math.min(CONFIG.scratchCount, scratches.length);
  for (let i = 0; i < count; i++) {
    const s = scratches[i];
    s.offset -= s.speed * CONFIG.scratchSpeed;
    if (s.offset < -h) {
      s.offset = h;
      s.x = Math.random();
    }
    if (Math.random() > 0.3) continue;
    const sx = CONFIG.sprocketWidth + s.x * (w - CONFIG.sprocketWidth * 2);
    ctx.strokeStyle = `rgba(255, 245, 220, ${s.opacity})`;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    ctx.moveTo(sx + (Math.random() - 0.5) * 2, s.offset);
    ctx.lineTo(sx + (Math.random() - 0.5) * 4, s.offset + h * s.length);
    ctx.stroke();
  }
}

function drawDust() {
  const count = Math.min(CONFIG.dustParticles, dustMotes.length);
  for (let i = 0; i < count; i++) {
    const d = dustMotes[i];
    d.x += d.speedX;
    d.y += d.speedY;
    d.flicker += 0.05;
    if (d.y > h + 10) { d.y = -10; d.x = Math.random() * w; }
    if (d.x < -10) d.x = w + 10;
    if (d.x > w + 10) d.x = -10;
    const flickerOp = d.opacity * (0.5 + 0.5 * Math.sin(d.flicker));
    ctx.fillStyle = `rgba(255, 240, 200, ${flickerOp})`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBurnMark() {
  if (!burnMark && Math.random() < CONFIG.burnMarkChance) {
    burnMark = {
      x: CONFIG.sprocketWidth + Math.random() * (w - CONFIG.sprocketWidth * 2),
      y: Math.random() * h,
      size: 20 + Math.random() * 60,
      life: 0
    };
    burnTimer = 0;
  }
  if (burnMark) {
    burnTimer++;
    burnMark.life = Math.min(1, burnTimer / 15);
    const fade = burnTimer > 30 ? Math.max(0, 1 - (burnTimer - 30) / 20) : 1;
    const grad = ctx.createRadialGradient(burnMark.x, burnMark.y, 0, burnMark.x, burnMark.y, burnMark.size * burnMark.life);
    grad.addColorStop(0, `rgba(80, 40, 0, ${0.6 * fade})`);
    grad.addColorStop(0.4, `rgba(60, 25, 0, ${0.3 * fade})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(burnMark.x - burnMark.size, burnMark.y - burnMark.size, burnMark.size * 2, burnMark.size * 2);
    if (burnTimer > 50) burnMark = null;
  }
}

function drawFlicker() {
  const flicker = (Math.random() - 0.5) * CONFIG.flickerIntensity;
  const brightness = 1 + flicker;
  ctx.fillStyle = `rgba(${flicker > 0 ? 255 : 0}, ${flicker > 0 ? 255 : 0}, ${flicker > 0 ? 255 : 0}, ${Math.abs(flicker) * 0.5})`;
  ctx.fillRect(0, 0, w, h);

  if (Math.random() < 0.03) {
    ctx.fillStyle = `rgba(0, 0, 0, ${0.1 + Math.random() * 0.15})`;
    ctx.fillRect(0, 0, w, h);
  }
}

function drawSepiaWash() {
  ctx.fillStyle = `rgba(180, 140, 60, ${CONFIG.sepiaIntensity * 0.08})`;
  ctx.fillRect(0, 0, w, h);
}

function drawHorizontalLine() {
  if (Math.random() < 0.05) {
    const y = Math.random() * h;
    ctx.fillStyle = `rgba(200, 180, 140, ${0.05 + Math.random() * 0.1})`;
    ctx.fillRect(0, y, w, 1 + Math.random() * 2);
  }
}

function drawFrameJitter() {
  if (Math.random() < 0.04) {
    ctx.save();
    ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2);
  }
}

function animate() {
  time += 1 / 60;
  if (!w || !h) { requestAnimationFrame(animate); return; }

  ctx.fillStyle = '#2a1f0a';
  ctx.fillRect(0, 0, w, h);

  const warmGrad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.6);
  warmGrad.addColorStop(0, '#3d2e14');
  warmGrad.addColorStop(1, '#1a1208');
  ctx.fillStyle = warmGrad;
  ctx.fillRect(0, 0, w, h);

  drawFrameJitter();
  drawSprockets('left');
  drawSprockets('right');
  drawScratches();
  drawDust();
  drawBurnMark();
  drawHorizontalLine();
  drawFlicker();
  drawSepiaWash();
  drawGrain();
  drawVignette();

  ctx.restore();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>

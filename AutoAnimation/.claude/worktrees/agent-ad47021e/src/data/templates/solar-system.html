<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Motion Graphics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000008;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  bgColor: '#000008',
  sunRadius: 40,
  sunColor: '#FFD93D',
  sunGlow: '#FF8C00',
  labelColor: 'rgba(200, 220, 255, 0.7)',
  orbitColor: 'rgba(60, 80, 120, 0.2)',
  starCount: 400,
  asteroidCount: 120,
  planets: [
    { name: 'Mercury', color: '#B0A090', radius: 4,  orbit: 75,  speed: 4.2,  eccentricity: 0.15 },
    { name: 'Venus',   color: '#E8C56D', radius: 7,  orbit: 105, speed: 3.0,  eccentricity: 0.05 },
    { name: 'Earth',   color: '#4488DD', radius: 8,  orbit: 140, speed: 2.4,  eccentricity: 0.08 },
    { name: 'Mars',    color: '#CC5533', radius: 5,  orbit: 180, speed: 1.8,  eccentricity: 0.12 },
    { name: 'Jupiter', color: '#D4A56A', radius: 20, orbit: 250, speed: 0.8,  eccentricity: 0.06 },
    { name: 'Saturn',  color: '#E8D080', radius: 16, orbit: 320, speed: 0.5,  eccentricity: 0.07, rings: true },
    { name: 'Uranus',  color: '#88CCDD', radius: 11, orbit: 390, speed: 0.3,  eccentricity: 0.04 },
    { name: 'Neptune', color: '#4466CC', radius: 10, orbit: 450, speed: 0.2,  eccentricity: 0.03 }
  ],
  asteroidBelt: { innerOrbit: 205, outerOrbit: 230 }
};
// =========================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Stars
const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({
    x: Math.random() * 2000 - 500,
    y: Math.random() * 2000 - 500,
    r: Math.random() * 1.5 + 0.3,
    twinkleSpeed: Math.random() * 3 + 1,
    twinkleOffset: Math.random() * Math.PI * 2,
    brightness: Math.random() * 0.5 + 0.5
  });
}

// Asteroids
const asteroids = [];
for (let i = 0; i < CONFIG.asteroidCount; i++) {
  const orbitR = CONFIG.asteroidBelt.innerOrbit + Math.random() * (CONFIG.asteroidBelt.outerOrbit - CONFIG.asteroidBelt.innerOrbit);
  asteroids.push({
    orbit: orbitR,
    angle: Math.random() * Math.PI * 2,
    speed: 0.8 + Math.random() * 0.6,
    size: Math.random() * 1.5 + 0.5,
    eccentricity: Math.random() * 0.1
  });
}

function drawStars() {
  stars.forEach(s => {
    const twinkle = Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.4 + 0.6;
    const alpha = s.brightness * twinkle;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 230, 255, ${alpha})`;
    ctx.fill();
  });
}

function drawSun() {
  // Outer glow layers
  for (let i = 5; i > 0; i--) {
    const r = CONFIG.sunRadius + i * 20;
    const grad = ctx.createRadialGradient(cx, cy, CONFIG.sunRadius * 0.5, cx, cy, r);
    grad.addColorStop(0, `rgba(255, 200, 60, ${0.04 * i})`);
    grad.addColorStop(0.5, `rgba(255, 140, 0, ${0.02 * i})`);
    grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // Sun corona rays
  const rayCount = 12;
  for (let i = 0; i < rayCount; i++) {
    const angle = (i / rayCount) * Math.PI * 2 + time * 0.1;
    const len = CONFIG.sunRadius + 15 + Math.sin(time * 2 + i) * 10;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    const x = cx + Math.cos(angle) * len;
    const y = cy + Math.sin(angle) * len;
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'rgba(255, 220, 100, 0.08)';
    ctx.lineWidth = 8;
    ctx.stroke();
  }

  // Sun body
  const sunGrad = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, CONFIG.sunRadius);
  sunGrad.addColorStop(0, '#FFFFEE');
  sunGrad.addColorStop(0.3, CONFIG.sunColor);
  sunGrad.addColorStop(0.8, CONFIG.sunGlow);
  sunGrad.addColorStop(1, '#CC5500');
  ctx.beginPath();
  ctx.arc(cx, cy, CONFIG.sunRadius, 0, Math.PI * 2);
  ctx.fillStyle = sunGrad;
  ctx.fill();

  // Sun surface details
  for (let i = 0; i < 5; i++) {
    const a = time * 0.3 + i * 1.2;
    const sx = cx + Math.cos(a) * CONFIG.sunRadius * 0.5;
    const sy = cy + Math.sin(a) * CONFIG.sunRadius * 0.4;
    ctx.beginPath();
    ctx.arc(sx, sy, 4 + Math.sin(time + i) * 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
    ctx.fill();
  }
}

function drawOrbits() {
  CONFIG.planets.forEach(p => {
    ctx.beginPath();
    ctx.ellipse(cx, cy, p.orbit, p.orbit * (1 - p.eccentricity), 0, 0, Math.PI * 2);
    ctx.strokeStyle = CONFIG.orbitColor;
    ctx.lineWidth = 0.8;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawAsteroids() {
  asteroids.forEach(a => {
    const angle = a.angle + time * a.speed * 0.01;
    const rx = a.orbit;
    const ry = a.orbit * (1 - a.eccentricity);
    const x = cx + Math.cos(angle) * rx;
    const y = cy + Math.sin(angle) * ry;

    ctx.beginPath();
    ctx.arc(x, y, a.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(140, 130, 110, 0.5)';
    ctx.fill();
  });
}

function drawPlanets() {
  CONFIG.planets.forEach(p => {
    const angle = time * p.speed * 0.01;
    const rx = p.orbit;
    const ry = p.orbit * (1 - p.eccentricity);
    const x = cx + Math.cos(angle) * rx;
    const y = cy + Math.sin(angle) * ry;

    // Planet shadow/glow
    const glowGrad = ctx.createRadialGradient(x, y, p.radius * 0.5, x, y, p.radius * 3);
    glowGrad.addColorStop(0, p.color + '40');
    glowGrad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(x, y, p.radius * 3, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Planet body
    const bodyGrad = ctx.createRadialGradient(x - p.radius * 0.3, y - p.radius * 0.3, 0, x, y, p.radius);
    bodyGrad.addColorStop(0, '#FFFFFF');
    bodyGrad.addColorStop(0.2, p.color);
    bodyGrad.addColorStop(1, shadeColor(p.color, -40));
    ctx.beginPath();
    ctx.arc(x, y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();

    // Saturn rings
    if (p.rings) {
      ctx.beginPath();
      ctx.ellipse(x, y, p.radius * 2.2, p.radius * 0.5, -0.3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(220, 200, 150, 0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x, y, p.radius * 1.8, p.radius * 0.4, -0.3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200, 180, 130, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Jupiter bands
    if (p.name === 'Jupiter') {
      for (let b = -2; b <= 2; b++) {
        ctx.beginPath();
        ctx.ellipse(x, y + b * 5, p.radius * 0.9, 1.5, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(180, 140, 80, 0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // Earth features
    if (p.name === 'Earth') {
      // Moon
      const moonAngle = time * 5 * 0.01;
      const mx = x + Math.cos(moonAngle) * 18;
      const my = y + Math.sin(moonAngle) * 18;
      ctx.beginPath();
      ctx.arc(mx, my, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#CCCCCC';
      ctx.fill();
    }

    // Label
    ctx.font = '10px Courier New';
    ctx.fillStyle = CONFIG.labelColor;
    ctx.textAlign = 'center';
    ctx.fillText(p.name, x, y + p.radius + 14);
  });
}

function shadeColor(color, percent) {
  let R = parseInt(color.substring(1, 3), 16);
  let G = parseInt(color.substring(3, 5), 16);
  let B = parseInt(color.substring(5, 7), 16);
  R = Math.max(0, Math.min(255, R + percent));
  G = Math.max(0, Math.min(255, G + percent));
  B = Math.max(0, Math.min(255, B + percent));
  return `rgb(${R},${G},${B})`;
}

function drawInfo() {
  const activePlanet = CONFIG.planets[Math.floor(time * 0.3) % CONFIG.planets.length];
  ctx.font = '11px Courier New';
  ctx.fillStyle = 'rgba(100, 180, 255, 0.5)';
  ctx.textAlign = 'left';
  ctx.fillText(`SYSTEM: Sol`, 20, 30);
  ctx.fillText(`BODIES: ${CONFIG.planets.length}`, 20, 48);
  ctx.fillText(`TRACKING: ${activePlanet.name}`, 20, 66);

  ctx.textAlign = 'right';
  ctx.fillText('SOLAR SYSTEM', W - 20, H - 20);
}

function draw() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  drawStars();
  drawOrbits();
  drawAsteroids();
  drawSun();
  drawPlanets();
  drawInfo();

  time += 1 / 60;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

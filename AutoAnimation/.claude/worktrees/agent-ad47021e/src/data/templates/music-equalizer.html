<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Equalizer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  barCount: 48,
  colorLow: '#22c55e',
  colorMid: '#eab308',
  colorHigh: '#ef4444',
  bgColor: '#0a0a0a',
  glowIntensity: 0.6,
  mirrorMode: true,
  title: 'NOW PLAYING',
  artist: 'Synthwave Collective',
  trackName: 'Neon Dreams',
  cycleDuration: 10000
};

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H, time = 0;

function resize() {
  var dpr = window.devicePixelRatio || 1;
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
}

function getBarColor(ratio) {
  if (ratio < 0.5) return CONFIG.colorLow;
  if (ratio < 0.8) return CONFIG.colorMid;
  return CONFIG.colorHigh;
}

function draw() {
  ctx.fillStyle = CONFIG.bgColor; ctx.fillRect(0, 0, W, H);

  var barW = W / CONFIG.barCount;
  var gap = 2;
  var maxH = H * 0.4;
  var midY = H * 0.5;

  for (var i = 0; i < CONFIG.barCount; i++) {
    var freq = i / CONFIG.barCount;
    var wave1 = Math.sin(time*3 + i*0.15) * 0.4;
    var wave2 = Math.sin(time*5.5 + i*0.22 + 1.3) * 0.25;
    var wave3 = Math.sin(time*1.8 + i*0.35 + 2.7) * 0.2;
    var bass = Math.max(0, Math.sin(time*2) * (1 - freq) * 0.3);
    var h = Math.abs(wave1 + wave2 + wave3 + bass + Math.random()*0.05);
    h = Math.min(h, 1);
    var barH = h * maxH;
    var x = i * barW + gap/2;
    var w = barW - gap;
    var color = getBarColor(h);

    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = h * 15 * CONFIG.glowIntensity;

    // Upper bar
    var grad = ctx.createLinearGradient(0, midY - barH, 0, midY);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + '60');
    ctx.fillStyle = grad;
    ctx.fillRect(x, midY - barH, w, barH);

    // Mirror bar
    if (CONFIG.mirrorMode) {
      var grad2 = ctx.createLinearGradient(0, midY, 0, midY + barH);
      grad2.addColorStop(0, color + '50');
      grad2.addColorStop(1, color + '05');
      ctx.fillStyle = grad2;
      ctx.fillRect(x, midY, w, barH * 0.6);
    }

    ctx.shadowBlur = 0;

    // Peak dot
    ctx.fillStyle = color;
    ctx.fillRect(x, midY - barH - 4, w, 2);
  }

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

  // Text
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = (W*0.01) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(CONFIG.title, W*0.5, H*0.08);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (W*0.025) + 'px sans-serif';
  ctx.fillText(CONFIG.trackName, W*0.5, H*0.13);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = (W*0.013) + 'px sans-serif';
  ctx.fillText(CONFIG.artist, W*0.5, H*0.17);

  // Frequency labels
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = (W*0.008) + 'px Courier New';
  ['20Hz','100Hz','500Hz','1kHz','5kHz','20kHz'].forEach(function(l, i) {
    ctx.fillText(l, W*(0.05+i*0.18), H*0.95);
  });

  time += 0.016;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize(); draw();
</script>
</body>
</html>

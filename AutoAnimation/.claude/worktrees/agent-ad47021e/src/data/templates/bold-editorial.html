<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bold Editorial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    color: #000;
    cursor: none;
  }
  .cursor-dot {
    position: fixed;
    width: 8px; height: 8px;
    background: #000;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.1s ease;
  }
  .cursor-trail {
    position: fixed;
    width: 40px; height: 40px;
    border: 1.5px solid #000;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
  }
  .grid-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .grid-cell {
    position: absolute;
    border: 0.5px solid rgba(0,0,0,0.04);
  }
  .content-stage {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }
  .headline {
    font-size: clamp(48px, 12vw, 120px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    line-height: 0.85;
    text-align: center;
    clip-path: inset(0 100% 0 0);
    animation: revealClip 6s ease-in-out infinite;
  }
  @keyframes revealClip {
    0%, 100% { clip-path: inset(0 100% 0 0); }
    15%, 85% { clip-path: inset(0 0% 0 0); }
  }
  .subline {
    font-size: clamp(11px, 1.5vw, 16px);
    font-weight: 300;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.5);
    animation: fadeUp 6s ease-in-out infinite 0.5s;
  }
  @keyframes fadeUp {
    0%, 100% { opacity: 0; transform: translateY(20px); }
    20%, 80% { opacity: 1; transform: translateY(0); }
  }
  .underline-anim {
    width: 0;
    height: 3px;
    background: #000;
    animation: underlineGrow 6s ease-in-out infinite 0.8s;
  }
  @keyframes underlineGrow {
    0%, 100% { width: 0; }
    20%, 80% { width: clamp(100px, 30vw, 300px); }
  }
  .shape-reveal {
    position: fixed;
    z-index: 5;
  }
  .shape-circle {
    width: 200px; height: 200px;
    border: 2px solid #000;
    border-radius: 50%;
    top: 15%; right: 10%;
    opacity: 0;
    animation: shapeReveal 8s ease-in-out infinite;
  }
  .shape-square {
    width: 100px; height: 100px;
    border: 2px solid #000;
    bottom: 20%; left: 8%;
    opacity: 0;
    animation: shapeReveal 8s ease-in-out infinite 2s;
  }
  @keyframes shapeReveal {
    0%, 100% { opacity: 0; transform: scale(0.8) rotate(0deg); }
    20%, 80% { opacity: 0.15; transform: scale(1) rotate(3deg); }
  }
  .grid-reveal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    pointer-events: none;
  }
  .grid-block {
    border: 0.5px solid transparent;
    animation: gridBlockReveal 10s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes gridBlockReveal {
    0%, 100% { opacity: 0; border-color: transparent; }
    30%, 70% { opacity: 1; border-color: rgba(0,0,0,0.06); }
  }
  .scroll-indicator {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: fadeUp 6s ease-in-out infinite 1.5s;
  }
  .scroll-line {
    width: 1px; height: 40px;
    background: #000;
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); opacity: 1; }
    50% { transform: scaleY(0.5); opacity: 0.3; }
  }
  .scroll-text {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.4);
  }
  .transition-wipe {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 50;
    transform: translateX(-100%);
    animation: wipeThrough 8s ease-in-out infinite;
  }
  @keyframes wipeThrough {
    0%, 100% { transform: translateX(-100%); }
    45% { transform: translateX(0%); }
    55% { transform: translateX(0%); }
    70% { transform: translateX(100%); }
  }
</style>
</head>
<body>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-trail" id="cursorTrail"></div>

<div class="grid-reveal" id="gridReveal"></div>

<div class="content-stage">
  <div class="headline" id="headlineText">BOLD<br>TYPE</div>
  <div class="underline-anim"></div>
  <div class="subline" id="sublineText">EDITORIAL DESIGN MOTION</div>
</div>

<div class="shape-reveal shape-circle"></div>
<div class="shape-reveal shape-square"></div>

<div class="scroll-indicator">
  <div class="scroll-text">SCROLL</div>
  <div class="scroll-line"></div>
</div>

<div class="transition-wipe"></div>

<script>
  // === EDITABLE TEXT VARIABLES ===
  var HEADLINE_TEXT = 'BOLD<br>TYPE';
  var SUBLINE_TEXT = 'EDITORIAL DESIGN MOTION';
  // === END EDITABLE ===

  document.getElementById('headlineText').innerHTML = HEADLINE_TEXT;
  document.getElementById('sublineText').textContent = SUBLINE_TEXT;

  // Generate grid blocks
  var gridReveal = document.getElementById('gridReveal');
  for (var i = 0; i < 24; i++) {
    var block = document.createElement('div');
    block.className = 'grid-block';
    block.style.animationDelay = (i * 0.15) + 's';
    gridReveal.appendChild(block);
  }

  // Animated cursor trail
  var cursorDot = document.getElementById('cursorDot');
  var cursorTrail = document.getElementById('cursorTrail');
  var mouseX = window.innerWidth / 2;
  var mouseY = window.innerHeight / 2;
  var trailX = mouseX;
  var trailY = mouseY;
  var angle = 0;

  // Auto-animate cursor in a pattern
  function updateCursor() {
    angle += 0.008;
    mouseX = window.innerWidth / 2 + Math.cos(angle) * (window.innerWidth * 0.25) + Math.sin(angle * 2.7) * 60;
    mouseY = window.innerHeight / 2 + Math.sin(angle * 1.3) * (window.innerHeight * 0.2) + Math.cos(angle * 1.9) * 40;

    trailX += (mouseX - trailX) * 0.08;
    trailY += (mouseY - trailY) * 0.08;

    cursorDot.style.transform = 'translate(' + (mouseX - 4) + 'px, ' + (mouseY - 4) + 'px)';
    cursorTrail.style.transform = 'translate(' + (trailX - 20) + 'px, ' + (trailY - 20) + 'px)';

    requestAnimationFrame(updateCursor);
  }
  updateCursor();
</script>
</body>
</html>

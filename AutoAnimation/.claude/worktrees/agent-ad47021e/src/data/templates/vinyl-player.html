<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vintage Vinyl Record Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0f0a08;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #e8d5b7;
  }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* === Ambient background === */
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, #2a1a0e 0%, #150d06 50%, #0f0a08 100%);
    z-index: 0;
  }

  .bg-glow {
    position: absolute;
    width: 70vmin;
    height: 70vmin;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(210,160,80,0.08) 0%, rgba(210,160,80,0.02) 50%, transparent 70%);
    z-index: 1;
    animation: pulseGlow 4s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -55%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -55%) scale(1.05); }
  }

  /* === Turntable base === */
  .turntable-base {
    position: absolute;
    width: 60vmin;
    height: 60vmin;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    z-index: 2;
  }

  .platter-shadow {
    position: absolute;
    width: 54vmin;
    height: 54vmin;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0.4) 40%, transparent 70%);
    filter: blur(2vmin);
  }

  /* === Vinyl record === */
  .vinyl {
    position: absolute;
    width: 48vmin;
    height: 48vmin;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle, transparent 8.5vmin, rgba(20,20,25,0.6) 8.6vmin, transparent 8.8vmin),
      radial-gradient(circle, transparent 11vmin, rgba(40,40,50,0.3) 11.1vmin, transparent 11.3vmin),
      radial-gradient(circle, transparent 13.5vmin, rgba(40,40,50,0.3) 13.6vmin, transparent 13.8vmin),
      radial-gradient(circle, transparent 15.5vmin, rgba(20,20,25,0.5) 15.6vmin, transparent 15.8vmin),
      radial-gradient(circle, transparent 17.5vmin, rgba(40,40,50,0.25) 17.6vmin, transparent 17.8vmin),
      radial-gradient(circle, transparent 19.5vmin, rgba(40,40,50,0.25) 19.6vmin, transparent 19.8vmin),
      radial-gradient(circle, transparent 21vmin, rgba(20,20,25,0.5) 21.1vmin, transparent 21.3vmin),
      radial-gradient(circle, transparent 22.5vmin, rgba(40,40,50,0.2) 22.6vmin, transparent 22.8vmin),
      radial-gradient(circle,
        #0a0a0e 0%,
        #111116 8%,
        #1a1a22 12%,
        #111118 18%,
        #0e0e14 25%,
        #15151e 35%,
        #0c0c12 45%,
        #13131a 55%,
        #0a0a10 65%,
        #111118 75%,
        #0e0e14 85%,
        #1a1a22 92%,
        #111116 100%
      );
    box-shadow:
      0 0 0 0.3vmin rgba(60,60,70,0.4),
      0 0 0 0.6vmin rgba(30,30,35,0.6),
      0 0.5vmin 2vmin rgba(0,0,0,0.5),
      inset 0 0 3vmin rgba(255,255,255,0.02);
    animation: spinVinyl 2s linear infinite;
    animation-play-state: paused;
  }

  .vinyl.spinning {
    animation-play-state: running;
  }

  .vinyl::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(255,255,255,0.03) 15deg,
      transparent 30deg,
      transparent 90deg,
      rgba(255,255,255,0.02) 120deg,
      transparent 150deg,
      transparent 200deg,
      rgba(255,255,255,0.04) 220deg,
      transparent 250deg,
      transparent 310deg,
      rgba(255,255,255,0.02) 340deg,
      transparent 360deg
    );
  }

  @keyframes spinVinyl {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* === Record label === */
  .label {
    position: absolute;
    width: 15vmin;
    height: 15vmin;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
    overflow: hidden;
    box-shadow:
      0 0 0 0.2vmin rgba(0,0,0,0.3),
      inset 0 0 1vmin rgba(255,255,255,0.1);
    animation: spinVinyl 2s linear infinite;
    animation-play-state: paused;
  }

  .label.spinning {
    animation-play-state: running;
  }

  .label::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.15) 0%, transparent 50%);
    z-index: 3;
  }

  .label-ring {
    position: absolute;
    width: 90%;
    height: 90%;
    border-radius: 50%;
    border: 0.15vmin solid rgba(0,0,0,0.2);
  }

  .label-ring-inner {
    position: absolute;
    width: 35%;
    height: 35%;
    border-radius: 50%;
    border: 0.15vmin solid rgba(0,0,0,0.15);
  }

  .label-hole {
    position: absolute;
    width: 1.2vmin;
    height: 1.2vmin;
    border-radius: 50%;
    background: #0f0a08;
    z-index: 6;
    box-shadow: inset 0 0 0.3vmin rgba(0,0,0,0.5);
  }

  .label-brand {
    font-size: 0.8vmin;
    letter-spacing: 0.3vmin;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.3vmin;
    position: relative;
    z-index: 4;
    font-family: 'Arial', sans-serif;
    font-weight: bold;
  }

  .label-title {
    font-size: 1.4vmin;
    font-weight: bold;
    letter-spacing: 0.1vmin;
    line-height: 1.3;
    position: relative;
    z-index: 4;
    max-width: 80%;
  }

  .label-artist {
    font-size: 1vmin;
    opacity: 0.8;
    margin-top: 0.2vmin;
    position: relative;
    z-index: 4;
    font-style: italic;
  }

  /* === Tonearm === */
  .tonearm-pivot {
    position: absolute;
    top: 12%;
    right: 18%;
    width: 1.5vmin;
    height: 1.5vmin;
    z-index: 10;
  }

  .tonearm-pivot-dot {
    width: 2vmin;
    height: 2vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #888, #444);
    box-shadow: 0 0 0.5vmin rgba(0,0,0,0.5);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 12;
  }

  .tonearm {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 28vmin;
    height: 0.6vmin;
    background: linear-gradient(90deg, #666 0%, #888 20%, #777 80%, #555 100%);
    transform-origin: 0% 50%;
    transform: rotate(20deg);
    border-radius: 0.1vmin;
    z-index: 11;
    transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0.15vmin 0.5vmin rgba(0,0,0,0.4);
  }

  .tonearm.playing {
    transform: rotate(42deg);
  }

  .tonearm-head {
    position: absolute;
    right: -1.5vmin;
    top: -0.8vmin;
    width: 3vmin;
    height: 2.2vmin;
    background: linear-gradient(180deg, #999, #666);
    border-radius: 0.2vmin;
    box-shadow: 0 0.1vmin 0.3vmin rgba(0,0,0,0.3);
  }

  .tonearm-head::after {
    content: '';
    position: absolute;
    bottom: -0.4vmin;
    left: 50%;
    transform: translateX(-50%);
    width: 0.3vmin;
    height: 0.6vmin;
    background: #444;
    border-radius: 0 0 0.1vmin 0.1vmin;
  }

  .tonearm-counterweight {
    position: absolute;
    left: -3vmin;
    top: -0.9vmin;
    width: 2.4vmin;
    height: 2.4vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #888, #555);
    box-shadow: 0 0.1vmin 0.3vmin rgba(0,0,0,0.3);
  }

  /* === Song info card === */
  .info-card {
    position: absolute;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: linear-gradient(135deg, rgba(30,22,15,0.95), rgba(20,14,8,0.98));
    border: 1px solid rgba(210,160,80,0.15);
    border-radius: 1.2vmin;
    padding: 2vmin 3vmin;
    z-index: 20;
    backdrop-filter: blur(10px);
    box-shadow: 0 1vmin 4vmin rgba(0,0,0,0.5), inset 0 0 2vmin rgba(210,160,80,0.03);
    transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    min-width: 40vmin;
    text-align: center;
  }

  .info-card.visible {
    transform: translateX(-50%) translateY(0);
  }

  .info-card-genre {
    font-size: 1vmin;
    letter-spacing: 0.4vmin;
    text-transform: uppercase;
    color: rgba(210,160,80,0.6);
    margin-bottom: 0.8vmin;
    font-family: 'Arial', sans-serif;
  }

  .info-card-title {
    font-size: 2.8vmin;
    font-weight: bold;
    color: #e8d5b7;
    margin-bottom: 0.4vmin;
    letter-spacing: 0.05vmin;
  }

  .info-card-artist {
    font-size: 1.8vmin;
    color: rgba(210,160,80,0.8);
    font-style: italic;
    margin-bottom: 0.6vmin;
  }

  .info-card-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5vmin;
    font-size: 1vmin;
    color: rgba(210,160,80,0.4);
    font-family: 'Arial', sans-serif;
    letter-spacing: 0.1vmin;
  }

  .info-card-dot {
    width: 0.4vmin;
    height: 0.4vmin;
    border-radius: 50%;
    background: rgba(210,160,80,0.3);
  }

  /* === Play indicator === */
  .play-indicator {
    position: absolute;
    top: 4vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 1vmin;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .play-indicator.visible {
    opacity: 1;
  }

  .play-icon {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0.8vmin 0 0.8vmin 1.4vmin;
    border-color: transparent transparent transparent rgba(210,160,80,0.7);
  }

  .play-label {
    font-size: 1vmin;
    letter-spacing: 0.4vmin;
    text-transform: uppercase;
    color: rgba(210,160,80,0.6);
    font-family: 'Arial', sans-serif;
  }

  /* === Equalizer === */
  .equalizer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 8vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0.8vmin;
    z-index: 15;
    padding: 0 10vw;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .equalizer.visible {
    opacity: 1;
  }

  .eq-bar {
    width: 1.5vmin;
    border-radius: 0.3vmin 0.3vmin 0 0;
    transform-origin: bottom;
    animation: eqBounce 0.8s ease-in-out infinite alternate;
  }

  @keyframes eqBounce {
    0% { transform: scaleY(0.2); }
    100% { transform: scaleY(1); }
  }

  /* === Dust particles === */
  .dust {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 18;
    opacity: 0;
  }

  @keyframes dustFloat {
    0% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 0;
    }
    15% {
      opacity: 0.6;
    }
    85% {
      opacity: 0.4;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) rotate(360deg);
      opacity: 0;
    }
  }

  /* === Vignette === */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%);
    z-index: 19;
    pointer-events: none;
  }

  /* === Film grain overlay === */
  .grain {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
    opacity: 0.04;
    animation: grainShift 0.3s steps(4) infinite;
  }

  @keyframes grainShift {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-1%, 1%); }
    50% { transform: translate(1%, -1%); }
    75% { transform: translate(-1%, -1%); }
    100% { transform: translate(1%, 1%); }
  }

  /* === Speed rings around vinyl === */
  .speed-ring {
    position: absolute;
    width: 52vmin;
    height: 52vmin;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    border-radius: 50%;
    border: 0.15vmin solid rgba(210,160,80,0.06);
    z-index: 3;
    opacity: 0;
    pointer-events: none;
  }

  .speed-ring.visible {
    animation: speedRingPulse 2.5s ease-out infinite;
  }

  .speed-ring:nth-child(2).visible { animation-delay: 0.8s; }
  .speed-ring:nth-child(3).visible { animation-delay: 1.6s; }

  @keyframes speedRingPulse {
    0% { opacity: 0.4; transform: translate(-50%, -55%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -55%) scale(1.2); }
  }

  /* === Groove shimmer === */
  .vinyl::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(
      135deg,
      transparent 30%,
      rgba(255,255,255,0.03) 45%,
      rgba(255,255,255,0.06) 50%,
      rgba(255,255,255,0.03) 55%,
      transparent 70%
    );
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- Background -->
  <div class="bg-gradient"></div>
  <div class="bg-glow"></div>

  <!-- Speed rings -->
  <div class="speed-ring" id="speedRing1"></div>
  <div class="speed-ring" id="speedRing2"></div>
  <div class="speed-ring" id="speedRing3"></div>

  <!-- Turntable -->
  <div class="turntable-base">
    <div class="platter-shadow"></div>

    <!-- Vinyl record -->
    <div class="vinyl" id="vinyl"></div>

    <!-- Record label -->
    <div class="label" id="label">
      <div class="label-ring"></div>
      <div class="label-ring-inner"></div>
      <div class="label-brand" id="labelBrand">VINYL RECORDS</div>
      <div class="label-title" id="labelTitle"></div>
      <div class="label-artist" id="labelArtist"></div>
      <div class="label-hole"></div>
    </div>
  </div>

  <!-- Tonearm -->
  <div class="tonearm-pivot">
    <div class="tonearm" id="tonearm">
      <div class="tonearm-head"></div>
      <div class="tonearm-counterweight"></div>
    </div>
    <div class="tonearm-pivot-dot"></div>
  </div>

  <!-- Play indicator -->
  <div class="play-indicator" id="playIndicator">
    <div class="play-icon"></div>
    <div class="play-label" id="playLabel">NOW PLAYING</div>
  </div>

  <!-- Song info card -->
  <div class="info-card" id="infoCard">
    <div class="info-card-genre" id="cardGenre"></div>
    <div class="info-card-title" id="cardTitle"></div>
    <div class="info-card-artist" id="cardArtist"></div>
    <div class="info-card-meta">
      <span id="cardAlbum"></span>
      <div class="info-card-dot"></div>
      <span id="cardYear"></span>
    </div>
  </div>

  <!-- Equalizer -->
  <div class="equalizer" id="equalizer"></div>

  <!-- Dust particles container -->
  <div id="dustContainer"></div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Film grain -->
  <canvas class="grain" id="grainCanvas"></canvas>
</div>

<script>
  // === EDITABLE CONFIG ===
  const CONFIG = {
    songTitle: 'Midnight Blues',
    artistName: 'The Vinyl Collective',
    albumName: 'Late Night Sessions',
    year: '1974',
    genre: 'JAZZ / SOUL',
    labelColor: '#c84b31',
    labelTextColor: '#ffeedd',
    cycleDuration: 10000,
    eqBarCount: 12,
    dustParticleCount: 20,
    vinylSpeed: 2,
    accentColor: '#d2a050',
  };

  // === State ===
  let isPlaying = false;
  let eqBars = [];
  let eqInterval = null;

  // === DOM references ===
  const vinyl = document.getElementById('vinyl');
  const label = document.getElementById('label');
  const tonearm = document.getElementById('tonearm');
  const infoCard = document.getElementById('infoCard');
  const playIndicator = document.getElementById('playIndicator');
  const equalizer = document.getElementById('equalizer');
  const dustContainer = document.getElementById('dustContainer');
  const grainCanvas = document.getElementById('grainCanvas');

  // === Apply CONFIG to DOM ===
  function applyConfig() {
    document.getElementById('labelTitle').textContent = CONFIG.songTitle;
    document.getElementById('labelArtist').textContent = CONFIG.artistName;
    document.getElementById('cardGenre').textContent = CONFIG.genre;
    document.getElementById('cardTitle').textContent = CONFIG.songTitle;
    document.getElementById('cardArtist').textContent = CONFIG.artistName;
    document.getElementById('cardAlbum').textContent = CONFIG.albumName;
    document.getElementById('cardYear').textContent = CONFIG.year;

    // Apply label color
    label.style.background = 'radial-gradient(circle at 45% 40%, ' +
      lightenColor(CONFIG.labelColor, 30) + ', ' +
      CONFIG.labelColor + ' 60%, ' +
      darkenColor(CONFIG.labelColor, 20) + ' 100%)';
    label.style.color = CONFIG.labelTextColor;

    // Set vinyl spin speed
    vinyl.style.animationDuration = CONFIG.vinylSpeed + 's';
    label.style.animationDuration = CONFIG.vinylSpeed + 's';
  }

  // === Color helpers ===
  function hexToHSL(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }
    return [h * 360, s * 100, l * 100];
  }

  function lightenColor(hex, amt) {
    var hsl = hexToHSL(hex);
    var l = Math.min(100, hsl[2] + amt);
    return 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + l + '%)';
  }

  function darkenColor(hex, amt) {
    var hsl = hexToHSL(hex);
    var l = Math.max(0, hsl[2] - amt);
    return 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + l + '%)';
  }

  // === Build equalizer bars ===
  function buildEqualizer() {
    equalizer.innerHTML = '';
    eqBars = [];
    for (var i = 0; i < CONFIG.eqBarCount; i++) {
      var bar = document.createElement('div');
      bar.className = 'eq-bar';
      var baseDelay = (i * 0.1) + (Math.random() * 0.2);
      var baseDuration = 0.4 + Math.random() * 0.6;
      bar.style.height = (3 + Math.random() * 5) + 'vh';
      bar.style.background = 'linear-gradient(180deg, ' + CONFIG.accentColor + ', ' + CONFIG.labelColor + ')';
      bar.style.animationDelay = baseDelay + 's';
      bar.style.animationDuration = baseDuration + 's';
      bar.style.opacity = '0.7';
      equalizer.appendChild(bar);
      eqBars.push({ el: bar });
    }
  }

  // === Randomize equalizer bar heights ===
  function randomizeEQ() {
    for (var i = 0; i < eqBars.length; i++) {
      var newHeight = 2 + Math.random() * 6;
      var newDur = 0.3 + Math.random() * 0.7;
      eqBars[i].el.style.height = newHeight + 'vh';
      eqBars[i].el.style.animationDuration = newDur + 's';
    }
  }

  // === Create dust particles ===
  function spawnDust() {
    dustContainer.innerHTML = '';
    for (var i = 0; i < CONFIG.dustParticleCount; i++) {
      createDustParticle(Math.random() * 8000);
    }
  }

  function createDustParticle(initialDelay) {
    var dust = document.createElement('div');
    dust.className = 'dust';
    var size = 0.15 + Math.random() * 0.4;
    var startX = 10 + Math.random() * 80;
    var startY = 10 + Math.random() * 80;
    var dx = (-20 + Math.random() * 40);
    var dy = (-30 + Math.random() * -10);
    var duration = 4 + Math.random() * 6;
    var brightness = 150 + Math.floor(Math.random() * 80);

    dust.style.width = size + 'vmin';
    dust.style.height = size + 'vmin';
    dust.style.left = startX + '%';
    dust.style.top = startY + '%';
    dust.style.background = 'rgba(' + brightness + ',' + (brightness - 20) + ',' + (brightness - 50) + ', 0.5)';
    dust.style.setProperty('--dx', dx + 'vmin');
    dust.style.setProperty('--dy', dy + 'vmin');
    dust.style.animation = 'dustFloat ' + duration + 's linear ' + initialDelay + 'ms infinite';

    dustContainer.appendChild(dust);
  }

  // === Film grain ===
  function initGrain() {
    var w = 256;
    var h = 256;
    grainCanvas.width = w;
    grainCanvas.height = h;
    var ctx = grainCanvas.getContext('2d');
    var imageData = ctx.createImageData(w, h);
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = Math.random() * 255;
      data[i] = v;
      data[i + 1] = v;
      data[i + 2] = v;
      data[i + 3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // === Cycle Animation ===
  function startPlaying() {
    isPlaying = true;
    vinyl.classList.add('spinning');
    label.classList.add('spinning');
    tonearm.classList.add('playing');

    // Staggered reveals
    setTimeout(function() {
      playIndicator.classList.add('visible');
    }, 800);

    setTimeout(function() {
      infoCard.classList.add('visible');
    }, 1500);

    setTimeout(function() {
      equalizer.classList.add('visible');
      document.getElementById('speedRing1').classList.add('visible');
      document.getElementById('speedRing2').classList.add('visible');
      document.getElementById('speedRing3').classList.add('visible');
    }, 2000);
  }

  function stopPlaying() {
    isPlaying = false;
    vinyl.classList.remove('spinning');
    label.classList.remove('spinning');
    tonearm.classList.remove('playing');
    playIndicator.classList.remove('visible');
    infoCard.classList.remove('visible');
    equalizer.classList.remove('visible');
    document.getElementById('speedRing1').classList.remove('visible');
    document.getElementById('speedRing2').classList.remove('visible');
    document.getElementById('speedRing3').classList.remove('visible');
  }

  function runCycle() {
    // Start: tonearm moves, record spins, info appears
    startPlaying();

    // During playback, periodically randomize EQ
    if (eqInterval) clearInterval(eqInterval);
    eqInterval = setInterval(randomizeEQ, 800);

    // After hold period, retract and reset
    var holdTime = CONFIG.cycleDuration - 3000;
    setTimeout(function() {
      stopPlaying();
      if (eqInterval) {
        clearInterval(eqInterval);
        eqInterval = null;
      }
    }, Math.max(holdTime, 4000));

    // Restart cycle
    setTimeout(runCycle, CONFIG.cycleDuration);
  }

  // === PostMessage bridge for live CONFIG updates ===
  window.addEventListener('message', function(e) {
    if (e.data && typeof e.data === 'object') {
      var d = e.data;
      if (d.type === 'CONFIG_UPDATE' && d.payload) {
        Object.assign(CONFIG, d.payload);
        applyConfig();
        buildEqualizer();
      }
    }
  });

  // === Init ===
  applyConfig();
  buildEqualizer();
  spawnDust();
  initGrain();

  // Start first cycle after a brief pause
  setTimeout(runCycle, 500);
</script>
</body>
</html>

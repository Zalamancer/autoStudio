<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Electric Pulse - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #060612; font-family: 'Arial Black', 'Impact', sans-serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,150,255,0.04), transparent 60%); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .bolt { position: absolute; pointer-events: none; z-index: 3; }

  @keyframes zapIn { 0% { opacity: 0; transform: translate(-50%,-50%) scaleX(0.3); filter: brightness(3); } 20% { opacity: 1; filter: brightness(2); } 40% { transform: translate(-50%,-50%) scaleX(1.05); } 100% { opacity: 1; transform: translate(-50%,-50%) scaleX(1); filter: brightness(1); } }
  @keyframes zapOut { 0% { opacity: 1; } 30% { opacity: 1; filter: brightness(2); } 100% { opacity: 0; transform: translate(-50%,-50%) scaleY(0.3); filter: brightness(3); } }
  @keyframes boltFlash { 0% { opacity: 0.8; } 100% { opacity: 0; transform: scaleY(1.5); } }
  @keyframes pulseGlow { 0%,100% { text-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow); } 50% { text-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow), 0 0 60px var(--glow); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['VOLTAGE','SURGE','CURRENT','CHARGED','SPARK','THUNDER','SHOCK','STATIC'],
  bgColor: '#060612',
  fontFamily: "'Arial Black', 'Impact', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const elecColors = ['#00d4ff','#0099ff','#4488ff','#00bbff','#22aaff','#0066ff','#00ccee','#3399ff'];

function spawnBolts(x, y, color) {
  for (let i = 0; i < 3; i++) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','bolt');
    svg.style.cssText = `left:${x-20}px;top:${y-15}px;width:40px;height:30px;animation:boltFlash ${200+Math.random()*200}ms ease-out forwards;`;
    const line = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    let pts = '';
    let cx = 0, cy = 15;
    for (let j = 0; j < 5; j++) { pts += `${cx},${cy} `; cx += 6 + Math.random()*6; cy += (Math.random()-0.5)*20; }
    line.setAttribute('points', pts.trim());
    line.setAttribute('fill','none');
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width','2');
    svg.appendChild(line); document.body.appendChild(svg);
    setTimeout(() => svg.remove(), 500);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 67 + 33);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(36 + rng() * 24, cellW * 0.38, cellH * 0.5);
    const color = elecColors[i % elecColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:${color};--glow:${color};text-shadow:0 0 10px ${color},0 0 20px ${color};letter-spacing:4px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2, color });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=250, inD=400, hold=3000, outS=180, outD=380, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`zapIn ${inD}ms ease-out forwards, pulseGlow 1.5s ease-in-out infinite ${inD}ms`;spawnBolts(item.x,item.y,item.color);}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`zapOut ${outD}ms ease-in forwards`;spawnBolts(item.x,item.y,item.color);}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

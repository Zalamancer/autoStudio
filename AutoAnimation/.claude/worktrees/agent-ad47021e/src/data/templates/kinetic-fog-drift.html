<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fog Drift - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0d0d0d; font-family: 'Georgia', 'Times New Roman', serif; position: relative; }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .fog { position: absolute; border-radius: 50%; pointer-events: none; z-index: 1; filter: blur(16px); }

  @keyframes fogIn { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); filter: blur(8px); } 60% { filter: blur(1px); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: blur(0); } }
  @keyframes fogOut { 0% { opacity: 1; filter: blur(0); } 100% { opacity: 0; transform: translate(-50%,-50%) translateY(-15px); filter: blur(8px); } }
  @keyframes fogRise { 0% { opacity: 0.12; transform: translate(-50%,-50%) scale(0.5); } 50% { opacity: 0.06; } 100% { opacity: 0; transform: translate(-50%,calc(-50% - 60px)) scale(2); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['WHISPER','VANISH','ETHEREAL','PHANTOM','MIRAGE','SHADOW','DISSOLVE','MYSTIC'],
  bgColor: '#0d0d0d',
  fontFamily: "'Georgia', 'Times New Roman', serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const fogColors = ['#e0e0e0','#c0c0c0','#a0a0a0','#d0d0d0','#b0b0b0','#ddd','#ccc','#bbb'];

function spawnFog(x, y) {
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('div'); s.className = 'fog';
    const sz = 30 + Math.random() * 40;
    const g = 150 + Math.floor(Math.random() * 80);
    s.style.cssText = `left:${x+(Math.random()-0.5)*40}px;top:${y}px;width:${sz}px;height:${sz}px;background:rgba(${g},${g},${g},0.12);animation:fogRise ${1000+Math.random()*800}ms ease-out forwards;animation-delay:${Math.random()*200}ms;`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 83 + 41);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(34 + rng() * 26, cellW * 0.38, cellH * 0.5);
    const color = fogColors[i % fogColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-style:italic;color:${color};text-shadow:0 0 20px rgba(200,200,200,0.15);letter-spacing:6px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2 });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=350, inD=700, hold=3000, outS=250, outD=600, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`fogIn ${inD}ms ease-out forwards`;spawnFog(item.x,item.y);}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`fogOut ${outD}ms ease-in forwards`;spawnFog(item.x,item.y);}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

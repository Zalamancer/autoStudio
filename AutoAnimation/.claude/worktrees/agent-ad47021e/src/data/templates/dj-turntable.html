<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Turntable</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #0c0c10; }
  canvas#djCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  }
</style>
</head>
<body>
<canvas id="djCanvas"></canvas>

<script>
const CONFIG = {
  titleText: 'DJ DECK',
  backgroundColor: '#0c0c10',
  deckColor: '#1a1a22',
  accentColor: '#ff3366',
  secondaryAccent: '#00ccff',
  vinylColor: '#111118',
  labelColor: '#cc2255',
  bpm: 128,
  vuMeterColor: '#00ff66',
  waveformColor: '#ff3366',
  knobColor: '#333340',
  rotationSpeed: 1.0,
  cycleDuration: 15,
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('djCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

// --- Deck layout ---
function getDeckLayout() {
  const margin = W * 0.04;
  const deckW = W - margin * 2;
  const deckH = H * 0.7;
  const deckX = margin;
  const deckY = H * 0.15;
  const platterR = Math.min(deckW * 0.18, deckH * 0.38);
  const leftPlatterCx = deckX + deckW * 0.22;
  const rightPlatterCx = deckX + deckW * 0.78;
  const platterCy = deckY + deckH * 0.42;
  return { deckX, deckY, deckW, deckH, platterR, leftPlatterCx, rightPlatterCx, platterCy, margin };
}

// --- Draw deck body ---
function drawDeckBody(t) {
  const { deckX, deckY, deckW, deckH } = getDeckLayout();
  const dc = hexToRgb(CONFIG.deckColor);

  // Main deck surface
  ctx.fillStyle = `rgb(${dc.r}, ${dc.g}, ${dc.b})`;
  ctx.beginPath();
  ctx.roundRect(deckX, deckY, deckW, deckH, 8);
  ctx.fill();

  // Subtle top bevel
  const bevel = ctx.createLinearGradient(0, deckY, 0, deckY + 4);
  bevel.addColorStop(0, `rgba(255,255,255,0.06)`);
  bevel.addColorStop(1, 'transparent');
  ctx.fillStyle = bevel;
  ctx.fillRect(deckX, deckY, deckW, 4);

  // Edge shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(deckX, deckY, deckW, deckH, 8);
  ctx.stroke();

  // Brushed metal texture lines
  ctx.strokeStyle = `rgba(255,255,255,0.015)`;
  ctx.lineWidth = 0.5;
  for (let y = deckY + 5; y < deckY + deckH - 5; y += 3) {
    ctx.beginPath();
    ctx.moveTo(deckX + 5, y);
    ctx.lineTo(deckX + deckW - 5, y);
    ctx.stroke();
  }
}

// --- Draw vinyl record ---
function drawVinyl(cx, cy, r, rotation, t, isLeft) {
  const vc = hexToRgb(CONFIG.vinylColor);
  const lc = hexToRgb(CONFIG.labelColor);

  // Platter recess
  ctx.beginPath();
  ctx.arc(cx, cy, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Vinyl disc
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  // Main disc
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${vc.r},${vc.g},${vc.b})`;
  ctx.fill();

  // Grooves
  for (let gr = r * 0.35; gr < r * 0.95; gr += 3) {
    ctx.beginPath();
    ctx.arc(0, 0, gr, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.02 + Math.sin(gr * 0.5) * 0.01})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Sheen highlight (rotating with disc)
  const sheenGrad = ctx.createLinearGradient(-r, -r, r, r);
  sheenGrad.addColorStop(0, 'transparent');
  sheenGrad.addColorStop(0.45, 'rgba(255,255,255,0.03)');
  sheenGrad.addColorStop(0.55, 'rgba(255,255,255,0.06)');
  sheenGrad.addColorStop(0.65, 'rgba(255,255,255,0.03)');
  sheenGrad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = sheenGrad;
  ctx.fill();

  // Label
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
  const labelGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.28);
  labelGrad.addColorStop(0, `rgba(${lc.r + 30},${lc.g + 20},${lc.b + 20},1)`);
  labelGrad.addColorStop(1, `rgb(${lc.r},${lc.g},${lc.b})`);
  ctx.fillStyle = labelGrad;
  ctx.fill();

  // Label text (rotates with disc)
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `${r * 0.06}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(isLeft ? 'TRACK A' : 'TRACK B', 0, -r * 0.08);
  ctx.font = `bold ${r * 0.08}px sans-serif`;
  ctx.fillText(CONFIG.titleText, 0, r * 0.06);
  ctx.font = `${r * 0.045}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillText(`${CONFIG.bpm} BPM`, 0, r * 0.16);

  // Center spindle
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.03, 0, Math.PI * 2);
  ctx.fillStyle = '#555';
  ctx.fill();

  ctx.restore();
}

// --- Tonearm ---
function drawTonearm(cx, cy, r, t, isLeft) {
  const pivotX = isLeft ? cx + r + 30 : cx - r - 30;
  const pivotY = cy - r * 0.6;
  const armAngle = isLeft ? -0.45 + Math.sin(t * 0.0003) * 0.02 : Math.PI + 0.45 - Math.sin(t * 0.0003) * 0.02;
  const armLen = r * 1.1;

  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.rotate(armAngle);

  // Arm
  ctx.strokeStyle = '#444450';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(armLen, 0);
  ctx.stroke();

  // Headshell
  ctx.fillStyle = '#333340';
  ctx.fillRect(armLen - 5, -4, 14, 8);

  // Cartridge/stylus
  ctx.fillStyle = '#222230';
  ctx.fillRect(armLen + 7, -2, 6, 4);
  ctx.fillStyle = CONFIG.accentColor;
  ctx.fillRect(armLen + 12, -1, 3, 2);

  // Pivot base
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#333340';
  ctx.fill();

  ctx.restore();
}

// --- Mixer section (center) ---
function drawMixer(t) {
  const { deckX, deckY, deckW, deckH } = getDeckLayout();
  const mixX = deckX + deckW * 0.38;
  const mixW = deckW * 0.24;
  const mixY = deckY + 10;
  const mixH = deckH - 20;

  // Mixer panel
  ctx.fillStyle = 'rgba(15,15,20,0.6)';
  ctx.beginPath();
  ctx.roundRect(mixX, mixY, mixW, mixH, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const ac = hexToRgb(CONFIG.accentColor);
  const sc = hexToRgb(CONFIG.secondaryAccent);

  // --- EQ Knobs ---
  const knobStartY = mixY + 20;
  const knobSpacing = 28;
  const labels = ['HI', 'MID', 'LOW', 'GAIN'];

  for (let col = 0; col < 2; col++) {
    const kx = mixX + mixW * (0.25 + col * 0.5);
    for (let row = 0; row < labels.length; row++) {
      const ky = knobStartY + row * knobSpacing;
      const knobAngle = Math.sin(t * 0.003 + col * 2 + row * 1.5) * 1.2;
      drawKnob(kx, ky, 8, knobAngle, labels[row]);
    }
  }

  // --- Channel faders ---
  const faderY = knobStartY + labels.length * knobSpacing + 15;
  const faderH = 80;
  for (let col = 0; col < 2; col++) {
    const fx = mixX + mixW * (0.25 + col * 0.5);
    const faderVal = 0.4 + 0.3 * Math.sin(t * 0.002 + col * 3);
    // Track
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(fx - 2, faderY, 4, faderH);
    // Knob
    const fky = faderY + faderH * (1 - faderVal);
    ctx.fillStyle = CONFIG.knobColor;
    ctx.beginPath();
    ctx.roundRect(fx - 8, fky - 5, 16, 10, 2);
    ctx.fill();
    ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.3)`;
    ctx.fillRect(fx - 6, fky - 1, 12, 2);
    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(col === 0 ? 'CH A' : 'CH B', fx, faderY - 4);
  }

  // --- Crossfader ---
  const cfY = faderY + faderH + 25;
  const cfW = mixW * 0.6;
  const cfX = mixX + (mixW - cfW) / 2;
  const cfVal = 0.5 + 0.3 * Math.sin(t * 0.004);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(cfX, cfY, cfW, 4);
  const cfKnobX = cfX + cfVal * cfW;
  ctx.fillStyle = CONFIG.knobColor;
  ctx.beginPath();
  ctx.roundRect(cfKnobX - 10, cfY - 5, 20, 14, 3);
  ctx.fill();
  ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.4)`;
  ctx.fillRect(cfKnobX - 8, cfY, 16, 2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('CROSSFADER', mixX + mixW / 2, cfY - 8);

  // --- VU Meters ---
  const vuY = cfY + 30;
  const vuH = mixH - (vuY - mixY) - 15;
  const vuW = 6;
  for (let col = 0; col < 2; col++) {
    for (let ch = 0; ch < 2; ch++) {
      const vx = mixX + mixW * (0.18 + col * 0.5) + ch * 12;
      drawVUMeter(vx, vuY, vuW, vuH, t, col * 2 + ch);
    }
  }
}

function drawKnob(x, y, r, angle, label) {
  const kc = hexToRgb(CONFIG.knobColor);
  // Knob body
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  const knobGrad = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, r);
  knobGrad.addColorStop(0, `rgba(${kc.r + 30},${kc.g + 30},${kc.b + 30},1)`);
  knobGrad.addColorStop(1, `rgb(${kc.r},${kc.g},${kc.b})`);
  ctx.fillStyle = knobGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Indicator line
  const ix = x + Math.cos(angle - Math.PI / 2) * r * 0.7;
  const iy = y + Math.sin(angle - Math.PI / 2) * r * 0.7;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ix, iy);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Label
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = '6px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y + r + 9);
}

function drawVUMeter(x, y, w, h, t, seed) {
  const vc = hexToRgb(CONFIG.vuMeterColor);
  const segCount = 16;
  const segH = (h - segCount) / segCount;
  const level = 0.4 + 0.5 * Math.abs(Math.sin(t * 0.008 + seed * 1.7));

  for (let i = 0; i < segCount; i++) {
    const segY = y + h - (i + 1) * (segH + 1);
    const lit = (i / segCount) < level;
    if (lit) {
      if (i > segCount * 0.85) {
        ctx.fillStyle = `rgba(255, 50, 50, 0.9)`;
      } else if (i > segCount * 0.7) {
        ctx.fillStyle = `rgba(255, 200, 50, 0.8)`;
      } else {
        ctx.fillStyle = `rgba(${vc.r},${vc.g},${vc.b},0.7)`;
      }
    } else {
      ctx.fillStyle = 'rgba(30, 30, 40, 0.5)';
    }
    ctx.fillRect(x, segY, w, segH);
  }
}

// --- Waveform display ---
function drawWaveformDisplay(t) {
  const { deckX, deckY, deckW } = getDeckLayout();
  const wfY = deckY - H * 0.12;
  const wfH = H * 0.10;
  const wfX = deckX;
  const wfW = deckW;

  // Background
  ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
  ctx.beginPath();
  ctx.roundRect(wfX, wfY, wfW, wfH, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const wc = hexToRgb(CONFIG.waveformColor);
  const sc = hexToRgb(CONFIG.secondaryAccent);

  // Waveform A (top half)
  const midY = wfY + wfH / 2;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(wfX, wfY, wfW, wfH, 6);
  ctx.clip();

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(wfX, midY);
  ctx.lineTo(wfX + wfW, midY);
  ctx.stroke();

  // Track A waveform
  ctx.beginPath();
  for (let x = 0; x < wfW; x++) {
    const xp = x + t * 0.5;
    const amp = (Math.sin(xp * 0.05) * 0.3 + Math.sin(xp * 0.12) * 0.2 + Math.sin(xp * 0.03) * 0.15 + Math.random() * 0.1) * wfH * 0.2;
    ctx.lineTo(wfX + x, midY - wfH * 0.25 - amp);
  }
  for (let x = wfW - 1; x >= 0; x--) {
    const xp = x + t * 0.5;
    const amp = (Math.sin(xp * 0.05) * 0.3 + Math.sin(xp * 0.12) * 0.2 + Math.sin(xp * 0.03) * 0.15 + Math.random() * 0.1) * wfH * 0.2;
    ctx.lineTo(wfX + x, midY - wfH * 0.25 + amp);
  }
  ctx.fillStyle = `rgba(${wc.r},${wc.g},${wc.b},0.4)`;
  ctx.fill();

  // Track B waveform
  ctx.beginPath();
  for (let x = 0; x < wfW; x++) {
    const xp = x + t * 0.45 + 500;
    const amp = (Math.sin(xp * 0.06) * 0.25 + Math.sin(xp * 0.1) * 0.2 + Math.sin(xp * 0.035) * 0.15 + Math.random() * 0.08) * wfH * 0.2;
    ctx.lineTo(wfX + x, midY + wfH * 0.25 - amp);
  }
  for (let x = wfW - 1; x >= 0; x--) {
    const xp = x + t * 0.45 + 500;
    const amp = (Math.sin(xp * 0.06) * 0.25 + Math.sin(xp * 0.1) * 0.2 + Math.sin(xp * 0.035) * 0.15 + Math.random() * 0.08) * wfH * 0.2;
    ctx.lineTo(wfX + x, midY + wfH * 0.25 + amp);
  }
  ctx.fillStyle = `rgba(${sc.r},${sc.g},${sc.b},0.35)`;
  ctx.fill();

  // Playhead
  const playheadX = wfX + wfW * 0.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(playheadX, wfY);
  ctx.lineTo(playheadX, wfY + wfH);
  ctx.stroke();

  // BPM display
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`A: ${CONFIG.bpm}.0 BPM`, wfX + 10, wfY + 14);
  ctx.textAlign = 'right';
  ctx.fillText(`B: ${CONFIG.bpm}.0 BPM`, wfX + wfW - 10, wfY + wfH - 6);

  ctx.restore();
}

// --- Background ambient ---
function drawBackground(t) {
  const bg = hexToRgb(CONFIG.backgroundColor);
  ctx.fillStyle = `rgb(${bg.r}, ${bg.g}, ${bg.b})`;
  ctx.fillRect(0, 0, W, H);

  // Subtle ambient glow
  const ac = hexToRgb(CONFIG.accentColor);
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.003);
  const glow = ctx.createRadialGradient(W * 0.3, H * 0.5, 0, W * 0.3, H * 0.5, W * 0.4);
  glow.addColorStop(0, `rgba(${ac.r},${ac.g},${ac.b},${0.02 * pulse})`);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  const sc = hexToRgb(CONFIG.secondaryAccent);
  const glow2 = ctx.createRadialGradient(W * 0.7, H * 0.5, 0, W * 0.7, H * 0.5, W * 0.4);
  glow2.addColorStop(0, `rgba(${sc.r},${sc.g},${sc.b},${0.02 * pulse})`);
  glow2.addColorStop(1, 'transparent');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, W, H);
}

// --- Pitch faders (on each deck side) ---
function drawPitchFaders(t) {
  const { deckX, deckY, deckW, deckH, platterR, leftPlatterCx, rightPlatterCx, platterCy } = getDeckLayout();

  const drawFader = (fx, isLeft) => {
    const fy = platterCy - platterR * 0.5;
    const fh = platterR * 1.0;
    const val = 0.5 + 0.05 * Math.sin(t * 0.001 + (isLeft ? 0 : 2));

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(fx - 2, fy, 4, fh);

    const kny = fy + fh * (1 - val);
    ctx.fillStyle = CONFIG.knobColor;
    ctx.beginPath();
    ctx.roundRect(fx - 6, kny - 4, 12, 8, 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PITCH', fx, fy - 5);
  };

  drawFader(leftPlatterCx + platterR + 30, true);
  drawFader(rightPlatterCx - platterR - 30, false);
}

// --- Main animation ---
let vinylAngleL = 0;
let vinylAngleR = 0;

function animate(t) {
  const beatInterval = 60000 / CONFIG.bpm;
  const rotPerFrame = (Math.PI * 2) / (beatInterval * 60 / 1000) * CONFIG.rotationSpeed * 0.016;
  vinylAngleL += rotPerFrame;
  vinylAngleR += rotPerFrame * 1.002; // Slightly desynced

  const layout = getDeckLayout();

  drawBackground(t);
  drawWaveformDisplay(t);
  drawDeckBody(t);

  // Vinyl platters
  drawVinyl(layout.leftPlatterCx, layout.platterCy, layout.platterR, vinylAngleL, t, true);
  drawVinyl(layout.rightPlatterCx, layout.platterCy, layout.platterR, vinylAngleR, t, false);

  // Tonearms
  drawTonearm(layout.leftPlatterCx, layout.platterCy, layout.platterR, t, true);
  drawTonearm(layout.rightPlatterCx, layout.platterCy, layout.platterR, t, false);

  // Mixer
  drawMixer(t);
  drawPitchFaders(t);

  // Beat pulse overlay
  const beatPhase = (t % beatInterval) / beatInterval;
  if (beatPhase < 0.08) {
    const ac = hexToRgb(CONFIG.accentColor);
    ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},${0.02 * (1 - beatPhase / 0.08)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.65);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

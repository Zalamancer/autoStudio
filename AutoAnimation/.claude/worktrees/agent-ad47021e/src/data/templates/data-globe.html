<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Globe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #050510; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<script>
const CONFIG = {
  rotationSpeed: 0.3,
  pointCount: 12,
  arcCount: 6,
  wireColor: '#1e3a5f',
  pointColor: '#00ddff',
  arcColor: '#ff6600',
  bgColor: '#050510',
  globeRadius: 0.3
};

const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, radius;
let rotY = 0;
let lastTime = 0;
let stars = [];
let dataPoints = [];
let arcs = [];
let satellite = { angle: 0, tilt: 0.4 };

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  radius = Math.min(width, height) * CONFIG.globeRadius;
  generateStars();
  generateDataPoints();
  generateArcs();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      alpha: 0.2 + Math.random() * 0.6,
      twinkleSpeed: 0.5 + Math.random() * 2
    });
  }
}

function generateDataPoints() {
  dataPoints = [];
  // Distribute points at various lat/lon to look like city positions
  const positions = [
    { lat: 40.7, lon: -74.0 },   // New York
    { lat: 51.5, lon: -0.1 },    // London
    { lat: 35.7, lon: 139.7 },   // Tokyo
    { lat: -33.9, lon: 151.2 },  // Sydney
    { lat: 1.35, lon: 103.8 },   // Singapore
    { lat: 55.75, lon: 37.6 },   // Moscow
    { lat: -23.5, lon: -46.6 },  // Sao Paulo
    { lat: 37.8, lon: -122.4 },  // San Francisco
    { lat: 28.6, lon: 77.2 },    // Delhi
    { lat: 48.9, lon: 2.35 },    // Paris
    { lat: 31.2, lon: 121.5 },   // Shanghai
    { lat: -1.3, lon: 36.8 },    // Nairobi
    { lat: 25.2, lon: 55.3 },    // Dubai
    { lat: 52.5, lon: 13.4 },    // Berlin
    { lat: 35.0, lon: -106.6 },  // Albuquerque
    { lat: -34.6, lon: -58.4 },  // Buenos Aires
  ];

  for (let i = 0; i < Math.min(CONFIG.pointCount, positions.length); i++) {
    const p = positions[i];
    const latRad = p.lat * Math.PI / 180;
    const lonRad = p.lon * Math.PI / 180;
    dataPoints.push({
      lat: latRad,
      lon: lonRad,
      pulsePhase: Math.random() * Math.PI * 2,
      size: 2 + Math.random() * 2
    });
  }
}

function generateArcs() {
  arcs = [];
  const count = Math.min(CONFIG.arcCount, Math.floor(dataPoints.length / 2));
  const used = new Set();
  for (let i = 0; i < count; i++) {
    let from, to;
    do {
      from = Math.floor(Math.random() * dataPoints.length);
      to = Math.floor(Math.random() * dataPoints.length);
    } while (from === to || used.has(`${from}-${to}`));
    used.add(`${from}-${to}`);
    arcs.push({ from, to, progress: Math.random(), speed: 0.3 + Math.random() * 0.5 });
  }
}

function project(lat, lon) {
  // Spherical to 3D
  const adjustedLon = lon + rotY;
  const x = Math.cos(lat) * Math.sin(adjustedLon);
  const y = -Math.sin(lat);
  const z = Math.cos(lat) * Math.cos(adjustedLon);

  // Simple perspective
  const scale = 1.0 / (1.0 + z * 0.15);
  const px = cx + x * radius * scale;
  const py = cy + y * radius * scale;

  return { x: px, y: py, z: z, scale: scale };
}

function drawBackground(time) {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, width, height);

  // Subtle radial glow behind globe
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, radius * 2);
  glow.addColorStop(0, 'rgba(0, 50, 100, 0.08)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);

  // Stars
  stars.forEach(s => {
    const twinkle = 0.3 + Math.sin(time * 0.001 * s.twinkleSpeed) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 220, 255, ${s.alpha * twinkle})`;
    ctx.fill();
  });
}

function drawWireframe() {
  const rgb = hexToRgb(CONFIG.wireColor);

  // Longitude lines
  for (let i = 0; i < 24; i++) {
    const lon = (i / 24) * Math.PI * 2;
    ctx.beginPath();
    let started = false;
    for (let j = 0; j <= 60; j++) {
      const lat = (j / 60) * Math.PI - Math.PI / 2;
      const p = project(lat, lon);
      const alpha = p.z > -0.2 ? 0.25 + p.z * 0.2 : Math.max(0, 0.05 + p.z * 0.05);

      if (!started) {
        ctx.moveTo(p.x, p.y);
        started = true;
      } else {
        ctx.lineTo(p.x, p.y);
      }
    }
    ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.2)`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Latitude lines
  for (let i = 1; i < 12; i++) {
    const lat = (i / 12) * Math.PI - Math.PI / 2;
    ctx.beginPath();
    let started = false;
    for (let j = 0; j <= 72; j++) {
      const lon = (j / 72) * Math.PI * 2;
      const p = project(lat, lon);

      if (!started) {
        ctx.moveTo(p.x, p.y);
        started = true;
      } else {
        ctx.lineTo(p.x, p.y);
      }
    }
    ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.15)`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Equator (brighter)
  ctx.beginPath();
  for (let j = 0; j <= 72; j++) {
    const lon = (j / 72) * Math.PI * 2;
    const p = project(0, lon);
    if (j === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.35)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Globe outline
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Atmospheric glow
  const atmoGrad = ctx.createRadialGradient(cx, cy, radius * 0.95, cx, cy, radius * 1.15);
  atmoGrad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g + 60}, ${rgb.b + 100}, 0.1)`);
  atmoGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.15, 0, Math.PI * 2);
  ctx.fillStyle = atmoGrad;
  ctx.fill();
}

function drawDataPoints(time) {
  const rgb = hexToRgb(CONFIG.pointColor);

  dataPoints.forEach((dp, idx) => {
    const p = project(dp.lat, dp.lon);

    // Only draw if on visible side
    if (p.z < -0.3) return;

    const alpha = Math.max(0, Math.min(1, (p.z + 0.3) / 1.3));
    const pulse = 1 + Math.sin(time * 0.003 + dp.pulsePhase) * 0.3;

    // Glow
    const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, dp.size * 6 * pulse);
    glowGrad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.4 * alpha})`);
    glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, dp.size * 6 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Core dot
    ctx.beginPath();
    ctx.arc(p.x, p.y, dp.size * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
    ctx.shadowColor = CONFIG.pointColor;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Expanding ring
    const ringPhase = (time * 0.001 + dp.pulsePhase) % 3;
    if (ringPhase < 2) {
      const ringT = ringPhase / 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, dp.size + ringT * 15, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${(1 - ringT) * 0.3 * alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

function drawArcs(time) {
  const rgb = hexToRgb(CONFIG.arcColor);

  arcs.forEach(arc => {
    const fromPt = dataPoints[arc.from];
    const toPt = dataPoints[arc.to];
    if (!fromPt || !toPt) return;

    const from3D = project(fromPt.lat, fromPt.lon);
    const to3D = project(toPt.lat, toPt.lon);

    // Only draw if at least one end is visible
    if (from3D.z < -0.3 && to3D.z < -0.3) return;

    const alpha = Math.max(0, Math.min(1, Math.max(from3D.z, to3D.z) + 0.3));

    // Calculate arc height based on distance
    const dx = to3D.x - from3D.x;
    const dy = to3D.y - from3D.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const arcHeight = dist * 0.35;

    // Control point (midpoint raised)
    const midX = (from3D.x + to3D.x) / 2;
    const midY = (from3D.y + to3D.y) / 2 - arcHeight;

    // Draw arc path
    ctx.beginPath();
    ctx.moveTo(from3D.x, from3D.y);
    ctx.quadraticCurveTo(midX, midY, to3D.x, to3D.y);
    ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.25 * alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Traveling pulse along arc
    arc.progress = (arc.progress + 0.003 * arc.speed) % 1;
    const t = arc.progress;
    const pulseX = (1 - t) * (1 - t) * from3D.x + 2 * (1 - t) * t * midX + t * t * to3D.x;
    const pulseY = (1 - t) * (1 - t) * from3D.y + 2 * (1 - t) * t * midY + t * t * to3D.y;

    // Pulse glow
    const pulseGrad = ctx.createRadialGradient(pulseX, pulseY, 0, pulseX, pulseY, 8);
    pulseGrad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.8 * alpha})`);
    pulseGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.beginPath();
    ctx.arc(pulseX, pulseY, 8, 0, Math.PI * 2);
    ctx.fillStyle = pulseGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pulseX, pulseY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
    ctx.shadowColor = CONFIG.arcColor;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Trail behind pulse
    const trailSteps = 8;
    for (let i = 1; i <= trailSteps; i++) {
      const tt = (t - i * 0.015 + 1) % 1;
      const tx = (1 - tt) * (1 - tt) * from3D.x + 2 * (1 - tt) * tt * midX + tt * tt * to3D.x;
      const ty = (1 - tt) * (1 - tt) * from3D.y + 2 * (1 - tt) * tt * midY + tt * tt * to3D.y;
      ctx.beginPath();
      ctx.arc(tx, ty, 1.5 * (1 - i / trailSteps), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${(1 - i / trailSteps) * 0.4 * alpha})`;
      ctx.fill();
    }
  });
}

function drawSatellite(time) {
  const speed = 0.4;
  satellite.angle += 0.008 * speed;
  const orbitRadius = radius * 1.25;
  const tilt = satellite.tilt;

  const sx = Math.cos(satellite.angle) * orbitRadius;
  const sy = Math.sin(satellite.angle) * orbitRadius * Math.sin(tilt);
  const sz = Math.sin(satellite.angle) * orbitRadius * Math.cos(tilt);

  // Only draw when in front
  const screenX = cx + sx;
  const screenY = cy + sy;
  const visible = sz > 0 || Math.abs(sx) > radius * 0.8;

  // Orbit path (dashed)
  ctx.beginPath();
  ctx.setLineDash([3, 6]);
  ctx.ellipse(cx, cy, orbitRadius, orbitRadius * Math.sin(tilt), 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(100, 150, 200, 0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);

  // Satellite dot
  if (visible) {
    ctx.beginPath();
    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Trail
    for (let i = 1; i <= 12; i++) {
      const ta = satellite.angle - i * 0.025;
      const tx = cx + Math.cos(ta) * orbitRadius;
      const ty = cy + Math.sin(ta) * orbitRadius * Math.sin(tilt);
      ctx.beginPath();
      ctx.arc(tx, ty, 1.5 * (1 - i / 12), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${(1 - i / 12) * 0.3})`;
      ctx.fill();
    }
  }
}

function drawHUD(time) {
  const fontSize = Math.max(10, radius * 0.055);
  ctx.font = `${fontSize}px monospace`;
  ctx.fillStyle = 'rgba(100, 200, 255, 0.35)';
  ctx.textAlign = 'left';

  const y = cy - radius - fontSize * 3;
  ctx.fillText(`NODES: ${CONFIG.pointCount}  |  LINKS: ${CONFIG.arcCount}  |  STATUS: ACTIVE`, cx - radius, y);

  ctx.textAlign = 'right';
  const elapsed = Math.floor(time / 1000);
  const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const secs = String(elapsed % 60).padStart(2, '0');
  ctx.fillText(`${hrs}:${mins}:${secs} UTC`, cx + radius, y);

  // Bottom label
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(100, 200, 255, 0.25)';
  ctx.fillText('GLOBAL DATA NETWORK', cx, cy + radius + fontSize * 3);
}

function animate(time) {
  if (!lastTime) lastTime = time;
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  rotY += dt * CONFIG.rotationSpeed;

  drawBackground(time);
  drawWireframe();
  drawDataPoints(time);
  drawArcs(time);
  drawSatellite(time);
  drawHUD(time);

  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    generateDataPoints();
    generateArcs();
  }
});

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceless Kinetic Typography</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; }
.word-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; padding: 8%; gap: 1.5vmin; align-content: center; }
.word { font-weight: 900; opacity: 0; transform: translateY(30px) scale(0.7); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: inline-block; }
.word.show { opacity: 1; transform: translateY(0) scale(1); }
.word.emphasis { transform: translateY(0) scale(1.15); color: var(--secondary); }
.bg-accent { position: absolute; width: 100%; height: 100%; opacity: 0.03; background: radial-gradient(circle at 50% 50%, var(--primary), transparent 70%); }
</style>
</head>
<body>
<div class="bg-accent"></div>
<div class="word-container" id="words"></div>
<script>
const CONFIG = {
  words: ['Every', 'great', 'story', 'starts', 'with', 'a', 'single', 'WORD'],
  primaryColor: '#6366f1',
  secondaryColor: '#f59e0b',
  bgColor: '#0a0a0a',
  textColor: '#ffffff',
  wordIntervalMs: 300
};

document.body.style.background = CONFIG.bgColor;
document.documentElement.style.setProperty('--primary', CONFIG.primaryColor);
document.documentElement.style.setProperty('--secondary', CONFIG.secondaryColor);

const container = document.getElementById('words');
let wordEls = [];

function isEmphasis(word) {
  return word === word.toUpperCase() && word.length > 1 && /[A-Z]/.test(word);
}

function buildWords() {
  container.innerHTML = '';
  const fontSize = CONFIG.words.length <= 5 ? '8vmin' : CONFIG.words.length <= 10 ? '6vmin' : '4.5vmin';
  wordEls = CONFIG.words.map(word => {
    const el = document.createElement('span');
    el.className = 'word';
    el.textContent = word;
    el.style.fontSize = fontSize;
    el.style.color = isEmphasis(word) ? CONFIG.secondaryColor : CONFIG.textColor;
    container.appendChild(el);
    return el;
  });
}

function revealWords() {
  wordEls.forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('show');
      if (isEmphasis(CONFIG.words[i])) {
        setTimeout(() => el.classList.add('emphasis'), 100);
      }
    }, i * CONFIG.wordIntervalMs);
  });
}

buildWords();
setTimeout(revealWords, 400);

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    document.body.style.background = CONFIG.bgColor;
    document.documentElement.style.setProperty('--primary', CONFIG.primaryColor);
    document.documentElement.style.setProperty('--secondary', CONFIG.secondaryColor);
    buildWords();
    setTimeout(revealWords, 200);
  }
});
</script>
</body>
</html>

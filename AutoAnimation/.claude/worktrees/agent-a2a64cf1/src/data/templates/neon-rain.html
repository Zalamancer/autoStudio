<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #050510;
  }
  canvas#rainCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .neon-sign {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; pointer-events: none;
  }
  .neon-sign h1 {
    font-size: 52px; font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: #fff;
    text-shadow:
      0 0 7px #fff, 0 0 10px #fff,
      0 0 21px #fff, 0 0 42px #ff2d95,
      0 0 82px #ff2d95, 0 0 92px #ff2d95,
      0 0 102px #ff2d95, 0 0 151px #ff2d95;
    animation: neonFlicker 4s ease-in-out infinite;
  }
  .neon-sign .sub {
    font-size: 14px; letter-spacing: 10px; color: #0ff;
    text-shadow: 0 0 7px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
    margin-top: 10px; opacity: 0.8;
    animation: neonFlicker 4s ease-in-out infinite 1.5s;
  }
  @keyframes neonFlicker {
    0%, 100% { opacity: 1; }
    41% { opacity: 1; }
    42% { opacity: 0.7; }
    43% { opacity: 1; }
    76% { opacity: 1; }
    77% { opacity: 0.6; }
    78% { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="rainCanvas"></canvas>
<div class="neon-sign">
  <h1 id="mainTitle">NEON</h1>
  <div class="sub" id="subTitle">CITY NIGHTS</div>
</div>

<script>
// ===== EDITABLE VARIABLES =====
const TITLE_TEXT = 'NEON';
const SUBTITLE_TEXT = 'CITY NIGHTS';
const BG_COLOR = '#050510';
const RAIN_COLORS = ['#ff2d95', '#00ffff', '#39ff14', '#bf5fff', '#ff6b35'];
const RAIN_COUNT = 180;
const LIGHTNING_INTERVAL = 6000;
const REFLECTION_HEIGHT = 0.2;
const RAIN_SPEED_MIN = 4;
const RAIN_SPEED_MAX = 12;
// ==============================

document.getElementById('mainTitle').textContent = TITLE_TEXT;
document.getElementById('subTitle').textContent = SUBTITLE_TEXT;

const canvas = document.getElementById('rainCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

class RainDrop {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H * -1 : -Math.random() * 60;
    this.speed = RAIN_SPEED_MIN + Math.random() * (RAIN_SPEED_MAX - RAIN_SPEED_MIN);
    this.length = 15 + Math.random() * 35;
    this.width = 1 + Math.random() * 2;
    this.colorIdx = Math.floor(Math.random() * RAIN_COLORS.length);
    this.opacity = 0.3 + Math.random() * 0.7;
    this.glowSize = 2 + Math.random() * 4;
  }
  update() {
    this.y += this.speed;
    if (this.y > H * (1 - REFLECTION_HEIGHT) + 10) this.reset(false);
  }
  draw() {
    const color = RAIN_COLORS[this.colorIdx];
    const r = parseInt(color.slice(1,3),16);
    const g = parseInt(color.slice(3,5),16);
    const b = parseInt(color.slice(5,7),16);
    // Glow trail
    ctx.save();
    ctx.globalAlpha = this.opacity * 0.3;
    ctx.shadowColor = color;
    ctx.shadowBlur = this.glowSize * 3;
    ctx.strokeStyle = `rgba(${r},${g},${b},0.6)`;
    ctx.lineWidth = this.width + 1;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x, this.y - this.length * 1.5);
    ctx.stroke();
    ctx.restore();
    // Main streak
    const grad = ctx.createLinearGradient(this.x, this.y - this.length, this.x, this.y);
    grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
    grad.addColorStop(0.6, `rgba(${r},${g},${b},${this.opacity * 0.8})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},${this.opacity})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y - this.length);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    // Bright tip
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.width * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${this.opacity * 0.9})`;
    ctx.fill();
  }
  drawReflection() {
    const reflY = H * (1 - REFLECTION_HEIGHT);
    if (this.y < reflY - 20) return;
    const color = RAIN_COLORS[this.colorIdx];
    const r = parseInt(color.slice(1,3),16);
    const g = parseInt(color.slice(3,5),16);
    const b = parseInt(color.slice(5,7),16);
    const mirrorY = reflY + (reflY - this.y) * -0.4;
    const fadeLen = this.length * 0.6;
    const grad = ctx.createLinearGradient(this.x, mirrorY, this.x, mirrorY + fadeLen);
    grad.addColorStop(0, `rgba(${r},${g},${b},${this.opacity * 0.25})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.width * 1.5;
    ctx.beginPath();
    ctx.moveTo(this.x, mirrorY);
    ctx.lineTo(this.x, mirrorY + fadeLen);
    ctx.stroke();
  }
}

const drops = [];
for (let i = 0; i < RAIN_COUNT; i++) drops.push(new RainDrop());

let lightningAlpha = 0;
let lastLightning = 0;

function triggerLightning(t) {
  if (t - lastLightning > LIGHTNING_INTERVAL + Math.random() * 3000) {
    lightningAlpha = 0.8 + Math.random() * 0.2;
    lastLightning = t;
  }
}

function drawWetSurface() {
  const reflY = H * (1 - REFLECTION_HEIGHT);
  const grad = ctx.createLinearGradient(0, reflY, 0, H);
  grad.addColorStop(0, 'rgba(5,5,16,0.3)');
  grad.addColorStop(0.1, 'rgba(20,20,40,0.6)');
  grad.addColorStop(1, 'rgba(5,5,16,0.95)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, reflY, W, H - reflY);
  // Subtle horizontal streaks for wet look
  for (let i = 0; i < 15; i++) {
    const y = reflY + Math.random() * (H - reflY);
    const col = RAIN_COLORS[Math.floor(Math.random() * RAIN_COLORS.length)];
    const r = parseInt(col.slice(1,3),16);
    const g = parseInt(col.slice(3,5),16);
    const b = parseInt(col.slice(5,7),16);
    ctx.globalAlpha = 0.03 + Math.random() * 0.04;
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const sx = Math.random() * W;
    ctx.moveTo(sx, y);
    ctx.lineTo(sx + 30 + Math.random() * 80, y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function animate(t) {
  // Background
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);

  // Lightning flash
  triggerLightning(t);
  if (lightningAlpha > 0.01) {
    ctx.fillStyle = `rgba(200,200,255,${lightningAlpha * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    lightningAlpha *= 0.92;
  }

  // Wet surface base
  drawWetSurface();

  // Draw reflections first (behind rain)
  ctx.globalCompositeOperation = 'screen';
  drops.forEach(d => d.drawReflection());
  ctx.globalCompositeOperation = 'source-over';

  // Update and draw rain
  drops.forEach(d => {
    d.update();
    d.draw();
  });

  // Lightning overlay glow
  if (lightningAlpha > 0.05) {
    ctx.fillStyle = `rgba(180,180,255,${lightningAlpha * 0.08})`;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

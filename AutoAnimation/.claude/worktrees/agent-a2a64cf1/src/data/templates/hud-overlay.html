<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUD Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: rgba(10, 12, 20, 0.85);
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    color: #fff;
  }
  .hud {
    width: 100%; height: 100%;
    position: relative;
  }

  /* Health bar */
  .health-area {
    position: absolute;
    top: 3vh; left: 3vw;
  }
  .health-label {
    font-size: 1.1vh;
    color: #889;
    letter-spacing: 0.15em;
    margin-bottom: 0.4vh;
  }
  .health-bar {
    width: 25vw;
    height: 1.2vh;
    background: rgba(255,255,255,0.08);
    border-radius: 0.6vh;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .health-fill {
    height: 100%;
    background: linear-gradient(90deg, #cc0000, #ff3333);
    border-radius: 0.6vh;
    transition: width 0.5s ease;
    box-shadow: 0 0 8px rgba(204,0,0,0.4);
  }
  .health-text {
    font-size: 1.5vh;
    font-weight: 800;
    margin-top: 0.3vh;
    font-variant-numeric: tabular-nums;
    color: #ff4444;
    text-shadow: 0 0 5px rgba(255,0,0,0.3);
  }

  /* Shield bar */
  .shield-bar {
    width: 25vw;
    height: 0.6vh;
    background: rgba(255,255,255,0.05);
    border-radius: 0.3vh;
    overflow: hidden;
    margin-top: 0.4vh;
  }
  .shield-fill {
    height: 100%;
    background: linear-gradient(90deg, #2962ff, #448aff);
    border-radius: 0.3vh;
    transition: width 0.5s ease;
    box-shadow: 0 0 6px rgba(41,98,255,0.3);
  }

  /* Compass */
  .compass {
    position: absolute;
    top: 3vh;
    left: 50%;
    transform: translateX(-50%);
    width: 30vw;
    height: 3vh;
    overflow: hidden;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .compass-strip {
    display: flex;
    align-items: flex-end;
    height: 100%;
    position: relative;
    transition: transform 0.3s ease;
  }
  .compass-tick {
    flex-shrink: 0;
    text-align: center;
    font-size: 0.9vh;
    color: rgba(255,255,255,0.3);
    width: 5vw;
  }
  .compass-tick.cardinal {
    color: #fff;
    font-weight: 700;
    font-size: 1.2vh;
  }
  .compass-center {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 100%;
    background: rgba(255,100,100,0.6);
  }

  /* Crosshair */
  .crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 4vh; height: 4vh;
  }
  .cross-line {
    position: absolute;
    background: rgba(255,255,255,0.5);
  }
  .cross-line.h { width: 1.2vh; height: 1px; top: 50%; }
  .cross-line.h.l { left: 0; }
  .cross-line.h.r { right: 0; }
  .cross-line.v { height: 1.2vh; width: 1px; left: 50%; }
  .cross-line.v.t { top: 0; }
  .cross-line.v.b { bottom: 0; }
  .cross-dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
  }

  /* Ammo */
  .ammo-area {
    position: absolute;
    bottom: 5vh; right: 3vw;
    text-align: right;
  }
  .ammo-current {
    font-size: 5vh;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }
  .ammo-divider {
    font-size: 2vh;
    color: #556;
    margin: 0 0.3vw;
  }
  .ammo-reserve {
    font-size: 2vh;
    font-weight: 600;
    color: #889;
    font-variant-numeric: tabular-nums;
  }
  .weapon-name {
    font-size: 1.1vh;
    color: #556;
    letter-spacing: 0.1em;
    margin-top: 0.3vh;
  }

  /* Minimap */
  .minimap {
    position: absolute;
    bottom: 5vh; left: 3vw;
    width: 15vh; height: 15vh;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .minimap-grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 15% 15%;
  }
  .minimap-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1vh; height: 1vh;
    background: #4488ff;
    border-radius: 50%;
    box-shadow: 0 0 6px #4488ff;
  }
  .minimap-dot {
    position: absolute;
    width: 0.6vh; height: 0.6vh;
    border-radius: 50%;
    transition: top 0.5s linear, left 0.5s linear;
  }
  .minimap-dot.ally { background: #4488ff; }
  .minimap-dot.enemy { background: #ff4444; }

  /* Objective */
  .objective {
    position: absolute;
    top: 35%;
    right: 5vw;
    display: flex;
    align-items: center;
    gap: 0.8vw;
    opacity: 0;
    animation: objectivePulse 3s ease-in-out infinite;
  }
  @keyframes objectivePulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  .obj-marker {
    width: 2vh; height: 2vh;
    border: 2px solid #ffcc00;
    transform: rotate(45deg);
  }
  .obj-text {
    font-size: 1.2vh;
    color: #ffcc00;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .obj-distance {
    font-size: 1vh;
    color: #998;
    font-variant-numeric: tabular-nums;
  }

  /* XP Bar */
  .xp-area {
    position: absolute;
    bottom: 2vh;
    left: 22vw; right: 22vw;
  }
  .xp-label {
    font-size: 0.9vh;
    color: #556;
    letter-spacing: 0.1em;
    display: flex;
    justify-content: space-between;
  }
  .xp-bar {
    width: 100%;
    height: 0.4vh;
    background: rgba(255,255,255,0.05);
    border-radius: 0.2vh;
    overflow: hidden;
    margin-top: 0.3vh;
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, #9b59b6, #8e44ad);
    border-radius: 0.2vh;
    transition: width 2s ease;
    box-shadow: 0 0 5px rgba(155,89,182,0.4);
  }

  /* Damage vignette */
  .damage-vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(200,0,0,0.4) 100%);
  }
  .damage-vignette.active { opacity: 1; }

  /* Kill feed */
  .kill-feed {
    position: absolute;
    top: 10vh; right: 3vw;
    display: flex;
    flex-direction: column;
    gap: 0.5vh;
  }
  .kill-entry {
    font-size: 1vh;
    color: #aab;
    background: rgba(0,0,0,0.4);
    padding: 0.3vh 1vw;
    border-radius: 0.3vh;
    opacity: 0;
    transform: translateX(20px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .kill-entry.visible { opacity: 1; transform: translateX(0); }
  .kill-name { color: #4488ff; font-weight: 700; }
  .kill-icon { color: #ff4444; margin: 0 0.5vw; }
</style>
</head>
<body>
<div class="hud">
  <!-- Health -->
  <div class="health-area">
    <div class="health-label">HEALTH</div>
    <div class="health-bar">
      <div class="health-fill" id="healthFill" style="width: 100%;"></div>
    </div>
    <div class="shield-bar">
      <div class="shield-fill" id="shieldFill" style="width: 75%;"></div>
    </div>
    <div class="health-text" id="healthText">100</div>
  </div>

  <!-- Compass -->
  <div class="compass">
    <div class="compass-strip" id="compassStrip"></div>
    <div class="compass-center"></div>
  </div>

  <!-- Crosshair -->
  <div class="crosshair">
    <div class="cross-line h l"></div>
    <div class="cross-line h r"></div>
    <div class="cross-line v t"></div>
    <div class="cross-line v b"></div>
    <div class="cross-dot"></div>
  </div>

  <!-- Objective -->
  <div class="objective">
    <div class="obj-marker"></div>
    <div>
      <div class="obj-text" id="objText">CAPTURE POINT A</div>
      <div class="obj-distance" id="objDist">142m</div>
    </div>
  </div>

  <!-- Ammo -->
  <div class="ammo-area">
    <span class="ammo-current" id="ammoCurrent">30</span>
    <span class="ammo-divider">/</span>
    <span class="ammo-reserve" id="ammoReserve">120</span>
    <div class="weapon-name" id="weaponName">M4A1 CARBINE</div>
  </div>

  <!-- Minimap -->
  <div class="minimap">
    <div class="minimap-grid"></div>
    <div class="minimap-center"></div>
    <div class="minimap-dot ally" id="ally1" style="top:30%;left:40%;"></div>
    <div class="minimap-dot ally" id="ally2" style="top:60%;left:55%;"></div>
    <div class="minimap-dot ally" id="ally3" style="top:45%;left:70%;"></div>
    <div class="minimap-dot enemy" id="enemy1" style="top:20%;left:65%;"></div>
    <div class="minimap-dot enemy" id="enemy2" style="top:70%;left:30%;"></div>
  </div>

  <!-- XP -->
  <div class="xp-area">
    <div class="xp-label">
      <span>LVL 42</span>
      <span id="xpText">7,250 / 10,000 XP</span>
    </div>
    <div class="xp-bar">
      <div class="xp-fill" id="xpFill" style="width: 0%;"></div>
    </div>
  </div>

  <!-- Kill feed -->
  <div class="kill-feed" id="killFeed"></div>

  <!-- Damage vignette -->
  <div class="damage-vignette" id="damageVignette"></div>
</div>

<script>
  // === EDITABLE CONFIG ===
  const CONFIG = {
    maxHealth: 100,
    maxShield: 75,
    maxAmmo: 30,
    reserveAmmo: 120,
    weaponName: 'M4A1 CARBINE',
    objectiveText: 'CAPTURE POINT A',
    level: 42,
    xpCurrent: 7250,
    xpMax: 10000,
    compassDirections: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'],
    killFeedEntries: [
      { killer: 'N0MERCY', victim: 'ShadowFox' },
      { killer: 'BladeRun', victim: 'IceQueen' },
      { killer: 'You', victim: 'PhantomX' },
      { killer: 'VortexK', victim: 'NightOwl' }
    ],
    cycleDuration: 10000
  };

  document.getElementById('weaponName').textContent = CONFIG.weaponName;
  document.getElementById('objText').textContent = CONFIG.objectiveText;
  document.getElementById('xpText').textContent = `${CONFIG.xpCurrent.toLocaleString()} / ${CONFIG.xpMax.toLocaleString()} XP`;

  const healthFill = document.getElementById('healthFill');
  const healthText = document.getElementById('healthText');
  const shieldFill = document.getElementById('shieldFill');
  const ammoCurrent = document.getElementById('ammoCurrent');
  const xpFill = document.getElementById('xpFill');
  const damageVignette = document.getElementById('damageVignette');
  const objDist = document.getElementById('objDist');
  const killFeed = document.getElementById('killFeed');

  // Build compass
  const compassStrip = document.getElementById('compassStrip');
  const dirs = CONFIG.compassDirections;
  for (let i = 0; i < dirs.length * 3; i++) {
    const tick = document.createElement('div');
    tick.className = 'compass-tick' + (dirs[i % dirs.length].length === 1 ? ' cardinal' : '');
    tick.textContent = dirs[i % dirs.length];
    compassStrip.appendChild(tick);
  }

  // Minimap dots
  const dots = {
    ally: [document.getElementById('ally1'), document.getElementById('ally2'), document.getElementById('ally3')],
    enemy: [document.getElementById('enemy1'), document.getElementById('enemy2')]
  };

  let health = CONFIG.maxHealth;
  let shield = CONFIG.maxShield;
  let ammo = CONFIG.maxAmmo;
  let compassOffset = 0;
  let distance = 142;
  let xp = 0;
  let frame = 0;

  function flashDamage() {
    damageVignette.classList.add('active');
    setTimeout(() => damageVignette.classList.remove('active'), 200);
  }

  function addKillEntry(entry, delay) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'kill-entry';
      const isYou = entry.killer === 'You';
      el.innerHTML = `<span class="kill-name" style="${isYou ? 'color:#ffcc00;' : ''}">${entry.killer}</span><span class="kill-icon">\u2694</span><span>${entry.victim}</span>`;
      killFeed.appendChild(el);
      requestAnimationFrame(() => el.classList.add('visible'));
      setTimeout(() => {
        el.classList.remove('visible');
        setTimeout(() => el.remove(), 400);
      }, 3000);
    }, delay);
  }

  function moveDots() {
    [...dots.ally, ...dots.enemy].forEach(dot => {
      const newTop = 15 + Math.random() * 70;
      const newLeft = 15 + Math.random() * 70;
      dot.style.top = newTop + '%';
      dot.style.left = newLeft + '%';
    });
  }

  function update() {
    frame++;

    // Health fluctuation (simulate damage and regen)
    if (frame % 120 === 0 && Math.random() > 0.3) {
      const dmg = 15 + Math.random() * 25;
      if (shield > 0) {
        shield = Math.max(0, shield - dmg);
      } else {
        health = Math.max(10, health - dmg);
      }
      flashDamage();
    }
    if (frame % 60 === 0) {
      health = Math.min(CONFIG.maxHealth, health + 2);
      shield = Math.min(CONFIG.maxShield, shield + 1);
    }

    healthFill.style.width = (health / CONFIG.maxHealth * 100) + '%';
    healthText.textContent = Math.round(health);
    shieldFill.style.width = (shield / CONFIG.maxShield * 100) + '%';

    // Ammo (shoot then reload)
    if (frame % 15 === 0 && ammo > 0) {
      ammo--;
    }
    if (ammo === 0) {
      setTimeout(() => { ammo = CONFIG.maxAmmo; }, 1500);
    }
    ammoCurrent.textContent = ammo;

    // Compass drift
    compassOffset += 0.3;
    compassStrip.style.transform = `translateX(${-compassOffset % (5 * dirs.length * 3)}px)`;

    // Distance change
    if (frame % 30 === 0) {
      distance = Math.max(10, distance + Math.round((Math.random() - 0.6) * 8));
      objDist.textContent = distance + 'm';
    }

    // XP bar
    if (xp < CONFIG.xpCurrent / CONFIG.xpMax * 100) {
      xp += 0.5;
      xpFill.style.width = xp + '%';
    }

    // Move minimap dots
    if (frame % 90 === 0) moveDots();
  }

  // Kill feed entries
  CONFIG.killFeedEntries.forEach((entry, i) => {
    addKillEntry(entry, 2000 + i * 2500);
  });

  // Repeat kill feed
  setInterval(() => {
    CONFIG.killFeedEntries.forEach((entry, i) => {
      addKillEntry(entry, i * 2500);
    });
  }, CONFIG.cycleDuration);

  function gameLoop() {
    update();
    requestAnimationFrame(gameLoop);
  }
  gameLoop();
</script>
</body>
</html>

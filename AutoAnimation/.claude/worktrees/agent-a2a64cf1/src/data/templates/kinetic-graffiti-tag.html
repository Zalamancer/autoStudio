<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graffiti Tag - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #2a2a2a; font-family: 'Arial Black', 'Impact', sans-serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size: 200px 200px; }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .splatter { position: absolute; border-radius: 50%; pointer-events: none; z-index: 1; }

  @keyframes sprayIn { 0% { opacity: 0; clip-path: inset(0 100% 0 0); filter: blur(3px); } 60% { filter: blur(0); } 100% { opacity: 1; clip-path: inset(0 0% 0 0); } }
  @keyframes sprayOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); filter: blur(3px); } }
  @keyframes splatAnim { 0% { opacity: 0.6; transform: scale(0); } 100% { opacity: 0; transform: scale(1); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['REBEL','KINGS','FRESH','STYLE','BOMBIN','DOPE','URBAN','WILDSTYLE'],
  bgColor: '#2a2a2a',
  fontFamily: "'Arial Black', 'Impact', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const grafColors = ['#ff1493','#00ff7f','#ff6600','#00bfff','#ffff00','#ff3366','#7cfc00','#ff4500'];

function spawnSplatters(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div'); s.className = 'splatter';
    const sz = 4 + Math.random() * 10;
    s.style.cssText = `left:${x+(Math.random()-0.5)*60}px;top:${y+(Math.random()-0.5)*30}px;width:${sz}px;height:${sz}px;background:${color};animation:splatAnim ${300+Math.random()*200}ms ease-out forwards;`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 600);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 67 + 21);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(38 + rng() * 28, cellW * 0.38, cellH * 0.5);
    const color = grafColors[i % grafColors.length];
    const rot = (rng() - 0.5) * 15;
    const skew = (rng() - 0.5) * 8;
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:${color};text-shadow:3px 3px 0 rgba(0,0,0,0.5),-1px -1px 0 rgba(0,0,0,0.3);letter-spacing:2px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%) rotate(${rot}deg) skewX(${skew}deg);`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2, color });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=280, inD=500, hold=3000, outS=200, outD=400, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`sprayIn ${inD}ms ease-out forwards`;spawnSplatters(item.x,item.y,item.color);}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`sprayOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

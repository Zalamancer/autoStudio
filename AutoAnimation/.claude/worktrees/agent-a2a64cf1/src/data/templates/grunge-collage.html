<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grunge Collage Motion Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Impact', 'Arial Black', sans-serif;
  }

  .noise-overlay {
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    animation: noiseShift 0.5s steps(5) infinite;
    opacity: 0.4;
  }
  @keyframes noiseShift {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-2%, 1%); }
    40% { transform: translate(1%, -2%); }
    60% { transform: translate(-1%, 2%); }
    80% { transform: translate(2%, -1%); }
    100% { transform: translate(0, 0); }
  }

  .torn-paper {
    position: absolute;
    background: #e8e0d4;
    clip-path: polygon(
      0% 5%, 8% 0%, 15% 4%, 25% 1%, 33% 5%, 42% 0%, 50% 3%, 58% 0%, 67% 4%, 75% 1%, 83% 5%, 92% 0%, 100% 3%,
      100% 95%, 92% 100%, 83% 96%, 75% 100%, 67% 95%, 58% 100%, 50% 97%, 42% 100%, 33% 96%, 25% 100%, 15% 95%, 8% 100%, 0% 97%
    );
  }

  .stamp {
    position: absolute;
    font-size: 48px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #cc0000;
    border: 4px solid #cc0000;
    padding: 8px 20px;
    opacity: 0.85;
    mix-blend-mode: multiply;
  }

  .stamp.black {
    color: #000;
    border-color: #000;
  }

  .tape {
    position: absolute;
    background: rgba(200, 180, 120, 0.5);
    height: 28px;
    transform-origin: center;
  }

  .splatter {
    position: absolute;
    border-radius: 50%;
    background: #cc0000;
    filter: blur(1px);
  }

  .text-block {
    position: absolute;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #333;
    line-height: 1.4;
    padding: 12px;
    background: #e8e0d4;
  }

  .redline {
    position: absolute;
    height: 3px;
    background: #cc0000;
  }

  .circle-stamp {
    position: absolute;
    border: 3px solid #cc0000;
    border-radius: 50%;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #cc0000;
    text-transform: uppercase;
    letter-spacing: 2px;
    transform: rotate(-15deg);
  }

  .x-mark {
    position: absolute;
    font-size: 120px;
    font-weight: 900;
    color: #cc0000;
    opacity: 0.3;
    line-height: 1;
  }

  @keyframes stampIn {
    0% { transform: scale(3) rotate(var(--rot)); opacity: 0; }
    15% { transform: scale(1) rotate(var(--rot)); opacity: 0.85; }
    100% { transform: scale(1) rotate(var(--rot)); opacity: 0.85; }
  }

  @keyframes slideIn {
    0% { transform: translateX(var(--dir)) rotate(var(--rot)); opacity: 0; }
    15% { transform: translateX(0) rotate(var(--rot)); opacity: 1; }
    85% { transform: translateX(0) rotate(var(--rot)); opacity: 1; }
    100% { transform: translateX(calc(var(--dir) * -1)) rotate(var(--rot)); opacity: 0; }
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 0.85; }
    96% { opacity: 0.3; }
    97% { opacity: 0.7; }
    98% { opacity: 0.2; }
  }

  @keyframes splatGrow {
    0% { transform: scale(0); opacity: 0; }
    20% { transform: scale(1.3); opacity: 0.8; }
    30% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1); opacity: 0.6; }
  }
</style>
</head>
<body>

<div class="noise-overlay"></div>

<canvas id="bg"></canvas>
<div id="elements"></div>

<script>
  // === EDITABLE VARIABLES ===
  const CONFIG = {
    bgColor: '#0a0a0a',
    primaryRed: '#cc0000',
    paperColor: '#e8e0d4',
    stampTexts: ['REBEL', 'CHAOS', 'RAW', 'RIOT', 'NOISE', 'RAGE', 'PUNK', 'GRIT'],
    cycleTime: 4000,
    maxElements: 15,
  };

  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('elements');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max)); }
  function pick(arr) { return arr[randInt(0, arr.length)]; }

  // Draw distressed background
  function drawBg() {
    ctx.fillStyle = CONFIG.bgColor;
    ctx.fillRect(0, 0, W, H);

    // Random dark scratches
    for (let i = 0; i < 40; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${rand(0.02, 0.06)})`;
      ctx.lineWidth = rand(0.5, 2);
      ctx.beginPath();
      const x = rand(0, W);
      const y = rand(0, H);
      ctx.moveTo(x, y);
      ctx.lineTo(x + rand(-100, 100), y + rand(-100, 100));
      ctx.stroke();
    }
  }

  drawBg();

  function createStamp() {
    const el = document.createElement('div');
    el.className = `stamp ${Math.random() > 0.5 ? '' : 'black'}`;
    el.textContent = pick(CONFIG.stampTexts);
    const rot = rand(-25, 25);
    el.style.cssText = `
      left: ${rand(5, 60)}%;
      top: ${rand(10, 70)}%;
      --rot: ${rot}deg;
      font-size: ${rand(28, 64)}px;
      animation: stampIn ${rand(3, 5)}s ease-out forwards;
      transform: rotate(${rot}deg);
    `;
    return el;
  }

  function createTornPaper() {
    const el = document.createElement('div');
    el.className = 'torn-paper';
    const w = rand(120, 300);
    const h = rand(80, 200);
    const rot = rand(-20, 20);
    el.style.cssText = `
      left: ${rand(0, 70)}%;
      top: ${rand(0, 70)}%;
      width: ${w}px;
      height: ${h}px;
      --dir: ${Math.random() > 0.5 ? '100vw' : '-100vw'};
      --rot: ${rot}deg;
      animation: slideIn ${rand(4, 7)}s ease-in-out forwards;
      transform: rotate(${rot}deg);
    `;
    // Add some fake text
    const inner = document.createElement('div');
    inner.style.cssText = 'padding:15px;font-family:Courier New,monospace;font-size:9px;color:#555;line-height:1.6;overflow:hidden;height:100%;';
    const lines = [];
    for (let i = 0; i < 8; i++) {
      lines.push('Lorem ipsum dolor sit amet '.repeat(randInt(1, 3)).trim());
    }
    inner.textContent = lines.join('\n');
    el.appendChild(inner);
    return el;
  }

  function createTape() {
    const el = document.createElement('div');
    el.className = 'tape';
    el.style.cssText = `
      left: ${rand(5, 80)}%;
      top: ${rand(5, 85)}%;
      width: ${rand(80, 200)}px;
      transform: rotate(${rand(-45, 45)}deg);
    `;
    return el;
  }

  function createSplatter() {
    const count = randInt(3, 8);
    const frag = document.createDocumentFragment();
    const cx = rand(10, 90);
    const cy = rand(10, 90);
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'splatter';
      const size = rand(4, 25);
      el.style.cssText = `
        left: ${cx + rand(-5, 5)}%;
        top: ${cy + rand(-5, 5)}%;
        width: ${size}px;
        height: ${size * rand(0.6, 1.4)}px;
        animation: splatGrow ${rand(3, 5)}s ease-out forwards;
        animation-delay: ${rand(0, 0.3)}s;
        border-radius: ${rand(30, 70)}% ${rand(30, 70)}% ${rand(30, 70)}% ${rand(30, 70)}%;
      `;
      frag.appendChild(el);
    }
    return frag;
  }

  function createRedLine() {
    const el = document.createElement('div');
    el.className = 'redline';
    const isHoriz = Math.random() > 0.3;
    if (isHoriz) {
      el.style.cssText = `
        left: 0; top: ${rand(10, 90)}%;
        width: 100%; height: 3px;
        transform: scaleX(0);
        transform-origin: left;
        animation: lineGrow 0.5s ease-out forwards;
      `;
    } else {
      el.style.cssText = `
        top: 0; left: ${rand(10, 90)}%;
        height: 100%; width: 3px;
        transform: scaleY(0);
        transform-origin: top;
        animation: lineGrow 0.5s ease-out forwards;
      `;
    }
    return el;
  }

  function createCircleStamp() {
    const el = document.createElement('div');
    el.className = 'circle-stamp';
    el.textContent = pick(['APPROVED', 'DENIED', 'VOID', 'REJECT', 'NO.1']);
    el.style.cssText = `
      left: ${rand(10, 75)}%;
      top: ${rand(10, 70)}%;
      --rot: ${rand(-30, 30)}deg;
      animation: stampIn ${rand(3, 5)}s ease-out forwards, flicker 4s infinite;
    `;
    return el;
  }

  function createXMark() {
    const el = document.createElement('div');
    el.className = 'x-mark';
    el.textContent = 'X';
    el.style.cssText = `
      left: ${rand(5, 80)}%;
      top: ${rand(5, 75)}%;
      font-size: ${rand(80, 180)}px;
      --rot: ${rand(-20, 20)}deg;
      animation: stampIn ${rand(2, 4)}s ease-out forwards;
      transform: rotate(${rand(-20, 20)}deg);
    `;
    return el;
  }

  // Add line grow animation
  const style = document.createElement('style');
  style.textContent = `
    @keyframes lineGrow {
      to { transform: scaleX(1) scaleY(1); }
    }
  `;
  document.head.appendChild(style);

  const creators = [
    createStamp, createStamp, createTornPaper, createTape,
    createSplatter, createRedLine, createCircleStamp, createXMark,
  ];

  let elements = [];

  function addElement() {
    const creator = pick(creators);
    const el = creator();

    if (el instanceof DocumentFragment) {
      container.appendChild(el);
      const children = Array.from(el.children || []);
      elements.push(...children);
    } else {
      container.appendChild(el);
      elements.push(el);
    }

    // Remove old elements
    while (elements.length > CONFIG.maxElements) {
      const old = elements.shift();
      if (old && old.parentNode) {
        old.style.transition = 'opacity 0.5s';
        old.style.opacity = '0';
        setTimeout(() => old.parentNode && old.parentNode.removeChild(old), 500);
      }
    }
  }

  // Initial burst
  for (let i = 0; i < 6; i++) {
    setTimeout(() => addElement(), i * 200);
  }

  // Continuous cycle
  setInterval(addElement, CONFIG.cycleTime / 3);

  // Periodically clear and rebuild for seamless looping feel
  setInterval(() => {
    drawBg();
  }, 5000);
</script>
</body>
</html>

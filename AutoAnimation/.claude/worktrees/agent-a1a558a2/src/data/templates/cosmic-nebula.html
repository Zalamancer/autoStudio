<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Nebula</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #020108;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas#nebula {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .center-text {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #E8D0FF;
  }
  .center-text h1 {
    font-size: 50px; font-weight: 100; letter-spacing: 18px; text-transform: uppercase;
    text-shadow: 0 0 40px rgba(180,100,255,0.4), 0 0 80px rgba(180,100,255,0.15);
    animation: cosmicPulse 7s ease-in-out infinite;
  }
  .center-text .subtitle {
    font-size: 13px; letter-spacing: 8px; opacity: 0.4; margin-top: 14px; text-transform: uppercase;
  }
  @keyframes cosmicPulse {
    0%, 100% { opacity: 0.5; letter-spacing: 18px; }
    50% { opacity: 1; letter-spacing: 20px; }
  }
</style>
</head>
<body>
<canvas id="nebula"></canvas>
<div class="center-text">
  <h1 id="mainTitle">Cosmos</h1>
  <div class="subtitle" id="subTitle">Infinite Wonder</div>
</div>

<script>
// ===== EDITABLE VARIABLES =====
const TITLE_TEXT = 'Cosmos';
const SUBTITLE_TEXT = 'Infinite Wonder';
const NEBULA_COLOR_1 = '#6B1FB1';
const NEBULA_COLOR_2 = '#1B3FA0';
const NEBULA_COLOR_3 = '#B13060';
const STAR_COUNT = 200;
const NEBULA_INTENSITY = 0.4;
// ==============================

document.getElementById('mainTitle').textContent = TITLE_TEXT;
document.getElementById('subTitle').textContent = SUBTITLE_TEXT;

const canvas = document.getElementById('nebula');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Stars
const stars = [];
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random() * 2000, y: Math.random() * 1200,
    r: Math.random() * 1.5 + 0.2,
    brightness: Math.random(),
    twinkle: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.015 + 0.003,
  });
}

// Nebula clouds
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

class NebulaCloud {
  constructor(color, cx, cy, rx, ry) {
    this.color = hexToRgb(color);
    this.cx = cx; this.cy = cy; this.rx = rx; this.ry = ry;
    this.phase = Math.random() * Math.PI * 2;
    this.driftX = (Math.random() - 0.5) * 0.1;
    this.driftY = (Math.random() - 0.5) * 0.06;
    this.pulseSpeed = 0.0003 + Math.random() * 0.0003;
  }
  draw(t) {
    const pulse = 0.8 + 0.2 * Math.sin(t * this.pulseSpeed + this.phase);
    const dx = Math.sin(t * 0.0002 + this.phase) * 20;
    const dy = Math.cos(t * 0.00015 + this.phase) * 15;
    const grad = ctx.createRadialGradient(
      this.cx + dx, this.cy + dy, 0,
      this.cx + dx, this.cy + dy, this.rx * pulse
    );
    const c = this.color;
    grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${NEBULA_INTENSITY * 0.6})`);
    grad.addColorStop(0.4, `rgba(${c.r},${c.g},${c.b},${NEBULA_INTENSITY * 0.3})`);
    grad.addColorStop(0.7, `rgba(${c.r},${c.g},${c.b},${NEBULA_INTENSITY * 0.1})`);
    grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(this.cx + dx, this.cy + dy, this.rx * pulse, this.ry * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

let clouds = [];
function initClouds() {
  clouds = [
    new NebulaCloud(NEBULA_COLOR_1, W * 0.35, H * 0.4, W * 0.35, H * 0.3),
    new NebulaCloud(NEBULA_COLOR_2, W * 0.65, H * 0.55, W * 0.3, H * 0.35),
    new NebulaCloud(NEBULA_COLOR_3, W * 0.5, H * 0.3, W * 0.25, H * 0.2),
    new NebulaCloud(NEBULA_COLOR_1, W * 0.2, H * 0.7, W * 0.2, H * 0.2),
    new NebulaCloud(NEBULA_COLOR_2, W * 0.8, H * 0.25, W * 0.2, H * 0.18),
  ];
}
initClouds();

// Shooting stars
const shootingStars = [];
function maybeSpawnShooting(t) {
  if (Math.random() > 0.997 && shootingStars.length < 3) {
    shootingStars.push({
      x: Math.random() * W, y: Math.random() * H * 0.3,
      vx: 4 + Math.random() * 4, vy: 2 + Math.random() * 2,
      life: 1, decay: 0.015 + Math.random() * 0.01,
    });
  }
}

function animate(t) {
  ctx.fillStyle = '#020108';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'screen';
  clouds.forEach(c => c.draw(t));
  ctx.globalCompositeOperation = 'source-over';

  // Stars
  stars.forEach(s => {
    s.twinkle += s.speed;
    const a = (0.3 + 0.7 * Math.abs(Math.sin(s.twinkle))) * s.brightness;
    const sx = s.x % W; const sy = s.y % H;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
    if (s.r > 1) {
      ctx.beginPath();
      ctx.arc(sx, sy, s.r * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,180,255,${a * 0.08})`;
      ctx.fill();
    }
  });

  // Shooting stars
  maybeSpawnShooting(t);
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
    if (s.life <= 0) { shootingStars.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 8, s.y - s.vy * 8);
    const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 8, s.y - s.vy * 8);
    grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
    grad.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .speedo {
    position: fixed; bottom: 5vh; right: 5vw; z-index: 10;
    width: 18vmin; height: 18vmin; pointer-events: none;
  }
  .speed-val {
    position: fixed; bottom: 6vh; right: 6vw; z-index: 11;
    color: #fff; font-size: 4.5vmin; font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px var(--neon, #0ff), 0 0 30px var(--neon, #0ff);
    letter-spacing: 0.05em; pointer-events: none;
  }
  .speed-unit {
    position: fixed; bottom: 4.5vh; right: 6.5vw; z-index: 11;
    color: rgba(255,255,255,0.45); font-size: 1.8vmin;
    letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none;
  }
  .boost-text {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 12; color: #fff; font-size: 6vmin; font-weight: 900;
    letter-spacing: 0.4em; text-transform: uppercase; opacity: 0;
    text-shadow: 0 0 30px var(--neon,#0ff), 0 0 60px var(--neon,#0ff);
    pointer-events: none; transition: opacity 0.15s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="speed-val" id="speedVal">0</div>
<div class="speed-unit">km/h</div>
<div class="boost-text" id="boostTxt">BOOST</div>

<script>
const CONFIG = {
  bgColor: '#05050f',
  neonColor: '#00e5ff',
  trailColor: '#ff3d00',
  speed: 1.0,
  vehicleColor: '#ffffff',
  gridColor: '#0ff',
  cycleDuration: 12000
};

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,cx,cy;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W/2;cy=H/2;}
resize();window.addEventListener('resize',resize);

function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgba(c,a){const r=hexRgb(c);return`rgba(${r[0]},${r[1]},${r[2]},${a})`;}

/* road state */
let roadOffset=0, boostPhase=0, currentSpeed=0;
const laneMarkers=[]; const gates=[]; const speedLines=[];

for(let i=0;i<30;i++) laneMarkers.push({z:i/30});
for(let i=0;i<4;i++) gates.push({z:i/4,passed:false});
for(let i=0;i<50;i++) speedLines.push({x:(Math.random()-0.5)*2,y:Math.random()*0.8-0.1,z:Math.random(),sp:0.5+Math.random()});

/* perspective projection */
function project(x,y,z){
  const d=1.0/(z+0.001);
  const scale=d*0.6;
  return{
    sx:cx+x*W*scale,
    sy:H*0.42+y*H*scale+H*0.15/(z+0.3),
    scale:scale
  };
}

/* draw grid floor */
function drawGrid(t,spd){
  const off=(t*spd*0.4)%0.1;
  ctx.strokeStyle=rgba(CONFIG.neonColor,0.12);ctx.lineWidth=1;
  // horizontal lines
  for(let z=0.02;z<2;z+=0.08){
    const zz=z+off;
    const left=project(-2,0,zz), right=project(2,0,zz);
    if(left.sy>H||left.sy<0) continue;
    ctx.globalAlpha=Math.max(0,1-zz/2);
    ctx.beginPath();ctx.moveTo(left.sx,left.sy);ctx.lineTo(right.sx,right.sy);ctx.stroke();
  }
  // vertical lines
  ctx.strokeStyle=rgba(CONFIG.neonColor,0.08);
  for(let x=-2;x<=2;x+=0.25){
    const near=project(x,0,0.02), far=project(x,0,2);
    ctx.beginPath();ctx.moveTo(near.sx,near.sy);ctx.lineTo(far.sx,far.sy);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* lane markers */
function drawLanes(t,spd){
  const off=(t*spd*0.5)%0.0333;
  ctx.shadowColor=CONFIG.neonColor;ctx.shadowBlur=8;
  for(let i=0;i<30;i++){
    let z=((i/30)+off)%1;
    z=z*2;
    // left marker
    [-0.45,0.45].forEach(lx=>{
      const p=project(lx,0,z);
      const sz=Math.max(1,12*p.scale);
      const al=Math.max(0,1-z/2);
      ctx.fillStyle=rgba(CONFIG.neonColor,al*0.9);
      ctx.fillRect(p.sx-sz/2,p.sy-sz*2/2,sz,sz*2);
    });
  }
  ctx.shadowBlur=0;
}

/* checkpoints / gates */
function drawGates(t,spd){
  const off=(t*spd*0.15)%0.25;
  ctx.shadowColor=CONFIG.neonColor;ctx.shadowBlur=15;
  for(let i=0;i<4;i++){
    let z=((i/4)+off)%1;
    z=z*2.2;
    if(z<0.05) continue;
    const left=project(-0.55,0,z), right=project(0.55,0,z);
    const top=project(0,-0.35,z);
    const al=Math.max(0,1-z/2.2);
    ctx.strokeStyle=rgba(CONFIG.neonColor,al*0.8);
    ctx.lineWidth=Math.max(1,4*left.scale);
    ctx.beginPath();
    ctx.moveTo(left.sx,left.sy);
    ctx.lineTo(project(-0.55,-0.35,z).sx,project(-0.55,-0.35,z).sy);
    ctx.lineTo(project(0.55,-0.35,z).sx,project(0.55,-0.35,z).sy);
    ctx.lineTo(right.sx,right.sy);
    ctx.stroke();
    // horizontal bar at top of gate
    ctx.strokeStyle=rgba(CONFIG.neonColor,al*0.5);
    ctx.lineWidth=Math.max(0.5,2*left.scale);
    const tl=project(-0.55,-0.35,z),tr=project(0.55,-0.35,z);
    ctx.beginPath();ctx.moveTo(tl.sx,tl.sy);ctx.lineTo(tr.sx,tr.sy);ctx.stroke();
  }
  ctx.shadowBlur=0;
}

/* vehicle */
function drawVehicle(t,boost){
  const vx=cx, vy=H*0.72;
  const sz=W*0.04;
  const wobble=Math.sin(t*12)*sz*0.02*CONFIG.speed;

  // boost trail
  if(boost>0.1){
    const trailLen=sz*3*boost;
    const tg=ctx.createLinearGradient(vx,vy+sz*0.3,vx,vy+sz*0.3+trailLen);
    tg.addColorStop(0,rgba(CONFIG.trailColor,0.8*boost));
    tg.addColorStop(0.4,rgba(CONFIG.trailColor,0.3*boost));
    tg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=tg;
    ctx.beginPath();
    ctx.moveTo(vx-sz*0.2,vy+sz*0.3);
    ctx.lineTo(vx+sz*0.2,vy+sz*0.3);
    ctx.lineTo(vx+sz*0.08,vy+sz*0.3+trailLen);
    ctx.lineTo(vx-sz*0.08,vy+sz*0.3+trailLen);
    ctx.fill();
    // side trails
    [-1,1].forEach(side=>{
      const sg=ctx.createLinearGradient(vx+side*sz*0.35,vy,vx+side*sz*0.35,vy+trailLen*0.6);
      sg.addColorStop(0,rgba(CONFIG.trailColor,0.4*boost));
      sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg;
      ctx.beginPath();
      ctx.moveTo(vx+side*sz*0.35,vy+sz*0.1);
      ctx.lineTo(vx+side*sz*0.42,vy+sz*0.1);
      ctx.lineTo(vx+side*sz*0.38,vy+trailLen*0.6);
      ctx.lineTo(vx+side*sz*0.32,vy+trailLen*0.6);
      ctx.fill();
    });
  }

  // vehicle body - geometric wedge
  ctx.save();ctx.translate(vx+wobble,vy);
  ctx.shadowColor=CONFIG.neonColor;ctx.shadowBlur=20;
  // main body
  ctx.fillStyle=CONFIG.vehicleColor;
  ctx.beginPath();
  ctx.moveTo(0,-sz*0.6);           // nose
  ctx.lineTo(sz*0.35,-sz*0.1);     // right mid
  ctx.lineTo(sz*0.4,sz*0.3);       // right rear
  ctx.lineTo(-sz*0.4,sz*0.3);      // left rear
  ctx.lineTo(-sz*0.35,-sz*0.1);    // left mid
  ctx.closePath();ctx.fill();
  // cockpit
  ctx.fillStyle=rgba(CONFIG.neonColor,0.6);
  ctx.beginPath();
  ctx.moveTo(0,-sz*0.35);
  ctx.lineTo(sz*0.18,sz*0.0);
  ctx.lineTo(-sz*0.18,sz*0.0);
  ctx.closePath();ctx.fill();
  // neon edge lines
  ctx.strokeStyle=CONFIG.neonColor;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-sz*0.4,sz*0.3);ctx.lineTo(0,-sz*0.6);ctx.lineTo(sz*0.4,sz*0.3);ctx.stroke();

  ctx.shadowBlur=0;ctx.restore();
}

/* speed lines */
function drawSpeedLines(t,spd,boost){
  const intensity=0.3+boost*0.7;
  for(const sl of speedLines){
    let z=((sl.z+t*spd*sl.sp*0.5)%1);
    const p=project(sl.x,sl.y,z*2);
    const len=Math.max(2,(60*p.scale)*spd*(0.5+boost*0.5));
    const al=Math.max(0,(1-z)*intensity*0.5);
    ctx.strokeStyle=rgba(CONFIG.neonColor,al);
    ctx.lineWidth=Math.max(0.5,2*p.scale);
    ctx.beginPath();ctx.moveTo(p.sx,p.sy);ctx.lineTo(p.sx,p.sy+len);ctx.stroke();
  }
}

/* speedometer arc */
function drawSpeedo(speed){
  const r=W*0.06;
  const ox=W-W*0.08, oy=H-H*0.12;
  const startA=Math.PI*0.75, endA=Math.PI*2.25;
  const needleA=startA+(endA-startA)*(speed/400);

  // bg arc
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(ox,oy,r,startA,endA);ctx.stroke();
  // filled arc
  ctx.strokeStyle=rgba(CONFIG.neonColor,0.7);ctx.lineWidth=3;
  ctx.shadowColor=CONFIG.neonColor;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(ox,oy,r,startA,needleA);ctx.stroke();
  ctx.shadowBlur=0;
  // ticks
  for(let i=0;i<=8;i++){
    const a=startA+(endA-startA)*(i/8);
    const inner=r*0.85,outer=r*1.0;
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(ox+Math.cos(a)*inner,oy+Math.sin(a)*inner);
    ctx.lineTo(ox+Math.cos(a)*outer,oy+Math.sin(a)*outer);
    ctx.stroke();
  }
  // needle
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.shadowColor=CONFIG.neonColor;ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(ox,oy);
  ctx.lineTo(ox+Math.cos(needleA)*r*0.8,oy+Math.sin(needleA)*r*0.8);
  ctx.stroke();
  ctx.shadowBlur=0;
}

/* horizon glow */
function drawHorizon(ac){
  const g=ctx.createLinearGradient(0,H*0.3,0,H*0.5);
  g.addColorStop(0,rgba(CONFIG.neonColor,0.06));
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,H*0.3,W,H*0.2);
  // sun/destination glow
  const sg=ctx.createRadialGradient(cx,H*0.38,0,cx,H*0.38,W*0.15);
  sg.addColorStop(0,rgba(CONFIG.neonColor,0.08));
  sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
}

/* main loop */
let cycleStart=performance.now();
function runCycle(){cycleStart=performance.now();setTimeout(runCycle,CONFIG.cycleDuration);}
runCycle();

const boostEl=document.getElementById('boostTxt');

(function loop(now){
  const t=now/1000*CONFIG.speed;
  const cycleT=((now-cycleStart)%CONFIG.cycleDuration)/CONFIG.cycleDuration;

  // boost zones: 0.2-0.3, 0.55-0.65, 0.8-0.9
  let boost=0;
  [[0.2,0.3],[0.55,0.65],[0.8,0.9]].forEach(([s,e])=>{
    if(cycleT>s&&cycleT<e){
      const mid=(s+e)/2,half=(e-s)/2;
      boost=Math.max(boost,1-Math.abs(cycleT-mid)/half);
    }
  });
  boost=boost*boost;

  currentSpeed+=(( 120+boost*280)-currentSpeed)*0.06;
  document.getElementById('speedVal').textContent=Math.round(currentSpeed);
  document.body.style.setProperty('--neon',CONFIG.neonColor);

  // boost text
  boostEl.style.opacity=boost>0.7?((boost-0.7)/0.3).toFixed(2):'0';

  ctx.fillStyle=CONFIG.bgColor;ctx.fillRect(0,0,W,H);

  drawHorizon();
  drawGrid(t,1+boost*2);
  drawLanes(t,1+boost*2);
  drawGates(t,1+boost*2);
  drawSpeedLines(t,1+boost*2,boost);
  drawVehicle(t,boost);
  drawSpeedo(currentSpeed);

  // vignette
  const vg=ctx.createRadialGradient(cx,cy,W*0.2,cx,cy,W*0.7);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // scanlines
  ctx.fillStyle='rgba(0,0,0,0.03)';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);

  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>

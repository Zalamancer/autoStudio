<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App Screens Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0f0f1a; font-family: 'Arial', sans-serif; }
  #stage { position: absolute; inset: 0; z-index: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 18px; padding: 30px; }

  .phone { width: 140px; opacity: 0; will-change: transform, opacity; }
  .phone-frame { background: #1a1a2e; border-radius: 18px; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .phone-notch { width: 40px; height: 6px; background: #0f0f1a; border-radius: 3px; margin: 0 auto 6px; }
  .phone-screen { width: 100%; height: 180px; border-radius: 10px; overflow: hidden; position: relative; }
  .screen-bg { width: 100%; height: 100%; }
  .screen-ui { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 12px 10px; }
  .ui-header { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .ui-bar { width: 70%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 6px; }
  .ui-bar.short { width: 45%; }
  .ui-dots { display: flex; gap: 4px; margin-top: auto; justify-content: center; }
  .ui-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .ui-dot.active { background: #fff; }
  .phone-label { text-align: center; padding: 8px 4px 0; }
  .phone-name { font-size: 11px; font-weight: 700; color: #e0e0ff; }
  .phone-desc { font-size: 9px; color: #666; margin-top: 2px; }

  @keyframes phoneSlide { 0% { opacity: 0; transform: translateY(40px) scale(0.9); } 60% { transform: translateY(-3px) scale(1.01); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes phoneHide { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(0.9); } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  screens: [
    { gradient: 'linear-gradient(135deg, #667eea, #764ba2)', name: 'Dashboard', desc: 'Analytics view', header: 'Overview' },
    { gradient: 'linear-gradient(135deg, #f093fb, #f5576c)', name: 'Social Feed', desc: 'Activity stream', header: 'Feed' },
    { gradient: 'linear-gradient(135deg, #4facfe, #00f2fe)', name: 'Messages', desc: 'Chat interface', header: 'Inbox' },
    { gradient: 'linear-gradient(135deg, #43e97b, #38f9d7)', name: 'Fitness', desc: 'Health tracker', header: 'Today' },
    { gradient: 'linear-gradient(135deg, #fa709a, #fee140)', name: 'Shopping', desc: 'Product catalog', header: 'Explore' },
    { gradient: 'linear-gradient(135deg, #a18cd1, #fbc2eb)', name: 'Music', desc: 'Player UI', header: 'Now Playing' },
    { gradient: 'linear-gradient(135deg, #fccb90, #d57eeb)', name: 'Travel', desc: 'Trip planner', header: 'My Trips' },
    { gradient: 'linear-gradient(135deg, #89f7fe, #66a6ff)', name: 'Weather', desc: 'Forecast app', header: 'This Week' },
  ],
  bgColor: '#0f0f1a',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function build() {
  stage.innerHTML = '';
  const els = [];
  CONFIG.screens.forEach(s => {
    const el = document.createElement('div'); el.className = 'phone';
    const frame = document.createElement('div'); frame.className = 'phone-frame';
    const notch = document.createElement('div'); notch.className = 'phone-notch';
    const screen = document.createElement('div'); screen.className = 'phone-screen';
    const bg = document.createElement('div'); bg.className = 'screen-bg'; bg.style.background = s.gradient;
    const ui = document.createElement('div'); ui.className = 'screen-ui';
    const header = document.createElement('div'); header.className = 'ui-header'; header.textContent = s.header;
    ui.appendChild(header);
    for (let i = 0; i < 3; i++) { const bar = document.createElement('div'); bar.className = 'ui-bar' + (i === 1 ? ' short' : ''); ui.appendChild(bar); }
    const dots = document.createElement('div'); dots.className = 'ui-dots';
    for (let i = 0; i < 3; i++) { const d = document.createElement('div'); d.className = 'ui-dot' + (i === 0 ? ' active' : ''); dots.appendChild(d); }
    ui.appendChild(dots);
    screen.appendChild(bg); screen.appendChild(ui);
    frame.appendChild(notch); frame.appendChild(screen);
    const label = document.createElement('div'); label.className = 'phone-label';
    const name = document.createElement('div'); name.className = 'phone-name'; name.textContent = s.name;
    const desc = document.createElement('div'); desc.className = 'phone-desc'; desc.textContent = s.desc;
    label.appendChild(name); label.appendChild(desc);
    el.appendChild(frame); el.appendChild(label);
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=220, inD=450, hold=3500, outS=180, outD=380, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`phoneSlide ${inD}ms ease-out forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`phoneHide ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Interface</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.container {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
/* Header */
.chat-header {
  width: 100%;
  padding: 1.8vh 3vw;
  display: flex;
  align-items: center;
  gap: 2vw;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  position: relative;
  z-index: 10;
  opacity: 0;
  transform: translateY(-3vh);
  transition: all 0.5s cubic-bezier(0.22,1,0.36,1);
}
.chat-header.visible { opacity: 1; transform: translateY(0); }
.header-back {
  font-size: 2.4vh;
  opacity: 0.5;
  cursor: pointer;
}
.header-avatar {
  width: 5vh;
  height: 5vh;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 2vh;
  color: #fff;
  flex-shrink: 0;
  position: relative;
}
.online-dot {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 1.3vh;
  height: 1.3vh;
  border-radius: 50%;
  background: #22c55e;
  border: 2px solid #fff;
}
.header-info { flex: 1; }
.header-name { font-size: 1.8vh; font-weight: 700; }
.header-status { font-size: 1.2vh; color: #22c55e; font-weight: 500; }
.header-actions { display: flex; gap: 2.5vw; }
.header-action-btn {
  width: 4vh;
  height: 4vh;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8vh;
  opacity: 0.4;
}

/* Messages area */
.messages-area {
  flex: 1;
  padding: 2vh 3vw;
  display: flex;
  flex-direction: column;
  gap: 1vh;
  overflow: hidden;
  position: relative;
}
.message-row {
  display: flex;
  align-items: flex-end;
  gap: 1vw;
  max-width: 80%;
  opacity: 0;
  transform: translateY(3vh) scale(0.95);
  transition: all 0.45s cubic-bezier(0.22,1,0.36,1);
}
.message-row.visible { opacity: 1; transform: translateY(0) scale(1); }
.message-row.exit { opacity: 0; transform: translateY(-2vh) scale(0.95); transition: all 0.4s ease-in; }
.message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
.message-row.received { align-self: flex-start; }
.msg-avatar {
  width: 3.2vh;
  height: 3.2vh;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2vh;
  color: #fff;
  font-weight: 700;
  flex-shrink: 0;
}
.bubble {
  padding: 1.4vh 2vw;
  border-radius: 2.2vh;
  font-size: 1.5vh;
  line-height: 1.5;
  max-width: 100%;
  position: relative;
  word-wrap: break-word;
}
.sent .bubble {
  color: #fff;
  border-bottom-right-radius: 0.5vh;
}
.received .bubble {
  border-bottom-left-radius: 0.5vh;
}
.bubble-meta {
  display: flex;
  align-items: center;
  gap: 0.6vw;
  margin-top: 0.4vh;
  justify-content: flex-end;
}
.bubble-time {
  font-size: 1vh;
  opacity: 0.55;
}
.bubble-check {
  font-size: 1.1vh;
  opacity: 0.7;
}
.bubble-check.read { opacity: 1; }

/* Typing indicator */
.typing-indicator {
  display: flex;
  align-items: flex-end;
  gap: 1vw;
  max-width: 80%;
  align-self: flex-start;
  opacity: 0;
  transform: translateY(2vh);
  transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
}
.typing-indicator.visible { opacity: 1; transform: translateY(0); }
.typing-dots {
  padding: 1.6vh 2vw;
  border-radius: 2.2vh;
  border-bottom-left-radius: 0.5vh;
  display: flex;
  align-items: center;
  gap: 0.5vw;
}
.typing-dot {
  width: 0.9vh;
  height: 0.9vh;
  border-radius: 50%;
  opacity: 0.4;
}
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-0.8vh); opacity: 1; }
}
.typing-dot:nth-child(1) { animation: typingBounce 1.2s infinite 0s; }
.typing-dot:nth-child(2) { animation: typingBounce 1.2s infinite 0.15s; }
.typing-dot:nth-child(3) { animation: typingBounce 1.2s infinite 0.3s; }

/* Input bar */
.input-bar {
  width: 100%;
  padding: 1.5vh 3vw;
  display: flex;
  align-items: center;
  gap: 1.5vw;
  border-top: 1px solid rgba(0,0,0,0.06);
  opacity: 0;
  transform: translateY(3vh);
  transition: all 0.5s cubic-bezier(0.22,1,0.36,1);
}
.input-bar.visible { opacity: 1; transform: translateY(0); }
.input-attach {
  width: 4vh;
  height: 4vh;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2vh;
  opacity: 0.35;
  flex-shrink: 0;
}
.input-field {
  flex: 1;
  height: 4.5vh;
  border-radius: 2.2vh;
  padding: 0 2vw;
  font-size: 1.4vh;
  border: none;
  outline: none;
}
.input-send {
  width: 4.5vh;
  height: 4.5vh;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8vh;
  color: #fff;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform 0.2s;
}
.input-send:hover { transform: scale(1.1); }
.input-send.pulse {
  animation: sendPulse 0.4s ease;
}
@keyframes sendPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>
<div class="container" id="container">
  <div class="chat-header" id="chatHeader">
    <div class="header-back">&#8249;</div>
    <div class="header-avatar" id="headerAvatar">
      <span id="avatarInitials"></span>
      <div class="online-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name" id="headerName"></div>
      <div class="header-status">Online</div>
    </div>
    <div class="header-actions">
      <div class="header-action-btn">&#128222;</div>
      <div class="header-action-btn">&#8942;</div>
    </div>
  </div>
  <div class="messages-area" id="messagesArea">
    <div class="typing-indicator" id="typingIndicator">
      <div class="msg-avatar" id="typingAvatar"></div>
      <div class="typing-dots" id="typingDots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  </div>
  <div class="input-bar" id="inputBar">
    <div class="input-attach">+</div>
    <div class="input-field" id="inputField"></div>
    <div class="input-send" id="sendBtn">&#10148;</div>
  </div>
</div>

<script>
// === EDITABLE CONFIG ===
var CONFIG = {
  contactName: 'Sarah Miller',
  contactInitials: 'SM',
  messages: [
    { text: 'Hey! Are you free this weekend?', sent: false },
    { text: 'Hi Sarah! Yes, I should be free Saturday afternoon', sent: true },
    { text: 'Awesome! Want to grab coffee at that new place downtown?', sent: false },
    { text: 'Sounds perfect! What time works for you?', sent: true },
    { text: 'How about 2pm? They have amazing pastries too', sent: false },
    { text: "2pm works great! Can't wait", sent: true }
  ],
  accentColor: '#6366f1',
  bgColor: '#f8f9fb',
  cycleDuration: 14000
};

// --- Derived colors ---
function hexToRgb(hex) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return { r: r, g: g, b: b };
}

function applyTheme() {
  var accent = CONFIG.accentColor;
  var rgb = hexToRgb(accent);
  var receivedBg = '#e9eaee';
  var receivedText = '#1a1a2e';
  var inputBg = '#edeef2';
  var headerBg = '#ffffff';

  document.getElementById('container').style.background = CONFIG.bgColor;
  document.getElementById('chatHeader').style.background = headerBg;
  document.getElementById('headerAvatar').style.background = accent;
  document.getElementById('typingAvatar').style.background = accent;
  document.getElementById('typingDots').style.background = receivedBg;

  var dots = document.querySelectorAll('.typing-dot');
  for (var i = 0; i < dots.length; i++) {
    dots[i].style.background = receivedText;
  }

  document.getElementById('inputField').style.background = inputBg;
  document.getElementById('inputField').style.color = '#1a1a2e';
  document.getElementById('sendBtn').style.background = accent;
  document.getElementById('inputBar').style.background = headerBg;

  document.getElementById('avatarInitials').textContent = CONFIG.contactInitials;
  document.getElementById('headerName').textContent = CONFIG.contactName;

  // Store theme vars for message rendering
  window._theme = {
    accent: accent,
    accentRgb: rgb,
    receivedBg: receivedBg,
    receivedText: receivedText,
    headerBg: headerBg
  };
}

// --- Time helpers ---
function fmtTime(offset) {
  var d = new Date();
  d.setMinutes(d.getMinutes() - offset);
  var h = d.getHours();
  var m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

// --- Message creation ---
var messagesArea = document.getElementById('messagesArea');
var typingIndicator = document.getElementById('typingIndicator');
var sendBtn = document.getElementById('sendBtn');
var activeMessages = [];

function createMessage(msg, timeOffset) {
  var row = document.createElement('div');
  row.className = 'message-row ' + (msg.sent ? 'sent' : 'received');

  var html = '';
  if (!msg.sent) {
    html += '<div class="msg-avatar" style="background:' + window._theme.accent + ';">' + CONFIG.contactInitials.charAt(0) + '</div>';
  }

  var bubbleBg = msg.sent ? window._theme.accent : window._theme.receivedBg;
  var bubbleColor = msg.sent ? '#ffffff' : window._theme.receivedText;
  var checkColor = msg.sent ? 'rgba(255,255,255,0.7)' : 'transparent';
  var timeColor = msg.sent ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.35)';

  html += '<div class="bubble" style="background:' + bubbleBg + ';color:' + bubbleColor + ';">';
  html += msg.text;
  html += '<div class="bubble-meta">';
  html += '<span class="bubble-time" style="color:' + timeColor + ';">' + fmtTime(timeOffset) + '</span>';
  if (msg.sent) {
    html += '<span class="bubble-check" style="color:' + checkColor + ';">&#10003;&#10003;</span>';
  }
  html += '</div></div>';

  row.innerHTML = html;
  return row;
}

function showTyping() {
  typingIndicator.classList.add('visible');
}

function hideTyping() {
  typingIndicator.classList.remove('visible');
}

function clearMessages() {
  activeMessages.forEach(function(el) {
    el.classList.add('exit');
  });
  setTimeout(function() {
    activeMessages.forEach(function(el) {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    activeMessages = [];
  }, 450);
}

function addMessage(msg, timeOffset) {
  var row = createMessage(msg, timeOffset);
  messagesArea.insertBefore(row, typingIndicator);
  activeMessages.push(row);

  // Force reflow then animate in
  void row.offsetWidth;
  row.classList.add('visible');

  // Pulse send button for sent messages
  if (msg.sent) {
    sendBtn.classList.remove('pulse');
    void sendBtn.offsetWidth;
    sendBtn.classList.add('pulse');
  }

  // Mark read checks after short delay for received then sent pairs
  if (msg.sent) {
    setTimeout(function() {
      var checks = row.querySelectorAll('.bubble-check');
      for (var i = 0; i < checks.length; i++) {
        checks[i].classList.add('read');
        checks[i].style.color = '#fff';
      }
    }, 800);
  }
}

// --- Animation cycle ---
function runCycle() {
  var header = document.getElementById('chatHeader');
  var inputBarEl = document.getElementById('inputBar');

  // Reset
  header.classList.remove('visible');
  inputBarEl.classList.remove('visible');
  hideTyping();
  clearMessages();

  var msgs = CONFIG.messages;
  var totalMsgs = msgs.length;

  // Calculate timing
  var introTime = 600;
  var typingShowTime = 800;
  var msgAppearGap = 300;
  // Time per message: typing (if received) + appear + gap
  var perMsgTime = 1200;
  var messagesPhaseTime = totalMsgs * perMsgTime;
  var exitStartTime = CONFIG.cycleDuration - 1800;

  // Intro: show header and input bar
  setTimeout(function() { header.classList.add('visible'); }, 200);
  setTimeout(function() { inputBarEl.classList.add('visible'); }, 400);

  // Stagger messages with typing indicator for received ones
  var currentDelay = introTime;
  msgs.forEach(function(msg, idx) {
    var timeOffset = (totalMsgs - idx) * 2;

    if (!msg.sent) {
      // Show typing indicator first, then message
      (function(m, t, d) {
        setTimeout(function() { showTyping(); }, d);
        setTimeout(function() {
          hideTyping();
          addMessage(m, t);
        }, d + typingShowTime);
      })(msg, timeOffset, currentDelay);
      currentDelay += typingShowTime + msgAppearGap;
    } else {
      // Sent messages appear directly
      (function(m, t, d) {
        setTimeout(function() { addMessage(m, t); }, d);
      })(msg, timeOffset, currentDelay);
      currentDelay += msgAppearGap + 400;
    }
  });

  // Exit phase: fade everything out
  setTimeout(function() {
    header.classList.remove('visible');
    inputBarEl.classList.remove('visible');
    hideTyping();
    clearMessages();
  }, exitStartTime);

  // Loop
  setTimeout(runCycle, CONFIG.cycleDuration);
}

// --- Init ---
applyTheme();
runCycle();
</script>
</body>
</html>

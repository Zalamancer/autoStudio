<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrition Facts Animation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--bg, #f5f5f0);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }

  .label-container {
    width: 320px;
    background: #fff;
    padding: 4px;
    position: relative;
    opacity: 0;
    animation: fadeInUp 0.6s ease-out forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .label-inner {
    border: 2px solid #000;
    padding: 8px 8px 12px;
    position: relative;
    overflow: hidden;
  }

  /* Border draw animation */
  .border-draw {
    position: absolute; inset: 0; pointer-events: none;
  }
  .border-draw::before {
    content: ''; position: absolute; inset: 0;
    border: 2px solid #000;
    clip-path: inset(0 100% 0 0);
    animation: drawBorder 1s ease-out 0.3s forwards;
  }
  @keyframes drawBorder {
    0%   { clip-path: inset(0 100% 100% 0); }
    25%  { clip-path: inset(0 0 100% 0); }
    50%  { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 0); }
  }

  /* Title */
  .nf-title {
    font-size: 32px; font-weight: 900; letter-spacing: -0.5px;
    border-bottom: 1px solid #000; padding-bottom: 4px; margin-bottom: 4px;
    opacity: 0; transform: scale(1.3);
    animation: stampDown 0.4s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }
  @keyframes stampDown {
    to { opacity: 1; transform: scale(1); }
  }

  .product-name {
    font-size: 11px; font-weight: 700; color: #333;
    opacity: 0; animation: fadeIn 0.3s ease 0.9s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .serving {
    font-size: 11px; color: #333;
    border-bottom: 8px solid #000; padding-bottom: 4px; margin-bottom: 2px;
    opacity: 0; animation: fadeIn 0.3s ease 1.1s forwards;
  }

  .calories-row {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 4px solid #000; padding: 4px 0;
    opacity: 0; animation: fadeIn 0.3s ease 1.3s forwards;
  }
  .calories-label { font-size: 13px; font-weight: 700; }
  .calories-value { font-size: 28px; font-weight: 900; }

  .dv-header {
    text-align: right; font-size: 10px; padding: 2px 0;
    border-bottom: 1px solid #000;
    opacity: 0; animation: fadeIn 0.3s ease 1.5s forwards;
  }

  /* Nutrient rows */
  .nutrient-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0; border-bottom: 1px solid #ccc;
    font-size: 12px; position: relative;
    opacity: 0;
  }
  .nutrient-row.bold { font-weight: 700; }
  .nutrient-row.indent { padding-left: 20px; }
  .nutrient-row.thick-border { border-bottom: 4px solid #000; }

  .nutrient-name { flex: 1; }
  .nutrient-amount { width: 60px; text-align: right; margin-right: 10px; }
  .nutrient-dv { width: 40px; text-align: right; font-weight: 700; }

  /* Bar animation */
  .bar-bg {
    position: absolute; left: 0; bottom: 0; height: 2px;
    background: rgba(0,0,0,0.06); width: 100%;
  }
  .bar-fill {
    height: 100%; background: #000; width: 0;
    transition: width 0.8s cubic-bezier(0.25,1,0.5,1);
  }

  /* Counter */
  .counter-value { display: inline; }

  /* Exit */
  .label-container.exit {
    animation: fadeOutDown 0.6s ease-in forwards;
  }
  @keyframes fadeOutDown {
    to { opacity: 0; transform: translateY(30px) scale(0.97); }
  }
</style>
</head>
<body>
<div class="label-container" id="label">
  <div class="label-inner">
    <div class="nf-title">Nutrition Facts</div>
    <div class="product-name" id="productName">Classic Granola Bar</div>
    <div class="serving" id="serving">Serving Size 1 bar (40g)</div>
    <div class="calories-row">
      <span class="calories-label">Calories</span>
      <span class="calories-value" id="caloriesValue">0</span>
    </div>
    <div class="dv-header">% Daily Value*</div>
    <div id="nutrientRows"></div>
  </div>
</div>

<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  productName: 'Classic Granola Bar',
  servingSize: '1 bar (40g)',
  nutrients: [
    { name: 'Total Fat',       amount: 8,   unit: 'g',  dailyValue: 10 },
    { name: 'Saturated Fat',   amount: 2.5, unit: 'g',  dailyValue: 13, indent: true },
    { name: 'Trans Fat',       amount: 0,   unit: 'g',  dailyValue: 0,  indent: true },
    { name: 'Cholesterol',     amount: 5,   unit: 'mg', dailyValue: 2 },
    { name: 'Sodium',          amount: 140, unit: 'mg', dailyValue: 6 },
    { name: 'Total Carbs',     amount: 26,  unit: 'g',  dailyValue: 9 },
    { name: 'Dietary Fiber',   amount: 2,   unit: 'g',  dailyValue: 7,  indent: true },
    { name: 'Total Sugars',    amount: 10,  unit: 'g',  dailyValue: 0,  indent: true },
    { name: 'Protein',         amount: 4,   unit: 'g',  dailyValue: 8 },
    { name: 'Vitamin D',       amount: 0,   unit: 'mcg',dailyValue: 0,  thick: true },
    { name: 'Calcium',         amount: 40,  unit: 'mg', dailyValue: 4 },
    { name: 'Iron',            amount: 1.2, unit: 'mg', dailyValue: 6 },
    { name: 'Potassium',       amount: 90,  unit: 'mg', dailyValue: 2 }
  ],
  bgColor: '#f5f5f0',
  cycleDuration: 10
};

function applyConfig() {
  document.body.style.setProperty('--bg', CONFIG.bgColor);
  document.getElementById('productName').textContent = CONFIG.productName;
  document.getElementById('serving').textContent = 'Serving Size ' + CONFIG.servingSize;
}

function buildRows() {
  const container = document.getElementById('nutrientRows');
  container.innerHTML = '';
  CONFIG.nutrients.forEach((n, i) => {
    const row = document.createElement('div');
    row.className = 'nutrient-row' + (n.indent ? ' indent' : ' bold') + (n.thick ? ' thick-border' : '');
    row.style.animationDelay = (1.7 + i * 0.15) + 's';
    row.innerHTML = `
      <span class="nutrient-name">${n.name}</span>
      <span class="nutrient-amount"><span class="counter-value" data-target="${n.amount}">0</span>${n.unit}</span>
      <span class="nutrient-dv">${n.dailyValue > 0 ? '<span class="counter-value" data-target="' + n.dailyValue + '">0</span>%' : ''}</span>
      <div class="bar-bg"><div class="bar-fill" data-width="${Math.min(n.dailyValue, 100)}"></div></div>
    `;
    row.style.animation = 'fadeIn 0.3s ease forwards';
    row.style.animationDelay = (1.7 + i * 0.15) + 's';
    container.appendChild(row);
  });
}

function animateCounters() {
  const counters = document.querySelectorAll('.counter-value');
  counters.forEach((el) => {
    const target = parseFloat(el.dataset.target);
    const delay = parseFloat(el.closest('.nutrient-row')?.style.animationDelay || '0') * 1000;
    const isFloat = target !== Math.floor(target);
    setTimeout(() => {
      let start = 0;
      const duration = 600;
      const startTime = performance.now();
      function tick(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = start + (target - start) * eased;
        el.textContent = isFloat ? current.toFixed(1) : Math.round(current);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }, delay + 200);
  });

  // Calories
  const calEl = document.getElementById('caloriesValue');
  setTimeout(() => {
    const target = 190;
    const duration = 800;
    const startTime = performance.now();
    function tick(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      calEl.textContent = Math.round(target * eased);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }, 1400);

  // Bar fills
  const bars = document.querySelectorAll('.bar-fill');
  bars.forEach((bar) => {
    const w = bar.dataset.width;
    const delay = parseFloat(bar.closest('.nutrient-row')?.style.animationDelay || '0') * 1000;
    setTimeout(() => { bar.style.width = w + '%'; }, delay + 300);
  });
}

function runCycle() {
  const label = document.getElementById('label');
  label.classList.remove('exit');
  label.style.animation = 'none';
  label.offsetHeight;
  label.style.animation = '';

  const parent = label.parentNode;
  const clone = label.cloneNode(false);
  clone.innerHTML = label.innerHTML;
  clone.id = 'label';
  parent.replaceChild(clone, label);

  buildRows();
  setTimeout(animateCounters, 100);

  const exitTime = (CONFIG.cycleDuration - 1) * 1000;
  setTimeout(() => {
    document.getElementById('label').classList.add('exit');
  }, exitTime);

  setTimeout(runCycle, CONFIG.cycleDuration * 1000);
}

applyConfig();
buildRows();

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
    applyConfig();
    buildRows();
  }
});

setTimeout(runCycle, 100);
</script>
</body>
</html>

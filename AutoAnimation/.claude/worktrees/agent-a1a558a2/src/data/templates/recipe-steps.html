<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Steps</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-color, #fdf6ee);
    color: #3d2c1e;
  }
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Warm kitchen texture */
  .bg-texture {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.04;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(180,120,60,0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(180,120,60,0.2) 0%, transparent 50%);
  }
  .bg-pattern {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.03;
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 3vw, rgba(0,0,0,0.05) 3vw, rgba(0,0,0,0.05) 3.1vw);
  }
  /* Header */
  .recipe-header {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 4vh 4vw 2vh;
    opacity: 0;
    transform: translateY(-3vh);
  }
  .recipe-icon {
    font-size: 4vw;
    margin-bottom: 1vh;
  }
  .recipe-name {
    font-size: 3.5vw;
    font-weight: 800;
    color: #2d1a0e;
    letter-spacing: -0.05vw;
    line-height: 1.2;
  }
  .recipe-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    margin-top: 1.5vh;
    font-size: 1.1vw;
    color: rgba(61,44,30,0.5);
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 0.5vw;
  }
  .meta-icon { font-size: 1.3vw; }
  /* Progress bar */
  .progress-container {
    position: relative;
    z-index: 5;
    padding: 0 8vw;
    margin: 2vh 0;
    opacity: 0;
  }
  .progress-track {
    width: 100%;
    height: 0.6vh;
    background: rgba(0,0,0,0.06);
    border-radius: 1vh;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 1vh;
    background: var(--accent-color, #d97706);
    width: 0%;
    transition: width 0.6s ease;
  }
  .progress-label {
    text-align: center;
    font-size: 0.9vw;
    color: rgba(61,44,30,0.4);
    margin-top: 0.5vh;
    font-weight: 600;
    letter-spacing: 0.1vw;
    text-transform: uppercase;
  }
  /* Content area */
  .content-area {
    position: relative;
    z-index: 5;
    display: flex;
    flex: 1;
    padding: 0 4vw 4vh;
    gap: 3vw;
    min-height: 0;
  }
  /* Ingredients panel */
  .ingredients-panel {
    width: 30%;
    opacity: 0;
    transform: translateX(-3vw);
  }
  .panel-title {
    font-size: 1.3vw;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15vw;
    color: var(--accent-color, #d97706);
    margin-bottom: 1.5vh;
    padding-bottom: 0.8vh;
    border-bottom: 0.15vw solid rgba(0,0,0,0.06);
  }
  .ingredient-item {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    padding: 0.8vh 0;
    font-size: 1.1vw;
    opacity: 0;
    transform: translateX(-1vw);
  }
  .check-circle {
    width: 1.5vw;
    height: 1.5vw;
    border-radius: 50%;
    border: 0.12vw solid var(--accent-color, #d97706);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.8vw;
    color: var(--accent-color, #d97706);
    transition: background 0.3s, color 0.3s;
  }
  .check-circle.checked {
    background: var(--accent-color, #d97706);
    color: white;
  }
  .ingredient-text {
    color: rgba(61,44,30,0.7);
    font-weight: 400;
  }
  .ingredient-text.checked {
    text-decoration: line-through;
    opacity: 0.4;
  }
  /* Steps panel */
  .steps-panel {
    flex: 1;
    opacity: 0;
    transform: translateX(3vw);
  }
  .step-card {
    display: flex;
    gap: 1.5vw;
    padding: 1.5vh 0;
    opacity: 0;
    transform: translateY(2vh);
    border-bottom: 0.08vw solid rgba(0,0,0,0.04);
  }
  .step-number {
    width: 3vw;
    height: 3vw;
    border-radius: 50%;
    background: rgba(0,0,0,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3vw;
    font-weight: 800;
    flex-shrink: 0;
    color: rgba(61,44,30,0.3);
    transition: background 0.4s, color 0.4s;
  }
  .step-number.active {
    background: var(--accent-color, #d97706);
    color: white;
    box-shadow: 0 0.3vh 1.5vh rgba(217,119,6,0.3);
  }
  .step-number.done {
    background: rgba(34,197,94,0.15);
    color: #16a34a;
  }
  .step-content {
    flex: 1;
    padding-top: 0.3vh;
  }
  .step-text {
    font-size: 1.2vw;
    line-height: 1.5;
    color: rgba(61,44,30,0.7);
  }
  .step-text.active {
    color: #2d1a0e;
    font-weight: 600;
  }
  .step-time {
    display: inline-flex;
    align-items: center;
    gap: 0.4vw;
    margin-top: 0.5vh;
    font-size: 0.9vw;
    color: var(--accent-color, #d97706);
    font-weight: 600;
  }
  /* Timer display */
  .timer-display {
    position: absolute;
    bottom: 4vh;
    right: 4vw;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 1vw;
    padding: 1.5vh 2vw;
    background: white;
    border-radius: 1.5vw;
    box-shadow: 0 0.5vh 3vh rgba(0,0,0,0.08);
    opacity: 0;
    transform: translateY(2vh);
  }
  .timer-icon { font-size: 2vw; }
  .timer-value {
    font-size: 2vw;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #2d1a0e;
  }
  .timer-label {
    font-size: 0.8vw;
    color: rgba(61,44,30,0.4);
    text-transform: uppercase;
    letter-spacing: 0.1vw;
    font-weight: 600;
  }
  /* Floating steam particles */
  .steam {
    position: absolute;
    width: 1vw;
    height: 1vw;
    background: rgba(180,120,60,0.08);
    border-radius: 50%;
    filter: blur(0.5vw);
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="bg-texture"></div>
  <div class="bg-pattern"></div>

  <div class="recipe-header" id="header">
    <div class="recipe-icon" id="recipeIcon">&#127859;</div>
    <div class="recipe-name" id="recipeName"></div>
    <div class="recipe-meta">
      <div class="meta-item"><span class="meta-icon">&#128101;</span> <span id="servings"></span></div>
      <div class="meta-item"><span class="meta-icon">&#9202;</span> <span id="prepTime"></span></div>
    </div>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">Step 0 of 0</div>
  </div>

  <div class="content-area">
    <div class="ingredients-panel" id="ingredientsPanel">
      <div class="panel-title">Ingredients</div>
      <div id="ingredientsList"></div>
    </div>
    <div class="steps-panel" id="stepsPanel">
      <div class="panel-title">Instructions</div>
      <div id="stepsList"></div>
    </div>
  </div>

  <div class="timer-display" id="timerDisplay">
    <div class="timer-icon">&#9201;</div>
    <div>
      <div class="timer-value" id="timerValue">00:00</div>
      <div class="timer-label">cooking</div>
    </div>
  </div>
</div>

<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  recipeName: "Classic Pasta Carbonara",
  servings: "4 servings",
  prepTime: "25 min",
  steps: [
    { text: "Boil a large pot of salted water for the pasta", time: "8 min" },
    { text: "Dice the guanciale and crisp in a large skillet", time: "5 min" },
    { text: "Whisk eggs, Pecorino Romano, and black pepper", time: "2 min" },
    { text: "Cook spaghetti until al dente, reserve pasta water", time: "10 min" },
    { text: "Toss hot pasta with guanciale, then add egg mixture off heat", time: "2 min" }
  ],
  ingredients: [
    "400g spaghetti",
    "200g guanciale",
    "4 egg yolks + 2 whole eggs",
    "100g Pecorino Romano",
    "Black pepper to taste",
    "Salt for pasta water"
  ],
  bgColor: "#fdf6ee",
  accentColor: "#d97706",
  cycleDuration: 14
};

function applyConfig() {
  document.body.style.setProperty('--bg-color', CONFIG.bgColor);
  document.body.style.setProperty('--accent-color', CONFIG.accentColor);

  document.getElementById('recipeName').textContent = CONFIG.recipeName;
  document.getElementById('servings').textContent = CONFIG.servings;
  document.getElementById('prepTime').textContent = CONFIG.prepTime;

  // Build ingredients
  var ingList = document.getElementById('ingredientsList');
  ingList.innerHTML = '';
  CONFIG.ingredients.forEach(function(ing) {
    var item = document.createElement('div');
    item.className = 'ingredient-item';
    item.innerHTML = '<div class="check-circle"></div><span class="ingredient-text">' + ing + '</span>';
    ingList.appendChild(item);
  });

  // Build steps
  var stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = '';
  CONFIG.steps.forEach(function(step, i) {
    var card = document.createElement('div');
    card.className = 'step-card';
    var timeHtml = step.time ? '<div class="step-time">&#9202; ' + step.time + '</div>' : '';
    card.innerHTML = '<div class="step-number">' + (i + 1) + '</div>' +
      '<div class="step-content"><div class="step-text">' + step.text + '</div>' + timeHtml + '</div>';
    stepsList.appendChild(card);
  });
}

applyConfig();

// Create steam particles
var steamParticles = [];
for (var i = 0; i < 12; i++) {
  var s = document.createElement('div');
  s.className = 'steam';
  document.getElementById('scene').appendChild(s);
  steamParticles.push({
    el: s,
    x: 10 + Math.random() * 80,
    y: Math.random() * 100,
    speed: 0.2 + Math.random() * 0.5,
    drift: (Math.random() - 0.5) * 2,
    size: 0.8 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2
  });
}

var totalMs = CONFIG.cycleDuration * 1000;
var startTime = null;

function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function easeOutBack(t) {
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  var elapsed = (timestamp - startTime) % totalMs;
  var progress = elapsed / totalMs;
  var time = timestamp * 0.001;

  var header = document.getElementById('header');
  var progressContainer = document.getElementById('progressContainer');
  var ingredientsPanel = document.getElementById('ingredientsPanel');
  var stepsPanel = document.getElementById('stepsPanel');
  var timerDisplay = document.getElementById('timerDisplay');
  var ingredientItems = document.querySelectorAll('.ingredient-item');
  var stepCards = document.querySelectorAll('.step-card');
  var stepNumbers = document.querySelectorAll('.step-number');
  var stepTexts = document.querySelectorAll('.step-text');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');

  var stepCount = stepCards.length;
  var ingCount = ingredientItems.length;

  // Phases:
  // 0.00-0.06: header fades in
  // 0.06-0.12: progress bar + panels slide in
  // 0.12-0.20: ingredients appear one by one
  // 0.20-0.80: steps appear one by one (each with active highlight, then marked done)
  // 0.80-0.88: timer counts, all done
  // 0.88-1.00: exit

  // Header
  if (progress < 0.90) {
    var hT = Math.min(progress / 0.06, 1);
    header.style.opacity = easeOutExpo(hT);
    header.style.transform = 'translateY(' + ((1 - easeOutExpo(hT)) * -3) + 'vh)';
  } else {
    var exitT = (progress - 0.90) / 0.10;
    header.style.opacity = 1 - exitT;
    header.style.transform = 'translateY(' + (-exitT * 3) + 'vh)';
  }

  // Progress bar + panels
  if (progress >= 0.06 && progress < 0.90) {
    var pT = Math.min((progress - 0.06) / 0.06, 1);
    progressContainer.style.opacity = easeOutExpo(pT);
    ingredientsPanel.style.opacity = easeOutExpo(pT);
    ingredientsPanel.style.transform = 'translateX(' + ((1 - easeOutExpo(pT)) * -3) + 'vw)';
    stepsPanel.style.opacity = easeOutExpo(pT);
    stepsPanel.style.transform = 'translateX(' + ((1 - easeOutExpo(pT)) * 3) + 'vw)';
  } else if (progress >= 0.90) {
    var exitT2 = (progress - 0.90) / 0.10;
    progressContainer.style.opacity = 1 - exitT2;
    ingredientsPanel.style.opacity = 1 - exitT2;
    stepsPanel.style.opacity = 1 - exitT2;
  }

  // Ingredients appear
  if (progress >= 0.12 && progress < 0.90) {
    ingredientItems.forEach(function(item, i) {
      var ingStart = 0.12 + (i / ingCount) * 0.08;
      if (progress >= ingStart) {
        var iT = Math.min((progress - ingStart) / 0.03, 1);
        item.style.opacity = easeOutExpo(iT);
        item.style.transform = 'translateX(' + ((1 - easeOutExpo(iT)) * -1) + 'vw)';
      }
    });
  }

  // Steps appear sequentially
  var stepPhaseStart = 0.20;
  var stepPhaseEnd = 0.80;
  var activeStep = -1;

  if (progress >= stepPhaseStart && progress < 0.90) {
    stepCards.forEach(function(card, i) {
      var stepStart = stepPhaseStart + (i / stepCount) * (stepPhaseEnd - stepPhaseStart);
      var stepEnd = stepPhaseStart + ((i + 1) / stepCount) * (stepPhaseEnd - stepPhaseStart);

      if (progress >= stepStart) {
        var sT = Math.min((progress - stepStart) / 0.04, 1);
        card.style.opacity = easeOutExpo(sT);
        card.style.transform = 'translateY(' + ((1 - easeOutExpo(sT)) * 2) + 'vh)';

        if (progress < stepEnd) {
          // Active step
          activeStep = i;
          stepNumbers[i].className = 'step-number active';
          stepTexts[i].className = 'step-text active';
        } else {
          // Done step
          stepNumbers[i].className = 'step-number done';
          stepNumbers[i].textContent = '\u2713';
          stepTexts[i].className = 'step-text';
        }
      }
    });

    // Check ingredients as steps complete
    var completedSteps = activeStep >= 0 ? activeStep : 0;
    ingredientItems.forEach(function(item, i) {
      var checkRatio = completedSteps / stepCount;
      var shouldCheck = i < Math.floor(checkRatio * ingCount);
      var circle = item.querySelector('.check-circle');
      var text = item.querySelector('.ingredient-text');
      if (shouldCheck) {
        circle.classList.add('checked');
        circle.textContent = '\u2713';
        text.classList.add('checked');
      } else {
        circle.classList.remove('checked');
        circle.textContent = '';
        text.classList.remove('checked');
      }
    });

    // Update progress bar
    var overallProgress = activeStep >= 0 ? (activeStep + 1) / stepCount : 0;
    if (progress > stepPhaseEnd) overallProgress = 1;
    progressFill.style.width = (overallProgress * 100) + '%';
    var currentStepNum = activeStep >= 0 ? activeStep + 1 : 0;
    if (progress > stepPhaseEnd) currentStepNum = stepCount;
    progressLabel.textContent = 'Step ' + currentStepNum + ' of ' + stepCount;
  }

  // Timer display
  if (progress >= 0.25 && progress < 0.90) {
    var tdT = Math.min((progress - 0.25) / 0.06, 1);
    timerDisplay.style.opacity = easeOutExpo(tdT);
    timerDisplay.style.transform = 'translateY(' + ((1 - easeOutExpo(tdT)) * 2) + 'vh)';
    // Simulated timer counting
    var timerProgress = (progress - 0.25) / 0.55;
    var totalSecs = 25 * 60; // 25 min total
    var currentSecs = Math.floor(timerProgress * totalSecs);
    var timerMins = Math.floor(currentSecs / 60);
    var timerSecs = currentSecs % 60;
    document.getElementById('timerValue').textContent =
      String(timerMins).padStart(2, '0') + ':' + String(timerSecs).padStart(2, '0');
  } else if (progress >= 0.90) {
    var exitT3 = (progress - 0.90) / 0.10;
    timerDisplay.style.opacity = 1 - exitT3;
  }

  // Reset for next cycle
  if (progress > 0.98) {
    stepCards.forEach(function(card) {
      card.style.opacity = 0;
      card.style.transform = 'translateY(2vh)';
    });
    stepNumbers.forEach(function(sn, i) {
      sn.className = 'step-number';
      sn.textContent = (i + 1);
    });
    stepTexts.forEach(function(st) {
      st.className = 'step-text';
    });
    ingredientItems.forEach(function(item) {
      item.style.opacity = 0;
      item.style.transform = 'translateX(-1vw)';
      var circle = item.querySelector('.check-circle');
      var text = item.querySelector('.ingredient-text');
      circle.classList.remove('checked');
      circle.textContent = '';
      text.classList.remove('checked');
    });
    progressFill.style.width = '0%';
  }

  // Steam particles
  steamParticles.forEach(function(p) {
    var px = p.x + Math.sin(time * 0.5 + p.phase) * p.drift;
    var py = p.y - (time * p.speed * 5) % 120;
    var normalizedY = ((py % 120) + 120) % 120;
    p.el.style.left = px + 'vw';
    p.el.style.top = normalizedY + 'vh';
    p.el.style.width = p.size + 'vw';
    p.el.style.height = p.size + 'vw';
    var steamOpacity = progress > 0.06 && progress < 0.95
      ? Math.sin(normalizedY / 100 * Math.PI) * 0.06 : 0;
    p.el.style.opacity = steamOpacity;
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// Listen for config updates via postMessage
window.addEventListener('message', function(e) {
  if (e.data && typeof e.data === 'object') {
    Object.assign(CONFIG, e.data);
    applyConfig();
  }
});
</script>
</body>
</html>

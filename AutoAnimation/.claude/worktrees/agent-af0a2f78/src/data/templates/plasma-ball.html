<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electric Plasma Ball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #08060e; }
  canvas#plasmaCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  }
</style>
</head>
<body>
<canvas id="plasmaCanvas"></canvas>

<script>
const CONFIG = {
  titleText: 'Plasma',
  backgroundColor: '#08060e',
  tendrilCount: 14,
  tendrilColor1: '#aa44ff',
  tendrilColor2: '#4488ff',
  tendrilColor3: '#ff44aa',
  coreColor: '#cc88ff',
  glassColor: '#223355',
  pulseSpeed: 1.0,
  branchProbability: 0.35,
  glowIntensity: 0.8,
  outerArcCount: 6,
  cycleDuration: 12,
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('plasmaCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, globeR;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  globeR = Math.min(W, H) * 0.32;
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

// --- Lightning tendril ---
class Tendril {
  constructor(i) {
    this.index = i;
    this.angle = (i / CONFIG.tendrilCount) * Math.PI * 2;
    this.targetAngle = this.angle;
    this.rotSpeed = 0.002 + Math.random() * 0.004;
    this.segCount = 18 + Math.floor(Math.random() * 10);
    this.jitter = 8 + Math.random() * 12;
    this.thickness = 1.5 + Math.random() * 1.5;
    this.branches = [];
    this.lifetime = 0;
    this.maxLife = 120 + Math.random() * 180;
    this.colorChoice = Math.floor(Math.random() * 3);
    this.active = true;
    this.brightness = 0.6 + Math.random() * 0.4;
    this.generateBranches();
  }

  generateBranches() {
    this.branches = [];
    for (let i = 0; i < this.segCount; i++) {
      if (i > 4 && Math.random() < CONFIG.branchProbability) {
        this.branches.push({
          segIndex: i,
          angle: (Math.random() - 0.5) * 1.2,
          length: 3 + Math.floor(Math.random() * 6),
          jitter: 4 + Math.random() * 6,
        });
      }
    }
  }

  getColor() {
    const colors = [CONFIG.tendrilColor1, CONFIG.tendrilColor2, CONFIG.tendrilColor3];
    return colors[this.colorChoice % colors.length];
  }

  reset() {
    this.angle = Math.random() * Math.PI * 2;
    this.targetAngle = this.angle + (Math.random() - 0.5) * 2;
    this.lifetime = 0;
    this.maxLife = 80 + Math.random() * 200;
    this.colorChoice = Math.floor(Math.random() * 3);
    this.brightness = 0.6 + Math.random() * 0.4;
    this.segCount = 16 + Math.floor(Math.random() * 12);
    this.jitter = 8 + Math.random() * 12;
    this.generateBranches();
    this.active = true;
  }

  update(t) {
    this.lifetime++;
    this.angle += (this.targetAngle - this.angle) * 0.01;
    if (this.lifetime > this.maxLife) {
      this.reset();
    }
  }

  draw(t) {
    if (!this.active) return;

    const color = this.getColor();
    const c = hexToRgb(color);
    const fadeIn = Math.min(1, this.lifetime / 15);
    const fadeOut = Math.max(0, 1 - (this.lifetime - this.maxLife + 30) / 30);
    const fade = Math.min(fadeIn, fadeOut);
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.006 * CONFIG.pulseSpeed + this.index);

    // Build path points
    const points = [];
    const segLen = (globeR * 0.92) / this.segCount;
    let px = cx, py = cy;

    for (let i = 0; i < this.segCount; i++) {
      const progress = i / this.segCount;
      const jitterScale = progress * this.jitter;
      const dx = Math.cos(this.angle) * segLen + (Math.random() - 0.5) * jitterScale;
      const dy = Math.sin(this.angle) * segLen + (Math.random() - 0.5) * jitterScale;
      px += dx;
      py += dy;

      // Keep within globe
      const dist = Math.hypot(px - cx, py - cy);
      if (dist > globeR * 0.92) {
        const a = Math.atan2(py - cy, px - cx);
        px = cx + Math.cos(a) * globeR * 0.92;
        py = cy + Math.sin(a) * globeR * 0.92;
      }
      points.push({ x: px, y: py });
    }

    // Draw glow layer
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineWidth = this.thickness * 4;
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.06 * fade * pulse * CONFIG.glowIntensity})`;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();

    // Draw main tendril
    ctx.lineWidth = this.thickness;
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.6 * fade * pulse * this.brightness})`;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();

    // Draw bright core
    ctx.lineWidth = this.thickness * 0.4;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * fade * pulse * this.brightness})`;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();

    // Draw branches
    this.branches.forEach(br => {
      if (br.segIndex >= points.length) return;
      const origin = points[br.segIndex];
      const brAngle = this.angle + br.angle;
      ctx.lineWidth = this.thickness * 0.6;
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.35 * fade * pulse})`;
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      let bx = origin.x, by = origin.y;
      for (let j = 0; j < br.length; j++) {
        bx += Math.cos(brAngle) * segLen * 0.6 + (Math.random() - 0.5) * br.jitter;
        by += Math.sin(brAngle) * segLen * 0.6 + (Math.random() - 0.5) * br.jitter;
        const dist = Math.hypot(bx - cx, by - cy);
        if (dist > globeR * 0.9) break;
        ctx.lineTo(bx, by);
      }
      ctx.stroke();
    });

    // End point glow (where tendril hits glass)
    const lastP = points[points.length - 1];
    const endGlow = ctx.createRadialGradient(lastP.x, lastP.y, 0, lastP.x, lastP.y, 15);
    endGlow.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${0.5 * fade * pulse})`);
    endGlow.addColorStop(0.5, `rgba(${c.r},${c.g},${c.b},${0.1 * fade * pulse})`);
    endGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = endGlow;
    ctx.fillRect(lastP.x - 15, lastP.y - 15, 30, 30);

    ctx.restore();
  }
}

const tendrils = [];
for (let i = 0; i < CONFIG.tendrilCount; i++) tendrils.push(new Tendril(i));

// --- Outer surface arcs ---
class OuterArc {
  constructor() { this.reset(); }
  reset() {
    this.angle = Math.random() * Math.PI * 2;
    this.arcLen = 0.3 + Math.random() * 0.8;
    this.radius = globeR * (0.93 + Math.random() * 0.04);
    this.rotSpeed = (Math.random() - 0.5) * 0.003;
    this.lifetime = 0;
    this.maxLife = 60 + Math.random() * 120;
    this.hue = 260 + Math.random() * 60;
    this.opacity = 0.1 + Math.random() * 0.2;
  }
  update() {
    this.angle += this.rotSpeed;
    this.lifetime++;
    if (this.lifetime > this.maxLife) this.reset();
  }
  draw(t) {
    const fade = Math.min(1, this.lifetime / 10) * Math.max(0, 1 - (this.lifetime - this.maxLife + 20) / 20);
    const pulse = 0.6 + 0.4 * Math.sin(t * 0.008 + this.angle);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.beginPath();
    ctx.arc(cx, cy, this.radius, this.angle, this.angle + this.arcLen);
    ctx.strokeStyle = `hsla(${this.hue}, 80%, 65%, ${this.opacity * fade * pulse})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 6;
    ctx.strokeStyle = `hsla(${this.hue}, 80%, 65%, ${this.opacity * fade * pulse * 0.2})`;
    ctx.stroke();
    ctx.restore();
  }
}

const outerArcs = [];
for (let i = 0; i < CONFIG.outerArcCount; i++) outerArcs.push(new OuterArc());

// --- Draw glass globe ---
function drawGlobe(t) {
  const gc = hexToRgb(CONFIG.glassColor);

  // Glass sphere
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, globeR, 0, Math.PI * 2);
  const glassGrad = ctx.createRadialGradient(cx - globeR * 0.3, cy - globeR * 0.3, 0, cx, cy, globeR);
  glassGrad.addColorStop(0, `rgba(${gc.r + 40},${gc.g + 40},${gc.b + 40}, 0.08)`);
  glassGrad.addColorStop(0.7, `rgba(${gc.r},${gc.g},${gc.b}, 0.04)`);
  glassGrad.addColorStop(1, `rgba(${gc.r},${gc.g},${gc.b}, 0.12)`);
  ctx.fillStyle = glassGrad;
  ctx.fill();

  // Glass edge
  ctx.beginPath();
  ctx.arc(cx, cy, globeR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${gc.r + 60},${gc.g + 60},${gc.b + 60}, 0.15)`;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Specular highlight
  ctx.beginPath();
  ctx.ellipse(cx - globeR * 0.25, cy - globeR * 0.35, globeR * 0.3, globeR * 0.12, -0.4, 0, Math.PI * 2);
  const specGrad = ctx.createRadialGradient(cx - globeR * 0.25, cy - globeR * 0.35, 0, cx - globeR * 0.25, cy - globeR * 0.35, globeR * 0.3);
  specGrad.addColorStop(0, 'rgba(255,255,255,0.12)');
  specGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = specGrad;
  ctx.fill();

  // Second highlight (smaller, lower)
  ctx.beginPath();
  ctx.ellipse(cx + globeR * 0.3, cy + globeR * 0.25, globeR * 0.1, globeR * 0.05, 0.5, 0, Math.PI * 2);
  const spec2 = ctx.createRadialGradient(cx + globeR * 0.3, cy + globeR * 0.25, 0, cx + globeR * 0.3, cy + globeR * 0.25, globeR * 0.1);
  spec2.addColorStop(0, 'rgba(255,255,255,0.06)');
  spec2.addColorStop(1, 'transparent');
  ctx.fillStyle = spec2;
  ctx.fill();
  ctx.restore();
}

// --- Core glow ---
function drawCore(t) {
  const cc = hexToRgb(CONFIG.coreColor);
  const pulse = 0.6 + 0.4 * Math.sin(t * 0.005 * CONFIG.pulseSpeed);

  // Outer glow
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, globeR * 0.5);
  g1.addColorStop(0, `rgba(${cc.r},${cc.g},${cc.b},${0.2 * pulse * CONFIG.glowIntensity})`);
  g1.addColorStop(0.3, `rgba(${cc.r},${cc.g},${cc.b},${0.05 * pulse})`);
  g1.addColorStop(1, 'transparent');
  ctx.fillStyle = g1;
  ctx.fillRect(cx - globeR * 0.5, cy - globeR * 0.5, globeR, globeR);

  // Inner bright core
  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 20);
  g2.addColorStop(0, `rgba(255, 255, 255, ${0.7 * pulse})`);
  g2.addColorStop(0.3, `rgba(${cc.r},${cc.g},${cc.b},${0.5 * pulse})`);
  g2.addColorStop(1, 'transparent');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(cx, cy, 20, 0, Math.PI * 2);
  ctx.fill();

  // Pulsing ring
  const ringR = 8 + pulse * 6;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,255,255,${0.3 * pulse})`;
  ctx.lineWidth = 1;
  ctx.stroke();
}

// --- Base/pedestal ---
function drawBase(t) {
  const baseY = cy + globeR + 10;
  const baseW = globeR * 0.8;
  const baseH = 30;

  // Pedestal
  ctx.fillStyle = '#0e0a18';
  ctx.beginPath();
  ctx.moveTo(cx - baseW, baseY + baseH);
  ctx.lineTo(cx - baseW * 0.7, baseY);
  ctx.lineTo(cx + baseW * 0.7, baseY);
  ctx.lineTo(cx + baseW, baseY + baseH);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(100, 80, 140, 0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Pedestal highlight
  const baseGrad = ctx.createLinearGradient(0, baseY, 0, baseY + baseH);
  baseGrad.addColorStop(0, 'rgba(80, 60, 120, 0.15)');
  baseGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.moveTo(cx - baseW, baseY + baseH);
  ctx.lineTo(cx - baseW * 0.7, baseY);
  ctx.lineTo(cx + baseW * 0.7, baseY);
  ctx.lineTo(cx + baseW, baseY + baseH);
  ctx.closePath();
  ctx.fill();

  // Rim light at the joint
  const rimPulse = 0.4 + 0.6 * Math.sin(t * 0.004);
  const cc = hexToRgb(CONFIG.coreColor);
  ctx.fillStyle = `rgba(${cc.r},${cc.g},${cc.b},${0.1 * rimPulse})`;
  ctx.fillRect(cx - baseW * 0.7, baseY - 2, baseW * 1.4, 4);
}

// --- Background ambient ---
function drawAmbient(t) {
  const bg = hexToRgb(CONFIG.backgroundColor);
  const grad = ctx.createRadialGradient(cx, cy, globeR * 0.5, cx, cy, W * 0.7);
  grad.addColorStop(0, `rgba(${bg.r + 15}, ${bg.g + 10}, ${bg.b + 25}, 1)`);
  grad.addColorStop(1, `rgb(${bg.r}, ${bg.g}, ${bg.b})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ambient color wash from plasma
  const cc = hexToRgb(CONFIG.coreColor);
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.003);
  const ambGlow = ctx.createRadialGradient(cx, cy, globeR, cx, cy, W * 0.5);
  ambGlow.addColorStop(0, `rgba(${cc.r},${cc.g},${cc.b},${0.03 * pulse * CONFIG.glowIntensity})`);
  ambGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = ambGlow;
  ctx.fillRect(0, 0, W, H);
}

// --- Floating particles in background ---
const bgParticles = [];
for (let i = 0; i < 30; i++) {
  bgParticles.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.2,
    size: Math.random() * 2 + 0.5,
    hue: 260 + Math.random() * 60,
    opacity: Math.random() * 0.15 + 0.05,
    phase: Math.random() * Math.PI * 2,
  });
}

function drawBgParticles(t) {
  bgParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.004 + p.phase);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 80%, 65%, ${p.opacity * pulse})`;
    ctx.fill();
  });
}

function animate(t) {
  drawAmbient(t);
  drawBgParticles(t);

  // Clip tendrils to globe
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, globeR - 2, 0, Math.PI * 2);
  ctx.clip();
  drawCore(t);
  tendrils.forEach(td => { td.update(t); td.draw(t); });
  ctx.restore();

  outerArcs.forEach(a => { a.update(); a.draw(t); });
  drawGlobe(t);
  drawBase(t);

  // Vignette
  const vig = ctx.createRadialGradient(cx, cy, W * 0.15, cx, cy, W * 0.65);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volcanic Eruption</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0608;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas#volcano {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .screen-shake {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
  }
  .lightning-flash {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: rgba(255, 200, 100, 0); transition: background 0.05s;
  }
</style>
</head>
<body>
<canvas id="volcano"></canvas>
<div class="screen-shake" id="shakeLayer"></div>
<div class="lightning-flash" id="lightningFlash"></div>

<script>
  const CONFIG = {
    bgColor: '#0a0608',
    lavaColor: '#FF4500',
    smokeColor: '#CC3300',
    eruptionIntensity: 1.0,
    cycleDuration: 15000
  };

  const canvas = document.getElementById('volcano');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function hexToRgb(hex) {
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
  }

  const lavaRgb = hexToRgb(CONFIG.lavaColor);
  const smokeRgb = hexToRgb(CONFIG.smokeColor);

  // Mountain silhouette points
  function getMountainPath() {
    const base = H * 0.95;
    const peak = H * 0.2;
    const craterW = W * 0.06;
    const cx = W * 0.5;
    return [
      { x: 0, y: base },
      { x: W * 0.05, y: base - H * 0.05 },
      { x: W * 0.12, y: base - H * 0.15 },
      { x: W * 0.22, y: base - H * 0.08 },
      { x: W * 0.28, y: base - H * 0.22 },
      { x: W * 0.35, y: base - H * 0.35 },
      { x: W * 0.42, y: base - H * 0.55 },
      { x: cx - craterW, y: peak },
      { x: cx - craterW * 0.3, y: peak + H * 0.02 },
      { x: cx + craterW * 0.3, y: peak + H * 0.02 },
      { x: cx + craterW, y: peak },
      { x: W * 0.58, y: base - H * 0.55 },
      { x: W * 0.65, y: base - H * 0.35 },
      { x: W * 0.72, y: base - H * 0.22 },
      { x: W * 0.78, y: base - H * 0.08 },
      { x: W * 0.88, y: base - H * 0.15 },
      { x: W * 0.95, y: base - H * 0.05 },
      { x: W, y: base },
    ];
  }

  // Particles
  const embers = [];
  const lavaParticles = [];
  const debrisParticles = [];
  const smokeParticles = [];
  const ashParticles = [];
  const lavaFlows = [];

  function spawnEmber() {
    embers.push({
      x: Math.random() * W, y: H + 5,
      vx: (Math.random() - 0.5) * 0.8,
      vy: -(Math.random() * 1.5 + 0.5),
      size: Math.random() * 2.5 + 0.5,
      life: 1.0,
      decay: 0.002 + Math.random() * 0.004,
      brightness: 0.5 + Math.random() * 0.5,
      drift: Math.random() * Math.PI * 2
    });
  }

  function spawnAsh() {
    ashParticles.push({
      x: Math.random() * W * 1.2 - W * 0.1,
      y: -10,
      vx: (Math.random() - 0.3) * 0.5,
      vy: Math.random() * 0.8 + 0.2,
      size: Math.random() * 2 + 0.5,
      life: 1.0,
      decay: 0.001 + Math.random() * 0.002,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: Math.random() * 0.03 + 0.01
    });
  }

  function spawnDebris(cx, cy, intensity) {
    const count = Math.floor(8 * intensity * CONFIG.eruptionIntensity);
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const speed = (3 + Math.random() * 6) * intensity * CONFIG.eruptionIntensity;
      debrisParticles.push({
        x: cx + (Math.random() - 0.5) * 20,
        y: cy,
        vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 2,
        vy: Math.sin(angle) * speed,
        size: Math.random() * 4 + 1.5,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.006,
        gravity: 0.06 + Math.random() * 0.04,
        glow: Math.random() > 0.3
      });
    }
  }

  function spawnSmoke(cx, cy, intensity) {
    const count = Math.floor(3 * intensity);
    for (let i = 0; i < count; i++) {
      smokeParticles.push({
        x: cx + (Math.random() - 0.5) * 40,
        y: cy,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -(Math.random() * 1.5 + 0.5) * intensity,
        size: 15 + Math.random() * 25,
        life: 1.0,
        decay: 0.004 + Math.random() * 0.004,
        growRate: 0.3 + Math.random() * 0.4,
        opacity: 0.4 + Math.random() * 0.3
      });
    }
  }

  function spawnLavaFlow(startX, startY, direction) {
    lavaFlows.push({
      points: [{ x: startX, y: startY }],
      direction: direction,
      speed: 0.5 + Math.random() * 0.5,
      width: 3 + Math.random() * 4,
      life: 1.0,
      decay: 0.003,
      length: 0,
      maxLength: 80 + Math.random() * 120,
      brightness: 0.7 + Math.random() * 0.3
    });
  }

  // Screen shake
  let shakeIntensity = 0;
  let shakeX = 0, shakeY = 0;

  function triggerShake(intensity) {
    shakeIntensity = Math.max(shakeIntensity, intensity * CONFIG.eruptionIntensity);
  }

  function updateShake() {
    if (shakeIntensity > 0.01) {
      shakeX = (Math.random() - 0.5) * shakeIntensity * 12;
      shakeY = (Math.random() - 0.5) * shakeIntensity * 8;
      shakeIntensity *= 0.95;
    } else {
      shakeX = shakeY = 0;
      shakeIntensity = 0;
    }
    canvas.style.transform = `translate(${shakeX}px, ${shakeY}px)`;
  }

  // Lightning
  let lightningTimer = 0;
  function triggerLightning() {
    const flash = document.getElementById('lightningFlash');
    flash.style.background = 'rgba(255, 200, 100, 0.25)';
    setTimeout(() => { flash.style.background = 'rgba(255, 200, 100, 0)'; }, 60);
    setTimeout(() => { flash.style.background = 'rgba(255, 180, 80, 0.15)'; }, 120);
    setTimeout(() => { flash.style.background = 'rgba(255, 200, 100, 0)'; }, 180);
  }

  // Draw sky gradient
  function drawSky(t) {
    const grad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.0005);
    grad.addColorStop(0, CONFIG.bgColor);
    grad.addColorStop(0.4, `rgba(${30 + pulse * 20}, ${5 + pulse * 5}, ${10 + pulse * 10}, 1)`);
    grad.addColorStop(1, `rgba(${40 + pulse * 30}, ${10 + pulse * 8}, ${5 + pulse * 5}, 1)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // Draw stars (dimmed by eruption glow)
  const stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random(), y: Math.random() * 0.4,
      size: Math.random() * 1.2 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    });
  }

  function drawStars(t) {
    stars.forEach(s => {
      s.twinkle += s.speed;
      const a = 0.15 + 0.15 * Math.sin(s.twinkle);
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 180, ${a})`;
      ctx.fill();
    });
  }

  // Draw mountain
  function drawMountain(t) {
    const pts = getMountainPath();
    // Volcano glow behind mountain
    const glowGrad = ctx.createRadialGradient(W * 0.5, H * 0.2, 0, W * 0.5, H * 0.2, H * 0.5);
    const pulse = 0.3 + 0.3 * Math.sin(t * 0.003) * CONFIG.eruptionIntensity;
    glowGrad.addColorStop(0, `rgba(${lavaRgb.r}, ${lavaRgb.g * 0.5}, 0, ${pulse})`);
    glowGrad.addColorStop(0.3, `rgba(${smokeRgb.r}, ${smokeRgb.g * 0.3}, 0, ${pulse * 0.4})`);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);

    // Mountain silhouette
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();

    const mGrad = ctx.createLinearGradient(0, H * 0.2, 0, H);
    mGrad.addColorStop(0, '#1a0d0d');
    mGrad.addColorStop(0.5, '#120808');
    mGrad.addColorStop(1, '#0d0505');
    ctx.fillStyle = mGrad;
    ctx.fill();

    // Lava veins on mountain
    const veins = [
      { sx: 0.47, sy: 0.25, points: [[0.455, 0.35], [0.44, 0.5], [0.43, 0.65], [0.44, 0.78]] },
      { sx: 0.53, sy: 0.25, points: [[0.545, 0.35], [0.56, 0.5], [0.57, 0.65], [0.56, 0.78]] },
      { sx: 0.50, sy: 0.24, points: [[0.49, 0.35], [0.50, 0.50], [0.51, 0.65]] },
    ];
    veins.forEach(v => {
      ctx.beginPath();
      ctx.moveTo(v.sx * W, v.sy * H);
      v.points.forEach(p => ctx.lineTo(p[0] * W, p[1] * H));
      const vGrad = ctx.createLinearGradient(0, v.sy * H, 0, H * 0.8);
      const vPulse = 0.3 + 0.4 * Math.sin(t * 0.002 + v.sx * 10);
      vGrad.addColorStop(0, `rgba(${lavaRgb.r}, ${lavaRgb.g}, ${lavaRgb.b}, ${vPulse})`);
      vGrad.addColorStop(1, `rgba(${lavaRgb.r}, ${Math.floor(lavaRgb.g * 0.3)}, 0, ${vPulse * 0.3})`);
      ctx.strokeStyle = vGrad;
      ctx.lineWidth = 2 + Math.sin(t * 0.004) * 1;
      ctx.shadowColor = `rgba(${lavaRgb.r}, ${lavaRgb.g}, 0, ${vPulse})`;
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }

  // Draw crater glow
  function drawCrater(t, eruptionPhase) {
    const cx = W * 0.5;
    const cy = H * 0.2 + H * 0.02;
    const intensity = 0.4 + eruptionPhase * 0.6;

    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.08);
    grad.addColorStop(0, `rgba(255, 200, 50, ${intensity})`);
    grad.addColorStop(0.3, `rgba(${lavaRgb.r}, ${lavaRgb.g}, 0, ${intensity * 0.6})`);
    grad.addColorStop(0.7, `rgba(${smokeRgb.r}, ${smokeRgb.g * 0.3}, 0, ${intensity * 0.2})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, W * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // Particle update and render
  function updateParticles(t) {
    // Embers
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.drift += 0.02;
      e.x += e.vx + Math.sin(e.drift) * 0.3;
      e.y += e.vy;
      e.life -= e.decay;
      if (e.life <= 0 || e.y < -20) { embers.splice(i, 1); continue; }
      const a = e.life * e.brightness;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${lavaRgb.r}, ${100 + Math.floor(e.brightness * 100)}, 0, ${a})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${lavaRgb.r}, ${50 + Math.floor(e.brightness * 50)}, 0, ${a * 0.15})`;
      ctx.fill();
    }

    // Ash
    for (let i = ashParticles.length - 1; i >= 0; i--) {
      const a = ashParticles[i];
      a.wobble += a.wobbleSpeed;
      a.x += a.vx + Math.sin(a.wobble) * 0.5;
      a.y += a.vy;
      a.life -= a.decay;
      if (a.life <= 0 || a.y > H + 20) { ashParticles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(80, 70, 65, ${a.life * 0.4})`;
      ctx.fill();
    }

    // Debris
    for (let i = debrisParticles.length - 1; i >= 0; i--) {
      const d = debrisParticles[i];
      d.x += d.vx;
      d.vy += d.gravity;
      d.y += d.vy;
      d.life -= d.decay;
      if (d.life <= 0 || d.y > H) { debrisParticles.splice(i, 1); continue; }
      const a = d.life;
      if (d.glow) {
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 150, 0, ${a * 0.2})`;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
      ctx.fillStyle = d.glow
        ? `rgba(255, ${180 + Math.floor(a * 75)}, ${Math.floor(a * 50)}, ${a})`
        : `rgba(60, 40, 30, ${a})`;
      ctx.fill();
    }

    // Smoke
    ctx.globalCompositeOperation = 'screen';
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      const s = smokeParticles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.size += s.growRate;
      s.life -= s.decay;
      s.vx *= 0.99;
      s.vy *= 0.995;
      if (s.life <= 0) { smokeParticles.splice(i, 1); continue; }
      const a = s.life * s.opacity * 0.3;
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
      grad.addColorStop(0, `rgba(${smokeRgb.r}, ${smokeRgb.g}, ${smokeRgb.b}, ${a})`);
      grad.addColorStop(0.5, `rgba(${smokeRgb.r}, ${Math.floor(smokeRgb.g * 0.5)}, 0, ${a * 0.5})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // Lava flows
    for (let i = lavaFlows.length - 1; i >= 0; i--) {
      const f = lavaFlows[i];
      f.life -= f.decay;
      if (f.life <= 0) { lavaFlows.splice(i, 1); continue; }
      if (f.length < f.maxLength) {
        const last = f.points[f.points.length - 1];
        f.points.push({
          x: last.x + (f.direction + (Math.random() - 0.5) * 0.5) * f.speed,
          y: last.y + f.speed * 1.5
        });
        f.length++;
      }
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let j = 1; j < f.points.length; j++) {
        ctx.lineTo(f.points[j].x, f.points[j].y);
      }
      const a = f.life * f.brightness;
      ctx.strokeStyle = `rgba(${lavaRgb.r}, ${lavaRgb.g}, 0, ${a})`;
      ctx.lineWidth = f.width * f.life;
      ctx.shadowColor = `rgba(${lavaRgb.r}, ${lavaRgb.g}, 0, ${a * 0.5})`;
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // Eruption cycle
  let cycleStart = 0;
  let erupting = false;
  let eruptionPhase = 0;

  function runCycle() {
    cycleStart = performance.now();
    erupting = false;
    eruptionPhase = 0;
    embers.length = 0;
    debrisParticles.length = 0;
    smokeParticles.length = 0;
    lavaFlows.length = 0;
    ashParticles.length = 0;

    // Schedule eruption events
    // Buildup: 0-3s, rumble and glow increases
    setTimeout(() => { triggerShake(0.3); }, 1000);
    setTimeout(() => { triggerShake(0.5); }, 2000);
    setTimeout(() => { triggerShake(0.7); }, 2800);

    // Main eruption: 3s
    setTimeout(() => {
      erupting = true;
      triggerShake(1.0);
      const cx = W * 0.5;
      const cy = H * 0.22;
      spawnDebris(cx, cy, 1.0);
      for (let j = 0; j < 8; j++) {
        spawnSmoke(cx + (Math.random() - 0.5) * 30, cy, 1.0);
      }
      spawnLavaFlow(cx - 15, cy + 10, -1.5);
      spawnLavaFlow(cx + 15, cy + 10, 1.5);
      spawnLavaFlow(cx, cy + 10, (Math.random() - 0.5) * 0.5);
    }, 3000);

    // Secondary eruptions
    setTimeout(() => {
      triggerShake(0.8);
      const cx = W * 0.5;
      const cy = H * 0.22;
      spawnDebris(cx, cy, 0.7);
      for (let j = 0; j < 5; j++) {
        spawnSmoke(cx + (Math.random() - 0.5) * 40, cy, 0.8);
      }
      spawnLavaFlow(cx - 20, cy + 10, -2);
      spawnLavaFlow(cx + 20, cy + 10, 2);
    }, 5500);

    setTimeout(() => {
      triggerShake(0.6);
      spawnDebris(W * 0.5, H * 0.22, 0.5);
      spawnSmoke(W * 0.5, H * 0.22, 0.6);
    }, 7500);

    // Lightning flashes
    setTimeout(triggerLightning, 3200);
    setTimeout(triggerLightning, 5800);
    setTimeout(triggerLightning, 9000);
    setTimeout(triggerLightning, 11500);

    setTimeout(runCycle, CONFIG.cycleDuration);
  }

  let lastTime = 0;
  function animate(t) {
    const elapsed = t - cycleStart;
    const progress = elapsed / CONFIG.cycleDuration;

    // Calculate eruption phase (ramps up around 3s, stays high, fades at end)
    if (progress < 0.2) {
      eruptionPhase = progress / 0.2 * 0.3; // buildup
    } else if (progress < 0.7) {
      eruptionPhase = 0.5 + 0.5 * Math.sin((progress - 0.2) * 4); // active eruption
    } else {
      eruptionPhase = Math.max(0, (1 - progress) / 0.3 * 0.5); // cooldown
    }

    // Spawn ambient embers
    if (Math.random() < 0.08 + eruptionPhase * 0.15) spawnEmber();
    if (Math.random() < 0.04 + eruptionPhase * 0.08) spawnAsh();

    // Continuous crater smoke when erupting
    if (eruptionPhase > 0.3 && Math.random() < eruptionPhase * 0.1) {
      spawnSmoke(W * 0.5 + (Math.random() - 0.5) * 30, H * 0.22, eruptionPhase * 0.4);
    }

    drawSky(t);
    drawStars(t);
    drawMountain(t);
    drawCrater(t, eruptionPhase);
    updateParticles(t);
    updateShake();

    // Ground lava glow
    const glowA = 0.1 + eruptionPhase * 0.15;
    const groundGrad = ctx.createLinearGradient(0, H * 0.85, 0, H);
    groundGrad.addColorStop(0, 'rgba(0,0,0,0)');
    groundGrad.addColorStop(1, `rgba(${lavaRgb.r}, ${Math.floor(lavaRgb.g * 0.3)}, 0, ${glowA})`);
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, H * 0.85, W, H * 0.15);

    requestAnimationFrame(animate);
  }

  runCycle();
  animate(0);
</script>
</body>
</html>

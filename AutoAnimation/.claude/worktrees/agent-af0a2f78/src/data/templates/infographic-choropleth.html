<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choropleth Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0F172A; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  title: 'Global Sales',
  theme: 'dark',
  loop: false,
  animationSpeed: 1.0,
  colorLow: '#1E3A5F',
  colorHigh: '#3B82F6',
  defaultColor: '#1E293B',
  showLabels: true,
  showLegend: true,
  data: [
    { id: 'US', value: 42000, label: 'United States' },
    { id: 'CA', value: 18000, label: 'Canada' },
    { id: 'MX', value: 8000, label: 'Mexico' },
    { id: 'BR', value: 15000, label: 'Brazil' },
    { id: 'AR', value: 6000, label: 'Argentina' },
    { id: 'GB', value: 28000, label: 'United Kingdom' },
    { id: 'DE', value: 35000, label: 'Germany' },
    { id: 'FR', value: 25000, label: 'France' },
    { id: 'ES', value: 12000, label: 'Spain' },
    { id: 'IT', value: 14000, label: 'Italy' },
    { id: 'SE', value: 9000, label: 'Sweden' },
    { id: 'NO', value: 7000, label: 'Norway' },
    { id: 'RU', value: 11000, label: 'Russia' },
    { id: 'CN', value: 38000, label: 'China' },
    { id: 'JP', value: 32000, label: 'Japan' },
    { id: 'KR', value: 20000, label: 'South Korea' },
    { id: 'IN', value: 22000, label: 'India' },
    { id: 'AU', value: 16000, label: 'Australia' },
    { id: 'ZA', value: 5000, label: 'South Africa' },
    { id: 'NG', value: 3000, label: 'Nigeria' },
    { id: 'EG', value: 4000, label: 'Egypt' }
  ]
};

function getTheme() {
  if (CONFIG.theme === 'light') return { bg: '#FFFFFF', text: '#334155', title: '#0F172A', grid: 'rgba(51,65,85,0.12)', subtle: '#F1F5F9' };
  return { bg: '#0F172A', text: '#94A3B8', title: '#F1F5F9', grid: 'rgba(148,163,184,0.15)', subtle: '#1E293B' };
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) };
}

function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return `rgb(${Math.round(a.r + (b.r - a.r) * t)},${Math.round(a.g + (b.g - a.g) * t)},${Math.round(a.b + (b.b - a.b) * t)})`;
}

function formatValue(v) {
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
  return '$' + v;
}

// Simplified world map — approximate country centroids and bounding rectangles
// Using Mercator-like projection (lon/lat to x/y)
const COUNTRIES = {
  US:  { cx: -98, cy: 39, w: 50, h: 22, label: 'US' },
  CA:  { cx: -96, cy: 56, w: 60, h: 20, label: 'CA' },
  MX:  { cx: -102, cy: 23, w: 18, h: 14, label: 'MX' },
  BR:  { cx: -52, cy: -10, w: 32, h: 30, label: 'BR' },
  AR:  { cx: -64, cy: -35, w: 14, h: 28, label: 'AR' },
  GB:  { cx: -2, cy: 54, w: 5, h: 8, label: 'GB' },
  DE:  { cx: 10, cy: 51, w: 7, h: 7, label: 'DE' },
  FR:  { cx: 2, cy: 46, w: 9, h: 8, label: 'FR' },
  ES:  { cx: -3, cy: 40, w: 10, h: 6, label: 'ES' },
  IT:  { cx: 12, cy: 42, w: 6, h: 9, label: 'IT' },
  SE:  { cx: 16, cy: 62, w: 6, h: 14, label: 'SE' },
  NO:  { cx: 9, cy: 64, w: 10, h: 14, label: 'NO' },
  RU:  { cx: 90, cy: 60, w: 80, h: 25, label: 'RU' },
  CN:  { cx: 104, cy: 35, w: 35, h: 25, label: 'CN' },
  JP:  { cx: 138, cy: 36, w: 6, h: 14, label: 'JP' },
  KR:  { cx: 128, cy: 36, w: 4, h: 5, label: 'KR' },
  IN:  { cx: 79, cy: 22, w: 18, h: 22, label: 'IN' },
  AU:  { cx: 134, cy: -25, w: 35, h: 25, label: 'AU' },
  ZA:  { cx: 25, cy: -29, w: 12, h: 10, label: 'ZA' },
  NG:  { cx: 8, cy: 9, w: 8, h: 8, label: 'NG' },
  EG:  { cx: 30, cy: 27, w: 8, h: 8, label: 'EG' },
  // Additional unlabeled countries for map context
  CO:  { cx: -73, cy: 4, w: 10, h: 10 },
  PE:  { cx: -75, cy: -10, w: 10, h: 14 },
  CL:  { cx: -71, cy: -33, w: 5, h: 30 },
  VE:  { cx: -66, cy: 7, w: 10, h: 7 },
  PL:  { cx: 20, cy: 52, w: 7, h: 5 },
  UA:  { cx: 32, cy: 49, w: 10, h: 6 },
  TR:  { cx: 35, cy: 39, w: 12, h: 5 },
  SA:  { cx: 45, cy: 24, w: 14, h: 12 },
  IR:  { cx: 53, cy: 32, w: 12, h: 10 },
  PK:  { cx: 69, cy: 30, w: 8, h: 8 },
  ID:  { cx: 118, cy: -2, w: 30, h: 12 },
  TH:  { cx: 101, cy: 15, w: 7, h: 12 },
  MY:  { cx: 110, cy: 3, w: 10, h: 5 },
  PH:  { cx: 122, cy: 12, w: 6, h: 10 },
  KE:  { cx: 38, cy: 0, w: 6, h: 6 },
  ET:  { cx: 40, cy: 8, w: 8, h: 7 },
  DZ:  { cx: 3, cy: 28, w: 16, h: 14 },
  LY:  { cx: 18, cy: 27, w: 12, h: 10 },
  MA:  { cx: -6, cy: 32, w: 8, h: 5 },
  CD:  { cx: 24, cy: -3, w: 12, h: 12 },
  MN:  { cx: 104, cy: 47, w: 16, h: 8 }
};

function lonLatToXY(lon, lat, area) {
  // Simple Mercator
  const x = area.x + ((lon + 180) / 360) * area.w;
  const latRad = lat * Math.PI / 180;
  const mercN = Math.log(Math.tan(Math.PI / 4 + latRad / 2));
  const y = area.y + area.h / 2 - (mercN / (Math.PI * 2)) * area.h * 1.2;
  return { x, y };
}

function sizeToPixels(w, h, area) {
  return {
    w: (w / 360) * area.w,
    h: (h / 180) * area.h * 0.8
  };
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (r <= 0) { ctx.fillRect(x, y, w, h); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  const T = getTheme();
  const dur = 2.5 / CONFIG.animationSpeed;
  const progress = Math.min(time / dur, 1);
  const ease = easeOutCubic(progress);
  const dataMap = {};
  let maxVal = 0;
  for (const d of CONFIG.data) {
    dataMap[d.id] = d;
    maxVal = Math.max(maxVal, d.value);
  }

  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = T.title;
  ctx.font = `bold ${W * 0.032}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(CONFIG.title, W * 0.06, H * 0.05);

  const area = { x: W * 0.05, y: H * 0.14, w: W * 0.9, h: H * 0.72 };

  // Sort data countries by value descending for animation order
  const sortedData = [...CONFIG.data].sort((a, b) => b.value - a.value);

  // Draw all countries
  const ids = Object.keys(COUNTRIES);
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    const c = COUNTRIES[id];
    const pt = lonLatToXY(c.cx, c.cy, area);
    const sz = sizeToPixels(c.w, c.h, area);
    const rx = pt.x - sz.w / 2;
    const ry = pt.y - sz.h / 2;
    const r = Math.min(sz.w, sz.h) * 0.2;

    const d = dataMap[id];
    if (d) {
      const dataIdx = sortedData.indexOf(d);
      const itemDelay = dataIdx * 0.04;
      const itemProgress = Math.min(Math.max((progress - itemDelay) / 0.5, 0), 1);
      const itemEase = easeOutCubic(itemProgress);
      const norm = d.value / maxVal;
      const color = lerpColor(CONFIG.colorLow, CONFIG.colorHigh, norm);

      ctx.globalAlpha = 0.3 + 0.7 * itemEase;
      ctx.fillStyle = itemEase > 0 ? color : CONFIG.defaultColor;
      roundRect(rx, ry, sz.w, sz.h, r);

      // Glow for high values
      if (norm > 0.5 && itemEase > 0.5) {
        ctx.shadowColor = CONFIG.colorHigh;
        ctx.shadowBlur = W * 0.008 * norm;
        roundRect(rx, ry, sz.w, sz.h, r);
        ctx.shadowBlur = 0;
      }

      // Label
      if (CONFIG.showLabels && itemEase > 0.6 && sz.w > W * 0.015) {
        const labelAlpha = (itemEase - 0.6) * 2.5;
        ctx.globalAlpha = labelAlpha;
        ctx.fillStyle = '#FFFFFF';
        const fontSize = Math.min(sz.w * 0.3, sz.h * 0.3, W * 0.012);
        ctx.font = `bold ${fontSize}px system-ui`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c.label || id, pt.x, pt.y - fontSize * 0.4);
        ctx.font = `${fontSize * 0.8}px system-ui`;
        ctx.fillText(formatValue(d.value), pt.x, pt.y + fontSize * 0.6);
      }
    } else {
      ctx.globalAlpha = 0.3 + 0.4 * ease;
      ctx.fillStyle = CONFIG.defaultColor;
      roundRect(rx, ry, sz.w, sz.h, r);
    }
    ctx.globalAlpha = 1;
  }

  // Legend bar
  if (CONFIG.showLegend) {
    const legendW = W * 0.2;
    const legendH = H * 0.018;
    const legendX = W * 0.75;
    const legendY = H * 0.9;
    const grad = ctx.createLinearGradient(legendX, 0, legendX + legendW, 0);
    grad.addColorStop(0, CONFIG.colorLow);
    grad.addColorStop(1, CONFIG.colorHigh);
    ctx.fillStyle = grad;
    roundRect(legendX, legendY, legendW, legendH, legendH / 2);
    ctx.fillStyle = T.text;
    ctx.font = `${W * 0.012}px system-ui`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('Low', legendX, legendY + legendH + W * 0.005);
    ctx.textAlign = 'right';
    ctx.fillText('High', legendX + legendW, legendY + legendH + W * 0.005);
  }

  if (progress >= 1 && CONFIG.loop) { time = 0; }
  else if (progress < 1) { time += 0.016; }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>

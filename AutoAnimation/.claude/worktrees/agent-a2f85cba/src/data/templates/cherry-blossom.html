<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cherry Blossom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(30,10,20,0.4) 100%); }
  .center-text { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #F8E0E6; pointer-events: none; }
  .center-text h1 { font-size: 50px; font-weight: 400; letter-spacing: 10px; font-style: italic;
    text-shadow: 0 0 30px rgba(255,150,180,0.3); animation: blossomPulse 5s ease-in-out infinite; }
  .center-text .subtitle { font-size: 13px; letter-spacing: 6px; opacity: 0.5; margin-top: 10px; }
  @keyframes blossomPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="titleEl">Sakura</h1>
  <div class="subtitle" id="subEl">Spring Breeze</div>
</div>
<script>
const CONFIG = {
  titleText: 'Sakura',
  subtitleText: 'Spring Breeze',
  bgTop: '#1a0a12',
  bgMid: '#2a1020',
  bgBottom: '#3a1830',
  petalCount: 120,
  petalColor1: '#FFB7C5',
  petalColor2: '#FF8FAB',
  petalColor3: '#FFFFFF',
  windStrength: 0.6,
  branchCount: 3,
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});
function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

// Petals
const petals = [];
for (let i = 0; i < CONFIG.petalCount; i++) {
  const colors = [CONFIG.petalColor1, CONFIG.petalColor2, CONFIG.petalColor3];
  petals.push({
    x: Math.random() * 2000, y: Math.random() * -500 - 50,
    size: Math.random() * 6 + 3,
    speedY: Math.random() * 1.2 + 0.4,
    speedX: Math.random() * 0.8 + 0.2,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: Math.random() * 0.02 + 0.008,
    wobbleAmp: Math.random() * 40 + 15,
    opacity: Math.random() * 0.6 + 0.3,
    color: colors[Math.floor(Math.random() * colors.length)],
    depth: Math.random(),
  });
}

// Branch structures
function drawBranch(x, y, angle, length, thickness, depth) {
  if (depth <= 0 || length < 8) return;
  const ex = x + Math.cos(angle) * length;
  const ey = y + Math.sin(angle) * length;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.strokeStyle = `rgba(60,30,20,${0.15 + depth * 0.05})`;
  ctx.lineWidth = thickness;
  ctx.stroke();
  // Sub branches
  drawBranch(ex, ey, angle - 0.4 + Math.random() * 0.2, length * 0.72, thickness * 0.7, depth - 1);
  drawBranch(ex, ey, angle + 0.3 + Math.random() * 0.2, length * 0.68, thickness * 0.65, depth - 1);
  // Small blossoms at tips
  if (depth <= 2) {
    const c = hexRgb(CONFIG.petalColor1);
    ctx.beginPath();
    ctx.arc(ex, ey, 3 + Math.random() * 4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.15 + Math.random() * 0.15})`;
    ctx.fill();
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, CONFIG.bgTop);
  g.addColorStop(0.5, CONFIG.bgMid);
  g.addColorStop(1, CONFIG.bgBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawBranches() {
  drawBranch(W * 0.1, H * 0.15, Math.PI * 0.35, 90, 4, 5);
  drawBranch(W * 0.85, H * 0.05, Math.PI * 0.55, 100, 5, 5);
  drawBranch(W * 0.6, H * 0.1, Math.PI * 0.45, 70, 3, 4);
}

function drawPetal(p) {
  ctx.save();
  const wx = p.x + Math.sin(p.wobble) * p.wobbleAmp;
  ctx.translate(wx, p.y);
  ctx.rotate(p.rotation);
  const c = hexRgb(p.color);
  const s = p.size * (0.5 + p.depth * 0.5);
  // Petal shape (two ellipses)
  ctx.beginPath();
  ctx.ellipse(-s * 0.3, 0, s * 0.6, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${p.opacity * 0.8})`;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.3, 0, s * 0.5, s * 0.25, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${p.opacity * 0.6})`;
  ctx.fill();
  ctx.restore();
}

function drawPetals() {
  petals.forEach(p => {
    p.wobble += p.wobbleSpeed;
    p.rotation += p.rotSpeed;
    p.y += p.speedY * (0.5 + p.depth * 0.5);
    p.x += p.speedX * CONFIG.windStrength;
    if (p.y > H + 30) { p.y = -30; p.x = Math.random() * W; }
    if (p.x > W + 40) p.x = -40;
    drawPetal(p);
  });
}

// Ground accumulation
function drawGround(t) {
  const gy = H * 0.88;
  const c = hexRgb(CONFIG.petalColor1);
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0.04)`);
  g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0.08)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 6) {
    const bump = Math.sin(x * 0.01 + t * 0.0002) * 6 + Math.sin(x * 0.025) * 3;
    ctx.lineTo(x, gy + bump);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// Soft ambient glow
function drawGlow(t) {
  const c = hexRgb(CONFIG.petalColor1);
  const pulse = 0.03 + 0.01 * Math.sin(t * 0.001);
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, W * 0.5);
  grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${pulse})`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function animate(t) {
  drawBackground();
  drawGlow(t);
  drawBranches();
  drawPetals();
  drawGround(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

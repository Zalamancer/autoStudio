<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireplace Cozy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }
  canvas#fireCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 85%, transparent 30%, rgba(10,5,0,0.7) 100%);
  }
  .center-text {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #FFD4A0;
  }
  .center-text h1 {
    font-size: 44px; font-weight: 400; letter-spacing: 8px; font-style: italic;
    text-shadow: 0 0 30px rgba(255,150,50,0.3);
    animation: warmGlow 4s ease-in-out infinite;
  }
  .center-text .subtitle {
    font-size: 14px; letter-spacing: 5px; opacity: 0.5; margin-top: 10px;
    font-style: italic;
  }
  @keyframes warmGlow {
    0%, 100% { opacity: 0.7; text-shadow: 0 0 30px rgba(255,150,50,0.2); }
    50% { opacity: 1; text-shadow: 0 0 50px rgba(255,150,50,0.5); }
  }
</style>
</head>
<body>
<canvas id="fireCanvas"></canvas>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="mainTitle">Warmth</h1>
  <div class="subtitle" id="subTitle">A Quiet Evening</div>
</div>

<script>
// ===== EDITABLE VARIABLES =====
const TITLE_TEXT = 'Warmth';
const SUBTITLE_TEXT = 'A Quiet Evening';
const BG_COLOR_TOP = '#1a0a00';
const BG_COLOR_BOTTOM = '#0d0500';
const EMBER_COUNT = 60;
const FLAME_PARTICLES = 120;
// ==============================

document.getElementById('mainTitle').textContent = TITLE_TEXT;
document.getElementById('subTitle').textContent = SUBTITLE_TEXT;

const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Fire particles
class FireParticle {
  constructor() { this.reset(); }
  reset() {
    this.x = W * 0.5 + (Math.random() - 0.5) * W * 0.25;
    this.y = H * 0.95;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = -(Math.random() * 3 + 1.5);
    this.life = 1;
    this.decay = Math.random() * 0.015 + 0.008;
    this.size = Math.random() * 6 + 2;
    this.heat = Math.random(); // 0=ember, 1=hot white
  }
  update() {
    this.x += this.vx + (Math.random() - 0.5) * 0.5;
    this.y += this.vy;
    this.vy *= 0.99;
    this.life -= this.decay;
    this.size *= 0.995;
    if (this.life <= 0) this.reset();
  }
  draw() {
    let r, g, b;
    if (this.life > 0.7) {
      r = 255; g = 220 + (1 - this.life) * 100; b = 100 + this.heat * 155;
    } else if (this.life > 0.4) {
      r = 255; g = 100 + this.life * 120; b = 0;
    } else {
      r = 200 + this.life * 55; g = 50 * this.life; b = 0;
    }
    const a = this.life * 0.6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${a})`;
    ctx.fill();
    // glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${a * 0.1})`;
    ctx.fill();
  }
}

// Embers (float up slowly)
class Ember {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = W * 0.5 + (Math.random() - 0.5) * W * 0.3;
    this.y = init ? H * (0.5 + Math.random() * 0.4) : H * 0.85;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -(Math.random() * 0.8 + 0.2);
    this.size = Math.random() * 2 + 0.5;
    this.life = 1;
    this.decay = Math.random() * 0.003 + 0.001;
    this.pulse = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.vx + Math.sin(this.pulse) * 0.2;
    this.y += this.vy;
    this.pulse += 0.03;
    this.life -= this.decay;
    if (this.life <= 0 || this.y < 0) this.reset(false);
  }
  draw() {
    const brightness = 0.5 + 0.5 * Math.sin(this.pulse * 3);
    const a = this.life * brightness * 0.8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, ${120 + brightness * 80 | 0}, 0, ${a})`;
    ctx.fill();
  }
}

const flames = [];
const embers = [];
for (let i = 0; i < FLAME_PARTICLES; i++) flames.push(new FireParticle());
for (let i = 0; i < EMBER_COUNT; i++) embers.push(new Ember());

function drawGlow(t) {
  const flicker = 0.9 + 0.1 * Math.sin(t * 0.005) * Math.sin(t * 0.0073);
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.9, 0, W * 0.5, H * 0.9, H * 0.7);
  grad.addColorStop(0, `rgba(255, 120, 20, ${0.08 * flicker})`);
  grad.addColorStop(0.5, `rgba(255, 80, 0, ${0.03 * flicker})`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function animate(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, BG_COLOR_TOP);
  grad.addColorStop(1, BG_COLOR_BOTTOM);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawGlow(t);

  ctx.globalCompositeOperation = 'screen';
  flames.forEach(f => { f.update(); f.draw(); });
  ctx.globalCompositeOperation = 'source-over';

  embers.forEach(e => { e.update(); e.draw(); });

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

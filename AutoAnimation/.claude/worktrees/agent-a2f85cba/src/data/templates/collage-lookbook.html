<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lookbook Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #f8f4f0; font-family: 'Arial', sans-serif; }
  #stage { position: absolute; inset: 0; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 8px; padding: 20px; }

  .look-cell { position: relative; overflow: hidden; opacity: 0; will-change: opacity; }
  .look-inner { position: absolute; inset: 0; display: flex; align-items: flex-end; }
  .look-bg { position: absolute; inset: 0; transition: transform 8s ease; }
  .look-cell:nth-child(odd) .look-bg { transform: scale(1.05); }
  .look-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, transparent 50%); z-index: 1; }
  .look-text { position: relative; z-index: 2; padding: 16px; color: #fff; }
  .look-season { font-size: 9px; text-transform: uppercase; letter-spacing: 4px; opacity: 0.6; margin-bottom: 4px; }
  .look-title { font-size: 22px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
  .look-cell.wide { grid-column: span 2; }

  @keyframes revealLook { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes hideLook { 0% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  looks: [
    { color: '#8b7355', season: 'SPRING 2024', title: 'EARTH TONES', wide: false },
    { color: '#5f6b4e', season: 'SPRING 2024', title: 'OLIVE GARDEN', wide: false },
    { color: '#c9a882', season: 'SUMMER 2024', title: 'GOLDEN SANDS', wide: true },
    { color: '#7ba7bc', season: 'AUTUMN 2024', title: 'MISTY BLUE', wide: false },
    { color: '#a0522d', season: 'AUTUMN 2024', title: 'SIENNA', wide: false },
    { color: '#3c3c3c', season: 'WINTER 2024', title: 'NOIR COLLECTION', wide: true },
  ],
  bgColor: '#f8f4f0',
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function build() {
  stage.innerHTML = '';
  const els = [];
  CONFIG.looks.forEach((look, i) => {
    const cell = document.createElement('div');
    cell.className = 'look-cell' + (look.wide ? ' wide' : '');
    const inner = document.createElement('div'); inner.className = 'look-inner';
    const bg = document.createElement('div'); bg.className = 'look-bg'; bg.style.background = look.color;
    const overlay = document.createElement('div'); overlay.className = 'look-overlay';
    const text = document.createElement('div'); text.className = 'look-text';
    const season = document.createElement('div'); season.className = 'look-season'; season.textContent = look.season;
    const title = document.createElement('div'); title.className = 'look-title'; title.textContent = look.title;
    text.appendChild(season); text.appendChild(title);
    inner.appendChild(bg); inner.appendChild(overlay); inner.appendChild(text);
    cell.appendChild(inner); stage.appendChild(cell); els.push(cell);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=400, inD=600, hold=3500, outS=300, outD=500, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`revealLook ${inD}ms ease-out forwards`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`hideLook ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

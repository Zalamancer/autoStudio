<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Wave - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #050515; font-family: 'Arial', sans-serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(0,200,100,0.03) 30%, rgba(100,0,200,0.03) 60%, transparent 100%); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .glow-orb { position: absolute; border-radius: 50%; pointer-events: none; z-index: 1; filter: blur(20px); }

  @keyframes auroraIn { 0% { opacity: 0; transform: translate(-50%,-50%) translateY(15px); filter: hue-rotate(-20deg); } 50% { filter: hue-rotate(10deg); } 100% { opacity: 1; transform: translate(-50%,-50%) translateY(0); filter: hue-rotate(0deg); } }
  @keyframes auroraOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) translateY(-15px); filter: hue-rotate(20deg) blur(3px); } }
  @keyframes colorShift { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(30deg); } 100% { filter: hue-rotate(0deg); } }
  @keyframes orbFloat { 0% { transform: translate(-50%,-50%) translateY(0); opacity: 0.12; } 50% { transform: translate(-50%,calc(-50% - 20px)); opacity: 0.06; } 100% { transform: translate(-50%,-50%) translateY(0); opacity: 0.12; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['NORTHERN','LIGHTS','DANCING','ACROSS','THE SKY','ETHEREAL','WONDER','MAGIC'],
  bgColor: '#050515',
  fontFamily: "'Arial', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const auroraColors = ['#00ff88','#00ccff','#aa44ff','#00ff44','#4488ff','#cc44ff','#44ffaa','#8844ff'];

// Background orbs
for (let i = 0; i < 5; i++) {
  const orb = document.createElement('div'); orb.className = 'glow-orb';
  const sz = 80 + Math.random() * 120;
  const hue = Math.random() * 360;
  orb.style.cssText = `left:${10+Math.random()*80}%;top:${20+Math.random()*60}%;width:${sz}px;height:${sz}px;background:hsla(${hue},100%,60%,0.1);animation:orbFloat ${4+Math.random()*4}s ease-in-out infinite;animation-delay:${Math.random()*3}s;`;
  document.body.appendChild(orb);
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 71 + 23);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(32 + rng() * 24, cellW * 0.38, cellH * 0.5);
    const color = auroraColors[i % auroraColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-weight:300;color:${color};text-shadow:0 0 15px ${color},0 0 30px ${color};letter-spacing:6px;text-transform:uppercase;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=320, inD=600, hold=3000, outS=240, outD=500, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`auroraIn ${inD}ms ease-out forwards, colorShift 4s ease-in-out infinite ${inD}ms`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`auroraOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

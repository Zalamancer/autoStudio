<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train Departure Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', 'Lucida Console', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2vmin 4vmin;
    border-bottom: 0.3vmin solid #444;
  }
  .station-name {
    font-size: 3.5vmin;
    font-weight: 700;
    letter-spacing: 0.4vmin;
    text-transform: uppercase;
  }
  .clock-container {
    display: flex;
    align-items: center;
    gap: 2vmin;
  }
  .clock-face {
    width: 10vmin;
    height: 10vmin;
    border-radius: 50%;
    border: 0.4vmin solid #ccc;
    position: relative;
    background: #111;
  }
  .clock-hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    background: #fff;
    border-radius: 0.2vmin;
  }
  .clock-hand.hour {
    width: 0.4vmin;
    height: 2.8vmin;
    margin-left: -0.2vmin;
  }
  .clock-hand.minute {
    width: 0.3vmin;
    height: 3.8vmin;
    margin-left: -0.15vmin;
  }
  .clock-hand.second {
    width: 0.15vmin;
    height: 4.2vmin;
    margin-left: -0.075vmin;
    background: #ff3333;
  }
  .clock-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1vmin;
    height: 1vmin;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .clock-digital {
    font-size: 4vmin;
    font-weight: 700;
    letter-spacing: 0.2vmin;
    font-variant-numeric: tabular-nums;
  }
  .board {
    width: 92%;
    margin-top: 2vmin;
    border-radius: 1vmin;
    overflow: hidden;
    border: 0.3vmin solid #444;
  }
  .board-header {
    display: grid;
    grid-template-columns: 1.2fr 0.6fr 0.5fr 0.7fr;
    padding: 1.5vmin 2vmin;
    font-size: 2vmin;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2vmin;
    border-bottom: 0.2vmin solid #555;
  }
  .departure-row {
    display: grid;
    grid-template-columns: 1.2fr 0.6fr 0.5fr 0.7fr;
    padding: 1.8vmin 2vmin;
    font-size: 2.5vmin;
    border-bottom: 0.1vmin solid #333;
    position: relative;
    overflow: hidden;
  }
  .departure-row:last-child { border-bottom: none; }
  .cell {
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .flip-char {
    display: inline-block;
    width: 2.2vmin;
    height: 3.6vmin;
    margin: 0 0.1vmin;
    position: relative;
    perspective: 80vmin;
  }
  .flip-char-inner {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .flip-half {
    position: absolute;
    width: 100%;
    height: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
  }
  .flip-half.top {
    top: 0;
    border-bottom: 0.1vmin solid #000;
    border-radius: 0.3vmin 0.3vmin 0 0;
  }
  .flip-half.bottom {
    bottom: 0;
    border-radius: 0 0 0.3vmin 0.3vmin;
  }
  .flip-half span {
    position: absolute;
    font-size: 2.8vmin;
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }
  .flip-half.top span { bottom: -0.2vmin; }
  .flip-half.bottom span { top: -1.6vmin; }
  .status-badge {
    padding: 0.4vmin 1.2vmin;
    border-radius: 0.5vmin;
    font-size: 1.8vmin;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1vmin;
  }
  .status-ontime { background: #0a5c0a; color: #33ff33; }
  .status-delayed { background: #5c4a0a; color: #ffaa33; }
  .status-cancelled { background: #5c0a0a; color: #ff3333; text-decoration: line-through; }
  .platform-num {
    width: 4vmin;
    height: 4vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 900;
    font-size: 2.2vmin;
    border: 0.2vmin solid currentColor;
  }
  .board-footer {
    padding: 1vmin 2vmin;
    font-size: 1.5vmin;
    border-top: 0.2vmin solid #444;
    display: flex;
    justify-content: space-between;
    opacity: 0.6;
  }
  .scanning-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 0.2vmin;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: scanMove 3s linear infinite;
    pointer-events: none;
  }
  @keyframes scanMove {
    0% { top: 0; }
    100% { top: 100%; }
  }
  @keyframes flipDown {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(-90deg); }
  }
  @keyframes flipUp {
    0% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="station-name" id="stationName"></div>
  <div class="clock-container">
    <div class="clock-face" id="clockFace">
      <div class="clock-hand hour" id="hourHand"></div>
      <div class="clock-hand minute" id="minuteHand"></div>
      <div class="clock-hand second" id="secondHand"></div>
      <div class="clock-center"></div>
    </div>
    <div class="clock-digital" id="digitalClock">00:00:00</div>
  </div>
</div>

<div class="board" id="board">
  <div class="board-header" id="boardHeader">
    <span>Destination</span>
    <span>Time</span>
    <span>Platform</span>
    <span>Status</span>
  </div>
  <div id="departureRows"></div>
  <div class="board-footer">
    <span>DEPARTURES</span>
    <span id="footerInfo">All services operated by National Rail</span>
  </div>
  <div class="scanning-line"></div>
</div>

<script>
  // ===== EDITABLE CONFIG =====
  const CONFIG = {
    stationName: 'LONDON KING\'S CROSS',
    departures: [
      { destination: 'EDINBURGH WAVERLEY', time: '10:00', platform: '1', status: 'On Time' },
      { destination: 'YORK', time: '10:15', platform: '5', status: 'On Time' },
      { destination: 'CAMBRIDGE', time: '10:22', platform: '8', status: 'Delayed' },
      { destination: 'LEEDS CENTRAL', time: '10:30', platform: '3', status: 'On Time' },
      { destination: 'NEWCASTLE', time: '10:45', platform: '2', status: 'Cancelled' },
      { destination: 'PETERBOROUGH', time: '11:00', platform: '7', status: 'On Time' }
    ],
    bgColor: '#0d0d0d',
    textColor: '#e8e0c8',
    boardColor: '#1a1a1a'
  };
  // ==============================

  const body = document.body;
  const stationNameEl = document.getElementById('stationName');
  const boardEl = document.getElementById('board');
  const boardHeader = document.getElementById('boardHeader');
  const rowsContainer = document.getElementById('departureRows');

  body.style.background = CONFIG.bgColor;
  body.style.color = CONFIG.textColor;
  stationNameEl.textContent = CONFIG.stationName;
  boardEl.style.background = CONFIG.boardColor;
  boardHeader.style.background = adjustColor(CONFIG.boardColor, 15);

  function adjustColor(hex, amount) {
    hex = hex.replace('#', '');
    let r = Math.max(0, Math.min(255, parseInt(hex.substring(0, 2), 16) + amount));
    let g = Math.max(0, Math.min(255, parseInt(hex.substring(2, 4), 16) + amount));
    let b = Math.max(0, Math.min(255, parseInt(hex.substring(4, 6), 16) + amount));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }

  // Split-flap character set
  const FLAP_CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-\'';

  function createFlipChar(char, parentColor) {
    const el = document.createElement('div');
    el.className = 'flip-char';
    const bg = adjustColor(CONFIG.boardColor, 25);
    el.innerHTML = `
      <div class="flip-char-inner">
        <div class="flip-half top" style="background:${bg}"><span style="color:${CONFIG.textColor}">${char}</span></div>
        <div class="flip-half bottom" style="background:${adjustColor(bg, -8)}"><span style="color:${CONFIG.textColor}">${char}</span></div>
      </div>
    `;
    el._currentChar = char;
    return el;
  }

  function flipCharTo(el, targetChar, delay) {
    if (el._currentChar === targetChar) return;
    setTimeout(() => {
      const inner = el.querySelector('.flip-char-inner');
      const topHalf = el.querySelector('.flip-half.top');
      const bottomHalf = el.querySelector('.flip-half.bottom');

      const currentIdx = FLAP_CHARS.indexOf(el._currentChar);
      const targetIdx = FLAP_CHARS.indexOf(targetChar);
      if (targetIdx === -1) return;

      let idx = currentIdx;
      function flipNext() {
        idx = (idx + 1) % FLAP_CHARS.length;
        const nextChar = FLAP_CHARS[idx];

        topHalf.querySelector('span').textContent = nextChar;
        bottomHalf.querySelector('span').textContent = nextChar;
        topHalf.style.animation = 'none';
        bottomHalf.style.animation = 'none';
        void topHalf.offsetWidth;
        topHalf.style.animation = 'flipDown 0.06s ease-in';
        bottomHalf.style.animation = 'flipUp 0.06s ease-out 0.06s';

        el._currentChar = nextChar;
        if (idx !== targetIdx) {
          setTimeout(flipNext, 50);
        }
      }
      flipNext();
    }, delay);
  }

  function createFlipString(text, maxLen) {
    const container = document.createElement('div');
    container.style.display = 'flex';
    container.style.alignItems = 'center';
    const padded = text.toUpperCase().padEnd(maxLen, ' ').substring(0, maxLen);
    const chars = [];
    for (let i = 0; i < maxLen; i++) {
      const fc = createFlipChar(' ');
      container.appendChild(fc);
      chars.push(fc);
    }
    container._chars = chars;
    container._setText = function(newText) {
      const np = newText.toUpperCase().padEnd(maxLen, ' ').substring(0, maxLen);
      for (let i = 0; i < maxLen; i++) {
        flipCharTo(chars[i], np[i], i * 40);
      }
    };
    return container;
  }

  // Build departure rows
  const rowData = [];
  function buildRows() {
    rowsContainer.innerHTML = '';
    rowData.length = 0;
    CONFIG.departures.forEach((dep, idx) => {
      const row = document.createElement('div');
      row.className = 'departure-row';
      row.style.background = idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)';

      const destCell = document.createElement('div');
      destCell.className = 'cell';
      const destFlip = createFlipString('', 20);
      destCell.appendChild(destFlip);

      const timeCell = document.createElement('div');
      timeCell.className = 'cell';
      const timeFlip = createFlipString('', 5);
      timeCell.appendChild(timeFlip);

      const platCell = document.createElement('div');
      platCell.className = 'cell';
      const platNum = document.createElement('div');
      platNum.className = 'platform-num';
      platNum.style.color = CONFIG.textColor;
      platNum.textContent = dep.platform;
      platNum.style.opacity = '0';
      platCell.appendChild(platNum);

      const statusCell = document.createElement('div');
      statusCell.className = 'cell';
      const badge = document.createElement('div');
      badge.className = 'status-badge';
      badge.style.opacity = '0';
      statusCell.appendChild(badge);

      row.appendChild(destCell);
      row.appendChild(timeCell);
      row.appendChild(platCell);
      row.appendChild(statusCell);
      rowsContainer.appendChild(row);

      rowData.push({ destFlip, timeFlip, platNum, badge, dep });
    });
  }
  buildRows();

  function setDepartureStatus(badge, status) {
    const s = status.toLowerCase();
    badge.textContent = status;
    badge.className = 'status-badge';
    if (s === 'on time') badge.classList.add('status-ontime');
    else if (s === 'delayed') badge.classList.add('status-delayed');
    else if (s === 'cancelled') badge.classList.add('status-cancelled');
  }

  // Animate departures with staggered flip
  let cycleIndex = 0;
  function animateCycle() {
    // Shuffle departures slightly for visual interest
    const shifted = [...CONFIG.departures];
    if (cycleIndex > 0) {
      shifted.push(shifted.shift());
      CONFIG.departures.length = 0;
      shifted.forEach(d => CONFIG.departures.push(d));
      buildRows();
    }

    rowData.forEach((rd, i) => {
      const delay = i * 600;
      setTimeout(() => {
        rd.destFlip._setText(rd.dep.destination);
        rd.timeFlip._setText(rd.dep.time);
        setTimeout(() => {
          rd.platNum.style.opacity = '1';
          rd.platNum.style.transition = 'opacity 0.3s';
        }, delay + 800);
        setTimeout(() => {
          setDepartureStatus(rd.badge, rd.dep.status);
          rd.badge.style.opacity = '1';
          rd.badge.style.transition = 'opacity 0.3s';
        }, delay + 1200);
      }, delay);
    });

    cycleIndex++;
  }

  // Clock
  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secondAngle = (s + ms / 1000) * 6;
    const minuteAngle = (m + s / 60) * 6;
    const hourAngle = ((h % 12) + m / 60) * 30;

    document.getElementById('secondHand').style.transform = `rotate(${secondAngle}deg)`;
    document.getElementById('minuteHand').style.transform = `rotate(${minuteAngle}deg)`;
    document.getElementById('hourHand').style.transform = `rotate(${hourAngle}deg)`;

    const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.getElementById('digitalClock').textContent = timeStr;
    document.getElementById('digitalClock').style.color = CONFIG.textColor;
  }

  // Clock tick marks
  const clockFace = document.getElementById('clockFace');
  for (let i = 0; i < 12; i++) {
    const tick = document.createElement('div');
    tick.style.position = 'absolute';
    tick.style.width = '0.3vmin';
    tick.style.height = i % 3 === 0 ? '1.2vmin' : '0.6vmin';
    tick.style.background = '#888';
    tick.style.top = '0.5vmin';
    tick.style.left = '50%';
    tick.style.marginLeft = '-0.15vmin';
    tick.style.transformOrigin = '50% 4.5vmin';
    tick.style.transform = `rotate(${i * 30}deg)`;
    clockFace.appendChild(tick);
  }

  // Main loop
  function mainLoop() {
    updateClock();
    requestAnimationFrame(mainLoop);
  }
  requestAnimationFrame(mainLoop);

  // Cycle departures every 8 seconds
  animateCycle();
  setInterval(() => {
    // Clear and re-flip
    rowData.forEach(rd => {
      rd.platNum.style.opacity = '0';
      rd.badge.style.opacity = '0';
    });
    setTimeout(animateCycle, 500);
  }, 8000);

  // postMessage CONFIG bridge
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'CONFIG_UPDATE') {
      Object.assign(CONFIG, e.data.payload);
      body.style.background = CONFIG.bgColor;
      body.style.color = CONFIG.textColor;
      stationNameEl.textContent = CONFIG.stationName;
      boardEl.style.background = CONFIG.boardColor;
      buildRows();
      animateCycle();
    }
  });
</script>
</body>
</html>

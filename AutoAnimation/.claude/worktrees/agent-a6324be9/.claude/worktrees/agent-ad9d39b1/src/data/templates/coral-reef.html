<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Reef</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #021b33; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgColor: '#021b33',
  surfaceColor: '#0694a8',
  coralColors: ['#ff6b8a', '#ff9a56', '#ffd93d', '#c678ff', '#45e6b0', '#ff4d6d'],
  fishCount: 18,
  bubbleCount: 50,
  sunrayOpacity: 0.07,
  cycleDuration: 24
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;
let bubbles = [], fishSchools = [], corals = [], anemones = [], seaweeds = [], particles = [];
let turtle = null;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  initScene();
}

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

function lerpColor(hex1, hex2, t) {
  const c1 = hexToRgb(hex1), c2 = hexToRgb(hex2);
  return `rgb(${Math.round(c1.r+(c2.r-c1.r)*t)},${Math.round(c1.g+(c2.g-c1.g)*t)},${Math.round(c1.b+(c2.b-c1.b)*t)})`;
}

function rr(a, b) { return a + Math.random() * (b - a); }

function initScene() {
  bubbles = []; fishSchools = []; corals = []; anemones = []; seaweeds = []; particles = [];
  const sandY = H * 0.82;

  // Brain corals
  for (let i = 0; i < 8; i++) {
    corals.push({
      type: 'brain',
      x: W * (0.05 + i * 0.12 + Math.random() * 0.04),
      y: sandY + H * 0.01,
      w: W * rr(0.04, 0.08), h: H * rr(0.04, 0.09),
      color: CONFIG.coralColors[i % CONFIG.coralColors.length],
      phase: Math.random() * Math.PI * 2
    });
  }

  // Fan corals
  for (let i = 0; i < 5; i++) {
    corals.push({
      type: 'fan',
      x: W * (0.08 + Math.random() * 0.84),
      y: sandY - H * 0.01,
      size: W * rr(0.03, 0.06),
      color: CONFIG.coralColors[(i + 2) % CONFIG.coralColors.length],
      phase: Math.random() * Math.PI * 2, swayAmp: 0.15
    });
  }

  // Staghorn corals
  for (let i = 0; i < 6; i++) {
    const branches = [];
    const bCount = 4 + Math.floor(Math.random() * 5);
    for (let b = 0; b < bCount; b++) {
      branches.push({
        angle: -Math.PI/2 + rr(-0.8, 0.8),
        length: H * rr(0.03, 0.08),
        width: W * rr(0.003, 0.006),
        subBranches: Math.random() > 0.4 ? Math.floor(rr(1, 3)) : 0
      });
    }
    corals.push({
      type: 'staghorn',
      x: W * (0.1 + Math.random() * 0.8), y: sandY,
      color: CONFIG.coralColors[(i + 4) % CONFIG.coralColors.length],
      branches, phase: Math.random() * Math.PI * 2
    });
  }

  // Anemones with clownfish
  for (let i = 0; i < 3; i++) {
    const tentacles = [];
    const tCount = 14 + Math.floor(Math.random() * 10);
    for (let t = 0; t < tCount; t++) {
      tentacles.push({
        angle: (t / tCount) * Math.PI - Math.PI * 0.5 + rr(-0.2, 0.2),
        length: H * rr(0.03, 0.06),
        width: W * rr(0.002, 0.004),
        phase: Math.random() * Math.PI * 2,
        speed: rr(1, 2.5)
      });
    }
    anemones.push({
      x: W * (0.15 + i * 0.32 + Math.random() * 0.1),
      y: sandY - H * 0.01,
      baseRadius: W * 0.02, tentacles,
      color: `hsl(${300 + Math.random() * 60}, 70%, 55%)`,
      tipColor: `hsl(${50 + Math.random() * 30}, 90%, 70%)`,
      clownfish: {
        offsetY: -H * 0.04,
        orbitRadius: W * 0.025, orbitSpeed: rr(0.8, 1.5),
        phase: Math.random() * Math.PI * 2, size: W * 0.012
      }
    });
  }

  // Seaweed
  for (let i = 0; i < 10; i++) {
    seaweeds.push({
      x: W * (0.03 + Math.random() * 0.94), y: H,
      height: H * rr(0.12, 0.35),
      segments: 10 + Math.floor(Math.random() * 6),
      width: W * rr(0.004, 0.008),
      swaySpeed: rr(0.6, 1.4), swayAmp: W * rr(0.008, 0.02),
      phase: Math.random() * Math.PI * 2,
      color: `hsl(${120 + Math.random() * 40}, ${50 + Math.random() * 30}%, ${25 + Math.random() * 15}%)`
    });
  }

  // Fish schools
  for (let s = 0; s < Math.ceil(CONFIG.fishCount / 5); s++) {
    const school = [];
    const baseY = H * rr(0.12, 0.6);
    const dir = Math.random() > 0.5 ? 1 : -1;
    const baseSpeed = W * rr(0.001, 0.0025) * dir;
    const hue = Math.floor(Math.random() * 360);
    const count = 3 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
      school.push({
        x: Math.random() * W,
        y: baseY + rr(-H * 0.04, H * 0.04),
        size: W * rr(0.008, 0.018),
        speed: baseSpeed * rr(0.85, 1.15), dir,
        tailPhase: Math.random() * Math.PI * 2,
        tailSpeed: rr(5, 9),
        vertDrift: rr(-0.2, 0.2), vertPhase: Math.random() * Math.PI * 2,
        bodyColor: `hsla(${hue + Math.random() * 30}, 75%, ${50 + Math.random() * 20}%, 0.85)`,
        finColor: `hsla(${hue + 20}, 65%, ${40 + Math.random() * 20}%, 0.7)`
      });
    }
    fishSchools.push(school);
  }

  // Turtle
  turtle = {
    x: -W * 0.1, y: H * 0.3, size: W * 0.05,
    speed: W * 0.0006, flipperPhase: 0, flipperSpeed: 1.8,
    vertPhase: Math.random() * Math.PI * 2
  };

  // Bubbles
  for (let i = 0; i < CONFIG.bubbleCount; i++) {
    bubbles.push({
      x: Math.random() * W, y: Math.random() * H,
      radius: W * rr(0.002, 0.007),
      speed: H * rr(0.0008, 0.003),
      wobbleAmp: W * rr(0.002, 0.006),
      wobbleFreq: rr(1, 3), wobblePhase: Math.random() * Math.PI * 2,
      opacity: rr(0.15, 0.45)
    });
  }

  // Particles
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      size: W * rr(0.0004, 0.0015),
      vx: (Math.random() - 0.5) * W * 0.0002,
      vy: -H * rr(0.00005, 0.0003),
      opacity: rr(0.1, 0.35),
      twinkle: Math.random() * Math.PI * 2
    });
  }
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.surfaceColor);
  grad.addColorStop(0.25, lerpColor(CONFIG.surfaceColor, CONFIG.bgColor, 0.4));
  grad.addColorStop(1, CONFIG.bgColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawSunrays() {
  const rayCount = 9;
  for (let i = 0; i < rayCount; i++) {
    const baseX = W * (0.05 + (i / rayCount) * 0.9);
    const sway = Math.sin(time * 0.25 + i * 1.3) * W * 0.025;
    const x = baseX + sway;
    const topW = W * 0.015;
    const botW = W * (0.05 + Math.sin(time * 0.4 + i) * 0.015);
    const op = CONFIG.sunrayOpacity * (0.7 + Math.sin(time * 0.6 + i * 0.7) * 0.3);

    const grad = ctx.createLinearGradient(x, 0, x, H * 0.9);
    grad.addColorStop(0, `rgba(200,240,255,${op * 1.5})`);
    grad.addColorStop(0.3, `rgba(120,220,255,${op})`);
    grad.addColorStop(0.7, `rgba(60,150,200,${op * 0.4})`);
    grad.addColorStop(1, 'rgba(30,80,140,0)');

    ctx.beginPath();
    ctx.moveTo(x - topW, 0);
    ctx.lineTo(x + topW, 0);
    ctx.lineTo(x + sway * 0.4 + botW, H * 0.9);
    ctx.lineTo(x + sway * 0.4 - botW, H * 0.9);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

function drawSandFloor() {
  const sandY = H * 0.82;
  const grad = ctx.createLinearGradient(0, sandY - H * 0.02, 0, H);
  grad.addColorStop(0, 'rgba(194,170,130,0.15)');
  grad.addColorStop(0.15, 'rgba(194,170,130,0.5)');
  grad.addColorStop(0.5, 'rgba(160,140,100,0.65)');
  grad.addColorStop(1, 'rgba(120,100,70,0.8)');

  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += W * 0.015) {
    const y = sandY + Math.sin(x * 0.004 + time * 0.08) * H * 0.008 + Math.sin(x * 0.01 + 1.5) * H * 0.005;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Sand ripples
  ctx.strokeStyle = 'rgba(220,200,160,0.08)';
  ctx.lineWidth = W * 0.001;
  for (let r = 0; r < 6; r++) {
    ctx.beginPath();
    const ry = sandY + H * 0.03 + r * H * 0.025;
    for (let x = 0; x <= W; x += W * 0.01) {
      const y = ry + Math.sin(x * 0.006 + r * 0.8) * H * 0.003;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Small creatures on sand
  for (let i = 0; i < 8; i++) {
    const sx = W * (0.08 + i * 0.115);
    const sy = sandY + H * 0.04 + Math.sin(sx * 0.003) * H * 0.005;
    ctx.beginPath();
    ctx.ellipse(sx, sy, W * 0.003, W * 0.0015, Math.sin(time + i) * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(140,120,90,${0.3 + Math.sin(time * 2 + i) * 0.1})`;
    ctx.fill();
  }
}

function drawBrainCoral(c) {
  const sway = Math.sin(time * 0.4 + c.phase) * W * 0.002;
  const rgb = hexToRgb(c.color);

  ctx.beginPath();
  ctx.ellipse(c.x + sway, c.y, c.w * 0.5, c.h * 0.55, 0, Math.PI, 0);
  const cGrad = ctx.createRadialGradient(c.x, c.y - c.h * 0.3, 0, c.x, c.y, c.h * 0.6);
  cGrad.addColorStop(0, `rgba(${Math.min(255,rgb.r+40)},${Math.min(255,rgb.g+40)},${Math.min(255,rgb.b+40)},0.9)`);
  cGrad.addColorStop(0.7, `rgba(${rgb.r},${rgb.g},${rgb.b},0.85)`);
  cGrad.addColorStop(1, `rgba(${Math.max(0,rgb.r-40)},${Math.max(0,rgb.g-40)},${Math.max(0,rgb.b-40)},0.8)`);
  ctx.fillStyle = cGrad;
  ctx.fill();

  // Brain ridges
  ctx.strokeStyle = `rgba(${Math.max(0,rgb.r-30)},${Math.max(0,rgb.g-30)},${Math.max(0,rgb.b-30)},0.4)`;
  ctx.lineWidth = W * 0.001;
  for (let r = 0; r < 5; r++) {
    ctx.beginPath();
    const ry = c.y - c.h * (0.1 + r * 0.08);
    for (let x = c.x - c.w * 0.4; x <= c.x + c.w * 0.4; x += W * 0.005) {
      const y = ry + Math.sin((x - c.x) * 0.05 + r * 1.2 + time * 0.2) * H * 0.004;
      if (x <= c.x - c.w * 0.4 + W * 0.005) ctx.moveTo(x + sway, y);
      else ctx.lineTo(x + sway, y);
    }
    ctx.stroke();
  }
}

function drawFanCoral(c) {
  const sway = Math.sin(time * 0.5 + c.phase) * c.swayAmp;
  const rgb = hexToRgb(c.color);

  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(sway);

  const fanLayers = 12;
  for (let l = 0; l < fanLayers; l++) {
    const angle = -Math.PI * 0.4 + (l / fanLayers) * Math.PI * 0.8;
    const len = c.size * (0.7 + Math.sin(l * 1.5) * 0.3);
    const alpha = 0.5 + (l % 2) * 0.2;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(angle - Math.PI/2) * len, Math.sin(angle - Math.PI/2) * len);
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.lineWidth = W * 0.002;
    ctx.stroke();

    for (let s = 0.3; s <= 0.9; s += 0.2) {
      const ex = Math.cos(angle - Math.PI/2) * len;
      const ey = Math.sin(angle - Math.PI/2) * len;
      const px = ex * s, py = ey * s;
      const perpX = -Math.sin(angle - Math.PI/2) * c.size * 0.08;
      const perpY = Math.cos(angle - Math.PI/2) * c.size * 0.08;
      ctx.beginPath();
      ctx.moveTo(px - perpX, py - perpY);
      ctx.lineTo(px + perpX, py + perpY);
      ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.6})`;
      ctx.lineWidth = W * 0.001;
      ctx.stroke();
    }
  }

  // Stem
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, c.size * 0.25);
  ctx.strokeStyle = `rgba(${Math.max(0,rgb.r-60)},${Math.max(0,rgb.g-60)},${Math.max(0,rgb.b-60)},0.8)`;
  ctx.lineWidth = W * 0.004;
  ctx.stroke();
  ctx.restore();
}

function drawStaghornCoral(c) {
  const sway = Math.sin(time * 0.35 + c.phase) * 0.04;
  const rgb = hexToRgb(c.color);

  ctx.save();
  ctx.translate(c.x, c.y);
  c.branches.forEach(b => {
    const angle = b.angle + sway;
    const ex = Math.cos(angle) * b.length;
    const ey = Math.sin(angle) * b.length;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(ex * 0.5 + W * 0.005, ey * 0.5, ex, ey);
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.85)`;
    ctx.lineWidth = b.width;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(ex, ey, b.width * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${Math.min(255,rgb.r+50)},${Math.min(255,rgb.g+50)},${Math.min(255,rgb.b+50)},0.7)`;
    ctx.fill();

    for (let s = 0; s < b.subBranches; s++) {
      const t = 0.4 + s * 0.25;
      const sx = Math.cos(angle) * b.length * t;
      const sy = Math.sin(angle) * b.length * t;
      const subAngle = angle + (s % 2 === 0 ? -0.6 : 0.6);
      const subLen = b.length * 0.35;
      const subEx = sx + Math.cos(subAngle) * subLen;
      const subEy = sy + Math.sin(subAngle) * subLen;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(subEx, subEy);
      ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.7)`;
      ctx.lineWidth = b.width * 0.6;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(subEx, subEy, b.width * 0.8, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${Math.min(255,rgb.r+60)},${Math.min(255,rgb.g+60)},${Math.min(255,rgb.b+60)},0.6)`;
      ctx.fill();
    }
  });
  ctx.restore();
}

function drawCorals() {
  corals.forEach(c => {
    if (c.type === 'brain') drawBrainCoral(c);
    else if (c.type === 'fan') drawFanCoral(c);
    else if (c.type === 'staghorn') drawStaghornCoral(c);
  });
}

function drawAnemones() {
  anemones.forEach(a => {
    a.tentacles.forEach(t => {
      const sway = Math.sin(time * t.speed + t.phase) * 0.3;
      const angle = t.angle + sway;
      const ex = a.x + Math.cos(angle) * t.length;
      const ey = a.y + Math.sin(angle) * t.length;
      const cpx = a.x + Math.cos(angle) * t.length * 0.5 + Math.sin(time * t.speed * 0.7 + t.phase) * W * 0.008;
      const cpy = a.y + Math.sin(angle) * t.length * 0.5;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(cpx, cpy, ex, ey);
      ctx.strokeStyle = a.color;
      ctx.lineWidth = t.width;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(ex, ey, t.width * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = a.tipColor;
      ctx.fill();
    });

    ctx.beginPath();
    ctx.ellipse(a.x, a.y + a.baseRadius * 0.3, a.baseRadius, a.baseRadius * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = a.color;
    ctx.fill();

    // Clownfish
    const cf = a.clownfish;
    cf.phase += cf.orbitSpeed * (1/60);
    const cfx = a.x + Math.cos(cf.phase) * cf.orbitRadius;
    const cfy = a.y + cf.offsetY + Math.sin(cf.phase * 1.3) * cf.orbitRadius * 0.5;
    const cfDir = Math.cos(cf.phase) > 0 ? 1 : -1;
    const s = cf.size;

    ctx.save();
    ctx.translate(cfx, cfy);
    ctx.scale(cfDir, 1);

    ctx.beginPath();
    ctx.ellipse(0, 0, s, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6a00';
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(-s * 0.15, -s * 0.55, s * 0.12, s * 1.1);
    ctx.fillRect(s * 0.3, -s * 0.45, s * 0.1, s * 0.9);

    ctx.beginPath();
    ctx.arc(s * 0.55, -s * 0.1, s * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = '#111';
    ctx.fill();

    const tailWag = Math.sin(time * 8 + cf.phase) * 0.3;
    ctx.save();
    ctx.translate(-s, 0);
    ctx.rotate(tailWag);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.4, -s * 0.35);
    ctx.lineTo(-s * 0.3, 0);
    ctx.lineTo(-s * 0.4, s * 0.35);
    ctx.closePath();
    ctx.fillStyle = '#ff6a00';
    ctx.fill();
    ctx.restore();
    ctx.restore();
  });
}

function drawSeaweed() {
  seaweeds.forEach(sw => {
    const segH = sw.height / sw.segments;
    ctx.beginPath();
    ctx.moveTo(sw.x - sw.width, sw.y);

    for (let s = 0; s <= sw.segments; s++) {
      const t = s / sw.segments;
      const sway = Math.sin(time * sw.swaySpeed + sw.phase + t * 2.5) * sw.swayAmp * t;
      ctx.lineTo(sw.x + sway - sw.width * (1 - t * 0.6), sw.y - segH * s);
    }
    for (let s = sw.segments; s >= 0; s--) {
      const t = s / sw.segments;
      const sway = Math.sin(time * sw.swaySpeed + sw.phase + t * 2.5) * sw.swayAmp * t;
      ctx.lineTo(sw.x + sway + sw.width * (1 - t * 0.6), sw.y - segH * s);
    }
    ctx.closePath();
    ctx.fillStyle = sw.color;
    ctx.fill();
  });
}

function drawFish(f) {
  const tailAngle = Math.sin(time * f.tailSpeed + f.tailPhase) * 0.4;
  const s = f.size;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.dir, 1);

  ctx.beginPath();
  ctx.moveTo(s * 0.7, 0);
  ctx.bezierCurveTo(s * 0.5, -s * 0.35, -s * 0.2, -s * 0.4, -s * 0.5, -s * 0.1);
  ctx.bezierCurveTo(-s * 0.6, 0, -s * 0.6, 0, -s * 0.5, s * 0.1);
  ctx.bezierCurveTo(-s * 0.2, s * 0.4, s * 0.5, s * 0.35, s * 0.7, 0);
  ctx.closePath();
  ctx.fillStyle = f.bodyColor;
  ctx.fill();

  ctx.save();
  ctx.translate(-s * 0.5, 0);
  ctx.rotate(tailAngle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-s * 0.4, -s * 0.3);
  ctx.lineTo(-s * 0.25, 0);
  ctx.lineTo(-s * 0.4, s * 0.3);
  ctx.closePath();
  ctx.fillStyle = f.finColor;
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(s * 0.15, -s * 0.25);
  ctx.lineTo(-s * 0.1, -s * 0.45);
  ctx.lineTo(-s * 0.25, -s * 0.22);
  ctx.closePath();
  ctx.fillStyle = f.finColor;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(s * 0.4, -s * 0.06, s * 0.07, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(240,250,255,0.9)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s * 0.42, -s * 0.06, s * 0.035, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(10,10,30,0.95)';
  ctx.fill();

  ctx.restore();
}

function drawAllFish() {
  fishSchools.forEach(school => {
    school.forEach(f => {
      f.x += f.speed;
      f.y += Math.sin(time * 0.7 + f.vertPhase) * f.vertDrift;
      if (f.dir > 0 && f.x > W + f.size * 2) f.x = -f.size * 2;
      if (f.dir < 0 && f.x < -f.size * 2) f.x = W + f.size * 2;
      if (f.y < H * 0.08) f.y = H * 0.08;
      if (f.y > H * 0.75) f.y = H * 0.75;
      drawFish(f);
    });
  });
}

function drawTurtle() {
  const t = turtle;
  t.x += t.speed;
  const vertOff = Math.sin(time * 0.3 + t.vertPhase) * H * 0.02;
  t.flipperPhase += t.flipperSpeed * (1/60);
  if (t.x > W + t.size * 3) t.x = -t.size * 3;

  const tx = t.x, ty = t.y + vertOff;
  const s = t.size;
  const flipAngle = Math.sin(t.flipperPhase) * 0.5;

  ctx.save();
  ctx.translate(tx, ty);

  // Shell
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.6, 0, 0, Math.PI * 2);
  const shellGrad = ctx.createRadialGradient(-s * 0.2, -s * 0.1, 0, 0, 0, s);
  shellGrad.addColorStop(0, '#5d8a3c');
  shellGrad.addColorStop(0.5, '#3d6b2c');
  shellGrad.addColorStop(1, '#2d4b1c');
  ctx.fillStyle = shellGrad;
  ctx.fill();

  // Shell pattern
  ctx.strokeStyle = 'rgba(80,120,50,0.5)';
  ctx.lineWidth = W * 0.001;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * s * 0.8, Math.sin(a) * s * 0.5);
    ctx.stroke();
  }

  // Head
  ctx.beginPath();
  ctx.ellipse(s * 1.1, 0, s * 0.3, s * 0.22, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#6b9a4a';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s * 1.25, -s * 0.08, s * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = '#222';
  ctx.fill();

  // Flippers
  ctx.save();
  ctx.translate(s * 0.4, -s * 0.5);
  ctx.rotate(flipAngle - 0.3);
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.6, s * 0.15, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = '#5a8a3a';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(s * 0.4, s * 0.5);
  ctx.rotate(-flipAngle + 0.3);
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.6, s * 0.15, 0.4, 0, Math.PI * 2);
  ctx.fillStyle = '#5a8a3a';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(-s * 0.7, -s * 0.35);
  ctx.rotate(flipAngle * 0.5 - 0.5);
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.35, s * 0.1, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = '#4a7a2a';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(-s * 0.7, s * 0.35);
  ctx.rotate(-flipAngle * 0.5 + 0.5);
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.35, s * 0.1, 0.6, 0, Math.PI * 2);
  ctx.fillStyle = '#4a7a2a';
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawBubbles() {
  bubbles.forEach(b => {
    b.y -= b.speed;
    b.x += Math.sin(time * b.wobbleFreq + b.wobblePhase) * b.wobbleAmp * 0.02;
    if (b.y < -b.radius * 2) { b.y = H + b.radius; b.x = Math.random() * W; }

    const glowGrad = ctx.createRadialGradient(b.x, b.y, b.radius * 0.3, b.x, b.y, b.radius * 2);
    glowGrad.addColorStop(0, `rgba(180,240,255,${b.opacity * 0.12})`);
    glowGrad.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200,240,255,${b.opacity})`;
    ctx.lineWidth = b.radius * 0.12;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240,255,255,${b.opacity * 0.7})`;
    ctx.fill();
  });
}

function drawParticles() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    const tw = 0.5 + Math.sin(time * 2 + p.twinkle) * 0.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,235,255,${p.opacity * tw})`;
    ctx.fill();
  });
}

function drawSurfaceRipples() {
  ctx.strokeStyle = 'rgba(150,220,255,0.06)';
  ctx.lineWidth = W * 0.0015;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += W * 0.008) {
      const y = H * 0.015 + i * H * 0.01
        + Math.sin(x * 0.005 + time * 1.0 + i * 0.6) * H * 0.004
        + Math.sin(x * 0.01 + time * 0.6 - i) * H * 0.002;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function draw() {
  drawBackground();
  drawSunrays();
  drawSurfaceRipples();
  drawParticles();
  drawSandFloor();
  drawSeaweed();
  drawCorals();
  drawAnemones();
  drawTurtle();
  drawAllFish();
  drawBubbles();

  time += 1 / 60;
  if (time > CONFIG.cycleDuration) time -= CONFIG.cycleDuration;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>

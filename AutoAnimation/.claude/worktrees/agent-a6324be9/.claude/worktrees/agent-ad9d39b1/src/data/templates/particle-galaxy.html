<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Galaxy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #050510; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .overlay-text {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; pointer-events: none;
  }
  .overlay-text h1 {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 48px; font-weight: 100; letter-spacing: 16px; text-transform: uppercase;
    color: rgba(220, 200, 255, 0.85);
    text-shadow: 0 0 40px rgba(160, 120, 255, 0.5), 0 0 80px rgba(160, 120, 255, 0.2);
    animation: titlePulse 6s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { opacity: 0.6; letter-spacing: 16px; }
    50% { opacity: 1; letter-spacing: 19px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay-text">
  <h1 id="titleEl">Galaxy</h1>
</div>

<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  bgColor: '#050510',
  coreColor: '#ffe8b0',
  armColors: ['#7b3ff2', '#3b6ff5', '#f25895', '#36d1c4'],
  particleCount: 3000,
  rotationSpeed: 0.15,
  shootingStarRate: 0.003,
  title: 'Galaxy'
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
    document.getElementById('titleEl').textContent = CONFIG.title;
    initParticles();
  }
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  initParticles();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

// --- Particles ---
let particles = [];
let shootingStars = [];
let backgroundStars = [];

function initParticles() {
  particles = [];
  backgroundStars = [];
  const count = CONFIG.particleCount;
  const arms = CONFIG.armColors.length;

  for (let i = 0; i < count; i++) {
    const armIndex = i % arms;
    const baseAngle = (armIndex / arms) * Math.PI * 2;
    const dist = Math.pow(Math.random(), 0.55) * Math.min(W, H) * 0.44;
    const spread = (Math.random() - 0.5) * 0.55 * (dist / (Math.min(W, H) * 0.44));
    const angle = baseAngle + dist * 0.005 + spread;
    const size = Math.random() * 2 + 0.3;
    const brightness = 0.3 + Math.random() * 0.7;
    const twinkleSpeed = 0.5 + Math.random() * 2;
    const twinklePhase = Math.random() * Math.PI * 2;
    const tiltZ = (Math.random() - 0.5) * dist * 0.3;

    particles.push({
      dist, angle, size, brightness, tiltZ,
      armIndex, twinkleSpeed, twinklePhase,
      orbitSpeed: (0.02 + Math.random() * 0.03) / (1 + dist * 0.003)
    });
  }

  // Sort by depth for painter's algorithm (tiltZ)
  particles.sort((a, b) => a.tiltZ - b.tiltZ);

  // Static background stars
  for (let i = 0; i < 350; i++) {
    backgroundStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.2,
      alpha: Math.random() * 0.5 + 0.1,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.3 + Math.random() * 1.5
    });
  }
}

// --- Shooting Stars ---
function spawnShootingStar() {
  const edge = Math.random();
  let sx, sy, angle;
  if (edge < 0.5) {
    sx = Math.random() * W;
    sy = -10;
    angle = Math.PI * 0.25 + Math.random() * 0.5;
  } else {
    sx = W + 10;
    sy = Math.random() * H * 0.4;
    angle = Math.PI * 0.55 + Math.random() * 0.4;
  }
  const speed = 6 + Math.random() * 8;
  shootingStars.push({
    x: sx, y: sy,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1.0,
    decay: 0.008 + Math.random() * 0.012,
    length: 30 + Math.random() * 50
  });
}

// --- Nebula glow layer ---
function drawNebulaGlow(t) {
  const arms = CONFIG.armColors;
  ctx.globalCompositeOperation = 'screen';

  for (let i = 0; i < arms.length; i++) {
    const rgb = hexToRgb(arms[i]);
    const armAngle = (i / arms.length) * Math.PI * 2 + t * CONFIG.rotationSpeed * 0.18;
    const dist = Math.min(W, H) * 0.2;
    const gx = cx + Math.cos(armAngle) * dist;
    const gy = cy + Math.sin(armAngle) * dist * 0.7;
    const radius = Math.min(W, H) * 0.32;
    const pulse = 0.9 + 0.1 * Math.sin(t * 0.4 + i * 1.5);

    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius * pulse);
    grad.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},0.07)`);
    grad.addColorStop(0.4, `rgba(${rgb.r},${rgb.g},${rgb.b},0.025)`);
    grad.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'source-over';
}

// --- Core glow ---
function drawCore(t) {
  const coreRgb = hexToRgb(CONFIG.coreColor);
  const pulse = 0.85 + 0.15 * Math.sin(t * 1.2);
  const baseRadius = Math.min(W, H) * 0.055 * pulse;

  // Outer halo
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius * 5);
  halo.addColorStop(0, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0.12)`);
  halo.addColorStop(0.25, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0.04)`);
  halo.addColorStop(1, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0)`);
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  // Bright core
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius);
  core.addColorStop(0, 'rgba(255,255,255,0.95)');
  core.addColorStop(0.15, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0.8)`);
  core.addColorStop(0.5, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0.25)`);
  core.addColorStop(1, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0)`);
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
  ctx.fill();

  // Cross glare spikes
  ctx.globalCompositeOperation = 'screen';
  const glareLen = baseRadius * 3.5;
  for (let a = 0; a < 4; a++) {
    const ga = (a / 4) * Math.PI + t * 0.08;
    const grad = ctx.createLinearGradient(
      cx - Math.cos(ga) * glareLen, cy - Math.sin(ga) * glareLen,
      cx + Math.cos(ga) * glareLen, cy + Math.sin(ga) * glareLen
    );
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.42, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, `rgba(${coreRgb.r},${coreRgb.g},${coreRgb.b},0.12)`);
    grad.addColorStop(0.58, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// --- Dust lanes ---
function drawDustLanes(t) {
  ctx.globalCompositeOperation = 'multiply';
  const arms = CONFIG.armColors.length;
  for (let i = 0; i < arms; i++) {
    const armAngle = (i / arms) * Math.PI * 2 + t * CONFIG.rotationSpeed * 0.18 + 0.15;
    for (let d = 0.15; d < 0.4; d += 0.08) {
      const dist = Math.min(W, H) * d;
      const dx = cx + Math.cos(armAngle + d * 2) * dist;
      const dy = cy + Math.sin(armAngle + d * 2) * dist * 0.7;
      const r = Math.min(W, H) * 0.06;
      const grad = ctx.createRadialGradient(dx, dy, 0, dx, dy, r);
      grad.addColorStop(0, 'rgba(5,5,16,0.15)');
      grad.addColorStop(1, 'rgba(5,5,16,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(dx, dy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// --- Main loop ---
let time = 0;

function draw() {
  time += 0.016;

  // Clear
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Background stars
  backgroundStars.forEach(s => {
    s.twinkle += s.twinkleSpeed * 0.016;
    const a = s.alpha * (0.5 + 0.5 * Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,255,${a})`;
    ctx.fill();
  });

  // Nebula glow
  drawNebulaGlow(time);

  // Dust lanes (subtle dark regions between arms)
  drawDustLanes(time);

  // Particles (galaxy arms)
  const rotOffset = time * CONFIG.rotationSpeed;
  const arms = CONFIG.armColors;

  ctx.globalCompositeOperation = 'screen';
  particles.forEach(p => {
    const angle = p.angle + rotOffset * p.orbitSpeed;
    const px = cx + Math.cos(angle) * p.dist;
    const py = cy + Math.sin(angle) * p.dist * 0.65 + p.tiltZ * 0.2;

    if (px < -10 || px > W + 10 || py < -10 || py > H + 10) return;

    const twinkle = 0.5 + 0.5 * Math.sin(time * p.twinkleSpeed + p.twinklePhase);
    const alpha = p.brightness * twinkle;
    const rgb = hexToRgb(arms[p.armIndex]);

    // Near core = whiter, far = arm color
    const distRatio = p.dist / (Math.min(W, H) * 0.44);
    const coreBlend = Math.max(0, 1 - distRatio) * 0.65;
    const cr = Math.round(rgb.r + (255 - rgb.r) * coreBlend);
    const cg = Math.round(rgb.g + (255 - rgb.g) * coreBlend);
    const cb = Math.round(rgb.b + (255 - rgb.b) * coreBlend);

    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    ctx.fill();

    // Glow on larger particles
    if (p.size > 1.4) {
      ctx.beginPath();
      ctx.arc(px, py, p.size * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.06})`;
      ctx.fill();
    }
  });
  ctx.globalCompositeOperation = 'source-over';

  // Core
  drawCore(time);

  // Shooting stars
  if (Math.random() < CONFIG.shootingStarRate) {
    spawnShootingStar();
  }

  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;
    if (s.life <= 0) { shootingStars.splice(i, 1); continue; }

    const mag = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    const tailX = s.x - (s.vx / mag) * s.length;
    const tailY = s.y - (s.vy / mag) * s.length;

    const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
    grad.addColorStop(0.2, `rgba(200,220,255,${s.life * 0.6})`);
    grad.addColorStop(1, 'rgba(200,220,255,0)');

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Head glow
    ctx.beginPath();
    ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.life * 0.9})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

document.getElementById('titleEl').textContent = CONFIG.title;
window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>

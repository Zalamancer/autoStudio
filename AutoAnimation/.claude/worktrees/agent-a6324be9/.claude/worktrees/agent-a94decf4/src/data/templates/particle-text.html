<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Text</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  words: ['DREAM', 'CREATE', 'INSPIRE', 'BUILD'],
  particleCount: 2000,
  particleSize: 2,
  fontSize: 120,
  fontFamily: 'Arial Black',
  formSpeed: 0.08,
  explodeForce: 8,
  friction: 0.95,
  holdDuration: 2000,
  transitionDuration: 1500,
  cycleDuration: 14000,
  bgColor: '#0a0a12',
  particleColor: '#818cf8',
  particleColorAlt: '#e879f9',
};

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var W, H;
var particles = [];
var wordIdx = 0;
var phase = 'form'; // form, hold, explode
var phaseTimer = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function getTextPixels(text) {
  var offCanvas = document.createElement('canvas');
  offCanvas.width = W;
  offCanvas.height = H;
  var offCtx = offCanvas.getContext('2d');
  offCtx.fillStyle = '#fff';
  offCtx.font = 'bold ' + CONFIG.fontSize + 'px ' + CONFIG.fontFamily;
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';
  offCtx.fillText(text, W / 2, H / 2);
  var data = offCtx.getImageData(0, 0, W, H).data;
  var pts = [];
  var gap = 4;
  for (var y = 0; y < H; y += gap) {
    for (var x = 0; x < W; x += gap) {
      if (data[(y * W + x) * 4 + 3] > 128) {
        pts.push({ x: x, y: y });
      }
    }
  }
  return pts;
}

function initParticles() {
  particles = [];
  for (var i = 0; i < CONFIG.particleCount; i++) {
    var useAlt = Math.random() > 0.5;
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      tx: W / 2,
      ty: H / 2,
      vx: 0,
      vy: 0,
      size: CONFIG.particleSize * (0.5 + Math.random()),
      color: useAlt ? CONFIG.particleColorAlt : CONFIG.particleColor,
      alpha: 0.3 + Math.random() * 0.7,
    });
  }
}

function assignTargets(text) {
  var pts = getTextPixels(text);
  if (pts.length === 0) return;
  for (var i = 0; i < particles.length; i++) {
    var pt = pts[i % pts.length];
    particles[i].tx = pt.x + (Math.random() - 0.5) * 2;
    particles[i].ty = pt.y + (Math.random() - 0.5) * 2;
  }
}

function explodeParticles() {
  for (var i = 0; i < particles.length; i++) {
    var angle = Math.random() * Math.PI * 2;
    var force = CONFIG.explodeForce * (0.5 + Math.random());
    particles[i].vx = Math.cos(angle) * force;
    particles[i].vy = Math.sin(angle) * force;
    particles[i].tx = Math.random() * W;
    particles[i].ty = Math.random() * H;
  }
}

function update() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    if (phase === 'form' || phase === 'hold') {
      var dx = p.tx - p.x;
      var dy = p.ty - p.y;
      p.vx += dx * CONFIG.formSpeed;
      p.vy += dy * CONFIG.formSpeed;
    }
    p.vx *= CONFIG.friction;
    p.vy *= CONFIG.friction;
    p.x += p.vx;
    p.y += p.vy;
  }
}

function draw() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

var lastTime = 0;
function animate(time) {
  var dt = time - lastTime;
  lastTime = time;
  phaseTimer += dt;

  if (phase === 'form' && phaseTimer > CONFIG.transitionDuration) {
    phase = 'hold';
    phaseTimer = 0;
  } else if (phase === 'hold' && phaseTimer > CONFIG.holdDuration) {
    phase = 'explode';
    phaseTimer = 0;
    explodeParticles();
  } else if (phase === 'explode' && phaseTimer > CONFIG.transitionDuration) {
    phase = 'form';
    phaseTimer = 0;
    wordIdx = (wordIdx + 1) % CONFIG.words.length;
    assignTargets(CONFIG.words[wordIdx]);
  }

  update();
  draw();
  requestAnimationFrame(animate);
}

initParticles();
assignTargets(CONFIG.words[0]);
requestAnimationFrame(animate);
</script>
</body>
</html>

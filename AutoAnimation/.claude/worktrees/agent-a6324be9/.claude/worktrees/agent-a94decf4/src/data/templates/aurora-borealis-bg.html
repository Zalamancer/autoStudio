<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas#auroraCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
</style>
</head>
<body>
<canvas id="auroraCanvas"></canvas>

<script>
// ===== EDITABLE CONFIG =====
const CONFIG = {
  auroraColors: ['#00FF88', '#22DDAA', '#6644FF', '#CC44AA', '#44FFCC'],
  starCount: 200,
  mountainColor: '#0A0A18',
  bgColor: '#040410',
  skyGradientBottom: '#0C0C2A',
  waveSpeed: 1.0,
  intensity: 0.8,
  shootingStarChance: 0.003,
  fogColor: '#1A1A3A',
  treelineColor: '#060612',
  cycleDuration: 30000,
};
// ============================

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('auroraCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateTerrain();
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}

// --- Stars ---
const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.65,
    r: Math.random() * 1.8 + 0.3,
    brightness: 0.3 + Math.random() * 0.7,
    twinklePhase: Math.random() * Math.PI * 2,
    twinkleSpeed: 0.005 + Math.random() * 0.015,
    color: Math.random() > 0.85 ? '#AACCFF' : (Math.random() > 0.5 ? '#FFFFFF' : '#FFE8CC'),
  });
}

// --- Aurora curtains ---
class AuroraCurtain {
  constructor(index, total) {
    this.colorIndex = index % CONFIG.auroraColors.length;
    this.yCenter = 0.12 + (index / total) * 0.25;
    this.height = 0.08 + Math.random() * 0.15;
    this.segments = 80 + Math.floor(Math.random() * 40);
    this.basePhase = Math.random() * Math.PI * 2;
    this.freq1 = 0.02 + Math.random() * 0.015;
    this.freq2 = 0.008 + Math.random() * 0.008;
    this.freq3 = 0.003 + Math.random() * 0.004;
    this.speed1 = (0.0006 + Math.random() * 0.0008) * CONFIG.waveSpeed;
    this.speed2 = (0.0003 + Math.random() * 0.0005) * CONFIG.waveSpeed;
    this.speed3 = (0.0001 + Math.random() * 0.0003) * CONFIG.waveSpeed;
    this.amplitude1 = 15 + Math.random() * 25;
    this.amplitude2 = 8 + Math.random() * 15;
    this.amplitude3 = 20 + Math.random() * 30;
    this.opacityBase = 0.04 + Math.random() * 0.06;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.0003 + Math.random() * 0.0004;
  }

  draw(t) {
    const color = hexToRgb(CONFIG.auroraColors[this.colorIndex]);
    const secondaryIdx = (this.colorIndex + 1) % CONFIG.auroraColors.length;
    const color2 = hexToRgb(CONFIG.auroraColors[secondaryIdx]);
    const pulse = 0.6 + 0.4 * Math.sin(t * this.pulseSpeed + this.pulsePhase);
    const opacity = this.opacityBase * CONFIG.intensity * pulse;
    const centerY = this.yCenter * H;
    const bandH = this.height * H;

    // Draw curtain as vertical strips for flowing effect
    const stripW = Math.ceil(W / this.segments);
    for (let s = 0; s <= this.segments; s++) {
      const x = (s / this.segments) * W;
      const normX = s / this.segments;

      // Multi-frequency wave displacement
      const wave1 = Math.sin(normX * this.freq1 * 100 + t * this.speed1 + this.basePhase) * this.amplitude1;
      const wave2 = Math.sin(normX * this.freq2 * 100 + t * this.speed2 + this.basePhase * 2) * this.amplitude2;
      const wave3 = Math.cos(normX * this.freq3 * 100 + t * this.speed3) * this.amplitude3;
      const waveY = centerY + wave1 + wave2 + wave3;

      // Height variation along curtain
      const heightVar = 0.7 + 0.3 * Math.sin(normX * 8 + t * this.speed1 * 0.5);
      const localH = bandH * heightVar;

      // Color blend along the curtain
      const blend = (Math.sin(normX * 5 + t * 0.0002) + 1) * 0.5;
      const cr = Math.round(color.r + (color2.r - color.r) * blend);
      const cg = Math.round(color.g + (color2.g - color.g) * blend);
      const cb = Math.round(color.b + (color2.b - color.b) * blend);

      // Vertical gradient strip
      const grad = ctx.createLinearGradient(x, waveY - localH * 0.5, x, waveY + localH * 0.5);
      grad.addColorStop(0, `rgba(${cr},${cg},${cb},0)`);
      grad.addColorStop(0.2, `rgba(${cr},${cg},${cb},${opacity * 0.5})`);
      grad.addColorStop(0.4, `rgba(${cr},${cg},${cb},${opacity})`);
      grad.addColorStop(0.5, `rgba(${Math.min(255,cr+40)},${Math.min(255,cg+40)},${Math.min(255,cb+40)},${opacity * 1.3})`);
      grad.addColorStop(0.6, `rgba(${cr},${cg},${cb},${opacity})`);
      grad.addColorStop(0.8, `rgba(${cr},${cg},${cb},${opacity * 0.5})`);
      grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);

      ctx.fillStyle = grad;
      ctx.fillRect(x - 1, waveY - localH * 0.5, stripW + 2, localH);
    }
  }
}

const curtainCount = 5;
const curtains = [];
for (let i = 0; i < curtainCount; i++) {
  curtains.push(new AuroraCurtain(i, curtainCount));
}

// --- Shooting stars ---
const shootingStars = [];

function maybeSpawnShooting() {
  if (Math.random() < CONFIG.shootingStarChance && shootingStars.length < 3) {
    const angle = 0.3 + Math.random() * 0.5;
    const speed = 5 + Math.random() * 8;
    shootingStars.push({
      x: Math.random() * W * 0.8,
      y: Math.random() * H * 0.3,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.01 + Math.random() * 0.015,
      len: 30 + Math.random() * 50,
    });
  }
}

// --- Mountain terrain ---
let mountainPoints = [];
let treelinePoints = [];

function generateTerrain() {
  mountainPoints = [];
  treelinePoints = [];

  // Mountains (mid-ground)
  const mtnY = H * 0.72;
  const mtnSegments = 120;
  for (let i = 0; i <= mtnSegments; i++) {
    const x = (i / mtnSegments) * W;
    const nx = i / mtnSegments;
    const h1 = Math.sin(nx * 3.5) * H * 0.08;
    const h2 = Math.sin(nx * 7.2 + 1) * H * 0.04;
    const h3 = Math.sin(nx * 15 + 2.5) * H * 0.015;
    // Create distinct peaks
    const peak1 = Math.max(0, 1 - Math.abs(nx - 0.25) * 6) * H * 0.1;
    const peak2 = Math.max(0, 1 - Math.abs(nx - 0.6) * 5) * H * 0.12;
    const peak3 = Math.max(0, 1 - Math.abs(nx - 0.85) * 7) * H * 0.07;
    mountainPoints.push({ x, y: mtnY - h1 - h2 - h3 - peak1 - peak2 - peak3 });
  }

  // Treeline (foreground)
  const treeY = H * 0.82;
  const treeSegments = 200;
  for (let i = 0; i <= treeSegments; i++) {
    const x = (i / treeSegments) * W;
    const nx = i / treeSegments;
    // Jagged tree tops
    const treeH = Math.abs(Math.sin(nx * 80)) * H * 0.03 + Math.sin(nx * 20) * H * 0.01;
    const gap = Math.sin(nx * 5) > 0.8 ? H * 0.01 : 0; // occasional gaps
    treelinePoints.push({ x, y: treeY - treeH + gap });
  }
}

// --- Fog ---
class FogLayer {
  constructor(y, height, opacity, speed) {
    this.y = y;
    this.height = height;
    this.opacity = opacity;
    this.speed = speed;
    this.offset = Math.random() * 1000;
  }
  draw(t) {
    const fogRgb = hexToRgb(CONFIG.fogColor);
    const drift = Math.sin(t * this.speed + this.offset) * W * 0.03;
    const fogGrad = ctx.createLinearGradient(0, this.y * H, 0, (this.y + this.height) * H);
    fogGrad.addColorStop(0, `rgba(${fogRgb.r},${fogRgb.g},${fogRgb.b},0)`);
    fogGrad.addColorStop(0.4, `rgba(${fogRgb.r},${fogRgb.g},${fogRgb.b},${this.opacity})`);
    fogGrad.addColorStop(0.6, `rgba(${fogRgb.r},${fogRgb.g},${fogRgb.b},${this.opacity})`);
    fogGrad.addColorStop(1, `rgba(${fogRgb.r},${fogRgb.g},${fogRgb.b},0)`);

    ctx.save();
    ctx.translate(drift, 0);
    ctx.fillStyle = fogGrad;
    ctx.fillRect(-W * 0.1, this.y * H, W * 1.2, this.height * H);
    ctx.restore();
  }
}

const fogLayers = [
  new FogLayer(0.70, 0.12, 0.08, 0.0001),
  new FogLayer(0.78, 0.10, 0.12, 0.00015),
  new FogLayer(0.85, 0.15, 0.15, 0.00008),
];

// --- Drawing ---
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.bgColor);
  grad.addColorStop(0.5, CONFIG.skyGradientBottom);
  grad.addColorStop(0.75, CONFIG.bgColor);
  grad.addColorStop(1, CONFIG.bgColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t) {
  stars.forEach(s => {
    s.twinklePhase += s.twinkleSpeed;
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(s.twinklePhase));
    const alpha = twinkle * s.brightness;
    const sx = s.x * W;
    const sy = s.y * H;
    const rgb = hexToRgb(s.color);

    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.fill();

    // Subtle glow on brighter stars
    if (s.r > 1.2 && twinkle > 0.7) {
      ctx.beginPath();
      ctx.arc(sx, sy, s.r * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.08})`;
      ctx.fill();
    }
  });
}

function drawAurora(t) {
  ctx.globalCompositeOperation = 'screen';
  curtains.forEach(c => c.draw(t));
  ctx.globalCompositeOperation = 'source-over';
}

function drawShootingStars() {
  maybeSpawnShooting();
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;
    if (s.life <= 0) { shootingStars.splice(i, 1); continue; }

    const mag = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    const tailX = s.x - s.vx * (s.len / mag);
    const tailY = s.y - s.vy * (s.len / mag);

    const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
    grad.addColorStop(0.3, `rgba(200,220,255,${s.life * 0.5})`);
    grad.addColorStop(1, `rgba(100,150,255,0)`);

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Head glow
    ctx.beginPath();
    ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.life * 0.8})`;
    ctx.fill();
  }
}

function drawMountains() {
  const mtnRgb = hexToRgb(CONFIG.mountainColor);
  // Mountain fill
  ctx.beginPath();
  ctx.moveTo(0, H);
  mountainPoints.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(W, H);
  ctx.closePath();

  const mtnGrad = ctx.createLinearGradient(0, H * 0.55, 0, H * 0.85);
  mtnGrad.addColorStop(0, `rgba(${mtnRgb.r+10},${mtnRgb.g+10},${mtnRgb.b+25},1)`);
  mtnGrad.addColorStop(1, `rgba(${mtnRgb.r},${mtnRgb.g},${mtnRgb.b},1)`);
  ctx.fillStyle = mtnGrad;
  ctx.fill();

  // Snow caps on peaks
  ctx.beginPath();
  for (let i = 1; i < mountainPoints.length - 1; i++) {
    const p = mountainPoints[i];
    const prev = mountainPoints[i - 1];
    const next = mountainPoints[i + 1];
    if (p.y < prev.y && p.y < next.y && p.y < H * 0.65) {
      ctx.moveTo(p.x - 8, p.y + 3);
      ctx.lineTo(p.x, p.y);
      ctx.lineTo(p.x + 8, p.y + 3);
    }
  }
  ctx.strokeStyle = 'rgba(200,210,230,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawTreeline() {
  const treeRgb = hexToRgb(CONFIG.treelineColor);
  ctx.beginPath();
  ctx.moveTo(0, H);
  treelinePoints.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = `rgb(${treeRgb.r},${treeRgb.g},${treeRgb.b})`;
  ctx.fill();
}

function drawFog(t) {
  fogLayers.forEach(f => f.draw(t));
}

// --- Aurora reflection on ground ---
function drawAuroraReflection(t) {
  const groundY = H * 0.82;
  const reflH = H * 0.18;
  const primaryColor = hexToRgb(CONFIG.auroraColors[0]);
  const secondaryColor = hexToRgb(CONFIG.auroraColors[2] || CONFIG.auroraColors[0]);
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.0004);
  const alpha = 0.02 * CONFIG.intensity * pulse;

  const reflGrad = ctx.createLinearGradient(0, groundY, 0, groundY + reflH);
  reflGrad.addColorStop(0, `rgba(${primaryColor.r},${primaryColor.g},${primaryColor.b},${alpha})`);
  reflGrad.addColorStop(0.5, `rgba(${secondaryColor.r},${secondaryColor.g},${secondaryColor.b},${alpha * 0.5})`);
  reflGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = reflGrad;
  ctx.fillRect(0, groundY, W, reflH);
}

function animate(t) {
  drawSky();
  drawStars(t);
  drawAurora(t);
  drawShootingStars();
  drawMountains();
  drawFog(t);
  drawTreeline();
  drawAuroraReflection(t);
  requestAnimationFrame(animate);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(animate);
</script>
</body>
</html>

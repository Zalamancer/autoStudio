<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Digital Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000800;
    font-family: 'Courier New', monospace;
  }
  canvas#matrixCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<script>
// ===== EDITABLE CONFIG =====
const CONFIG = {
  charSet: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=<>',
  columnCount: 60,
  fallSpeed: 1.0,
  glowIntensity: 0.8,
  bgColor: '#000800',
  rainColor: '#00FF41',
  leadColor: '#CCFFCC',
  dimColor: '#003B00',
  cycleDuration: 30000,
};
// ============================

const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let W, H, fontSize, cols;

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}

const rainRgb = hexToRgb(CONFIG.rainColor);
const leadRgb = hexToRgb(CONFIG.leadColor);
const dimRgb = hexToRgb(CONFIG.dimColor);

// Column state
let columns = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  fontSize = Math.max(10, Math.floor(W / CONFIG.columnCount));
  cols = Math.ceil(W / fontSize);
  initColumns();
}

function initColumns() {
  const oldLen = columns.length;
  const newCols = [];
  for (let i = 0; i < cols; i++) {
    if (i < oldLen && columns[i]) {
      newCols.push(columns[i]);
    } else {
      newCols.push(createColumn(i));
    }
  }
  columns = newCols;
}

function createColumn(index) {
  const maxChars = Math.ceil(H / fontSize) + 10;
  const streamLen = Math.floor(Math.random() * maxChars * 0.6) + 8;
  const speed = (0.4 + Math.random() * 1.2) * CONFIG.fallSpeed;
  const depthLayer = Math.random(); // 0 = far, 1 = near
  const brightness = 0.3 + depthLayer * 0.7;
  const chars = [];
  for (let j = 0; j < streamLen; j++) {
    chars.push({
      char: randomChar(),
      changeTimer: Math.random() * 200,
      changeInterval: 50 + Math.random() * 300,
    });
  }
  return {
    x: index * fontSize,
    y: -streamLen * fontSize - Math.random() * H * 1.5,
    speed: speed,
    streamLen: streamLen,
    chars: chars,
    brightness: brightness,
    depthLayer: depthLayer,
    glowRadius: depthLayer * 6 + 2,
  };
}

function randomChar() {
  return CONFIG.charSet[Math.floor(Math.random() * CONFIG.charSet.length)];
}

let lastTime = 0;

function animate(timestamp) {
  const dt = lastTime ? (timestamp - lastTime) : 16;
  lastTime = timestamp;

  // Fade background with trail effect
  ctx.fillStyle = CONFIG.bgColor + 'E6'; // ~90% opacity for trails
  ctx.fillRect(0, 0, W, H);

  // Subtle scanline overlay
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let sy = 0; sy < H; sy += 2) {
    ctx.fillRect(0, sy, W, 1);
  }

  const speedMult = dt / 16.67; // normalize to 60fps

  for (let c = 0; c < columns.length; c++) {
    const col = columns[c];
    col.y += col.speed * speedMult * fontSize * 0.08;

    // Reset column when fully off screen
    const bottomY = col.y;
    const topY = col.y - col.streamLen * fontSize;
    if (topY > H) {
      columns[c] = createColumn(c);
      columns[c].y = -columns[c].streamLen * fontSize - Math.random() * 200;
      continue;
    }

    // Draw each character in the stream
    for (let j = 0; j < col.streamLen; j++) {
      const charY = col.y - j * fontSize;
      if (charY < -fontSize || charY > H + fontSize) continue;

      const charData = col.chars[j];

      // Random character mutation
      charData.changeTimer += dt;
      if (charData.changeTimer > charData.changeInterval) {
        charData.changeTimer = 0;
        charData.char = randomChar();
      }

      // Fade based on position in stream (head = bright, tail = dim)
      const normalizedPos = j / col.streamLen;
      const fadeFactor = 1 - normalizedPos;
      const alpha = fadeFactor * col.brightness;

      if (j === 0) {
        // Lead character - brightest, with glow
        const glowSize = col.glowRadius * CONFIG.glowIntensity;
        ctx.shadowColor = `rgba(${leadRgb.r},${leadRgb.g},${leadRgb.b},${0.9 * CONFIG.glowIntensity})`;
        ctx.shadowBlur = glowSize * 2;
        ctx.fillStyle = `rgba(${leadRgb.r},${leadRgb.g},${leadRgb.b},1)`;
        ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
        ctx.fillText(charData.char, col.x, charY);
        ctx.shadowBlur = 0;

        // Extra glow bloom
        ctx.fillStyle = `rgba(255,255,255,${0.3 * CONFIG.glowIntensity})`;
        ctx.beginPath();
        ctx.arc(col.x + fontSize * 0.35, charY - fontSize * 0.3, glowSize, 0, Math.PI * 2);
        ctx.fill();

      } else if (j < 3) {
        // Near-head characters - bright green with glow
        const headAlpha = (1 - (j / 3)) * 0.6 + 0.4;
        ctx.shadowColor = `rgba(${rainRgb.r},${rainRgb.g},${rainRgb.b},${0.4 * CONFIG.glowIntensity})`;
        ctx.shadowBlur = col.glowRadius * CONFIG.glowIntensity;
        ctx.fillStyle = `rgba(${rainRgb.r},${rainRgb.g},${rainRgb.b},${headAlpha * col.brightness})`;
        ctx.font = `${fontSize}px 'Courier New', monospace`;
        ctx.fillText(charData.char, col.x, charY);
        ctx.shadowBlur = 0;

      } else {
        // Body and tail characters
        const r = Math.round(dimRgb.r + (rainRgb.r - dimRgb.r) * fadeFactor);
        const g = Math.round(dimRgb.g + (rainRgb.g - dimRgb.g) * fadeFactor);
        const b = Math.round(dimRgb.b + (rainRgb.b - dimRgb.b) * fadeFactor);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.85})`;
        ctx.font = `${fontSize}px 'Courier New', monospace`;
        ctx.fillText(charData.char, col.x, charY);
      }
    }
  }

  // Occasional bright flash on random column
  if (Math.random() > 0.992) {
    const flashCol = Math.floor(Math.random() * columns.length);
    if (columns[flashCol]) {
      const fx = columns[flashCol].x;
      const fy = Math.random() * H;
      ctx.fillStyle = `rgba(${leadRgb.r},${leadRgb.g},${leadRgb.b},0.15)`;
      ctx.fillRect(fx - 2, 0, fontSize + 4, H);
    }
  }

  requestAnimationFrame(animate);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(animate);
</script>
</body>
</html>

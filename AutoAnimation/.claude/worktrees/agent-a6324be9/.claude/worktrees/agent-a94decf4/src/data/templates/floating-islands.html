<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Islands</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(5,10,30,0.5) 100%); }
  .center-text { position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #D0E0F0; pointer-events: none; }
  .center-text h1 { font-size: 44px; font-weight: 300; letter-spacing: 12px; font-style: italic;
    text-shadow: 0 0 30px rgba(120,180,240,0.3); animation: floatText 6s ease-in-out infinite; }
  .center-text .subtitle { font-size: 12px; letter-spacing: 8px; opacity: 0.4; margin-top: 10px; }
  @keyframes floatText { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) translateY(0); }
    50% { opacity: 1; transform: translate(-50%, -50%) translateY(-5px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="titleEl">Aetheria</h1>
  <div class="subtitle" id="subEl">Sky Kingdom</div>
</div>
<script>
const CONFIG = {
  titleText: 'Aetheria',
  subtitleText: 'Sky Kingdom',
  skyTop: '#0a0820',
  skyMid: '#1a2848',
  skyBottom: '#3a5878',
  cloudColor: '#2a4060',
  islandCount: 4,
  waterfallColor: '#88BBDD',
  particleCount: 50,
  sunColor: '#FFCC88',
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});
function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

const islands = [
  { x: 0.25, y: 0.45, w: 0.2, h: 0.06, trees: 5, waterfall: true, bobSpeed: 0.0008, bobAmp: 8 },
  { x: 0.65, y: 0.35, w: 0.18, h: 0.05, trees: 4, waterfall: false, bobSpeed: 0.0006, bobAmp: 10 },
  { x: 0.45, y: 0.6, w: 0.25, h: 0.07, trees: 7, waterfall: true, bobSpeed: 0.0005, bobAmp: 6 },
  { x: 0.8, y: 0.55, w: 0.14, h: 0.04, trees: 3, waterfall: false, bobSpeed: 0.0009, bobAmp: 12 },
];

const particles = [];
for (let i = 0; i < CONFIG.particleCount; i++) {
  particles.push({
    x: Math.random() * 2000, y: Math.random() * 1000,
    size: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1,
    phase: Math.random() * Math.PI * 2, opacity: Math.random() * 0.3 + 0.1,
  });
}

const clouds = [];
for (let i = 0; i < 8; i++) {
  clouds.push({
    x: Math.random() * 2000, y: H * (0.15 + Math.random() * 0.6),
    w: 80 + Math.random() * 120, h: 20 + Math.random() * 30,
    speed: Math.random() * 0.15 + 0.05, opacity: Math.random() * 0.15 + 0.05,
  });
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, CONFIG.skyTop);
  g.addColorStop(0.4, CONFIG.skyMid);
  g.addColorStop(1, CONFIG.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSunGlow(t) {
  const sc = hexRgb(CONFIG.sunColor);
  const sx = W * 0.5, sy = H * 0.12;
  const pulse = 0.9 + 0.1 * Math.sin(t * 0.001);
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.3 * pulse);
  grad.addColorStop(0, `rgba(${sc[0]},${sc[1]},${sc[2]},0.1)`);
  grad.addColorStop(0.5, `rgba(${sc[0]},${sc[1]},${sc[2]},0.03)`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds(t) {
  const cc = hexRgb(CONFIG.cloudColor);
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + c.w) c.x = -c.w;
    const grad = ctx.createRadialGradient(c.x, c.y, c.w * 0.1, c.x, c.y, c.w);
    grad.addColorStop(0, `rgba(${cc[0]+40},${cc[1]+40},${cc[2]+40},${c.opacity})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawIsland(island, t) {
  const ix = island.x * W;
  const bob = Math.sin(t * island.bobSpeed) * island.bobAmp;
  const iy = island.y * H + bob;
  const iw = island.w * W;
  const ih = island.h * H;

  // Rock bottom
  ctx.beginPath();
  ctx.moveTo(ix - iw * 0.3, iy);
  ctx.quadraticCurveTo(ix - iw * 0.1, iy + ih * 3, ix, iy + ih * 4);
  ctx.quadraticCurveTo(ix + iw * 0.1, iy + ih * 3, ix + iw * 0.3, iy);
  ctx.fillStyle = 'rgba(40,30,25,0.7)';
  ctx.fill();

  // Surface
  ctx.beginPath();
  ctx.ellipse(ix, iy, iw * 0.5, ih, 0, 0, Math.PI * 2);
  const surfGrad = ctx.createLinearGradient(ix, iy - ih, ix, iy + ih);
  surfGrad.addColorStop(0, 'rgba(50,90,40,0.8)');
  surfGrad.addColorStop(1, 'rgba(35,65,30,0.8)');
  ctx.fillStyle = surfGrad;
  ctx.fill();

  // Trees
  for (let i = 0; i < island.trees; i++) {
    const tx = ix - iw * 0.35 + (i / (island.trees - 1 || 1)) * iw * 0.7;
    const ty = iy - ih * 0.5 - Math.random() * 3;
    const th = 15 + Math.random() * 20;
    ctx.fillStyle = 'rgba(50,35,20,0.6)';
    ctx.fillRect(tx - 1, ty, 2, th * 0.4);
    ctx.beginPath();
    ctx.moveTo(tx, ty - th * 0.5);
    ctx.lineTo(tx - 8, ty);
    ctx.lineTo(tx + 8, ty);
    ctx.closePath();
    ctx.fillStyle = `rgba(30,${70 + i * 5},25,0.7)`;
    ctx.fill();
  }

  // Waterfall
  if (island.waterfall) {
    const wc = hexRgb(CONFIG.waterfallColor);
    const wx = ix + iw * 0.1;
    for (let i = 0; i < 8; i++) {
      const wy = iy + ih + i * 12;
      const ww = 3 + Math.sin(t * 0.003 + i) * 1;
      ctx.fillStyle = `rgba(${wc[0]},${wc[1]},${wc[2]},${0.15 - i * 0.015})`;
      ctx.fillRect(wx - ww / 2 + Math.sin(t * 0.002 + i * 0.5) * 2, wy, ww, 10);
    }
    const mist = ctx.createRadialGradient(wx, iy + ih * 4, 0, wx, iy + ih * 4, 25);
    mist.addColorStop(0, `rgba(${wc[0]},${wc[1]},${wc[2]},0.08)`);
    mist.addColorStop(1, 'transparent');
    ctx.fillStyle = mist;
    ctx.beginPath(); ctx.arc(wx, iy + ih * 4, 25, 0, Math.PI * 2); ctx.fill();
  }

  // Shadow
  ctx.beginPath();
  ctx.ellipse(ix, iy + ih * 5, iw * 0.35, ih * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fill();
}

function drawParticles(t) {
  particles.forEach(p => {
    p.phase += 0.008;
    p.y -= p.speed;
    if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
    const dx = Math.sin(p.phase) * 10;
    ctx.beginPath();
    ctx.arc((p.x + dx) % W, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,210,240,${p.opacity * (0.5 + 0.5 * Math.sin(p.phase))})`;
    ctx.fill();
  });
}

function animate(t) {
  drawSky();
  drawSunGlow(t);
  drawClouds(t);
  islands.forEach(island => drawIsland(island, t));
  drawParticles(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

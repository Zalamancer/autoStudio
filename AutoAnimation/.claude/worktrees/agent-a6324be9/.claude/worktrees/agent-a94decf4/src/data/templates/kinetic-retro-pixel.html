<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Pixel - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #111122; font-family: 'Courier New', monospace; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
    background-image: repeating-linear-gradient(0deg, rgba(0,255,0,0.1) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,255,0,0.1) 0px, transparent 1px, transparent 3px); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; image-rendering: pixelated; }
  .pixel-block { position: absolute; pointer-events: none; z-index: 3; }

  @keyframes pixelIn { 0% { opacity: 0; filter: blur(0); transform: translate(-50%,-50%) scale(0.5); } 30% { opacity: 1; } 50% { filter: blur(0); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  @keyframes pixelOut { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } }
  @keyframes pixelScatter { 0% { opacity: 0.8; } 100% { opacity: 0; transform: translate(var(--px),var(--py)) scale(0.3); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['PLAYER 1','READY','LEVEL UP','GAME ON','HIGH SCORE','POWER UP','COMBO','VICTORY'],
  bgColor: '#111122',
  fontFamily: "'Courier New', monospace",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const pixelColors = ['#00ff00','#ff0066','#00ccff','#ffff00','#ff6600','#cc00ff','#00ff99','#ff3333'];

function spawnPixels(x, y, color) {
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div'); p.className = 'pixel-block';
    const sz = 4 + Math.random() * 6;
    p.style.cssText = `left:${x+(Math.random()-0.5)*50}px;top:${y+(Math.random()-0.5)*20}px;width:${sz}px;height:${sz}px;background:${color};--px:${(Math.random()-0.5)*80}px;--py:${(Math.random()-0.5)*80}px;animation:pixelScatter ${300+Math.random()*300}ms ease-out forwards;`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 71 + 29);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(30 + rng() * 22, cellW * 0.38, cellH * 0.5);
    const color = pixelColors[i % pixelColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-weight:700;color:${color};text-shadow:0 0 8px ${color},2px 2px 0 rgba(0,0,0,0.5);letter-spacing:3px;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2, color });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=280, inD=400, hold=3000, outS=180, outD=350, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`pixelIn ${inD}ms steps(6) forwards`;spawnPixels(item.x,item.y,item.color);}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`pixelOut ${outD}ms steps(4) forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

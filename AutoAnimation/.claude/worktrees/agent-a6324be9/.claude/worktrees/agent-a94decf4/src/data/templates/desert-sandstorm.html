<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Sandstorm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #1a0f05; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const CONFIG = {
  bgColor: '#2d1810',
  sandColor: '#d4a559',
  sunColor: '#ff8c42',
  stormIntensity: 0.7,
  windSpeed: 1.0,
  cycleDuration: 14000
};

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H, time = 0, cycleTime = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

const bgRgb = hexToRgb(CONFIG.bgColor);
const sandRgb = hexToRgb(CONFIG.sandColor);
const sunRgb = hexToRgb(CONFIG.sunColor);

// Sand particles
class SandParticle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = init ? Math.random() * W * 1.5 : -Math.random() * W * 0.3;
    this.y = H * 0.3 + Math.random() * H * 0.7;
    this.size = Math.random() * 2.5 + 0.5;
    this.speedX = (2 + Math.random() * 5) * CONFIG.windSpeed;
    this.speedY = (Math.random() - 0.5) * 0.8;
    this.opacity = Math.random() * 0.6 + 0.2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.01;
    this.wobbleAmp = Math.random() * 20 + 5;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(dt) {
    this.x += this.speedX * dt;
    this.y += this.speedY * dt + Math.sin(time * this.wobbleSpeed + this.phase) * 0.3;
    if (this.x > W + 50) this.reset(false);
  }
  draw() {
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = `rgb(${sandRgb.r}, ${sandRgb.g}, ${sandRgb.b})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Dust devil
class DustDevil {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.baseY = H * 0.65 + Math.random() * H * 0.2;
    this.width = 15 + Math.random() * 25;
    this.height = 80 + Math.random() * 120;
    this.life = 0;
    this.maxLife = 3000 + Math.random() * 4000;
    this.speedX = (Math.random() - 0.3) * 1.5 * CONFIG.windSpeed;
    this.particles = [];
    for (let i = 0; i < 40; i++) {
      this.particles.push({
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * this.width,
        yOff: Math.random() * this.height,
        speed: 0.02 + Math.random() * 0.04,
        size: 1 + Math.random() * 2
      });
    }
  }
  update(dt) {
    this.life += dt * 16;
    this.x += this.speedX * dt;
    if (this.life > this.maxLife || this.x < -50 || this.x > W + 50) this.reset();
    this.particles.forEach(p => { p.angle += p.speed; });
  }
  draw() {
    const progress = this.life / this.maxLife;
    const fade = progress < 0.15 ? progress / 0.15 : progress > 0.8 ? (1 - progress) / 0.2 : 1;
    ctx.globalAlpha = fade * 0.35 * CONFIG.stormIntensity;
    this.particles.forEach(p => {
      const px = this.x + Math.cos(p.angle) * p.radius * (1 - p.yOff / this.height * 0.7);
      const py = this.baseY - p.yOff;
      ctx.fillStyle = `rgb(${sandRgb.r - 20}, ${sandRgb.g - 15}, ${sandRgb.b - 10})`;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }
}

// Dune layer for parallax
class DuneLayer {
  constructor(yBase, height, color, speed, segments) {
    this.yBase = yBase;
    this.height = height;
    this.color = color;
    this.speed = speed;
    this.offset = 0;
    this.points = [];
    for (let i = 0; i <= segments + 2; i++) {
      this.points.push({
        x: (i - 1) / segments,
        h: Math.random() * 0.6 + 0.4,
        curve: Math.random() * 0.3 + 0.1
      });
    }
  }
  update(dt) {
    this.offset += this.speed * CONFIG.windSpeed * dt * 0.001;
    if (this.offset > 1 / (this.points.length - 2)) this.offset -= 1 / (this.points.length - 2);
  }
  draw() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const t = (x / W + this.offset) % 1;
      const seg = this.points.length - 1;
      const idx = t * seg;
      const i = Math.floor(idx);
      const f = idx - i;
      const p0 = this.points[Math.max(0, i)];
      const p1 = this.points[Math.min(this.points.length - 1, i + 1)];
      const h = p0.h + (p1.h - p0.h) * (f * f * (3 - 2 * f));
      const y = H * this.yBase - h * this.height;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
}

// Sandstorm wall
class StormWall {
  constructor() {
    this.noiseSeeds = [];
    for (let i = 0; i < 20; i++) this.noiseSeeds.push(Math.random() * 100);
  }
  draw(progress) {
    const stormX = W * 1.3 - progress * W * 0.9;
    const intensity = CONFIG.stormIntensity;
    for (let layer = 0; layer < 5; layer++) {
      const layerX = stormX + layer * W * 0.08;
      const grad = ctx.createLinearGradient(layerX - W * 0.3, 0, layerX + W * 0.1, 0);
      const alpha = (0.15 + layer * 0.08) * intensity;
      grad.addColorStop(0, `rgba(${sandRgb.r - 30}, ${sandRgb.g - 20}, ${sandRgb.b - 15}, 0)`);
      grad.addColorStop(0.4, `rgba(${sandRgb.r - 20}, ${sandRgb.g - 10}, ${sandRgb.b}, ${alpha * 0.5})`);
      grad.addColorStop(0.7, `rgba(${sandRgb.r}, ${sandRgb.g}, ${sandRgb.b}, ${alpha})`);
      grad.addColorStop(1, `rgba(${sandRgb.r + 10}, ${sandRgb.g + 5}, ${sandRgb.b}, ${alpha * 0.8})`);
      ctx.globalAlpha = 1;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(layerX + W * 0.1, 0);
      for (let y = 0; y <= H; y += 5) {
        const wave = Math.sin(y * 0.01 + time * 0.002 + layer) * 30 * intensity;
        const wave2 = Math.sin(y * 0.025 + time * 0.004 + this.noiseSeeds[layer]) * 15;
        ctx.lineTo(layerX + wave + wave2, y);
      }
      ctx.lineTo(layerX - W * 0.4, H);
      ctx.lineTo(layerX - W * 0.4, 0);
      ctx.closePath();
      ctx.fill();
    }
  }
}

// Heat shimmer
function drawHeatShimmer() {
  const shimmerH = H * 0.12;
  const baseY = H * 0.68;
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 8; i++) {
    const y = baseY + i * shimmerH * 0.12;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const wave = Math.sin(x * 0.008 + time * 0.003 + i * 0.5) * 4;
      const wave2 = Math.sin(x * 0.015 + time * 0.005 + i) * 2;
      if (x === 0) ctx.moveTo(x, y + wave + wave2);
      else ctx.lineTo(x, y + wave + wave2);
    }
    ctx.strokeStyle = `rgba(255, 220, 160, 0.3)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// Sun
function drawSun(hazeOpacity) {
  const sunX = W * 0.7;
  const sunY = H * 0.22;
  const sunR = Math.min(W, H) * 0.08;

  // Outer glow
  for (let i = 4; i >= 0; i--) {
    const r = sunR * (1 + i * 0.8);
    const grad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, r);
    grad.addColorStop(0, `rgba(${sunRgb.r}, ${sunRgb.g}, ${sunRgb.b}, ${0.08 - i * 0.012})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 1 - hazeOpacity * 0.6;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sun disc
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
  sunGrad.addColorStop(0, `rgba(255, 255, 220, ${0.95 - hazeOpacity * 0.4})`);
  sunGrad.addColorStop(0.5, `rgba(${sunRgb.r}, ${sunRgb.g}, ${sunRgb.b}, ${0.8 - hazeOpacity * 0.3})`);
  sunGrad.addColorStop(1, `rgba(${sunRgb.r}, ${sunRgb.g - 30}, ${sunRgb.b - 30}, ${0.3 - hazeOpacity * 0.1})`);
  ctx.globalAlpha = 1;
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();
}

// Sky gradient
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${bgRgb.r + 40}, ${bgRgb.g + 20}, ${bgRgb.b + 15})`);
  grad.addColorStop(0.3, `rgb(${bgRgb.r + 80}, ${bgRgb.g + 50}, ${bgRgb.b + 20})`);
  grad.addColorStop(0.55, `rgb(${sandRgb.r - 40}, ${sandRgb.g - 30}, ${sandRgb.b - 20})`);
  grad.addColorStop(1, `rgb(${bgRgb.r + 20}, ${bgRgb.g + 10}, ${bgRgb.b})`);
  ctx.globalAlpha = 1;
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// Init objects
const sandParticles = [];
for (let i = 0; i < 300; i++) sandParticles.push(new SandParticle());
const dustDevils = [new DustDevil(), new DustDevil()];
const stormWall = new StormWall();

const dunes = [
  new DuneLayer(0.58, H * 0.12, `rgb(${sandRgb.r - 60}, ${sandRgb.g - 50}, ${sandRgb.b - 30})`, 0.15, 12),
  new DuneLayer(0.64, H * 0.1, `rgb(${sandRgb.r - 40}, ${sandRgb.g - 30}, ${sandRgb.b - 20})`, 0.25, 10),
  new DuneLayer(0.72, H * 0.14, `rgb(${sandRgb.r - 20}, ${sandRgb.g - 15}, ${sandRgb.b - 10})`, 0.4, 8),
  new DuneLayer(0.82, H * 0.18, `rgb(${sandRgb.r}, ${sandRgb.g}, ${sandRgb.b})`, 0.6, 7),
  new DuneLayer(0.92, H * 0.15, `rgb(${sandRgb.r + 15}, ${sandRgb.g + 10}, ${sandRgb.b + 5})`, 0.9, 6),
];

let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;
  time += dt * 16;
  cycleTime = (time % CONFIG.cycleDuration) / CONFIG.cycleDuration;

  // Storm approach: comes in for first half, stays for second
  const stormProgress = cycleTime < 0.1 ? cycleTime / 0.1 * 0.3 :
                        cycleTime < 0.5 ? 0.3 + (cycleTime - 0.1) / 0.4 * 0.7 :
                        cycleTime < 0.85 ? 1.0 :
                        1.0 - (cycleTime - 0.85) / 0.15;
  const hazeOpacity = stormProgress * CONFIG.stormIntensity;

  // Draw sky
  drawSky();

  // Draw sun through haze
  drawSun(hazeOpacity);

  // Storm wall
  stormWall.draw(stormProgress);

  // Atmospheric haze overlay
  ctx.globalAlpha = hazeOpacity * 0.25;
  ctx.fillStyle = `rgb(${sandRgb.r}, ${sandRgb.g}, ${sandRgb.b})`;
  ctx.fillRect(0, 0, W, H);

  // Draw dunes with parallax
  dunes.forEach(d => { d.update(dt); d.draw(); });

  // Heat shimmer
  drawHeatShimmer();

  // Sand particles
  const particleCount = Math.floor(300 * (0.3 + stormProgress * 0.7));
  for (let i = 0; i < particleCount; i++) {
    sandParticles[i].update(dt);
    sandParticles[i].draw();
  }

  // Dust devils
  dustDevils.forEach(d => { d.update(dt); d.draw(); });

  // Foreground sand haze at bottom
  const fgGrad = ctx.createLinearGradient(0, H * 0.85, 0, H);
  fgGrad.addColorStop(0, 'rgba(0,0,0,0)');
  fgGrad.addColorStop(1, `rgba(${sandRgb.r - 10}, ${sandRgb.g - 10}, ${sandRgb.b - 5}, ${0.3 + hazeOpacity * 0.3})`);
  ctx.globalAlpha = 1;
  ctx.fillStyle = fgGrad;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  // Vignette
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
  }
});
</script>
</body>
</html>

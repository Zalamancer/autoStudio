<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Data Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
  }
  canvas#matrixCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .center-overlay {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center;
  }
  .center-overlay h1 {
    font-size: 52px; font-weight: 400; letter-spacing: 12px;
    text-transform: uppercase; color: #00FF41;
    text-shadow: 0 0 20px #00FF41, 0 0 60px rgba(0,255,65,0.3);
    animation: matrixGlow 3s ease-in-out infinite;
  }
  .center-overlay .sub {
    font-size: 12px; letter-spacing: 6px; color: #00FF41; opacity: 0.4;
    margin-top: 10px; text-transform: uppercase;
  }
  @keyframes matrixGlow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px, rgba(0,255,65,0.015) 2px, rgba(0,255,65,0.015) 4px
    );
  }
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>
<div class="scanline"></div>
<div class="center-overlay">
  <h1 id="mainTitle">SYSTEM</h1>
  <div class="sub" id="subTitle">ACCESS GRANTED</div>
</div>

<script>
// ===== EDITABLE VARIABLES =====
const TITLE_TEXT = 'SYSTEM';
const SUBTITLE_TEXT = 'ACCESS GRANTED';
const MATRIX_COLOR = '#00FF41';
const BG_COLOR = '#000000';
const COLUMN_DENSITY = 0.7;
const FALL_SPEED = 1.2;
// ==============================

document.getElementById('mainTitle').textContent = TITLE_TEXT;
document.getElementById('subTitle').textContent = SUBTITLE_TEXT;

const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let W, H, columns, drops;
const fontSize = 14;

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789@#$%^&*';

function setup() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  columns = Math.floor(W / fontSize);
  drops = [];
  for (let i = 0; i < columns; i++) {
    if (Math.random() < COLUMN_DENSITY) {
      drops.push({
        x: i, y: Math.random() * -100,
        speed: (Math.random() * 0.5 + 0.5) * FALL_SPEED,
        chars: [], maxLen: Math.floor(Math.random() * 20 + 5),
      });
    }
  }
}
setup();
window.addEventListener('resize', setup);

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}
const mc = hexToRgb(MATRIX_COLOR);

function animate() {
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = fontSize + 'px monospace';

  drops.forEach(drop => {
    const char = chars[Math.floor(Math.random() * chars.length)];
    const x = drop.x * fontSize;
    const y = drop.y * fontSize;

    ctx.fillStyle = `rgba(${Math.min(mc.r+100,255)},${Math.min(mc.g+100,255)},${Math.min(mc.b+100,255)},0.95)`;
    ctx.fillText(char, x, y);

    for (let i = 1; i < Math.min(drop.chars.length, drop.maxLen); i++) {
      const a = (1 - i / drop.maxLen) * 0.6;
      ctx.fillStyle = `rgba(${mc.r},${mc.g},${mc.b},${a})`;
      ctx.fillText(drop.chars[i] || char, x, y - i * fontSize);
    }

    drop.chars.unshift(char);
    if (drop.chars.length > drop.maxLen) drop.chars.pop();
    drop.y += drop.speed;

    if (drop.y * fontSize > H + 200) {
      drop.y = Math.random() * -20;
      drop.chars = [];
      drop.speed = (Math.random() * 0.5 + 0.5) * FALL_SPEED;
    }
  });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Music Player</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  :root{
    --accent:#8b5cf6;
    --bg:#0f0f1a;
    --surface:rgba(255,255,255,0.06);
    --surface2:rgba(255,255,255,0.1);
    --text:#f0f0f5;
    --text-dim:rgba(240,240,245,0.5);
    --glow:rgba(139,92,246,0.35);
  }

  .player-container{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:72vw;height:82vh;
    background:linear-gradient(165deg,rgba(30,30,50,0.95),rgba(15,15,30,0.98));
    border-radius:3vh;
    border:0.15vh solid rgba(255,255,255,0.08);
    box-shadow:0 4vh 12vh rgba(0,0,0,0.6),0 0 8vh var(--glow);
    display:flex;flex-direction:column;
    padding:3.5vh 4vw;
    opacity:0;
    backdrop-filter:blur(2vh);
  }

  /* ---------- Top bar ---------- */
  .top-bar{
    display:flex;justify-content:space-between;align-items:center;
    height:4vh;margin-bottom:2.5vh;
  }
  .top-bar .label{font-size:1.5vh;letter-spacing:0.3vw;text-transform:uppercase;color:var(--text-dim)}
  .top-bar .dots{display:flex;gap:0.8vw}
  .top-bar .dots span{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--surface2)}

  /* ---------- Album art ---------- */
  .album-section{
    display:flex;gap:3.5vw;align-items:center;flex:1;min-height:0;
  }
  .vinyl-wrap{
    position:relative;width:28vh;height:28vh;flex-shrink:0;
  }
  .vinyl-disc{
    width:100%;height:100%;border-radius:50%;
    background:conic-gradient(from 0deg,#1a1a2e,#2a2a3e,#1a1a2e,#2a2a3e,#1a1a2e);
    box-shadow:0 0 4vh rgba(0,0,0,0.5),inset 0 0 3vh rgba(255,255,255,0.03);
    display:flex;align-items:center;justify-content:center;
    animation:vinylSpin 3s linear infinite;
    animation-play-state:running;
  }
  .vinyl-disc::before{
    content:'';width:40%;height:40%;border-radius:50%;
    background:radial-gradient(circle,var(--accent) 0%,rgba(139,92,246,0.3) 40%,transparent 70%);
    box-shadow:0 0 2vh var(--glow);
  }
  .vinyl-disc::after{
    content:'';position:absolute;top:50%;left:50%;
    width:8%;height:8%;border-radius:50%;
    background:#0f0f1a;border:0.3vh solid rgba(255,255,255,0.15);
    transform:translate(-50%,-50%);
  }
  .vinyl-grooves{
    position:absolute;inset:0;border-radius:50%;
    background:repeating-radial-gradient(circle at center,transparent 0%,transparent 2%,rgba(255,255,255,0.02) 2.2%,transparent 2.4%);
    pointer-events:none;
  }
  .album-art-overlay{
    position:absolute;top:50%;left:50%;width:42%;height:42%;
    transform:translate(-50%,-50%);border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#ec4899);
    opacity:0.85;
    animation:vinylSpin 3s linear infinite;
  }

  @keyframes vinylSpin{
    to{transform:rotate(360deg)}
  }

  /* ---------- Track info ---------- */
  .track-info{
    flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.5vh;
    min-width:0;
  }
  .song-title{
    font-size:3.2vh;font-weight:700;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.2;
  }
  .artist-name{
    font-size:2vh;font-weight:500;color:var(--accent);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .album-name{
    font-size:1.6vh;color:var(--text-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* Like button */
  .like-btn{
    width:4.5vh;height:4.5vh;border-radius:50%;
    background:var(--surface);border:0.2vh solid rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all 0.3s;margin-top:0.5vh;
    flex-shrink:0;
  }
  .like-btn.liked{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.4)}
  .heart{
    width:2.2vh;height:2vh;position:relative;
  }
  .heart::before,.heart::after{
    content:'';position:absolute;top:0;width:1.1vh;height:1.8vh;
    border-radius:1.1vh 1.1vh 0 0;
  }
  .heart::before{left:0.55vh;transform:rotate(-45deg);transform-origin:bottom left;background:#ef4444}
  .heart::after{left:0;transform:rotate(45deg);transform-origin:bottom right;background:#ef4444}
  .like-btn:not(.liked) .heart::before,
  .like-btn:not(.liked) .heart::after{background:var(--text-dim)}

  /* ---------- Equalizer ---------- */
  .equalizer{
    display:flex;align-items:flex-end;gap:0.5vw;
    height:8vh;margin:2vh 0 1.5vh;
  }
  .eq-bar{
    flex:1;max-width:1.2vw;border-radius:0.5vh 0.5vh 0 0;
    background:linear-gradient(to top,var(--accent),#ec4899);
    transition:height 0.15s ease;
    min-height:0.5vh;
  }

  /* ---------- Progress bar ---------- */
  .progress-section{margin:1vh 0 2vh}
  .progress-track{
    width:100%;height:0.6vh;border-radius:0.3vh;
    background:var(--surface2);overflow:hidden;cursor:pointer;
  }
  .progress-fill{
    height:100%;border-radius:0.3vh;
    background:linear-gradient(90deg,var(--accent),#ec4899);
    width:0%;transition:width 0.3s linear;
    position:relative;
  }
  .progress-fill::after{
    content:'';position:absolute;right:-0.7vh;top:50%;
    width:1.4vh;height:1.4vh;border-radius:50%;
    background:#fff;transform:translateY(-50%);
    box-shadow:0 0 1vh var(--glow);
  }
  .time-row{
    display:flex;justify-content:space-between;
    margin-top:0.8vh;font-size:1.3vh;color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;align-items:center;justify-content:center;gap:3.5vw;
    margin:1vh 0;
  }
  .ctrl-btn{
    width:5vh;height:5vh;border-radius:50%;
    background:transparent;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .ctrl-btn.play-btn{
    width:7vh;height:7vh;
    background:linear-gradient(135deg,var(--accent),#ec4899);
    box-shadow:0 0.5vh 3vh var(--glow);
  }

  /* CSS-only skip/rewind triangles */
  .skip-icon,.rewind-icon{
    width:0;height:0;
    border-top:1.2vh solid transparent;
    border-bottom:1.2vh solid transparent;
  }
  .skip-icon{border-left:1.8vh solid var(--text)}
  .rewind-icon{border-right:1.8vh solid var(--text)}
  .skip-icon::after,.rewind-icon::after{
    content:'';position:absolute;
    width:0;height:0;
    border-top:1.2vh solid transparent;
    border-bottom:1.2vh solid transparent;
  }
  .skip-icon::after{border-left:1.8vh solid var(--text);left:calc(50% + 0.4vw)}
  .rewind-icon::after{border-right:1.8vh solid var(--text);right:calc(50% + 0.4vw)}

  /* Play triangle */
  .play-icon{
    width:0;height:0;
    border-top:1.6vh solid transparent;
    border-bottom:1.6vh solid transparent;
    border-left:2.4vh solid #fff;
    margin-left:0.4vw;
  }

  /* Shuffle / repeat icons (simple CSS) */
  .shuffle-icon,.repeat-icon{
    width:2.5vh;height:2.5vh;position:relative;
  }
  .shuffle-icon::before,.shuffle-icon::after{
    content:'';position:absolute;left:0;
    width:100%;height:0.25vh;background:var(--text-dim);
    border-radius:0.2vh;
  }
  .shuffle-icon::before{top:30%;transform:rotate(15deg)}
  .shuffle-icon::after{bottom:30%;transform:rotate(-15deg)}
  .repeat-icon{
    border:0.25vh solid var(--text-dim);border-radius:0.5vh;
    border-bottom-color:transparent;
  }
  .repeat-icon::after{
    content:'';position:absolute;bottom:-0.5vh;right:0.2vh;
    width:0;height:0;
    border-left:0.6vh solid transparent;
    border-right:0.6vh solid transparent;
    border-top:0.8vh solid var(--text-dim);
  }

  /* ---------- Volume ---------- */
  .volume-row{
    display:flex;align-items:center;gap:1.5vw;
    margin-top:1.5vh;
  }
  .vol-icon{
    width:2vh;height:1.6vh;position:relative;
  }
  .vol-icon::before{
    content:'';position:absolute;left:0;top:50%;
    width:0.8vh;height:1vh;background:var(--text-dim);
    transform:translateY(-50%);border-radius:0.1vh;
  }
  .vol-icon::after{
    content:'';position:absolute;left:0.8vh;top:50%;
    width:0;height:0;
    border-top:0.8vh solid transparent;
    border-bottom:0.8vh solid transparent;
    border-left:1vh solid var(--text-dim);
    transform:translateY(-50%);
  }
  .vol-track{
    flex:1;height:0.5vh;border-radius:0.25vh;
    background:var(--surface2);max-width:18vw;
    overflow:hidden;
  }
  .vol-fill{
    height:100%;width:70%;border-radius:0.25vh;
    background:var(--accent);
  }
  .vol-pct{font-size:1.2vh;color:var(--text-dim);min-width:3vw;text-align:right}

  /* ---------- Lyrics ---------- */
  .lyrics-section{
    margin-top:2vh;flex-shrink:0;
    height:10vh;overflow:hidden;position:relative;
  }
  .lyrics-section::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2.5vh;
    background:linear-gradient(to bottom,rgba(15,15,30,0.95),transparent);
    z-index:2;pointer-events:none;
  }
  .lyrics-section::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:2.5vh;
    background:linear-gradient(to top,rgba(15,15,30,0.95),transparent);
    z-index:2;pointer-events:none;
  }
  .lyrics-track{
    display:flex;flex-direction:column;gap:1.2vh;
    animation:lyricsScroll 8s linear infinite;
  }
  .lyric-line{
    font-size:1.5vh;color:var(--text-dim);
    text-align:center;white-space:nowrap;
    transition:all 0.4s;line-height:1.6;
  }
  .lyric-line.active{color:var(--text);font-size:1.7vh;font-weight:600}
  .lyric-line.accent-line{color:var(--accent);font-weight:500}

  @keyframes lyricsScroll{
    0%{transform:translateY(0)}
    100%{transform:translateY(-50%)}
  }

  /* ---------- Ambient glow ---------- */
  .ambient-glow{
    position:absolute;top:-10vh;left:-10vw;
    width:40vw;height:40vh;border-radius:50%;
    background:radial-gradient(circle,var(--glow),transparent 70%);
    opacity:0.4;filter:blur(8vh);pointer-events:none;
    animation:glowPulse 4s ease-in-out infinite alternate;
  }
  .ambient-glow.secondary{
    top:auto;bottom:-12vh;left:auto;right:-8vw;
    background:radial-gradient(circle,rgba(236,72,153,0.25),transparent 70%);
    animation-delay:-2s;
  }

  @keyframes glowPulse{
    0%{opacity:0.25;transform:scale(0.9)}
    100%{opacity:0.5;transform:scale(1.1)}
  }

  /* ---------- Entrance / Exit ---------- */
  @keyframes fadeSlideIn{
    0%{opacity:0;transform:translate(-50%,-50%) translateY(5vh) scale(0.92)}
    100%{opacity:1;transform:translate(-50%,-50%) translateY(0) scale(1)}
  }
  @keyframes fadeSlideOut{
    0%{opacity:1;transform:translate(-50%,-50%) translateY(0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) translateY(-4vh) scale(0.95)}
  }
  @keyframes elemFadeUp{
    0%{opacity:0;transform:translateY(2vh)}
    100%{opacity:1;transform:translateY(0)}
  }

  .player-container.enter{animation:fadeSlideIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards}
  .player-container.exit{animation:fadeSlideOut 0.7s cubic-bezier(0.55,0,1,0.45) forwards}

  .stagger{opacity:0}
  .stagger.reveal{animation:elemFadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards}

  /* ---------- Particles ---------- */
  .particle{
    position:absolute;width:0.4vh;height:0.4vh;
    border-radius:50%;background:var(--accent);opacity:0;
    pointer-events:none;
  }
  @keyframes particleFloat{
    0%{opacity:0;transform:translateY(0) scale(0)}
    20%{opacity:0.7;transform:translateY(-2vh) scale(1)}
    100%{opacity:0;transform:translateY(-10vh) scale(0.3)}
  }
</style>
</head>
<body>

<div class="ambient-glow"></div>
<div class="ambient-glow secondary"></div>

<div class="player-container" id="player">
  <!-- Top bar -->
  <div class="top-bar stagger" data-delay="0">
    <span class="label">Now Playing</span>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Album + Track Info -->
  <div class="album-section">
    <div class="vinyl-wrap stagger" data-delay="100">
      <div class="vinyl-disc"></div>
      <div class="vinyl-grooves"></div>
      <div class="album-art-overlay"></div>
    </div>
    <div class="track-info">
      <div class="song-title stagger" data-delay="200" id="songTitle">Midnight Echoes</div>
      <div class="artist-name stagger" data-delay="280" id="artistName">Neon Waves</div>
      <div class="album-name stagger" data-delay="340" id="albumName">Dreamscapes Vol. II</div>
      <div class="like-btn stagger" data-delay="400" id="likeBtn">
        <div class="heart"></div>
      </div>
    </div>
  </div>

  <!-- Equalizer -->
  <div class="equalizer stagger" data-delay="450" id="equalizer"></div>

  <!-- Progress -->
  <div class="progress-section stagger" data-delay="520">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="timeElapsed">0:00</span>
      <span id="timeDuration">3:42</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls stagger" data-delay="600">
    <div class="ctrl-btn"><div class="shuffle-icon"></div></div>
    <div class="ctrl-btn"><div class="rewind-icon"></div></div>
    <div class="ctrl-btn play-btn"><div class="play-icon"></div></div>
    <div class="ctrl-btn"><div class="skip-icon"></div></div>
    <div class="ctrl-btn"><div class="repeat-icon"></div></div>
  </div>

  <!-- Volume -->
  <div class="volume-row stagger" data-delay="680">
    <div class="vol-icon"></div>
    <div class="vol-track"><div class="vol-fill" id="volFill"></div></div>
    <span class="vol-pct" id="volPct">70%</span>
  </div>

  <!-- Lyrics -->
  <div class="lyrics-section stagger" data-delay="760">
    <div class="lyrics-track" id="lyricsTrack"></div>
  </div>
</div>

<!-- Particles container -->
<div id="particles"></div>

<script>
/* ============================================
   CONFIG — all editable properties
   ============================================ */
const CONFIG = {
  songTitle:    "Midnight Echoes",
  artistName:   "Neon Waves",
  albumName:    "Dreamscapes Vol. II",
  duration:     "3:42",
  accentColor:  "#8b5cf6",
  bgColor:      "#0f0f1a",
  cycleDuration: 12
};

/* ---------- Apply CONFIG ---------- */
function applyConfig(c) {
  if (!c) return;
  const root = document.documentElement.style;
  if (c.accentColor) {
    root.setProperty('--accent', c.accentColor);
    const r = parseInt(c.accentColor.slice(1,3),16);
    const g = parseInt(c.accentColor.slice(3,5),16);
    const b = parseInt(c.accentColor.slice(5,7),16);
    root.setProperty('--glow', `rgba(${r},${g},${b},0.35)`);
  }
  if (c.bgColor) {
    root.setProperty('--bg', c.bgColor);
  }
  if (c.songTitle)   document.getElementById('songTitle').textContent = c.songTitle;
  if (c.artistName)  document.getElementById('artistName').textContent = c.artistName;
  if (c.albumName)   document.getElementById('albumName').textContent = c.albumName;
  if (c.duration)    document.getElementById('timeDuration').textContent = c.duration;
}
applyConfig(CONFIG);

/* ---------- PostMessage bridge ---------- */
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    applyConfig(CONFIG);
  }
});

/* ---------- Equalizer bars ---------- */
const eqContainer = document.getElementById('equalizer');
const BAR_COUNT = 32;
const bars = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const bar = document.createElement('div');
  bar.className = 'eq-bar';
  bar.style.height = '0.5vh';
  eqContainer.appendChild(bar);
  bars.push(bar);
}

function animateEqualizer() {
  const time = performance.now() / 1000;
  bars.forEach((bar, i) => {
    const freq = 0.8 + (i / BAR_COUNT) * 2.5;
    const phase = i * 0.35;
    const wave1 = Math.sin(time * freq * 2.5 + phase) * 0.5 + 0.5;
    const wave2 = Math.sin(time * freq * 1.7 + phase * 1.3) * 0.3 + 0.3;
    const wave3 = Math.sin(time * 0.8 + i * 0.15) * 0.2 + 0.2;
    const combined = Math.min(1, wave1 + wave2 + wave3);
    const height = 0.5 + combined * 7;
    bar.style.height = height + 'vh';
  });
  requestAnimationFrame(animateEqualizer);
}
animateEqualizer();

/* ---------- Lyrics data ---------- */
const lyricsLines = [
  { text: "The city sleeps beneath the neon glow", active: false, accent: false },
  { text: "Whispers carried on the midnight breeze", active: false, accent: true },
  { text: "Echoes of a love I used to know", active: true, accent: false },
  { text: "Dancing shadows through the autumn trees", active: false, accent: false },
  { text: "Hold me closer in the fading light", active: false, accent: true },
  { text: "Every heartbeat syncs to your refrain", active: false, accent: false },
  { text: "Stars collide across the velvet night", active: true, accent: false },
  { text: "We are infinite through joy and pain", active: false, accent: false },
  { text: "Lost inside the rhythm of the sound", active: false, accent: true },
  { text: "Frequencies that only we can hear", active: false, accent: false },
  { text: "Spinning round and round and round", active: true, accent: false },
  { text: "Drawing you forever near", active: false, accent: false },
];

function buildLyrics() {
  const track = document.getElementById('lyricsTrack');
  track.innerHTML = '';
  /* Duplicate for seamless scroll */
  const allLines = [...lyricsLines, ...lyricsLines];
  allLines.forEach((l) => {
    const div = document.createElement('div');
    div.className = 'lyric-line' + (l.active ? ' active' : '') + (l.accent ? ' accent-line' : '');
    div.textContent = l.text;
    track.appendChild(div);
  });
}
buildLyrics();

/* ---------- Like button toggle ---------- */
let liked = false;
const likeBtn = document.getElementById('likeBtn');
setInterval(() => {
  liked = !liked;
  likeBtn.classList.toggle('liked', liked);
}, 4000);

/* ---------- Progress bar simulation ---------- */
const progressFill = document.getElementById('progressFill');
const timeElapsed = document.getElementById('timeElapsed');
let progressPct = 0;

function parseDuration(str) {
  const parts = str.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function updateProgress() {
  const dur = parseDuration(CONFIG.duration || '3:42');
  const holdDur = CONFIG.cycleDuration * 0.6;
  const elapsed = (progressPct / 100) * dur;
  timeElapsed.textContent = formatTime(elapsed);
  progressFill.style.width = progressPct + '%';
  progressPct += (100 / (holdDur * 60));
  if (progressPct > 100) progressPct = 0;
  requestAnimationFrame(updateProgress);
}

/* ---------- Volume animation ---------- */
const volFill = document.getElementById('volFill');
const volPct = document.getElementById('volPct');
let volDir = 1;
let volVal = 70;

setInterval(() => {
  volVal += volDir * 2;
  if (volVal >= 85) volDir = -1;
  if (volVal <= 55) volDir = 1;
  volFill.style.width = volVal + '%';
  volPct.textContent = Math.round(volVal) + '%';
}, 300);

/* ---------- Floating particles ---------- */
const particlesContainer = document.getElementById('particles');

function spawnParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  const x = 20 + Math.random() * 60;
  const y = 40 + Math.random() * 40;
  p.style.left = x + 'vw';
  p.style.top = y + 'vh';
  p.style.width = (0.3 + Math.random() * 0.5) + 'vh';
  p.style.height = p.style.width;
  p.style.animation = `particleFloat ${2 + Math.random() * 3}s ease-out forwards`;
  particlesContainer.appendChild(p);
  setTimeout(() => p.remove(), 5000);
}

setInterval(spawnParticle, 400);

/* ---------- Cycle Controller ---------- */
const player = document.getElementById('player');
const staggerEls = document.querySelectorAll('.stagger');

function runCycle() {
  const cycle = (CONFIG.cycleDuration || 12) * 1000;
  const enterDur = cycle * 0.12;
  const holdDur = cycle * 0.72;
  const exitDur = cycle * 0.1;
  const gap = cycle * 0.06;

  /* --- ENTER PHASE --- */
  player.className = 'player-container enter';
  progressPct = 0;

  /* Staggered reveals */
  staggerEls.forEach((el) => {
    const delay = parseInt(el.dataset.delay || '0');
    setTimeout(() => {
      el.classList.add('reveal');
    }, delay + 200);
  });

  /* Start progress after enter completes */
  setTimeout(updateProgress, enterDur);

  /* --- EXIT PHASE --- */
  setTimeout(() => {
    player.classList.remove('enter');
    player.classList.add('exit');
  }, enterDur + holdDur);

  /* --- RESET + LOOP --- */
  setTimeout(() => {
    player.className = 'player-container';
    player.style.opacity = '0';
    staggerEls.forEach((el) => {
      el.classList.remove('reveal');
      el.style.animation = '';
    });
    progressPct = 0;
    progressFill.style.width = '0%';
    timeElapsed.textContent = '0:00';

    setTimeout(runCycle, gap);
  }, enterDur + holdDur + exitDur);
}

/* --- Boot --- */
runCycle();
</script>
</body>
</html>

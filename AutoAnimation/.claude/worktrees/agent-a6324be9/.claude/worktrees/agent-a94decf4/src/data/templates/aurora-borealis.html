<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #030308;
  }
  canvas#auroraCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .center-text {
    position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%);
    z-index: 3; text-align: center; color: #C8FFF0;
    pointer-events: none;
  }
  .center-text h1 {
    font-size: 46px; font-weight: 200; letter-spacing: 16px;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(100,255,200,0.3), 0 0 80px rgba(100,255,200,0.08);
    animation: aurText 7s ease-in-out infinite;
  }
  .center-text .subtitle {
    font-size: 12px; letter-spacing: 8px; opacity: 0.4;
    margin-top: 14px; text-transform: uppercase;
    animation: aurText 7s ease-in-out infinite 0.4s;
  }
  @keyframes aurText {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0,0,0,0.45) 100%);
  }
</style>
</head>
<body>
<canvas id="auroraCanvas"></canvas>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="mainTitle">Aurora</h1>
  <div class="subtitle" id="subTitle">Northern Lights</div>
</div>

<script>
const CONFIG = {
  titleText: 'Aurora',
  subtitleText: 'Northern Lights',
  skyColorTop: '#030308',
  skyColorMid: '#060618',
  skyColorBottom: '#0a0a2e',
  auroraColors: ['#00FF88', '#00DDAA', '#4488FF', '#8844FF', '#00FFCC', '#44FFAA'],
  starCount: 180,
  waveCount: 7,
  shootingStarFrequency: 0.002,
  mountainColor: '#050510',
  snowlineColor: '#1a1a3a',
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.config);
    applyConfig();
  }
});

function applyConfig() {
  document.getElementById('mainTitle').textContent = CONFIG.titleText;
  document.getElementById('subTitle').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('auroraCanvas');
const ctx = canvas.getContext('2d');
let W, H;

// Stars
const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({
    x: Math.random(), y: Math.random() * 0.55,
    r: Math.random() * 1.8 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.004,
    brightness: 0.4 + Math.random() * 0.6,
  });
}

// Shooting stars
const shootingStars = [];

function spawnShootingStar() {
  shootingStars.push({
    x: Math.random() * W * 0.8,
    y: Math.random() * H * 0.3,
    vx: 3 + Math.random() * 5,
    vy: 1 + Math.random() * 3,
    life: 1.0,
    decay: 0.015 + Math.random() * 0.01,
    len: 40 + Math.random() * 60,
  });
}

// Mountain silhouettes (3 layers for depth)
var mountainLayers = [];
function generateMountains() {
  mountainLayers = [];
  for (let layer = 0; layer < 3; layer++) {
    const points = [];
    const baseY = H * (0.72 + layer * 0.06);
    const amplitude = H * (0.12 - layer * 0.025);
    const segments = 60;
    for (let i = 0; i <= segments; i++) {
      const x = (i / segments) * W;
      let y = baseY;
      y -= Math.sin(i * 0.15 + layer * 2) * amplitude;
      y -= Math.sin(i * 0.08 + layer * 5) * amplitude * 0.5;
      y -= Math.sin(i * 0.25 + layer * 3) * amplitude * 0.3;
      // Add some jagged peaks
      if (Math.random() > 0.7) y -= Math.random() * amplitude * 0.2;
      points.push({ x, y });
    }
    mountainLayers.push({ points, layer, baseY });
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateMountains();
}
resize();
window.addEventListener('resize', resize);

// Aurora wave bands
class AuroraWave {
  constructor(i, total) {
    this.index = i;
    this.yBase = H * (0.12 + (i / total) * 0.35);
    this.amplitude = 25 + Math.random() * 50;
    this.frequency = 0.0015 + Math.random() * 0.002;
    this.speed = 0.0002 + Math.random() * 0.0005;
    this.phase = Math.random() * Math.PI * 2;
    this.colorIdx = i % CONFIG.auroraColors.length;
    this.thickness = 50 + Math.random() * 100;
    this.opacity = 0.06 + Math.random() * 0.08;
    this.noisePhase = Math.random() * 100;
    this.verticalDrift = Math.random() * 0.0001;
  }
  draw(t) {
    const color = CONFIG.auroraColors[this.colorIdx % CONFIG.auroraColors.length];
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);

    // Vertical breathing
    const breathe = Math.sin(t * this.verticalDrift + this.phase) * 15;

    // Draw curtain-like aurora
    ctx.beginPath();
    const points = [];
    for (let x = 0; x <= W; x += 3) {
      const wave1 = Math.sin(x * this.frequency + t * this.speed + this.phase) * this.amplitude;
      const wave2 = Math.sin(x * this.frequency * 0.6 + t * this.speed * 1.4 + this.noisePhase) * this.amplitude * 0.4;
      const wave3 = Math.sin(x * this.frequency * 0.3 + t * this.speed * 0.7) * this.amplitude * 0.2;
      const y = this.yBase + wave1 + wave2 + wave3 + breathe;
      points.push({ x, y });
    }

    // Draw vertical curtain rays
    const intensityMod = 0.7 + 0.3 * Math.sin(t * 0.0003 + this.phase);
    for (let i = 0; i < points.length - 1; i += 2) {
      const p = points[i];
      const rayLen = this.thickness * (0.5 + 0.5 * Math.sin(t * 0.001 + p.x * 0.005 + this.phase));
      const localIntensity = this.opacity * intensityMod * (0.5 + 0.5 * Math.sin(t * 0.0008 + p.x * 0.003));

      const grad = ctx.createLinearGradient(p.x, p.y - rayLen * 0.3, p.x, p.y + rayLen);
      grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
      grad.addColorStop(0.15, `rgba(${r},${g},${b},${localIntensity * 0.5})`);
      grad.addColorStop(0.4, `rgba(${r},${g},${b},${localIntensity})`);
      grad.addColorStop(0.7, `rgba(${r},${g},${b},${localIntensity * 0.6})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

      ctx.fillStyle = grad;
      ctx.fillRect(p.x - 1.5, p.y - rayLen * 0.3, 3, rayLen * 1.3);
    }

    // Bright core line
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = `rgba(${r},${g},${b},${this.opacity * 0.4 * intensityMod})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

const waves = [];
for (let i = 0; i < CONFIG.waveCount; i++) waves.push(new AuroraWave(i, CONFIG.waveCount));

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.skyColorTop);
  grad.addColorStop(0.4, CONFIG.skyColorMid);
  grad.addColorStop(1, CONFIG.skyColorBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t) {
  stars.forEach(s => {
    s.twinkle += s.speed;
    const a = s.brightness * (0.3 + 0.7 * Math.abs(Math.sin(s.twinkle)));
    const sx = s.x * W;
    const sy = s.y * H;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();

    // Cross-shaped glow for bigger stars
    if (s.r > 1.2) {
      const glowA = a * 0.2;
      const gl = s.r * 3;
      ctx.strokeStyle = `rgba(255,255,255,${glowA})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(sx - gl, sy);
      ctx.lineTo(sx + gl, sy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx, sy - gl);
      ctx.lineTo(sx, sy + gl);
      ctx.stroke();
    }
  });
}

function drawShootingStars() {
  if (Math.random() < CONFIG.shootingStarFrequency) spawnShootingStar();

  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;
    if (s.life <= 0) { shootingStars.splice(i, 1); continue; }

    const tailX = s.x - s.vx * s.len / s.vx;
    const tailY = s.y - s.vy * s.len / s.vx;
    const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, `rgba(255,255,255,${s.life * 0.8})`);
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(s.x, s.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Head glow
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.life})`;
    ctx.fill();
  }
}

function drawMountains() {
  mountainLayers.forEach((ml, li) => {
    const darkness = 1 - li * 0.15;
    const mr = parseInt(CONFIG.mountainColor.slice(1, 3), 16) * darkness;
    const mg = parseInt(CONFIG.mountainColor.slice(3, 5), 16) * darkness;
    const mb = parseInt(CONFIG.mountainColor.slice(5, 7), 16) * darkness;

    ctx.beginPath();
    ctx.moveTo(0, H);
    ml.points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = `rgb(${Math.floor(mr)},${Math.floor(mg)},${Math.floor(mb)})`;
    ctx.fill();

    // Snow on peaks (first layer only)
    if (li === 0) {
      const sr = parseInt(CONFIG.snowlineColor.slice(1, 3), 16);
      const sg = parseInt(CONFIG.snowlineColor.slice(3, 5), 16);
      const sb = parseInt(CONFIG.snowlineColor.slice(5, 7), 16);
      for (let i = 1; i < ml.points.length - 1; i++) {
        const prev = ml.points[i - 1];
        const curr = ml.points[i];
        const next = ml.points[i + 1];
        // Detect peaks (local minima in y = high points)
        if (curr.y < prev.y && curr.y < next.y && curr.y < ml.baseY - H * 0.06) {
          ctx.beginPath();
          ctx.moveTo(curr.x - 8, curr.y + 6);
          ctx.lineTo(curr.x, curr.y);
          ctx.lineTo(curr.x + 8, curr.y + 6);
          ctx.fillStyle = `rgba(${sr},${sg},${sb},0.3)`;
          ctx.fill();
        }
      }
    }
  });

  // Fog at mountain base
  const fogGrad = ctx.createLinearGradient(0, H * 0.75, 0, H * 0.85);
  fogGrad.addColorStop(0, 'transparent');
  fogGrad.addColorStop(1, 'rgba(10,10,30,0.3)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, H * 0.75, W, H * 0.1);
}

// Ground / snow field at bottom
function drawGround() {
  const groundGrad = ctx.createLinearGradient(0, H * 0.82, 0, H);
  groundGrad.addColorStop(0, 'transparent');
  groundGrad.addColorStop(0.3, CONFIG.mountainColor);
  groundGrad.addColorStop(1, '#020208');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H * 0.82, W, H * 0.18);

  // Snow glitter
  for (let i = 0; i < 30; i++) {
    const sx = (i * W / 29) + Math.sin(performance.now() * 0.001 + i * 3) * 5;
    const sy = H * 0.88 + Math.sin(i * 1.5) * H * 0.03;
    const glitter = 0.5 + 0.5 * Math.sin(performance.now() * 0.003 + i * 7);
    if (glitter > 0.85) {
      ctx.beginPath();
      ctx.arc(sx, sy, 0.8, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${glitter * 0.3})`;
      ctx.fill();
    }
  }
}

// Aurora reflection on snow
function drawAuroraReflection(t) {
  const reflY = H * 0.85;
  CONFIG.auroraColors.forEach((color, i) => {
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    const pulse = 0.3 + 0.7 * Math.sin(t * 0.0004 + i * 1.5);
    const grad = ctx.createRadialGradient(
      W * (0.15 + i * 0.15), reflY, 0,
      W * (0.15 + i * 0.15), reflY, W * 0.12
    );
    grad.addColorStop(0, `rgba(${r},${g},${b},${0.02 * pulse})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, reflY - 20, W, H * 0.15);
  });
}

function animate(t) {
  if (!W || !H) { requestAnimationFrame(animate); return; }
  drawBackground();
  drawStars(t);
  drawShootingStars();

  // Aurora with screen blending
  ctx.globalCompositeOperation = 'screen';
  waves.forEach(w => w.draw(t));
  ctx.globalCompositeOperation = 'source-over';

  drawMountains();
  drawGround();
  drawAuroraReflection(t);

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

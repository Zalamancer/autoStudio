<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainy Window</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgColor: '#0a1628',
  dropletColor: '#8ab4f8',
  bokehColors: ['#ff6b35', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#fca311'],
  rainIntensity: 0.6,
  lightningFrequency: 0.003,
  title: ''
};

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config);
});

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Bokeh light ---
class BokehLight {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.baseR = 15 + Math.random() * 50;
    this.color = CONFIG.bokehColors[Math.floor(Math.random() * CONFIG.bokehColors.length)];
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.3 + Math.random() * 0.8;
    this.opacity = 0.08 + Math.random() * 0.15;
    this.driftX = (Math.random() - 0.5) * 0.1;
    this.driftY = (Math.random() - 0.5) * 0.05;
  }
  update(t) {
    this.x += this.driftX;
    this.y += this.driftY;
    if (this.x < -60 || this.x > W + 60 || this.y < -60 || this.y > H + 60) this.reset();
  }
  draw(ctx, t) {
    const pulse = 0.8 + Math.sin(t * this.pulseSpeed + this.pulsePhase) * 0.2;
    const r = this.baseR * pulse;
    const alpha = this.opacity * pulse;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
    const hexAlpha = Math.floor(alpha * 255).toString(16).padStart(2, '0');
    const halfAlpha = Math.floor(alpha * 128).toString(16).padStart(2, '0');
    grad.addColorStop(0, this.color + hexAlpha);
    grad.addColorStop(0.5, this.color + halfAlpha);
    grad.addColorStop(1, this.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Rain streak ---
class RainStreak {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W * 1.2 - W * 0.1;
    this.y = -20 - Math.random() * 100;
    this.speed = 8 + Math.random() * 12;
    this.length = 15 + Math.random() * 30;
    this.width = 0.5 + Math.random() * 1;
    this.opacity = 0.08 + Math.random() * 0.15;
    this.windOffset = (Math.random() - 0.3) * 2;
  }
  update() {
    this.y += this.speed;
    this.x += this.windOffset;
    if (this.y > H + 20) this.reset();
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.windOffset * 2, this.y - this.length);
    ctx.strokeStyle = `rgba(180, 200, 230, ${this.opacity})`;
    ctx.lineWidth = this.width;
    ctx.stroke();
  }
}

// --- Window droplet (runs down glass) ---
class WindowDroplet {
  constructor() {
    this.reset(true);
  }
  reset(initial) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H : -5;
    this.radius = 2 + Math.random() * 4;
    this.speed = 0;
    this.baseSpeed = 0.2 + Math.random() * 0.6;
    this.trail = [];
    this.maxTrail = 20 + Math.floor(Math.random() * 30);
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleAmp = 0.3 + Math.random() * 0.5;
    this.paused = false;
    this.pauseTimer = 0;
    this.pauseDuration = 0;
    this.accumulated = 0;
  }
  update() {
    if (this.paused) {
      this.pauseTimer++;
      if (this.pauseTimer > this.pauseDuration) {
        this.paused = false;
        this.speed = this.baseSpeed * 1.5;
      }
      return;
    }
    this.accumulated += 0.01;
    this.speed = this.baseSpeed + this.accumulated * 0.5;
    this.speed = Math.min(this.speed, 3);
    this.wobble += 0.08;
    this.x += Math.sin(this.wobble) * this.wobbleAmp;
    this.y += this.speed;
    this.trail.push({ x: this.x, y: this.y, r: this.radius * 0.3 });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    if (Math.random() < 0.005) {
      this.paused = true;
      this.pauseTimer = 0;
      this.pauseDuration = 30 + Math.random() * 80;
      this.speed = 0;
      this.accumulated = 0;
    }
    if (this.y > H + 10) this.reset(false);
  }
  draw(ctx) {
    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = 'rgba(160, 190, 220, 0.06)';
      ctx.lineWidth = this.radius * 0.6;
      ctx.stroke();
    }
    // Main droplet with refraction
    const grad = ctx.createRadialGradient(
      this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
      this.x, this.y, this.radius
    );
    grad.addColorStop(0, 'rgba(220, 235, 255, 0.35)');
    grad.addColorStop(0.5, 'rgba(180, 210, 240, 0.15)');
    grad.addColorStop(1, 'rgba(140, 180, 220, 0.05)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Condensation patch ---
class CondensationPatch {
  constructor() {
    this.x = Math.random() * W;
    this.y = H * 0.5 + Math.random() * H * 0.5;
    this.w = 40 + Math.random() * 120;
    this.h = 20 + Math.random() * 60;
    this.opacity = 0.02 + Math.random() * 0.04;
    this.phase = Math.random() * Math.PI * 2;
  }
  draw(ctx, t) {
    const alpha = this.opacity * (0.7 + Math.sin(t * 0.3 + this.phase) * 0.3);
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.w);
    grad.addColorStop(0, `rgba(180, 200, 220, ${alpha})`);
    grad.addColorStop(1, 'rgba(180, 200, 220, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.w, this.h, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Lightning system ---
let lightningFlash = 0;
let lightningBolts = [];

function triggerLightning() {
  lightningFlash = 1;
  lightningBolts = [];
  function bolt(x1, y1, x2, y2, depth) {
    const segments = [];
    const steps = 6 + Math.floor(Math.random() * 6);
    let cx = x1, cy = y1;
    const dx = (x2 - x1) / steps, dy = (y2 - y1) / steps;
    segments.push({ x: cx, y: cy });
    for (let i = 1; i <= steps; i++) {
      cx = x1 + dx * i + (Math.random() - 0.5) * 60;
      cy = y1 + dy * i + (Math.random() - 0.5) * 20;
      segments.push({ x: cx, y: cy });
      if (depth < 2 && Math.random() < 0.3) {
        bolt(cx, cy, cx + (Math.random() - 0.5) * 80, cy + 40 + Math.random() * 60, depth + 1);
      }
    }
    lightningBolts.push({ segments, width: Math.max(1, 3 - depth), opacity: 1 - depth * 0.3 });
  }
  const startX = W * 0.2 + Math.random() * W * 0.6;
  bolt(startX, 0, startX + (Math.random() - 0.5) * 100, H * 0.4, 0);
}

function drawLightning(ctx) {
  if (lightningFlash <= 0) return;
  ctx.fillStyle = `rgba(200, 210, 230, ${lightningFlash * 0.15})`;
  ctx.fillRect(0, 0, W, H);
  lightningBolts.forEach(bolt => {
    if (bolt.segments.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(bolt.segments[0].x, bolt.segments[0].y);
    for (let i = 1; i < bolt.segments.length; i++) {
      ctx.lineTo(bolt.segments[i].x, bolt.segments[i].y);
    }
    ctx.strokeStyle = `rgba(220, 230, 255, ${bolt.opacity * lightningFlash})`;
    ctx.lineWidth = bolt.width;
    ctx.stroke();
    ctx.strokeStyle = `rgba(180, 200, 255, ${bolt.opacity * lightningFlash * 0.3})`;
    ctx.lineWidth = bolt.width + 4;
    ctx.stroke();
  });
  lightningFlash *= 0.92;
  if (lightningFlash < 0.01) lightningFlash = 0;
}

// --- Window frame ---
function drawWindowFrame(ctx) {
  const frameW = 8;
  const fc = 'rgba(40, 45, 55, 0.8)';
  ctx.fillStyle = fc;
  ctx.fillRect(0, 0, W, frameW);
  ctx.fillRect(0, H - frameW, W, frameW);
  ctx.fillRect(0, 0, frameW, H);
  ctx.fillRect(W - frameW, 0, frameW, H);
  ctx.fillRect(W / 2 - frameW / 2, 0, frameW, H);
  ctx.fillRect(0, H / 2 - frameW / 2, W, frameW);
  // Inner shadows
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(frameW, frameW, 3, H - frameW * 2);
  ctx.fillRect(W / 2 + frameW / 2, frameW, 3, H - frameW * 2);
}

function drawTitle(ctx) {
  if (!CONFIG.title) return;
  ctx.save();
  ctx.font = `300 ${Math.max(14, H * 0.035)}px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180, 200, 230, 0.5)';
  ctx.fillText(CONFIG.title, W / 2, H * 0.07);
  ctx.restore();
}

// Initialize entities
let bokehLights = [];
let rainStreaks = [];
let droplets = [];
let condensation = [];
let initialized = false;

function initScene() {
  bokehLights = [];
  for (let i = 0; i < 25; i++) bokehLights.push(new BokehLight());
  rainStreaks = [];
  for (let i = 0; i < 200; i++) rainStreaks.push(new RainStreak());
  droplets = [];
  for (let i = 0; i < 50; i++) droplets.push(new WindowDroplet());
  condensation = [];
  for (let i = 0; i < 12; i++) condensation.push(new CondensationPatch());
  initialized = true;
}

let startTime = 0;
function animate(ts) {
  if (!startTime) startTime = ts;
  const t = (ts - startTime) / 1000;

  resize();
  if (!initialized) initScene();

  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, CONFIG.bgColor);
  bgGrad.addColorStop(0.5, CONFIG.bgColor);
  bgGrad.addColorStop(1, '#050d1a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Distant building silhouettes
  ctx.fillStyle = 'rgba(15, 25, 45, 0.8)';
  for (let i = 0; i < 12; i++) {
    const bx = i * W / 12 + Math.sin(i * 2.3) * 20;
    const bw = 30 + W / 15;
    const bh = H * 0.2 + Math.sin(i * 1.7) * H * 0.15;
    ctx.fillRect(bx, H * 0.65 - bh, bw, bh + H * 0.4);
  }
  // Building windows
  ctx.fillStyle = 'rgba(200, 180, 120, 0.06)';
  for (let i = 0; i < 60; i++) {
    const wx = Math.random() * W;
    const wy = H * 0.35 + Math.random() * H * 0.35;
    ctx.fillRect(wx, wy, 3, 4);
  }

  // Bokeh lights (behind glass, blurred)
  ctx.globalCompositeOperation = 'lighter';
  bokehLights.forEach(b => { b.update(t); b.draw(ctx, t); });
  ctx.globalCompositeOperation = 'source-over';

  // Glass tint overlay
  ctx.fillStyle = 'rgba(10, 20, 40, 0.25)';
  ctx.fillRect(0, 0, W, H);

  // Rain streaks
  const activeRain = Math.floor(200 * CONFIG.rainIntensity);
  for (let i = 0; i < activeRain && i < rainStreaks.length; i++) {
    rainStreaks[i].update();
    rainStreaks[i].draw(ctx);
  }

  // Condensation
  condensation.forEach(c => c.draw(ctx, t));

  // Window droplets
  const activeDroplets = Math.floor(50 * CONFIG.rainIntensity);
  for (let i = 0; i < activeDroplets && i < droplets.length; i++) {
    droplets[i].update();
    droplets[i].draw(ctx);
  }

  // Spawn new droplets
  if (Math.random() < CONFIG.rainIntensity * 0.08) {
    const idx = droplets.findIndex(d => d.y > H);
    if (idx >= 0) droplets[idx].reset(false);
  }

  // Lightning
  if (Math.random() < CONFIG.lightningFrequency) triggerLightning();
  drawLightning(ctx);

  // Window frame
  drawWindowFrame(ctx);

  // Vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  drawTitle(ctx);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>

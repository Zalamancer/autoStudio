<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Wave - Kinetic Typography</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0014;
    font-family: 'Inter', sans-serif;
  }

  #trail-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #word-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .neon-word {
    position: absolute;
    white-space: nowrap;
    opacity: 0;
    will-change: transform, opacity;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.05em;
    transition: none;
  }
</style>
</head>
<body>

<canvas id="trail-canvas"></canvas>
<div id="word-container"></div>

<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  words: ['BELIEVE', 'IN', 'THE', 'PROCESS'],
  colors: ['#FF00FF', '#00FFFF', '#FF6600', '#39FF14'],
  bgColor: '#0a0014',
  bgGradientEnd: '#140028',
  glowIntensity: 30,
  waveAmplitude: 80,
  waveSpeed: 2,
  cycleDuration: 8000,
  trailLength: 5,
};
// =========================================

// --- Apply background gradient ---
document.body.style.background = `linear-gradient(135deg, ${CONFIG.bgColor} 0%, ${CONFIG.bgGradientEnd} 50%, ${CONFIG.bgColor} 100%)`;

// --- Canvas setup for light trails ---
const canvas = document.getElementById('trail-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- Font weight and size pools ---
const fontWeights = [100, 400, 700, 900];
const fontSizeRange = { min: 40, max: 140 };

// --- Utility ---
function hexToRGBA(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeInCubic(t) {
  return t * t * t;
}

function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// --- Word data model ---
class NeonWord {
  constructor(text, index, total) {
    this.text = text;
    this.index = index;
    this.total = total;
    this.color = CONFIG.colors[index % CONFIG.colors.length];
    this.weight = fontWeights[index % fontWeights.length];
    this.fontSize = lerp(fontSizeRange.max, fontSizeRange.min, (total > 1 ? index / (total - 1) : 0));
    // Alternate: bigger words at start and end
    if (total > 2) {
      const mid = (total - 1) / 2;
      const dist = Math.abs(index - mid) / mid;
      this.fontSize = lerp(fontSizeRange.min, fontSizeRange.max, dist * 0.7 + 0.3);
    }
    this.fontSize = Math.round(Math.min(this.fontSize, W * 0.22, H * 0.1));

    // Target position: distributed vertically with some horizontal variety
    const verticalSlice = H / (total + 1);
    this.targetY = verticalSlice * (index + 1);
    this.targetX = W * 0.5 + (index % 2 === 0 ? -1 : 1) * W * 0.05 * (index % 3);

    // Entrance direction: alternate left/right
    this.fromLeft = index % 2 === 0;
    this.startX = this.fromLeft ? -400 : W + 400;
    this.startY = this.targetY;

    // Trail points
    this.trail = [];
    this.currentX = this.startX;
    this.currentY = this.startY;

    // Timing
    this.entranceDelay = index * 800;
    this.entranceDuration = 1200;
    this.holdDuration = CONFIG.cycleDuration - (total * 800) - 1500;
    if (this.holdDuration < 1000) this.holdDuration = 1000;

    // Glow pulse state
    this.glowPhase = Math.random() * Math.PI * 2;
    this.glowSpeed = 1.5 + Math.random() * 1.5;

    // State
    this.phase = 'waiting'; // waiting, entering, holding, fading
    this.progress = 0;
    this.opacity = 0;
    this.active = false;

    // Create DOM element
    this.el = document.createElement('div');
    this.el.className = 'neon-word';
    this.el.textContent = text;
    this.el.style.fontSize = this.fontSize + 'px';
    this.el.style.fontWeight = this.weight;
    this.el.style.color = this.color;
    document.getElementById('word-container').appendChild(this.el);
  }

  updateGlow(time) {
    const pulse = Math.sin(time * 0.001 * this.glowSpeed + this.glowPhase);
    const intensity = CONFIG.glowIntensity * (0.6 + 0.4 * pulse);
    const intensityLarge = intensity * 2.5;
    const intensityHuge = intensity * 4;

    this.el.style.textShadow = [
      `0 0 ${intensity * 0.3}px ${this.color}`,
      `0 0 ${intensity}px ${this.color}`,
      `0 0 ${intensityLarge}px ${hexToRGBA(this.color, 0.6)}`,
      `0 0 ${intensityHuge}px ${hexToRGBA(this.color, 0.3)}`,
    ].join(', ');
  }

  update(cycleTime, globalTime) {
    const localTime = cycleTime - this.entranceDelay;

    if (localTime < 0) {
      this.phase = 'waiting';
      this.opacity = 0;
      this.active = false;
    } else if (localTime < this.entranceDuration) {
      // Entering with wave motion
      this.phase = 'entering';
      this.active = true;
      const t = localTime / this.entranceDuration;
      const eased = easeOutCubic(t);

      // Position with sine wave arc
      this.currentX = lerp(this.startX, this.targetX, eased);
      const waveOffset = Math.sin(t * Math.PI * CONFIG.waveSpeed) * CONFIG.waveAmplitude * (1 - eased);
      this.currentY = lerp(this.startY, this.targetY, eased) + waveOffset;

      this.opacity = Math.min(1, t * 2.5);

      // Record trail
      this.trail.push({
        x: this.currentX,
        y: this.currentY,
        alpha: this.opacity,
        time: globalTime,
      });
      if (this.trail.length > 60) this.trail.shift();

    } else {
      const holdTime = localTime - this.entranceDuration;
      const totalFadeStart = this.holdDuration;

      if (holdTime < totalFadeStart) {
        // Holding at target position
        this.phase = 'holding';
        this.active = true;
        this.opacity = 1;

        // Gentle floating
        const floatT = holdTime * 0.001;
        this.currentX = this.targetX + Math.sin(floatT * 0.8 + this.index) * 8;
        this.currentY = this.targetY + Math.cos(floatT * 1.1 + this.index * 0.7) * 5;

        // Slowly clear trail
        if (this.trail.length > 0 && holdTime > 300) {
          this.trail.shift();
        }
      } else {
        // Fading out
        this.phase = 'fading';
        const fadeProgress = (holdTime - totalFadeStart) / 1000;
        this.opacity = Math.max(0, 1 - easeInCubic(Math.min(1, fadeProgress)));
        this.active = this.opacity > 0;
        this.trail = [];
      }
    }

    // Apply to DOM
    this.el.style.opacity = this.opacity;
    this.el.style.transform = `translate(${this.currentX - this.el.offsetWidth / 2}px, ${this.currentY - this.el.offsetHeight / 2}px)`;

    if (this.opacity > 0) {
      this.updateGlow(globalTime);
    }
  }

  drawTrail(ctx) {
    if (this.trail.length < 2) return;

    const now = performance.now();
    const maxAge = 600;

    for (let i = 1; i < this.trail.length; i++) {
      const p0 = this.trail[i - 1];
      const p1 = this.trail[i];
      const age = now - p1.time;
      const ageFactor = Math.max(0, 1 - age / maxAge);
      const positionFactor = i / this.trail.length;
      const alpha = ageFactor * positionFactor * 0.7;

      if (alpha <= 0) continue;

      const lineWidth = lerp(1, CONFIG.trailLength * 3, positionFactor);

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = hexToRGBA(this.color, alpha);
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Glow layer on trail
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = hexToRGBA(this.color, alpha * 0.3);
      ctx.lineWidth = lineWidth * 3;
      ctx.stroke();
    }

    // Leading glow particle
    if (this.trail.length > 0 && this.phase === 'entering') {
      const last = this.trail[this.trail.length - 1];
      const grad = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 25);
      grad.addColorStop(0, hexToRGBA(this.color, 0.8));
      grad.addColorStop(0.4, hexToRGBA(this.color, 0.3));
      grad.addColorStop(1, hexToRGBA(this.color, 0));
      ctx.beginPath();
      ctx.arc(last.x, last.y, 25, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }

  reset() {
    this.trail = [];
    this.phase = 'waiting';
    this.progress = 0;
    this.opacity = 0;
    this.active = false;
    this.currentX = this.startX;
    this.currentY = this.startY;
    this.el.style.opacity = 0;
  }

  destroy() {
    this.el.remove();
  }
}

// --- Ambient glow particles ---
class GlowParticle {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.radius = 1 + Math.random() * 2;
    this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
    this.alpha = 0.1 + Math.random() * 0.3;
    this.pulseSpeed = 0.5 + Math.random() * 2;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.life = 1;
  }

  update(time) {
    this.x += this.vx;
    this.y += this.vy;
    const pulse = Math.sin(time * 0.001 * this.pulseSpeed + this.pulsePhase);
    this.currentAlpha = this.alpha * (0.5 + 0.5 * pulse);

    if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.reset();
    }
  }

  draw(ctx) {
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
    grad.addColorStop(0, hexToRGBA(this.color, this.currentAlpha));
    grad.addColorStop(1, hexToRGBA(this.color, 0));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// --- Build scene ---
let words = [];
let particles = [];
let cycleStartTime = 0;
let initialized = false;

function buildScene() {
  // Clear old words
  words.forEach(w => w.destroy());
  words = [];

  // Recalculate dimensions
  resizeCanvas();

  // Create word objects
  const total = CONFIG.words.length;
  for (let i = 0; i < total; i++) {
    words.push(new NeonWord(CONFIG.words[i], i, total));
  }

  // Create ambient particles
  particles = [];
  const particleCount = Math.floor((W * H) / 25000);
  for (let i = 0; i < particleCount; i++) {
    particles.push(new GlowParticle());
  }

  cycleStartTime = performance.now();
  initialized = true;
}

// --- Compute total cycle time ---
function getTotalCycleTime() {
  const total = CONFIG.words.length;
  const lastWordDelay = (total - 1) * 800;
  const entranceDuration = 1200;
  let holdDuration = CONFIG.cycleDuration - (total * 800) - 1500;
  if (holdDuration < 1000) holdDuration = 1000;
  const fadeDuration = 1000;
  return lastWordDelay + entranceDuration + holdDuration + fadeDuration + 500;
}

// --- Main animation loop ---
function animate(now) {
  requestAnimationFrame(animate);
  if (!initialized) return;

  const totalCycleTime = getTotalCycleTime();
  let cycleTime = now - cycleStartTime;

  // Check for loop reset
  if (cycleTime > totalCycleTime) {
    cycleStartTime = now;
    cycleTime = 0;
    words.forEach(w => w.reset());
  }

  // Clear canvas with fade
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = hexToRGBA(CONFIG.bgColor, 0.25);
  ctx.fillRect(0, 0, W, H);

  // Draw ambient particles
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    p.update(now);
    p.draw(ctx);
  }

  // Update and draw word trails
  for (const word of words) {
    word.update(cycleTime, now);
    word.drawTrail(ctx);
  }

  ctx.globalCompositeOperation = 'source-over';
}

// --- Horizontal scan line effect (subtle) ---
function drawScanLines(ctx, time) {
  const lineSpacing = 4;
  ctx.globalCompositeOperation = 'source-over';
  for (let y = 0; y < H; y += lineSpacing) {
    ctx.fillStyle = `rgba(0,0,0,0.03)`;
    ctx.fillRect(0, y, W, 1);
  }
}

// --- Start ---
buildScene();
requestAnimationFrame(animate);

// Handle resize
window.addEventListener('resize', () => {
  buildScene();
});
</script>
</body>
</html>

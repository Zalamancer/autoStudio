<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northern Lights Cabin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0e2a;
    font-family: 'Courier New', monospace;
  }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgColor: '#0a0e2a',
  auroraColors: ['#00ff88', '#8844ff', '#00ddcc'],
  cabinColor: '#1a1008',
  snowIntensity: 60,
  starCount: 200,
  cycleDuration: 16000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, startTime = performance.now();

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initTerrain();
}
resize();
window.addEventListener('resize', resize);

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1,3),16),
    g: parseInt(hex.slice(3,5),16),
    b: parseInt(hex.slice(5,7),16)
  };
}

// Stars
const stars = [];
function initStars() {
  stars.length = 0;
  for (let i = 0; i < CONFIG.starCount; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.55,
      r: Math.random() * 1.6 + 0.3,
      brightness: Math.random(),
      twinkleSpeed: Math.random() * 3 + 0.8,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}
initStars();

// Aurora bands
const auroraBands = [];
function initAurora() {
  auroraBands.length = 0;
  for (let i = 0; i < 5; i++) {
    const points = [];
    const numPoints = 12;
    for (let j = 0; j < numPoints; j++) {
      points.push({
        baseY: 0.12 + i * 0.07 + Math.random() * 0.04,
        amplitude: 0.02 + Math.random() * 0.04,
        frequency: 0.5 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.7
      });
    }
    auroraBands.push({
      points,
      colorIdx: i % CONFIG.auroraColors.length,
      opacity: 0.15 + Math.random() * 0.2,
      height: 0.04 + Math.random() * 0.06,
      waveSpeed: 0.2 + Math.random() * 0.4
    });
  }
}
initAurora();

// Snow particles
let snowflakes = [];
function initSnow() {
  snowflakes = [];
  for (let i = 0; i < CONFIG.snowIntensity; i++) {
    snowflakes.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 2.5 + 0.5,
      speedY: 0.015 + Math.random() * 0.03,
      speedX: (Math.random() - 0.5) * 0.008,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.6 + 0.2
    });
  }
}
initSnow();

// Pine trees
let trees = [];
function initTerrain() {
  trees = [];
  const treeCount = 18 + Math.floor(W / 80);
  for (let i = 0; i < treeCount; i++) {
    trees.push({
      x: Math.random(),
      height: 0.06 + Math.random() * 0.1,
      width: 0.015 + Math.random() * 0.02,
      layers: 4 + Math.floor(Math.random() * 3),
      darkness: 0.7 + Math.random() * 0.3
    });
  }
  trees.sort((a, b) => a.height - b.height);
}

// Chimney smoke particles
const smokeParticles = [];
const maxSmoke = 30;

// Shooting star
let shootingStar = null;
let lastShootingStar = 0;

function drawSky(t) {
  const bg = hexToRgb(CONFIG.bgColor);
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  grad.addColorStop(0, `rgb(${Math.max(0, bg.r - 8)},${Math.max(0, bg.g - 10)},${Math.max(0, bg.b - 15)})`);
  grad.addColorStop(0.4, `rgb(${bg.r},${bg.g},${bg.b})`);
  grad.addColorStop(0.7, `rgb(${Math.min(255, bg.r + 10)},${Math.min(255, bg.g + 8)},${Math.min(255, bg.b + 20)})`);
  grad.addColorStop(1, `rgb(${Math.min(255, bg.r + 20)},${Math.min(255, bg.g + 15)},${Math.min(255, bg.b + 35)})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.65);
}

function drawStars(t) {
  for (const s of stars) {
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.001 * s.twinkleSpeed + s.twinklePhase));
    const alpha = s.brightness * 0.3 + tw * 0.7;
    const sx = s.x * W;
    const sy = s.y * H;

    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();

    // Cross sparkle for bright stars
    if (s.r > 1.2 && tw > 0.7) {
      const sparkleLen = s.r * 4 * tw;
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(sx - sparkleLen, sy);
      ctx.lineTo(sx + sparkleLen, sy);
      ctx.moveTo(sx, sy - sparkleLen);
      ctx.lineTo(sx, sy + sparkleLen);
      ctx.stroke();
    }
  }
}

function drawAurora(t) {
  for (const band of auroraBands) {
    const color = hexToRgb(CONFIG.auroraColors[band.colorIdx % CONFIG.auroraColors.length]);
    const numSegments = 80;

    // Build the curtain path
    ctx.beginPath();
    for (let i = 0; i <= numSegments; i++) {
      const frac = i / numSegments;
      const x = frac * W;

      // Compute Y from wave sum of points
      let y = 0;
      for (let p = 0; p < band.points.length; p++) {
        const pt = band.points[p];
        const wave = Math.sin(frac * pt.frequency * Math.PI * 2 + t * 0.001 * pt.speed + pt.phase);
        y += pt.baseY + wave * pt.amplitude;
      }
      y = (y / band.points.length) * H;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    // Close the bottom of the curtain
    for (let i = numSegments; i >= 0; i--) {
      const frac = i / numSegments;
      const x = frac * W;
      let y = 0;
      for (let p = 0; p < band.points.length; p++) {
        const pt = band.points[p];
        const wave = Math.sin(frac * pt.frequency * Math.PI * 2 + t * 0.001 * pt.speed + pt.phase);
        y += pt.baseY + wave * pt.amplitude + band.height;
      }
      y = (y / band.points.length) * H;
      ctx.lineTo(x, y);
    }
    ctx.closePath();

    // Vertical curtain gradient
    const gradY = H * 0.08;
    const gradH = H * 0.35;
    const auroraGrad = ctx.createLinearGradient(0, gradY, 0, gradY + gradH);
    const pulseAlpha = band.opacity * (0.7 + 0.3 * Math.sin(t * 0.0005 * band.waveSpeed));
    auroraGrad.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${pulseAlpha * 0.3})`);
    auroraGrad.addColorStop(0.3, `rgba(${color.r},${color.g},${color.b},${pulseAlpha})`);
    auroraGrad.addColorStop(0.6, `rgba(${color.r},${color.g},${color.b},${pulseAlpha * 0.6})`);
    auroraGrad.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
    ctx.fillStyle = auroraGrad;
    ctx.fill();

    // Vertical streaks within the aurora (curtain folds)
    ctx.save();
    ctx.clip();
    for (let s = 0; s < 20; s++) {
      const sx = (s / 20 + Math.sin(t * 0.0003 + s) * 0.02) * W;
      const streakAlpha = 0.03 + 0.04 * Math.sin(t * 0.002 + s * 1.3);
      ctx.strokeStyle = `rgba(${Math.min(255, color.r + 50)},${Math.min(255, color.g + 50)},${Math.min(255, color.b + 50)},${streakAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx, H * 0.05);
      ctx.lineTo(sx + Math.sin(t * 0.001 + s) * 10, H * 0.4);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawGround(t) {
  const groundY = H * 0.62;

  // Snow ground gradient
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, '#c8d0e0');
  groundGrad.addColorStop(0.15, '#b0b8cc');
  groundGrad.addColorStop(0.4, '#8890a8');
  groundGrad.addColorStop(1, '#606880');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Gentle snow hills
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (let x = 0; x <= W; x += 3) {
    const hill = Math.sin(x * 0.005) * 8 + Math.sin(x * 0.012) * 4 + Math.sin(x * 0.002) * 12;
    ctx.lineTo(x, groundY + hill);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = '#d0d8e8';
  ctx.fill();

  // Frozen lake
  const lakeX = W * 0.25;
  const lakeW = W * 0.5;
  const lakeY = groundY + H * 0.12;
  const lakeH = H * 0.08;

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(lakeX + lakeW / 2, lakeY + lakeH / 2, lakeW / 2, lakeH / 2, 0, 0, Math.PI * 2);
  ctx.clip();

  // Ice surface
  const iceGrad = ctx.createLinearGradient(lakeX, lakeY, lakeX, lakeY + lakeH);
  iceGrad.addColorStop(0, 'rgba(140,170,200,0.6)');
  iceGrad.addColorStop(0.5, 'rgba(120,150,190,0.5)');
  iceGrad.addColorStop(1, 'rgba(100,130,170,0.4)');
  ctx.fillStyle = iceGrad;
  ctx.fillRect(lakeX, lakeY, lakeW, lakeH);

  // Aurora reflection on lake
  for (let i = 0; i < CONFIG.auroraColors.length; i++) {
    const color = hexToRgb(CONFIG.auroraColors[i]);
    const reflectAlpha = 0.04 + 0.03 * Math.sin(t * 0.001 + i * 2);
    const rx = lakeX + (i + 0.5) / CONFIG.auroraColors.length * lakeW;
    const reflGrad = ctx.createRadialGradient(rx, lakeY + lakeH * 0.5, 0, rx, lakeY + lakeH * 0.5, lakeW * 0.2);
    reflGrad.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${reflectAlpha})`);
    reflGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = reflGrad;
    ctx.fillRect(lakeX, lakeY, lakeW, lakeH);
  }

  // Ice cracks
  ctx.strokeStyle = 'rgba(180,200,220,0.15)';
  ctx.lineWidth = 0.5;
  const cracks = [
    [0.3, 0.4, 0.6, 0.55],
    [0.45, 0.3, 0.55, 0.7],
    [0.6, 0.45, 0.75, 0.5],
  ];
  for (const [x1f, y1f, x2f, y2f] of cracks) {
    ctx.beginPath();
    ctx.moveTo(lakeX + x1f * lakeW, lakeY + y1f * lakeH);
    ctx.lineTo(lakeX + x2f * lakeW, lakeY + y2f * lakeH);
    ctx.stroke();
  }

  ctx.restore();
}

function drawTrees(t) {
  const groundY = H * 0.62;

  for (const tree of trees) {
    const tx = tree.x * W;
    const baseY = groundY + Math.sin(tree.x * 5) * 8;
    const th = tree.height * H;
    const tw = tree.width * W;
    const darkness = tree.darkness;

    // Trunk
    ctx.fillStyle = `rgba(${Math.floor(20 * darkness)},${Math.floor(15 * darkness)},${Math.floor(10 * darkness)},0.9)`;
    ctx.fillRect(tx - tw * 0.08, baseY - th * 0.15, tw * 0.16, th * 0.15 + 3);

    // Triangular layers (pine tree)
    for (let l = 0; l < tree.layers; l++) {
      const layerFrac = l / tree.layers;
      const layerY = baseY - th * 0.12 - layerFrac * th * 0.88;
      const layerWidth = tw * (1 - layerFrac * 0.6) * (1.2 - l * 0.05);
      const layerHeight = th / tree.layers * 1.3;

      ctx.beginPath();
      ctx.moveTo(tx, layerY - layerHeight);
      ctx.lineTo(tx - layerWidth / 2, layerY);
      ctx.lineTo(tx + layerWidth / 2, layerY);
      ctx.closePath();

      const green = Math.floor(25 + (1 - darkness) * 15);
      const shade = Math.floor(15 * darkness + layerFrac * 5);
      ctx.fillStyle = `rgb(${shade},${green + Math.floor(layerFrac * 8)},${shade})`;
      ctx.fill();

      // Snow on tree edges
      ctx.beginPath();
      ctx.moveTo(tx, layerY - layerHeight);
      ctx.lineTo(tx - layerWidth * 0.35, layerY - layerHeight * 0.3);
      ctx.lineTo(tx + layerWidth * 0.35, layerY - layerHeight * 0.3);
      ctx.closePath();
      ctx.fillStyle = `rgba(200,210,230,${0.15 + layerFrac * 0.1})`;
      ctx.fill();
    }
  }
}

function drawCabin(t) {
  const groundY = H * 0.62;
  const cabinRgb = hexToRgb(CONFIG.cabinColor);
  const cx = W * 0.72;
  const cabinW = W * 0.08;
  const cabinH = H * 0.08;
  const baseY = groundY + Math.sin(0.72 * 5) * 8;
  const roofPeak = baseY - cabinH - cabinH * 0.45;

  // Cabin body
  ctx.fillStyle = CONFIG.cabinColor;
  ctx.fillRect(cx - cabinW / 2, baseY - cabinH, cabinW, cabinH);

  // Darker logs
  ctx.strokeStyle = `rgba(${Math.max(0, cabinRgb.r - 10)},${Math.max(0, cabinRgb.g - 8)},${Math.max(0, cabinRgb.b - 4)},0.5)`;
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const ly = baseY - cabinH + i * cabinH / 6;
    ctx.beginPath();
    ctx.moveTo(cx - cabinW / 2, ly);
    ctx.lineTo(cx + cabinW / 2, ly);
    ctx.stroke();
  }

  // Roof
  ctx.beginPath();
  ctx.moveTo(cx - cabinW * 0.65, baseY - cabinH);
  ctx.lineTo(cx, roofPeak);
  ctx.lineTo(cx + cabinW * 0.65, baseY - cabinH);
  ctx.closePath();
  ctx.fillStyle = `rgb(${Math.floor(cabinRgb.r * 0.6)},${Math.floor(cabinRgb.g * 0.5)},${Math.floor(cabinRgb.b * 0.4)})`;
  ctx.fill();

  // Snow on roof
  ctx.beginPath();
  ctx.moveTo(cx - cabinW * 0.68, baseY - cabinH + 2);
  ctx.quadraticCurveTo(cx - cabinW * 0.3, baseY - cabinH - 3, cx, roofPeak - 2);
  ctx.quadraticCurveTo(cx + cabinW * 0.3, baseY - cabinH - 3, cx + cabinW * 0.68, baseY - cabinH + 2);
  ctx.lineTo(cx + cabinW * 0.65, baseY - cabinH);
  ctx.lineTo(cx, roofPeak);
  ctx.lineTo(cx - cabinW * 0.65, baseY - cabinH);
  ctx.closePath();
  ctx.fillStyle = 'rgba(220,230,245,0.7)';
  ctx.fill();

  // Windows with warm glow
  const winW = cabinW * 0.2;
  const winH = cabinH * 0.3;
  const winY = baseY - cabinH * 0.7;
  const windows = [cx - cabinW * 0.22, cx + cabinW * 0.08];

  for (const wx of windows) {
    // Window frame
    ctx.fillStyle = `rgb(${Math.floor(cabinRgb.r * 0.4)},${Math.floor(cabinRgb.g * 0.3)},${Math.floor(cabinRgb.b * 0.3)})`;
    ctx.fillRect(wx - 1, winY - 1, winW + 2, winH + 2);

    // Warm light
    const flickerA = 0.75 + 0.15 * Math.sin(t * 0.003 + wx);
    const flickerB = 0.85 + 0.1 * Math.sin(t * 0.005 + wx * 2);
    const warmGrad = ctx.createRadialGradient(wx + winW / 2, winY + winH / 2, 0, wx + winW / 2, winY + winH / 2, winW);
    warmGrad.addColorStop(0, `rgba(255,200,100,${flickerA})`);
    warmGrad.addColorStop(0.5, `rgba(240,170,60,${flickerB * 0.8})`);
    warmGrad.addColorStop(1, `rgba(200,130,40,0.5)`);
    ctx.fillStyle = warmGrad;
    ctx.fillRect(wx, winY, winW, winH);

    // Cross pane
    ctx.strokeStyle = `rgba(${cabinRgb.r},${cabinRgb.g},${cabinRgb.b},0.7)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wx + winW / 2, winY);
    ctx.lineTo(wx + winW / 2, winY + winH);
    ctx.moveTo(wx, winY + winH / 2);
    ctx.lineTo(wx + winW, winY + winH / 2);
    ctx.stroke();

    // Light glow outside
    const outerGlow = ctx.createRadialGradient(wx + winW / 2, winY + winH / 2, 0, wx + winW / 2, winY + winH / 2, cabinW * 0.8);
    outerGlow.addColorStop(0, `rgba(255,190,80,${0.08 * flickerA})`);
    outerGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(wx + winW / 2, winY + winH / 2, cabinW * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Door
  ctx.fillStyle = `rgb(${Math.floor(cabinRgb.r * 0.7)},${Math.floor(cabinRgb.g * 0.5)},${Math.floor(cabinRgb.b * 0.4)})`;
  ctx.fillRect(cx - cabinW * 0.08, baseY - cabinH * 0.45, cabinW * 0.16, cabinH * 0.45);

  // Chimney
  const chimneyX = cx + cabinW * 0.2;
  const chimneyW = cabinW * 0.12;
  const chimneyTop = roofPeak + cabinH * 0.08;
  ctx.fillStyle = `rgb(${Math.floor(cabinRgb.r * 0.5)},${Math.floor(cabinRgb.g * 0.4)},${Math.floor(cabinRgb.b * 0.35)})`;
  ctx.fillRect(chimneyX - chimneyW / 2, chimneyTop, chimneyW, baseY - cabinH * 0.8 - chimneyTop);

  // Snow on chimney
  ctx.fillStyle = 'rgba(220,230,245,0.6)';
  ctx.fillRect(chimneyX - chimneyW * 0.7, chimneyTop - 2, chimneyW * 1.4, 4);

  // Snow on ground near cabin
  ctx.beginPath();
  ctx.ellipse(cx, baseY + 3, cabinW * 0.8, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(210,220,235,0.4)';
  ctx.fill();

  return { chimneyX, chimneyTop };
}

function updateSmoke(t, dt, chimneyX, chimneyTop) {
  // Spawn
  if (smokeParticles.length < maxSmoke && Math.random() < 0.15) {
    smokeParticles.push({
      x: chimneyX + (Math.random() - 0.5) * 4,
      y: chimneyTop - 2,
      vx: (Math.random() - 0.5) * 0.3 + 0.15,
      vy: -0.4 - Math.random() * 0.3,
      size: 3 + Math.random() * 3,
      alpha: 0.35 + Math.random() * 0.15,
      life: 0,
      maxLife: 3 + Math.random() * 3
    });
  }

  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.life += dt * 0.001;
    if (p.life > p.maxLife) {
      smokeParticles.splice(i, 1);
      continue;
    }
    const lifeFrac = p.life / p.maxLife;
    p.x += p.vx * dt * 0.06;
    p.y += p.vy * dt * 0.06;
    p.vx += (Math.random() - 0.48) * 0.02;
    p.vy -= 0.002;
    p.size += dt * 0.004;

    const alpha = p.alpha * Math.sin(lifeFrac * Math.PI) * (1 - lifeFrac * 0.3);
    const gray = 160 + lifeFrac * 60;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${gray},${gray},${gray + 10},${alpha})`;
    ctx.fill();
  }
}

function drawSnow(t, dt) {
  for (const s of snowflakes) {
    s.y += s.speedY * dt * 0.06;
    s.x += s.speedX * dt * 0.06 + Math.sin(t * 0.001 * s.wobbleSpeed + s.wobble) * 0.0003 * dt;

    if (s.y > 1.05) { s.y = -0.02; s.x = Math.random(); }
    if (s.x < -0.02) s.x = 1.02;
    if (s.x > 1.02) s.x = -0.02;

    const sx = s.x * W;
    const sy = s.y * H;

    // Depth-based alpha (closer = bigger and more opaque)
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fill();

    // Subtle glow on larger flakes
    if (s.r > 1.8) {
      ctx.beginPath();
      ctx.arc(sx, sy, s.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,230,255,${s.alpha * 0.1})`;
      ctx.fill();
    }
  }
}

function drawShootingStar(t) {
  const cyclePos = (t % CONFIG.cycleDuration) / CONFIG.cycleDuration;

  // Trigger shooting star at specific cycle positions
  if (!shootingStar && t - lastShootingStar > 4000) {
    if ((cyclePos > 0.2 && cyclePos < 0.22) || (cyclePos > 0.6 && cyclePos < 0.62) || (cyclePos > 0.85 && cyclePos < 0.87)) {
      const startX = Math.random() * W * 0.6 + W * 0.2;
      const startY = Math.random() * H * 0.15 + H * 0.02;
      shootingStar = {
        x: startX, y: startY,
        vx: (3 + Math.random() * 4) * (Math.random() > 0.5 ? 1 : -1),
        vy: 2 + Math.random() * 2,
        life: 0,
        maxLife: 0.6 + Math.random() * 0.4,
        trail: []
      };
      lastShootingStar = t;
    }
  }

  if (!shootingStar) return;

  shootingStar.life += 0.016;
  shootingStar.x += shootingStar.vx;
  shootingStar.y += shootingStar.vy;

  shootingStar.trail.unshift({ x: shootingStar.x, y: shootingStar.y });
  if (shootingStar.trail.length > 25) shootingStar.trail.pop();

  const lifeFrac = shootingStar.life / shootingStar.maxLife;
  const mainAlpha = lifeFrac < 0.2 ? lifeFrac / 0.2 : Math.max(0, 1 - (lifeFrac - 0.5) / 0.5);

  // Draw trail
  for (let i = 0; i < shootingStar.trail.length; i++) {
    const tp = shootingStar.trail[i];
    const trailFrac = i / shootingStar.trail.length;
    const ta = mainAlpha * (1 - trailFrac) * 0.6;
    const tr = (1 - trailFrac) * 2;
    ctx.beginPath();
    ctx.arc(tp.x, tp.y, tr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,240,${ta})`;
    ctx.fill();
  }

  // Head
  ctx.beginPath();
  ctx.arc(shootingStar.x, shootingStar.y, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,${mainAlpha})`;
  ctx.fill();

  if (shootingStar.life > shootingStar.maxLife) {
    shootingStar = null;
  }
}

let prevTime = performance.now();
function animate(now) {
  const t = now - startTime;
  const dt = now - prevTime;
  prevTime = now;

  if (t >= CONFIG.cycleDuration) {
    startTime = now;
  }

  // Clear
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  drawSky(now);
  drawStars(now);
  drawAurora(now);
  drawShootingStar(now);
  drawGround(now);
  drawTrees(now);
  const cabin = drawCabin(now);
  updateSmoke(now, dt, cabin.chimneyX, cabin.chimneyTop);
  drawSnow(now, dt);

  requestAnimationFrame(animate);
}

window.addEventListener('message', (e) => {
  if (e.data && typeof e.data === 'object') {
    const prevSnow = CONFIG.snowIntensity;
    const prevStars = CONFIG.starCount;
    Object.assign(CONFIG, e.data);
    if (CONFIG.snowIntensity !== prevSnow) initSnow();
    if (CONFIG.starCount !== prevStars) initStars();
    if (e.data.auroraColors) initAurora();
  }
});

requestAnimationFrame(animate);
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comic Boom - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #fff9e6; font-family: 'Impact', 'Arial Black', sans-serif; position: relative; }
  body::before { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.06;
    background-image: radial-gradient(circle, #000 1px, transparent 1px);
    background-size: 4px 4px; }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .word-inner { display: inline-block; padding: 6px 14px; position: relative; }
  .burst { position: absolute; pointer-events: none; z-index: 1; }
  .speed-line { position: absolute; height: 3px; pointer-events: none; z-index: 1; border-radius: 2px; }

  @keyframes boomIn { 0% { opacity: 0; transform: translate(-50%,-50%) scale(3) rotate(-8deg); } 40% { opacity: 1; transform: translate(-50%,-50%) scale(0.9) rotate(2deg); } 60% { transform: translate(-50%,-50%) scale(1.05) rotate(-1deg); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); } }
  @keyframes boomOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.4) rotate(5deg); filter: blur(3px); } }
  @keyframes burstPop { 0% { transform: scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1); opacity: 0.15; } }
  @keyframes speedDash { 0% { width: 0; opacity: 0; } 30% { opacity: 0.6; } 100% { width: var(--sw); opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['POW!','SMASH','BOOM','WHAM','CRACK','ZAP!','BANG','KAPOW'],
  bgColor: '#fff9e6',
  fontFamily: "'Impact', 'Arial Black', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const comicColors = [
  { bg: '#ff1744', text: '#fff', stroke: '#b71c1c' },
  { bg: '#ffea00', text: '#000', stroke: '#f57f17' },
  { bg: '#00e5ff', text: '#000', stroke: '#006064' },
  { bg: '#ff6d00', text: '#fff', stroke: '#bf360c' },
  { bg: '#76ff03', text: '#000', stroke: '#33691e' },
  { bg: '#d500f9', text: '#fff', stroke: '#6a1b9a' },
  { bg: '#ff1744', text: '#fff', stroke: '#b71c1c' },
  { bg: '#ffea00', text: '#000', stroke: '#f57f17' },
];

function spawnSpeedLines(x, y) {
  for (let i = 0; i < 4; i++) {
    const line = document.createElement('div'); line.className = 'speed-line';
    const angle = Math.random() * 360;
    const dist = 30 + Math.random() * 40;
    const lx = x + Math.cos(angle * Math.PI/180) * dist;
    const ly = y + Math.sin(angle * Math.PI/180) * dist;
    line.style.cssText = `left:${lx}px;top:${ly}px;background:#000;transform:rotate(${angle}deg);--sw:${30+Math.random()*30}px;animation:speedDash ${300+Math.random()*200}ms ease-out forwards;`;
    document.body.appendChild(line);
    setTimeout(() => line.remove(), 600);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 73 + 19);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(42 + rng() * 30, cellW * 0.38, cellH * 0.5);
    const scheme = comicColors[i % comicColors.length];
    const rot = (rng() - 0.5) * 12;
    const el = document.createElement('div'); el.className = 'word-block';
    const inner = document.createElement('div'); inner.className = 'word-inner';
    inner.textContent = word;
    inner.style.cssText = `background:${scheme.bg};color:${scheme.text};border:4px solid #000;border-radius:6px;transform:rotate(${rot}deg);-webkit-text-stroke:1px ${scheme.stroke};`;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    el.appendChild(inner); stage.appendChild(el); els.push({ el, x: col*cellW+cellW/2, y: row*cellH+cellH/2 });
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=320, inD=500, hold=3000, outS=200, outD=400, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.el.style.animation='none';e.el.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((item,i)=>{if(e>=i*inS&&!item.el.dataset.i){item.el.dataset.i='1';item.el.style.animation=`boomIn ${inD}ms cubic-bezier(0.2,0.6,0.3,1) forwards`;spawnSpeedLines(item.x,item.y);}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((item,i)=>{if(oe>=i*outS&&!item.el.dataset.o){item.el.dataset.o='1';item.el.style.animation=`boomOut ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(item=>{delete item.el.dataset.i;delete item.el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .scanlines { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.04;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px); }
  .center-text { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; pointer-events: none; }
  .center-text h1 { font-size: 58px; font-weight: 900; letter-spacing: 8px; text-transform: uppercase;
    animation: neonPulse 3s ease-in-out infinite; }
  .center-text .subtitle { font-size: 14px; letter-spacing: 8px; margin-top: 8px; text-transform: uppercase; opacity: 0.6; }
  @keyframes neonPulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scanlines"></div>
<div class="center-text">
  <h1 id="titleEl">OUTRUN</h1>
  <div class="subtitle" id="subEl">Retro Future</div>
</div>
<script>
const CONFIG = {
  titleText: 'OUTRUN',
  subtitleText: 'Retro Future',
  gridColor: '#FF1493',
  sunColor: '#FF6347',
  horizonColor: '#00CED1',
  bgColor: '#0a0020',
  gridSpeed: 0.8,
  starCount: 80,
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});

function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
  const h1 = document.getElementById('titleEl');
  h1.style.color = CONFIG.gridColor;
  h1.style.textShadow = `0 0 20px ${CONFIG.gridColor}, 0 0 60px ${CONFIG.gridColor}80, 0 0 100px ${CONFIG.gridColor}40`;
  document.getElementById('subEl').style.color = CONFIG.horizonColor;
  document.getElementById('subEl').style.textShadow = `0 0 15px ${CONFIG.horizonColor}60`;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({ x: Math.random() * 2000, y: Math.random() * 0.5, r: Math.random() * 1.5 + 0.3,
    phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.01 + 0.003 });
}

let gridOffset = 0;

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  g.addColorStop(0, CONFIG.bgColor);
  g.addColorStop(0.7, '#150030');
  g.addColorStop(1, '#2a0040');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.55);
}

function drawSun(t) {
  const sc = hexRgb(CONFIG.sunColor);
  const cx = W * 0.5, cy = H * 0.45;
  const r = Math.min(W, H) * 0.12;
  // Glow
  const glow = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 2.5);
  glow.addColorStop(0, `rgba(${sc[0]},${sc[1]},${sc[2]},0.15)`);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H * 0.55);
  // Sun body with horizontal stripe cutouts
  const grad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
  grad.addColorStop(0, CONFIG.sunColor);
  grad.addColorStop(0.5, CONFIG.gridColor);
  grad.addColorStop(1, '#FFD700');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  // Horizontal line cutouts
  ctx.fillStyle = CONFIG.bgColor;
  for (let i = 0; i < 6; i++) {
    const ly = cy + r * 0.1 + i * r * 0.15;
    const h = 2 + i * 1.5;
    if (ly - h < cy + r && ly + h > cy - r) {
      ctx.fillRect(cx - r - 5, ly, r * 2 + 10, h);
    }
  }
}

function drawGrid(t) {
  const horizonY = H * 0.55;
  const gc = hexRgb(CONFIG.gridColor);
  const hc = hexRgb(CONFIG.horizonColor);
  // Ground gradient
  const ground = ctx.createLinearGradient(0, horizonY, 0, H);
  ground.addColorStop(0, '#1a0030');
  ground.addColorStop(1, CONFIG.bgColor);
  ctx.fillStyle = ground;
  ctx.fillRect(0, horizonY, W, H - horizonY);
  // Horizon glow line
  const hGlow = ctx.createLinearGradient(0, horizonY - 3, 0, horizonY + 3);
  hGlow.addColorStop(0, 'transparent');
  hGlow.addColorStop(0.5, `rgba(${hc[0]},${hc[1]},${hc[2]},0.5)`);
  hGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = hGlow;
  ctx.fillRect(0, horizonY - 3, W, 6);
  // Perspective grid - horizontal lines
  gridOffset = (gridOffset + CONFIG.gridSpeed) % 40;
  const lineCount = 20;
  for (let i = 0; i < lineCount; i++) {
    const t2 = (i * 40 + gridOffset) / (lineCount * 40);
    const y = horizonY + Math.pow(t2, 1.5) * (H - horizonY);
    const a = 0.05 + t2 * 0.2;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.strokeStyle = `rgba(${gc[0]},${gc[1]},${gc[2]},${a})`;
    ctx.lineWidth = 0.5 + t2; ctx.stroke();
  }
  // Vertical perspective lines
  const vanishX = W * 0.5;
  const vertCount = 16;
  for (let i = 0; i <= vertCount; i++) {
    const bottomX = (i / vertCount) * W;
    const a = 0.08 + 0.08 * (1 - Math.abs(i / vertCount - 0.5) * 2);
    ctx.beginPath();
    ctx.moveTo(vanishX, horizonY);
    ctx.lineTo(bottomX, H);
    ctx.strokeStyle = `rgba(${gc[0]},${gc[1]},${gc[2]},${a})`;
    ctx.lineWidth = 0.8; ctx.stroke();
  }
}

function drawStars(t) {
  stars.forEach(s => {
    s.phase += s.speed;
    const a = 0.2 + 0.3 * Math.abs(Math.sin(s.phase));
    ctx.beginPath(); ctx.arc(s.x % W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
  });
}

// Floating grid particles
const gridParts = [];
for (let i = 0; i < 30; i++) {
  gridParts.push({
    x: Math.random() * W, y: H * (0.55 + Math.random() * 0.4),
    size: Math.random() * 2 + 0.5, speed: Math.random() * 0.5 + 0.2,
    phase: Math.random() * Math.PI * 2,
  });
}

function drawGridParticles(t) {
  const gc = hexRgb(CONFIG.gridColor);
  gridParts.forEach(p => {
    p.y += p.speed;
    p.phase += 0.02;
    if (p.y > H) { p.y = H * 0.55; p.x = Math.random() * W; }
    const a = 0.1 + 0.1 * Math.sin(p.phase);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${gc[0]},${gc[1]},${gc[2]},${a})`; ctx.fill();
  });
}

function animate(t) {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);
  drawSky();
  drawStars(t);
  drawSun(t);
  drawGrid(t);
  drawGridParticles(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paper Cut - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  /* Subtle paper grain overlay */
  #grain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 800;
    opacity: 0.08;
  }

  /* Soft vignette for paper edges */
  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 801;
    background: radial-gradient(
      ellipse at center,
      transparent 50%,
      rgba(180, 160, 130, 0.15) 80%,
      rgba(140, 120, 90, 0.3) 100%
    );
  }

  .paper-strip {
    position: relative;
    display: inline-block;
    padding: 12px 36px;
    font-size: clamp(28px, 5vw, 64px);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    text-transform: uppercase;
    white-space: nowrap;
    will-change: transform, opacity;
    perspective: 800px;
    transform-style: preserve-3d;
    cursor: default;
    /* default hidden state */
    opacity: 0;
    transition: none;
  }

  .paper-strip .inner {
    display: block;
    position: relative;
    padding: 2px 0;
    transform-style: preserve-3d;
  }

  /* Paper fiber texture via pseudo-element */
  .paper-strip::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 2px;
    opacity: 0.12;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.08) 2px,
        rgba(255,255,255,0.08) 4px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.03) 3px,
        rgba(0,0,0,0.03) 6px
      );
    pointer-events: none;
    z-index: 1;
  }

  /* Highlight edge for paper cut illusion */
  .paper-strip::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,0.4) 20%,
      rgba(255,255,255,0.5) 50%,
      rgba(255,255,255,0.4) 80%,
      transparent 100%
    );
    border-radius: 2px 2px 0 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Slide-in directions */
  .slide-from-left  { transform: translateX(-120vw) rotate(0deg); }
  .slide-from-right { transform: translateX(120vw) rotate(0deg); }
  .slide-from-top   { transform: translateY(-120vh) rotate(0deg); }
  .slide-from-bottom { transform: translateY(120vh) rotate(0deg); }

  .slide-in {
    opacity: 1;
    transform: translateX(0) translateY(0);
  }

  /* Fold-and-fly-away animation */
  @keyframes foldAway {
    0% {
      transform: perspective(800px) rotateX(0deg) rotateY(0deg) scale(1) translateY(0);
      opacity: 1;
    }
    30% {
      transform: perspective(800px) rotateX(45deg) rotateY(-15deg) scale(0.85) translateY(-20px);
      opacity: 1;
    }
    60% {
      transform: perspective(800px) rotateX(90deg) rotateY(25deg) scale(0.5) translateY(-80px);
      opacity: 0.7;
    }
    100% {
      transform: perspective(800px) rotateX(140deg) rotateY(-40deg) scale(0.15) translateY(-250px);
      opacity: 0;
    }
  }

  .fold-away {
    animation-name: foldAway;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(0.4, 0, 0.7, 1);
  }

  /* Decorative paper scraps floating in background */
  .paper-scrap {
    position: absolute;
    border-radius: 1px;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    transition: opacity 0.8s ease;
  }

  .paper-scrap.visible {
    opacity: 1;
  }

  @keyframes floatScrap {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-12px) rotate(3deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="grain"></canvas>
<div id="vignette"></div>

<script>
const CONFIG = {
  words: ['CREATE', 'SOMETHING', 'BEAUTIFUL', 'EVERY', 'SINGLE', 'DAY'],
  colors: ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6', '#1ABC9C'],
  bgColor: '#FDF6E3',
  shadowDepth: 6,
  slideSpeed: 600,
  slideStagger: 300,
  cycleDuration: 10000,
  foldDuration: 800,
};

const DIRECTIONS = ['left', 'right', 'top', 'bottom'];
const ROTATIONS = [-2.5, 1.8, -1.2, 2.0, -1.6, 0.8];

let strips = [];
let scraps = [];
let animating = false;

/* ---- Paper Grain Texture (canvas noise) ---- */
function generateGrain() {
  const canvas = document.getElementById('grain');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const imageData = ctx.createImageData(canvas.width, canvas.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255;
    data[i] = v;
    data[i + 1] = v;
    data[i + 2] = v;
    data[i + 3] = 25;
  }
  ctx.putImageData(imageData, 0, 0);
}

/* ---- Build layered box-shadow string ---- */
function buildPaperShadow(depth, baseColor) {
  const layers = [];
  for (let i = 1; i <= depth; i++) {
    const ox = i * 1.2;
    const oy = i * 1.5;
    const blur = i * 0.5;
    const alpha = 0.15 - (i * 0.015);
    layers.push(`${ox}px ${oy}px ${blur}px rgba(60, 40, 20, ${Math.max(alpha, 0.03)})`);
  }
  // Bottom edge shadow for 3D cutout feel
  layers.push(`0 ${depth + 2}px ${depth}px rgba(60, 40, 20, 0.1)`);
  // Inner light on top-left for bevel
  layers.push(`inset 1px 1px 0 rgba(255, 255, 255, 0.2)`);
  // Inner dark on bottom-right for bevel
  layers.push(`inset -1px -1px 0 rgba(0, 0, 0, 0.08)`);
  return layers.join(', ');
}

/* ---- Darken a hex color ---- */
function darkenColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, r - amount);
  g = Math.max(0, g - amount);
  b = Math.max(0, b - amount);
  return `rgb(${r}, ${g}, ${b})`;
}

/* ---- Lighten a hex color ---- */
function lightenColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.min(255, r + amount);
  g = Math.min(255, g + amount);
  b = Math.min(255, b + amount);
  return `rgb(${r}, ${g}, ${b})`;
}

/* ---- Create decorative background scraps ---- */
function createScraps() {
  const stage = document.getElementById('stage');
  // Remove old scraps
  scraps.forEach(s => s.remove());
  scraps = [];

  const count = 12;
  for (let i = 0; i < count; i++) {
    const scrap = document.createElement('div');
    scrap.className = 'paper-scrap';
    const color = CONFIG.colors[i % CONFIG.colors.length];
    const w = 20 + Math.random() * 60;
    const h = 8 + Math.random() * 20;
    const x = Math.random() * 90 + 5;
    const y = Math.random() * 85 + 5;
    const rot = (Math.random() - 0.5) * 40;
    const dur = 3 + Math.random() * 3;

    scrap.style.cssText = `
      left: ${x}%;
      top: ${y}%;
      width: ${w}px;
      height: ${h}px;
      background: ${lightenColor(color, 60)};
      transform: rotate(${rot}deg);
      box-shadow: ${buildPaperShadow(3, color)};
      animation: floatScrap ${dur}s ease-in-out infinite;
      animation-delay: ${Math.random() * 2}s;
    `;

    stage.appendChild(scrap);
    scraps.push(scrap);
  }
}

/* ---- Create paper strip elements ---- */
function createStrips() {
  const stage = document.getElementById('stage');
  // Clear old strips
  strips.forEach(s => s.el.remove());
  strips = [];

  CONFIG.words.forEach((word, i) => {
    const el = document.createElement('div');
    el.className = 'paper-strip';

    const color = CONFIG.colors[i % CONFIG.colors.length];
    const rotation = ROTATIONS[i % ROTATIONS.length];
    const direction = DIRECTIONS[i % DIRECTIONS.length];

    // Layered paper background with subtle gradient for depth
    const bgGradient = `linear-gradient(
      135deg,
      ${lightenColor(color, 20)} 0%,
      ${color} 40%,
      ${darkenColor(color, 15)} 100%
    )`;

    el.style.background = bgGradient;
    el.style.boxShadow = buildPaperShadow(CONFIG.shadowDepth, color);
    el.style.borderRadius = '2px';
    el.style.zIndex = 10 + i;

    // Store target rotation
    el.dataset.rotation = rotation;
    el.dataset.direction = direction;
    el.dataset.index = i;

    const inner = document.createElement('span');
    inner.className = 'inner';
    inner.textContent = word;
    // Slight text shadow for embossed feel
    inner.style.textShadow = `
      1px 1px 0 rgba(0,0,0,0.15),
      -0.5px -0.5px 0 rgba(255,255,255,0.2)
    `;
    inner.style.position = 'relative';
    inner.style.zIndex = '3';
    el.appendChild(inner);

    stage.appendChild(el);
    strips.push({ el, color, rotation, direction, index: i });
  });
}

/* ---- Set strip to its start position ---- */
function setStartPosition(strip) {
  const { el, direction } = strip;
  el.style.transition = 'none';
  el.style.opacity = '0';
  el.classList.remove('slide-in', 'fold-away');

  switch (direction) {
    case 'left':
      el.style.transform = `translateX(-120vw) rotate(0deg)`;
      break;
    case 'right':
      el.style.transform = `translateX(120vw) rotate(0deg)`;
      break;
    case 'top':
      el.style.transform = `translateY(-120vh) rotate(0deg)`;
      break;
    case 'bottom':
      el.style.transform = `translateY(120vh) rotate(0deg)`;
      break;
  }
}

/* ---- Slide a strip into place ---- */
function slideIn(strip) {
  return new Promise(resolve => {
    const { el, rotation } = strip;
    // Force reflow
    void el.offsetWidth;

    el.style.transition = `
      transform ${CONFIG.slideSpeed}ms cubic-bezier(0.22, 1, 0.36, 1),
      opacity ${CONFIG.slideSpeed * 0.4}ms ease-out
    `;
    el.style.opacity = '1';
    el.style.transform = `translateX(0) translateY(0) rotate(${rotation}deg)`;

    setTimeout(resolve, CONFIG.slideSpeed);
  });
}

/* ---- Fold a strip away (origami exit) ---- */
function foldAway(strip, delay) {
  return new Promise(resolve => {
    const { el, rotation } = strip;
    const dir = Math.random() > 0.5 ? 1 : -1;

    el.style.transition = 'none';
    el.style.animationDuration = `${CONFIG.foldDuration}ms`;
    el.style.animationDelay = `${delay}ms`;

    // Custom fold keyframes per strip for variety
    const foldAngleX = 100 + Math.random() * 60;
    const foldAngleY = (20 + Math.random() * 30) * dir;
    const flyY = 200 + Math.random() * 150;

    el.style.setProperty('--fold-x', `${foldAngleX}deg`);
    el.style.setProperty('--fold-y', `${foldAngleY}deg`);
    el.style.setProperty('--fly-y', `-${flyY}px`);

    el.classList.add('fold-away');

    setTimeout(resolve, CONFIG.foldDuration + delay);
  });
}

/* ---- Show scraps with stagger ---- */
function showScraps() {
  scraps.forEach((scrap, i) => {
    setTimeout(() => {
      scrap.classList.add('visible');
    }, i * 80);
  });
}

/* ---- Hide scraps ---- */
function hideScraps() {
  scraps.forEach(scrap => {
    scrap.classList.remove('visible');
  });
}

/* ---- Run one full animation cycle ---- */
async function runCycle() {
  if (animating) return;
  animating = true;

  // Reset all strips to start positions
  strips.forEach(strip => setStartPosition(strip));
  hideScraps();

  // Small initial delay
  await wait(300);

  // Show background scraps
  showScraps();

  // Slide each strip in with stagger
  for (let i = 0; i < strips.length; i++) {
    await wait(i === 0 ? 0 : CONFIG.slideStagger);
    slideIn(strips[i]);
  }

  // Wait for all slides to finish, then hold
  const totalSlideTime = CONFIG.slideSpeed + (strips.length - 1) * CONFIG.slideStagger;
  const holdTime = CONFIG.cycleDuration - totalSlideTime - (CONFIG.foldDuration + strips.length * 100) - 600;
  await wait(Math.max(holdTime, 1500));

  // Fold-away exit: stagger from center outward
  const mid = Math.floor(strips.length / 2);
  const foldOrder = [];
  for (let offset = 0; offset <= mid; offset++) {
    if (mid - offset >= 0 && mid - offset < strips.length) {
      foldOrder.push(strips[mid - offset]);
    }
    if (offset !== 0 && mid + offset < strips.length) {
      foldOrder.push(strips[mid + offset]);
    }
  }

  const foldPromises = foldOrder.map((strip, i) => foldAway(strip, i * 100));
  await Promise.all(foldPromises);

  hideScraps();
  await wait(400);

  animating = false;
}

/* ---- Utility: promisified setTimeout ---- */
function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ---- Init ---- */
function init() {
  document.body.style.background = CONFIG.bgColor;
  generateGrain();
  createScraps();
  createStrips();

  // Start animation loop
  async function loop() {
    while (true) {
      await runCycle();
      await wait(200);
    }
  }
  loop();
}

// Handle window resize
window.addEventListener('resize', () => {
  generateGrain();
});

// Start when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>

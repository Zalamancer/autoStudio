<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Sweep</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0f0a; font-family: 'Courier New', monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  title: 'SECTOR ALPHA-7',
  rangeMax: 200,
  blipCount: 12,
  sweepSpeed: 1.2,
  accentColor: '#00ff44',
  bgColor: '#0a0f0a',
  cycleDuration: 10000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius, time = 0, sweepAngle = 0;
let blips = [];
let statusLines = [];
let targetLock = null;
let targetLockTimer = 0;
let cycleStart = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  cx = W * 0.42;
  cy = H * 0.5;
  radius = Math.min(W * 0.35, H * 0.42);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function initBlips() {
  blips = [];
  for (let i = 0; i < CONFIG.blipCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 0.15 + Math.random() * 0.8;
    blips.push({
      angle,
      dist,
      brightness: 0,
      size: 2 + Math.random() * 4,
      label: String.fromCharCode(65 + Math.floor(Math.random() * 26)) + '-' + Math.floor(Math.random() * 999).toString().padStart(3, '0'),
      speed: (Math.random() - 0.5) * 0.002,
      drift: (Math.random() - 0.5) * 0.001
    });
  }
}

function initStatusLines() {
  statusLines = [
    'SYS ONLINE',
    'FREQ: 2.4 GHz',
    'MODE: SEARCH',
    'GAIN: AUTO',
    'FILTER: MTI',
    'PWR: 850W',
    'PRF: 1200 Hz',
    'RANGE: ' + CONFIG.rangeMax + ' NM',
    'TARGETS: ' + CONFIG.blipCount,
    'STATUS: NOMINAL'
  ];
}

function reset() {
  sweepAngle = 0;
  targetLock = null;
  targetLockTimer = 0;
  initBlips();
  initStatusLines();
  cycleStart = performance.now();
}

function drawBackground() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);
}

function drawRadarCircle() {
  const c = hexToRgb(CONFIG.accentColor);

  // Outer glow
  const glowGrad = ctx.createRadialGradient(cx, cy, radius * 0.95, cx, cy, radius * 1.05);
  glowGrad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0.15)`);
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.05, 0, Math.PI * 2);
  ctx.fill();

  // Range rings
  for (let i = 1; i <= 4; i++) {
    const r = (radius / 4) * i;
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${i === 4 ? 0.4 : 0.15})`;
    ctx.lineWidth = i === 4 ? 2 : 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // Range labels
    const rangeVal = Math.round((CONFIG.rangeMax / 4) * i);
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
    ctx.font = `${Math.round(H * 0.016)}px Courier New`;
    ctx.textAlign = 'left';
    ctx.fillText(rangeVal + ' NM', cx + r + 5, cy - 5);
  }

  // Crosshairs
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.1)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - radius, cy);
  ctx.lineTo(cx + radius, cy);
  ctx.moveTo(cx, cy - radius);
  ctx.lineTo(cx, cy + radius);
  ctx.stroke();

  // Diagonal crosshairs
  const d = radius * 0.707;
  ctx.beginPath();
  ctx.moveTo(cx - d, cy - d);
  ctx.lineTo(cx + d, cy + d);
  ctx.moveTo(cx + d, cy - d);
  ctx.lineTo(cx - d, cy + d);
  ctx.stroke();

  // Compass labels
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const fontSize = Math.round(H * 0.022);
  ctx.font = `bold ${fontSize}px Courier New`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  dirs.forEach((dir, i) => {
    const a = (i * Math.PI * 2) / 8 - Math.PI / 2;
    const labelR = radius + fontSize * 1.2;
    const lx = cx + Math.cos(a) * labelR;
    const ly = cy + Math.sin(a) * labelR;
    ctx.fillStyle = dir.length === 1
      ? `rgba(${c.r},${c.g},${c.b},0.9)`
      : `rgba(${c.r},${c.g},${c.b},0.4)`;
    ctx.fillText(dir, lx, ly);
  });

  // Center dot
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.8)`;
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawSweepLine(dt) {
  const c = hexToRgb(CONFIG.accentColor);
  sweepAngle += CONFIG.sweepSpeed * dt * 0.001;
  if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;

  const a = sweepAngle - Math.PI / 2;

  // Sweep trail (gradient arc)
  const trailAngle = 0.5;
  const grad = ctx.createConicGradient(a - trailAngle, cx, cy);
  const steps = 20;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const alpha = t * 0.15;
    grad.addColorStop(t * (trailAngle / (Math.PI * 2)), `rgba(${c.r},${c.g},${c.b},${alpha})`);
  }
  grad.addColorStop(trailAngle / (Math.PI * 2), `rgba(${c.r},${c.g},${c.b},0.2)`);
  grad.addColorStop(trailAngle / (Math.PI * 2) + 0.001, 'transparent');
  grad.addColorStop(1, 'transparent');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, radius, a - trailAngle, a);
  ctx.closePath();
  ctx.fill();

  // Main sweep line
  const lineGrad = ctx.createLinearGradient(cx, cy, cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
  lineGrad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0.1)`);
  lineGrad.addColorStop(0.5, `rgba(${c.r},${c.g},${c.b},0.7)`);
  lineGrad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},1)`);

  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
  ctx.stroke();
}

function drawBlips(dt) {
  const c = hexToRgb(CONFIG.accentColor);
  const sweepA = sweepAngle - Math.PI / 2;

  blips.forEach((blip, idx) => {
    blip.angle += blip.speed * dt;
    blip.dist = Math.max(0.1, Math.min(0.9, blip.dist + blip.drift * dt));

    // Check if sweep just passed this blip
    let angleDiff = sweepA - blip.angle;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

    if (angleDiff >= 0 && angleDiff < 0.15) {
      blip.brightness = 1;
    }
    blip.brightness = Math.max(0, blip.brightness - 0.008 * dt);

    if (blip.brightness > 0.05) {
      const bx = cx + Math.cos(blip.angle) * (blip.dist * radius);
      const by = cy + Math.sin(blip.angle) * (blip.dist * radius);

      // Blip glow
      const glowR = blip.size * 4 * blip.brightness;
      const blipGrad = ctx.createRadialGradient(bx, by, 0, bx, by, glowR);
      blipGrad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${blip.brightness * 0.8})`);
      blipGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = blipGrad;
      ctx.beginPath();
      ctx.arc(bx, by, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Blip dot
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${blip.brightness})`;
      ctx.beginPath();
      ctx.arc(bx, by, blip.size * blip.brightness, 0, Math.PI * 2);
      ctx.fill();

      // Label
      if (blip.brightness > 0.4) {
        ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${blip.brightness * 0.7})`;
        ctx.font = `${Math.round(H * 0.013)}px Courier New`;
        ctx.textAlign = 'left';
        ctx.fillText(blip.label, bx + blip.size * 2, by - blip.size);
      }
    }

    // Select target lock (pick blip closest to center periodically)
    if (idx === 0 && !targetLock && time > 3) {
      targetLock = blip;
      targetLockTimer = 0;
    }
  });
}

function drawTargetLock(dt) {
  if (!targetLock) return;
  const c = hexToRgb(CONFIG.accentColor);
  targetLockTimer += dt * 0.001;

  const bx = cx + Math.cos(targetLock.angle) * (targetLock.dist * radius);
  const by = cy + Math.sin(targetLock.angle) * (targetLock.dist * radius);

  const progress = Math.min(1, targetLockTimer / 2);
  const ease = 1 - Math.pow(1 - progress, 3);
  const bracketSize = 30 * (2 - ease);
  const bracketLen = bracketSize * 0.4;
  const alpha = ease * (0.7 + 0.3 * Math.sin(time * 5));

  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
  ctx.lineWidth = 2;

  // Four corner brackets
  const offsets = [
    [-1, -1], [1, -1], [1, 1], [-1, 1]
  ];
  offsets.forEach(([dx, dy]) => {
    const ox = bx + dx * bracketSize;
    const oy = by + dy * bracketSize;
    ctx.beginPath();
    ctx.moveTo(ox, oy + dy * -bracketLen);
    ctx.lineTo(ox, oy);
    ctx.lineTo(ox + dx * -bracketLen, oy);
    ctx.stroke();
  });

  // Target info
  if (progress > 0.5) {
    const infoAlpha = (progress - 0.5) * 2;
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${infoAlpha * 0.9})`;
    ctx.font = `bold ${Math.round(H * 0.015)}px Courier New`;
    ctx.textAlign = 'left';
    const dist = Math.round(targetLock.dist * CONFIG.rangeMax);
    const bearing = Math.round(((targetLock.angle + Math.PI / 2) * 180 / Math.PI + 360) % 360);
    ctx.fillText('TGT: ' + targetLock.label, bx + bracketSize + 10, by - 8);
    ctx.font = `${Math.round(H * 0.012)}px Courier New`;
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${infoAlpha * 0.6})`;
    ctx.fillText(`RNG: ${dist} NM  BRG: ${bearing.toString().padStart(3, '0')}`, bx + bracketSize + 10, by + 10);
  }

  // Reset lock at end of visible cycle
  if (targetLockTimer > 5) {
    targetLock = null;
    targetLockTimer = 0;
  }
}

function drawStatusPanel() {
  const c = hexToRgb(CONFIG.accentColor);
  const panelX = W * 0.78;
  const panelY = H * 0.08;
  const panelW = W * 0.2;
  const panelH = H * 0.84;

  // Panel background
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.03)`;
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
  ctx.lineWidth = 1;
  ctx.strokeRect(panelX, panelY, panelW, panelH);

  // Title
  const titleSize = Math.round(H * 0.022);
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.9)`;
  ctx.font = `bold ${titleSize}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(CONFIG.title, panelX + panelW / 2, panelY + titleSize * 1.5);

  // Divider
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.2)`;
  ctx.beginPath();
  ctx.moveTo(panelX + 10, panelY + titleSize * 2.2);
  ctx.lineTo(panelX + panelW - 10, panelY + titleSize * 2.2);
  ctx.stroke();

  // Status lines
  const lineH = Math.round(H * 0.015);
  const startY = panelY + titleSize * 3;
  ctx.font = `${lineH}px Courier New`;
  ctx.textAlign = 'left';

  statusLines.forEach((line, i) => {
    const y = startY + i * lineH * 2;
    const flickerAlpha = 0.5 + 0.3 * Math.sin(time * 2 + i * 0.7);
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${flickerAlpha})`;
    ctx.fillText(line, panelX + 15, y);
  });

  // Scrolling data at bottom
  const scrollY = panelY + panelH - H * 0.15;
  ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.15)`;
  ctx.beginPath();
  ctx.moveTo(panelX + 10, scrollY - 10);
  ctx.lineTo(panelX + panelW - 10, scrollY - 10);
  ctx.stroke();

  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.5)`;
  ctx.font = `${Math.round(H * 0.012)}px Courier New`;
  const dataLines = [
    'AZ: ' + (sweepAngle * 180 / Math.PI % 360).toFixed(1).padStart(5, ' '),
    'EL: ' + (2.5 + Math.sin(time) * 0.5).toFixed(1),
    'CLT: ' + Math.floor(time * 100) % 1000,
    'SNR: ' + (18 + Math.sin(time * 1.3) * 3).toFixed(1) + ' dB',
    'MTI: ACTIVE',
    'IFF: STANDBY'
  ];
  dataLines.forEach((dl, i) => {
    ctx.fillText(dl, panelX + 15, scrollY + i * lineH * 1.6);
  });

  // Blinking cursor
  if (Math.floor(time * 2) % 2 === 0) {
    const cursorY = scrollY + dataLines.length * lineH * 1.6;
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.7)`;
    ctx.fillRect(panelX + 15, cursorY - lineH * 0.8, lineH * 0.6, lineH);
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

function drawTimestamp() {
  const c = hexToRgb(CONFIG.accentColor);
  const now = new Date();
  const ts = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
  ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.4)`;
  ctx.font = `${Math.round(H * 0.014)}px Courier New`;
  ctx.textAlign = 'left';
  ctx.fillText(ts, W * 0.02, H * 0.97);
}

let lastTime = 0;
function render(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  time += dt * 0.001;

  // Cycle reset
  const elapsed = timestamp - cycleStart;
  if (elapsed > CONFIG.cycleDuration) {
    reset();
    lastTime = timestamp;
  }

  drawBackground();
  drawRadarCircle();
  drawSweepLine(dt);
  drawBlips(dt);
  drawTargetLock(dt);
  drawStatusPanel();
  drawScanlines();
  drawTimestamp();

  requestAnimationFrame(render);
}

function runCycle() {
  reset();
  requestAnimationFrame(render);
}

resize();
window.addEventListener('resize', resize);

// Listen for CONFIG updates via postMessage
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'configUpdate' && e.data.config) {
    Object.assign(CONFIG, e.data.config);
    reset();
  }
});

runCycle();
</script>
</body>
</html>

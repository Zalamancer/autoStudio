<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapTiler Globe</title>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v2/maptiler-sdk.css" rel="stylesheet" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Source+Sans+3:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020408;
    color: #e0e8f0;
    font-family: 'Source Sans 3', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Space background with stars */
  #space-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse at center, #0a0e1a 0%, #020408 70%);
  }

  #map {
    width: 100vw;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* Header overlay */
  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(2,4,8,0.95) 0%, rgba(2,4,8,0.5) 70%, transparent 100%);
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  #header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #4fc3f7, #81d4fa, #b3e5fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #header .subtitle {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    color: rgba(79,195,247,0.6);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  #header .coords {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: #4fc3f7;
    letter-spacing: 2px;
    opacity: 0.7;
    text-align: right;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: opacity 0.4s ease;
  }

  .ctrl-btn {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(79,195,247,0.25);
    background: rgba(2,4,8,0.85);
    color: #81d4fa;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .ctrl-btn:hover {
    background: rgba(79,195,247,0.15);
    border-color: #4fc3f7;
    box-shadow: 0 0 10px rgba(79,195,247,0.2);
  }

  /* Loading screen */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #020408;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.6s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading h2 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 6px;
    color: #4fc3f7;
    text-transform: uppercase;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 2px solid rgba(79,195,247,0.15);
    border-top-color: #4fc3f7;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hide default MapTiler controls */
  .maplibregl-ctrl-top-left,
  .maplibregl-ctrl-top-right,
  .maplibregl-ctrl-bottom-left,
  .maplibregl-ctrl-bottom-right {
    display: none !important;
  }

  /* Atmosphere glow around globe */
  #atmosphere {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 110vmin;
    height: 110vmin;
    border-radius: 50%;
    background: radial-gradient(circle, transparent 40%, rgba(79,195,247,0.03) 50%, rgba(79,195,247,0.06) 55%, rgba(79,195,247,0.02) 60%, transparent 70%);
    pointer-events: none;
    z-index: 2;
  }

  /* Custom marker style */
  .globe-marker {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 12px rgba(0,0,0,0.4), 0 0 16px var(--marker-color, #4fc3f7);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .globe-marker:hover {
    transform: scale(1.3);
  }

  .marker-label {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    pointer-events: none;
  }

  /* Popup styling */
  .maplibregl-popup-content {
    background: rgba(2,4,8,0.92) !important;
    border: 1px solid rgba(79,195,247,0.35) !important;
    border-radius: 8px !important;
    padding: 12px 16px !important;
    color: #e0e8f0 !important;
    font-family: 'Source Sans 3', sans-serif !important;
    font-size: 13px !important;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 12px rgba(79,195,247,0.15) !important;
    backdrop-filter: blur(12px);
  }
  .maplibregl-popup-tip {
    border-top-color: rgba(2,4,8,0.92) !important;
  }
  .maplibregl-popup-close-button {
    color: #4fc3f7 !important;
    font-size: 18px !important;
  }

  /* Star field canvas */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>Loading Globe</h2>
</div>

<div id="space-bg"></div>
<canvas id="stars"></canvas>
<div id="atmosphere"></div>

<div id="header">
  <div>
    <h1 id="mapTitle">MapTiler Globe</h1>
    <div class="subtitle" id="mapSubtitle"></div>
  </div>
  <div class="coords" id="coordsDisplay">LAT 0.00° · LON 0.00°</div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="zoomIn" title="Zoom In">+</button>
  <button class="ctrl-btn" id="zoomOut" title="Zoom Out">−</button>
  <button class="ctrl-btn" id="resetBtn" title="Reset View">⟲</button>
</div>

<div id="map"></div>

<script>
// ─── Star field ───
(function() {
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  var stars = [];
  for (var i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.3,
      alpha: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2,
    });
  }

  var frame = 0;
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = s.alpha + Math.sin(frame * s.twinkleSpeed + s.phase) * 0.15;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,220,255,' + Math.max(0.05, alpha) + ')';
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  window.addEventListener('resize', function() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
})();

// ─── CONFIG (AI-editable fields) ───
var CONFIG = {
  // MapTiler API key
  apiKey: 'fpF5klX6zPBvoCSt2vV8',

  // Map style: satellite, streets, topo, ocean, winter, outdoor, dataviz, basic
  mapStyle: 'satellite',

  // Initial camera position
  center: [10, 20],       // [lng, lat]
  zoom: 1.5,              // Start zoomed out for globe view
  pitch: 0,               // camera tilt 0-85
  bearing: 0,             // camera rotation 0-360

  // 3D terrain
  terrain3D: false,

  // Projection (always globe for this template)
  projection: 'globe',

  // Overlay text
  title: 'MapTiler Globe',
  subtitle: '',

  // Globe auto-rotation in interactive mode (degrees per second)
  autoRotateSpeed: 5,

  // ── Frame-synced animation commands ──
  // Same command set as maptiler-map
  commands: [],

  // -1 = interactive mode (with auto-rotation), 1 = frame-synced
  frameSyncEnabled: -1,
};

// ─── State ───
var map = null;
var markers = {};
var popups = {};
var routeLayers = {};
var routeCounter = 0;
var lastProcessedFrame = -1;
var mapReady = false;
var autoRotating = false;
var rotationAnimId = null;

// ─── Style mapping ───
var STYLE_MAP = {
  satellite: 'SATELLITE',
  streets: 'STREETS',
  topo: 'TOPO',
  ocean: 'OCEAN',
  winter: 'WINTER',
  outdoor: 'OUTDOOR',
  dataviz: 'DATAVIZ',
  basic: 'BASIC',
};

function getStyleEnum(styleName) {
  var key = (styleName || 'satellite').toLowerCase();
  return maptilersdk.MapStyle[STYLE_MAP[key] || 'SATELLITE'];
}

// ─── Initialize Map ───
function initMap() {
  maptilersdk.config.apiKey = CONFIG.apiKey;

  map = new maptilersdk.Map({
    container: 'map',
    style: getStyleEnum(CONFIG.mapStyle),
    center: CONFIG.center,
    zoom: CONFIG.zoom,
    pitch: CONFIG.pitch,
    bearing: CONFIG.bearing,
    attributionControl: false,
    navigationControl: false,
    geolocateControl: false,
    projection: 'globe',
    terrain: CONFIG.terrain3D,
    terrainExaggeration: CONFIG.terrain3D ? 1.5 : 0,
  });

  map.on('load', function() {
    mapReady = true;

    // Enable 3D terrain if configured
    if (CONFIG.terrain3D) {
      enableTerrain(1.5);
    }

    // Set globe projection
    try {
      map.setProjection({ type: 'globe' });
    } catch(e) {}

    // Hide loading
    setTimeout(function() {
      document.getElementById('loading').classList.add('hidden');
    }, 300);

    // Start auto-rotation in interactive mode
    if (CONFIG.frameSyncEnabled === -1 && CONFIG.autoRotateSpeed > 0) {
      startAutoRotation();
    }

    // Process pre-loaded commands in interactive mode
    if (CONFIG.commands && CONFIG.commands.length > 0 && CONFIG.frameSyncEnabled === -1) {
      CONFIG.commands.forEach(function(cmd) { executeCommand(cmd); });
    }
  });

  // Stop auto-rotation on user interaction
  map.on('mousedown', function() { stopAutoRotation(); });
  map.on('touchstart', function() { stopAutoRotation(); });

  // Update coordinate display on mouse move
  map.on('mousemove', function(e) {
    var lng = e.lngLat.lng;
    var lat = e.lngLat.lat;
    var latDir = lat >= 0 ? 'N' : 'S';
    var lonDir = lng >= 0 ? 'E' : 'W';
    document.getElementById('coordsDisplay').textContent =
      'LAT ' + Math.abs(lat).toFixed(2) + '\u00B0 ' + latDir +
      ' \u00B7 LON ' + Math.abs(lng).toFixed(2) + '\u00B0 ' + lonDir;
  });
}

// ─── Auto-rotation ───
function startAutoRotation() {
  if (autoRotating) return;
  autoRotating = true;
  var lastTime = performance.now();

  function rotate(now) {
    if (!autoRotating || !map) return;
    var delta = (now - lastTime) / 1000;
    lastTime = now;

    var center = map.getCenter();
    center.lng += CONFIG.autoRotateSpeed * delta;
    map.setCenter(center);

    rotationAnimId = requestAnimationFrame(rotate);
  }
  rotationAnimId = requestAnimationFrame(rotate);
}

function stopAutoRotation() {
  autoRotating = false;
  if (rotationAnimId) {
    cancelAnimationFrame(rotationAnimId);
    rotationAnimId = null;
  }
}

// ─── Terrain helpers ───
function enableTerrain(exaggeration) {
  if (!map) return;
  try { map.enableTerrain(exaggeration || 1.5); } catch(e) {}
}

function disableTerrain() {
  if (!map) return;
  try { map.disableTerrain(); } catch(e) {}
}

// ─── Command Execution ───
function executeCommand(cmd) {
  if (!map || !mapReady) return;
  var action = cmd.action;
  var params = cmd.params || {};

  // Stop auto-rotation on any command
  stopAutoRotation();

  switch (action) {
    case 'flyTo':       cmdFlyTo(params); break;
    case 'addMarker':   cmdAddMarker(params); break;
    case 'removeMarker': cmdRemoveMarker(params); break;
    case 'clearMarkers': cmdClearMarkers(); break;
    case 'drawRoute':   cmdDrawRoute(params); break;
    case 'clearRoutes': cmdClearRoutes(); break;
    case 'setStyle':    cmdSetStyle(params); break;
    case 'set3DTerrain': cmdSet3DTerrain(params); break;
    case 'setPitch':    cmdSetPitch(params); break;
    case 'setBearing':  cmdSetBearing(params); break;
    case 'addPopup':    cmdAddPopup(params); break;
    case 'removePopups': cmdRemovePopups(); break;
    case 'fitBounds':   cmdFitBounds(params); break;
    case 'setProjection': cmdSetProjection(params); break;
    case 'hideUI':      cmdHideUI(); break;
    case 'showUI':      cmdShowUI(); break;
  }
}

// ─── Command implementations ───

function cmdFlyTo(params) {
  map.flyTo({
    center: [params.lng || 0, params.lat || 0],
    zoom: params.zoom !== undefined ? params.zoom : map.getZoom(),
    pitch: params.pitch !== undefined ? params.pitch : map.getPitch(),
    bearing: params.bearing !== undefined ? params.bearing : map.getBearing(),
    duration: params.duration || 2000,
    curve: params.curve || 1.42,
    essential: true,
  });
}

function cmdAddMarker(params) {
  var id = params.id || ('marker-' + Date.now() + '-' + Math.random().toString(36).substr(2,4));
  var color = params.color || '#4fc3f7';

  if (markers[id]) markers[id].remove();

  var el = document.createElement('div');
  el.className = 'globe-marker';
  el.style.backgroundColor = color;
  el.style.setProperty('--marker-color', color);

  if (params.label) {
    var label = document.createElement('div');
    label.className = 'marker-label';
    label.textContent = params.label;
    el.appendChild(label);
  }

  var marker = new maptilersdk.Marker({ element: el })
    .setLngLat([params.lng || 0, params.lat || 0])
    .addTo(map);

  markers[id] = marker;
}

function cmdRemoveMarker(params) {
  if (params.id && markers[params.id]) {
    markers[params.id].remove();
    delete markers[params.id];
  }
}

function cmdClearMarkers() {
  for (var id in markers) markers[id].remove();
  markers = {};
}

function cmdDrawRoute(params) {
  var id = params.id || ('route-' + (++routeCounter));
  var coordinates = params.coordinates || [];
  var color = params.color || '#4fc3f7';
  var width = params.width || 3;
  var animate = params.animate !== false;

  if (coordinates.length < 2) return;

  if (routeLayers[id]) {
    try {
      if (map.getLayer(routeLayers[id].layerId)) map.removeLayer(routeLayers[id].layerId);
      if (map.getLayer(routeLayers[id].glowLayerId)) map.removeLayer(routeLayers[id].glowLayerId);
      if (map.getSource(routeLayers[id].sourceId)) map.removeSource(routeLayers[id].sourceId);
    } catch(e) {}
  }

  var sourceId = 'route-source-' + id;
  var glowLayerId = 'route-glow-' + id;
  var layerId = 'route-line-' + id;

  var geojson = {
    type: 'Feature',
    properties: {},
    geometry: {
      type: 'LineString',
      coordinates: animate ? [coordinates[0]] : coordinates,
    }
  };

  map.addSource(sourceId, { type: 'geojson', data: geojson });

  map.addLayer({
    id: glowLayerId,
    type: 'line',
    source: sourceId,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': color, 'line-width': width + 4, 'line-opacity': 0.2, 'line-blur': 4 }
  });

  map.addLayer({
    id: layerId,
    type: 'line',
    source: sourceId,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': color, 'line-width': width, 'line-opacity': 1 }
  });

  routeLayers[id] = { sourceId: sourceId, layerId: layerId, glowLayerId: glowLayerId };

  if (animate && coordinates.length > 1) {
    var step = 0;
    var totalSteps = 60;
    var timer = setInterval(function() {
      step++;
      var progress = Math.min(step / totalSteps, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      var totalPoints = coordinates.length;
      var currentIndex = eased * (totalPoints - 1);
      var partialCoords = [];

      for (var i = 0; i <= Math.floor(currentIndex); i++) {
        partialCoords.push(coordinates[i]);
      }

      var frac = currentIndex - Math.floor(currentIndex);
      if (frac > 0 && Math.floor(currentIndex) + 1 < totalPoints) {
        var from = coordinates[Math.floor(currentIndex)];
        var to = coordinates[Math.floor(currentIndex) + 1];
        partialCoords.push([
          from[0] + (to[0] - from[0]) * frac,
          from[1] + (to[1] - from[1]) * frac
        ]);
      }

      if (partialCoords.length >= 2) {
        geojson.geometry.coordinates = partialCoords;
        try {
          var src = map.getSource(sourceId);
          if (src) src.setData(geojson);
        } catch(e) {}
      }

      if (progress >= 1) clearInterval(timer);
    }, 1000 / 60);
  }
}

function cmdClearRoutes() {
  for (var id in routeLayers) {
    try {
      if (map.getLayer(routeLayers[id].layerId)) map.removeLayer(routeLayers[id].layerId);
      if (map.getLayer(routeLayers[id].glowLayerId)) map.removeLayer(routeLayers[id].glowLayerId);
      if (map.getSource(routeLayers[id].sourceId)) map.removeSource(routeLayers[id].sourceId);
    } catch(e) {}
  }
  routeLayers = {};
}

function cmdSetStyle(params) {
  try { map.setStyle(getStyleEnum(params.style || 'satellite')); } catch(e) {}
}

function cmdSet3DTerrain(params) {
  if (params.enabled) enableTerrain(params.exaggeration || 1.5);
  else disableTerrain();
}

function cmdSetPitch(params) {
  map.easeTo({ pitch: params.pitch || 0, duration: params.duration || 1000 });
}

function cmdSetBearing(params) {
  map.easeTo({ bearing: params.bearing || 0, duration: params.duration || 1000 });
}

function cmdAddPopup(params) {
  var id = params.id || ('popup-' + Date.now());
  if (popups[id]) popups[id].remove();

  var popup = new maptilersdk.Popup({ closeOnClick: false, closeButton: true })
    .setLngLat([params.lng || 0, params.lat || 0])
    .setHTML(params.html || '')
    .addTo(map);

  popups[id] = popup;
}

function cmdRemovePopups() {
  for (var id in popups) popups[id].remove();
  popups = {};
}

function cmdFitBounds(params) {
  if (!params.bounds || params.bounds.length !== 2) return;
  map.fitBounds(params.bounds, { padding: params.padding || 50, duration: 1500 });
}

function cmdSetProjection(params) {
  try { map.setProjection({ type: params.type || 'globe' }); } catch(e) {}
}

function cmdHideUI() {
  var header = document.getElementById('header');
  var controls = document.getElementById('controls');
  if (header) header.style.opacity = '0';
  if (controls) controls.style.opacity = '0';
}

function cmdShowUI() {
  var header = document.getElementById('header');
  var controls = document.getElementById('controls');
  if (header) header.style.opacity = '1';
  if (controls) controls.style.opacity = '1';
}

// ─── Frame Sync Handler ───
window.__onFrameUpdate = function(frame, playing, fps, total) {
  if (!mapReady) return;
  if (!CONFIG.commands || CONFIG.commands.length === 0) return;

  // Stop auto-rotation in frame-synced mode
  stopAutoRotation();

  // Rewind detection
  if (frame < lastProcessedFrame) {
    lastProcessedFrame = -1;

    cmdClearMarkers();
    cmdClearRoutes();
    cmdRemovePopups();

    map.jumpTo({
      center: CONFIG.center,
      zoom: CONFIG.zoom,
      pitch: CONFIG.pitch,
      bearing: CONFIG.bearing,
    });

    for (var i = 0; i < CONFIG.commands.length; i++) {
      var cmd = CONFIG.commands[i];
      if (cmd.frame !== undefined && cmd.frame <= frame) {
        executeCommand(cmd);
        lastProcessedFrame = cmd.frame;
      }
    }
    return;
  }

  // Process commands up to current frame
  for (var i = 0; i < CONFIG.commands.length; i++) {
    var cmd = CONFIG.commands[i];
    var cmdFrame = cmd.frame;
    if (cmdFrame === undefined || cmdFrame === null) continue;

    if (cmdFrame <= frame && cmdFrame > lastProcessedFrame) {
      executeCommand(cmd);
    }
  }

  lastProcessedFrame = frame;
};

// ─── Controls ───
document.getElementById('zoomIn').addEventListener('click', function() {
  if (map) map.zoomIn({ duration: 300 });
});
document.getElementById('zoomOut').addEventListener('click', function() {
  if (map) map.zoomOut({ duration: 300 });
});
document.getElementById('resetBtn').addEventListener('click', function() {
  if (map) {
    map.flyTo({
      center: CONFIG.center,
      zoom: CONFIG.zoom,
      pitch: CONFIG.pitch,
      bearing: CONFIG.bearing,
      duration: 1000,
    });
    if (CONFIG.frameSyncEnabled === -1) startAutoRotation();
  }
});

// ─── Apply initial CONFIG ───
document.getElementById('mapTitle').textContent = CONFIG.title || 'MapTiler Globe';
if (CONFIG.subtitle) {
  document.getElementById('mapSubtitle').textContent = CONFIG.subtitle;
}

// ─── Load SDK dynamically then init ───
(function() {
  var script = document.createElement('script');
  script.src = 'https://cdn.maptiler.com/maptiler-sdk-js/v2/maptiler-sdk.umd.min.js';
  script.onload = function() { initMap(); };
  script.onerror = function() {
    document.getElementById('loading').innerHTML =
      '<h2 style="color:#ff6b6b;font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:4px">FAILED TO LOAD MAP SDK</h2>';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mood Board Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #faf8f5;
    font-family: 'Georgia', serif;
  }

  #stage { position: absolute; inset: 0; z-index: 1; }

  .mood-item {
    position: absolute;
    opacity: 0;
    transform-origin: center center;
    will-change: transform, opacity;
    user-select: none;
  }

  /* Large image card */
  .mood-item.card .item-inner {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .mood-item.card .item-color {
    width: 100%;
    height: 100%;
  }

  /* Text swatch */
  .mood-item.text-swatch .item-inner {
    padding: 14px 20px;
    background: #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  .mood-item.text-swatch .swatch-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #999;
    margin-bottom: 6px;
  }

  .mood-item.text-swatch .swatch-value {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    font-family: 'Georgia', serif;
  }

  /* Color palette chip */
  .mood-item.palette .item-inner {
    display: flex;
    gap: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow: hidden;
    border-radius: 4px;
  }

  .palette-chip {
    width: 36px;
    height: 50px;
  }

  /* Fabric swatch */
  .mood-item.fabric .item-inner {
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow: hidden;
    position: relative;
  }

  .fabric-pattern {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .fabric-pattern::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 4px,
      rgba(255,255,255,0.1) 4px,
      rgba(255,255,255,0.1) 8px
    );
  }

  /* Note card */
  .mood-item.note .item-inner {
    background: #fffde7;
    padding: 12px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 13px;
    color: #555;
    line-height: 1.5;
    max-width: 180px;
  }

  /* Minimal washi tape */
  .washi-tape {
    position: absolute;
    z-index: 3;
    height: 18px;
    opacity: 0.5;
    pointer-events: none;
  }

  @keyframes fadeSlide {
    0% { opacity: 0; transform: var(--fs-start); }
    100% { opacity: var(--final-opacity); transform: var(--fs-end); }
  }

  @keyframes fadeOut {
    0% { opacity: var(--final-opacity); transform: var(--fs-end); }
    100% { opacity: 0; transform: var(--fs-end) scale(0.95); }
  }
</style>
</head>
<body>

<div id="stage"></div>

<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  items: [
    { type: 'card', w: 200, h: 260, color: '#d4a574' },
    { type: 'card', w: 180, h: 180, color: '#8fbc8f' },
    { type: 'text-swatch', label: 'TYPEFACE', value: 'Garamond' },
    { type: 'palette', colors: ['#d4a574', '#8fbc8f', '#e8d5b7', '#3c3c3c', '#f5f0e6'] },
    { type: 'card', w: 160, h: 200, color: '#b8860b' },
    { type: 'fabric', w: 120, h: 120, color: '#5f6b4e' },
    { type: 'note', text: 'Warm earth tones with organic textures' },
    { type: 'text-swatch', label: 'PALETTE', value: 'Autumn' },
    { type: 'card', w: 220, h: 150, color: '#c9a882' },
    { type: 'fabric', w: 100, h: 100, color: '#8b7355' },
  ],
  washiColors: ['#e8c4a0', '#b5cda3', '#d4a5a5', '#a5b8d4'],
  bgColor: '#faf8f5',
  maxRotation: 5,
  cycleDuration: 10000,
};
// =========================================

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');

function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function createItems() {
  const elements = [];
  const count = CONFIG.items.length;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  for (let i = 0; i < count; i++) {
    const item = CONFIG.items[i];
    const rng = seededRandom(i * 173 + 59);

    const el = document.createElement('div');
    el.className = `mood-item ${item.type}`;

    const inner = document.createElement('div');
    inner.className = 'item-inner';

    if (item.type === 'card') {
      inner.style.width = item.w + 'px';
      inner.style.height = item.h + 'px';
      const c = document.createElement('div');
      c.className = 'item-color';
      c.style.background = item.color;
      inner.appendChild(c);
    } else if (item.type === 'text-swatch') {
      const lbl = document.createElement('div');
      lbl.className = 'swatch-label';
      lbl.textContent = item.label;
      const val = document.createElement('div');
      val.className = 'swatch-value';
      val.textContent = item.value;
      inner.appendChild(lbl);
      inner.appendChild(val);
    } else if (item.type === 'palette') {
      item.colors.forEach(c => {
        const chip = document.createElement('div');
        chip.className = 'palette-chip';
        chip.style.background = c;
        inner.appendChild(chip);
      });
    } else if (item.type === 'fabric') {
      inner.style.width = item.w + 'px';
      inner.style.height = item.h + 'px';
      const fp = document.createElement('div');
      fp.className = 'fabric-pattern';
      fp.style.background = item.color;
      inner.appendChild(fp);
    } else if (item.type === 'note') {
      inner.textContent = item.text;
    }

    el.appendChild(inner);

    // Add washi tape to some
    if (rng() > 0.5) {
      const washi = document.createElement('div');
      washi.className = 'washi-tape';
      washi.style.background = CONFIG.washiColors[i % CONFIG.washiColors.length];
      washi.style.width = (40 + rng() * 40) + 'px';
      washi.style.top = '-8px';
      washi.style.left = (20 + rng() * 40) + '%';
      washi.style.transform = `rotate(${(rng() - 0.5) * 10}deg)`;
      el.appendChild(washi);
    }

    // Position in loose grid
    const col = i % 4;
    const row = Math.floor(i / 4);
    const bx = vw * 0.04 + col * (vw * 0.24);
    const by = vh * 0.04 + row * (vh * 0.30);
    const ox = (rng() - 0.5) * vw * 0.06;
    const oy = (rng() - 0.5) * vh * 0.05;

    el.style.left = Math.max(5, bx + ox) + 'px';
    el.style.top = Math.max(5, by + oy) + 'px';

    const rotation = (rng() - 0.5) * 2 * CONFIG.maxRotation;
    const finalOpacity = 0.92 + rng() * 0.08;
    const dir = i % 2 === 0 ? -1 : 1;

    el.style.setProperty('--fs-start', `translate(${dir * 40}px, 20px) rotate(${rotation + dir * 3}deg)`);
    el.style.setProperty('--fs-end', `translate(0, 0) rotate(${rotation}deg)`);
    el.style.setProperty('--final-opacity', String(finalOpacity));

    stage.appendChild(el);
    elements.push(el);
  }
  return elements;
}

function runAnimation(elements) {
  const count = elements.length;
  const inStagger = 300;
  const inDuration = 500;
  const holdDuration = 3500;
  const outStagger = 180;
  const outDuration = 400;
  const pauseBeforeLoop = 800;

  const totalInTime = (count - 1) * inStagger + inDuration;
  const totalOutTime = (count - 1) * outStagger + outDuration;

  let animationFrame, startTime;

  function resetAll() {
    elements.forEach(el => { el.style.animation = 'none'; el.style.opacity = '0'; });
  }

  function tick(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;

    if (elapsed < totalInTime) {
      elements.forEach((el, i) => {
        if (elapsed >= i * inStagger && !el.dataset.in) {
          el.dataset.in = '1';
          el.style.animation = `fadeSlide ${inDuration}ms ease-out forwards`;
        }
      });
    } else if (elapsed < totalInTime + holdDuration) {
    } else if (elapsed < totalInTime + holdDuration + totalOutTime) {
      const oe = elapsed - totalInTime - holdDuration;
      elements.forEach((el, i) => {
        if (oe >= i * outStagger && !el.dataset.out) {
          el.dataset.out = '1';
          el.style.animation = `fadeOut ${outDuration}ms ease-in forwards`;
        }
      });
    } else if (elapsed < totalInTime + holdDuration + totalOutTime + pauseBeforeLoop) {
    } else {
      resetAll();
      elements.forEach(el => { delete el.dataset.in; delete el.dataset.out; });
      startTime = timestamp;
    }
    animationFrame = requestAnimationFrame(tick);
  }

  resetAll();
  animationFrame = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(animationFrame);
}

let items = createItems();
runAnimation(items);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    stage.innerHTML = '';
    items = createItems();
    runAnimation(items);
  }, 300);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table Motion Graphics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0E1A;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  bgColor: '#0A0E1A',
  titleText: 'PERIODIC TABLE',
  cellSize: 56,
  cellGap: 4,
  cornerRadius: 4,
  highlightCycleSpeed: 1.5,
  electronSpeed: 3,
  bondDrawSpeed: 2,
  typeColors: {
    metal:    { bg: 'rgba(40, 80, 180, 0.2)',  border: 'rgba(60, 120, 255, 0.6)',  glow: 'rgba(60, 120, 255, 0.3)',  label: '#6090FF' },
    nonmetal: { bg: 'rgba(30, 150, 80, 0.2)',  border: 'rgba(50, 200, 100, 0.6)', glow: 'rgba(50, 200, 100, 0.3)', label: '#50C878' },
    noble:    { bg: 'rgba(120, 50, 180, 0.2)', border: 'rgba(160, 80, 255, 0.6)', glow: 'rgba(160, 80, 255, 0.3)', label: '#B060FF' },
    metalloid:{ bg: 'rgba(180, 140, 40, 0.2)', border: 'rgba(220, 180, 60, 0.6)', glow: 'rgba(220, 180, 60, 0.3)', label: '#DDB040' },
    halogen:  { bg: 'rgba(200, 60, 100, 0.2)', border: 'rgba(255, 80, 130, 0.6)', glow: 'rgba(255, 80, 130, 0.3)', label: '#FF5080' }
  },
  elements: [
    { num: 1,  sym: 'H',  name: 'Hydrogen',  type: 'nonmetal', row: 0, col: 0 },
    { num: 2,  sym: 'He', name: 'Helium',    type: 'noble',    row: 0, col: 7 },
    { num: 3,  sym: 'Li', name: 'Lithium',   type: 'metal',    row: 1, col: 0 },
    { num: 4,  sym: 'Be', name: 'Beryllium', type: 'metal',    row: 1, col: 1 },
    { num: 5,  sym: 'B',  name: 'Boron',     type: 'metalloid',row: 1, col: 2 },
    { num: 6,  sym: 'C',  name: 'Carbon',    type: 'nonmetal', row: 1, col: 3 },
    { num: 7,  sym: 'N',  name: 'Nitrogen',  type: 'nonmetal', row: 1, col: 4 },
    { num: 8,  sym: 'O',  name: 'Oxygen',    type: 'nonmetal', row: 1, col: 5 },
    { num: 9,  sym: 'F',  name: 'Fluorine',  type: 'halogen',  row: 1, col: 6 },
    { num: 10, sym: 'Ne', name: 'Neon',      type: 'noble',    row: 1, col: 7 },
    { num: 11, sym: 'Na', name: 'Sodium',    type: 'metal',    row: 2, col: 0 },
    { num: 12, sym: 'Mg', name: 'Magnesium', type: 'metal',    row: 2, col: 1 },
    { num: 13, sym: 'Al', name: 'Aluminum',  type: 'metal',    row: 2, col: 2 },
    { num: 14, sym: 'Si', name: 'Silicon',   type: 'metalloid',row: 2, col: 3 },
    { num: 15, sym: 'P',  name: 'Phosphorus',type: 'nonmetal', row: 2, col: 4 },
    { num: 16, sym: 'S',  name: 'Sulfur',    type: 'nonmetal', row: 2, col: 5 },
    { num: 17, sym: 'Cl', name: 'Chlorine',  type: 'halogen',  row: 2, col: 6 },
    { num: 18, sym: 'Ar', name: 'Argon',     type: 'noble',    row: 2, col: 7 },
    { num: 26, sym: 'Fe', name: 'Iron',      type: 'metal',    row: 3, col: 0 },
    { num: 29, sym: 'Cu', name: 'Copper',    type: 'metal',    row: 3, col: 1 },
    { num: 30, sym: 'Zn', name: 'Zinc',      type: 'metal',    row: 3, col: 2 },
    { num: 47, sym: 'Ag', name: 'Silver',    type: 'metal',    row: 3, col: 3 },
    { num: 79, sym: 'Au', name: 'Gold',      type: 'metal',    row: 3, col: 4 },
    { num: 82, sym: 'Pb', name: 'Lead',      type: 'metal',    row: 3, col: 5 }
  ],
  bonds: [
    [0, 0, 0, 5],   // H - C
    [0, 5, 0, 7],   // C - O
    [0, 7, 0, 6],   // O - N
    [1, 10, 1, 16], // Na - Cl
    [0, 5, 0, 6],   // C - N
    [2, 18, 2, 19]  // Fe - Cu
  ]
};
// =========================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0, offsetX, offsetY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const gridW = 8 * (CONFIG.cellSize + CONFIG.cellGap);
  const gridH = 4 * (CONFIG.cellSize + CONFIG.cellGap);
  offsetX = (W - gridW) / 2;
  offsetY = (H - gridH) / 2 + 20;
}
window.addEventListener('resize', resize);
resize();

function getCellPos(row, col) {
  return {
    x: offsetX + col * (CONFIG.cellSize + CONFIG.cellGap),
    y: offsetY + row * (CONFIG.cellSize + CONFIG.cellGap)
  };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawElement(el, highlightAmount) {
  const pos = getCellPos(el.row, el.col);
  const colors = CONFIG.typeColors[el.type];
  const s = CONFIG.cellSize;

  // Glow effect when highlighted
  if (highlightAmount > 0.1) {
    ctx.shadowColor = colors.glow;
    ctx.shadowBlur = 15 * highlightAmount;
  }

  // Background
  roundRect(pos.x, pos.y, s, s, CONFIG.cornerRadius);
  const bgAlpha = 0.15 + highlightAmount * 0.35;
  ctx.fillStyle = colors.bg.replace('0.2', bgAlpha.toFixed(2));
  ctx.fill();

  // Border
  roundRect(pos.x, pos.y, s, s, CONFIG.cornerRadius);
  const borderAlpha = 0.4 + highlightAmount * 0.6;
  ctx.strokeStyle = colors.border.replace('0.6', borderAlpha.toFixed(2));
  ctx.lineWidth = 1 + highlightAmount;
  ctx.stroke();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;

  // Atomic number
  ctx.font = '9px Courier New';
  ctx.fillStyle = `rgba(150, 170, 200, ${0.5 + highlightAmount * 0.5})`;
  ctx.textAlign = 'left';
  ctx.fillText(el.num.toString(), pos.x + 4, pos.y + 12);

  // Symbol
  ctx.font = `bold ${16 + highlightAmount * 4}px Courier New`;
  ctx.fillStyle = `rgba(240, 245, 255, ${0.7 + highlightAmount * 0.3})`;
  ctx.textAlign = 'center';
  ctx.fillText(el.sym, pos.x + s / 2, pos.y + s / 2 + 4);

  // Name
  ctx.font = '7px Courier New';
  ctx.fillStyle = colors.label + (Math.floor((0.4 + highlightAmount * 0.6) * 255)).toString(16).padStart(2, '0');
  ctx.textAlign = 'center';
  ctx.fillText(el.name, pos.x + s / 2, pos.y + s - 6);
}

function drawElectronOrbit(el, t) {
  const pos = getCellPos(el.row, el.col);
  const cx = pos.x + CONFIG.cellSize / 2;
  const cy = pos.y + CONFIG.cellSize / 2;
  const shells = el.num <= 2 ? 1 : el.num <= 10 ? 2 : 3;

  for (let shell = 1; shell <= shells; shell++) {
    const radius = 20 + shell * 14;
    const electronsInShell = shell === 1 ? Math.min(2, el.num) : shell === 2 ? Math.min(8, el.num - 2) : Math.min(8, el.num - 10);
    if (electronsInShell <= 0) continue;

    // Orbit path
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100, 140, 200, 0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Electrons
    for (let e = 0; e < Math.max(1, Math.min(electronsInShell, 4)); e++) {
      const angle = t * CONFIG.electronSpeed * (4 - shell) + (e / electronsInShell) * Math.PI * 2;
      const ex = cx + Math.cos(angle) * radius;
      const ey = cy + Math.sin(angle) * radius;

      // Electron glow
      const eGrad = ctx.createRadialGradient(ex, ey, 0, ex, ey, 5);
      eGrad.addColorStop(0, 'rgba(100, 200, 255, 0.8)');
      eGrad.addColorStop(1, 'rgba(100, 200, 255, 0)');
      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fillStyle = eGrad;
      ctx.fill();

      // Electron dot
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#AADDFF';
      ctx.fill();
    }
  }
}

function drawBonds() {
  CONFIG.bonds.forEach((bond, idx) => {
    const progress = ((time * CONFIG.bondDrawSpeed + idx * 1.5) % 8) / 8;
    if (progress < 0 || progress > 1) return;

    const el1 = CONFIG.elements.find(e => e.row === bond[0] && e.col === bond[1]);
    const el2 = CONFIG.elements.find(e => e.row === bond[2] && e.col === bond[3]);
    if (!el1 || !el2) return;

    const p1 = getCellPos(el1.row, el1.col);
    const p2 = getCellPos(el2.row, el2.col);
    const s = CONFIG.cellSize;

    const x1 = p1.x + s / 2;
    const y1 = p1.y + s / 2;
    const x2 = p2.x + s / 2;
    const y2 = p2.y + s / 2;

    const drawLen = progress;
    const fadeAlpha = progress < 0.8 ? 1 : (1 - progress) * 5;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + (x2 - x1) * drawLen, y1 + (y2 - y1) * drawLen);
    ctx.strokeStyle = `rgba(150, 200, 255, ${0.4 * fadeAlpha})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.lineDashOffset = -time * 20;
    ctx.stroke();
    ctx.setLineDash([]);

    // Bond electron dots
    const dotT = (time * 3 + idx) % 1;
    const dx = x1 + (x2 - x1) * dotT * drawLen;
    const dy = y1 + (y2 - y1) * dotT * drawLen;
    ctx.beginPath();
    ctx.arc(dx, dy, 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 220, 255, ${0.6 * fadeAlpha})`;
    ctx.fill();
  });
}

function drawLegend() {
  const types = [
    { name: 'Metals', key: 'metal' },
    { name: 'Non-metals', key: 'nonmetal' },
    { name: 'Noble Gases', key: 'noble' },
    { name: 'Metalloids', key: 'metalloid' },
    { name: 'Halogens', key: 'halogen' }
  ];

  ctx.font = '10px Courier New';
  ctx.textAlign = 'left';
  const ly = H - 30;
  let lx = 20;
  types.forEach(t => {
    const colors = CONFIG.typeColors[t.key];
    ctx.fillStyle = colors.border;
    ctx.fillRect(lx, ly, 10, 10);
    ctx.fillStyle = 'rgba(180, 200, 220, 0.6)';
    ctx.fillText(t.name, lx + 14, ly + 9);
    lx += ctx.measureText(t.name).width + 30;
  });
}

function drawTitle() {
  ctx.font = 'bold 14px Courier New';
  ctx.fillStyle = 'rgba(140, 170, 220, 0.6)';
  ctx.textAlign = 'center';
  ctx.fillText(CONFIG.titleText, W / 2, offsetY - 20);

  // Scanning line
  const scanY = offsetY + ((time * 30) % (4 * (CONFIG.cellSize + CONFIG.cellGap)));
  ctx.beginPath();
  ctx.moveTo(offsetX - 10, scanY);
  ctx.lineTo(offsetX + 8 * (CONFIG.cellSize + CONFIG.cellGap) + 10, scanY);
  ctx.strokeStyle = 'rgba(100, 200, 255, 0.08)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawParticles() {
  for (let i = 0; i < 30; i++) {
    const px = (Math.sin(time * 0.3 + i * 7.3) * 0.5 + 0.5) * W;
    const py = (Math.cos(time * 0.2 + i * 5.1) * 0.5 + 0.5) * H;
    const alpha = Math.sin(time + i) * 0.1 + 0.1;
    ctx.beginPath();
    ctx.arc(px, py, 1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(100, 150, 255, ${Math.max(0, alpha)})`;
    ctx.fill();
  }
}

function draw() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  drawParticles();
  drawTitle();

  // Determine which group is highlighted
  const types = ['metal', 'nonmetal', 'noble', 'metalloid', 'halogen'];
  const cyclePos = (time * CONFIG.highlightCycleSpeed) % (types.length * 2);
  const activeTypeIdx = Math.floor(cyclePos) % types.length;
  const activeType = types[activeTypeIdx];
  const withinCycle = cyclePos - Math.floor(cyclePos);
  const highlightPhase = Math.sin(withinCycle * Math.PI);

  // Draw elements
  CONFIG.elements.forEach(el => {
    const isActive = el.type === activeType;
    drawElement(el, isActive ? highlightPhase : 0);
  });

  // Draw electron orbit on active element
  const activeElements = CONFIG.elements.filter(e => e.type === activeType);
  if (activeElements.length > 0 && highlightPhase > 0.5) {
    const focusEl = activeElements[Math.floor(time * 0.8) % activeElements.length];
    drawElectronOrbit(focusEl, time);
  }

  drawBonds();
  drawLegend();

  time += 1 / 60;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fire Ember - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #1a0a00; font-family: 'Impact', 'Arial Black', sans-serif; position: relative; }
  body::after { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 80%, rgba(255,80,0,0.08), transparent 60%); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .word-inner { display: inline-block; }
  .ember { position: absolute; width: 4px; height: 4px; border-radius: 50%; pointer-events: none; z-index: 3; }

  @keyframes burnIn { 0% { opacity: 0; transform: scale(0.3); filter: blur(8px) brightness(3); } 40% { opacity: 1; filter: blur(0) brightness(1.8); } 100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); } }
  @keyframes burnOut { 0% { opacity: 1; filter: brightness(1); } 40% { filter: brightness(2.5); } 100% { opacity: 0; transform: scale(0.8); filter: blur(4px) brightness(3); } }
  @keyframes emberRise { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-120px) translateX(var(--dx)) scale(0.2); } }
  @keyframes flicker { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['BURNING','BRIGHT','THROUGH','THE','DARKNESS','IGNITE','YOUR','FIRE'],
  bgColor: '#1a0a00',
  fontFamily: "'Impact', 'Arial Black', sans-serif",
  colors: ['#ff4500','#ff6600','#ff8c00','#ffaa00','#ff5500','#ff7700','#ff3300','#ffbb00'],
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function spawnEmbers(x, y, color) {
  for (let i = 0; i < 6; i++) {
    const e = document.createElement('div'); e.className = 'ember';
    e.style.cssText = `left:${x + (Math.random()-0.5)*40}px;top:${y}px;background:${color};box-shadow:0 0 6px ${color};--dx:${(Math.random()-0.5)*60}px;animation:emberRise ${800+Math.random()*600}ms ease-out forwards;`;
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 1500);
  }
}

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 137 + 42);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(36 + rng() * 28, cellW * 0.38, cellH * 0.5);
    const el = document.createElement('div'); el.className = 'word-block';
    const inner = document.createElement('div'); inner.className = 'word-inner';
    inner.textContent = word;
    const color = CONFIG.colors[i % CONFIG.colors.length];
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:${color};text-shadow:0 0 20px ${color},0 0 40px rgba(255,69,0,0.5);left:${col*cellW + cellW/2}px;top:${row*cellH + cellH/2}px;transform:translate(-50%,-50%);`;
    el.appendChild(inner); stage.appendChild(el); els.push({ el, x: col*cellW + cellW/2, y: row*cellH + cellH/2, color });
  });
  return els;
}

function runAnimation(els) {
  const n = els.length, inS = 300, inD = 500, hold = 3000, outS = 200, outD = 450, pause = 800;
  const tIn = (n-1)*inS+inD, tOut = (n-1)*outS+outD;
  let af, st;
  function reset() { els.forEach(e => { e.el.style.animation = 'none'; e.el.style.opacity = '0'; }); }
  function tick(ts) {
    if (!st) st = ts; const e = ts - st;
    if (e < tIn) { els.forEach((item, i) => { if (e >= i*inS && !item.el.dataset.i) { item.el.dataset.i='1'; item.el.style.animation = `burnIn ${inD}ms ease-out forwards`; spawnEmbers(item.x, item.y, item.color); } }); }
    else if (e < tIn + hold) {}
    else if (e < tIn + hold + tOut) { const oe = e - tIn - hold; els.forEach((item, i) => { if (oe >= i*outS && !item.el.dataset.o) { item.el.dataset.o='1'; item.el.style.animation = `burnOut ${outD}ms ease-in forwards`; } }); }
    else if (e < tIn + hold + tOut + pause) {}
    else { reset(); els.forEach(item => { delete item.el.dataset.i; delete item.el.dataset.o; }); st = ts; }
    af = requestAnimationFrame(tick);
  }
  reset(); af = requestAnimationFrame(tick);
}

let els = build(); runAnimation(els);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { els = build(); runAnimation(els); }, 300); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Synthwave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0015; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  bgTop: '#0a0015',
  bgMid: '#1a0030',
  sunColor1: '#ff2d8a',
  sunColor2: '#ff6600',
  sunColor3: '#ffcc00',
  gridColor: '#ff2d8a',
  gridSecondary: '#6622aa',
  mountainColor: '#1a0035',
  mountainHighlight: '#ff2d8a',
  starCount: 120,
  scanlineOpacity: 0.03,
  palmCount: 6,
  title: 'SYNTHWAVE',
  subtitle: 'RETRO FUTURE',
  chromeText: true,
  gridSpeed: 2,
  sunRadius: 0.18,
};

window.addEventListener('message', (e) => { if (e.data?.type === 'CONFIG_UPDATE') Object.assign(CONFIG, e.data.config); });

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

// Stars
const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({ x: Math.random(), y: Math.random() * 0.42, r: 0.3 + Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2, speed: 0.005 + Math.random() * 0.02 });
}

// Palm tree silhouettes
const palms = [];
for (let i = 0; i < CONFIG.palmCount; i++) {
  palms.push({
    x: (i / (CONFIG.palmCount - 1)) * 0.9 + 0.05,
    height: 0.2 + Math.random() * 0.15,
    lean: (Math.random() - 0.5) * 0.3,
    fronds: 5 + Math.floor(Math.random() * 4),
    sway: Math.random() * Math.PI * 2,
  });
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  grad.addColorStop(0, CONFIG.bgTop);
  grad.addColorStop(0.6, CONFIG.bgMid);
  grad.addColorStop(1, CONFIG.sunColor1 + '30');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.55);
}

function drawStars(t) {
  stars.forEach(s => {
    s.twinkle += s.speed;
    const a = 0.3 + 0.7 * Math.abs(Math.sin(s.twinkle));
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSun(t) {
  const cx = W * 0.5;
  const cy = H * 0.42;
  const r = Math.min(W, H) * CONFIG.sunRadius;

  // Sun glow
  const glowR = r * 2.5;
  const glow = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, glowR);
  const c1 = hexRgb(CONFIG.sunColor1);
  glow.addColorStop(0, `rgba(${c1[0]},${c1[1]},${c1[2]},0.15)`);
  glow.addColorStop(0.5, `rgba(${c1[0]},${c1[1]},${c1[2]},0.05)`);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, cy - glowR, W, glowR * 2);

  // Sun body with horizontal stripe cutouts
  const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
  sunGrad.addColorStop(0, CONFIG.sunColor3);
  sunGrad.addColorStop(0.3, CONFIG.sunColor2);
  sunGrad.addColorStop(0.6, CONFIG.sunColor1);
  sunGrad.addColorStop(1, CONFIG.sunColor1 + '80');

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();

  ctx.fillStyle = sunGrad;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  // Horizontal line gaps (retrowave style)
  ctx.fillStyle = CONFIG.bgTop;
  const lineCount = 8;
  for (let i = 0; i < lineCount; i++) {
    const ratio = (i + 1) / (lineCount + 1);
    const ly = cy - r + ratio * r * 2;
    const gap = 2 + i * 1.2; // Lines get thicker toward bottom
    ctx.fillRect(cx - r, ly - gap / 2, r * 2, gap);
  }
  ctx.restore();
}

function drawGrid(t) {
  const horizonY = H * 0.55;
  const gridOffset = (t * CONFIG.gridSpeed * 0.001) % 1;
  const col = hexRgb(CONFIG.gridColor);
  const col2 = hexRgb(CONFIG.gridSecondary);

  // Horizontal lines (perspective)
  const lineCount = 30;
  for (let i = 0; i < lineCount; i++) {
    const ratio = (i + gridOffset) / lineCount;
    const y = horizonY + ratio * ratio * (H - horizonY);
    const alpha = ratio * 0.5;
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
    ctx.lineWidth = 0.5 + ratio * 1.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Vertical lines (perspective, converging to center)
  const vLines = 24;
  for (let i = 0; i <= vLines; i++) {
    const ratio = i / vLines;
    const topX = W * 0.5;
    const bottomX = (ratio - 0.5) * W * 2.5 + W * 0.5;
    const alpha = 0.1 + 0.2 * (1 - Math.abs(ratio - 0.5) * 2);
    ctx.strokeStyle = `rgba(${col2[0]},${col2[1]},${col2[2]},${alpha})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(topX, horizonY);
    ctx.lineTo(bottomX, H);
    ctx.stroke();
  }

  // Grid glow at horizon
  const horizGlow = ctx.createLinearGradient(0, horizonY - 20, 0, horizonY + 40);
  horizGlow.addColorStop(0, 'transparent');
  horizGlow.addColorStop(0.5, `rgba(${col[0]},${col[1]},${col[2]},0.06)`);
  horizGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = horizGlow;
  ctx.fillRect(0, horizonY - 20, W, 60);
}

function drawMountains() {
  const horizonY = H * 0.55;
  const mc = hexRgb(CONFIG.mountainColor);
  const mh = hexRgb(CONFIG.mountainHighlight);

  // Two mountain layers
  for (let layer = 0; layer < 2; layer++) {
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    const segments = 60;
    for (let i = 0; i <= segments; i++) {
      const x = (i / segments) * W;
      let y = horizonY;
      y -= Math.sin(i * 0.12 + layer * 3) * H * (0.06 - layer * 0.015);
      y -= Math.sin(i * 0.2 + layer * 7) * H * (0.03 - layer * 0.008);
      y -= Math.sin(i * 0.05 + layer) * H * 0.04;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, horizonY);
    ctx.closePath();

    const darkness = 1 - layer * 0.3;
    ctx.fillStyle = `rgb(${Math.floor(mc[0] * darkness)},${Math.floor(mc[1] * darkness)},${Math.floor(mc[2] * darkness)})`;
    ctx.fill();

    // Mountain edge glow (first layer)
    if (layer === 0) {
      ctx.strokeStyle = `rgba(${mh[0]},${mh[1]},${mh[2]},0.15)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function drawPalms(t) {
  palms.forEach(p => {
    const px = p.x * W;
    const baseY = H * 0.55;
    const trunkH = p.height * H;
    const sway = Math.sin(t * 0.001 + p.sway) * 8;
    const topX = px + p.lean * trunkH + sway;
    const topY = baseY - trunkH;

    // Trunk
    ctx.strokeStyle = '#0a0018';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(px, baseY);
    ctx.quadraticCurveTo(px + p.lean * trunkH * 0.5 + sway * 0.5, baseY - trunkH * 0.6, topX, topY);
    ctx.stroke();

    // Fronds
    for (let f = 0; f < p.fronds; f++) {
      const angle = (f / p.fronds) * Math.PI * 1.5 - Math.PI * 0.75;
      const frondLen = trunkH * (0.3 + Math.random() * 0.15);
      const frondSway = Math.sin(t * 0.0015 + p.sway + f * 2) * 5;
      const endX = topX + Math.cos(angle) * frondLen + frondSway;
      const endY = topY + Math.sin(angle) * frondLen * 0.5 + Math.abs(Math.cos(angle)) * frondLen * 0.3;
      const cpX = topX + Math.cos(angle) * frondLen * 0.5 + frondSway * 0.5;
      const cpY = topY + Math.sin(angle) * frondLen * 0.25 - 10;

      ctx.strokeStyle = '#05000f';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.quadraticCurveTo(cpX, cpY, endX, endY);
      ctx.stroke();

      // Leaf segments
      ctx.strokeStyle = '#08001a';
      ctx.lineWidth = 1;
      for (let s = 0.2; s < 1; s += 0.15) {
        const mx = topX + (cpX - topX) * s + (endX - cpX) * s * s;
        const my = topY + (cpY - topY) * s + (endY - cpY) * s * s;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(angle + 1.2) * 12, my + 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(angle - 1.2) * 12, my + 8);
        ctx.stroke();
      }
    }
  });
}

function drawTitle(t) {
  if (!CONFIG.title) return;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.002);
  ctx.save();
  ctx.textAlign = 'center';

  // Main title
  ctx.font = 'bold 48px sans-serif';
  if (CONFIG.chromeText) {
    const grad = ctx.createLinearGradient(W * 0.3, H * 0.12, W * 0.7, H * 0.2);
    grad.addColorStop(0, CONFIG.sunColor3);
    grad.addColorStop(0.3, '#ffffff');
    grad.addColorStop(0.5, CONFIG.sunColor2);
    grad.addColorStop(0.7, '#ffffff');
    grad.addColorStop(1, CONFIG.sunColor1);
    ctx.fillStyle = grad;
  } else {
    ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.3 * pulse})`;
  }
  ctx.shadowColor = CONFIG.sunColor1;
  ctx.shadowBlur = 20 * pulse;
  ctx.fillText(CONFIG.title, W * 0.5, H * 0.18);

  // Subtitle
  ctx.font = '16px sans-serif';
  ctx.letterSpacing = '8px';
  ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.2 * pulse})`;
  ctx.shadowBlur = 10 * pulse;
  ctx.fillText(CONFIG.subtitle, W * 0.5, H * 0.24);

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawScanlines() {
  if (CONFIG.scanlineOpacity <= 0) return;
  for (let y = 0; y < H; y += 3) {
    ctx.fillStyle = `rgba(0,0,0,${CONFIG.scanlineOpacity})`;
    ctx.fillRect(0, y, W, 1);
  }
}

// Shooting star effect
let shootingStar = null;
function updateShootingStar(t) {
  if (!shootingStar && Math.random() < 0.002) {
    shootingStar = {
      x: Math.random() * W * 0.7, y: Math.random() * H * 0.2,
      vx: 4 + Math.random() * 6, vy: 1 + Math.random() * 3,
      life: 1, decay: 0.015, len: 50 + Math.random() * 80,
    };
  }
  if (shootingStar) {
    shootingStar.x += shootingStar.vx;
    shootingStar.y += shootingStar.vy;
    shootingStar.life -= shootingStar.decay;
    if (shootingStar.life <= 0) { shootingStar = null; return; }
    const s = shootingStar;
    const grad = ctx.createLinearGradient(
      s.x - s.vx * s.len / 5, s.y - s.vy * s.len / 5, s.x, s.y
    );
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, `rgba(255,255,255,${s.life * 0.7})`);
    ctx.beginPath();
    ctx.moveTo(s.x - s.vx * s.len / 5, s.y - s.vy * s.len / 5);
    ctx.lineTo(s.x, s.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function animate(t) {
  ctx.fillStyle = CONFIG.bgTop;
  ctx.fillRect(0, 0, W, H);

  drawSky();
  drawStars(t);
  updateShootingStar(t);
  drawSun(t);
  drawMountains();
  drawGrid(t);
  drawPalms(t);
  drawTitle(t);
  drawScanlines();

  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Impact', 'Arial Black', sans-serif; background: #0a0a0a; }
.scene { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.cosmos { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #1a0533 0%, #0a0a2e 40%, #000 100%); }
.stars { position: absolute; inset: 0; }
.star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.brain-container { position: relative; z-index: 5; margin-bottom: 40px; }
.brain { font-size: 200px; filter: drop-shadow(0 0 0px transparent); transition: all 1s ease; }
.brain.glow1 { filter: drop-shadow(0 0 20px rgba(108,92,231,0.5)); }
.brain.glow2 { filter: drop-shadow(0 0 40px rgba(253,121,168,0.6)) drop-shadow(0 0 80px rgba(108,92,231,0.4)); }
.brain.glow3 { filter: drop-shadow(0 0 60px rgba(253,203,110,0.7)) drop-shadow(0 0 120px rgba(253,121,168,0.5)) drop-shadow(0 0 200px rgba(108,92,231,0.3)); }
.rings { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.ring { position: absolute; border: 2px solid rgba(108,92,231,0.3); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; }
.ring.show { opacity: 1; animation: expandRing 2s ease-out; }
@keyframes expandRing { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
.text-block { position: relative; z-index: 10; text-align: center; max-width: 800px; padding: 0 40px; }
.main-text { font-size: 44px; color: white; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 20px rgba(108,92,231,0.5); opacity: 0; transform: translateY(20px); line-height: 1.3; }
.main-text.show { opacity: 1; transform: translateY(0); transition: all 0.6s ease; }
.sub-text { font-size: 24px; color: rgba(255,255,255,0.5); margin-top: 16px; letter-spacing: 5px; opacity: 0; }
.sub-text.show { opacity: 1; transition: opacity 0.5s ease 0.3s; }
.nebula { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(80px); opacity: 0; transition: opacity 2s ease; }
.nebula1 { top: 10%; left: -10%; background: #6c5ce7; }
.nebula2 { bottom: 10%; right: -10%; background: #fd79a8; }
.nebula.show { opacity: 0.3; }
</style>
</head>
<body>
<script>
const CONFIG = {
  mainText: 'When you finally understand the universe',
  subText: 'GALAXY BRAIN MOMENT',
  brainEmoji: '\u{1F9E0}',
  bgColor: '#0a0a0a',
  glowColor1: '#6c5ce7',
  glowColor2: '#fd79a8',
  textColor: '#ffffff',
  fontSize: 44,
  animationSpeed: 500
};
</script>
<div class="scene" id="scene">
  <div class="cosmos">
    <div class="stars" id="stars"></div>
  </div>
  <div class="nebula nebula1" id="neb1"></div>
  <div class="nebula nebula2" id="neb2"></div>
  <div class="brain-container">
    <div class="rings">
      <div class="ring" id="r1" style="width:300px;height:300px"></div>
      <div class="ring" id="r2" style="width:400px;height:400px"></div>
      <div class="ring" id="r3" style="width:500px;height:500px"></div>
    </div>
    <span class="brain" id="brain"></span>
  </div>
  <div class="text-block">
    <div class="main-text" id="mainText"></div>
    <div class="sub-text" id="subText"></div>
  </div>
</div>
<script>
// Generate stars
var starsEl = document.getElementById('stars');
for (var i = 0; i < 100; i++) {
  var s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = Math.random() * 3 + 's';
  s.style.width = s.style.height = (Math.random() * 3 + 1) + 'px';
  starsEl.appendChild(s);
}

document.getElementById('brain').textContent = CONFIG.brainEmoji;
document.getElementById('mainText').textContent = CONFIG.mainText;
document.getElementById('subText').textContent = CONFIG.subText;
document.getElementById('mainText').style.color = CONFIG.textColor;
document.getElementById('mainText').style.fontSize = CONFIG.fontSize + 'px';

var speed = CONFIG.animationSpeed;
setTimeout(function() {
  document.getElementById('brain').classList.add('glow1');
  document.getElementById('neb1').classList.add('show');
}, speed);
setTimeout(function() {
  document.getElementById('brain').classList.add('glow2');
  document.getElementById('r1').classList.add('show');
}, speed * 2);
setTimeout(function() {
  document.getElementById('brain').classList.add('glow3');
  document.getElementById('neb2').classList.add('show');
  document.getElementById('r2').classList.add('show');
}, speed * 3);
setTimeout(function() {
  document.getElementById('mainText').classList.add('show');
  document.getElementById('r3').classList.add('show');
}, speed * 4);
setTimeout(function() {
  document.getElementById('subText').classList.add('show');
}, speed * 5);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hologram Flicker - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a14; font-family: 'Arial', sans-serif; position: relative; }
  body::after { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
    background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,200,255,0.08) 1px, rgba(0,200,255,0.08) 2px); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }

  @keyframes holoIn { 0% { opacity: 0; transform: translate(-50%,-50%) scaleY(0.1); filter: blur(4px); } 20% { opacity: 0.5; } 40% { opacity: 0.2; } 60% { opacity: 0.8; transform: translate(-50%,-50%) scaleY(1.05); filter: blur(0); } 80% { opacity: 0.5; } 100% { opacity: 0.8; transform: translate(-50%,-50%) scaleY(1); } }
  @keyframes holoOut { 0% { opacity: 0.8; } 30% { opacity: 0.2; } 50% { opacity: 0.6; } 70% { opacity: 0.1; } 100% { opacity: 0; transform: translate(-50%,-50%) scaleY(0.1); filter: blur(4px); } }
  @keyframes holoFlicker { 0% { opacity: 0.8; } 10% { opacity: 0.5; } 20% { opacity: 0.9; } 30% { opacity: 0.6; } 40% { opacity: 0.85; } 50% { opacity: 0.4; } 60% { opacity: 0.9; } 70% { opacity: 0.7; } 80% { opacity: 0.85; } 90% { opacity: 0.5; } 100% { opacity: 0.8; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['HOLOGRAM','SIGNAL','TRANSMIT','DECODE','VIRTUAL','RENDER','MATRIX','UPLOAD'],
  bgColor: '#0a0a14',
  fontFamily: "'Arial', sans-serif",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const holoColors = ['#00ffff','#00ddff','#00ff88','#44ffdd','#00ccff','#22ffaa','#00eeff','#33ffcc'];

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 73 + 29);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(30 + rng() * 22, cellW * 0.38, cellH * 0.5);
    const color = holoColors[i % holoColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    el.textContent = word;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};font-weight:300;color:${color};text-shadow:0 0 10px ${color},0 0 20px ${color},0 -2px 0 rgba(255,0,100,0.3),0 2px 0 rgba(0,100,255,0.3);letter-spacing:8px;text-transform:uppercase;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=300, inD=500, hold=3000, outS=200, outD=500, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`holoIn ${inD}ms steps(8) forwards, holoFlicker 1.5s steps(10) infinite ${inD}ms`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`holoOut ${outD}ms steps(8) forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

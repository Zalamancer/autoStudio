<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Chemistry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #f0f2f5;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
  const CONFIG = {
    bgColor: '#f0f2f5',
    gridColor: 'rgba(180,190,205,0.15)',
    gridSize: 40,
    testTubeColors: ['#22c55e', '#3b82f6', '#a855f7'],
    flaskColor: '#06b6d4',
    bunsenFlameColor1: '#ff6b2b',
    bunsenFlameColor2: '#ffd700',
    bubbleSpeed: 1.5,
    bubbleCount: 8,
    moleculeColor: '#64748b',
    moleculeNodeColor: '#ef4444',
    formulaColor: '#1e293b',
    dataReadoutColor: '#10b981',
    beakerLiquidColor: '#8b5cf6',
    beakerFillSpeed: 0.0003,
    elementHighlights: ['H', 'O', 'C', 'N', 'Fe', 'Na', 'Cl', 'Ca']
  };

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  let frame = 0;
  let time = 0;

  // Bubbles for test tubes
  class Bubble {
    constructor(tubeX, tubeBottom, tubeTop, color) {
      this.reset(tubeX, tubeBottom, tubeTop, color);
    }
    reset(tubeX, tubeBottom, tubeTop, color) {
      this.x = tubeX + (Math.random() - 0.5) * 16;
      this.y = tubeBottom;
      this.top = tubeTop;
      this.r = 2 + Math.random() * 4;
      this.speed = 0.5 + Math.random() * CONFIG.bubbleSpeed;
      this.wobble = Math.random() * Math.PI * 2;
      this.color = color;
      this.alpha = 0.4 + Math.random() * 0.4;
    }
    update() {
      this.y -= this.speed;
      this.wobble += 0.05;
      this.x += Math.sin(this.wobble) * 0.5;
      return this.y > this.top;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.color.replace(')', `,${this.alpha})`).replace('rgb', 'rgba');
      ctx.fill();
      // Highlight
      ctx.beginPath();
      ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.alpha * 0.6})`;
      ctx.fill();
    }
  }

  // Test tube positions
  const tubes = [
    { x: W * 0.15, liquidY: 0.6, color: CONFIG.testTubeColors[0] },
    { x: W * 0.30, liquidY: 0.55, color: CONFIG.testTubeColors[1] },
    { x: W * 0.45, liquidY: 0.65, color: CONFIG.testTubeColors[2] }
  ];

  const bubbles = [];
  tubes.forEach(t => {
    for (let i = 0; i < CONFIG.bubbleCount; i++) {
      const bot = H * 0.82;
      const top = H * t.liquidY;
      bubbles.push(new Bubble(t.x, top + Math.random() * (bot - top), top, t.color));
      bubbles[bubbles.length - 1]._tube = t;
    }
  });

  // Molecules
  const molecules = [];
  for (let i = 0; i < 5; i++) {
    molecules.push({
      x: W * 0.55 + Math.random() * W * 0.4,
      y: H * 0.1 + Math.random() * H * 0.35,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01,
      scale: 0.6 + Math.random() * 0.5,
      drift: { x: (Math.random() - 0.5) * 0.3, y: (Math.random() - 0.5) * 0.2 }
    });
  }

  // Chemical formulas
  const formulas = ['H\u2082O', 'CO\u2082', 'NaCl', 'C\u2086H\u2081\u2082O\u2086', 'NH\u2083', 'H\u2082SO\u2084'];
  let formulaIdx = 0;
  let formulaAlpha = 0;
  let formulaTimer = 0;

  // Data readout values
  const readouts = [
    { label: 'TEMP', value: 23.4, unit: '\u00b0C', target: 37.2 },
    { label: 'pH', value: 7.0, unit: '', target: 4.5 },
    { label: 'PRESSURE', value: 101.3, unit: 'kPa', target: 115.8 }
  ];

  // Beaker fill level
  let beakerFill = 0;
  let beakerDir = 1;

  function drawGrid() {
    ctx.strokeStyle = CONFIG.gridColor;
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += CONFIG.gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += CONFIG.gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawTestTube(x, liquidY, color) {
    const top = H * 0.45;
    const bot = H * 0.85;
    const w = 28;
    const liquidTop = H * liquidY + Math.sin(time * 2) * 3;

    // Glass tube
    ctx.strokeStyle = 'rgba(100,116,139,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, top);
    ctx.lineTo(x - w / 2, bot - 14);
    ctx.quadraticCurveTo(x - w / 2, bot, x, bot);
    ctx.quadraticCurveTo(x + w / 2, bot, x + w / 2, bot - 14);
    ctx.lineTo(x + w / 2, top);
    ctx.stroke();

    // Liquid
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 2, liquidTop);
    // Wavy surface
    for (let i = 0; i <= w - 4; i++) {
      const wx = x - w / 2 + 2 + i;
      const wy = liquidTop + Math.sin(time * 3 + i * 0.3) * 2;
      ctx.lineTo(wx, wy);
    }
    ctx.lineTo(x + w / 2 - 2, bot - 14);
    ctx.quadraticCurveTo(x + w / 2 - 2, bot - 2, x, bot - 2);
    ctx.quadraticCurveTo(x - w / 2 + 2, bot - 2, x - w / 2 + 2, bot - 14);
    ctx.closePath();
    const grad = ctx.createLinearGradient(x - w / 2, liquidTop, x + w / 2, bot);
    grad.addColorStop(0, color + 'bb');
    grad.addColorStop(1, color + 'dd');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    // Rim highlight
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(x - w / 2, top, 3, bot - top - 14);

    // Tube rim
    ctx.strokeStyle = 'rgba(100,116,139,0.5)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 - 3, top);
    ctx.lineTo(x + w / 2 + 3, top);
    ctx.stroke();
  }

  function drawFlask(x, y) {
    const neckW = 16;
    const neckH = 50;
    const bodyR = 55;
    const bodyY = y + neckH;

    // Flask body
    ctx.strokeStyle = 'rgba(100,116,139,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - neckW / 2, y);
    ctx.lineTo(x - neckW / 2, y + neckH);
    ctx.lineTo(x - bodyR, bodyY + bodyR * 0.6);
    ctx.quadraticCurveTo(x - bodyR, bodyY + bodyR * 1.2, x, bodyY + bodyR * 1.2);
    ctx.quadraticCurveTo(x + bodyR, bodyY + bodyR * 1.2, x + bodyR, bodyY + bodyR * 0.6);
    ctx.lineTo(x + neckW / 2, y + neckH);
    ctx.lineTo(x + neckW / 2, y);
    ctx.stroke();

    // Swirling liquid
    const swirl = time * 1.5;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, bodyY + bodyR * 0.4, bodyR * 0.85, 0, Math.PI * 2);
    ctx.clip();

    const lgrad = ctx.createRadialGradient(
      x + Math.cos(swirl) * 20, bodyY + bodyR * 0.4 + Math.sin(swirl) * 15, 5,
      x, bodyY + bodyR * 0.4, bodyR * 0.8
    );
    lgrad.addColorStop(0, CONFIG.flaskColor + 'cc');
    lgrad.addColorStop(0.5, CONFIG.flaskColor + '88');
    lgrad.addColorStop(1, CONFIG.flaskColor + '44');
    ctx.fillStyle = lgrad;
    ctx.fillRect(x - bodyR, bodyY - bodyR * 0.2, bodyR * 2, bodyR * 1.6);
    ctx.restore();
  }

  function drawMolecule(mol) {
    ctx.save();
    ctx.translate(mol.x, mol.y);
    ctx.rotate(mol.rotation);
    ctx.scale(mol.scale, mol.scale);

    // Hexagonal ring
    const hexR = 30;
    const nodes = [];
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 2;
      nodes.push({ x: Math.cos(a) * hexR, y: Math.sin(a) * hexR });
    }

    // Bonds
    ctx.strokeStyle = CONFIG.moleculeColor;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(nodes[(i + 1) % 6].x, nodes[(i + 1) % 6].y);
      ctx.stroke();
      // Double bonds on alternating
      if (i % 2 === 0) {
        const dx = nodes[(i + 1) % 6].x - nodes[i].x;
        const dy = nodes[(i + 1) % 6].y - nodes[i].y;
        const nx = -dy * 0.12, ny = dx * 0.12;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x + nx, nodes[i].y + ny);
        ctx.lineTo(nodes[(i + 1) % 6].x + nx, nodes[(i + 1) % 6].y + ny);
        ctx.stroke();
      }
    }

    // Atom nodes
    nodes.forEach((n, i) => {
      ctx.beginPath();
      ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 === 0 ? CONFIG.moleculeNodeColor : CONFIG.moleculeColor;
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 7px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(i % 2 === 0 ? 'C' : 'H', n.x, n.y);
    });

    ctx.restore();
  }

  function drawBunsenBurner(x, y) {
    // Base
    ctx.fillStyle = '#475569';
    ctx.fillRect(x - 20, y, 40, 10);
    ctx.fillRect(x - 8, y - 70, 16, 70);

    // Barrel
    ctx.fillStyle = '#64748b';
    ctx.fillRect(x - 10, y - 70, 20, 50);

    // Flame
    const flicker = Math.sin(time * 15) * 3;
    const flameH = 45 + Math.sin(time * 8) * 8;
    // Outer flame
    const fgrad = ctx.createRadialGradient(x + flicker, y - 70 - flameH * 0.5, 2, x, y - 70, flameH);
    fgrad.addColorStop(0, CONFIG.bunsenFlameColor2 + 'ee');
    fgrad.addColorStop(0.4, CONFIG.bunsenFlameColor1 + 'cc');
    fgrad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = fgrad;
    ctx.beginPath();
    ctx.moveTo(x - 12, y - 70);
    ctx.quadraticCurveTo(x - 15 + flicker, y - 70 - flameH * 0.6, x + flicker * 0.5, y - 70 - flameH);
    ctx.quadraticCurveTo(x + 15 + flicker, y - 70 - flameH * 0.6, x + 12, y - 70);
    ctx.fill();
    // Inner flame (blue)
    ctx.fillStyle = 'rgba(59,130,246,0.6)';
    ctx.beginPath();
    ctx.moveTo(x - 5, y - 70);
    ctx.quadraticCurveTo(x - 4 + flicker * 0.3, y - 70 - flameH * 0.35, x, y - 70 - flameH * 0.5);
    ctx.quadraticCurveTo(x + 4 + flicker * 0.3, y - 70 - flameH * 0.35, x + 5, y - 70);
    ctx.fill();
  }

  function drawBeaker(x, y) {
    const w = 60, h = 70;
    beakerFill += CONFIG.beakerFillSpeed * beakerDir;
    if (beakerFill > 0.85) beakerDir = -1;
    if (beakerFill < 0.1) beakerDir = 1;

    // Glass
    ctx.strokeStyle = 'rgba(100,116,139,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - w / 2, y, w, h);
    // Spout
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.lineTo(x - w / 2 - 8, y - 5);
    ctx.stroke();

    // Liquid
    const fillH = h * beakerFill;
    const liqTop = y + h - fillH;
    const lgrad = ctx.createLinearGradient(x, liqTop, x, y + h);
    lgrad.addColorStop(0, CONFIG.beakerLiquidColor + '99');
    lgrad.addColorStop(1, CONFIG.beakerLiquidColor + 'dd');
    ctx.fillStyle = lgrad;
    ctx.fillRect(x - w / 2 + 2, liqTop, w - 4, fillH - 2);

    // Measurement lines
    ctx.strokeStyle = 'rgba(100,116,139,0.2)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      const my = y + h - (h * i / 5);
      ctx.beginPath();
      ctx.moveTo(x - w / 2 + 4, my);
      ctx.lineTo(x - w / 2 + 14, my);
      ctx.stroke();
      ctx.fillStyle = 'rgba(100,116,139,0.3)';
      ctx.font = '8px sans-serif';
      ctx.fillText(i * 50 + '', x - w / 2 + 16, my + 3);
    }
  }

  function drawDataReadouts() {
    const panelX = W * 0.6;
    const panelY = H * 0.55;

    readouts.forEach((r, i) => {
      const ry = panelY + i * 65;
      // Animate value toward target
      r.value += (r.target - r.value) * 0.002;
      if (Math.abs(r.value - r.target) < 0.1) {
        r.target = r.label === 'TEMP' ? 20 + Math.random() * 20 :
                   r.label === 'pH' ? 3 + Math.random() * 8 :
                   95 + Math.random() * 30;
      }

      // Panel bg
      ctx.fillStyle = 'rgba(15,23,42,0.85)';
      ctx.beginPath();
      ctx.roundRect(panelX, ry, 150, 50, 6);
      ctx.fill();

      // Label
      ctx.fillStyle = 'rgba(148,163,184,0.8)';
      ctx.font = '10px monospace';
      ctx.fillText(r.label, panelX + 10, ry + 16);

      // Value
      ctx.fillStyle = CONFIG.dataReadoutColor;
      ctx.font = 'bold 20px monospace';
      ctx.fillText(r.value.toFixed(1) + r.unit, panelX + 10, ry + 40);

      // Activity dot
      ctx.beginPath();
      ctx.arc(panelX + 135, ry + 12, 4, 0, Math.PI * 2);
      ctx.fillStyle = Math.sin(time * 3 + i) > 0 ? CONFIG.dataReadoutColor : 'rgba(16,185,129,0.3)';
      ctx.fill();
    });
  }

  function drawFormula() {
    formulaTimer += 1 / 60;
    if (formulaTimer > 3) {
      formulaTimer = 0;
      formulaIdx = (formulaIdx + 1) % formulas.length;
    }
    formulaAlpha = formulaTimer < 0.5 ? formulaTimer * 2 :
                   formulaTimer > 2.5 ? (3 - formulaTimer) * 2 : 1;

    ctx.save();
    ctx.globalAlpha = formulaAlpha;
    ctx.fillStyle = CONFIG.formulaColor;
    ctx.font = 'bold 32px serif';
    ctx.textAlign = 'center';
    ctx.fillText(formulas[formulaIdx], W * 0.5, H * 0.12);
    ctx.restore();
  }

  function drawPeriodicElements() {
    const startX = W * 0.58;
    const startY = H * 0.15;
    const size = 36;
    const gap = 4;

    CONFIG.elementHighlights.forEach((el, i) => {
      const col = i % 4;
      const row = Math.floor(i / 4);
      const ex = startX + col * (size + gap);
      const ey = startY + row * (size + gap);
      const pulse = 0.7 + 0.3 * Math.sin(time * 2 + i * 0.8);

      ctx.fillStyle = `rgba(59,130,246,${0.1 * pulse})`;
      ctx.beginPath();
      ctx.roundRect(ex, ey, size, size, 4);
      ctx.fill();
      ctx.strokeStyle = `rgba(59,130,246,${0.3 * pulse})`;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = `rgba(30,41,59,${0.7 * pulse})`;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(el, ex + size / 2, ey + size / 2);
    });
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function update() {
    frame++;
    time = frame / 60;

    molecules.forEach(m => {
      m.rotation += m.rotSpeed;
      m.x += m.drift.x;
      m.y += m.drift.y;
      if (m.x < W * 0.4 || m.x > W * 1.05) m.drift.x *= -1;
      if (m.y < -30 || m.y > H * 0.5) m.drift.y *= -1;
    });

    bubbles.forEach(b => {
      if (!b.update()) {
        const t = b._tube;
        b.reset(t.x, H * 0.82, H * t.liquidY, t.color);
      }
    });
  }

  function draw() {
    ctx.fillStyle = CONFIG.bgColor;
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawFormula();
    drawPeriodicElements();
    tubes.forEach(t => drawTestTube(t.x, t.liquidY, t.color));
    bubbles.forEach(b => b.draw());
    drawFlask(W * 0.15, H * 0.15);
    drawBunsenBurner(W * 0.82, H * 0.85);
    drawBeaker(W * 0.82, H * 0.55);
    molecules.forEach(m => drawMolecule(m));
    drawDataReadouts();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>

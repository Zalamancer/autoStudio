<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sci-Fi HUD - Kinetic Typography</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #020810; font-family: 'Consolas', 'Courier New', monospace; position: relative; }
  body::after { content:''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,200,255,0.1) 2px, rgba(0,200,255,0.1) 3px); }
  #stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .word-block { position: absolute; white-space: nowrap; line-height: 1; opacity: 0; will-change: transform, opacity; user-select: none; }
  .hud-bracket { position: absolute; pointer-events: none; z-index: 1; }
  .hud-bracket svg { width: 100%; height: 100%; }

  @keyframes hudScan { 0% { opacity: 0; clip-path: inset(50% 0 50% 0); } 50% { opacity: 1; clip-path: inset(0% 0 0% 0); } 100% { opacity: 1; clip-path: inset(0% 0 0% 0); } }
  @keyframes hudOff { 0% { opacity: 1; clip-path: inset(0% 0 0% 0); } 50% { clip-path: inset(48% 0 48% 0); } 100% { opacity: 0; clip-path: inset(50% 0 50% 0); } }
  @keyframes hudPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes scanLine { 0% { top: -2px; } 100% { top: 100%; } }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CONFIG = {
  words: ['TARGETING','SCAN MODE','ALERT LV.5','OVERRIDE','SECTOR 7G','LOCK ON','SYSTEM OK','ENGAGED'],
  bgColor: '#020810',
  fontFamily: "'Consolas', 'Courier New', monospace",
  cycleDuration: 10000,
};

document.body.style.backgroundColor = CONFIG.bgColor;
const stage = document.getElementById('stage');
const W = () => window.innerWidth, H = () => window.innerHeight;

function seededRandom(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

const hudColors = ['#00e5ff','#00bcd4','#00e676','#00e5ff','#76ff03','#00e5ff','#00bcd4','#00e676'];

function build() {
  stage.innerHTML = '';
  const els = [], n = CONFIG.words.length;
  // Adaptive grid: works for both landscape and portrait
    const pad = { x: W() * 0.05, y: H() * 0.05 };
    const usableW = W() - pad.x * 2, usableH = H() - pad.y * 2;
    const aspect = usableW / usableH;
    const cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
    const rows = Math.ceil(n / cols);
    const cellW = usableW / cols, cellH = usableH / rows;

  CONFIG.words.forEach((word, i) => {
    const rng = seededRandom(i * 47 + 13);
    const col = i % cols, row = Math.floor(i / cols);
    const size = Math.min(26 + rng() * 18, cellW * 0.38, cellH * 0.5);
    const color = hudColors[i % hudColors.length];
    const el = document.createElement('div'); el.className = 'word-block';
    const bracket = `<span style="opacity:0.4;margin-right:6px">[</span>${word}<span style="opacity:0.4;margin-left:6px">]</span>`;
    el.innerHTML = bracket;
    el.style.cssText = `font-size:${size}px;font-family:${CONFIG.fontFamily};color:${color};text-shadow:0 0 8px ${color},0 0 16px rgba(0,229,255,0.2);letter-spacing:3px;text-transform:uppercase;left:${pad.x+col*cellW+cellW/2}px;top:${pad.y+row*cellH+cellH/2}px;transform:translate(-50%,-50%);`;
    stage.appendChild(el); els.push(el);
  });
  return els;
}

function runAnimation(els) {
  const n=els.length, inS=250, inD=450, hold=3000, outS=180, outD=400, pause=800;
  const tIn=(n-1)*inS+inD, tOut=(n-1)*outS+outD;
  let af, st;
  function reset(){els.forEach(e=>{e.style.animation='none';e.style.opacity='0';});}
  function tick(ts){
    if(!st)st=ts;const e=ts-st;
    if(e<tIn){els.forEach((el,i)=>{if(e>=i*inS&&!el.dataset.i){el.dataset.i='1';el.style.animation=`hudScan ${inD}ms ease-out forwards, hudPulse 2s ease-in-out infinite ${inD}ms`;}});}
    else if(e<tIn+hold){}
    else if(e<tIn+hold+tOut){const oe=e-tIn-hold;els.forEach((el,i)=>{if(oe>=i*outS&&!el.dataset.o){el.dataset.o='1';el.style.animation=`hudOff ${outD}ms ease-in forwards`;}});}
    else if(e<tIn+hold+tOut+pause){}
    else{reset();els.forEach(el=>{delete el.dataset.i;delete el.dataset.o;});st=ts;}
    af=requestAnimationFrame(tick);
  }
  reset();af=requestAnimationFrame(tick);
}

let els=build();runAnimation(els);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{els=build();runAnimation(els);},300);});
</script>
</body>
</html>

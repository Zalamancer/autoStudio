<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Trivia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }
  .bg {
    width: 100%; height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
  }

  /* Top bar: score + timer */
  .top-bar {
    position: absolute;
    top: 3vh;
    left: 5vw;
    right: 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(-2vh);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .top-bar.visible { opacity: 1; transform: translateY(0); }

  .score-box {
    display: flex;
    align-items: center;
    gap: 1vw;
    font-size: 2.2vh;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .score-icon {
    width: 3.5vh; height: 3.5vh;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8vh;
    font-weight: 900;
  }
  .score-value {
    font-variant-numeric: tabular-nums;
  }

  .timer-container {
    display: flex;
    align-items: center;
    gap: 1.2vw;
  }
  .timer-label {
    font-size: 1.6vh;
    font-weight: 600;
    opacity: 0.7;
    letter-spacing: 0.08em;
  }
  .timer-bar-outer {
    width: 22vw;
    height: 1vh;
    background: rgba(255,255,255,0.1);
    border-radius: 0.5vh;
    overflow: hidden;
  }
  .timer-bar-inner {
    height: 100%;
    border-radius: 0.5vh;
    width: 100%;
    transition: width 0.1s linear;
  }

  /* Progress dots */
  .progress-dots {
    position: absolute;
    top: 9vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.2vw;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .progress-dots.visible { opacity: 1; }
  .dot {
    width: 1.2vh; height: 1.2vh;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  }
  .dot.done {
    background: rgba(255,255,255,0.5);
  }
  .dot.active {
    transform: scale(1.4);
  }

  /* Category tag */
  .category-tag {
    position: absolute;
    top: 14vh;
    left: 50%;
    transform: translateX(-50%) translateY(1vh);
    font-size: 1.5vh;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.6vh 2vw;
    border-radius: 2vh;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .category-tag.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Question card */
  .question-card {
    width: 82vw;
    max-width: 82vw;
    padding: 3.5vh 4vw;
    border-radius: 2.5vh;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    position: relative;
    margin-top: 5vh;
    opacity: 0;
    transform: scale(0.92) translateY(2vh);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .question-card.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  .question-number {
    font-size: 1.4vh;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1.5vh;
    opacity: 0.5;
  }
  .question-text {
    font-size: 3vh;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }

  /* Options grid */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.8vh 2vw;
    width: 82vw;
    max-width: 82vw;
    margin-top: 3vh;
  }
  .option-card {
    display: flex;
    align-items: center;
    gap: 1.5vw;
    padding: 2.2vh 2.5vw;
    border-radius: 1.5vh;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.08);
    cursor: default;
    opacity: 0;
    transform: translateX(-3vw);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
  }
  .option-card.visible {
    opacity: 1;
    transform: translateX(0);
  }
  .option-card.correct {
    background: rgba(46, 213, 115, 0.15);
    border-color: rgba(46, 213, 115, 0.6);
    box-shadow: 0 0 3vh rgba(46, 213, 115, 0.3);
  }
  .option-card.wrong {
    background: rgba(255, 71, 87, 0.08);
    border-color: rgba(255, 71, 87, 0.25);
    opacity: 0.4;
  }
  .option-letter {
    width: 4vh; height: 4vh;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8vh;
    font-weight: 800;
    flex-shrink: 0;
    background: rgba(255,255,255,0.08);
    transition: background 0.5s ease, color 0.3s ease;
  }
  .option-card.correct .option-letter {
    background: rgba(46, 213, 115, 0.85);
    color: #fff;
  }
  .option-card.wrong .option-letter {
    background: rgba(255, 71, 87, 0.45);
    color: rgba(255,255,255,0.5);
  }
  .option-text {
    font-size: 2vh;
    font-weight: 600;
    line-height: 1.3;
  }

  /* Correct checkmark icon inside option */
  .option-result-icon {
    margin-left: auto;
    font-size: 2.2vh;
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .option-card.correct .option-result-icon,
  .option-card.wrong .option-result-icon {
    opacity: 1;
    transform: scale(1);
  }

  /* Result indicator */
  .result-indicator {
    position: absolute;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%) translateY(1vh);
    font-size: 2vh;
    font-weight: 800;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    display: flex;
    align-items: center;
    gap: 1vw;
  }
  .result-indicator.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .result-check {
    width: 3.2vh; height: 3.2vh;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6vh;
    font-weight: 900;
  }

  /* Exit fade */
  .bg.exiting {
    transition: opacity 0.8s ease;
    opacity: 0;
  }
</style>
</head>
<body>
<div class="bg" id="bg">
  <!-- Floating particles -->
  <div id="particles"></div>

  <!-- Top bar -->
  <div class="top-bar" id="topBar">
    <div class="score-box">
      <div class="score-icon" id="scoreIcon">&#9733;</div>
      <span class="score-value" id="scoreValue">0</span>
    </div>
    <div class="timer-container">
      <span class="timer-label">TIME</span>
      <div class="timer-bar-outer">
        <div class="timer-bar-inner" id="timerBar"></div>
      </div>
    </div>
  </div>

  <!-- Progress dots -->
  <div class="progress-dots" id="progressDots"></div>

  <!-- Category tag -->
  <div class="category-tag" id="categoryTag"></div>

  <!-- Question card -->
  <div class="question-card" id="questionCard">
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
  </div>

  <!-- Options -->
  <div class="options-grid" id="optionsGrid"></div>

  <!-- Result indicator -->
  <div class="result-indicator" id="resultIndicator">
    <div class="result-check" id="resultCheck">&#10003;</div>
    <span id="resultText">CORRECT!</span>
  </div>
</div>

<script>
  // === EDITABLE CONFIG ===
  const CONFIG = {
    question: 'Which planet is known as the Red Planet?',
    options: ['Venus', 'Mars', 'Jupiter', 'Saturn'],
    correctIndex: 1,
    category: 'SCIENCE',
    questionNumber: 3,
    totalQuestions: 10,
    score: 2400,
    bgColor: '#0b0e1a',
    accentColor: '#6c5ce7',
    correctColor: '#2ed573',
    wrongColor: '#ff4757',
    cycleDuration: 14000
  };

  const LETTERS = ['A', 'B', 'C', 'D'];
  var cycleTimer = null;
  var timerRaf = null;

  // --- DOM refs ---
  var bgEl = document.getElementById('bg');
  var topBar = document.getElementById('topBar');
  var scoreIcon = document.getElementById('scoreIcon');
  var scoreValue = document.getElementById('scoreValue');
  var timerBar = document.getElementById('timerBar');
  var progressDots = document.getElementById('progressDots');
  var categoryTag = document.getElementById('categoryTag');
  var questionCard = document.getElementById('questionCard');
  var questionNumber = document.getElementById('questionNumber');
  var questionText = document.getElementById('questionText');
  var optionsGrid = document.getElementById('optionsGrid');
  var resultIndicator = document.getElementById('resultIndicator');
  var resultCheck = document.getElementById('resultCheck');
  var resultText = document.getElementById('resultText');
  var particlesContainer = document.getElementById('particles');

  // --- Helpers ---
  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function lightenHex(hex, amount) {
    var r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
    var g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
    var b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
    return '#' + [r, g, b].map(function(c) { return c.toString(16).padStart(2, '0'); }).join('');
  }

  // --- Theme ---
  function applyTheme() {
    var bg = CONFIG.bgColor;
    var accent = CONFIG.accentColor;
    bgEl.style.background = 'linear-gradient(135deg, ' + bg + ' 0%, ' + lightenHex(bg, 12) + ' 50%, ' + bg + ' 100%)';
    timerBar.style.background = 'linear-gradient(90deg, ' + accent + ', ' + lightenHex(accent, 40) + ')';
    scoreIcon.style.background = hexToRgba(accent, 0.2);
    scoreIcon.style.color = accent;
    categoryTag.style.background = hexToRgba(accent, 0.12);
    categoryTag.style.color = lightenHex(accent, 50);
    categoryTag.style.border = '1px solid ' + hexToRgba(accent, 0.25);
    resultCheck.style.background = hexToRgba(CONFIG.correctColor, 0.85);
    resultText.style.color = CONFIG.correctColor;
  }

  // --- Particles ---
  function createParticles() {
    particlesContainer.innerHTML = '';
    for (var i = 0; i < 18; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = Math.random() * 1.2 + 0.4;
      p.style.width = size + 'vh';
      p.style.height = size + 'vh';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.background = hexToRgba(CONFIG.accentColor, Math.random() * 0.12 + 0.04);
      particlesContainer.appendChild(p);
      animateParticle(p);
    }
  }

  function animateParticle(p) {
    var dur = Math.random() * 6000 + 4000;
    var dx = (Math.random() - 0.5) * 8;
    var dy = -Math.random() * 12 - 4;
    var start = performance.now();
    function step(now) {
      var t = ((now - start) % dur) / dur;
      var ease = Math.sin(t * Math.PI);
      p.style.opacity = ease * 0.35;
      p.style.transform = 'translate(' + (dx * t) + 'vw, ' + (dy * t) + 'vh)';
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // --- Build progress dots ---
  function buildDots() {
    progressDots.innerHTML = '';
    for (var i = 0; i < CONFIG.totalQuestions; i++) {
      var dot = document.createElement('div');
      dot.className = 'dot';
      if (i < CONFIG.questionNumber - 1) {
        dot.classList.add('done');
      }
      if (i === CONFIG.questionNumber - 1) {
        dot.classList.add('active');
        dot.style.background = CONFIG.accentColor;
        dot.style.boxShadow = '0 0 1.5vh ' + hexToRgba(CONFIG.accentColor, 0.5);
      }
      progressDots.appendChild(dot);
    }
  }

  // --- Build option cards ---
  function buildOptions() {
    optionsGrid.innerHTML = '';
    CONFIG.options.forEach(function(opt, i) {
      var card = document.createElement('div');
      card.className = 'option-card';
      card.id = 'option-' + i;
      var checkmark = i === CONFIG.correctIndex ? '&#10003;' : '&#10007;';
      card.innerHTML =
        '<div class="option-letter">' + LETTERS[i] + '</div>' +
        '<div class="option-text">' + opt + '</div>' +
        '<div class="option-result-icon">' + checkmark + '</div>';
      optionsGrid.appendChild(card);
    });
  }

  // --- Timer animation ---
  function animateTimer(duration, startTime) {
    if (timerRaf) cancelAnimationFrame(timerRaf);
    function step(now) {
      var elapsed = now - startTime;
      var pct = Math.max(0, 1 - elapsed / duration);
      timerBar.style.width = (pct * 100) + '%';
      if (pct > 0) {
        timerRaf = requestAnimationFrame(step);
      }
    }
    timerRaf = requestAnimationFrame(step);
  }

  // --- Score counter animation ---
  function animateScore(from, to, duration) {
    var start = performance.now();
    function step(now) {
      var t = Math.min((now - start) / duration, 1);
      var ease = 1 - Math.pow(1 - t, 3);
      scoreValue.textContent = Math.round(from + (to - from) * ease).toLocaleString();
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // --- Reset ---
  function resetAll() {
    bgEl.classList.remove('exiting');
    bgEl.style.opacity = '1';
    topBar.classList.remove('visible');
    progressDots.classList.remove('visible');
    categoryTag.classList.remove('visible');
    questionCard.classList.remove('visible');
    resultIndicator.classList.remove('visible');
    if (timerRaf) cancelAnimationFrame(timerRaf);
    timerBar.style.width = '100%';
    timerBar.style.transition = 'none';

    document.querySelectorAll('.option-card').forEach(function(c) {
      c.classList.remove('visible', 'correct', 'wrong');
    });
  }

  // --- Main cycle ---
  function runCycle() {
    resetAll();
    applyTheme();
    createParticles();
    buildDots();
    buildOptions();

    // Populate content
    categoryTag.textContent = CONFIG.category;
    questionNumber.textContent = 'QUESTION ' + CONFIG.questionNumber + ' OF ' + CONFIG.totalQuestions;
    questionText.textContent = CONFIG.question;
    scoreValue.textContent = CONFIG.score.toLocaleString();

    // ---- Animation timeline ----
    // 0.0s - 1.5s  : Intro (top bar, dots, category, question)
    // 1.5s - 3.5s  : Options slide in one by one
    // 3.5s - 8.5s  : Timer countdown (5 seconds)
    // 8.5s - 9.5s  : Reveal correct / mark wrong
    // 9.5s - 11s   : Score bump + result badge
    // 11s  - end   : Hold then fade out

    var timerDuration = 5000;

    // Phase 1: Intro
    setTimeout(function() { topBar.classList.add('visible'); }, 200);
    setTimeout(function() { progressDots.classList.add('visible'); }, 400);
    setTimeout(function() { categoryTag.classList.add('visible'); }, 650);
    setTimeout(function() { questionCard.classList.add('visible'); }, 950);

    // Phase 2: Options slide in staggered
    var optionCards = document.querySelectorAll('.option-card');
    optionCards.forEach(function(card, i) {
      setTimeout(function() {
        card.classList.add('visible');
      }, 1600 + i * 280);
    });

    // Phase 3: Timer starts
    setTimeout(function() {
      timerBar.style.transition = 'width 0.1s linear';
      animateTimer(timerDuration, performance.now());
    }, 3500);

    // Phase 4: Reveal answers
    setTimeout(function() {
      optionCards.forEach(function(card, i) {
        if (i === CONFIG.correctIndex) {
          card.classList.add('correct');
        } else {
          card.classList.add('wrong');
        }
      });
    }, 8500);

    // Phase 5: Result + score
    setTimeout(function() {
      resultIndicator.classList.add('visible');
      animateScore(CONFIG.score, CONFIG.score + 300, 800);
    }, 9800);

    // Phase 6: Exit fade
    setTimeout(function() {
      bgEl.classList.add('exiting');
    }, CONFIG.cycleDuration - 1500);

    // Loop
    cycleTimer = setTimeout(function() {
      runCycle();
    }, CONFIG.cycleDuration);
  }

  // --- PostMessage bridge for live CONFIG updates ---
  window.addEventListener('message', function(e) {
    if (e.data && typeof e.data === 'object') {
      var keys = Object.keys(e.data);
      for (var i = 0; i < keys.length; i++) {
        if (CONFIG.hasOwnProperty(keys[i])) {
          CONFIG[keys[i]] = e.data[keys[i]];
        }
      }
    }
  });

  // --- Start ---
  runCycle();
</script>
</body>
</html>

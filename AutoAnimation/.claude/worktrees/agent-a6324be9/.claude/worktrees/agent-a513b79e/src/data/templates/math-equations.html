<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Equations Motion Graphics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2a;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============ EDITABLE CONFIG ============
const CONFIG = {
  bgColor: '#1a1a2a',
  chalkColor: 'rgba(230, 230, 240, 0.85)',
  dimChalk: 'rgba(180, 180, 200, 0.3)',
  accentColor: '#88BBFF',
  graphColor: '#44DDAA',
  gridColor: 'rgba(60, 60, 90, 0.25)',
  shapeColor: 'rgba(255, 180, 60, 0.7)',
  labelColor: 'rgba(200, 200, 220, 0.5)',
  typeSpeed: 8,
  equations: [
    'E = mc\u00B2',
    'a\u00B2 + b\u00B2 = c\u00B2',
    '\u222Bf(x)dx',
    'F = ma',
    'e^{i\u03C0} + 1 = 0',
    '\u2207 \u00D7 E = -\u2202B/\u2202t',
    '\u2211_{n=1}^{\u221E} 1/n\u00B2 = \u03C0\u00B2/6',
    'PV = nRT'
  ],
  graphFunctions: [
    { fn: Math.sin, name: 'sin(x)', color: '#44DDAA' },
    { fn: Math.cos, name: 'cos(x)', color: '#DD44AA' },
    { fn: (x) => Math.exp(-x*x/4), name: 'e^(-x\u00B2/4)', color: '#AADD44' }
  ]
};
// =========================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function drawChalkboardBg() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Subtle chalk dust texture
  for (let i = 0; i < 80; i++) {
    const x = (Math.sin(i * 47.3) * 0.5 + 0.5) * W;
    const y = (Math.cos(i * 31.7) * 0.5 + 0.5) * H;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200, 200, 220, 0.03)';
    ctx.fill();
  }

  // Grid lines
  ctx.strokeStyle = CONFIG.gridColor;
  ctx.lineWidth = 0.5;
  const gridSize = 50;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawEquations() {
  const totalCycle = CONFIG.equations.length * 4;
  const cycleT = time % totalCycle;
  const eqIdx = Math.floor(cycleT / 4) % CONFIG.equations.length;
  const eqPhase = (cycleT % 4); // 0-4 seconds per equation

  // Current equation typing
  const eq = CONFIG.equations[eqIdx];
  const charsVisible = Math.floor(eqPhase * CONFIG.typeSpeed);
  const visibleText = eq.substring(0, Math.min(charsVisible, eq.length));

  // Position in top-right area
  const eqX = W * 0.65;
  const eqY = H * 0.15;

  // Glow behind text
  if (visibleText.length > 0) {
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';

    // Shadow glow
    ctx.shadowColor = CONFIG.accentColor;
    ctx.shadowBlur = 15;
    ctx.fillStyle = CONFIG.chalkColor;
    ctx.fillText(visibleText, eqX, eqY);
    ctx.shadowBlur = 0;

    // Cursor blink
    if (charsVisible < eq.length) {
      const cursorAlpha = Math.sin(time * 8) > 0 ? 0.8 : 0;
      const textW = ctx.measureText(visibleText).width;
      ctx.fillStyle = `rgba(230, 230, 240, ${cursorAlpha})`;
      ctx.fillRect(eqX + textW / 2 + 2, eqY - 25, 2, 30);
    }
  }

  // Faded previous equations stacked
  for (let i = 1; i <= 3; i++) {
    const prevIdx = (eqIdx - i + CONFIG.equations.length) % CONFIG.equations.length;
    const prevEq = CONFIG.equations[prevIdx];
    const fadeAlpha = 0.15 - i * 0.04;
    if (fadeAlpha > 0) {
      ctx.font = `${24 - i * 3}px Courier New`;
      ctx.fillStyle = `rgba(180, 180, 200, ${fadeAlpha})`;
      ctx.textAlign = 'center';
      ctx.fillText(prevEq, eqX, eqY + i * 40);
    }
  }
}

function drawGraph() {
  const graphX = W * 0.08;
  const graphY = H * 0.35;
  const graphW = W * 0.38;
  const graphH = H * 0.35;
  const centerX = graphX + graphW / 2;
  const centerY = graphY + graphH / 2;

  // Axes
  ctx.strokeStyle = CONFIG.dimChalk;
  ctx.lineWidth = 1.5;

  // X-axis
  ctx.beginPath();
  ctx.moveTo(graphX, centerY);
  ctx.lineTo(graphX + graphW, centerY);
  ctx.stroke();

  // Y-axis
  ctx.beginPath();
  ctx.moveTo(centerX, graphY);
  ctx.lineTo(centerX, graphY + graphH);
  ctx.stroke();

  // Axis arrows
  ctx.font = '10px Courier New';
  ctx.fillStyle = CONFIG.dimChalk;
  ctx.textAlign = 'center';
  ctx.fillText('x', graphX + graphW - 5, centerY + 15);
  ctx.fillText('y', centerX + 12, graphY + 10);

  // Tick marks
  const scaleX = graphW / 12;
  const scaleY = graphH / 4;
  for (let i = -6; i <= 6; i++) {
    if (i === 0) continue;
    const tx = centerX + i * scaleX;
    ctx.beginPath();
    ctx.moveTo(tx, centerY - 3);
    ctx.lineTo(tx, centerY + 3);
    ctx.strokeStyle = 'rgba(120, 120, 150, 0.3)';
    ctx.stroke();
  }

  // Animated function plot
  const funcCycle = (time * 0.3) % CONFIG.graphFunctions.length;
  const funcIdx = Math.floor(funcCycle);
  const func = CONFIG.graphFunctions[funcIdx];
  const plotProgress = Math.min(1, (time * 0.8) % 3 / 2);
  const maxX = plotProgress * 6;

  ctx.beginPath();
  ctx.lineWidth = 2;
  ctx.strokeStyle = func.color;

  let started = false;
  for (let px = -6; px <= maxX; px += 0.05) {
    const screenX = centerX + px * scaleX;
    const val = func.fn(px + time * 0.5);
    const screenY = centerY - val * scaleY;

    if (screenX < graphX || screenX > graphX + graphW) continue;
    if (screenY < graphY || screenY > graphY + graphH) continue;

    if (!started) {
      ctx.moveTo(screenX, screenY);
      started = true;
    } else {
      ctx.lineTo(screenX, screenY);
    }
  }
  ctx.stroke();

  // Function label
  ctx.font = '12px Courier New';
  ctx.fillStyle = func.color;
  ctx.textAlign = 'left';
  ctx.fillText(`y = ${func.name}`, graphX + 8, graphY + 16);

  // Moving dot on curve
  const dotX = Math.sin(time * 0.8) * 4;
  const dotVal = func.fn(dotX + time * 0.5);
  const dotScreenX = centerX + dotX * scaleX;
  const dotScreenY = centerY - dotVal * scaleY;

  if (dotScreenX >= graphX && dotScreenX <= graphX + graphW) {
    ctx.beginPath();
    ctx.arc(dotScreenX, dotScreenY, 4, 0, Math.PI * 2);
    ctx.fillStyle = func.color;
    ctx.fill();

    // Coordinate readout
    ctx.font = '9px Courier New';
    ctx.fillStyle = CONFIG.labelColor;
    ctx.fillText(`(${dotX.toFixed(1)}, ${dotVal.toFixed(2)})`, dotScreenX + 8, dotScreenY - 8);
  }
}

function drawGeometricShapes() {
  const shapePhase = (time * 0.4) % 3;
  const baseX = W * 0.6;
  const baseY = H * 0.55;

  if (shapePhase < 1) {
    // Triangle constructing
    const progress = Math.min(1, shapePhase * 1.5);
    const size = 80;

    const ax = baseX;
    const ay = baseY - size * 0.7;
    const bx = baseX - size * 0.6;
    const by = baseY + size * 0.5;
    const cx = baseX + size * 0.6;
    const cy = baseY + size * 0.5;

    ctx.strokeStyle = CONFIG.shapeColor;
    ctx.lineWidth = 1.5;

    // Draw sides progressively
    ctx.beginPath();
    if (progress > 0) {
      ctx.moveTo(ax, ay);
      const p1 = Math.min(1, progress * 3);
      ctx.lineTo(ax + (bx - ax) * p1, ay + (by - ay) * p1);
    }
    ctx.stroke();

    if (progress > 0.33) {
      ctx.beginPath();
      ctx.moveTo(bx, by);
      const p2 = Math.min(1, (progress - 0.33) * 3);
      ctx.lineTo(bx + (cx - bx) * p2, by + (cy - by) * p2);
      ctx.stroke();
    }

    if (progress > 0.66) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      const p3 = Math.min(1, (progress - 0.66) * 3);
      ctx.lineTo(cx + (ax - cx) * p3, cy + (ay - cy) * p3);
      ctx.stroke();
    }

    // Labels
    if (progress > 0.8) {
      ctx.font = '10px Courier New';
      ctx.fillStyle = CONFIG.shapeColor;
      ctx.textAlign = 'center';
      ctx.fillText('a', (ax + bx) / 2 - 12, (ay + by) / 2);
      ctx.fillText('b', (bx + cx) / 2, by + 15);
      ctx.fillText('c', (cx + ax) / 2 + 12, (cy + ay) / 2);

      // Right angle marker
      const rSize = 8;
      ctx.beginPath();
      ctx.moveTo(bx + rSize, by);
      ctx.lineTo(bx + rSize, by - rSize);
      ctx.lineTo(bx, by - rSize);
      ctx.strokeStyle = 'rgba(255, 180, 60, 0.4)';
      ctx.stroke();
    }

  } else if (shapePhase < 2) {
    // Circle constructing
    const progress = Math.min(1, (shapePhase - 1) * 1.5);
    const r = 55;

    ctx.beginPath();
    ctx.arc(baseX, baseY, r, 0, Math.PI * 2 * progress);
    ctx.strokeStyle = CONFIG.shapeColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Radius line
    if (progress > 0.3) {
      const radAngle = time * 0.5;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.lineTo(baseX + Math.cos(radAngle) * r, baseY + Math.sin(radAngle) * r);
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = 'rgba(255, 180, 60, 0.5)';
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '10px Courier New';
      ctx.fillStyle = CONFIG.shapeColor;
      ctx.textAlign = 'center';
      ctx.fillText('r', baseX + Math.cos(radAngle) * r / 2 + 8, baseY + Math.sin(radAngle) * r / 2);
    }

    if (progress > 0.7) {
      ctx.font = '10px Courier New';
      ctx.fillStyle = CONFIG.labelColor;
      ctx.textAlign = 'center';
      ctx.fillText('A = \u03C0r\u00B2', baseX, baseY + r + 20);
      ctx.fillText('C = 2\u03C0r', baseX, baseY + r + 34);
    }

    // Center dot
    ctx.beginPath();
    ctx.arc(baseX, baseY, 2, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.shapeColor;
    ctx.fill();

  } else {
    // Square with diagonal
    const progress = Math.min(1, (shapePhase - 2) * 1.5);
    const size = 80;
    const sx = baseX - size / 2;
    const sy = baseY - size / 2;

    ctx.strokeStyle = CONFIG.shapeColor;
    ctx.lineWidth = 1.5;

    // Draw sides
    const totalPerim = size * 4;
    const drawnPerim = progress * totalPerim;

    ctx.beginPath();
    // Top
    const topLen = Math.min(size, drawnPerim);
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + topLen, sy);
    // Right
    if (drawnPerim > size) {
      const rightLen = Math.min(size, drawnPerim - size);
      ctx.lineTo(sx + size, sy + rightLen);
    }
    // Bottom
    if (drawnPerim > size * 2) {
      const botLen = Math.min(size, drawnPerim - size * 2);
      ctx.lineTo(sx + size - botLen, sy + size);
    }
    // Left
    if (drawnPerim > size * 3) {
      const leftLen = Math.min(size, drawnPerim - size * 3);
      ctx.lineTo(sx, sy + size - leftLen);
    }
    ctx.stroke();

    // Diagonal
    if (progress > 0.8) {
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + size, sy + size);
      ctx.strokeStyle = 'rgba(255, 180, 60, 0.4)';
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '10px Courier New';
      ctx.fillStyle = CONFIG.shapeColor;
      ctx.textAlign = 'center';
      ctx.fillText('a', baseX, sy - 8);
      ctx.fillText('a', sx + size + 12, baseY);
      ctx.fillText('a\u221A2', baseX + 8, baseY + 8);
    }
  }
}

function drawFloatingFormulas() {
  const formulas = [
    { text: '\u03C0 \u2248 3.14159', x: 0.12, y: 0.12 },
    { text: '\u221A2 \u2248 1.414', x: 0.85, y: 0.88 },
    { text: 'i\u00B2 = -1', x: 0.9, y: 0.15 },
    { text: '\u03C6 = 1.618...', x: 0.15, y: 0.88 },
    { text: '\u2200x \u2203y', x: 0.45, y: 0.92 },
    { text: 'lim x\u21920', x: 0.78, y: 0.45 }
  ];

  formulas.forEach((f, i) => {
    const fadePhase = Math.sin(time * 0.3 + i * 1.5) * 0.5 + 0.5;
    const bobY = Math.sin(time * 0.5 + i * 2) * 5;
    ctx.font = '11px Courier New';
    ctx.fillStyle = `rgba(140, 150, 180, ${0.08 + fadePhase * 0.12})`;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, W * f.x, H * f.y + bobY);
  });
}

function drawIntegralAnimation() {
  const integX = W * 0.15;
  const integY = H * 0.75;
  const integW = W * 0.3;
  const integH = H * 0.15;

  // Mini axes
  ctx.strokeStyle = 'rgba(100, 100, 130, 0.3)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(integX, integY);
  ctx.lineTo(integX + integW, integY);
  ctx.stroke();

  // Shaded area under curve (filling animation)
  const fillProgress = (time * 0.4) % 2 < 1 ? (time * 0.4) % 1 : 1;
  const maxFillX = integX + integW * fillProgress;

  ctx.beginPath();
  ctx.moveTo(integX, integY);
  for (let px = integX; px <= maxFillX; px += 2) {
    const t = (px - integX) / integW;
    const val = Math.sin(t * Math.PI * 2) * integH * 0.6 + Math.sin(t * Math.PI) * integH * 0.3;
    ctx.lineTo(px, integY - Math.abs(val));
  }
  ctx.lineTo(maxFillX, integY);
  ctx.closePath();
  ctx.fillStyle = 'rgba(68, 221, 170, 0.1)';
  ctx.fill();

  // Curve line
  ctx.beginPath();
  for (let px = integX; px <= integX + integW; px += 2) {
    const t = (px - integX) / integW;
    const val = Math.sin(t * Math.PI * 2) * integH * 0.6 + Math.sin(t * Math.PI) * integH * 0.3;
    if (px === integX) ctx.moveTo(px, integY - Math.abs(val));
    else ctx.lineTo(px, integY - Math.abs(val));
  }
  ctx.strokeStyle = CONFIG.graphColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = '10px Courier New';
  ctx.fillStyle = CONFIG.labelColor;
  ctx.textAlign = 'center';
  ctx.fillText('\u222B f(x) dx', integX + integW / 2, integY + 18);
}

function draw() {
  drawChalkboardBg();
  drawFloatingFormulas();
  drawGraph();
  drawEquations();
  drawGeometricShapes();
  drawIntegralAnimation();

  // Title watermark
  ctx.font = '10px Courier New';
  ctx.fillStyle = 'rgba(100, 110, 140, 0.3)';
  ctx.textAlign = 'right';
  ctx.fillText('MATHEMATICS', W - 20, H - 15);

  time += 1 / 60;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

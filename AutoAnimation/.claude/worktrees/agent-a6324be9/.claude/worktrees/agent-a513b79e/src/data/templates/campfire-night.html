<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: Georgia, serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 80%, transparent 20%, rgba(0,0,0,0.6) 100%); }
  .center-text { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2; text-align: center; color: #F0D8B0; pointer-events: none; }
  .center-text h1 { font-size: 46px; font-weight: 400; letter-spacing: 10px; font-style: italic;
    text-shadow: 0 0 30px rgba(255,140,50,0.3); animation: firePulse 4s ease-in-out infinite; }
  .center-text .subtitle { font-size: 12px; letter-spacing: 6px; opacity: 0.4; margin-top: 10px; }
  @keyframes firePulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="center-text">
  <h1 id="titleEl">Campfire</h1>
  <div class="subtitle" id="subEl">Under the Stars</div>
</div>
<script>
const CONFIG = {
  titleText: 'Campfire',
  subtitleText: 'Under the Stars',
  skyColor: '#060810',
  groundColor: '#0a0808',
  fireColor1: '#FF6600',
  fireColor2: '#FFAA00',
  fireColor3: '#FF3300',
  emberCount: 40,
  starCount: 100,
  treeCount: 6,
};

window.addEventListener('message', e => {
  if (e.data?.type === 'CONFIG_UPDATE') { Object.assign(CONFIG, e.data.config); applyConfig(); }
});
function applyConfig() {
  document.getElementById('titleEl').textContent = CONFIG.titleText;
  document.getElementById('subEl').textContent = CONFIG.subtitleText;
}
applyConfig();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

const stars = [];
for (let i = 0; i < CONFIG.starCount; i++) {
  stars.push({
    x: Math.random() * 2000, y: Math.random() * 0.55,
    r: Math.random() * 1.5 + 0.3, phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.008 + 0.003,
  });
}

const embers = [];
for (let i = 0; i < CONFIG.emberCount; i++) {
  embers.push({
    x: 0, y: 0, size: Math.random() * 2 + 0.5,
    speedY: Math.random() * 1.5 + 0.5,
    drift: (Math.random() - 0.5) * 1,
    wobble: Math.random() * Math.PI * 2,
    life: 0, maxLife: Math.random() * 120 + 60,
    opacity: Math.random() * 0.6 + 0.3,
  });
}

const fireParticles = [];
for (let i = 0; i < 30; i++) {
  fireParticles.push({
    x: 0, y: 0, size: Math.random() * 8 + 4,
    speed: Math.random() * 2 + 1,
    life: 0, maxLife: Math.random() * 30 + 15,
    offset: (Math.random() - 0.5) * 20,
  });
}

const trees = [];
for (let i = 0; i < CONFIG.treeCount; i++) {
  trees.push({
    x: (i < 3) ? innerWidth * (0.05 + i * 0.08) : innerWidth * (0.7 + (i - 3) * 0.08),
    h: 80 + Math.random() * 120,
    w: 15 + Math.random() * 10,
  });
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  g.addColorStop(0, CONFIG.skyColor);
  g.addColorStop(1, '#0a0a15');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t) {
  stars.forEach(s => {
    s.phase += s.speed;
    const twinkle = 0.2 + 0.4 * Math.abs(Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(s.x % W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(230,230,255,${twinkle})`;
    ctx.fill();
  });
}

function drawGround() {
  const gy = H * 0.75;
  const g = ctx.createLinearGradient(0, gy - 20, 0, H);
  g.addColorStop(0, '#0a0a08');
  g.addColorStop(1, CONFIG.groundColor);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 6) {
    const bump = Math.sin(x * 0.008) * 10 + Math.sin(x * 0.02) * 3;
    ctx.lineTo(x, gy + bump);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawTrees() {
  trees.forEach(t => {
    const by = H * 0.75 + Math.sin(t.x * 0.008) * 10;
    ctx.fillStyle = 'rgba(5,5,5,0.9)';
    ctx.fillRect(t.x - 2, by - t.h * 0.3, 4, t.h * 0.3);
    for (let l = 0; l < 5; l++) {
      const ly = by - t.h * (0.3 + l * 0.14);
      const lw = t.w * (1 - l * 0.15);
      ctx.beginPath();
      ctx.moveTo(t.x, ly - t.h * 0.15);
      ctx.lineTo(t.x - lw, ly);
      ctx.lineTo(t.x + lw, ly);
      ctx.closePath();
      ctx.fillStyle = 'rgba(5,8,5,0.9)';
      ctx.fill();
    }
  });
}

function drawFireGlow(t) {
  const fc1 = hexRgb(CONFIG.fireColor1);
  const fireX = W * 0.5, fireY = H * 0.75;
  const flicker = 0.8 + 0.2 * Math.sin(t * 0.008) * Math.sin(t * 0.013);
  const glow1 = ctx.createRadialGradient(fireX, fireY, 0, fireX, fireY, W * 0.35 * flicker);
  glow1.addColorStop(0, `rgba(${fc1[0]},${fc1[1]},${fc1[2]},0.06)`);
  glow1.addColorStop(0.5, `rgba(${fc1[0]},${Math.floor(fc1[1] * 0.5)},0,0.02)`);
  glow1.addColorStop(1, 'transparent');
  ctx.fillStyle = glow1;
  ctx.fillRect(0, 0, W, H);
  const glow2 = ctx.createRadialGradient(fireX, fireY, 0, fireX, fireY, 80 * flicker);
  glow2.addColorStop(0, 'rgba(255,200,80,0.15)');
  glow2.addColorStop(0.5, `rgba(${fc1[0]},${fc1[1]},0,0.08)`);
  glow2.addColorStop(1, 'transparent');
  ctx.fillStyle = glow2;
  ctx.beginPath(); ctx.arc(fireX, fireY, 80 * flicker, 0, Math.PI * 2); ctx.fill();
}

function drawFire(t) {
  const fireX = W * 0.5, fireY = H * 0.75;
  const colors = [CONFIG.fireColor3, CONFIG.fireColor1, CONFIG.fireColor2];
  fireParticles.forEach(p => {
    p.life++;
    if (p.life > p.maxLife) {
      p.life = 0;
      p.x = fireX + (Math.random() - 0.5) * 15;
      p.y = fireY;
      p.offset = (Math.random() - 0.5) * 20;
      p.maxLife = Math.random() * 30 + 15;
    }
    const progress = p.life / p.maxLife;
    const py = p.y - p.speed * p.life;
    const px = p.x + Math.sin(p.life * 0.2) * p.offset * progress;
    const s = p.size * (1 - progress * 0.7);
    const colorIdx = Math.min(2, Math.floor(progress * 3));
    const c = hexRgb(colors[colorIdx]);
    const a = (1 - progress) * 0.5;
    ctx.beginPath();
    ctx.arc(px, py, s, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    ctx.fill();
  });
  // Log silhouettes
  ctx.fillStyle = 'rgba(20,10,5,0.8)';
  ctx.save();
  ctx.translate(fireX, fireY + 5);
  ctx.rotate(-0.3);
  ctx.fillRect(-20, -3, 40, 6);
  ctx.restore();
  ctx.save();
  ctx.translate(fireX, fireY + 5);
  ctx.rotate(0.25);
  ctx.fillRect(-22, -3, 44, 6);
  ctx.restore();
}

function drawEmbers(t) {
  const fc = hexRgb(CONFIG.fireColor2);
  const fireX = W * 0.5, fireY = H * 0.75;
  embers.forEach(e => {
    e.life++;
    if (e.life > e.maxLife) {
      e.life = 0;
      e.x = fireX + (Math.random() - 0.5) * 30;
      e.y = fireY - 10;
      e.maxLife = Math.random() * 120 + 60;
    }
    e.wobble += 0.03;
    e.y -= e.speedY;
    e.x += e.drift + Math.sin(e.wobble) * 0.5;
    const progress = e.life / e.maxLife;
    const a = e.opacity * (1 - progress);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size * (1 - progress * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${fc[0]},${fc[1]},${fc[2]},${a})`;
    ctx.fill();
  });
}

function animate(t) {
  drawSky();
  drawStars(t);
  drawFireGlow(t);
  drawGround();
  drawTrees();
  drawFire(t);
  drawEmbers(t);
  requestAnimationFrame(animate);
}
animate(0);
</script>
</body>
</html>

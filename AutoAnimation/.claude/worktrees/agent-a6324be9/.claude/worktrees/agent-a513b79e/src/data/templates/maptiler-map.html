<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapTiler Map</title>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v2/maptiler-sdk.css" rel="stylesheet" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Source+Sans+3:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e17;
    color: #e0e8f0;
    font-family: 'Source Sans 3', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #map {
    width: 100vw;
    height: 100vh;
  }

  /* Header overlay */
  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0.6) 70%, transparent 100%);
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  #header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #4fc3f7, #81d4fa, #b3e5fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #header .subtitle {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    color: rgba(79,195,247,0.6);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  #header .coords {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: #4fc3f7;
    letter-spacing: 2px;
    opacity: 0.7;
    text-align: right;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: opacity 0.4s ease;
  }

  .ctrl-btn {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(79,195,247,0.25);
    background: rgba(8,18,35,0.85);
    color: #81d4fa;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .ctrl-btn:hover {
    background: rgba(79,195,247,0.15);
    border-color: #4fc3f7;
    box-shadow: 0 0 10px rgba(79,195,247,0.2);
  }

  /* Loading screen */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #0a0e17;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.6s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading h2 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 6px;
    color: #4fc3f7;
    text-transform: uppercase;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 2px solid rgba(79,195,247,0.15);
    border-top-color: #4fc3f7;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hide default MapTiler UI elements */
  .maplibregl-ctrl-top-left,
  .maplibregl-ctrl-top-right,
  .maplibregl-ctrl-bottom-left,
  .maplibregl-ctrl-bottom-right {
    display: none !important;
  }

  /* Custom marker style */
  .maptiler-marker {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 12px rgba(0,0,0,0.4), 0 0 20px var(--marker-color, #4fc3f7);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .maptiler-marker:hover {
    transform: scale(1.3);
  }

  .marker-label {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  /* Popup styling */
  .maplibregl-popup-content {
    background: rgba(8,18,35,0.92) !important;
    border: 1px solid rgba(79,195,247,0.35) !important;
    border-radius: 8px !important;
    padding: 12px 16px !important;
    color: #e0e8f0 !important;
    font-family: 'Source Sans 3', sans-serif !important;
    font-size: 13px !important;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 12px rgba(79,195,247,0.15) !important;
    backdrop-filter: blur(12px);
  }
  .maplibregl-popup-tip {
    border-top-color: rgba(8,18,35,0.92) !important;
  }
  .maplibregl-popup-close-button {
    color: #4fc3f7 !important;
    font-size: 18px !important;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>Loading Map</h2>
</div>

<div id="header">
  <div>
    <h1 id="mapTitle">MapTiler Map</h1>
    <div class="subtitle" id="mapSubtitle"></div>
  </div>
  <div class="coords" id="coordsDisplay">LAT 0.00° · LON 0.00°</div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="zoomIn" title="Zoom In">+</button>
  <button class="ctrl-btn" id="zoomOut" title="Zoom Out">−</button>
  <button class="ctrl-btn" id="resetBtn" title="Reset View">⟲</button>
</div>

<div id="map"></div>

<script>
// ─── CONFIG (AI-editable fields) ───
var CONFIG = {
  // MapTiler API key
  apiKey: 'fpF5klX6zPBvoCSt2vV8',

  // Map style: satellite, streets, topo, ocean, winter, outdoor, dataviz, basic
  mapStyle: 'satellite',

  // Initial camera position
  center: [0, 20],        // [lng, lat]
  zoom: 2,                // 0-22
  pitch: 0,               // camera tilt 0-85
  bearing: 0,             // camera rotation 0-360

  // 3D terrain
  terrain3D: false,

  // Projection: mercator or globe
  projection: 'mercator',

  // Overlay text
  title: 'MapTiler Map',
  subtitle: '',

  // ── Frame-synced animation commands ──
  // Each command: { frame, action, params }
  // Actions: flyTo, addMarker, removeMarker, clearMarkers, drawRoute, clearRoutes,
  //          setStyle, set3DTerrain, setPitch, setBearing, addPopup, removePopups,
  //          fitBounds, setProjection, hideUI, showUI
  commands: [],

  // -1 = interactive mode, 1 = frame-synced
  frameSyncEnabled: -1,
};

// ─── State ───
var map = null;
var markers = {};         // { id: maplibregl.Marker }
var popups = {};          // { id: maplibregl.Popup }
var routeLayers = {};     // { id: { sourceId, layerId } }
var routeCounter = 0;
var commandIndex = 0;
var frameSyncActive = false;
var lastProcessedFrame = -1;
var mapReady = false;

// ─── Style mapping ───
var STYLE_MAP = {
  satellite: 'SATELLITE',
  streets: 'STREETS',
  topo: 'TOPO',
  ocean: 'OCEAN',
  winter: 'WINTER',
  outdoor: 'OUTDOOR',
  dataviz: 'DATAVIZ',
  basic: 'BASIC',
};

function getStyleEnum(styleName) {
  var key = (styleName || 'satellite').toLowerCase();
  return maptilersdk.MapStyle[STYLE_MAP[key] || 'SATELLITE'];
}

// ─── Initialize Map ───
function initMap() {
  maptilersdk.config.apiKey = CONFIG.apiKey;

  map = new maptilersdk.Map({
    container: 'map',
    style: getStyleEnum(CONFIG.mapStyle),
    center: CONFIG.center,
    zoom: CONFIG.zoom,
    pitch: CONFIG.pitch,
    bearing: CONFIG.bearing,
    attributionControl: false,
    navigationControl: false,
    geolocateControl: false,
    terrain: CONFIG.terrain3D,
    terrainExaggeration: CONFIG.terrain3D ? 1.5 : 0,
  });

  map.on('load', function() {
    mapReady = true;

    // Enable 3D terrain if configured
    if (CONFIG.terrain3D) {
      enableTerrain(1.5);
    }

    // Hide loading
    setTimeout(function() {
      document.getElementById('loading').classList.add('hidden');
    }, 300);

    // Process pre-loaded commands in interactive mode
    if (CONFIG.commands && CONFIG.commands.length > 0 && CONFIG.frameSyncEnabled === -1) {
      CONFIG.commands.forEach(function(cmd) { executeCommand(cmd); });
    }
  });

  // Update coordinate display on mouse move
  map.on('mousemove', function(e) {
    var lng = e.lngLat.lng;
    var lat = e.lngLat.lat;
    var latDir = lat >= 0 ? 'N' : 'S';
    var lonDir = lng >= 0 ? 'E' : 'W';
    document.getElementById('coordsDisplay').textContent =
      'LAT ' + Math.abs(lat).toFixed(2) + '\u00B0 ' + latDir +
      ' \u00B7 LON ' + Math.abs(lng).toFixed(2) + '\u00B0 ' + lonDir;
  });
}

// ─── Terrain helpers ───
function enableTerrain(exaggeration) {
  if (!map) return;
  try {
    map.enableTerrain(exaggeration || 1.5);
  } catch(e) {
    // Terrain may not be available for all styles
  }
}

function disableTerrain() {
  if (!map) return;
  try {
    map.disableTerrain();
  } catch(e) {}
}

// ─── Command Execution ───
function executeCommand(cmd) {
  if (!map || !mapReady) return;
  var action = cmd.action;
  var params = cmd.params || {};

  switch (action) {
    case 'flyTo':
      cmdFlyTo(params);
      break;
    case 'addMarker':
      cmdAddMarker(params);
      break;
    case 'removeMarker':
      cmdRemoveMarker(params);
      break;
    case 'clearMarkers':
      cmdClearMarkers();
      break;
    case 'drawRoute':
      cmdDrawRoute(params);
      break;
    case 'clearRoutes':
      cmdClearRoutes();
      break;
    case 'setStyle':
      cmdSetStyle(params);
      break;
    case 'set3DTerrain':
      cmdSet3DTerrain(params);
      break;
    case 'setPitch':
      cmdSetPitch(params);
      break;
    case 'setBearing':
      cmdSetBearing(params);
      break;
    case 'addPopup':
      cmdAddPopup(params);
      break;
    case 'removePopups':
      cmdRemovePopups();
      break;
    case 'fitBounds':
      cmdFitBounds(params);
      break;
    case 'setProjection':
      cmdSetProjection(params);
      break;
    case 'hideUI':
      cmdHideUI();
      break;
    case 'showUI':
      cmdShowUI();
      break;
  }
}

// ─── Command implementations ───

function cmdFlyTo(params) {
  var options = {
    center: [params.lng || 0, params.lat || 0],
    zoom: params.zoom !== undefined ? params.zoom : map.getZoom(),
    pitch: params.pitch !== undefined ? params.pitch : map.getPitch(),
    bearing: params.bearing !== undefined ? params.bearing : map.getBearing(),
    duration: params.duration || 2000,
    curve: params.curve || 1.42,
    essential: true,
  };
  map.flyTo(options);
}

function cmdAddMarker(params) {
  var id = params.id || ('marker-' + Date.now() + '-' + Math.random().toString(36).substr(2,4));
  var color = params.color || '#4fc3f7';

  // Remove existing marker with same id
  if (markers[id]) {
    markers[id].remove();
  }

  // Create custom marker element
  var el = document.createElement('div');
  el.className = 'maptiler-marker';
  el.style.backgroundColor = color;
  el.style.setProperty('--marker-color', color);

  // Add label if provided
  if (params.label) {
    var label = document.createElement('div');
    label.className = 'marker-label';
    label.textContent = params.label;
    el.appendChild(label);
  }

  var marker = new maptilersdk.Marker({ element: el })
    .setLngLat([params.lng || 0, params.lat || 0])
    .addTo(map);

  markers[id] = marker;
}

function cmdRemoveMarker(params) {
  var id = params.id;
  if (id && markers[id]) {
    markers[id].remove();
    delete markers[id];
  }
}

function cmdClearMarkers() {
  for (var id in markers) {
    markers[id].remove();
  }
  markers = {};
}

function cmdDrawRoute(params) {
  var id = params.id || ('route-' + (++routeCounter));
  var coordinates = params.coordinates || [];
  var color = params.color || '#4fc3f7';
  var width = params.width || 3;
  var animate = params.animate !== false;

  if (coordinates.length < 2) return;

  // Remove existing route with same id
  if (routeLayers[id]) {
    try {
      if (map.getLayer(routeLayers[id].layerId)) map.removeLayer(routeLayers[id].layerId);
      if (map.getLayer(routeLayers[id].glowLayerId)) map.removeLayer(routeLayers[id].glowLayerId);
      if (map.getSource(routeLayers[id].sourceId)) map.removeSource(routeLayers[id].sourceId);
    } catch(e) {}
  }

  var sourceId = 'route-source-' + id;
  var glowLayerId = 'route-glow-' + id;
  var layerId = 'route-line-' + id;

  var geojson = {
    type: 'Feature',
    properties: {},
    geometry: {
      type: 'LineString',
      coordinates: animate ? [coordinates[0]] : coordinates,
    }
  };

  map.addSource(sourceId, { type: 'geojson', data: geojson });

  // Glow layer
  map.addLayer({
    id: glowLayerId,
    type: 'line',
    source: sourceId,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: {
      'line-color': color,
      'line-width': width + 4,
      'line-opacity': 0.25,
      'line-blur': 4,
    }
  });

  // Main line layer
  map.addLayer({
    id: layerId,
    type: 'line',
    source: sourceId,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: {
      'line-color': color,
      'line-width': width,
      'line-opacity': 1,
    }
  });

  routeLayers[id] = { sourceId: sourceId, layerId: layerId, glowLayerId: glowLayerId };

  // Animate the route drawing
  if (animate && coordinates.length > 1) {
    var step = 0;
    var totalSteps = 60; // ~1 second at 60fps
    var timer = setInterval(function() {
      step++;
      var progress = Math.min(step / totalSteps, 1);
      var eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic

      // Interpolate along the full coordinate path
      var totalPoints = coordinates.length;
      var currentIndex = eased * (totalPoints - 1);
      var partialCoords = [];

      for (var i = 0; i <= Math.floor(currentIndex); i++) {
        partialCoords.push(coordinates[i]);
      }

      // Interpolate to the fractional position
      var frac = currentIndex - Math.floor(currentIndex);
      if (frac > 0 && Math.floor(currentIndex) + 1 < totalPoints) {
        var from = coordinates[Math.floor(currentIndex)];
        var to = coordinates[Math.floor(currentIndex) + 1];
        partialCoords.push([
          from[0] + (to[0] - from[0]) * frac,
          from[1] + (to[1] - from[1]) * frac
        ]);
      }

      if (partialCoords.length >= 2) {
        geojson.geometry.coordinates = partialCoords;
        try {
          var src = map.getSource(sourceId);
          if (src) src.setData(geojson);
        } catch(e) {}
      }

      if (progress >= 1) clearInterval(timer);
    }, 1000 / 60);
  }
}

function cmdClearRoutes() {
  for (var id in routeLayers) {
    try {
      if (map.getLayer(routeLayers[id].layerId)) map.removeLayer(routeLayers[id].layerId);
      if (map.getLayer(routeLayers[id].glowLayerId)) map.removeLayer(routeLayers[id].glowLayerId);
      if (map.getSource(routeLayers[id].sourceId)) map.removeSource(routeLayers[id].sourceId);
    } catch(e) {}
  }
  routeLayers = {};
}

function cmdSetStyle(params) {
  var styleName = params.style || 'satellite';
  try {
    map.setStyle(getStyleEnum(styleName));
  } catch(e) {}
}

function cmdSet3DTerrain(params) {
  if (params.enabled) {
    enableTerrain(params.exaggeration || 1.5);
  } else {
    disableTerrain();
  }
}

function cmdSetPitch(params) {
  var pitch = params.pitch !== undefined ? params.pitch : 0;
  var duration = params.duration || 1000;
  map.easeTo({ pitch: pitch, duration: duration });
}

function cmdSetBearing(params) {
  var bearing = params.bearing !== undefined ? params.bearing : 0;
  var duration = params.duration || 1000;
  map.easeTo({ bearing: bearing, duration: duration });
}

function cmdAddPopup(params) {
  var id = params.id || ('popup-' + Date.now());
  var html = params.html || '';

  // Remove existing popup with same id
  if (popups[id]) {
    popups[id].remove();
  }

  var popup = new maptilersdk.Popup({ closeOnClick: false, closeButton: true })
    .setLngLat([params.lng || 0, params.lat || 0])
    .setHTML(html)
    .addTo(map);

  popups[id] = popup;
}

function cmdRemovePopups() {
  for (var id in popups) {
    popups[id].remove();
  }
  popups = {};
}

function cmdFitBounds(params) {
  var bounds = params.bounds; // [[sw_lng, sw_lat], [ne_lng, ne_lat]]
  if (!bounds || bounds.length !== 2) return;
  var padding = params.padding || 50;
  map.fitBounds(bounds, { padding: padding, duration: 1500 });
}

function cmdSetProjection(params) {
  var type = params.type || 'mercator';
  try {
    map.setProjection({ type: type });
  } catch(e) {}
}

function cmdHideUI() {
  var header = document.getElementById('header');
  var controls = document.getElementById('controls');
  if (header) header.style.opacity = '0';
  if (controls) controls.style.opacity = '0';
}

function cmdShowUI() {
  var header = document.getElementById('header');
  var controls = document.getElementById('controls');
  if (header) header.style.opacity = '1';
  if (controls) controls.style.opacity = '1';
}

// ─── Frame Sync Handler ───
window.__onFrameUpdate = function(frame, playing, fps, total) {
  frameSyncActive = true;

  if (!mapReady) return;
  if (!CONFIG.commands || CONFIG.commands.length === 0) return;

  // Rewind detection: if frame jumped backwards, reset and replay
  if (frame < lastProcessedFrame) {
    lastProcessedFrame = -1;

    // Clear all dynamic content
    cmdClearMarkers();
    cmdClearRoutes();
    cmdRemovePopups();

    // Reset camera to initial position instantly
    map.jumpTo({
      center: CONFIG.center,
      zoom: CONFIG.zoom,
      pitch: CONFIG.pitch,
      bearing: CONFIG.bearing,
    });

    // Re-process commands from beginning up to current frame
    for (var i = 0; i < CONFIG.commands.length; i++) {
      var cmd = CONFIG.commands[i];
      if (cmd.frame !== undefined && cmd.frame <= frame) {
        executeCommand(cmd);
        lastProcessedFrame = cmd.frame;
      }
    }
    return;
  }

  // Process commands up to current frame
  for (var i = 0; i < CONFIG.commands.length; i++) {
    var cmd = CONFIG.commands[i];
    var cmdFrame = cmd.frame;
    if (cmdFrame === undefined || cmdFrame === null) continue;

    if (cmdFrame <= frame && cmdFrame > lastProcessedFrame) {
      executeCommand(cmd);
    }
  }

  lastProcessedFrame = frame;
};

// ─── Controls ───
document.getElementById('zoomIn').addEventListener('click', function() {
  if (map) map.zoomIn({ duration: 300 });
});
document.getElementById('zoomOut').addEventListener('click', function() {
  if (map) map.zoomOut({ duration: 300 });
});
document.getElementById('resetBtn').addEventListener('click', function() {
  if (map) {
    map.flyTo({
      center: CONFIG.center,
      zoom: CONFIG.zoom,
      pitch: CONFIG.pitch,
      bearing: CONFIG.bearing,
      duration: 1000,
    });
  }
});

// ─── Apply initial CONFIG ───
document.getElementById('mapTitle').textContent = CONFIG.title || 'MapTiler Map';
if (CONFIG.subtitle) {
  document.getElementById('mapSubtitle').textContent = CONFIG.subtitle;
}

// ─── Load SDK dynamically then init ───
(function() {
  var script = document.createElement('script');
  script.src = 'https://cdn.maptiler.com/maptiler-sdk-js/v2/maptiler-sdk.umd.min.js';
  script.onload = function() { initMap(); };
  script.onerror = function() {
    document.getElementById('loading').innerHTML =
      '<h2 style="color:#ff6b6b;font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:4px">FAILED TO LOAD MAP SDK</h2>';
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>

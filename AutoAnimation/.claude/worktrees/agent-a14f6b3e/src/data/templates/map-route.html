<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Map Route</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: #1a1a2e; }

  .map-container { width: 100%; height: 100%; position: relative; }

  canvas#mapCanvas { width: 100%; height: 100%; display: block; }

  .waypoint-label {
    position: absolute;
    font-size: 1.4vh;
    font-weight: 700;
    padding: 0.5vh 1vw;
    border-radius: 0.8vh;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px) scale(0.9);
    transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 10;
  }
  .waypoint-label.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .legend {
    position: absolute;
    bottom: 3vh;
    left: 3vw;
    display: flex;
    gap: 2vw;
    align-items: center;
    font-size: 1.2vh;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s, transform 0.6s;
  }
  .legend.visible { opacity: 1; transform: translateY(0); }
  .legend-item { display: flex; align-items: center; gap: 0.5vw; }
  .legend-dot { width: 1vh; height: 1vh; border-radius: 50%; }

  .distance-badge {
    position: absolute;
    top: 3vh;
    right: 3vw;
    font-size: 1.8vh;
    font-weight: 800;
    padding: 1vh 2vw;
    border-radius: 1vh;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.5s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .distance-badge.visible { opacity: 1; transform: scale(1); }

  .title-bar {
    position: absolute;
    top: 3vh;
    left: 3vw;
    font-size: 2.4vh;
    font-weight: 900;
    letter-spacing: 0.08em;
    opacity: 0;
    transform: translateX(-20px);
    transition: opacity 0.6s, transform 0.6s;
  }
  .title-bar.visible { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>
<div class="map-container">
  <canvas id="mapCanvas"></canvas>
  <div class="title-bar" id="titleBar">ROUTE MAP</div>
  <div class="distance-badge" id="distBadge"></div>
  <div class="legend" id="legend"></div>
</div>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  waypoints: [
    { x: 15, y: 25, label: 'Start: Downtown' },
    { x: 30, y: 55, label: 'Central Park' },
    { x: 55, y: 40, label: 'Tech District' },
    { x: 70, y: 65, label: 'Harbor View' },
    { x: 88, y: 35, label: 'Destination' }
  ],
  routeColor: '#00d4ff',
  vehicleColor: '#ff6b35',
  bgColor: '#1a1a2e',
  mapStyle: 'dark',
  cycleDuration: 14000
};

const isDark = CONFIG.mapStyle === 'dark';
const colors = {
  bg: CONFIG.bgColor,
  road: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
  grid: isDark ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.04)',
  building: isDark ? 'rgba(100,120,180,0.15)' : 'rgba(80,80,120,0.1)',
  buildingStroke: isDark ? 'rgba(100,120,180,0.25)' : 'rgba(80,80,120,0.15)',
  text: isDark ? '#e0e6f0' : '#2a2a3a',
  labelBg: isDark ? 'rgba(10,14,30,0.9)' : 'rgba(255,255,255,0.95)',
  labelBorder: isDark ? 'rgba(100,120,180,0.3)' : 'rgba(0,0,0,0.1)',
  water: isDark ? 'rgba(0,100,200,0.08)' : 'rgba(0,120,220,0.06)',
  tree: isDark ? 'rgba(0,180,100,0.15)' : 'rgba(0,160,80,0.12)',
};

document.body.style.background = colors.bg;

const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
let W, H;
const labels = [];
let animFrame;
let cycleStart = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Pseudo-random seeded generator for consistent map features
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const rng = seededRandom(42);

// Generate map features
const buildings = [];
const trees = [];
const waterBodies = [];

for (let i = 0; i < 35; i++) {
  buildings.push({
    x: rng() * 100, y: rng() * 100,
    w: 1.5 + rng() * 3, h: 1.5 + rng() * 3,
    rotation: rng() * 0.3 - 0.15
  });
}
for (let i = 0; i < 20; i++) {
  trees.push({ x: rng() * 100, y: rng() * 100, r: 0.5 + rng() * 0.8 });
}
for (let i = 0; i < 3; i++) {
  waterBodies.push({ x: rng() * 100, y: rng() * 100, rx: 4 + rng() * 6, ry: 2 + rng() * 4 });
}

// Road grid
const roads = [];
for (let i = 0; i < 8; i++) {
  roads.push({ x1: 0, y1: 12 + i * 12, x2: 100, y2: 10 + i * 12 + rng() * 4 });
  roads.push({ x1: 10 + i * 12, y1: 0, x2: 8 + i * 12 + rng() * 4, y2: 100 });
}

function pct(val, dim) { return val / 100 * dim; }

function getCurvePoints(waypoints) {
  const pts = waypoints.map(w => ({ x: pct(w.x, W), y: pct(w.y, H) }));
  const result = [];
  const steps = 300;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[Math.min(pts.length - 1, i + 1)];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const segSteps = Math.floor(steps / (pts.length - 1));
    for (let t = 0; t < segSteps; t++) {
      const s = t / segSteps;
      const s2 = s * s, s3 = s2 * s;
      const x = 0.5 * ((2*p1.x) + (-p0.x+p2.x)*s + (2*p0.x-5*p1.x+4*p2.x-p3.x)*s2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*s3);
      const y = 0.5 * ((2*p1.y) + (-p0.y+p2.y)*s + (2*p0.y-5*p1.y+4*p2.y-p3.y)*s2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*s3);
      result.push({ x, y });
    }
  }
  result.push({ x: pct(pts[pts.length - 1].x, 1) * W / W * W, y: pct(pts[pts.length - 1].y, 1) * H / H * H });
  // Fix last point
  const last = waypoints[waypoints.length - 1];
  result[result.length - 1] = { x: pct(last.x, W), y: pct(last.y, H) };
  return result;
}

function drawMap() {
  // Grid
  ctx.strokeStyle = colors.grid;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 100; i += 5) {
    ctx.beginPath();
    ctx.moveTo(pct(i, W), 0);
    ctx.lineTo(pct(i, W), H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, pct(i, H));
    ctx.lineTo(W, pct(i, H));
    ctx.stroke();
  }

  // Water
  ctx.fillStyle = colors.water;
  waterBodies.forEach(w => {
    ctx.beginPath();
    ctx.ellipse(pct(w.x, W), pct(w.y, H), pct(w.rx, W), pct(w.ry, H), 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // Roads
  ctx.strokeStyle = colors.road;
  ctx.lineWidth = Math.max(2, W * 0.004);
  roads.forEach(r => {
    ctx.beginPath();
    ctx.moveTo(pct(r.x1, W), pct(r.y1, H));
    ctx.lineTo(pct(r.x2, W), pct(r.y2, H));
    ctx.stroke();
  });

  // Trees
  trees.forEach(t => {
    ctx.fillStyle = colors.tree;
    ctx.beginPath();
    ctx.arc(pct(t.x, W), pct(t.y, H), pct(t.r, Math.min(W, H)), 0, Math.PI * 2);
    ctx.fill();
  });

  // Buildings
  buildings.forEach(b => {
    ctx.save();
    ctx.translate(pct(b.x, W), pct(b.y, H));
    ctx.rotate(b.rotation);
    ctx.fillStyle = colors.building;
    ctx.strokeStyle = colors.buildingStroke;
    ctx.lineWidth = 1;
    const bw = pct(b.w, W), bh = pct(b.h, H);
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
    ctx.restore();
  });
}

function drawRoute(progress) {
  const curvePoints = getCurvePoints(CONFIG.waypoints);
  const drawCount = Math.floor(progress * curvePoints.length);
  if (drawCount < 2) return;

  // Route shadow
  ctx.beginPath();
  ctx.moveTo(curvePoints[0].x, curvePoints[0].y);
  for (let i = 1; i < drawCount; i++) {
    ctx.lineTo(curvePoints[i].x, curvePoints[i].y);
  }
  ctx.strokeStyle = CONFIG.routeColor + '30';
  ctx.lineWidth = Math.max(8, W * 0.012);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Route line
  ctx.beginPath();
  ctx.moveTo(curvePoints[0].x, curvePoints[0].y);
  for (let i = 1; i < drawCount; i++) {
    ctx.lineTo(curvePoints[i].x, curvePoints[i].y);
  }
  ctx.strokeStyle = CONFIG.routeColor;
  ctx.lineWidth = Math.max(3, W * 0.005);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dashed overlay
  ctx.setLineDash([W * 0.008, W * 0.006]);
  ctx.beginPath();
  ctx.moveTo(curvePoints[0].x, curvePoints[0].y);
  for (let i = 1; i < drawCount; i++) {
    ctx.lineTo(curvePoints[i].x, curvePoints[i].y);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = Math.max(1, W * 0.002);
  ctx.stroke();
  ctx.setLineDash([]);

  return curvePoints[Math.min(drawCount - 1, curvePoints.length - 1)];
}

function drawWaypoints(progress) {
  CONFIG.waypoints.forEach((wp, i) => {
    const wpProgress = i / (CONFIG.waypoints.length - 1);
    if (progress < wpProgress) return;

    const x = pct(wp.x, W);
    const y = pct(wp.y, H);
    const appear = Math.min(1, (progress - wpProgress) * 8);

    // Outer ring pulse
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.003 + i);
    ctx.beginPath();
    ctx.arc(x, y, (W * 0.012 + pulse * W * 0.004) * appear, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.routeColor + '20';
    ctx.fill();

    // Waypoint dot
    ctx.beginPath();
    ctx.arc(x, y, W * 0.008 * appear, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 || i === CONFIG.waypoints.length - 1 ? CONFIG.vehicleColor : CONFIG.routeColor;
    ctx.fill();

    // Inner dot
    ctx.beginPath();
    ctx.arc(x, y, W * 0.004 * appear, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  });
}

function drawVehicle(pos, progress) {
  if (!pos || progress < 0.02) return;

  const pulse = 0.8 + 0.2 * Math.sin(performance.now() * 0.005);
  const size = W * 0.01;

  // Vehicle glow
  const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, size * 3);
  grad.addColorStop(0, CONFIG.vehicleColor + '40');
  grad.addColorStop(1, CONFIG.vehicleColor + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(pos.x - size * 3, pos.y - size * 3, size * 6, size * 6);

  // Vehicle body
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, size * pulse, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.vehicleColor;
  ctx.shadowColor = CONFIG.vehicleColor;
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Inner white dot
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, size * 0.4 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

function createLabels() {
  document.querySelectorAll('.waypoint-label').forEach(el => el.remove());
  labels.length = 0;

  CONFIG.waypoints.forEach((wp, i) => {
    const el = document.createElement('div');
    el.className = 'waypoint-label';
    el.textContent = wp.label;
    el.style.color = colors.text;
    el.style.background = colors.labelBg;
    el.style.border = `1px solid ${colors.labelBorder}`;
    el.style.boxShadow = isDark ? '0 4px 20px rgba(0,0,0,0.4)' : '0 4px 20px rgba(0,0,0,0.1)';
    el.style.left = `${wp.x}%`;
    el.style.top = `${wp.y - 6}%`;
    el.style.transform = 'translateX(-50%) translateY(8px) scale(0.9)';
    document.querySelector('.map-container').appendChild(el);
    labels.push(el);
  });
}

function setupUI() {
  const titleBar = document.getElementById('titleBar');
  const distBadge = document.getElementById('distBadge');
  const legend = document.getElementById('legend');

  titleBar.style.color = colors.text;
  distBadge.style.background = colors.labelBg;
  distBadge.style.color = colors.text;
  distBadge.style.border = `1px solid ${colors.labelBorder}`;

  // Calculate total distance
  let totalDist = 0;
  for (let i = 1; i < CONFIG.waypoints.length; i++) {
    const dx = CONFIG.waypoints[i].x - CONFIG.waypoints[i - 1].x;
    const dy = CONFIG.waypoints[i].y - CONFIG.waypoints[i - 1].y;
    totalDist += Math.sqrt(dx * dx + dy * dy);
  }
  distBadge.innerHTML = `${Math.round(totalDist * 0.3)} km`;

  legend.style.color = colors.text;
  legend.innerHTML = `
    <div class="legend-item"><div class="legend-dot" style="background:${CONFIG.routeColor}"></div> Route</div>
    <div class="legend-item"><div class="legend-dot" style="background:${CONFIG.vehicleColor}"></div> Vehicle</div>
    <div class="legend-item"><div class="legend-dot" style="background:${colors.building}; border:1px solid ${colors.buildingStroke}"></div> Buildings</div>
  `;
}

function showUI(show) {
  const titleBar = document.getElementById('titleBar');
  const distBadge = document.getElementById('distBadge');
  const legend = document.getElementById('legend');

  if (show) {
    setTimeout(() => titleBar.classList.add('visible'), 200);
    setTimeout(() => distBadge.classList.add('visible'), 500);
    setTimeout(() => legend.classList.add('visible'), 700);
  } else {
    titleBar.classList.remove('visible');
    distBadge.classList.remove('visible');
    legend.classList.remove('visible');
  }
}

function showLabels(routeProgress) {
  labels.forEach((el, i) => {
    const wpProgress = i / (CONFIG.waypoints.length - 1);
    if (routeProgress >= wpProgress + 0.02) {
      el.classList.add('visible');
      el.style.transform = 'translateX(-50%) translateY(0) scale(1)';
    }
  });
}

function hideLabels() {
  labels.forEach(el => {
    el.classList.remove('visible');
    el.style.transform = 'translateX(-50%) translateY(8px) scale(0.9)';
  });
}

let routeProgress = 0;
let phase = 'intro'; // intro, draw, hold, exit

function animate(time) {
  const elapsed = time - cycleStart;
  const dur = CONFIG.cycleDuration;

  ctx.clearRect(0, 0, W, H);
  drawMap();

  // Phase timing
  const drawEnd = dur * 0.55;
  const holdEnd = dur * 0.8;
  const exitEnd = dur * 0.95;

  if (elapsed < drawEnd) {
    // Drawing phase
    routeProgress = Math.min(1, elapsed / drawEnd);
    const ease = 1 - Math.pow(1 - routeProgress, 2);
    const vehiclePos = drawRoute(ease);
    drawWaypoints(ease);
    drawVehicle(vehiclePos, ease);
    showLabels(ease);
  } else if (elapsed < holdEnd) {
    // Hold phase - full route visible, vehicle pulses at end
    drawRoute(1);
    drawWaypoints(1);
    const lastWp = CONFIG.waypoints[CONFIG.waypoints.length - 1];
    drawVehicle({ x: pct(lastWp.x, W), y: pct(lastWp.y, H) }, 1);
    showLabels(1);
  } else if (elapsed < exitEnd) {
    // Exit phase - fade out
    const exitProgress = (elapsed - holdEnd) / (exitEnd - holdEnd);
    ctx.globalAlpha = 1 - exitProgress;
    drawRoute(1);
    drawWaypoints(1);
    const lastWp = CONFIG.waypoints[CONFIG.waypoints.length - 1];
    drawVehicle({ x: pct(lastWp.x, W), y: pct(lastWp.y, H) }, 1);
    ctx.globalAlpha = 1;
    if (exitProgress > 0.3) {
      hideLabels();
      showUI(false);
    }
  } else {
    // Reset
    hideLabels();
    showUI(false);
    cycleStart = time + 500;
    routeProgress = 0;
    setTimeout(() => {
      createLabels();
      showUI(true);
    }, 600);
  }

  animFrame = requestAnimationFrame(animate);
}

// Init
setupUI();
createLabels();
showUI(true);
cycleStart = performance.now();
animFrame = requestAnimationFrame(animate);
</script>
</body>
</html>

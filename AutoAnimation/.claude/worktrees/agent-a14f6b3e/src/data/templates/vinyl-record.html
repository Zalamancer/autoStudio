<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyl Record Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1410; font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === EDITABLE CONFIG ===
const CONFIG = {
  songTitle: 'Midnight Reverie',
  artistName: 'The Velvet Echoes',
  albumLabel: 'GOLDEN GROOVE RECORDS',
  rotationSpeed: 33.3,
  accentColor: '#d4a04a',
  bgColor: '#1a1410',
  woodColor: '#3d2b1f',
  brassColor: '#c9a84c',
  cycleDuration: 10000
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, time = 0, cycleStart = 0;
let recordAngle = 0;
let tonearmAngle = -25;
let tonearmTarget = 12;
let particles = [];
let vuLeft = 0, vuRight = 0;
let vuTargetL = 0, vuTargetR = 0;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function lerp(a, b, t) { return a + (b - a) * t; }

function initParticles() {
  particles = [];
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 0.5 + Math.random() * 2,
      speedX: (Math.random() - 0.5) * 0.3,
      speedY: -0.1 - Math.random() * 0.4,
      opacity: 0.1 + Math.random() * 0.3,
      wobble: Math.random() * Math.PI * 2
    });
  }
}

function reset() {
  time = 0;
  cycleStart = performance.now();
  recordAngle = 0;
  tonearmAngle = -25;
  tonearmTarget = 12;
  vuLeft = 0;
  vuRight = 0;
  initParticles();
}

function drawWoodBase() {
  const wc = hexToRgb(CONFIG.woodColor);
  // Main wood surface
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, `rgb(${wc.r + 15},${wc.g + 10},${wc.b + 5})`);
  grad.addColorStop(0.5, `rgb(${wc.r},${wc.g},${wc.b})`);
  grad.addColorStop(1, `rgb(${wc.r - 10},${wc.g - 8},${wc.b - 5})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Wood grain lines
  ctx.strokeStyle = `rgba(${wc.r - 20},${wc.g - 15},${wc.b - 10},0.15)`;
  ctx.lineWidth = 1;
  for (let i = 0; i < 40; i++) {
    const y = (i / 40) * H + Math.sin(i * 0.5) * 20;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x < W; x += 20) {
      ctx.lineTo(x, y + Math.sin(x * 0.003 + i) * 8);
    }
    ctx.stroke();
  }

  // Subtle vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.8);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function drawTurntablePlatter() {
  const cx = W * 0.42;
  const cy = H * 0.52;
  const plateR = Math.min(W, H) * 0.32;

  // Platter shadow
  const shadow = ctx.createRadialGradient(cx + 8, cy + 8, plateR * 0.8, cx + 8, cy + 8, plateR * 1.1);
  shadow.addColorStop(0, 'rgba(0,0,0,0.3)');
  shadow.addColorStop(1, 'transparent');
  ctx.fillStyle = shadow;
  ctx.beginPath();
  ctx.arc(cx + 8, cy + 8, plateR * 1.1, 0, Math.PI * 2);
  ctx.fill();

  // Metal platter rim
  const bc = hexToRgb(CONFIG.brassColor);
  ctx.strokeStyle = `rgba(${bc.r},${bc.g},${bc.b},0.3)`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, plateR + 5, 0, Math.PI * 2);
  ctx.stroke();

  return { cx, cy, plateR };
}

function drawRecord(cx, cy, plateR) {
  const recordR = plateR * 0.95;
  const labelR = recordR * 0.28;
  const ac = hexToRgb(CONFIG.accentColor);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(recordAngle);

  // Vinyl body
  const vinylGrad = ctx.createRadialGradient(0, 0, labelR, 0, 0, recordR);
  vinylGrad.addColorStop(0, '#1a1a1a');
  vinylGrad.addColorStop(0.3, '#111111');
  vinylGrad.addColorStop(0.6, '#0d0d0d');
  vinylGrad.addColorStop(1, '#080808');
  ctx.fillStyle = vinylGrad;
  ctx.beginPath();
  ctx.arc(0, 0, recordR, 0, Math.PI * 2);
  ctx.fill();

  // Grooves (concentric circles)
  for (let r = labelR + 5; r < recordR - 5; r += 2.5) {
    const grooveAlpha = 0.03 + Math.sin(r * 0.15 + time * 2) * 0.015;
    ctx.strokeStyle = `rgba(200,200,200,${grooveAlpha})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Light reflection on vinyl
  const reflectGrad = ctx.createLinearGradient(-recordR, -recordR * 0.5, recordR, recordR * 0.5);
  reflectGrad.addColorStop(0, 'transparent');
  reflectGrad.addColorStop(0.4, 'rgba(255,255,255,0.02)');
  reflectGrad.addColorStop(0.5, 'rgba(255,255,255,0.06)');
  reflectGrad.addColorStop(0.6, 'rgba(255,255,255,0.02)');
  reflectGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = reflectGrad;
  ctx.beginPath();
  ctx.arc(0, 0, recordR, 0, Math.PI * 2);
  ctx.fill();

  // Record label
  const labelGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, labelR);
  labelGrad.addColorStop(0, `rgba(${ac.r + 40},${ac.g + 30},${ac.b + 20},1)`);
  labelGrad.addColorStop(0.7, `rgba(${ac.r},${ac.g},${ac.b},1)`);
  labelGrad.addColorStop(1, `rgba(${ac.r - 30},${ac.g - 20},${ac.b - 10},1)`);
  ctx.fillStyle = labelGrad;
  ctx.beginPath();
  ctx.arc(0, 0, labelR, 0, Math.PI * 2);
  ctx.fill();

  // Label text
  ctx.fillStyle = 'rgba(30,20,10,0.9)';
  ctx.font = `bold ${Math.round(labelR * 0.22)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(CONFIG.songTitle, 0, -labelR * 0.2);

  ctx.font = `${Math.round(labelR * 0.14)}px Georgia`;
  ctx.fillStyle = 'rgba(30,20,10,0.7)';
  ctx.fillText(CONFIG.artistName, 0, labelR * 0.05);

  ctx.font = `${Math.round(labelR * 0.09)}px Georgia`;
  ctx.fillStyle = 'rgba(30,20,10,0.5)';
  ctx.fillText(CONFIG.albumLabel, 0, labelR * 0.3);

  // Center hole
  ctx.fillStyle = '#1a1410';
  ctx.beginPath();
  ctx.arc(0, 0, labelR * 0.06, 0, Math.PI * 2);
  ctx.fill();

  // Spindle highlight
  const spindleGrad = ctx.createRadialGradient(-1, -1, 0, 0, 0, labelR * 0.06);
  spindleGrad.addColorStop(0, 'rgba(200,180,140,0.5)');
  spindleGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = spindleGrad;
  ctx.beginPath();
  ctx.arc(0, 0, labelR * 0.06, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawTonearm(cx, cy, plateR) {
  const bc = hexToRgb(CONFIG.brassColor);
  const pivotX = cx + plateR * 0.85;
  const pivotY = cy - plateR * 0.7;
  const armLength = plateR * 1.1;

  // Animate tonearm
  tonearmAngle = lerp(tonearmAngle, tonearmTarget, 0.02);

  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.rotate(tonearmAngle * Math.PI / 180);

  // Arm shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(3, 3);
  ctx.lineTo(-armLength * 0.95 + 3, armLength * 0.3 + 3);
  ctx.stroke();

  // Main arm
  const armGrad = ctx.createLinearGradient(0, 0, -armLength, armLength * 0.3);
  armGrad.addColorStop(0, `rgb(${bc.r},${bc.g},${bc.b})`);
  armGrad.addColorStop(0.5, `rgb(${bc.r + 30},${bc.g + 20},${bc.b + 10})`);
  armGrad.addColorStop(1, `rgb(${bc.r - 20},${bc.g - 15},${bc.b - 10})`);
  ctx.strokeStyle = armGrad;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-armLength * 0.95, armLength * 0.3);
  ctx.stroke();

  // Headshell
  ctx.strokeStyle = `rgb(${bc.r - 10},${bc.g - 8},${bc.b - 5})`;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-armLength * 0.92, armLength * 0.28);
  ctx.lineTo(-armLength * 1.02, armLength * 0.34);
  ctx.stroke();

  // Cartridge
  ctx.fillStyle = '#222';
  ctx.fillRect(-armLength * 1.02 - 3, armLength * 0.33, 8, 12);

  // Pivot base
  ctx.restore();
  ctx.fillStyle = `rgb(${bc.r},${bc.g},${bc.b})`;
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 12, 0, Math.PI * 2);
  ctx.fill();

  // Pivot highlight
  const pivotGrad = ctx.createRadialGradient(pivotX - 3, pivotY - 3, 0, pivotX, pivotY, 12);
  pivotGrad.addColorStop(0, `rgba(${bc.r + 60},${bc.g + 40},${bc.b + 20},0.8)`);
  pivotGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = pivotGrad;
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 12, 0, Math.PI * 2);
  ctx.fill();
}

function drawVUMeters() {
  const ac = hexToRgb(CONFIG.accentColor);
  const meterW = W * 0.08;
  const meterH = H * 0.22;
  const mx = W * 0.86;
  const my = H * 0.35;
  const gap = meterW * 1.4;

  // Update VU targets
  if (Math.random() < 0.1) {
    vuTargetL = 0.3 + Math.random() * 0.6;
    vuTargetR = 0.3 + Math.random() * 0.6;
  }
  vuLeft = lerp(vuLeft, vuTargetL, 0.08);
  vuRight = lerp(vuRight, vuTargetR, 0.08);

  [vuLeft, vuRight].forEach((level, i) => {
    const x = mx + i * gap;

    // Meter background
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x, my, meterW, meterH);
    ctx.strokeStyle = `rgba(${ac.r},${ac.g},${ac.b},0.3)`;
    ctx.lineWidth = 1;
    ctx.strokeRect(x, my, meterW, meterH);

    // Segments
    const segCount = 15;
    const segH = (meterH - 10) / segCount;
    for (let s = 0; s < segCount; s++) {
      const segY = my + meterH - 5 - (s + 1) * segH;
      const filled = s / segCount < level;
      let color;
      if (s >= segCount * 0.8) color = filled ? 'rgba(255,50,50,0.9)' : 'rgba(255,50,50,0.1)';
      else if (s >= segCount * 0.6) color = filled ? `rgba(${ac.r},${ac.g},${ac.b},0.9)` : `rgba(${ac.r},${ac.g},${ac.b},0.1)`;
      else color = filled ? 'rgba(100,200,100,0.8)' : 'rgba(100,200,100,0.08)';
      ctx.fillStyle = color;
      ctx.fillRect(x + 3, segY, meterW - 6, segH - 2);
    }

    // Label
    ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.6)`;
    ctx.font = `bold ${Math.round(H * 0.012)}px Courier New`;
    ctx.textAlign = 'center';
    ctx.fillText(i === 0 ? 'L' : 'R', x + meterW / 2, my + meterH + 15);
  });

  // VU label
  ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.5)`;
  ctx.font = `${Math.round(H * 0.014)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('VU', mx + gap / 2 + meterW / 2, my - 10);
}

function drawParticles(dt) {
  particles.forEach(p => {
    p.x += p.speedX + Math.sin(p.wobble + time) * 0.2;
    p.y += p.speedY;
    p.wobble += 0.01;

    if (p.y < -10) {
      p.y = H + 10;
      p.x = Math.random() * W;
    }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    ctx.fillStyle = `rgba(255,240,200,${p.opacity})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawWarmGlow() {
  // Warm ambient light from top-left
  const glow = ctx.createRadialGradient(W * 0.2, H * 0.15, 0, W * 0.2, H * 0.15, H * 0.6);
  glow.addColorStop(0, 'rgba(255,200,100,0.05)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
}

function drawNowPlaying() {
  const ac = hexToRgb(CONFIG.accentColor);
  const npX = W * 0.82;
  const npY = H * 0.72;

  ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.4)`;
  ctx.font = `${Math.round(H * 0.012)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText('NOW PLAYING', npX + W * 0.06, npY);

  ctx.fillStyle = `rgba(255,245,230,0.8)`;
  ctx.font = `bold ${Math.round(H * 0.02)}px Georgia`;
  ctx.fillText(CONFIG.songTitle, npX + W * 0.06, npY + H * 0.035);

  ctx.fillStyle = `rgba(255,245,230,0.5)`;
  ctx.font = `italic ${Math.round(H * 0.015)}px Georgia`;
  ctx.fillText(CONFIG.artistName, npX + W * 0.06, npY + H * 0.065);

  // Playback progress bar
  const barW = W * 0.12;
  const barX = npX;
  const barY = npY + H * 0.09;
  const progress = (time % 10) / 10;

  ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.15)`;
  ctx.fillRect(barX, barY, barW, 3);
  ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.6)`;
  ctx.fillRect(barX, barY, barW * progress, 3);

  // Time
  const elapsed = Math.floor(time % 240);
  const mins = Math.floor(elapsed / 60).toString().padStart(1, '0');
  const secs = (elapsed % 60).toString().padStart(2, '0');
  ctx.fillStyle = `rgba(${ac.r},${ac.g},${ac.b},0.4)`;
  ctx.font = `${Math.round(H * 0.011)}px Courier New`;
  ctx.textAlign = 'left';
  ctx.fillText(mins + ':' + secs, barX, barY + 16);
  ctx.textAlign = 'right';
  ctx.fillText('3:42', barX + barW, barY + 16);
}

let lastTime = 0;
function render(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  time += dt * 0.001;

  if (timestamp - cycleStart > CONFIG.cycleDuration) {
    reset();
    lastTime = timestamp;
  }

  recordAngle += (CONFIG.rotationSpeed / 60) * dt * 0.001 * Math.PI * 2;

  drawWoodBase();
  const { cx, cy, plateR } = drawTurntablePlatter();
  drawRecord(cx, cy, plateR);
  drawTonearm(cx, cy, plateR);
  drawVUMeters();
  drawParticles(dt);
  drawWarmGlow();
  drawNowPlaying();

  requestAnimationFrame(render);
}

function runCycle() {
  reset();
  requestAnimationFrame(render);
}

resize();
window.addEventListener('resize', resize);

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'configUpdate' && e.data.config) {
    Object.assign(CONFIG, e.data.config);
    reset();
  }
});

runCycle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceless Countdown</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; }
.stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8%; }
.title { font-size: 4vmin; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.3em; margin-bottom: 4vmin; opacity: 0; animation: fadeIn 0.6s 0.2s forwards; }
.number-display { font-size: 20vmin; font-weight: 900; color: var(--accent); line-height: 1; opacity: 0; transform: scale(2); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); font-variant-numeric: tabular-nums; }
.number-display.show { opacity: 1; transform: scale(1); }
.number-display.exit { opacity: 0; transform: scale(0.5); }
.item-text { font-size: 4vmin; font-weight: 600; color: rgba(255,255,255,0.8); text-align: center; margin-top: 3vmin; max-width: 80%; opacity: 0; transform: translateY(20px); transition: all 0.4s 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
.item-text.show { opacity: 1; transform: translateY(0); }
.glow { position: absolute; width: 30vmin; height: 30vmin; border-radius: 50%; background: var(--accent); opacity: 0.05; filter: blur(80px); animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.05; } 50% { transform: scale(1.5); opacity: 0.08; } }
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="stage">
  <div class="title" id="title"></div>
  <div class="number-display" id="number"></div>
  <div class="item-text" id="text"></div>
</div>
<script>
const CONFIG = {
  title: 'Countdown',
  startNumber: 5,
  items: [
    { number: 5, text: 'Fifth place goes to...' },
    { number: 4, text: 'Coming in at number four...' },
    { number: 3, text: 'The bronze medal...' },
    { number: 2, text: 'Runner up...' },
    { number: 1, text: 'And the winner is...' }
  ],
  bgColor: '#0a0a0a',
  accentColor: '#f59e0b',
  intervalMs: 3000
};

document.body.style.background = CONFIG.bgColor;
document.documentElement.style.setProperty('--accent', CONFIG.accentColor);

const titleEl = document.getElementById('title');
const numberEl = document.getElementById('number');
const textEl = document.getElementById('text');
let currentIndex = -1;

titleEl.textContent = CONFIG.title;

function showItem() {
  numberEl.classList.remove('show');
  numberEl.classList.add('exit');
  textEl.classList.remove('show');

  setTimeout(() => {
    currentIndex++;
    if (currentIndex >= CONFIG.items.length) currentIndex = 0;
    const item = CONFIG.items[currentIndex];
    numberEl.textContent = item.number;
    numberEl.classList.remove('exit');
    void numberEl.offsetWidth;
    numberEl.classList.add('show');
    textEl.textContent = item.text;
    textEl.classList.add('show');
  }, 300);
}

setTimeout(showItem, 600);
setInterval(showItem, CONFIG.intervalMs);

window.addEventListener('message', (e) => {
  if (e.data?.type === 'CONFIG_UPDATE') {
    Object.assign(CONFIG, e.data.payload);
    document.body.style.background = CONFIG.bgColor;
    document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
    titleEl.textContent = CONFIG.title;
  }
});
</script>
</body>
</html>

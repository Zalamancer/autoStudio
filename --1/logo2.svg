<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="grad2v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Rounded square with "PA" monogram -->
  <rect x="10" y="12" width="82" height="82" rx="18" fill="#0a0a0a" stroke="url(#grad2)" stroke-width="2.5"/>
  
  <!-- Stylized P -->
  <path d="M30 32 L30 72 M30 32 L48 32 C58 32 58 48 48 48 L30 48" 
        fill="none" stroke="url(#grad2v)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Stylized A with no crossbar, just a peak -->
  <path d="M52 72 L64 32 L76 72" 
        fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A crossbar as animated dash -->
  <line x1="56" y1="55" x2="72" y2="55" stroke="#22c55e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Motion wave under icon -->
  <path d="M14 80 Q28 74 42 80 Q56 86 70 80 Q84 74 88 78" 
        fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Text -->
  <g transform="translate(110, 0)">
    <text x="0" y="52" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Pro
    </text>
    <text x="55" y="52" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="300" fill="url(#grad2)" letter-spacing="-0.5">
      Animate
    </text>
    
    <!-- Animated bar accent -->
    <rect x="0" y="62" width="60" height="3" rx="1.5" fill="url(#grad2)" opacity="0.6"/>
    
    <text x="0" y="82" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#22c55e" letter-spacing="4" opacity="0.6">
      STUDIO
    </text>
  </g>
</svg>
